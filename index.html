<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-name-copy {background:#373c53;color:#fff}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:10px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-text {white-space:normal;overflow-wrap:anywhere;line-height:1.55;margin:0}
.perk-text strong {display:block;margin-bottom:2px}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>ポコチャ プロフィール・ファミリー文例集</h1>
<p class="note">架空の40人のプロフィールとファミリー説明の文例です。紹介文と7段階のコア特典は「ファミリー説明をコピー」でまとめて、ポコチャのファミリー説明欄へ貼り付けられます。</p>
<p class="note">プロフィールの名前と本文を編集すると、このブラウザーに保存されます。アイコンを押すと拡大します。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、メニューに写真へ保存する項目があれば選んでください。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "片耳で歌枠、もう片耳で「次は〜」。帰りの電車から、るいです。平成のJ-POPはサビならすぐ口ずさめるのに、曲名が出てくるのは二曲あと。歌詞の速い曲は、家でゆっくり聴き直します。\n\n休みの日は、枠で教えてもらった曲を聴きながらひと駅ぶん歩きます。「二番のサビ前、ベース聴いてみて」。その一言で、何度も聴いた曲なのに、低い音だけが妙に近くに聞こえてきます。\n\nこの前は終電で、向かいの人がエアギター。指先を見ながら曲名を考えていたら降りる駅に着きました。ホームで発車メロディーが流れて、つい「これ昔めっちゃ聴いた」。よく考えたら、こっちの曲名も知らないんですけどね。", "片耳プレイリスト", "帰り道に聴きたい曲を一人一曲、持ち寄りませんか。「発車してすぐ」「降りるひと駅前」。聴いてほしいところまで聞けたら、次の帰り道で試します。", [["1K", "車掌風のお祝い", "配信で名前を呼び、車内放送風に「今日もおつかれさま」。"], ["5K", "帰り道のひと言", "今夜の帰り道に添えたいひと言を、名前入りでファミリーに投稿します。"], ["10K", "名前入りきっぷアイコン", "表示名を入れた乗車券風のアイコンをお渡しします。"], ["20K", "帰り道の選曲リクエスト", "今の気分に合う一曲と、その聴きどころを配信で紹介します。"], ["30K", "色を選べる終電セット", "選んだ色で、名前入りきっぷアイコンとスマホ壁紙を作ります。"], ["40K", "名前を呼ぶ車内放送", "配信で名前を呼び、今月の思い出とおすすめの二曲をご案内します。"], ["48K", "帰り道ラジオの主役", "好きな曲調で約5分のDJ風お礼番組。名前入りきっぷアイコンと番組表画像も。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」までが挨拶。じょーれんって呼んでね。昔のJ-POPは、歌詞があやしくてもサビだけは参加。パクチーは香りが苦手で、そっとお皿の端へ。\n\n週末は友だちとバドミントン。ダブルスで声がそろいました。「任せた！」。そのまま二人で、真ん中に落ちるシャトルを見送りました。次は先に「取るよ」って言います。\n\n枠で「初見さん、こんばんは！」と迎えたら、「昨日あんたと一時間しゃべったよ」。次の日は向こうから「はじめまして」。僕も「昨日ぶりですね」と返せました。コートでもこれくらいきれいに返したい。", "また来た初見席", "「初見です」も「昨日ぶりです」も大歓迎。話の途中なら「今、なんの話？」で入ってきてね。会長がじゃんけんで決まった話？ 初めて聞く顔をしてくれたら、また話すよ。", [["1K", "昨日ぶりのお祝い", "配信で名前を呼んで、「初見さん、今日もありがとう！」。"], ["5K", "おかえりメッセージ", "印象に残ったやり取りを添えて、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "自称初見の名札アイコン", "表示名と「初見・認定○回目」が入った名札風アイコンです。"], ["20K", "肩書きのお披露目", "「初見のベテラン」など、候補から選んだ肩書きを配信で発表します。"], ["30K", "来店認定カードとアイコン", "選んだ肩書きと表示名を直筆風カードに。色違いのアイコンと一緒にファミリーへ。"], ["40K", "いつもの席のお礼トーク", "配信で名前を呼び、今月の名コメントや助けてもらった場面を振り返ります。"], ["48K", "歓迎総会の主役", "選んだ話題で約5分の雑談とお礼。名前入り会長名札アイコンと認定カード画像も。"]]],
  ["あずき＊", "あずきです🍡 粒あんのおまんじゅうが好き。気に入った柄の包み紙は、しわを伸ばして缶にしまいます。冬はフィギュアスケートを観ながら、着氷まで息を止めがち。自分が長距離を走るときは、タイムを測られるだけで落ち着きません。\n\n祖母におまんじゅうを二つもらって、片方を祖母に差し出したら「それは明日のあんたの分よ」。包みの端を見たら、小さな字で「明日」。\n\n今も二日に分けるつもりで買います。初日に箱を二度開けたら、二度目は「味見の続き」。自分で包みに「明日」と書いても、おばあちゃんの字ほどは効きません。", "粒あんと夜のお茶", "夜のお茶とおやつを片手に、歌と雑談を🍡 粒あんのおすすめも、「包み紙で選んだ」話も聞きたいです。お茶をいれ直したら、話の途中からどうぞ。", [["1K", "湯のみでお祝い", "配信で名前を呼んで、「お茶、あなたの分もいれました」。"], ["5K", "明日の包み紙メッセージ", "明日読み返してもうれしいお礼を、名前入りでファミリーに投稿します。"], ["10K", "和菓子の包み紙アイコン", "小豆色の包み紙を思わせる、表示名入りのアイコンです。"], ["20K", "おやつ選びリクエスト", "あんこ派？ きなこ派？ 好みに合わせて和菓子とお茶の組み合わせを配信で一つ紹介します。"], ["30K", "おそろいの甘味柄", "選んだ和菓子の柄で、名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなたのお茶会トーク", "似合いそうな和菓子を一つ選び、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "あずきの甘味お礼会", "好きなおやつで約5分のお茶会。名前入りアイコンと、ひと言入りの甘味カード画像も。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 好きなのは、ほうじ茶と焼き芋。二つ並べて写真を撮るつもりが、カメラを構える頃には湯のみが空いてます。\n\n二種類のほうじ茶をいれて、友人と飲み比べた日。二杯目に「こっちのほうが香りが上品」。急須を見たら、どっちも同じほうから注いでました。今度こそ別の茶葉を。友人が「焼き芋の香りがする」と言った瞬間、僕の手には割ったばかりの焼き芋。\n\n次は急須に印をつけます。枠で返事が途切れたら、だいたい台所で洗い物の泡を流してます。", "ほうじ茶の間", "いれたてのお茶と、合わせたお菓子の話をする席です🍵 ひと口目と少し冷めてから、どちらが好きですか？ 聞くだけの人にも、湯のみを一つ。", [["1K", "ほうじ茶の間のお祝い", "配信で名前を呼んで、「湯のみ、置いときました」。"], ["5K", "お茶うけのひと言", "今のあなたに贈りたいひと言を、名前と一緒にファミリーに書きます。"], ["10K", "ほうじ茶ラベルアイコン", "茶葉の袋のラベルを元にした、表示名入りのアイコンです。"], ["20K", "お茶うけリクエスト", "好きなお菓子に合うお茶を選び、理由も添えて配信で紹介します。"], ["30K", "色が選べる茶席セット", "茶色か生成りで、名前入りアイコンと湯のみ柄のスマホ壁紙を作ります。"], ["40K", "ほうじ茶のいれ方とお礼", "配信でおすすめのいれ方を一つ紹介し、名前を呼んで今月のお礼を伝えます。"], ["48K", "あなたのお茶会コーナー", "好きなお茶を聞いて約5分の飲み比べトーク。名前入りアイコンと茶席カード画像も。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。思わず立ち上がる、ぼるとです⚡ 選手の自伝で気になるのは、逆転打の直前、打席へ向かう選手が何を考えていたか。自分のジョギングは三分で歩き始めます。ペース配分は研究中です。\n\n中継前にお茶をいれて、スマホの速報はオフ。ある日、隣から「うわっ！」。「結果言うな！」と声をかけたら「足つっただけ！」。数秒遅れの中継を観て今度は僕が叫ぶと、隣から「ああ、それはもう見た」。\n\n試合後はマイクを持つふりで隣の部屋へ。「あの一瞬、何があったんですか？」「足の指がつりました」。うちで一番早かった速報です。", "九回裏の応援席", "逆転打の前に、粘って塁に出た選手の話まで⚡ 野球を観ていない日も、あなたの今日の好プレーを聞かせてください。途中から来たら「今何回？」で話に入れます。", [["1K", "応援席からナイスコア", "配信で名前を呼び、「ナイスコア！」と拍手でお祝いします。"], ["5K", "今月の好プレー便り", "助けてもらったことや場を盛り上げた一言を、名前とともにファミリーで紹介します。"], ["10K", "背番号入り選手アイコン", "名前と好きな背番号が入った、選手カード風のアイコンをお渡しします。"], ["20K", "あなたの一打を実況", "最近のうれしかった出来事を、配信で逆転打のように実況します。"], ["30K", "チームカラーの応援セット", "好きな色で、名前と背番号入りのアイコンとスマホ壁紙を作ります。"], ["40K", "九回裏のお礼インタビュー", "配信で今月の好プレーにお礼を伝え、あなたからの質問に一つ答えます。"], ["48K", "ヒーロー特番の主役", "お好きな話題で約5分の野球風お祝いトーク。名前入り選手アイコンとヒーローカード画像もお渡しします。"]]],
  ["たっぷりん🍮", "ぷりんです🍮 プリンは固め、カラメルは苦め。昭和歌謡が流れたら、たたみかけのタオルも膝に置いたまま。手順の多いレシピは読んでるうちにお腹がすくので、新作のおやつは買う派です。\n\nプリンを食べていた晩、ずっと探していた曲が偶然流れました。それ以来、お守り代わりに大事な日の前夜は冷蔵庫に一個。「カラメルは最後の楽しみ」と言いながら、三口目にはもう全部混ぜてます。\n\n一度、家族に内緒で隠したら私も場所を忘れました。家族が野菜室で見つけたプリンの奥には、別の家族のシュークリーム。「ここ、高級デザート売り場？」と聞かれました。あれから野菜室を開けると、野菜より先に奥をのぞきます。", "固めプリン同好会", "固め派もとろとろ派も、同じテーブルへ🍮 カラメルは何口目で混ぜますか？ 今日のおやつも教えてください。昭和歌謡が流れたら、おやつ談義は一曲ぶんお休みです。", [["1K", "スプーンを掲げてお祝い", "配信でお名前を呼び、プリンのスプーンを掲げてお祝いします。"], ["5K", "カラメルを添えたお礼", "「カラメルは最後まで」など、ぷりんらしい一言を添えたお礼をファミリーに投稿します。"], ["10K", "名前入りプリンアイコン", "プリンのラベルに表示名を入れたアイコンをお渡しします。"], ["20K", "おやつトークのリクエスト", "好きなプリンか懐メロの思い出を聞いて、配信で話題にします。"], ["30K", "固め・とろとろ画像セット", "固めかとろとろを選べます。名前入りアイコンとおやつ柄の壁紙を作ります。"], ["40K", "プリン部のお礼放送", "配信であなたが選んだおやつを話題にし、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作プリンのお祝い回", "選んだ味で新作を考える約5分のお礼トーク。名前入りラベルアイコンと直筆風コメント画像もお渡しします。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、指が弦をすべる音まで聞こえる弾き語りを聴きます。早押しクイズは少し苦手。私の頭に答えが浮かぶ頃には、もう次の問題です。\n\n映画の日は月柄のハンカチを持って出かけます。帰ったら、いちばん耳に残った音を一つメモ。「廊下の靴音」と読み返すだけで、遠ざかる背中が浮かぶことがあります。\n\nある挿入曲の題名が分からず、鼻歌を録って友人に送ったら「途中から別の曲になってる」。翌日、友人は二曲とも教えてくれました。聴き比べるとすぐ別の曲だと分かるのに、鼻歌の中ではあんなに自然につながっていました。", "余韻のひと席", "夜の弾き語りや、映画を観たあとも耳に残っている音の話を。靴音や台詞の前の静けさを、結末は伏せて聞かせてください。話す気分じゃない日も、一曲ぶん座っていきませんか。", [["1K", "月の席からお祝い", "配信で名前を呼び、「今夜もこの席で、ありがとう」とお祝いします。"], ["5K", "余韻を残す一行", "心に残った会話を添えて、あなた宛てのお礼をファミリーに書きます。"], ["10K", "月明かりの壁紙", "月と映画館の灯りを描いた、表示名入りのスマホ壁紙をお渡しします。"], ["20K", "余韻のお題リクエスト", "好きな音や曲調を聞き、あなたに合いそうな映画か曲を配信で一つ紹介します。"], ["30K", "夜色のポスターセット", "選んだ夜の色で、名前入りアイコンと映画ポスター風の壁紙を作ります。"], ["40K", "眠る前のお礼朗読", "今月の思い出を短いお礼の手紙にして、名前を添えて配信で読みます。"], ["48K", "今夜の上映後トーク", "あなたのお題で約5分の雑談とお礼の朗読。名前入りアイコンとポスター画像もお渡しします。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは。あてなです。\n\n伊沢拓司さんが出るクイズ番組を観ると、答えが出たところで「どこで気づいたんだろう？」と考えます。謎解きには青いペンを一本。通った道から地図を描くのが得意です。ヒントは、どうにも行き詰まったらお願いします。\n\n脱出ゲームで椅子の位置に印を付け、立ったまま「この椅子、絶対怪しい」と書いていたら、係の人に「どうぞ座って休んでくださいね」と声をかけられました。青いペンで「座ってよし」と追記。推理は外れましたが、地図には休める場所が増えました。", "仮説だらけの作戦室", "作戦会議は「実際に何を見た？」から。外れた推理も、そう考えた理由が手がかりになるかも。聞く係も大歓迎。答えが浮かんだら、言う前に「ヒント要る？」と聞いてね。", [["1K", "作戦室からのお祝い", "配信で名前を呼び、「新メンバー発見！」とコア達成をお祝いします。"], ["5K", "作戦メモのお礼", "印象に残ったコメントを一つ選び、ファミリーの作戦メモにお礼とともに残します。"], ["10K", "名前入り探偵アイコン", "虫眼鏡と青いペンを描いた、表示名入りの探偵風アイコンをお渡しします。"], ["20K", "なぞなぞのお題リクエスト", "選んだ題材で短いオリジナルのなぞなぞを作り、配信で一問出します。"], ["30K", "色を選べる探偵セット", "好きな色で、名前入りアイコンと探偵証風の画像を作ります。"], ["40K", "あなたのお題で謎解き二問", "選んだ題材で配信中に二問出題し、最後に名前を呼んでお礼を伝えます。"], ["48K", "名探偵の出番", "好きなテーマで約5分の謎解きとお礼。名前入りアイコンと解決記念カード画像もお渡しします。"]]],
  ["からあげレモン🍋", "からレモです🍋 冷蔵庫を開けても献立が浮かばないと、枠で「今日、何食べた？」。でも、手書きのお品書きに唐揚げを見つけたら注文は即決です。\n\n友人と大皿を囲んだ日。「レモンかけていい？」と聞くまでは満点でした。絞った汁がまさかの自分の目に。洗って戻ると、友人は「めっちゃ酸っぱい」と言いながら唐揚げをもう一個取っていました。それ以来、レモンを絞るのは自分の小皿だけ。\n\n合いの手の多い曲が流れると、つい声を出して人の話を聞き逃します。曲が終わったら、そこだけもう一度。「で、唐揚げがおいしいお店、どこだっけ？」", "ひと絞り食堂", "いらっしゃい、ひと絞り食堂です🍋 商店街で出会った定食や、冷めてもおいしいお弁当のおかずの話をしましょう。初めての方も、唐揚げの衣はカリカリ派か、しっとり派か、ひと言どうぞ。", [["1K", "レモンひと絞りのお祝い", "配信で名前を呼んで「拍手、レモンひと絞り分！」。"], ["5K", "今日のおかずメモ", "今月のお礼を、表示名入りの食堂メモ風にファミリーへ投稿します。"], ["10K", "レモン食堂の名札アイコン", "唐揚げとレモンのお品書き風アイコンに、表示名を入れてお渡しします。"], ["20K", "今夜の副菜リクエスト", "好きなおかずを一品聞き、それに合う副菜を配信で提案します。"], ["30K", "ひと絞りの画像セット", "レモン色か唐揚げ色を選んで、名前入りアイコンと手書き風のお品書き画像を作ります。"], ["40K", "好きなおかずで献立会議", "好きなおかず二品から献立を考え、配信で名前を呼んでお礼を伝えます。"], ["48K", "ひと絞り食堂の主役席", "選んだ料理で約5分の献立会議。お礼に名前入りアイコンとお品書きカード画像もお渡しします。"]]],
  ["kohaku.", "こはくです。休日は開店したばかりの喫茶店へ。ピアノに混じってカップを置く音がするのが好きです。後ろに列ができると焦るので、席でゆっくり選べる店が落ち着きます。メニューは毎回ひと通り読みます。今日も厚切りトーストです。\n\n本のカバーは包装紙で折ります。配信で耳に残った曲名を付箋に書き、カバーの折り返しにぺたり。久しぶりに本を開くと、物語より先にあの晩の歌が浮かびます。\n\nある朝、本を忘れたら店主に「今日はお持ちじゃないんですね」と言われました。窓辺で読んでいたのを、覚えてくれていたんだ。翌週は本を持って、いつもの席へ。トーストを置いた店主が本にちらりと目をやって、目が合って、二人で少し笑いました。", "付箋のある喫茶室", "好きな本の一場面に音楽を流せるなら、何を選びますか。「このページにだけ付箋を貼った」なんて話から、ゆっくり聞かせてください。今日は聴くだけという方も、どうぞ窓側へ。", [["1K", "窓側の席でお祝い", "配信で名前を呼んで「いつもの窓側、空いています」。"], ["5K", "こはくの一行しおり", "あなたのひと言で心に残ったものを、お礼と一緒にファミリーへ書き残します。"], ["10K", "付箋柄の名前入りアイコン", "付箋と厚切りトーストを描いたアイコンに、表示名を入れます。"], ["20K", "読書のおともリクエスト", "好みに合わせて、次に読む本か、読書中に聴く曲を一つ紹介します。"], ["30K", "選べる喫茶のしおりセット", "好きな色で、名前入りアイコンと、ひと言を添えたしおり画像を作ります。"], ["40K", "あなた宛ての喫茶朗読", "今月のお礼を喫茶店の小話にして、配信で名前を添えて読みます。"], ["48K", "あなたのお題で喫茶朗読会", "選んだお題で約5分の朗読とお礼。名前入りアイコンと、小話の一節を載せたしおり画像も作ります。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかって呼んでね。サンドウィッチマンのコントは、話がかみ合ってないのに二人とも真顔なところが好き。早口言葉は一回挑んで、すぐ見学に回りました。\n\nしりとりでは一番乗りで「みかん」。即終了。「仕切り直し！」の声に、今度は「だいこん」。枠主に「ぴか、拍手係できる？」と聞かれ、誰より早く👏。これなら「ん」で終わらない！\n\n大喜利で好きな答えを見つけたら、すぐ「それ好き！」。自分の答えは真顔で言ってるところまで浮かぶ文にしたくて、下書きが長引きます。送信する前に「次のお題です！」。とりあえず、やっぱり👏。", "ぴかっと早押し部", "こんぴかー！⚡ 早押し、しりとり、ときどき大喜利。初参加なら、好きなボケに👏を一つ。問題が出る前に押しちゃったら、ぴかと一緒に「もう一回お願いします！」", [["1K", "こんぴかのお祝い", "配信で名前を呼んで「小さめ落雷！」。勢いよく拍手します。"], ["5K", "一文字だけ変な祝辞", "名前はばっちり、祝辞だけ一文字わざと間違えて、ファミリーにお礼を書きます。"], ["10K", "稲妻の早押しアイコン", "稲妻と早押しボタンを描いた、表示名入りのアイコン画像です。"], ["20K", "クイズ・大喜利のお題リクエスト", "選んだお題で早押しクイズか大喜利を、配信で一問出します。"], ["30K", "拍手係の記念セット", "稲妻の色を選べます。名前入りアイコンと「拍手係」の賞状画像を作ります。"], ["40K", "ぴかの一人二役大喜利", "ぴかが配信で、あなたのお題の出題と回答を両方担当します。名前を呼んでお礼も伝えます。"], ["48K", "あなた杯・大喜利特番", "選んだお題で約5分の大喜利。名前入りの優勝賞状画像と早押しアイコンも付きます。"]]],
  ["しりゅう_08", "しりゅうです。アニメを見返すときは、脇役を一人決めて目で追います。一度目は黙っていたように見えた人が、よく見ると何か言いかけていたり。対戦ゲームでも相手の動きに見入って、反応が一拍遅れます。\n\n釣りには、初めてアジを三尾釣った帽子で験担ぎ。一尾も釣れなかった日、魚屋でアジを二尾買って帰ると、袋をのぞいた家族に「今日すごいじゃん」。レシートを渡すと「そりゃ大きさも揃うわけだ」。\n\n今は帽子を取るたび「海と魚屋、今日はどっち？」と聞かれます。まず海です。あの日の釣果ノートには、ちゃんとゼロと書いてあります。", "夜釣りとアニメ棚", "釣れなかった夜の海も、アニメを見返してやっと気づいた脇役の表情も、ここでは話の種です。釣りをしない人も、次に観たい一作があればぜひ。結末を話す前には、ひと声かけましょう。", [["1K", "夜釣りの大物コール", "配信で名前を呼んで「今日の大物、来ました」とお祝いします。"], ["5K", "釣果メモのお礼", "印象に残ったやり取りを一つ選び、お礼を釣果メモ風にファミリーへ書きます。"], ["10K", "釣り帽子の記念アイコン", "いつもの釣り帽子を描いた、表示名入りのアイコンを作ります。"], ["20K", "今夜のアニメリクエスト", "好みの雰囲気を聞き、アニメを一作紹介します。結末は伏せます。"], ["30K", "夜の波色アイコンセット", "夜の波の色を選んで、名前入りアイコンと釣果カード画像をお渡しします。"], ["40K", "脇役の見どころトーク", "好きなアニメを一作聞き、結末を伏せて脇役の見どころを配信で話します。"], ["48K", "夜釣りとアニメの主役回", "釣りかアニメを選んで約5分のお礼トーク。名前入りアイコンと釣果図鑑風カード画像も作ります。"]]],
  ["たいやき＠しっぽ派", "たいやきでも、しっぽでも🐟 商店街は看板を一枚ずつ眺めながら歩きます。バスケを観ていても、ついコートの端でパスを待つ選手に目が行きます。たい焼きも、まず端から。\n\n辛いものは途中から辛さしか分からなくなるので、辛党の友だちとは甘味屋で合流します。この前「たい焼き、半分こしよ」と言われて手を出したら、しっぽの先だけ。「好きって言ってたでしょ」。うん、あんこの入った胴体も好きです。\n\n今はあんことカスタードを一匹ずつ。同じ袋に入れてもらうので、どっちを引いたかはひと口目のお楽しみ。誰かと半分こする日は、私が真ん中で割ります。", "しっぽから商店街", "散歩で見つけたお店や、商店街のおやつの話でひと休み🐟 頭派もしっぽ派も、たい焼きに入れてみたい具を教えてね。甘いものはもちろん、おかずになりそうな具も大歓迎。", [["1K", "しっぽからお祝い", "配信で名前を呼び、「今日の一匹、しっぽからどうぞ」とお祝いします。"], ["5K", "しっぽからお礼便", "あなたらしい一言を添え、名前入りのお礼をファミリーに投稿します。"], ["10K", "たい焼き袋のアイコン", "たい焼きの紙袋風アイコンに表示名を入れます。"], ["20K", "たい焼きの具リクエスト", "食べてみたい具を聞いて、配信で架空の新作に名前をつけます。"], ["30K", "あんこ色かカスタード色", "選んだ色で、名前入りアイコンとたい焼き柄の壁紙を作ります。"], ["40K", "おやつで商店街トーク", "配信で好きなおやつの話をして、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作たい焼きのお披露目", "選んだ具で約5分の配信トークとお礼。名前入りアイコンと手書き風のメニュー画像も。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでもどうぞ。夜はひと駅ぶん遠回り。自分の足音が聞こえるくらいの音量で、歌や雑談を聴きます。散歩の帰りは街灯や看板が目印。歩数が気になると好きな場所で立ち止まれないので、数を競うより自分のペースで歩きます。\n\n用事が片づかなかった夜。帰り道に聴いていた配信で、枠主さんが歌い終えて「みんな、帰ったら寝ようね」とひと言。私も続きは明日にして布団に入りました。翌朝、昨夜は手もつけられなかったことを一つ、片づけられました。\n\n話題に迷ったら「そっち、月見える？」。「こっちは曇り」と返ってくる日も、その人が見上げた空を少し想像してから、また歩きます。", "月夜の遠回り", "帰り道や寝る前に、夜の歌と、今日ふと目に留まった色の話を。外を歩いている間は聴くだけでどうぞ。返事は家に着いてからで大丈夫です。", [["1K", "遠回りのおかえりコール", "配信で名前を呼び、「おかえり、今夜も遠回り？」とお祝いします。"], ["5K", "月夜のお礼メッセージ", "今日の空をひと言で描き、名前入りのお礼と一緒にファミリーに投稿します。"], ["10K", "街灯と三日月のアイコン", "街灯と細い月を描いたアイコンに表示名を入れます。"], ["20K", "帰り道の選曲リクエスト", "気分や好きな夜景を聞き、夜道に似合う一曲を配信で紹介します。"], ["30K", "夜空の色を選べるセット", "選んだ色で、名前入りアイコンと月明かりのスマホ壁紙を作ります。"], ["40K", "夜景のお礼朗読", "好きな夜景を題材にお礼を書き、名前を添えて配信で読みます。"], ["48K", "遠回りの月夜便", "選んだ夜景で約5分の配信トークとお礼の朗読。名前入りアイコンと、朗読の一文を載せた壁紙も。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間に枠をのぞきます。急に黙ったら、たぶん両手がふさがってます。手書きの看板は、値段を書き直した跡まで見る派。バレー観戦の点数も手書きです。時間制限つきのパズルは、残り秒数が目に入ると答えが飛びます。\n\nある日、枠で「おかえり」を「おかわり」と打ちました。それから顔を出すたび「大盛りにする？」。こっちも「漬物つけて」と乗っていたら、初見さんが「おすすめは？」。そこで全員、黙りました。\n\n次は「舞茸の天ぷらです」と答えます。看板に品名までは書きました。値段はまだ空欄なので、「いくら？」と聞かれたら、また黙ります。", "おかわり休憩所", "作業の合間に一息🍄 ゲームの進み具合も、送ってから気づいた誤字も、休憩中の話の種です。「おかえり」のつもりで「おかわり」と打っても、ちゃんと「おかえり」って返します。", [["1K", "コア達成をセーブ", "配信で名前を呼び、「コア達成、セーブしました！」とお祝いします。"], ["5K", "おかわりの一行お礼", "覚えているコメントを一つ添え、名前入りのお礼をファミリーに投稿します。"], ["10K", "セーブ画面風アイコン", "ゲームのセーブ画面をまねたアイコンに表示名を入れます。"], ["20K", "今日のおかわり任務", "選んだ雑談のお題で、配信中に短い「休憩クエスト」に挑みます。"], ["30K", "任務名入りの画像セット", "好きなゲーム風の配色で、名前と任務名入りのアイコンとセーブ伝票の画像を作ります。"], ["40K", "あなた発の休憩ステージ", "選んだお題で配信のミニ企画を一つ。クリア後に名前を呼んでお礼を伝えます。"], ["48K", "クリア記念のおかわり回", "配信で約5分のゲーム風企画とお礼。名前入りアイコンと、任務名入りのクリアカード画像も。"]]],
  ["こうめい＊", "こうめいです。歴史小説で気になるのは、負けた側が何を考えていたか。ボードゲームの説明書には、遊んだ日を書いた付箋を一枚ずつ。早押しクイズでは、出題者の狙いを考えているうちに、隣から正解が聞こえます。\n\n小学生とボードゲームをして、次の作戦を得意げに話していたら、相手が盤面を指して「僕の番だよね。ここに置けば勝ちだよ」。私が「それを確認してたんだよ」と強がると、「じゃあ僕の番も確認して」。きれいに負けました。\n\nそれから座右の銘は「作戦より先に盤面を」。お風呂が先か、ごはんが先か。うちの作戦会議も、最近はごはんが冷める前に決着をつけます。", "一手先の円卓", "ボードゲームも歴史も、「自分ならどうする？」から始まる円卓です。駒の動かし方を聞くところからでもどうぞ。私の作戦解説が長くなったら「そろそろ次の手」と止めてください。", [["1K", "円卓にお迎え", "配信で名前を呼び、「本日の作戦会議へようこそ」とお祝いします。"], ["5K", "軍師の一行お礼", "今月の気配りや面白かった一言を取り上げ、名前入りのお礼をファミリーに投稿します。"], ["10K", "盤面と駒のアイコン", "盤面と駒を描いたアイコンに表示名を入れます。"], ["20K", "軍師のお題リクエスト", "日常の迷いごとを一つ聞き、配信で軍師になりきって作戦を立てます。"], ["30K", "選べる陣営カラー", "好きな色で、名前入りアイコンと作戦図風の記念カード画像を作ります。"], ["40K", "円卓の好プレー表彰", "助けてもらった場面や心に残った一言を振り返り、配信であなたの一手をたたえます。"], ["48K", "円卓の作戦会議", "日常の相談か歴史のお題で約5分の作戦会議を配信します。お礼と、名前入りアイコン・軍師の感謝状画像も。"]]],
  ["れん_07", "れんです。ライブハウスでは後ろの端が定位置。肩がぶつからない場所で間奏のギターを追いかけます。冬は開演までホットコーヒーで手を温めます。\n\n奥田民生さんの曲でも、歌声の合間についギターを追います。中古CD屋で気になった曲は、曲名をメモして帰り道に聴きます。\n\nある晩、ボーカルが客席にマイクを向けると、前の列から歌声が広がりました。気づけば後ろの僕も合唱に参加。客席を見渡していたボーカルが歌に戻りそびれて、マイクを持ったまま照れ笑いしました。今もあの曲を聴くと、あの日の客席の声が重なって聞こえる気がします。\n\n枠では挨拶のあと、たいてい静かです。誰かが「ここの間奏、いいよね」と言うまでは。", "ギターが鳴る後列", "ライブ帰りに書き留めるなら、どの場面ですか？ 後ろの列まで届いたギターも、客席が息をのんだ一瞬も聞きたいです。家でつい巻き戻してしまう間奏の話も大歓迎。", [["1K", "後列まで届くお祝い", "配信で名前を呼び、ライブのMC風に「後ろまで届いてます！」とお祝いします。"], ["5K", "ライブ半券の一行", "今月の思い出を一つ添え、名前入りのお礼をファミリーに投稿します。"], ["10K", "ライブ半券アイコン", "ギターとライブ半券を描いた、表示名入りアイコンをお渡しします。"], ["20K", "聴きたい音リクエスト", "好きな楽器に合わせて一曲選び、聴きどころを配信で紹介します。"], ["30K", "ライブカラーの記念セット", "お好きな差し色で、名前入りアイコンと、おすすめ二曲を載せた半券画像を作ります。"], ["40K", "アンコールのお礼MC", "選んだ音楽のお題で終演後のMC風に話し、名前を呼んで今月のお礼を伝えます。"], ["48K", "アンコールのミニトーク", "選曲テーマをリクエストできる約5分のお礼トーク。名前入りアイコンとセットリスト画像もお渡しします。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」。食べ物の話になると質問が二つ出る、じにです＊ 日村勇紀さんがおいしそうに食べていると、つい何か買いに出たくなります。一軒でお腹を満たして、あとは近所をぶらぶら。気になった場所には地図のピンを立てます。\n\nある日、「絶対また行く」とメモしたピンを頼りに、たこ焼きを食べに行きました。店に入ると、メニューには定食ばかり。せっかくなので定食を食べて外へ出たら、角の先からソースのいい香り。ピンを立てていたのは、たこ焼き屋へ曲がる目印の店でした。\n\n結局、角を曲がってたこ焼きも買いました。ピンを直すつもりが、今は二つとも「絶対また行く」。定食、おいしかったんです。", "よりみち地図帳", "帰り道につい買うおやつや、旅先でふらりと入った店の話を集めています。いつもの注文や、地元ならではの食べ方も教えてください。店名が思い出せない日は、次に頼みたい一品だけでも＊", [["1K", "寄り道先からお祝い", "配信で名前を呼び、「本日の寄り道、いらっしゃい」とお迎えします。"], ["5K", "地図ピンのお礼メモ", "会話のおいしそうな一言を添え、名前入りのお礼をファミリーに投稿します。"], ["10K", "おやつと地図ピンのアイコン", "好きなおやつと地図ピンを描いた、表示名入りアイコンをお渡しします。"], ["20K", "おやつ会議リクエスト", "甘いものかしょっぱいものかを聞いて、寄り道のおやつを一つおすすめします。"], ["30K", "寄り道地図の画像セット", "好きなおやつを描いた名前入りアイコンと、地図帳風のスマホ壁紙を作ります。"], ["40K", "ご当地おやつのお礼トーク", "好きなご当地おやつを一品聞きます。配信では、その話と今月のお礼をお届けします。"], ["48K", "商店街の寄り道特番", "好きなおやつで約5分の寄り道トーク。名前入りアイコンと架空の寄り道マップ画像もお渡しします。"]]],
  ["港レター_", "みなとです。港町に泊まった朝は、焼きたての塩パンを探しに行きます。速い曲を聴くとつい急ぎ足になるので、散歩はイヤホンを外して。波の音に店のシャッターが開く音が混じると、街が起き出したのが分かります。\n\n旅先から自分にはがきを出したことがあります。「明日の朝、港で塩パンを買う」。家のポストに届いたのは、温かい紙袋を手に港を歩いた数日後。はがきの中では、私はまだ塩パンを買う前です。「おいしかったよ」と返事を書きたくなりました。\n\n次のはがきには「家族にも塩パンを買う」。帰りの電車で紙袋を開けずにいられますように。みなとより。", "海辺のポスト", "「朝七時、踏切の近くで焼きたてのパンの匂い」。散歩でふと気づいた音や匂いを集めるポストです。旅先からも、いつもの通勤路からもどうぞ。覚えていたら時刻も添えてください。", [["1K", "港からお祝いの声", "配信で名前を呼び、「今日も港に寄ってくれてありがとう」とお祝いします。"], ["5K", "海辺の一行はがき", "思い出に残った話を添え、名前入りの短いお礼をファミリーに投稿します。"], ["10K", "海辺の消印アイコン", "海辺の消印をあしらった、表示名入りアイコンをお渡しします。"], ["20K", "はがきの題材リクエスト", "好きな音や匂いを一つ、短い旅の便りに取り入れて配信で読みます。"], ["30K", "港色の絵はがきセット", "朝焼けか夕暮れを選べます。名前入りアイコンと海辺の絵はがき画像を作ります。"], ["40K", "あなた宛ての港レター朗読", "選んだ風景をもとにお礼の便りを書き、名前を添えて配信で読みます。"], ["48K", "海辺のポスト特番", "選んだ旅のテーマで約5分の雑談と朗読。名前入り消印アイコンと、便りを載せた絵はがき画像も作ります。"]]],
  ["けんし♪", "イントロは分かる。サビも歌える。曲名だけ出てこない。けんしです♪ 秋のドライブでは休憩で車を停め、塩むすびを食べながら帰りの一曲を選びます。登場人物が多い歴史小説は、名前が出るたび「あれ、誰だっけ」と前のページに戻ります。\n\nカラオケで珍しく曲名まで思い出して、さっそく予約。流れてきたのは知らないメロディー。同じ題名の別の曲でした。「これ歌える」と友人がマイクを取ったので、僕は横でタンバリン。「僕の歌詞は全部シャンシャンです！」\n\n次のカラオケで、友人が「あれ入れてね」。僕の入れ間違いで、友人の十八番が一曲増えました。最近は曲名を思い出しても歌手名まで確認します。タンバリンは先に取ります。", "サビから歌う会", "サビから一緒に歌いたくなる曲、ありますか♪ カラオケの十八番でも、ドライブでつい口ずさむ歌でも。合いの手を入れたい曲も、静かに何度も聴き返す曲も、まずは一曲聞かせてください。", [["1K", "シャンシャンでお祝い", "配信で名前を呼び、口タンバリンの「シャンシャン！」でお祝いします。"], ["5K", "十八番のお礼メモ", "教えてくれた音楽の好みを一つ添え、名前入りのお礼をファミリーに投稿します。"], ["10K", "タンバリンと音符のアイコン", "タンバリンと音符を描いた、表示名入りアイコンをお渡しします。"], ["20K", "帰りの一曲リクエスト", "ドライブの気分を聞いて、帰り道に似合う一曲を配信で紹介します。"], ["30K", "ラジオ番組表の画像セット", "お好きな色で、名前入りアイコンと、二曲を載せたラジオ風の番組表画像を作ります。"], ["40K", "ラジオ風のお礼DJ", "好きなジャンルから二曲を選び、配信でDJ風に紹介してお礼を伝えます。"], ["48K", "夜ラジオの主役ゲスト", "選んだテーマで約5分のラジオ風トーク。名前入りアイコンと記念の番組表画像もお渡しします。"]]],
  ["かんうどん🍜", "かんです🍜 いつもの一杯は、かけうどんにちくわ天、ねぎ多め。郷土料理の本で見慣れない具を見つけると、その土地まで食べに行きたくなります。初めての店では、まずだしをひと口。\n\n白いシャツにカレーうどんの汁を飛ばした翌週、黒いシャツで同じ店へ。「前と同じので？」に、いつものかけだと思ってうなずきました。出てきたのは、湯気の立つカレーうどん。店主が僕のシャツを見て「今日は黒でよかったね」。覚えてたんだ、そこまで。\n\nうどんの写真にはふだん、だしと具のメモだけ。カレーうどんにはもう一つ、「次も黒」と書いてあります。", "ねぎ多めの席", "かけ、ねぎ多め。うどん一杯で話が尽きない席です🍜 麺の太さ、だしの色、地元の天ぷら。あなたの定番も聞かせてください。「うちは卵を落とすよ」のひと言で、明日のお昼が決まるかも。", [["1K", "ねぎ多めでお祝い", "配信で名前を呼び、「ねぎ多めで一杯！」と拍手します。"], ["5K", "店主から本日のひと言", "今日のあなたへ、店主になりきってファミリーに短いお礼を書きます。"], ["10K", "うどん札のアイコン", "丼とちくわ天を描いた、表示名入りのアイコン画像を作ります。"], ["20K", "薬味のおすすめ", "好きな具を聞いて、合う薬味を配信で一つ提案します。"], ["30K", "のれん色のお品書きセット", "選んだのれんの色で、名前入りアイコンとスマホ用のお品書き画像を作ります。"], ["40K", "あなた好みの一杯", "好みのだしと具で一杯考えて配信で紹介し、名前を呼んでお礼を伝えます。"], ["48K", "うどん屋の主役メニュー", "配信で約5分、好きな具の献立トークとお礼。名前入りアイコンと、考えた一杯のメニュー画像を作ります。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話が好きです。数式が続く天文学の本は、そっと閉じます。晴れた休日は、星が見えた時刻と方角をメモ。流星を待つ三十秒は、時計を見ずに数えます。\n\nある晩、友人と同時に「あっ」。私が「見つけた？」と聞くと、友人も「うん！」。同じ流星を見たと思ったら、帰り道で友人が缶を掲げて「探してたぶどうジュース、あそこの自販機にあったよ」。次は「何を？」まで聞きます。\n\n行けるなら、月か深海か。私は月で、できれば窓側です。着いたら方角までメモする気でいます。月で方角を調べる方法は、まだ知りません。", "土星の窓側席", "夜空に何か見えたら窓側へ◎ 「コンビニの上に明るい星があった」も立派な観測報告です。窓の外を眺められるなら、月と深海、どっちへ行ってみたいですか？", [["1K", "窓側へお迎え", "配信で名前を呼び、「今夜の窓側、空いてます」とお祝いします。"], ["5K", "星便りでひと言", "今月の思い出を一つ添え、お礼の星便りをファミリーに書きます。"], ["10K", "土星の輪のアイコン", "土星の輪に表示名を入れたアイコン画像をお渡しします。"], ["20K", "空のお題リクエスト", "気になる空の色や天体を聞いて、配信で話します。"], ["30K", "選べる星空セット", "土星か月を選んで、名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "月・深海のお礼ガイド", "月か深海を選んでください。配信で案内役になり、お礼を伝えます。"], ["48K", "月か深海へ出発", "配信で約5分、選んだ行き先の旅トーク。名前入りアイコンと架空の旅のしおり画像をお渡しします。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。洗いたての綿の毛布が好きで、配信をのぞくのもだいたい布団から。「おやすみ」を打つ前に寝落ちして、翌朝いきなり「おはよう」の日もあります。\n\nお正月は、お雑煮のひと口目に「今年もよく食べて、よく眠れますように」。甘い黒豆は少し苦手ですが、お餅には目がありません。この前は一つ食べ終えたら、だしの底にもう二つ。家の人が、子どもの頃の「一つじゃ足りない」を覚えてくれていました。\n\nうれしくて三つとも完食。寝る前までお腹いっぱいで、翌朝の「今日も三つ？」には「一つでいい」と即答しました。", "毛布ときなこの部屋", "きなこ餅を食べながらでも、毛布の中からでも、こんばんは。「うちは丸餅」から始まるお雑煮の話が好きです。眠くなったら、続きはまた明日。", [["1K", "毛布の中から小さな拍手", "配信で名前を呼び、目が覚めないくらいの小さな拍手でお祝いします。"], ["5K", "おやすみの一行", "寝る前に読める名前入りのお礼を、ファミリーに一行残します。"], ["10K", "きなこ餅のアイコン", "きなこ餅と毛布の柄で、表示名入りのアイコン画像を作ります。"], ["20K", "冬のお題リクエスト", "お雑煮や冬の寝支度など、選んだお題について配信で話します。"], ["30K", "選べる毛布柄セット", "好きな毛布の色で、名前入りアイコンとひと言付きのスマホ用壁紙を作ります。"], ["40K", "眠る前のお礼トーク", "好きな冬の話題でゆっくり雑談し、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "毛布の中のお礼会", "選んだお題で約5分の配信トークとお礼。名前入りアイコンと、おやすみの言葉を添えた壁紙を作ります。"]]],
  ["いかいかが？", "いかです🦑 水族館では説明板を読む前に、一匹だけ選んでじっと見ます。長編ミステリーでは途中で誰が誰だか分からなくなりますが、水槽なら目で追っている一匹が今日の主役です。\n\nガラス越しにエイに手を振って、友人に「エイ語、習ってます」。水槽の向こうで手を振り返してくれたのは、子どもでした。もう一度振ると、お母さんまで。当のエイは、その間にするっと奥へ。字幕を付けるなら「エイ語の先生、先に帰る」。\n\n配信でも、天気の話がいつの間にか深海まで泳いでいきます。そちらの空模様、いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 岩陰から魚がちらっ。字幕を付けるなら何て書きますか？ 魚の名前が分からなくても、色と動きが分かれば一緒に考えられます。", [["1K", "クラゲ前へお迎え", "配信で名前を呼び、「クラゲ前でひと息、いかがですか」とお祝いします。"], ["5K", "水槽からの一行お礼", "クラゲやエイになりきって、名前を添えた一行のお礼をファミリーに書きます。"], ["10K", "水槽プレート風カード", "好きな水の生き物と表示名を入れた、解説プレート風のカード画像を作ります。"], ["20K", "水槽の字幕リクエスト", "選んだ生き物のしぐさに字幕を考え、配信で読み上げます。"], ["30K", "選べる水槽画像セット", "クラゲかエイを選んで、名前入りアイコンと水槽プレート風カード画像を作ります。"], ["40K", "二匹の水槽ガイド", "好きな生き物を二つ選んでください。配信でガイド風に紹介し、名前を呼んでお礼を伝えます。"], ["48K", "クラゲ前の特別ガイド", "好きな生き物をお題に、配信で約5分の水族館トーク。名前入りアイコンと字幕付き水槽カード画像を作ります。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 温かいマグを両手で包んで、夜のバラードを一曲。倍速にすると歌い出す前の息までせわしなく聞こえるので、いつもの速さで聴きます。\n\n歌枠で感想を書いては消していたら、次の曲が始まりました。結局、送ったのは「さっきの曲、二番に入る前の息づかいが好きでした」の一行。歌い終えた枠主さんが「あそこ、落ち着こうと思って息を吸ったんだ」と拾ってくれました。息ひとつでも、どこを聴いていたか伝わるんですね。\n\n気づけば、お茶はすっかり冷めていました。今夜は、曲が始まる前に一口。", "雪あかりの歌席", "夜の歌を、歌い出す前の息までゆっくり聴く席です❄ 「あの声の入り方が好き」の一言もぜひ。言葉が浮かばなかったら、温かい飲み物を片手に一緒に聴きましょう。", [["1K", "雪あかりの乾杯", "配信で名前を呼んで、温かい飲み物で小さく乾杯します。"], ["5K", "一行のおつかれさま", "ファミリーに、今日のあなたへの「おつかれさま」を一行書きます。"], ["10K", "雪あかりのアイコン", "雪あかりとマグの絵に、表示名を入れたアイコンです。"], ["20K", "夜のバラードリクエスト", "気分に合う一曲を選び、息づかいや声の入り方など、聴きどころを配信で紹介します。"], ["30K", "色が選べる便箋セット", "雪色か灯り色で、名前入りアイコンとお礼を書いた便箋画像をお渡しします。"], ["40K", "あなたへのお礼の手紙", "今月の思い出を添えたお礼の手紙を、配信で名前を呼んで読みます。"], ["48K", "雪あかりの朗読会", "好きな冬景色をお題に約5分、雑談と手紙の朗読を。名前入りアイコンと便箋画像もお渡しします。"]]],
  ["じゃっくん☆", "はーい、参戦します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームと、人のボケに一行足すのが好き。年末は友だちとゲームで遊び納め。来年も笑いたいひと言は、その場でメモします。\n\nこの前、ぐいぐい攻めるキャラを見て「勝った！」と叫んだら、隣から「そっち俺」。画面の端には、負けた自分のキャラ。それ以来、勝ちを叫ぶ前に自分の色を確かめます。\n\n休憩では、苦手なレーズンクッキーを友だちの皿へ。「おっと、ここでクッキーが移籍です！」。移籍先の友だちは、黙って一枚食べました。", "とりあえず参戦部", "冷蔵庫を開けたら実況開始。最後のプリンが消えていたら大喜利です🙌 誰かのボケに一つ足せそうなら、その場で参戦を。「座布団一枚！」係からでもどうぞ。", [["1K", "種目はあとで、まず拍手", "配信で名前を呼んで拍手。「種目はあとで決めます！」"], ["5K", "日常の一行表彰", "最近できた小さなことに競技名を付け、名前を添えてファミリーで表彰します。"], ["10K", "メダル風の表彰カード", "表示名と架空の競技名を入れた、メダル風のカード画像です。"], ["20K", "実況種目のリクエスト", "選んだ日常の出来事を一つ、配信でスポーツ中継風に実況します。"], ["30K", "金か銀の表彰セット", "金か銀を選べます。名前入りアイコンと競技名入りの表彰状画像をお渡しします。"], ["40K", "あなたの二種目実況", "日常の出来事を二つ、配信で実況します。最後は名前を呼んで表彰します。"], ["48K", "決勝特番の主役選手", "選んだお題で約5分、実況と表彰を。名前入りアイコンと大会結果カードの画像も作ります。"]]],
  ["さなだんご。", "さなです。だんごと呼ばれても振り向きます。休みの朝はパン屋さんへ。平野レミさんの料理番組を観た日は台所へ。クッキーはバターの香りが好き。シナモンが強いと、香りだけでお腹いっぱいです。\n\nクッキーを焼きすぎて、友だちに「端がちょっと濃いよ」と渡したら、空っぽのお皿の写真と「次は倍で」が届きました。張り切って二回に分けて焼いたら、二回目の天板だけまたこんがり。袋を分けて「まず一枚、味見しよ。こっちは端っこ好き用ね」。\n\n今は天板を入れるたびにタイマーをセットします。人に渡す分とは別に、私の味見の一枚も忘れず焼きます。", "焼きたてひと皿", "パン屋さんの新作も、家で焼いたおやつも。ひと口目の感想を持ち寄りませんか。いつものクッキーに塩をひとつまみ、なんて工夫も聞きたいです。こんがりした端っこが好きな方、いらっしゃい。", [["1K", "焼きたての味見係へ", "配信で名前を呼んでお祝い。「今日の味見係さん、ありがとう」"], ["5K", "ひと皿のお礼便り", "心に残ったやり取りを一つ添えて、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "パン袋ラベルのアイコン", "パン袋のラベル風に、表示名を入れたアイコンです。"], ["20K", "隠し味リクエスト", "選んだおやつに合う隠し味を、配信で一つ提案します。"], ["30K", "柄が選べるラベルセット", "パン柄かクッキー柄で、名前入りアイコンとオリジナルのラベル画像を作ります。"], ["40K", "あなたの味見トーク", "好きなおやつと食感を聞き、配信でその話をしながら今月のお礼を伝えます。"], ["48K", "あなたの名物おやつ会", "好きな味で約5分のおやつ談義。お礼に、名前入りアイコンと架空のおやつのラベル画像を作ります。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方は洗濯物をたたむ手を止めて、枠で「おつかれ〜」。家事が終わったら、暮らしのエッセイを一篇。季節限定のおやつは、日付を書いたラベルをノートに貼って残します。\n\n甘いゆず味を探して三軒目。袋の大きな「ゆず」に飛びつき、期待してひと口。ゆず胡椒味でした。辛いのが苦手で水を飲んでいたら、家族が隣で甘いゆず味の袋を開けました。同じお店で、袋の文字を最後まで読んで買ったそうです。\n\nノートには二枚のラベルを並べて「探した味」「探してない味」。辛いほうが気に入った家族には「今度はわざと買ってね」と頼まれました。", "ゆず色おつかれ会", "家事の合間に聴きたい歌と、スーパーで見つけたおやつの話をしましょ🍊 来たら「おつかれ〜」の一言から。洗濯物があと一枚でも、好きな曲が来たらそっちを先に聴こ。", [["1K", "夕方のおつかれ拍手", "配信で名前を呼んでお祝い。「片付けはあとで。まず拍手！」"], ["5K", "ひと休みのお礼", "夕方のひと休みに読めるお礼を、ファミリーに一言書きます。"], ["10K", "ゆず色の夕焼けアイコン", "柑橘と夕焼けを描いた、表示名入りのアイコン画像です。"], ["20K", "ひと息の選曲リクエスト", "散歩か家事の休憩かを聞いて、配信でその時間に合う曲を一つ紹介します。"], ["30K", "柑橘色の待ち受けセット", "ゆず色かみかん色で、名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "あなた宛て夕方ニュース", "今月の頑張りを夕方のニュース風に紹介し、配信で名前を呼んでお礼を伝えます。"], ["48K", "おつかれ特番の主役", "好きな話題で約5分のおつかれ特番。名前入りアイコンと「本日の家事終了」の画像もお渡しします。"]]],
  ["のぶにゃがฅ", "のぶでも、にゃがでも。夜の枠にしれっとおりますฅ 武将の手紙は、最後の頼みごとまで読む派。うちの置き手紙もこの調子です。「猫殿におやつは進呈済み。重ねて出されぬよう」。\n\n太鼓の音が苦手で、時代ものを観るときは音量を下げます。ある日、武将が大事な台詞を言いかけたところで、猫殿がテレビの前を横切りました。巻き戻すと、同じ台詞でまたお出まし。三度目には、武将が口を開いた瞬間に、家族みんなの目がテレビの脇へ。\n\n人がテレビの前を通ると、つい「参戦ですか？」。猫殿が通るときは、黙って席を譲ります。", "ねこ殿の書状部屋", "武将の書状で好きな一言や、家でいちばん偉そうな猫の話を持ち寄る、夜更けの評定です。「うちの猫殿は箱から動きません」の一言からどうぞ。猫の話が出た日は、だいたい延長ですฅ", [["1K", "猫殿と座布団を半分こ", "配信で名前を呼び、「座布団は猫殿と半分ずつで」とお祝いします。"], ["5K", "猫殿の一行書状", "猫殿に代わって、名前入りのお礼をファミリーに一行したためます。"], ["10K", "肉球の花押アイコン", "猫殿の肉球をサインにした、表示名入りのアイコン画像です。"], ["20K", "猫殿が授ける二つ名", "好きな猫のしぐさをもとに、配信で武将風の二つ名を一つ考えます。"], ["30K", "色を選べる家紋セット", "好きな色で、名前と二つ名を入れた家紋アイコンと猫殿の書状画像を作ります。"], ["40K", "猫殿のお礼評定", "今月のうれしかったことを配信で振り返り、名前を呼んで猫殿に代わりお礼を伝えます。"], ["48K", "一城任命のお礼会", "約5分のお礼会で、選んだ城名を発表。名前入り家紋アイコンと任命状画像を贈ります。"]]],
  ["ぜうす_", "ぜうす。呼び捨てでどうぞ。コーヒーは深煎り。映画館の照明が落ちて、客席のざわめきがすっと消える瞬間が好きです。半券の裏には、もう一度観たい場面を一つ。登場人物の気持ちを言い切る解説を読むと、「あの間の取り方なら、別の理由もありそう」と考えてしまいます。\n\n帰りの電車で友人と「あの人、最後に何を考えてたんだろう」。話が弾んで、名前が出たのは降りる直前。よく聞けば、別々の人物の話をしてました。次の映画では、話す前に名前を確認。今度は、同じ人物の別々の場面を思い浮かべてました。\n\n座右の銘は「まず、誰の話か」。最近、その下に「あと、どの場面か」が増えました。", "深煎りの上映後", "深煎りを片手に、観終わっても気になる場面の話を。「ほっとした顔」に見えた人も、「何か隠してる顔」に見えた人も、どの仕草でそう思ったか聞かせてください。結末を話すのは、みんなが観てから。", [["1K", "エンドロールでお祝い", "配信で名前を呼び、「今日もエンドロールまでありがとう」とお祝いします。"], ["5K", "深煎りの一行お礼", "心に残った感想を一つ添えて、ファミリーに名前入りのお礼を書きます。"], ["10K", "名前入り半券アイコン", "半券とコーヒーを描いた、表示名入りの映画館風アイコン画像です。"], ["20K", "好みに合う映画一本", "好みのジャンルから映画を一作選び、結末は伏せて配信で紹介します。"], ["30K", "色を選べるエンドカードセット", "好きな差し色で、名前入り半券アイコンとエンドカード風のスマホ壁紙を作ります。"], ["40K", "あなたの編集会議", "選んだ場面の見方を配信で二通り紹介します。結末は伏せ、名前を呼んでお礼を伝えます。"], ["48K", "二重エンドの上映後トーク", "好きな話題で約5分の上映後トーク。名前入りアイコンと二つの題名を載せたタイトル画像を贈ります。"]]],
  ["りさっち＊", "りさっちです☺️ カフェめぐりが好きで、気に入ったカップは底の印まで見ます。もちろん、飲み干してから。飲む前に写真を撮る習慣は三日で断念。三日目の写真には、レシートだけが写っています。\n\nドラマの最終回の日。推しの幸せを願って、友だちといつもの店で一杯。推しが同じだね、と盛り上がった直後に「でも同僚だったら困るよね」。私は場面を一つずつ思い出してかばいました。言い終えてカップを持ち上げたら、コーヒーはすっかり冷めてました。\n\n最終回を観ても、二人の推しは変わりません。あの人と同じ職場になったら、私も隣の席はそっと避けるかも。", "いつものカフェ席", "ドラマの感想とリップの話をするカフェ席です☺️ 「推しにはこの色が似合いそう」から、つい話が弾みます。ドラマを観ていない日は、手元のカップの柄を聞かせてね。", [["1K", "いつもの席でお祝い", "配信で名前を呼び、「いつもの席、空けときました」とお迎えします。"], ["5K", "カップにひと言", "今日の気分に合わせて、名前入りのお礼をファミリーに書きます。"], ["10K", "カップの注文シールアイコン", "カップの注文シールに表示名を入れた、カフェ風のアイコン画像です。"], ["20K", "カフェの話題リクエスト", "ドラマかリップの話を選んでください。配信で好みを聞きながらおしゃべりします。"], ["30K", "好きな色のカップセット", "好きなリップの色を差し色に、名前入りアイコンとカップ柄のスマホ壁紙を作ります。"], ["40K", "あなたに似合う一杯", "好みをもとに架空のドリンクを考え、配信で名前を呼んで紹介し、お礼を伝えます。"], ["48K", "カフェの主役コーナー", "好きな話題で約5分のカフェ風トーク。名前入りアイコンと限定メニュー画像を贈ります。"]]],
  ["ちょぱ丸_", "コンビニまで往復十分。寄り道込みで三十分。ちょぱ丸です。卓球では相手のラケットに見とれて、気づいたときには球が目の前を通り過ぎています。\n\n前に寄った商店街の店へ、友だちを案内したときのこと。「猫がいるところね」と辺りを見て歩くうち、自分が店を通り過ぎました。地図を頼りに引き返し、買い物を済ませたところで店先に猫が。「ピンポーン。目印、ただいま出勤しました」。友だちは「赤いのれんは開店から仕事してたけどね」。次はのれんを目印にします。\n\nアニメで誰かが振り向く瞬間に、低く音が鳴る場面が好きです。グミにまぶした白い粉を砂糖だと思ってひと口。口いっぱいに酸っぱさが広がったあの瞬間は、効果音がなくても忘れません。", "寄り道アニメ部", "「あの音がしてから振り向いたよね」。そんなアニメの小さな発見を持ち寄る部です。推しが多い人は、今日の一人から。商店街のおやつに話が飛んだら、そこも寄り道のうちです。", [["1K", "寄り道先からピンポーン", "配信で名前を呼び、「ピンポーン、寄り道先でお迎えです」とお祝いします。"], ["5K", "猫は不定休メッセージ", "「目印の猫は不定休」を添えて、あなた宛てのお礼をファミリーに投稿します。"], ["10K", "赤いのれんの待ち受け", "赤いのれんと猫を描いた、表示名入りのスマホ壁紙を作ります。"], ["20K", "推しの見どころリクエスト", "好きな作品を聞いて、印象に残った場面や演出を配信で一つ紹介します。"], ["30K", "色を選べる寄り道番組表セット", "好きな色で、名前入りアイコンと寄り道の番組表をイメージしたカード画像を作ります。"], ["40K", "あなたのアニメ外伝トーク", "推し作品か町のおやつを選んで配信で外伝トーク。名前を呼んで今月のお礼を伝えます。"], ["48K", "寄り道特番の主役", "選んだお題で約5分のアニメ風雑談。名前入りアイコンと寄り道マップ画像を贈ります。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 地図に空白が残っていると、扉一枚でも確かめに戻ります。回復薬は決戦まで温存です。\n\n同行者に「そろそろ決戦へ」と言われ、近道を選んだ日のこと。同じ崖の下へ二度落ちました。ようやくたどり着いたボス戦は二分で終了。回復薬は一つも減らず、いちばんの難所は近道でございました。\n\n得意なのは、ありふれた注意書きを決戦の口上に仕立てること。低い声で申し上げます。「足元をご確認くださいませ」。あの崖にも、これが一枚あればよかったのですが。", "決戦前の休憩室", "好きなボス戦の効果音や、なかなか突破できなかった場面を聞かせてください。開かないジャムのふたも立派な難所でございます。わたくしが攻略を考えている間に、お茶をどうぞ。", [["1K", "ご来城のお祝い", "配信でお名前を呼び、「本日もご来城ありがとうございます」とお迎えいたします。"], ["5K", "ラスボスから一行のお礼", "お名前を添えて、丁寧すぎるほどのお礼をファミリーに残します。"], ["10K", "名前入り勇者アイコン", "紋章と橋を描いたアイコンに表示名を入れてお渡しします。"], ["20K", "勇者の称号を授与", "最近できたことにちなんで、配信で勇者の称号を一つお授けします。"], ["30K", "紋章の色が選べるセット", "お好きな色で、名前入りアイコンと称号入りの達成証画像を作ります。"], ["40K", "決戦前のお礼寸劇", "お選びの決めゼリフで勇者とラスボスを演じ、配信でお礼を伝えます。"], ["48K", "あなたの王国の授与式", "お好きなお題で約5分のゲーム風トークと称号発表。名前入りアイコンと感謝状画像もお渡しします。"]]],
  ["simba_", "シンバです。休日は行き先を一つだけ決めて車を出します。運転中は静かな曲を流します。ビッグバンドはにぎやかで、つい耳がそっちに向くので。休憩には、いい景色とたまごサンド。\n\n海へ行った日は、空いていたベンチに二人で座りました。正面に広がるのは駐車場。目当ての海は背もたれの向こうでした。おかしくなって海と愛車を一枚ずつ撮影。帰って写真を見返したら、友だちの笑い声までよみがえったのは駐車場の一枚でした。\n\nいい休憩も旅のうち。動物園でも、ペンギンが目の前を泳いで横切るまで水槽から離れられません。次の場所には、だいたい予定より遅く着きます。", "停車中の見晴らし席", "車を降りて初めて見えた景色や、水槽の前で時間を忘れた話を聞かせてください。遠出しなかった日は、いつもの道で足を止めた場所を一つ。たまごサンドを片手に待ってます。", [["1K", "見晴らしの席で拍手", "配信で名前を呼び、「景色がいいので、ここで拍手」とお祝いします。"], ["5K", "車窓のひと言便り", "今月の会話を一つ選び、名前を添えてファミリーでお礼を伝えます。"], ["10K", "見晴らしの名前入りアイコン", "ペンギンや海辺の絵に表示名を入れたアイコンを作ります。"], ["20K", "次の寄り道リクエスト", "好きな景色を聞いて、立ち寄ってみたい場所を配信で一つ紹介します。"], ["30K", "海か動物園の画像セット", "海か動物園を選んで、名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "あなたとの休憩トーク", "選んでくれた景色からドライブの話を広げ、配信で名前を呼んでお礼を伝えます。"], ["48K", "見晴らしの寄り道特番", "好きな寄り道を聞いて、約5分のドライブトーク。名前入りアイコンと風景カード画像もお渡しします。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白い照明はまぶしいので、机の手元だけ灯します。トーストはバターを塗ったばかりの熱いうちが好き。配信に聞き入った日は、ひと口目から冷めています。\n\n昔のゲームの続きを開きました。最後の城の手前まで来た記憶があるのに、画面に映ったのは最初の村。懐かしくて村を一周し、そのままセーブしました。好きな場所なら、戻ったぶんも進んだうち。\n\nゲームの曲は、流れた場所ごとメモします。あの夜は「最初の村、宿を出てすぐ」。曲名を調べたのは三晩目。それまでは曲を聴きたくなるたびにゲームを立ち上げ、宿を出て村を一周していました。", "夜更けのセーブ地点", "作業中に聴くゲームの曲や、セーブしておきたい景色の話を。「雨がやまない村」「宿屋の明かり」。名前を思い出せなくても、覚えている景色だけで。今夜は耳だけでもどうぞ。", [["1K", "夜更けのコアセーブ", "配信で名前を呼び、「今日のコア、保存しました」とお祝いします。"], ["5K", "セーブ地点の一行お礼", "覚えている作業やゲームの話を一つ添えて、ファミリーにお礼を書きます。"], ["10K", "セーブスロットの名前入りアイコン", "セーブ画面風のアイコンに表示名を入れてお渡しします。"], ["20K", "作業BGMリクエスト", "好きなゲームの風景を聞いて、作業のお供にしたい曲を配信で一つ紹介します。"], ["30K", "選べるセーブ地点セット", "夜の港か雨の村を選んで、名前入りアイコンとゲーム風の壁紙を作ります。"], ["40K", "あなたのゲーム散歩", "好きなゲームの風景を二つ選んでください。配信でその場所を語り、名前を呼んでお礼を伝えます。"], ["48K", "夜更けの最終セーブ会", "選んだ風景を題材に約5分のゲーム雑談。お礼に名前入りアイコンと、風景を描いたセーブカード画像を作ります。"]]],
  ["まさむね_", "休日は城下町の脇道へ。まさむねです。行きの電車では三味線をよく聴きます。人混みを急いで抜けるのは苦手。説明板の前で足を止めて、その町の人から昔の話を一つ聞けたら、遠回りしたかいがあります。\n\n城跡の急坂で、近所の方が「子どもの頃、ここを滑って下りましたよ」。「どうやって止まるんですか」と聞くと、「止まれないから下まで行くんです」。帰りは私も同じ坂を、一歩ずつ。\n\n野球を観た帰りも、点が入る直前の静けさや、隣の席から聞こえた声をよく覚えています。「下まで行くんです」も、帰って忘れないうちに寄り道帳へ。説明板には載らない一行です。", "城下町の寄り道帳", "城下町の路地でも、球場への近道でも、つい足を止めた場所を教えてください。地名を忘れたら「コロッケの匂いがした角」みたいに。匂いだけで、歩いてみたくなります。", [["1K", "城下町へお迎え", "配信で名前を呼び、「ご城下へようこそ」とお祝いします。"], ["5K", "史跡札風のひと言", "心に残った一言を史跡札に見立て、名前とお礼を添えてファミリーに書きます。"], ["10K", "城下町の名前入りアイコン", "門と町並みを描き、表示名を入れたアイコンをお渡しします。"], ["20K", "曲がり角リクエスト", "好きな街の景色を聞いて、歩いて訪ねたい場所を配信で一つ紹介します。"], ["30K", "選べる町並みセット", "路地か球場への道を選んで、名前入りアイコンと寄り道帳風のカード画像を作ります。"], ["40K", "あなた宛て城下町案内", "好きな寄り道を二つ聞き、街歩きの案内役になって配信で紹介し、お礼を伝えます。"], ["48K", "城下町紀行の主役", "選んだお題で約5分の街歩きトーク。名前入りアイコンと架空の名物看板を描いたカード画像もお渡しします。"]]],
  ["路面ベル♪", "「まもなく、商店街のパン屋さんの前です」。ベルと呼んでください♪ 車窓から見つけたお店と、降りた電停をノートに残しています。低音の強い曲はちょっと苦手。電停ではイヤホンを外して、ベルや店先の声を聴きます。\n\n雨の日、傘を忘れてあじさいを眺めていたら、隣の方が傘をこちらへ少し傾けてくれました。同じ電車に乗って、私が先に降りると、その方が窓越しに小さく会釈。ノートの「傘を半分」を読み返すと、花の色より先にあの会釈が浮かびます。\n\nお目当てのパンが売り切れた日は「続きは次回」とメモ。電停のノートのはずなのに、「次回」の行はパン屋ばかりです。", "ベル待ちの電停", "車窓から見つけた看板や、つい降りたくなる電停の話をする待合席です♪ 路面電車に乗ったことがなくても、「あの店が見えたら降りたい」から。ベルが鳴るまで、寄り道の話をしましょう。", [["1K", "ベルを鳴らしてお祝い", "配信で名前を呼び、「ご乗車ありがとうございます」とお迎えします。"], ["5K", "寄り道きっぷのお礼", "寄り道先を一つ選び、あなたの名前を添えたお礼をファミリーに載せます。"], ["10K", "名前入り電停アイコン", "路面電車と電停の看板を描いた、表示名入りのアイコン画像です。"], ["20K", "電停リクエスト", "好きな景色を聞き、その景色に出会えそうな実在の電停を配信で一つ紹介します。"], ["30K", "色を選べる一日乗車券セット", "好きな車体の色で、名前入りアイコンと架空の一日乗車券の画像を作ります。"], ["40K", "お名前入り車内放送", "好きな景色を車窓に見立て、配信で名前を呼んでお祝いとお礼を伝えます。"], ["48K", "架空路線の主役便", "景色と電停名を選んで約5分の車内放送風トーク。名前入りアイコンと、選んだ電停を載せた路線図画像も作ります。"]]],
  ["ねずち。", "すみっこ、空いてますか。ねずちです🐭 壁を背にできる席とチーズが好き。似た袋を手に取って、苦手なわさび味を引いた日は、水がいちばんおいしかったです。ボウリングでは端に残った一本を倒せるとうれしくなります。\n\n配信で「寝る前についゲームする」に「今のわかる」と書いて送信。その間に「実家でヤギを飼ってた」という話に変わっていました。私も飼ってたみたいになってしまい、「うちは金魚だけです」と訂正。そこから、その晩は金魚の話で持ちきりでした。\n\n廊下の足音なら、家族の誰が来たか当てられます。話題が変わるときにも、ひと足ぶん早く聞こえてくれたら助かるんですけどね。", "すみっこチーズ席", "壁ぎわに一席、空いてます🐭 好きなアニメの一場面や、ゲームで迷子になった話をどうぞ。話題が変わっても「さっきの話だけど」で大丈夫。チーズをひとかけ食べるくらいなら、覚えてます。", [["1K", "すみっこから小さな拍手", "配信で名前を呼んで、チーズひとかけぶんの小さな拍手を送ります。"], ["5K", "壁ぎわの一行席札", "表示名と「チーズ持ち込み可」を入れた席札風のお礼を、ファミリーに書きます。"], ["10K", "チーズの名前入りアイコン", "チーズとねずみの柄に、表示名を入れたアイコン画像です。"], ["20K", "すみっこのお題リクエスト", "アニメかゲームのお題を一つ選んでもらい、配信でその話を広げます。"], ["30K", "選べるすみっこ画像セット", "好きなチーズの色で、名前入りアイコンと席札風の壁紙を作ります。"], ["40K", "チーズ通信のお礼ニュース", "最近うれしかったことを聞き、配信で名前と一緒に短いニュースとして紹介します。"], ["48K", "すみっこニュースの主役", "選んだお題で約5分のニュース風トークとお礼。名前入りアイコンと新聞風のカード画像もお渡しします。"]]],

const icons = ["01-rui_03.png", "02-初見じょうれん。.png", "03-あずき＊.png", "04-おちゃまる🍵.png", "05-ぼると⚡.png", "06-たっぷりん🍮.png", "07-mira☾.png", "08-あてな°.png", "09-からあげレモン🍋.png", "10-kohaku..png", "11-ぴかまる⚡.png", "12-しりゅう_08.png", "13-たいやき＠しっぽ派.png", "14-つきよみ☾.png", "15-きのぴ。.png", "16-こうめい＊.png", "17-れん_07.png", "18-じに＊.png", "19-港レター_.png", "20-けんし♪.png", "21-かんうどん🍜.png", "22-土星わっか◎.png", "23-しろもち。.png", "24-いかいかが.png", "25-ゆづる❄.png", "26-じゃっくん☆.png", "27-さなだんご。.png", "28-ゆずっこ。.png", "29-のぶにゃがฅ.png", "30-ぜうす_.png", "31-りさっち＊.png", "32-ちょぱ丸_.png", "33-敬語でラスボス🎮.png", "34-simba_.png", "35-kuroha_.png", "36-まさむね_.png", "37-路面ベル♪.png", "38-ねずち。.png", "39-いなりまる。.png", "40-はんこびより。.png"];
const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブでこのプロフィールが更新されました。入力内容をコピーしてページを再読み込みしたあと、もう一度編集してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの設定でサイトデータの保存を許可しているか確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {copyText, successMessage = label + 'をコピーしました'} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('.family, li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しするか、メニューの「コピー」を選んでください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => {
          field.remove();
          if (feedback.textContent === manualHint) feedback.textContent = '';
        }, {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = successMessage;
  });
  return button;
}

function buildCorePerkTable(perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリー説明・コア特典を見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = 'ファミリー説明';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  const nameCopy = copyButton('ファミリー名', name, nameValue);
  nameCopy.className = 'family-name-copy';
  actions.append(copyButton('ファミリー説明', name, description, {
    copyText,
    successMessage: '7段階のコア特典と一緒にコピーしました。ポコチャのファミリー説明欄に貼り付けてください。'
  }), nameCopy);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, feedback, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
