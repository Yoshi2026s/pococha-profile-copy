<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "るいです。帰りの電車では、イヤホンは片耳だけ。もう片方で車内放送を聞きながら、歌枠や雑談を聴いてます。コメントはだいたい家に着いてから。平成のJ-POPが流れると「これ昔めっちゃ聴いた」と書きかけますが、曲名を思い出した頃には二曲先です。\n\n曲を教えてもらうなら、タイトルの横に「二番のサビ前」とか「最後のベース」も書いてくれると嬉しい。翌朝もう一度聴くと、一人で聴いたはずなのに、薦めてくれた人の耳をちょっと借りた気がするんです。メモに「二番のあと」とだけ残った曲もあります。その日だけは誰の耳を借りても見つかってません。\n\n前に終電で、隣の人が窓に映る自分を見ながら、小さくエアギターしてました。同じ駅で降りても、まだ指が動いてる。曲名を当てたくて歩く速度まで合わせそうになって、いやいや何してるんだ、と発車メロディーで我に返りました。帰ってきて最初に再生したのは、その人が弾いてた曲じゃなくて、発車メロディーに似たイントロの曲でした。\n\n歌のおすすめは一曲で十分。好きなところの秒数も歓迎です。翌朝の通勤に、ちょっと楽しみが増えます。", "片耳プレイリスト", "帰りの電車に似合う曲を一曲ずつ。思い出せたのが「二番のあとでギターが入る」だけでも話は始められます。平成J-POPも新しい曲も、聴きどころを一つ添えてどうぞ。\n\n【コア特典の例・20K】臨時の車内放送\n好きな一曲を車内放送風に紹介。「次は、サビ前のベース。途中下車はお早めに」。", [["1K", "片耳改札", "「○○さん、片耳ホームへどうぞ」と名前を呼ぶ。"], ["5K", "サビまで有効券", "名前を添えた「サビまで有効」の一行きっぷを渡す。"], ["10K", "次の停車曲", "候補二曲から、最後に話す曲を一つ選べる。"], ["20K", "臨時の車内放送", "好きな一曲を車内放送風に紹介。「次は、サビ前のベース。途中下車はお早めに」。"], ["30K", "帰り道きっぷ", "本人が選んだ曲と聴きどころを記念きっぷ1枚にする。"], ["40K", "乗り過ごしニュース", "帰り道の小さな出来事を、1分の車内放送で大げさに案内する。"], ["48K", "○○線の終電", "本人が始発と終点を決める2分の架空車内放送。名前入りの終電きっぷ1枚付き。"]]],
  ["初見じょうれん。", "「初見です！」「昨日もいたよね？」までが挨拶です。じょーれんです、どうもまた来ました。夕飯で抜けて、食べ終わって戻ったのに話がひとつも進んでないと、なぜか得した気がします。逆に全員が聞いたことのないお菓子を探していたら、何を聞き逃したかすごく気になります。\n\nうちで「会長」と呼ばれるのは、昨日じゃんけんで勝った人です。任期は次に負けるまで。こういう身内の呼び名は、初めて来た人に説明するときが一番面白い。みんなが当たり前みたいな顔で「会長、ご帰宅です」と言っている横で、僕が「たぶん今、風呂から戻っただけです」と補足します。\n\nそんな僕も一度、「初見さん、こんばんは！」と声をかけて「昨日あんたと一時間しゃべったよ」と返されました。しかも昨日の第一声も同じだったそうです。次に会ったときは向こうが「はじめまして」と先に言ってくれて、その日だけ僕のほうが「また来た人」の役をもらいました。\n\n分からない話題があったら「今なんの話？」って聞いてください。僕が答えます。ちょうど夕飯から戻ったところなら、二人で誰かに聞きましょう(´▽｀)", "また来た初見席", "初見です、昨日ぶりです、どっちも同じ温度でどうぞ。途中で来た人には「会長がどうして会長なのか」からお伝えします。ちなみに選考方法はじゃんけんです。\n\n【コア特典の例・10K】初見に戻れる券\n一度だけ初対面のふり。いつもの呼び名が出たら終了。", [["1K", "昨日ぶりの初見", "「初見さん、昨日はどうも！」と歓迎する。"], ["5K", "初見更新スタンプ", "名前の横に「初見・更新済み」と一言添える。"], ["10K", "初見に戻れる券", "一度だけ初対面のふり。いつもの呼び名が出たら終了。"], ["20K", "会長の引き継ぎ", "本人の一言で、じゃんけん会長の引き継ぎ口上を短く演じる。"], ["30K", "初来店（自称）証明書", "名前と「昨日も来店」を並べた証明カード1枚。"], ["40K", "今どこ？会議", "本人が議題を一つ出し、枠で1分だけ会議。結論が出なくても散会。"], ["48K", "○○さんの初見総会", "本人の議題で2分の総会。「はじめまして」で開会し、会長名札を1枚残す。"]]],
  ["あずき＊", "あずきです🍡 粒あんと薄い毛布と、夜に小さな音で聴くゆっくりした歌が好き。いつもは聴いているだけですが、和菓子の話になるとお店の名前まですぐ聞きます。できれば、買った日に食べるのがよさそうか、翌日のお茶にとっておきたくなるかも教えてください。\n\nお店では、品名の札を見るのも楽しみです。「初雪」と書いてあるだけで、白いお菓子のふちが冷たそうに見える。味の感想に迷ったら、甘さを細かく説明するより「午後の濃いお茶と合いそう」と言う方が伝わることもあります。私の場合、お茶に理由をつけて夜にも一つ食べますけど。\n\n祖母がくれた紙袋に、おまんじゅうが二つ入っていたことがあります。一つは祖母の分だと思って返そうとしたら、「明日のあんたの分よ」と。家で包みを見ると、片方だけ小さく「明日」と書いてありました。翌日、昨日の自分が今日の分をちゃんと残したのがちょっと嬉しくて、急須まで出しました。\n\n今でも二日に分けるつもりで箱を買います。たいてい初日に二度開けます。二回目を「味見の続き」と呼ぶところまで含めて、私のお茶の時間です。", "粒あんと夜のお茶", "お茶をいれる間に、今日のおやつと夜に聴きたい歌の話を。和菓子のおすすめは、夕方の濃いお茶に合うか、明日のために取っておきたい味かまで聞かせてね🍡\n\n【コア特典の例・20K】架空の和菓子命名\n好みの甘さから一品を命名。「二度目の味見」みたいな名前もあり。", [["1K", "お茶いれました", "「○○さんのお茶もあります」と一言お祝い。"], ["5K", "明日の包み紙", "名前と「明日まで残る予定」の一行札を書く。"], ["10K", "今日のおやつ係", "今夜は粒あんの話か、皮の話かを選べる。"], ["20K", "架空の和菓子命名", "好みの甘さから一品を命名。「二度目の味見」みたいな名前もあり。"], ["30K", "一品お品書き", "名前と架空の和菓子を載せたお品書きカード1枚。"], ["40K", "ひと箱お披露目", "架空の和菓子を二つ、1分で紹介。片方は明日の分として残す。"], ["48K", "明日までの限定箱", "本人が箱の名前を決め、2分で今日と明日の二品を紹介。箱の絵を1枚残す。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 洗い物をしながら聴き始めるので、急に返事がなくなったら泡を流してるところです。ご当地のお菓子の話が出ると、あとで探せるように名前だけ覚えておきます。\n\nお茶の感想は一口目と少し冷めた頃で変わります。最初は湯気しか気にならなかったのに、甘い物を食べたあとで香ばしさが戻ってきたりする。どっちがおいしいか当てるより、その香りで何を思い出したか聞く方が好きです。僕のほうじ茶は祖母の台所。友人の答えが「いま開けたポテチ」でも、お茶がすすむので歓迎です。\n\n一度、奮発した茶葉といつものほうじ茶を飲み比べました。二人とも「こっちは香りが上品」と真剣に話していたのに、新しい茶葉を入れた急須はまだ使っていませんでした。友人が無言でそちらを持ち上げて「こちらが本日の新商品です」と。二人そろって味の違いを語った分、言い訳まで同じでした。\n\nそれ以来、家で飲み比べる日は、先にカップを二つ揃えて、それから急須も二つ使ったか確認します。食レポには自信がありませんが、お茶はちゃんといれます( ˘ω˘ )", "ほうじ茶の間", "お湯が沸いたらこんばんは🍵 ご当地のお菓子や、少し冷めてから分かるお茶の香りをゆっくり話す場所です。聴いてるだけの方にも湯のみは出してあります。\n\n【コア特典の例・20K】それっぽいお茶鑑定\n好きなおやつとお茶の組み合わせを食レポ。困ったら「台所を思い出します」。", [["1K", "湯のみ追加", "「お湯が沸きました。○○さんのお席はこちら」と迎える。"], ["5K", "茶柱の札", "名前に「茶柱は確認中」の一言を添える。"], ["10K", "お茶うけ係", "二つのおやつから、今夜話すほうを選べる。"], ["20K", "それっぽいお茶鑑定", "好きなおやつとお茶の組み合わせを食レポ。困ったら「台所を思い出します」。"], ["30K", "湯気の鑑定書", "お茶とおやつを、名前入りの鑑定カード1枚にする。"], ["40K", "急須の答え合わせ", "候補のお茶二つを1分で紹介。最初に「急須はちゃんと二つあります」と確認する。"], ["48K", "○○さんの貸し切り茶席", "本人が茶とおやつを決め、2分の茶席トーク。名前入り茶席札1枚付き。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこでようやく立ち上がる、ぼるとです。普段のコメントは省エネやけど、勝負どころだけ急に手が動きます。画面の前で立ったくらいで何が変わるんか。自分でも分からんけど、だいたい立ってます。\n\n逆転打のリプレーを見ると、できれば一つ前の打席まで戻したくなります。粘って塁に出た選手がおったから、その一振りで届く点が増えた。あと、打った瞬間にベンチの端から誰が飛び出したかも好きです。勝ち負けの話をするつもりで、気づけば得点にはならなかったプレーの話ばっかりしてます。\n\nある試合では、僕の配信が隣の部屋の中継より少し遅れてました。隣で家族が叫んだから「結果言うな！」と返したら「足つっただけ！」。数秒後にこっちで逆転して僕が叫ぶと、今度は「それ、もう見た」。試合が終わってから聞いたら、つったのは足の指でした。結果より先に詳しく教えてほしかったんは、そっちです。\n\n願掛けで立ち位置を変えた日に点が入って、家族から「次もそこで見て」と頼まれたこともあります。立ったのは五回でした。初めて九回までが長いと思いました⚡", "九回裏の応援席", "逆転打の話は大歓迎。その前に粘って塁に出た選手や、ベンチの端で先に立った人の話も聞きたい応援席です。途中から来ても、今のカウントからどうぞ⚡\n\n【コア特典の例・20K】代打アナウンス\n今日やり遂げたことを実況。「代打、洗い物を終えた○○さん！」。", [["1K", "応援席へようこそ", "「ただいま○○さん入場、拍手お願いします！」と場内放送風に迎える。"], ["5K", "手書き応援札", "名前に「六回から立ち見」を添えた一行札。"], ["10K", "今夜の見返し係", "逆転打と、その前の打席のどちらを先に語るか決められる。"], ["20K", "代打アナウンス", "今日やり遂げたことを実況。「代打、洗い物を終えた○○さん！」。"], ["30K", "打席カード", "小さな達成を名前入りの選手カード1枚にする。「得意技は二度寝回避」など。"], ["40K", "九回裏の日常実況", "本人の今日の出来事を、1分だけ逆転試合みたいに実況する。"], ["48K", "○○球団の開幕戦", "本人が監督役で日常の一大場面を指定。2分の実況とスコアカード1枚。"]]],
  ["たっぷりん🍮", "ぷりんと呼んでください🍮 固めのプリンに苦めのカラメルが好き。新作は棚の前で一度迷います。買わない方の理由までよく考えて、だいたい買います。歌枠で懐メロが流れると洗濯物をたたむ手が止まるので、タオルの山で枠の盛り上がりが分かります。\n\nおすすめを聞くときは、スプーンを入れた跡が残るかも知りたい。口に入れるまで角が残るものと、途中でふわっとほどけるものでは、同じ固めでも違う気分で食べられます。私はカラメルを最後の一口に合わせて残す派。三口目でもう計画が崩れるので、結局その日いちばん苦いところを途中で食べます。\n\nごほうび用を冷蔵庫に隠して、隠し場所ごと忘れたことがあります。翌朝、家族が野菜室から出して「昨日からここが高級デザート売り場」と。横には誰かが隠したシュークリーム。犯人は名乗り出ませんでしたが、その日のうちにプリン以外もきれいになくなりました。\n\nおやつの写真は断面でよければ撮れます。食べる前に撮ってと言われても、カメラよりスプーンが先に手に入ってるので。みんなの報告も、写真なしの一言から歓迎です。", "固めプリン同好会", "固め派にもとろとろ派にも席があります🍮 プリンの食感や、カラメルをどこで混ぜるかを話す部です。懐メロが流れたら、おやつの話も洗濯もいったん休憩。\n\n【コア特典の例・20K】新作プリン発表\n好きな食感から架空プリンを命名。「野菜室でひと晩熟成」もあり。", [["1K", "スプーン入刀", "「○○さんにスプーン一杯ぶんの拍手！」と祝う。"], ["5K", "野菜室の札", "名前に「野菜室で発見済み」の一言を添える。"], ["10K", "カラメル会議", "先に混ぜる派と最後に残す派の、どちらの話から始めるか選べる。"], ["20K", "新作プリン発表", "好きな食感から架空プリンを命名。「野菜室でひと晩熟成」もあり。"], ["30K", "専用プリンラベル", "架空プリンの名前と推しの食感をラベル1枚にする。"], ["40K", "ひと口レビュー", "本人の好みで二口ぶんを1分で食レポ。最後にカラメルを残せたかまで想像して語る。"], ["48K", "野菜室デパート", "本人が売り場名を決める2分のプリン発表会。限定ラベル1枚付き。"]]],
  ["mira☾", "mira（ミラ）です。眠る前に弾き語りや、穏やかな雑談を聴いています。映画館では客席の照明がつくまで座っているほう。立つと映画から現実へ戻るので、エンドロールの間だけはもう少し居させてもらいます。\n\n好きな映画の話は、あらすじを全部説明するより「あの部屋の冷蔵庫、ずっと鳴ってたね」みたいなものが好きです。同じ場面を観た人が「そのとき手元で、出すか迷ってた手紙をしまってた」と言うと、もう一度観たいところが一つ増えます。話を聞いてから観る二度目は、一度目に見えなかったものまで入ってくる気がします。\n\n昔、ある映画の曲を探して友人に鼻歌を送りました。「途中から別の曲になってる」と返ってきて、翌日には正解と、混ざったほうの曲の名前まで届きました。どうも、好きなところを歌い終えたあと、無意識に次に好きな曲へ乗り換えていたようです。今でも二曲を続けて聴くと、あのときの妙なつなぎ目で笑ってしまいます。\n\nコメントは考えているうちに話題が変わることがあります。前の話に返事をしていたら、映画館でまだ立ってない人だと思って、そっとそのままにしておいてください。", "余韻のひと席", "映画を観終わっても、すぐには席を立たない人へ。夜の弾き語りと、その場で言いそびれた感想を聞く席です。あらすじより、耳に残った物音を一つ持ってきてくれると嬉しいです。\n\n【コア特典の例・20K】今日のエンドロール\n今日の小さな出来事に配役を一つつけて読む。「主演、開かなかった傘」など。", [["1K", "今夜のひと席", "名前を呼んで「余韻が残るまでどうぞ」と迎える。"], ["5K", "夜の半券", "名前と今夜の気分を添えた文字の半券。"], ["10K", "最後に話す場面", "二つの架空の映画場面から、話題にする方を選べる。"], ["20K", "今日のエンドロール", "今日の小さな出来事に配役を一つつけて読む。「主演、開かなかった傘」など。"], ["30K", "一日のポスター", "本人の一日を、短編映画のポスター1枚にする。"], ["40K", "余韻の一分映画", "本人の一言から、1分の短い映画あらすじを朗読する。"], ["48K", "あなたの一夜を上映", "本人がラストを選ぶ2分の朗読。題名と表示名入りの記念半券1枚付き。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。謎解きは答え合わせのちょっと手前が好き。手がかりは全部ありそうで、まだ全員の推理が割れている時間です。枠では答えを出す前に「ヒント要る？」と聞きます。私が急に「なるほど」としか言わなくなったら、だいたい自分の推理を片づけてます(￣▽￣)\n\nノートは左に見たもの、右に考えたこと。「引き出しに赤い丸」は左、「りんごの暗号だ」は右。分けておくと、仮説だけ消して初めから考えられます。便利なのですが、私の右側はよく字でぎっしりです。一度、左に「まだ何も見てない」とだけ書いていました。\n\n脱出ゲームで椅子の下をのぞき続けた日も、見たのは座面と四本の脚だけ。なのに「この椅子、絶対何かある」と言い切ったら、係の人が「お疲れでしたら座って大丈夫ですよ」と。引っ込みがつかなくなって全員で座りました。答えは出なかったけど、みんなちょっと休めました。\n\n見当違いの推理も、理由が聞けると面白いです。正解を当てた人も、謎のない椅子に座っていた人も、答え合わせまでは同じ作戦室にいてください。", "仮説だらけの作戦室", "見たものと推理したことを分けて書く、謎解き好きの作戦室。外れた案も、どうしてそう思ったか聞きたいです。休憩用の椅子は、そのまま座ってよし。\n\n【コア特典の例・10K】ヒント係\n本人が選んだ一語を、枠で出す一問のヒントに混ぜる。", [["1K", "椅子の安全確認", "「○○さん、作戦室へどうぞ。椅子は普通です」と迎える。"], ["5K", "最初の証拠札", "名前に「怪しい物、今のところゼロ」と添える。"], ["10K", "ヒント係", "本人が選んだ一語を、枠で出す一問のヒントに混ぜる。"], ["20K", "思い込みの反省会", "今日の勘違いを「見たこと」「思ったこと」に分けて、探偵風に読む。"], ["30K", "捜査メモ", "本人の選んだ手がかりを、名前入りの捜査カード1枚にする。"], ["40K", "怪しい椅子を再調査", "本人が証拠を一つ選び、1分の簡単な二択謎をみんなで解く。"], ["48K", "名探偵○○の二分捜査", "本人が舞台を決める2分の推理クイズ。解決済みの捜査票1枚付き。"]]],
  ["からあげレモン🍋", "晩ごはんを考えながら、みんなの晩ごはんを聞きに来ます。からレモです🍋 ラーメンの話を聞けば、さっきまでの献立はすぐ変更。コメントに🍋だけ置く日はだいたい笑ってます。お弁当のおかずの話なら、翌朝まで忘れません。\n\n揚げたてがおいしいのは期待どおり。そのあと冷めても好きだったかを聞くのが、お弁当を決めるときの楽しみです。一度、すぐ食べる分と翌日用を買って比べようとしたのに、帰りに両方食べました。温度の比較はできなかったけど、お腹が減ってる間は仮説を立てない方がよさそう、とは分かりました。\n\nみんなの唐揚げに「レモンかけていい？」と声をかけたとき、力を入れすぎて汁が自分の目にも飛びました。こっちが涙目になっている横で、友人は冷静に一個つまんで「うん、この一個だけめっちゃ酸っぱい」。みんなの分は無事でした。僕はそのあと、横に置いてあった自分の水をまず探すところからでした。\n\n「あと一品どうする？」と聞かれたら残り物を全部聞きますが、最後にコンビニのコロッケを推すこともあります。相談しているうちに、相談した人よりこっちが食べたくなるんです。", "ひと絞り食堂", "晩ごはん、何にする？🍋 揚げたての唐揚げも、冷めてからおいしいお弁当のおかずも、ここでは話の主役。大皿のレモンは、絞る前に一声どうぞ。\n\n【コア特典の例・20K】架空定食の売り込み\n好きなおかずを聞いて、専用定食をひと言で宣伝。レモンは希望制。", [["1K", "レモン確認", "「○○さん、拍手にレモンかけていいですか？」と祝う。"], ["5K", "本日の箸袋", "名前に「絞る前に一声」と添えた文字札を書く。"], ["10K", "晩ごはん一品決め", "今日の献立に足したい一品を選んで、枠の話題にする。"], ["20K", "架空定食の売り込み", "好きなおかずを聞いて、専用定食をひと言で宣伝。レモンは希望制。"], ["30K", "ひと絞りのお品書き", "本人の好物と付け合わせを、お品書きカード1枚にする。"], ["40K", "食堂の一分営業", "本人が主菜を決め、1分の注文・食レポ・お会計ごっこ。"], ["48K", "○○さんの一日食堂", "本人が看板定食を決める2分の食堂コーナー。名前入りメニュー1枚付き。"]]],
  ["kohaku.", "こはくと申します。休日は、開店したばかりの喫茶店で厚切りトーストを頼みます。食器の音くらいしか聞こえない席が好きです。メニューは毎回きちんと開き、「次は違うものを」と思いながら今日も同じ注文をします。\n\n家で本を読みながら配信を聴くと、耳に残った曲名を付箋に書きます。少し経ってそのページを開くと、小説の一場面と、そのとき聴いていた歌が一緒に戻ってくることがある。読み返したときに別のページに印をつけると、同じ本を読んでも目が止まる場所は変わるんだなと思います。昔の付箋を全部外した日だけは、どこに戻していいか分からず、そのまま読み直しました。\n\nしばらく通えなかった店に寄った帰り、店主に「今日は本、お持ちじゃないんですね」と言われました。本を読んでいた話をした覚えはなく、いつものトーストのついでに覚えてくれていたようです。次の週は本を一冊持っていきました。運ばれてきた皿の向こうで少しだけ目が合って、その日はそれで充分でした。\n\n最近の読書でも、昔から好きな曲でも、気に入った一文や一音だけ聞かせてください。続きを知りたくなったら、こちらからそっと聞きます。", "付箋のある喫茶室", "読みかけの本と、耳に残った曲を置いていける喫茶室です。どんな話か全部説明しなくても大丈夫。付箋を挟みたくなったところから話しましょう。\n\n【コア特典の例・5K】一行しおり\n本人の選んだ一語を使い、一行のしおりを書く。", [["1K", "トースト席へ", "「○○さん、お席は窓側です」と迎える。"], ["5K", "一行しおり", "本人の選んだ一語を使い、一行のしおりを書く。"], ["10K", "喫茶室の棚選び", "本・音楽・朝の喫茶店から、今日話す棚を一つ選べる。"], ["20K", "一文の注文", "好きな言葉から短い一文を作って読み、トーストが焼けるまでにお届け。"], ["30K", "喫茶室のしおり", "本人の言葉と名前を使ったしおりカード1枚。"], ["40K", "喫茶の一分掌編", "本人が決めた季節と席を入れ、1分の短い喫茶店の話を朗読する。"], ["48K", "○○さんの喫茶開店", "店名を本人が決める2分の開店朗読。専用しおり1枚付き。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかで呼んでね。早押しが得意というより、考えがまとまる前に送信できます。前に「こんぴざー！」って挨拶したら翌日もそう呼ばれて、一晩だけピザ屋をやった気分でした。朝一発で目が覚める曲、引き続き募集中です。\n\n大喜利で何も浮かばないときは「誰がこれを言ったらおもしろいか」から考えます。ふつうの「お待たせしました」でも、店の中で迷った館内放送の係が言えばちょっと笑う。そうやって頭の中で一人二役やってる間に、枠はもう次のお題。早押し部の部長、考えると遅いです。\n\nしりとりで得意げに「みかん」と送ったことがあります。みんなが「ん」から始まる言葉を探してくれたのに、次に自分が送ったのは「だいこん」。枠主に「ぴかは拍手係できる？」と聞かれて、そこからは持ち味を発揮しました。最後に優勝した人より先に👏を送った自信があります。\n\n挨拶間違いも、すべった答えも、誰かが拾うとその日の看板になります。変な言葉で呼ばれたくない人は今のうちに教えてね。私もそろそろピザの人から戻りたいです。", "ぴかっと早押し部", "こんぴかー！ 早押し、しりとり、急な大喜利が始まります⚡ 「ん」で終わっても拍手係は続行。誤字は拾って笑えるくらいのやつだけ、今日のお題にしよう。\n\n【コア特典の例・10K】10秒大喜利挑戦券\n本人が一問出題。すべったらお題を変えて一度だけやり直す。", [["1K", "こんぴか落雷", "「○○さんに小さめ落雷！」と拍手一発。"], ["5K", "誤字公認スタンプ", "わざと一文字だけ間違えた、名前入りのお祝いを一行書く。"], ["10K", "10秒大喜利挑戦券", "本人が一問出題。すべったらお題を変えて一度だけやり直す。"], ["20K", "早押し判定席", "本人が出した二択で私が即答。判定は本人におまかせ。"], ["30K", "迷回答賞状", "その日いちばん惜しかった答えを賞状カード1枚にする。"], ["40K", "○○杯の予選", "本人がテーマを選び、1分で二問。早すぎて間違った回答も拍手で救済。"], ["48K", "ぴかっと二分大会", "本人名義で2分の早押し大会。優勝と迷回答を結果カード1枚に記録。"]]],
  ["しりゅう_08", "しりゅう。夜にふらっといます。アニメは少し前の作品を見返すことが多いです。昔は退屈で飛ばした回が、今になって一番好きになる。結末の話をする前は相手が観たか聞きます。まだなら、まず主題歌の話くらいから。\n\n二周目は脇役を一人決めて、その人の表情を見ます。主人公が前を向いている間に、横で目をそらしたり手を止めたりしてる。一度目にはただ間が空いたと思ったところで、あの人は言い出せずに黙ったんだな、と気づくのが好きです。\n\n釣りから帰ったら場所と時間をメモしています。坊主の日も空の色くらいは覚えておきたい。ある日、まったく釣れなかったので、帰りの魚屋でアジを買いました。袋を見た家族は「すごいじゃん」。レシートを見せると「そりゃ大きさも揃うわけだ」と、夕飯では魚屋さんがやけに褒められました。翌週から家を出るたび「今日はどっち行くの？」と聞かれます。まず海には行くよ。\n\n見返して見つけた脇役の一言でも、釣れたのか買ったのか微妙な魚でも、気が向いたら教えてください。魚屋の営業時間のメモが一番詳しいのは、ここだけの話です。", "夜釣りとアニメ棚", "釣れた日も、魚屋に寄った日も。昔のアニメを観返して気づいた表情や主題歌の話も歓迎です。結末に触れるときは、先に相手がもう観たか聞いてから。\n\n【コア特典の例・20K】本日の釣果実況\n「出勤前にゴミ出し達成、一尾」みたいに、本人の成果を釣果風に読む。", [["1K", "本日の一尾", "「○○さん、今夜も一尾」と短く祝う。"], ["5K", "釣果札", "小さな成果を「本日の釣果」にして一行書く。"], ["10K", "夜釣りか再放送か", "釣り話と昔のアニメ話のどちらを聞くか選べる。"], ["20K", "本日の釣果実況", "「出勤前にゴミ出し達成、一尾」みたいに、本人の成果を釣果風に読む。"], ["30K", "釣果図鑑カード", "本人の成果を、魚の大きさ欄まで埋めた図鑑1枚にする。"], ["40K", "釣果の次回予告", "本人の出来事を、1分の釣り番組の次回予告にする。"], ["48K", "○○さんの二本立て", "本人の一日を釣果ニュースとアニメの予告にして計2分。図鑑カード1枚付き。"]]],
  ["たいやき＠しっぽ派", "先にしっぽからいきます。名前はたいやきでも、しっぽでも。先端のカリッとしたところが本番なので、買うときは横からも見ます。「あんこ入ってないところを真剣に選ぶ人、初めて見た」と言われました。そういえば自分で買うならあんこ派なのに、最初に食べるところは、あんこがなくていい。\n\n商店街の寄り道も、元のお題をみんなで忘れるくらい脱線した雑談も好きです。「それ何味？」と聞いた相手が実は飲み物の話をしていて、私だけたい焼きの新作を想像していたこともあります。うっかりしたときは、そのままおやつの話に誘います。\n\n頭派の友だちに「うまいこと分けよう」と一匹を任せたら、渡されたのは先端だけ。向こうの皿には頭から胴体まで乗っていました。「しっぽが好きって言ったでしょ」と言われたら、うまい返事も出ません。あれから二匹買います。今では向こうから「しっぽ二ついる？」と聞いてくれるので、まず食べるところの話が早いです。\n\nカスタードとあんこを同じ袋に入れてもらうと、しっぽからでは味が分かるまでちょっとかかります。この時間も含めて買い物なので、袋に印はつけなくていい派です🐟", "しっぽから商店街", "頭派もしっぽ派も寄ってって🐟 あんこがないほどカリッとした端っこも、熱く語る立派な話題です。脱線して誰も話を戻さなくなったら、二匹目を買う合図。\n\n【コア特典の例・20K】架空たい焼きの売り口上\n本人が選んだ具で一匹を考えて宣伝。しっぽまで入るかも発表。", [["1K", "焼きたての先端", "「○○さん、カリッとしたところからどうぞ」と迎える。"], ["5K", "焼き上がり番号札", "名前に「端っこ指定」を添えた文字の札。"], ["10K", "頭かしっぽか", "その日の雑談で、どっち派から先に語るかを選べる。"], ["20K", "架空たい焼きの売り口上", "本人が選んだ具で一匹を考えて宣伝。しっぽまで入るかも発表。"], ["30K", "袋のイラスト札", "本人のたい焼きの断面を、名前入りのカード1枚にする。"], ["40K", "商店街の一分販売", "本人が選んだ二つの具を、1分で頭派としっぽ派に売り込む。"], ["48K", "○○たい焼き屋の開店", "本人が店名と看板の具を決め、2分の開店ごっこ。包装紙風カード1枚付き。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけで大丈夫。ひと駅ぶん遠回りする夜に、歩く音が聞こえるくらいの音量で話や歌を聴きます。雨の日は傘をさしているので返事は家に着いてから。最後に聴いた曲だけ、先に一言残すことがあります。\n\n帰り道の曲は、歩く速さに合うかより、足を止めても続きを聴いていたいかで選びます。ある夜、ポストの横で立ち止まって、曲が終わるまでぼんやりしていました。翌日も同じところで止まって、あのポストが僕の一時停止ボタンみたいだと思いました。\n\n大事な用事がうまくいかなかった晩に、歌い終えた枠主が「今日はここまで。みんな、帰ったら寝ようね」と言いました。励まそうと何か言われたわけでもないのに、もう家に帰っていいんだと肩の力が抜けました。信号が変わるのを待って、家に着いたら本当に電気を消して寝ました。\n\n一日を全部話そうとすると、最初の一言がなかなか出ません。そんな日は「今日は月が見えた」とだけ書きます。「こっちは曇り」と返ってくると、短いやりとりの間に、自分の街と誰かの街が一つずつ入った感じがして好きです。", "月夜の遠回り", "いつもより少し遠い帰り道に、夜の歌と他愛ない話を。何を書こうか迷う日は、今見える空のことだけでも聞かせてください。返事は家に着いてからで大丈夫。\n\n【コア特典の例・20K】寄り道予報\n今日の一言から夜の予報。「明朝にかけて家事が弱まる見込み」。", [["1K", "ひと駅分のおかえり", "名前を呼んで、帰り道の「おかえり」を一言。"], ["5K", "月夜の切符", "名前と今夜の空模様を、文字の切符にする。"], ["10K", "今夜の遠回り先", "橋かポスト前か、今夜話す道を一つ選べる。"], ["20K", "寄り道予報", "今日の一言から夜の予報。「明朝にかけて家事が弱まる見込み」。"], ["30K", "月明かりの地図", "本人の選んだ風景を、帰り道のカード1枚にする。"], ["40K", "一駅ぶんの散歩話", "本人が選んだ目印から始まる、1分の散歩話を読む。"], ["48K", "○○さんの遠回り放送", "本人が出発と終点を決める2分の散歩朗読。帰り道のカード1枚付き。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間にいます。好きなのは舞茸の天ぷら、ゲーム、誰かのコメントにそっと乗っかること。急に黙ったときは、たいてい手がふさがってます。手が空くと、何事もなかったみたいに戻ってきます。\n\nゲームで迷ったら、曲がり角の看板まで戻ります。現実でも同じ作戦で店を探したら、赤い看板の店が三軒並んでました。最後に役に立ったのは、隣の店の前でいつも寝ている犬。翌週いなかったので、目印にした犬に休憩日があるところまでは考えていませんでした。\n\nある日「おかえり」を「おかわり」と送って、数日間「大盛りにする？」と聞かれました。「漬物も」と返したら「今日は切らしてます」。枠主が「うち、何屋だと思われてる？」と言ったところに、初見さんが来て「何がおすすめですか？」。そのときだけ返事が思いつかず、三人くらい同時に黙りました。次からもう舞茸の天ぷらって答えようと思います。\n\n作業しながらの「りょ」を「り」だけ送って、しりとりを始められたこともあります。訂正より先に「りんご」を取られる枠、けっこう居心地がいいです。", "おかわり休憩所", "作業の合間にひと休み🍄 ゲームも小ボケも、つい送っちゃった誤字の話も歓迎。「おかわり」と書いてあっても、大盛りの相談より先に、まずおかえり。\n\n【コア特典の例・20K】クエストクリア実況\n今日できたことを「タオル討伐完了！」みたいに読む。", [["1K", "ログイン報酬", "「○○さん、本日のログイン確認。おかわり！」と祝う。"], ["5K", "誤字の任務札", "その日の本人が許可した誤字を、名前入りの任務名にする。"], ["10K", "今夜のお題メニュー", "ゲーム・夕飯・小ボケから、話すコースを一つ選ぶ。"], ["20K", "クエストクリア実況", "今日できたことを「タオル討伐完了！」みたいに読む。"], ["30K", "セーブ済み伝票", "今日の成果を、休憩所の伝票カード1枚にする。"], ["40K", "コメントで追加ステージ", "本人が選んだ言葉で1分だけ遊ぶ。完了しなくても「漬物待ち」でセーブ。"], ["48K", "○○さんのおかわり店", "本人が店名と任務を決める2分のゲームごっこ。クリア伝票1枚付き。"]]],
  ["こうめい＊", "こうめいです。問題を出されると、答える前に出題者の狙いを考えます。考えた結果、最初に浮かんだ答えをわざわざ変えて外すことがあります。歴史ものでは「あそこでこうしていれば」と言いやすいのに、自分が打つボードゲームでは毎回、次の一手で悩みます。\n\n初参加の人には「どっちが気になる？」と先に聞くようにしています。慣れている側から見ると不思議な手でも、理由を聞くと、同じ盤面の違うところを見ていたと分かる。あとからルールを説明するときも、その人が使った言葉を借りる方が伝わることがあります。\n\n前に、小学生に自分の作戦を丁寧に話したら「でも、僕のコマをそこに置けば勝ちだよ」と言われました。本当にその一手で終わりです。「確認してたんだよ」と答えると、「じゃあぼくの番も確認して」。その子は責めている顔でもなく、ただ早く次の番をやりたそうでした。僕だけ手を動かさずに長話をしてました。\n\n枠で会議をするなら、先に風呂か先にごはんかくらいでも十分。どっちを選んだかより、どうしてそっちだったかを聞かせてください。空腹の軍師が長く話し始めたら、そのまま次の人へ手番を回して大丈夫です。", "一手先の円卓", "ボードゲームと歴史の話を囲む円卓。慣れてる人の定石も、初参加の「ここに置いたら？」も、理由まで聞くと面白い。私が作戦だけ延々と語り出したら、手番を進めてください。\n\n【コア特典の例・10K】二択の評定\n「風呂か、ごはんか」ほどの二択を出し、枠で挙手して決める。", [["1K", "円卓の一席", "「○○殿、本日の先手はお譲りします」と迎える。"], ["5K", "軍師の一行メモ", "本人が言った一言に、大げさな作戦名をつける。"], ["10K", "二択の評定", "「風呂か、ごはんか」ほどの二択を出し、枠で挙手して決める。"], ["20K", "軍師の反省会", "本人の失敗に作戦名をつけて短く反省。「先に地図を見ればよかった」も立派な結論。"], ["30K", "作戦図の一枚", "本人の選んだ作戦を、名前入りの盤面カード1枚にする。"], ["40K", "一分の作戦会議", "本人が勝利条件を一つ決め、枠のみんなの案を聞いて、1分で作戦を選ぶ。"], ["48K", "○○殿の決戦評定", "本人が陣営と勝利条件を決める2分の評定。結論は作戦メモ1枚に残す。"]]],
  ["れん_07", "れん。邦ロックと弾き語りが好きです。音源では気づかなかったギターがライブでやけに良かった、という話に弱い。外では聴いてるだけで、家に着いたら「こんばんは」。教えてもらった曲は、次の朝に歩きながら聴くことも多いです。\n\n一回目はそのまま聴いて、二回目は歌の合間の楽器を追います。三回目からは探さなくても、その音が歌と一緒に聞こえてくる。昔好きだった曲で試すと、友だちとサビばかり歌っていたせいか、いいところを半分くらい聞き逃してた気がします。\n\n小さいライブハウスで機材が止まったとき、歌い手さんが「ここだけ歌える？」と客席を見ました。最初は前の数人だけだったのに、次の歌詞になると後ろの列からも声が聞こえて、最後は本人が笑って歌えなくなりました。音源を聴くと今でも、その辺で後ろの列の声を待ってしまいます。曲は普通に先へ進むのに。\n\n逆に、隣の人の手拍子を終演の拍手だと思って、曲の途中で一人きっちり拍手したこともあります。前列がよく見えるとは限らないし、後列が静かとも限らない。どの席で何が聴こえたかまで聞けると、またその曲を聴きたくなります。", "ギターが鳴る後列", "邦ロックや弾き語りの話を、ギターがよく聞こえる後列で。好きな音が出てくるところや、客席が思わず歌い出したサビの話を一つ聞かせてください。\n\n【コア特典の例・10K】アンコール係\n二曲から、枠で最後に紹介する一曲を選ぶ。", [["1K", "後列へどうぞ", "「○○さん、今日はギターがよく聞こえる後列へ」と迎える。"], ["5K", "名前入りの半券", "名前と好きな楽器を添えた文字のライブ半券。"], ["10K", "アンコール係", "二曲から、枠で最後に紹介する一曲を選ぶ。"], ["20K", "一音のスポットライト", "本人の好きな一音を紹介し、その場所だけ一緒に待つ。"], ["30K", "今日の曲順カード", "本人が選んだ曲と聴きどころを、セットリスト1枚にする。"], ["40K", "一分ライブの曲振り", "本人が並べた二曲を、開演とアンコールに分けて1分で紹介する。"], ["48K", "○○さんの後列ライブ", "本人のテーマで2分のライブ風トーク。選曲カード1枚付き。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」と続けて聞いてたら、たぶんじにです＊ 旅の話がいつのまにか駄菓子の話になってる枠が好き。教わったお店は地図に保存して、次に頼みたいものを短く書いておきます。短くしすぎて、あとで困ります。\n\nメモに「絶対また行く」とだけ書いた店へ、理由を確かめにもう一度行きました。おいしいけど、何かが違う。駅まで歩いてやっと思い出しました。私が食べたかったのは、その店を目印に曲がった先のたこ焼きでした。今は近所にピンが二つ立っています。そのうち一つには「前のピン参照」とあります。直したつもりでした。\n\n最近は「誰と行きたいか」も書きます。立ち食いなら一人、大盛りなら友だちと半分ずつ。ある店に「次は一人で」と書いたら、翌週本当に一人で行くことになり、店員さんに「先週のお連れさまは？」と聞かれました。先週は最後の一口を取り合ったんです、とまでは言わず、今日は一人で食べきりました。\n\nおすすめは味だけでも嬉しいです。帰宅まで袋を開けずにいられたかまで聞くのは、私が待てない方だからです。お店のメモの見出しは、最近ますます長くなりました。", "よりみち地図帳", "旅先のおやつや、地元の人が帰りに寄る店を記録する地図帳です。「次は何を頼むか」までぜひ。目印のお店と本命のお店のピンが逆でも、気づいたら教えてね＊\n\n【コア特典の例・30K】寄り道マップの新店\n本人が店名と場所を選び、その店と、勝手に描き足した隣のたこ焼き屋を地図1枚にする。", [["1K", "寄り道ピン一つ", "「○○さん発見。今日はどの角を曲がります？」と迎える。"], ["5K", "曲がり角メモ", "好きなおやつに「たこ焼き屋の隣」など架空の目印を一行つける。"], ["10K", "地図の先頭係", "駅前・裏通り・商店街から、最初に話す場所を選ぶ。"], ["20K", "架空の新店案内", "好きなおやつを聞いて、ありそうでない新店を短く紹介する。"], ["30K", "寄り道マップの新店", "本人が店名と場所を選び、その店と、勝手に描き足した隣のたこ焼き屋を地図1枚にする。"], ["40K", "一分食べ歩き", "本人が二つの店の順番を決め、1分で両方の名物を案内する。"], ["48K", "○○さんの街歩き", "本人が街名と名物を決める2分の案内。名前入り寄り道マップ1枚付き。"]]],
  ["港レター_", "旅の話が好きな方へ。みなとです。海沿いを歩くことと、出先でポストを探すことが好きです。知らない街の名前を聞くと、名所の景色と一緒に「朝、どこでパンを買うんだろう」と思い浮かべます。\n\n道案内の矢印を見ても、地元の人が反対向きに歩いていると、その先が気になります。地図に印のない通りで、シャッターを開ける音と朝ごはんの匂いがすると、街に住む人の朝を少し見せてもらった気がします。同じ道でも、歩いた時刻は旅のメモに残します。店が閉まった頃しか知らない場所も、今度は早起きして行ってみたくなるので。\n\n自分宛てに旅先からはがきを送ったことがあります。帰宅した夜に届いて、裏には「明日の朝は港でパンを買う」とだけ。読みながら、書いたときは明日の予定で頭がいっぱいだったのに、届いたときにはもう味まで知っているんだなと思いました。自分の字なのに、旅先にいた誰かから届いたようでした。\n\n近所の道でもいいので、好きな寄り道を一つ聞かせてください。時刻や、お店から何の匂いがしていたかまで覚えていたら、私はそこを歩いてみたくなります。みなとより。", "海辺のポスト", "旅先で見つけた寄り道を、はがき一枚ぶんだけ。朝のパン屋でも、地元の人がよく通る裏道でも。場所と一緒に、そのときの匂いや音を聞かせてください。\n\n【コア特典の例・20K】旅はがきの朗読\n本人の選んだ風景ではがきを短く読み、追伸だけパン屋の話を添える。", [["1K", "港の消印", "「○○さん宛てのお祝い、届きました」と迎える。"], ["5K", "海辺の一行便り", "本人の好きな風景を、宛名入りの一行にする。"], ["10K", "今夜の行き先係", "港・坂道・朝のパン屋から、読む便りの題材を選ぶ。"], ["20K", "旅はがきの朗読", "本人の選んだ風景ではがきを短く読み、追伸だけパン屋の話を添える。"], ["30K", "港の絵はがき", "宛名と便り、架空の消印が入ったカード1枚。"], ["40K", "一分で朝から夜", "本人が選んだ街の朝と夜を、1分の便りにして読む。"], ["48K", "あなた宛ての港町", "本人が街の名前を決める2分の旅朗読。特製の絵はがき1枚付き。"]]],
  ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ 懐メロとカラオケの十八番によく反応します。ドライブ用なら、行きは思わず音量を上げる曲、帰りは窓を少し開けて聴きたい曲。みんなは行きと帰りで何を変えるのかも聞きたいです。\n\n誰かが十八番を歌うときは、マイクを口元から離す瞬間を見るのが好きです。長い音で少し離したり、静かなところで近づけたり。同じ曲でも覚えている間が人によって違います。僕は笑うとマイクを離すので、録音ではその場所だけ急に真顔になったみたいに静かです。\n\nカラオケで自信満々に入れた曲の歌詞が全然知らないものだったことがあります。同じ題名の別の曲でした。その曲も知っていた友人がマイクを拾って歌い切り、僕は横でタンバリン。後日「またあれ入れてね」と言われました。あれはもう彼の十八番だと思うんですが、選曲したのは確かに僕です。\n\nそういうわけで、曲名が出ないときに無理に当てなくても大丈夫。サビの雰囲気や、いつ聴いていたかを話してるうちに、思い出す人がどこからか出てきます。出てこないときは、しばらく僕が口でタンバリンをやります。", "サビから歌う会", "十八番とドライブの一曲を持ち寄る会♪ 曲名が出なければ、どんな日に聴いてたかからどうぞ。サビが来たところでコンビニに着いたら、降りるのは歌い終えてから。\n\n【コア特典の例・20K】昔のラジオの曲振り\n気分を聞いてDJ風に曲を紹介。締めは口タンバリン。", [["1K", "口タンバリン一発", "名前を呼んで「シャカッ」と祝う。"], ["5K", "十八番メモ", "本人の好きな曲に「歌い出し待ち」を添えた一行札。"], ["10K", "今夜のDJ選曲係", "二曲から、今夜紹介する曲を一つ選べる。"], ["20K", "昔のラジオの曲振り", "気分を聞いてDJ風に曲を紹介。締めは口タンバリン。"], ["30K", "サビ待ち番組表", "本人が選んだ曲とサビの見どころを番組表1枚にする。"], ["40K", "一分リクエスト番組", "本人のリクエスト二つに、1分だけ昔のラジオ風で曲振りする。"], ["48K", "○○さんの夜ラジオ", "本人が番組名を決める2分のラジオ。番組表1枚と口タンバリン付き。"]]],
  ["かんうどん🍜", "かけ、ちくわ天、ねぎ多め。「かん」で大丈夫です🍜 寒い日だけカレーに寄り道します。夕飯を作りながら枠を聴くので返事は一拍遅れますが、だしの話だけは包丁を置いてすぐ書きます。地元のうどんに何が乗るか、家で煮るだしとはどこが違うか、そういう話に弱いです。\n\n初めての店では天ぷらを浸す前にだしをひと口。次は衣がふやけてきた頃にもう一口。温かいうちにも、具を食べ進めているうちにも、好きなところが違います。次は順番を守るとメモして、揚げたてのちくわ天が来るとだいたいそのまま浸します。\n\nいつもの店で初めて「いつもので？」と聞かれたとき、覚えてもらえたのが嬉しくて即うなずきました。来たのはカレーうどん。前の週に一度だけ頼み、白いシャツに汁を飛ばしたことがありました。帰り際、店主から「今日は黒い服で良かったね」。注文より服のほうをよく覚えていたようです。次にかけを頼んだら、今度は向こうが笑ってました。\n\n旅の写真は、城と橋の区別がつかなくても二日目のうどんだけすぐ分かります。ねぎの下に何が乗っていたかまで思い出せるので、旅の記録はもうお品書きにしてもいいかもしれません。", "ねぎ多めの席", "かけ、ちくわ天、ねぎ多め🍜 うどんの話なら、何が乗っていたかも聞きたい席です。季節の変わり目はカレーの話が増えます。白い服の方は少し後ろへ。\n\n【コア特典の例・10K】うどん店長券\n具を一つ選び、みんなで一杯の名前を決める。ねぎは先に追加。", [["1K", "ねぎ多めのお祝い", "「○○さん一杯入ります。ねぎは乗せました」と祝う。"], ["5K", "本日の注文札", "名前と好きな具を、短い注文票にする。"], ["10K", "うどん店長券", "具を一つ選び、みんなで一杯の名前を決める。ねぎは先に追加。"], ["20K", "だしの実況中継", "好きな具で一杯を想像して食レポ。「天ぷら、入れちゃいました」。"], ["30K", "あなたのお品書き", "本人が選んだだしと具を、名前入りメニュー1枚にする。"], ["40K", "のれんの一分店長", "本人が選んだ二杯を、1分の注文ごっこで紹介する。"], ["48K", "○○製麺の特別営業", "本人が店名と看板うどんを決める2分の架空営業。メニュー1枚付き。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 星座は勉強中。夜空に明るいものを見つけたら、まず何時でどっちの方角か覚えます。星だったら嬉しいし、飛行機ならどこ行きか気になる。方角を忘れた日は「近所のコンビニの上」で説明します。遠くの人に分かるはずがないのに、そこから一生懸命説明してしまいます。\n\n同じ場所から翌日も見上げると、屋根の角やアンテナが目印になります。詳しい人が何を見ているか最初はよく分からなかったけど、今は前の日と比べられるだけでも楽しい。昔の自分なら見上げなかった空を、一分だけ気にするようになりました。\n\n友人と流星を待っていた夜、僕が「あっ」と言ったとき向こうも「あっ」。二人で「やっと見つけたね」と喜びました。帰り際に友人が「あと一本あった」と言うまで、私は一緒に流星を見たと思っていました。相手が見つけたのは、近くの自販機にあったお気に入りの缶ジュース。私は空、向こうは自販機を見ていました。\n\n月と深海なら今は月に行きたいです。通路側しか取れなかったら、窓側の人にメモ帳を渡して、外で何が見えたか書いてもらうつもり。現地の感想なら、流星じゃなくて缶ジュースでも一応読みます。", "土星の窓側席", "今日見えた星、月と深海ならどちらに行くか、正解がいらない夜の話をする窓側席◎ 星座が分からなければ「コンビニの上」からどうぞ。\n\n【コア特典の例・20K】あなたの新星座\n今日あったことを星座に命名。「ベランダに洗濯ばさみ座が出ています」。", [["1K", "窓側にお通し", "「○○さん、今夜の窓側はこちら」と迎える。"], ["5K", "宇宙行き搭乗札", "名前に「コンビニの上を経由」と書き添える。"], ["10K", "今夜の宇宙二択", "月か深海など、みんなに聞きたい二択を一つ選ぶ。"], ["20K", "あなたの新星座", "今日あったことを星座に命名。「ベランダに洗濯ばさみ座が出ています」。"], ["30K", "新星座カード", "本人が選んだ形を描いた、名前入り星図1枚。"], ["40K", "一分プラネタリウム", "本人が選んだ二つの架空の星を1分で解説。自販機も目印にできる。"], ["48K", "○○天文台の生中継", "本人が観測先を選ぶ2分の宇宙案内。窓側指定の搭乗札1枚付き。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。「もち」だけでも振り向きます。たくさん話せる日と、ただぬくぬく聴いていたい日があります。昨日の続きのはずなのに朝になって「おはよう」と言ったら、そのまま寝ていたと思ってください(-_-)zzz\n\nお餅はきなこ派。お雑煮は「いつものと違ったら最初にどこに気づく？」と聞くのが好きです。湯気の匂いで分かる人もいれば、箸を入れて餅の形が違うと分かる人もいる。毎年同じお椀を前にしているからこそ、人の家の話がちょっとした旅みたいに聞こえます。\n\n前のお正月は、食べ進めると底からお餅が三つ出てきました。小さい頃に「一つじゃ足りない」と何度も言ったらしく、家の人が覚えていたんです。今は三つもいらないと思いつつ、結局きれいに食べました。翌朝「今日も三つ？」と聞かれて初めて「一つでいい」と言えました。足りなかった頃の僕が聞いたら、たぶん信じません。\n\n枠主の「おやすみ」だけちょうど聞こえて目が覚めた晩があります。起きるために鳴る音の反対をもらったみたいで、そのままもう一度寝ました。そういう晩があるので、「聴いてるよ」と打ったかどうかは翌朝まで自分でも分かりません。", "毛布ときなこの部屋", "きなこ餅派も、お雑煮にその家の決まりがある人も、毛布の中からこんばんは。挨拶の返事が翌朝でも気にしない、ぬくぬく聴ける部屋です。\n\n【コア特典の例・20K】寝落ち実況\n「○○選手、毛布に入ったまま静かに優勝です」と小声で実況する。", [["1K", "毛布から拍手", "「○○さん、毛布から出なくて大丈夫」と小声で祝う。"], ["5K", "きなこの名札", "名前と今日のぬくぬく度を文字の札にする。"], ["10K", "お雑煮のお題係", "餅の形かだしの味か、どちらをみんなに聞くか決める。"], ["20K", "寝落ち実況", "「○○選手、毛布に入ったまま静かに優勝です」と小声で実況する。"], ["30K", "布団で優勝認定", "本人の実況内容を、名前入りのおやすみ表彰状1枚にする。"], ["40K", "一分ぬくぬく杯", "本人が競技を一つ命名して、1分の寝落ち実況と表彰をする。"], ["48K", "○○さんの毛布大会", "本人が選ぶ二種目で2分の架空大会。寝落ち王者の表彰状1枚付き。"]]],
  ["いかいかが？", "いかです🦑 名前を「いかがですか？」まで読んでもらえるとちょっと嬉しい。水族館ではクラゲの前で同行者に置いていかれます。置いていかれたと言うより、「あとで追いつく」と言ったきり、しばらくクラゲを見てます。\n\n水槽の前では説明板より先に、「この魚、今なに考えてるんだろう」と想像します。隅にじっとしている魚を眺めて「恋の悩みかな」と言ったら、連れは「あそこは水の流れがゆるそう」。同じ魚を見て、こっちは恋愛相談、向こうは水槽の設計の話。正反対なのに、二人ともその場を離れませんでした。\n\n前にエイに向かって水槽越しに手を振ったら、向こうの通路の子が笑って振り返してくれました。そのあと隣のお母さんまで手を振って、私ももう一度振ったので、ひと通り挨拶が済む頃にはエイの行き先が分かりませんでした。友人に「知り合い？」と聞かれ、「今、知り合った」と返しました。名前も知らない人と、あれだけ挨拶したのは水族館が初めてです。\n\n枠でも天気の話から深海まで来て、よく「そもそも誰が始めた話？」となります。最初に天気を聞いたのは私だったりします。今日はどこまで流れてみますか。いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 雨の話から深海まで、流れ着いた話題を眺める部屋です。水槽の向こうに手を振り返す人がいたら、その話からどうぞ。\n\n【コア特典の例・20K】水槽の代弁放送\n好きな生き物の気持ちを一言アナウンス。「考え事中につき低速運転」。", [["1K", "クラゲ前点呼", "「○○さん、クラゲ前に集合です」と迎える。"], ["5K", "すいすい入館札", "名前に好きな生き物の名前を添えた文字札。"], ["10K", "水槽選び係", "深海、クラゲ、エイから、最初に話す水槽を一つ選ぶ。"], ["20K", "水槽の代弁放送", "好きな生き物の気持ちを一言アナウンス。「考え事中につき低速運転」。"], ["30K", "水槽の説明札", "本人が選んだ生き物と想像の性格を説明カード1枚にする。"], ["40K", "一分の館内ガイド", "本人が決めた二つの水槽を1分で案内。待ち合わせはだいたいクラゲ前。"], ["48K", "○○館長の水族館", "本人が水槽と名前を決める2分の架空ツアー。館内図1枚付き。"]]],
  ["ゆづる❄", "こんばんは。ゆづるです。温かいものをひと口飲んでから、夜の歌枠を聴きに来ます。静かな声で始まるバラードが好きです。周りが静かだと、歌い手さんが息を吸うところまで聞こえる。大きく声が出る曲も好きだけど、耳を澄ませたくなる歌は、終わってからもしばらく残ります。\n\n感想は、うまくまとめようとするより、聴いたところを一つ書きます。「二番の前で息を吸う音が好きでした」。その一行で、どこを聴いていたかが伝わる気がします。たまに一行を打っては消している間に次の曲が始まります。歌の区切りでやっとカップに手を伸ばすと、もう飲み物は冷めています。\n\n少し雪が積もった朝、出勤しようと出たら家の前だけ雪がよけてありました。隣のおじさんが通りがかりにやってくれたそうです。次に降った日に早起きしてお返ししようと思ったら、もう半分終わっていて「せっかくだから一緒にやるか」と。寒かったはずなのに、今でも思い出すのは手の冷たさより、二人で近所のパン屋の開店時間を話したことです。\n\n歌のことを聞く日も、言葉が一つしか出ない夜も、ここではどちらもいいと思っています。今日は書くより先に、飲みごろのうちにひと口いただきます。", "雪あかりの歌席", "温かいものを一口、夜に聴きたい歌を一曲。感想は、心に残ったところを一つだけでも。返事を考えて飲み物が冷めた人には、ここにも仲間がいます。\n\n【コア特典の例・10K】締めのひとこと係\n枠を締める言葉を一つ選ぶ。「明日の私、洗濯を忘れずに」も歓迎。", [["1K", "ひと息のお祝い", "名前を呼んで「今日も一息ついていって」と伝える。"], ["5K", "小さなおやすみ便り", "名前を添えた一行の夜の便りを書く。"], ["10K", "締めのひとこと係", "枠を締める言葉を一つ選ぶ。「明日の私、洗濯を忘れずに」も歓迎。"], ["20K", "一口ぶんの手紙", "選んだ夜の風景を入れ、飲み物が冷めないくらいの短い手紙を読む。"], ["30K", "雪あかりの便箋", "本人の言葉を添えた便箋カード1枚。"], ["40K", "夜の一分朗読", "本人が選んだ一語から、1分の短い夜の手紙を読む。"], ["48K", "○○さんの雪あかり", "本人が風景と締めの言葉を選ぶ2分の朗読。名前入りの便箋1枚付き。"]]],
  ["じゃっくん☆", "はーい参加します！ 何に参加するかは今から聞きます。じゃっくんです🙌 実況、早押し、大喜利。誰かが置いたボケに一人一個ずつ足して、最後には最初のお題が思い出せなくなってるのが一番好きです。隣の部屋に聞こえないように笑うのが、そのときだけ本気の勝負です。\n\n大喜利で「冷蔵庫に社長が住んでます」と誰かが書いたら、僕は社長が自分のプリンに何て書くか考えます。「無断で食べた者は会議室へ」くらいまで出ると、次の人が「会議室も冷蔵庫の中」と続きをつけられる。正しい答えはなくても、前の一行を拾うと初参加の人が混ざりやすくなるんです。うちの冷蔵庫なら、それでも社長のプリンは食べます。\n\n対戦ゲームで「やった勝った！」と叫んだのに、追っていたのはずっと友だちのキャラでした。自分のキャラは端っこで壁に向かって走ってました。「声は完全に勝者だった」と言われて笑いすぎ、次の試合は自分を見つけた頃に終わりました。\n\n冷蔵庫を開けただけでも、実況をつけると決勝戦みたいになります。話すことが決まってなくても、とりあえず挙手してみてください。ルール説明は僕も一緒に聞きます。", "とりあえず参戦部", "実況も大喜利も、まず挙手🙌 誰かの一言に一個ずつ足して、電子レンジの残り一秒まで勝負にします。はじめましての人も、何に参加するかはあとで聞いて大丈夫。\n\n【コア特典の例・20K】日常の決勝戦\n本人の一場面を実況。「電子レンジ、残り一秒を見送ったー！」。", [["1K", "先に挙手", "「○○さん、お題はまだですが参戦決定！」と祝う。"], ["5K", "仮エントリー票", "名前に「種目は後で聞きます」と添える。"], ["10K", "実況ネタ指名", "冷蔵庫を開けるなど、実況してほしい日常の動作を選ぶ。"], ["20K", "日常の決勝戦", "本人の一場面を実況。「電子レンジ、残り一秒を見送ったー！」。"], ["30K", "仮競技メダル", "本人の日常種目をメダル風カード1枚にする。"], ["40K", "一分二種目杯", "本人が選んだ二つの動作を1分で実況し、勝った方をその場で発表する。"], ["48K", "○○杯の決勝特番", "本人の種目で入場から表彰まで2分で実況。名前入り結果カード1枚付き。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。休みの午前中はパン屋さんに寄ることが多いです。「家に帰ってから食べる」と言いつつ、袋の匂いがいいと、店を出てすぐに一つ食べます。家に着いて減っていたら、焼きたてを一つ食べて、家に一つ持って帰る予定だったと思うことにしています。\n\n料理の話を聞くと、何を入れたかに加えて「いつ入れた？」も聞きたくなります。同じ材料でも、最初から煮るのと最後に一振りするのとでは印象が違う。同じだしを使っているのに家によって味が少し違う話も、そうやって聞くと納得することがあります。私だったら「最後に少し」のあとでもう少し入れて、家族に何をしたかすぐ見抜かれます。\n\n焼きすぎたクッキーを「焦げたところはよけてね」と友だちに渡したら、あとから送られてきたのは空っぽのお皿の写真でした。横に「次は倍で」の紙。その後、張り切って倍の量を仕込んだら、天板を二枚使ったせいで焼く時間を取り違えました。今では渡すときに「焼き具合チェックお願いします」と言います。味の話ができる相手がいると、この程度の失敗は持っていきたくなります。\n\n歌枠なら曲の前に昔の思い出を聞ける時間が好きです。レシピでも歌でも、やり方だけより、そのとき誰と何を話したかまで聞く方が、あとでよく思い出します。", "焼きたてひと皿", "パンの匂いと隠し味の話をする、焼きたての一皿。何を入れたかと、いつ入れたかを両方聞きたいです。ちょっと焼きすぎた分も、ここでは味見のうち。\n\n【コア特典の例・10K】きょうの味見係\n材料を一つ選び、相性のよさそうな隠し味をみんなに聞く。", [["1K", "焼きたて一皿", "「○○さん、味見の一枚どうぞ」と迎える。"], ["5K", "味見済みシール", "名前に「焦げたとこはお好みで」と添えた文字札。"], ["10K", "きょうの味見係", "材料を一つ選び、相性のよさそうな隠し味をみんなに聞く。"], ["20K", "焼きすぎ新作発表", "本人の材料から架空のお菓子を命名。多少焦げても「検討中」で通す。"], ["30K", "焼き菓子ラベル", "本人の新作を名前入りの包装カード1枚にする。"], ["40K", "一分試食会", "本人が選んだ材料二つで、1分だけ新作の匂いと味を想像して話す。"], ["48K", "○○さんの新作発表会", "本人が商品名と材料を決める2分の発表会。新作ラベル1枚付き。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方に家事をしながら「おつかれ〜」とだけ書いて、また耳に戻ることがあります。拍手のコメントが並んでたら、しれっと一つだけ足します。散歩の曲は、気づくと足が速くなるくらいが好きです。\n\n家事用の曲は、一曲目でタオル、二曲目で食器。サビまでに一区切りつくと地味に得した気分です。この前は一曲目に聴き入ってしまい、食器のほうは次の曲を待たずに明日の予定になりました。音楽で家事がはかどる日はあるけど、はかどらなかった日の曲の方をよく覚えています。\n\n季節限定のゆず味を探して三軒回り、最寄りの店のレジ横でそれっぽい袋の山を見つけたことがあります。「今なら二個お得」に乗って帰り、食べてからゆず胡椒味だと判明。悔しくて家族に「見つけたよ」と出したら、向こうは「探してたのこれでしょ」と本物を出してきました。同じ店で、商品名を最後まで読んで買ったそうです。\n\n柑橘のおやつは、香りが先か、すっぱさが先か。みんなで食べて一斉に「すっぱ！」になるものがあったら教えてください。私はその声を聞きながら、ちょっと先に水を探しておく係です。", "ゆず色おつかれ会", "夕方の「おつかれ〜」だけでも歓迎🍊 家事の区切りに一曲。買った柑橘おやつがゆず胡椒味だった報告も歓迎です。片付けより歌に聴き入った日は、ひとまず拍手しとこ。\n\n【コア特典の例・20K】柑橘表彰タイム\n終わった家事を表彰。「洗濯完走賞。乾くのは明日でも拍手！」。", [["1K", "夕方おつかれ拍手", "名前を呼び、家事の途中でも一拍手。"], ["5K", "柑橘のごほうび札", "その日の家事に「ゆず香る片付け賞」などを一行でつける。"], ["10K", "今日の一曲テーマ係", "散歩用か家事用か、曲を話すテーマを決める。"], ["20K", "柑橘表彰タイム", "終わった家事を表彰。「洗濯完走賞。乾くのは明日でも拍手！」。"], ["30K", "家事の達成カード", "今日できたことを名前入りの柑橘カード1枚にする。"], ["40K", "夕方の一分ニュース", "本人の日常二つを1分の夕方ニュースに。おやつの速報も可。"], ["48K", "○○さんの夕方特番", "本人が家事とおやつの題材を決める2分の番組。終了宣言カード1枚付き。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。戦国の話で気になるのは、合戦の勝ち負け以上に、誰が誰にどんな手紙を出したか。猫の話も守備範囲広めです。コメントが「かわいい」だけの日ほど、ちゃんと聞いております。\n\n手紙では、堂々とした本文より、最後にそっと添えられたお願いが好きです。立派な言葉を並べたあとに「これだけは忘れずに」と続くと、書いた人が本当に心配していたことが見える気がします。我が家の置き手紙でいちばん効くのは「猫のおやつ一回分を忘れずに」。家中の誰が書いても、そこだけしっかり読まれます。\n\n武将を紹介する番組を家族と見ていたら、いい場面で猫がテレビの前に座りました。巻き戻しても、また同じところで画面にかぶる。三度目には、全員が武将より猫の参戦を待っていました。以後、家族がテレビの前に立つと「参戦ですか？」と声がかかります。本人が何もしていなくても、立ち位置一つで話題を持っていくのは強い。\n\n先日も枠で戦国の話をしながら猫殿に座布団を勧めたら、私の座っていた方へ。当然の顔だったので、そのまま譲りました。領地を取られるときって、意外と静かでござるฅ", "ねこ殿の書状部屋", "武将の書状と猫の話を、夜にしれっと。武将が決めゼリフを言うところでも、猫殿が画面前に来たら、皆でいったんそちらに注目ですฅ\n\n【コア特典の例・20K】猫殿からの書状朗読\n本人宛てに書状を読む。追伸はだいたい「おやつを一回分追加されたし」。", [["1K", "猫殿への拝謁", "「○○殿、座布団は猫殿が先です」と迎える。"], ["5K", "肉球の一行書状", "名前に「おやつの件、よしなに」と一行添える。"], ["10K", "猫殿の議題決め", "武将の手紙か猫のいたずらか、語る順番を決める。"], ["20K", "猫殿からの書状朗読", "本人宛てに書状を読む。追伸はだいたい「おやつを一回分追加されたし」。"], ["30K", "名入り肉球花押", "本人宛ての書状を、肉球印付きのカード1枚にする。"], ["40K", "一分の御前会議", "本人の議題を1分だけ審議。「座布団返還」には猫殿がたぶん欠席。"], ["48K", "○○殿への一城進呈", "本人が城の名前を決める2分の授与式。猫殿の座布団条項入りの書状1枚付き。"]]],
  ["ぜうす_", "ぜうす。呼び捨てで平気です。コーヒーは深煎り。映画の帰りに感想が割れて、降りる駅の手前まで話したのに結論が出ない、あの時間が好きです。枠では普段は聴いているほう。返事を考えている間に、話題が二つくらい先へ行きます。\n\n意見が割れたときは、どっちが正しいかを言う前に、相手がどの場面を覚えていたかを聞きます。自分は黙って立っていた人物の顔を覚えていて、相手はその人が手をずっと動かしていたと言う。見直したら単に袖を直しただけでも、友人が見なければ私も最後まで気に留めなかった仕草です。\n\n帰りの電車で友人と「あの主人公、あそこで何を考えてたんだろう」とずっと話したことがあります。話が妙にかみ合うので油断していたら、降りる直前に別々の人物を主人公だと思っていたと判明。家に着いて場面を思い返すと、どちらを主人公にしても話が通る。もう一駅ぶん話したくなりました。\n\nゲームは見た目で装備を決める派。友人と同じ衣装にしたら、一人だけ写っている写真を二人とも「自分」として保存しました。見た目だけで話を決めると困ることもある。そう思いながら、次も装備は見た目で選びます。", "深煎りの上映後", "深煎りを一杯、映画の終わったあとの話を。答えが割れたら、先に覚えている場面を聞かせてください。結末に触れそうなら、まだ観ていない人に一声。\n\n【コア特典の例・10K】もう一つのラスト係\n架空の短編に、別の結末を一行つけられる。", [["1K", "深煎りの一声", "「○○さん、上映後の一杯どうぞ」と迎える。"], ["5K", "別解の半券", "名前と「まだ結末は決まっていません」の一行券。"], ["10K", "もう一つのラスト係", "架空の短編に、別の結末を一行つけられる。"], ["20K", "同じ場面、別の見方", "本人が選んだ場面を二通りに解釈。「ただ袖を直しただけ」もあり。"], ["30K", "二つの結末カード", "本人の案も入れ、別々の結末をカード1枚に並べる。"], ["40K", "一分の編集会議", "二人の主人公候補から、どちらを主役にするか1分で話し合う。"], ["48K", "○○さんの二重エンド", "一つの設定から生まれた二つの結末を計2分で朗読。タイトルカード1枚付き。"]]],
  ["りさっち＊", "りさっちです☺️ カフェではだいたいいつものメニュー。リップは新しい色も試したい派。ドラマは観終わった日のうちに一人くらいに感想を言いたいです。洗い物の途中でも「みんなならどうする？」と聞こえたら、一回手を拭いて返事を打ちに来ます。\n\nドラマは「推し」と「自分が同僚だったら味方につく人」を分けて答えるのが好き。登場すると目で追っちゃうのに、同じ職場なら毎日早く帰りたくなりそうな人物、いますよね。同じ人を好きだと分かったあとで、どの場面で味方をやめるか話すと、その人の好みまで少し分かって面白いです。\n\n派手かもと迷っていたリップを塗って出かけた日、友だちが「今日なんか顔が明るいね」と言いました。色を変えたことは言ってなかったので、その一言が嬉しかった。帰って購入履歴を見たら、同じ色をすでに二本買っていました。私が欲しかったのは三本目じゃなく、塗って外に出るきっかけだったようです。\n\nカフェでは新作の写真をきちんと見て、結局「いつもので」と頼みます。店員さんに感想を聞かれて「写真はすごくおいしそうでした」と答えたら、相手に「次はぜひ」と言われました。次こそ、は次の晴れの日まで持ち越しです。今日もいつものホットにしました。", "いつものカフェ席", "いつものカフェ席で、ドラマの感想と気になるリップの話を☺️ 「推しだけど同僚にはしたくない」みたいな話も大歓迎。洗い物が途中なら、話はカップが冷めるまで待ちます。\n\n【コア特典の例・20K】気分のおまかせドリンク\n気分を聞いて架空の一杯を発表。初注文なのに次回は「いつもので？」。", [["1K", "いつもの席へ", "「○○さん、いつもので？」と店員風に迎える。"], ["5K", "カップの名札", "名前と今の気分を、注文シール風に一行で書く。"], ["10K", "カフェの議題選び", "新作リップとドラマの推し語り、どっちから話すか決める。"], ["20K", "気分のおまかせドリンク", "気分を聞いて架空の一杯を発表。初注文なのに次回は「いつもので？」。"], ["30K", "限定カップカード", "本人の選んだ色とドリンク名をカップカード1枚にする。"], ["40K", "一分カフェ会議", "本人が選んだ一杯を片手に、架空のドラマの二択を1分で話す。"], ["48K", "○○さんの貸し切り席", "本人が店名と話題を決める2分のカフェトーク。名前入りメニュー1枚付き。"]]],
  ["ちょぱ丸_", "予定　コンビニまで往復10分\n結果　寄り道込みで30分\n買いに行ったもの　忘れた\n\nちょぱ丸です。アニメの話は長め。推しを一人に絞ってと言われたら「今日の一人」で答えます。昨日の答えと違っても大丈夫。昨日観た回と今日観た回が違うから、しばらく隅に座ってただけの人が急に推しになることもあります。\n\n道に迷わないよう、角を曲がったときに見えたものを一つ覚えます。「赤いのれんの隣に猫」まで覚えた日、次に来たら猫がいませんでした。のれんを見ればいいのに猫を先に探してしまって、店の前を一度通過。生き物を目印にするなら、向こうにも予定があると思ったほうがよさそうです。\n\nお店を聞かれて、自信満々に「この先です」と教えたこともあります。そのあと自分も同じ方向へ歩いたのに見当たらず、引き返す途中でさっきの人と再会。地図を開いたら二人とも同じ店に行くところでした。ようやく一緒に着いて、店員さんに「お連れさまですね」と言われたので、訂正するより先に席につきました。\n\n名場面より、一瞬だけの仕草を誰かが覚えてると気になります。「そこ見てた？」からもう一回観たら、寝る時間まで30分ぶん遠回り。その手の寄り道には、今のところ反省がありません。", "寄り道アニメ部", "推しを一人に絞るなら「今日の一人」でOK。アニメの一瞬の仕草から、迷った先のお店までよく話がそれます。案内役が猫を探し始めたら、地図を開いてください。\n\n【コア特典の例・20K】寄り道の次回予告\n最近の寄り道を次回予告に。「次回、○○さん、気づけば二階へ」。", [["1K", "寄り道確認", "「○○さん、目的地はまだ未確認です」と迎える。"], ["5K", "曲がり角のメモ", "名前に「目印の猫は不在かも」と一行添える。"], ["10K", "今日の推し係", "今夜だけ、アニメで語りたい人物や仕草を一つ選べる。"], ["20K", "寄り道の次回予告", "最近の寄り道を次回予告に。「次回、○○さん、気づけば二階へ」。"], ["30K", "寄り道番組表", "本人の目的地と脱線先を、架空の番組表カード1枚にする。"], ["40K", "一分の寄り道外伝", "本人が好きな目印を選び、迷って戻るまでを1分で語る。"], ["48K", "○○さんの寄り道特番", "本人が目的地と途中の分岐を決める2分の物語。寄り道マップ1枚付き。"]]],
  ["敬語でラスボス🎮", "ようこそお越しくださいました。ラスボスとお呼びいただければ幸いです🎮 終盤のゲームでは寄り道が増えます。装備と回復アイテムを揃え、最後の扉の前で一度休憩。お気に入りのボス戦の曲がありましたら、戦い始めと追い詰めたあと、どちらがお好きかまでお聞かせください。\n\n負けたときは原因を一つだけ書き留め、次はそこだけ対策するようにしております。装備も立つ位置も全部変えてしまうと、勝っても、何が効いたのか分かりませんので。ただ、敗因の欄に「落下」が続いた日、同行者の助言は「まず足元を見てお歩きください」でした。手帳を出す前に、見ておくべきものがあったようです。\n\n一時間かけて決戦の装備を揃えたときも、入り口の崖で二回落ちました。三度目で足元を確認すると、すぐ脇に渡れる橋がございました。回復は十分、橋は未確認。ボス戦自体は二分で終わりましたので、準備に使った一時間のうち、もう少し散歩に回せばよかったと考えております。\n\n枠では、勝った話はもちろん、どこで転んだかも安心してお話しください。洗濯が終わった夜などは、当城の決戦を一度お休みしていただいて構いません。挑戦者にもご都合がございますので。", "決戦前の休憩室", "決戦前の休憩室へようこそ。攻略の失敗談も、ボス戦の好きな一音も歓迎いたします。最後の扉へ向かう前に、どうぞ回復アイテムと足元、特に横に橋がないかをご確認ください。\n\n【コア特典の例・20K】功績のお祝い\n「洗濯を終えた功績により、今夜の決戦は免除いたします」と丁重に祝う。", [["1K", "ご来城の挨拶", "「○○様、足元にはくれぐれもご注意ください」と迎える。"], ["5K", "通行許可証", "名前と「橋の利用を推奨いたします」を一行で書く。"], ["10K", "回復か決戦か", "休憩室の雑談か、決戦前の作戦会議を選べる。"], ["20K", "功績のお祝い", "「洗濯を終えた功績により、今夜の決戦は免除いたします」と丁重に祝う。"], ["30K", "クエスト達成証", "本人の功績を、名前入りの賞状カード1枚にする。"], ["40K", "一分の最終決戦", "本人がラスボスの弱点を決め、1分だけ最終戦の寸劇をする。"], ["48K", "○○様の王国授与式", "本人が称号を決める2分の授与式。名前と称号入りの感謝状1枚付き。"]]],
  ["simba_", "シンバです。景色がよければ車を止めるし、曲がよければ頭から聴き直します。出発より休憩が長い方です。動物園ではペンギンが水に入るまで見ていて、混んでたら少し横へずれてしゃがみます。水面と同じ高さにすると、飛び込むところと水の下を進むところが続けて見えるので。\n\nある日、水際のペンギンに知らない子が「行ける、行ける」と小声で声援を送ってました。飛び込んだ瞬間、隣のお父さんが誰より大きく拍手。振り向くと、大人が何人も立ち止まっていて、目が合ってちょっと笑いました。次の一羽が来たときは誰もすぐに帰らなかったので、みんな同じところを見たかったみたいです。\n\nドライブの休憩ではベンチの向きを確認します。海が見えるつもりで座ったら、正面に並んでいたのは駐車場の車でした。友だちが隣で「車が見守ってくれてる」と言ってから、その場所も少し好きになりました。景色の話は、何が見えたかだけじゃなく、誰とそこに座ったかまで聞くと面白い。\n\n配信は飲み物片手に聴きながら、動物園や旅の話が出たらコメントします。しゃがんだ人にしか見えなかったものや、予定にはなかった休憩の話を聞かせてくれたら嬉しいです。", "停車中の見晴らし席", "景色が気になったら、いったん停車。車で聴く曲も、動物園でしゃがんで初めて見えたものも話せる休憩席です。ペンギンが飛び込むところだけ、もう少し一緒に待ちましょう。\n\n【コア特典の例・10K】今日の停車係\n話したい景色を選び、そこで何をしたいかみんなに聞ける。", [["1K", "見晴らし席へ", "「○○さん、景色がいいので一旦停車です」と迎える。"], ["5K", "車窓の一行札", "本人の好きな景色に、名前と「寄り道可」を添える。"], ["10K", "今日の停車係", "話したい景色を選び、そこで何をしたいかみんなに聞ける。"], ["20K", "ペンギンの一声実況", "好きなペンギンの姿を短く実況。「踏み切るか、いったんやめました」。"], ["30K", "休憩の風景札", "本人が選んだ休憩風景を記念カード1枚にする。"], ["40K", "一分の二停車", "本人が選んだ二つの景色を、1分のドライブ案内でつなぐ。"], ["48K", "○○さんの見晴らし便", "本人が道と休憩場所を決める2分の架空ドライブ。行程カード1枚付き。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。邪魔にならない音量で配信をつけて、結局いちばん面白いところで手が止まります。ゲームも音と背景が好きで、町のBGMがよければ進行を忘れてうろうろします。同じ店の前を何度も通って、店の人がいたら覚えられるくらい。\n\n手を動かすだけの日と、文章を考える日では選ぶBGMが違います。好きすぎる曲を流すと「ここの村の先、どんな洞窟だっけ」と調べ始めるから、考え事をするときは外します。曲を我慢して仕事を終え、休憩時間に攻略動画を四本観た日は、まとめて誘惑された感じがしました。\n\n昔のセーブデータを開いたら、決戦前のはずが、最初の村に戻っていました。何をするつもりだったか思い出せなかったのに、村の曲が流れたら、学校から帰ってランドセルをそのまま置き、ゲームを始めた部屋のことはすぐ思い出せました。昔もそこで音楽を聴いてたのかもしれません。決戦に向かう用もないのに戻ってくるくらいには、居心地がよかったようです。\n\nすすめたいゲーム曲は、題名が出なければ場所を教えてください。「雪の町の出口」とか「三回迷った洞窟」とか。まだ見つかってなくても、その場所を思い浮かべる時間がちょっと好きです。", "夜更けのセーブ地点", "夜の作業をしながら、ゲームの音と風景を話す場所。曲の名前がうろ覚えなら、雪の町や夕方の港からどうぞ。一曲を探して手が止まったら、そこが今日のセーブ地点です。\n\n【コア特典の例・20K】今日のセーブ画面\n済ませた作業を読み上げる。「食器をしまった。宿屋に戻ります」。", [["1K", "セーブ音ひとつ", "「○○さん、今日のログを保存しました」と短く祝う。"], ["5K", "一行の再開メモ", "終わった作業を「ここから再開できます」の一行にする。"], ["10K", "BGMを探す場所", "雪の町か洞窟か、ゲーム音楽を話す風景を一つ選ぶ。"], ["20K", "今日のセーブ画面", "済ませた作業を読み上げる。「食器をしまった。宿屋に戻ります」。"], ["30K", "名前入りセーブカード", "本人が選んだ背景と今日の作業をカード1枚にする。"], ["40K", "夜の一分マップ", "本人が選ぶ二つの風景を、1分のゲーム風散歩でつなぐ。"], ["48K", "○○さんの最終セーブ", "本人が舞台と再開地点を選ぶ2分の物語。特製セーブカード1枚付き。"]]],
  ["まさむね_", "まさむねです。休日は城下町を歩いたり、道の駅で買い物をしたり。旅先では説明板を全部読みたいので、一緒にいる人をお待たせすることがあります。定食屋さんへは観光のついでに入ったはずが、次に同じ町へ行く理由がそこの昼ごはんになることもあります。\n\n歩き出す前に昔の地図を見ると、今の道が急に曲がるところが気になります。「この角は堀の跡かな」と得意げに言った日に、同行者から「地図と道の向き、逆だよ」。向きを直しても今の地図で迷いました。以来、昔の町を説明する前に、まず現代の自分がどこにいるか確かめます。\n\n城跡の坂で、通った方に「何か見つけましたか」と声をかけられました。昔は近所の子の遊び場で、その人もよくここを滑り降りたそうです。案内板にはお城のことが書いてありましたが、帰りにはその人が教えてくれた坂を何度も見ました。どうやって足を止めたんだろうと考えると、少し前のその町まで見えた気がします。\n\nそれで定食屋でも、つい「このメニューはいつから」と聞きます。「昨日から」と言われた日には、百年前の話を想像していたと伝えて店の人と笑いました。長く続いたものと、行った日に始まったものを、どちらも覚えて帰れると嬉しいです。", "城下町の寄り道帳", "城下町の曲がり角、説明板に載らない近所の話、定食屋で頼んだもの。旅先でつい足を止めた場所を聞かせてください。ここでは寄り道のほうが長くなっても大丈夫。\n\n【コア特典の例・20K】現代史跡の案内\n本人の寄り道を紹介。「○○氏、ここでコロッケを食す。つい先日です」。", [["1K", "ご城下へようこそ", "「○○殿、説明板の前でお会いしましょう」と迎える。"], ["5K", "今週の史跡札", "本人の寄り道を、日付入りの一行札にする。"], ["10K", "散策の道決め", "城跡、道の駅、定食屋から、今夜立ち寄る話の場所を選ぶ。"], ["20K", "現代史跡の案内", "本人の寄り道を紹介。「○○氏、ここでコロッケを食す。つい先日です」。"], ["30K", "小さな説明板", "本人の寄り道を、日付と名前入りの案内板カード1枚にする。"], ["40K", "一分の城下町案内", "本人が選ぶ坂と店を、1分の架空ツアーで案内する。"], ["48K", "○○殿の寄り道紀行", "本人が町名と名物を選ぶ2分の案内。定食屋も載せた地図1枚付き。"]]],
  ["路面ベル♪", "まもなく、商店街のパン屋さんの前です。ベルと呼んでください♪ 路面電車の窓から、買い物袋を持った人や小さな看板が見えるのが好き。旅先では目的地に着く前に写真が増えます。散歩中の返事は、横断歩道を渡って落ち着いてから書くので少しのんびりです。\n\n初めての街では、一つ先の電停まで乗って、歩いて戻ることがあります。車窓から屋根しか見えなかった店の入口が分かって、通り過ぎただけなら知らなかった行列も見える。たまに戻った頃には、目当てのパンが売り切れています。その日は寄り道に「続きは次回」がついたと思うことにしています。\n\n雨の電停で、知らない人が傘をこっちに傾けてくれたことがあります。交わしたのは「もうすぐ来ますね」くらい。同じ電車に乗って先に私が降りたとき、その人が車内から窓越しにちょっと頭を下げてくれました。休日に写真は何十枚も撮ったのに、その傘だけは写っていません。なのに、次の雨の日に真っ先に思い出したのはあの電停でした。\n\n車窓で見た看板も、ただそこに立っていたときの話も聞きたいです。次は買い物袋を下げて、いつもと反対側から電車の窓を見上げてみようと思います。", "ベル待ちの電停", "まもなく、寄り道したくなる街に着きます♪ 電車の窓から見えた看板や、一駅戻ってやっと入れたパン屋さんの話を、ベルが鳴るまでどうぞ。\n\n【コア特典の例・20K】あなただけの車内放送\n日常を電停に命名。「次は、パン二個買ったのに玄関では一個前」。", [["1K", "ベル一回", "「○○さん、ご乗車ありがとうございます」と迎える。"], ["5K", "途中下車きっぷ", "名前と寄り道先を添えた、文字のきっぷを書く。"], ["10K", "次の電停係", "商店街かパン屋前か、今夜の一つ目の話題を選ぶ。"], ["20K", "あなただけの車内放送", "日常を電停に命名。「次は、パン二個買ったのに玄関では一個前」。"], ["30K", "一日乗車券", "本人の電停と名前を入れた乗車券カード1枚。"], ["40K", "ベル待ちの二電停", "本人が選ぶ二つの寄り道を、1分の車窓案内でつなぐ。"], ["48K", "○○さん電車の貸し切り便", "本人が始発と終点を決める2分の架空運行。路線図1枚付き。"]]],
  ["ねずち。", "すみっこ、空いてますか。ねずちです🐭 初めはあいさつだけ。知ってるアニメやゲームの話になったら、ひょこっと書きます。片手にチーズのおやつがあるので、返事が遅いときはだいたい食べ終わるのを待ってます。\n\n会話を聞き逃した日は、今聞こえた単語を一つ聞き返します。「さっきチーズって言いました？」と書いたら、「チーズじゃなくて地図」と返ってきたことがあります。誰かが笑ってくれたからほっとしたけど、みんなは最初から道の話をしていたそうです。引っ張られたのは僕の耳だけです。\n\n作業中に「今のわかる」と書いた日、話はもう「実家でヤギを飼ってた」に進んでいました。僕も飼ったことがあると思われて、「ヤギって何食べるんですか？」と初見さんが真顔で聞いてくる。「ちょっと家族に確認します」と書いたあとで、家にいるのは金魚だけだと白状しました。その日から「今の」が何の話か確認してから送ってます。たまに確認している間に、また次へ進みます。\n\n笑った理由を翌日聞かれても、何を食べていたかだけ先に思い出します。今日もチーズ。昨日もほぼチーズでした。地図の方は、まだどこの地図だったか知りません。", "すみっこチーズ席", "すみっこ、一席空いてます🐭 アニメもゲームも、話したいところでひょこっとどうぞ。「チーズ？」と聞き返してきたら、一度だけ地図かどうか確かめてください。\n\n【コア特典の例・20K】誰も急がない速報\n本人の日記を「静かに帰宅。チーズの残量は未確認」と短く読む。", [["1K", "すみっこ空いてます", "名前を呼んで、チーズひとかけぶんの小さな拍手。"], ["5K", "すみっこの席札", "名前に「チーズ持ち込み可」と添えた一行札。"], ["10K", "通信の見出し係", "今日の小さなニュースのお題を一つ選ぶ。"], ["20K", "誰も急がない速報", "本人の日記を「静かに帰宅。チーズの残量は未確認」と短く読む。"], ["30K", "すみっこ新聞の一面", "名前入りのニュースを、新聞風カード1枚にする。"], ["40K", "一分のチーズ通信", "本人が選んだ二件を1分で報道。地図の話だったらその場で訂正する。"], ["48K", "○○さんの小さなニュース", "本人の話題だけで作る2分のニュース番組。名前入り一面カード1枚付き。"]]],
  ["いなりまる。", "晩ごはんを食べながら明日の献立を考えてます。いなりまるです。「いなり」でどうぞ。好きなのはだしのきいたうどんとおいなりさん。お店の話が出ると、味だけじゃなく何が乗っていたかも聞きたくなります。\n\n献立に迷ったら、昨日が甘辛かったので今日はだしの味、くらいまで先に決めます。冷蔵庫の前で全部に目を通さなくて済むので。でも先日は「今日はさっぱり」と宣言してから、残り一枚のトンカツを見つけてカツ丼に。味の方針は、目の前に食べたいものが一つ出てくると簡単に負けます。\n\n昔、お弁当のおいなりさんが一つだけ裏返しでした。ひと口かじると中には小さい梅干し。帰って聞いたら「当たりを入れたよ」と言われました。梅干しが苦手なことは忘れていたようです。次に同じお弁当を持っていったとき、見つけたら避けたいのに、真っ先に全部の向きを確認しました。あれが当たりかどうかは、今でも家では意見が分かれます。\n\nうどんに添えるものを聞くと、おいなり派、おにぎり派、天ぷらをおかずにごはん派。どれも知っているのに、誰かがうまそうに話すと食べたくなります。「夕飯はもう食べたから大丈夫」と言っていられるのは最初の五分くらいです。", "いなりと明日の献立", "だしのきいたうどんとおいなりさん。今日食べたものから明日の献立まで話す席です。「いなりの中に当たりを入れるか？」も議題にどうぞ。梅干しだけは私に確認してね。\n\n【コア特典の例・20K】明日の定食発表\n本人の食材から架空定食を紹介。なぜかうどんも付きます。", [["1K", "今夜のひと口", "「○○さん、今日はおいなり一つ追加です」と迎える。"], ["5K", "今日の具札", "好きな具を名前と一緒に一行札にする。梅干しは確認してから。"], ["10K", "献立の一品係", "家にある食材から、今夜の献立で語る一品を選ぶ。"], ["20K", "明日の定食発表", "本人の食材から架空定食を紹介。なぜかうどんも付きます。"], ["30K", "名前入り献立カード", "本人が選んだ一品に、おいなりさんを添えた献立カード1枚。"], ["40K", "一分の冷蔵庫会議", "本人の食材二つで1分会議をして、献立を一つ決める。"], ["48K", "○○さんの台所特番", "本人が屋号と主菜を決める2分の架空食堂。いなり断面入りの献立カード1枚付き。"]]],

const icons = ["01-rui_03.png", "02-初見じょうれん。.png", "03-あずき＊.png", "04-おちゃまる🍵.png", "05-ぼると⚡.png", "06-たっぷりん🍮.png", "07-mira☾.png", "08-あてな°.png", "09-からあげレモン🍋.png", "10-kohaku..png", "11-ぴかまる⚡.png", "12-しりゅう_08.png", "13-たいやき＠しっぽ派.png", "14-つきよみ☾.png", "15-きのぴ。.png", "16-こうめい＊.png", "17-れん_07.png", "18-じに＊.png", "19-港レター_.png", "20-けんし♪.png", "21-かんうどん🍜.png", "22-土星わっか◎.png", "23-しろもち。.png", "24-いかいかが.png", "25-ゆづる❄.png", "26-じゃっくん☆.png", "27-さなだんご。.png", "28-ゆずっこ。.png", "29-のぶにゃがฅ.png", "30-ぜうす_.png", "31-りさっち＊.png", "32-ちょぱ丸_.png", "33-敬語でラスボス🎮.png", "34-simba_.png", "35-kuroha_.png", "36-まさむね_.png", "37-路面ベル♪.png", "38-ねずち。.png", "39-いなりまる。.png", "40-はんこびより。.png"];
const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, buttonText = label + 'をコピー') {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = label + 'を選択しました。長押しやメニューからコピーしてください。';
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

function buildCorePerkTable(name, perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典（全7段階）';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    perk.tabIndex = -1;
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, 'コピー'));
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリーを見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  for (const [label, value] of [
    ['ファミリー名', familyName],
    ['紹介文', familyDescription]
  ]) {
    const term = document.createElement('dt');
    term.textContent = label;
    const description = document.createElement('dd');
    description.className = 'family-value';
    description.tabIndex = -1;
    description.textContent = value;
    fields.append(term, description);
    actions.append(copyButton(label, name, description));
  }

  details.append(summary, fields, actions, buildCorePerkTable(name, perks));
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
