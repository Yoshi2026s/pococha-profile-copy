<title>ポコチャ プロフィール・ファミリー文例集</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-identity {display:flex;align-items:center;gap:12px}
.family-name {min-width:0}
.family-image-button {display:block;flex:none;width:76px;padding:0;overflow:hidden;background:#373c53;color:#fff}
.family-image-button img {display:block;width:76px;height:76px;object-fit:cover}
.family-image-button span {display:block;padding:4px 0;font-size:12px}
.family-intro {margin:0}
.family .actions {grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-name-copy {background:#373c53;color:#fff}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:10px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-text {white-space:normal;overflow-wrap:anywhere;line-height:1.55;margin:0}
.perk-text strong {display:block;margin-bottom:2px}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>ポコチャ プロフィール・ファミリー文例集</h1>
<p class="note">架空の40人を題材にした文例です。「ファミリー説明をコピー」を押すと、紹介文と全7段階のコア特典がコピーされます。ポコチャのファミリー説明欄へ貼り付けてください。</p>
<p class="note">プロフィールの名前と本文は「保存」でこのブラウザーに残せます。アイコンを押すと拡大します。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押ししてメニューを開き、写真に保存する項目があれば選んでください。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "片耳は歌枠、もう片耳は車内アナウンス。帰りの電車から、るいです。平成のJ-POPはサビならすぐ口ずさめます。曲名を思い出した頃には、枠ではもう二曲先。歌詞を追いきれなかった曲は、帰ってからゆっくり聴き直します。\n\n休みの日は、枠で教えてもらった曲をかけてひと駅ぶん歩きます。「二番のサビ前、ベース聴いてみて」。聴き慣れた曲でも、そのひと言で低い音がふっと近くに聞こえてきます。\n\nこの前の終電では、向かいの人がエアギター。指の動きで曲を当てようとしていたら、降りる駅に着いちゃいました。ホームで発車メロディーが流れて、つい「これ昔めっちゃ聴いた」。こっちの曲名も知らないんですけどね。", "片耳プレイリスト", "帰り道にかけたい曲を、一人一曲持ち寄りませんか。発車してすぐ？ 降りるひと駅前？ 聴きたくなるタイミングまで教えてもらえたら、次の帰りに試してみます。", [["1K", "車掌風のお祝い", "配信で名前を呼び、車内放送風に「今日もおつかれさま」。"], ["5K", "帰り道のひと言", "帰り道に読んでほしいひと言を、名前入りでファミリーに投稿します。"], ["10K", "名前入りきっぷアイコン", "表示名を入れた乗車券風のアイコンをお渡しします。"], ["20K", "帰り道の選曲リクエスト", "今の気分に合う一曲を選び、配信で聴きどころを紹介します。"], ["30K", "色を選べる終電セット", "選んだ色で、名前入りきっぷアイコンとスマホ壁紙を作ります。"], ["40K", "名前を呼ぶ車内放送", "配信で名前を呼び、今月の思い出を振り返って、おすすめの二曲をご案内します。"], ["48K", "帰り道ラジオの主役", "好きな曲調で約5分のDJ風お礼番組。名前入りきっぷアイコンと番組表画像もお渡しします。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」。ここまでがうちの挨拶。じょーれんって呼んでね。昔のJ-POPは、歌詞があやしくてもサビから参加します。パクチーは香りが苦手で、そっとお皿の端へ。\n\n週末は友だちとバドミントン。ダブルスで二人の間にシャトルが来て、見事に声がそろいました。「任せた！」。そのまま二人でシャトルの着地を見送りました。次こそ、先に「取るよ」って言います。\n\n枠で「初見さん、こんばんは！」と迎えたら、「昨日あんたと一時間しゃべったよ」って返ってきました。次の日は向こうから「はじめまして」。今度は僕も「昨日ぶりですね」と返せました。コートでも、これくらいきれいに返したい。", "また来た初見席", "本当に初めての人も、「初見です」が口癖の人も大歓迎。途中で来たら「今、なんの話？」って声かけてね。会長がじゃんけんで決まった話は、初めて聞く顔をしてくれたら何度でも。", [["1K", "昨日ぶりのお祝い", "配信で名前を呼んで、「初見さん、今日もありがとう！」と迎えます。"], ["5K", "おかえりメッセージ", "印象に残ったやり取りを添えて、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "自称初見の名札アイコン", "表示名と「初見・認定○回目」を入れた名札風アイコンをお渡しします。"], ["20K", "肩書きのお披露目", "「初見のベテラン」などの候補から肩書きを選んでもらい、配信で発表します。"], ["30K", "来店認定カードとアイコン", "選んだ肩書きと表示名を直筆風カードに。色違いのアイコンと一緒にファミリーへ投稿します。"], ["40K", "いつもの席のお礼トーク", "配信で名前を呼び、今月心に残ったコメントや助けてもらった場面を振り返ります。"], ["48K", "歓迎総会の主役", "選んだ話題で約5分の雑談とお礼。名前入りの会長名札風アイコンと認定カード画像もお渡しします。"]]],
  ["あずき＊", "あずきです🍡 おまんじゅうは粒あん派。気に入った柄の包み紙は、しわを伸ばして缶にしまいます。冬はフィギュアスケート観戦が楽しみ。ジャンプの着氷まで、つい息を止めちゃいます。自分が長い距離を走るときは、タイムを測られるだけでそわそわします。\n\n祖母におまんじゅうを二つもらった日。おばあちゃんにも、と一つ差し出したら「それは明日のあんたの分よ」。包みの端に、小さな字で「明日」と書いてあったんです。\n\n今も、おまんじゅうは二日に分けるつもりで買います。その日のうちにまた箱を開けたら、それは「味見の続き」。自分で包みに「明日」と書いても、おばあちゃんの字ほどは効きません。", "粒あんと夜のお茶", "夜のお茶とおやつをお供に、歌とおしゃべりを🍡 おすすめの粒あんも、「包み紙で選んだ」お菓子も、よかったら聞かせてください。お茶をいれ直したら、話の途中からどうぞ。", [["1K", "湯のみでお祝い", "配信で名前を呼び、「お茶、あなたの分もいれました」と迎えます。"], ["5K", "明日の包み紙メッセージ", "明日読み返したくなるお礼を、名前入りでファミリーに投稿します。"], ["10K", "和菓子の包み紙アイコン", "小豆色の包み紙を思わせる、表示名入りのアイコンをお渡しします。"], ["20K", "おやつ選びリクエスト", "あんこ派かきなこ派かを聞き、和菓子とお茶を一組選んで配信で紹介します。"], ["30K", "おそろいの甘味柄", "選んだ和菓子の柄で、名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなたのお茶会トーク", "似合いそうな和菓子を一つ見立て、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "あずきの甘味お礼会", "好きなおやつを話題に約5分のお茶会。名前入りアイコンと、ひと言入りの甘味カード画像もお渡しします。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 好きな組み合わせはほうじ茶と焼き芋。並べて撮るつもりでも、カメラを構える頃には湯のみが空いてます。\n\n二種類のほうじ茶をいれて、友人と飲み比べた日。二杯目に友人が「こっちのほうが香りが上品」。手元を見たら、僕は同じ急須から二度注いでました。今度こそ別の一杯。「あ、焼き芋の香り」。そう言われたとき、ちょうど僕が焼き芋を割ったところでした。\n\n次に飲み比べるときは、急須に印をつけます。枠で返事が途切れたら、たいてい台所です。湯のみをすすいだら戻ります。", "ほうじ茶の間", "いれたてのお茶と、お茶うけの話をする席です🍵 熱いうちのひと口と、少し冷めたとき。どっちがお好きですか。聞くだけの方にも、湯のみを一つ置いておきます。", [["1K", "ほうじ茶の間のお祝い", "配信で名前を呼び、「湯のみ、置いときました」と迎えます。"], ["5K", "お茶うけのひと言", "今のあなたに贈りたいひと言に名前を添え、ファミリーに書きます。"], ["10K", "ほうじ茶ラベルアイコン", "ほうじ茶の袋のラベルをもとに、表示名入りのアイコンを作ります。"], ["20K", "お茶うけリクエスト", "好きなお菓子に合うお茶を一つ選び、その理由も添えて配信で紹介します。"], ["30K", "色が選べる茶席セット", "茶色か生成りで、名前入りアイコンと湯のみ柄のスマホ壁紙を作ります。"], ["40K", "ほうじ茶のいれ方とお礼", "配信でおすすめのいれ方を一つ紹介し、名前を呼んで今月のお礼を伝えます。"], ["48K", "あなたのお茶会コーナー", "好きなお茶を題材に約5分の飲み比べトーク。名前入りアイコンと茶席カード画像もお渡しします。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。もう座っていられない、ぼるとです⚡ 選手の自伝は、逆転打の直前で読む手が止まります。あの打席へ向かう途中、何を考えてたんやろ。僕のジョギングは三分で歩きに切り替えます。ペース配分は研究中。\n\n中継の前にお茶をいれて、スマホの速報を切ります。ある日、隣の部屋から「うわっ！」。「結果言うな！」と返したら「足つっただけ！」。数秒遅れの中継を観て今度は僕が叫ぶと、隣から「ああ、それはもう見た」。\n\n試合後、マイクを持つふりで隣の部屋へ。「あの瞬間、何があったんですか？」「足の指がつりました」。うちで一番早く入った速報です。", "九回裏の応援席", "逆転打を語るなら、その前に粘って塁に出た選手の話から⚡ 野球を観てない日も、今日のあなたの好プレーを聞かせてください。途中から来たら「今、何回？」で話に入れます。", [["1K", "応援席からナイスコア", "配信で名前を呼び、「ナイスコア！」と拍手します。"], ["5K", "今月の好プレー便り", "助けてもらったことや場を沸かせた一言を、名前と一緒にファミリーで紹介します。"], ["10K", "背番号入り選手アイコン", "名前と好きな背番号を入れた、選手カード風のアイコンをお渡しします。"], ["20K", "あなたの一打を実況", "最近のうれしかった出来事を一つ、逆転打のように配信で実況します。"], ["30K", "チームカラーの応援セット", "好きな色で、名前と背番号入りのアイコンとスマホ壁紙を作ります。"], ["40K", "九回裏のお礼インタビュー", "配信で今月の好プレーにお礼を伝え、あなたからの質問に一つ答えます。"], ["48K", "ヒーロー特番の主役", "選んだ話題で約5分の野球風お祝いトーク。名前入り選手アイコンとヒーローカード画像もお渡しします。"]]],
  ["たっぷりん🍮", "ぷりんです🍮 プリンは固め、カラメルは苦め。昭和歌謡が流れると、たたみかけのタオルは曲が終わるまで膝の上です。手順の多いレシピは読んでるうちにお腹がすくので、新作のおやつは買う派です。\n\nプリンを食べていた晩、ずっと探していた曲が偶然流れました。あれから大事な日の前夜は、お守り代わりにプリンを一個、冷蔵庫へ。「カラメルは最後のお楽しみ」と言いながら、三口目にはもう全部混ぜてます。\n\n家族に内緒でプリンを隠して、自分でも場所を忘れたことがあります。家族が野菜室で見つけてくれました。その奥には、別の家族のシュークリームまで。「ここ、高級デザート売り場？」。今も野菜室は、手前の野菜より先に奥をのぞきます。", "固めプリン同好会", "固め派もとろとろ派も、同じテーブルへ🍮 カラメルは何口目で混ぜますか？ 今日のおやつの話も大歓迎。昭和歌謡が流れたら、おしゃべりは一曲ぶんお休みです。", [["1K", "スプーンを掲げてお祝い", "配信で名前を呼び、プリンのスプーンを掲げてお祝いします。"], ["5K", "カラメルを添えたお礼", "「カラメルは最後まで」など、ぷりんらしい一言を添えてファミリーにお礼を書きます。"], ["10K", "名前入りプリンアイコン", "表示名を入れたプリンラベル風のアイコンをお渡しします。"], ["20K", "おやつトークのリクエスト", "好きなプリンか懐メロの思い出を聞いて、配信で話題にします。"], ["30K", "固め・とろとろ画像セット", "固めかとろとろを選べます。名前入りアイコンとおやつ柄の壁紙を作ります。"], ["40K", "プリン部のお礼放送", "選んでもらったおやつを配信で話題にし、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作プリンのお祝い回", "選んだ味で新作を考える約5分のお礼トーク。名前入りラベルアイコンと直筆風コメント画像もお渡しします。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、弦をすべる指の音まで聞こえる弾き語りをよく聴きます。早押しクイズは少し苦手。私が「あ、分かった」と思う頃には、もう次の問題です。\n\n映画の日は月柄のハンカチを持って出かけます。帰ったら、耳に残った音を一つだけメモ。「廊下の靴音」の一行で、遠ざかっていく背中まで浮かぶことがあります。\n\n映画で流れた曲の題名が分からず、鼻歌を録って友人に送ったら「途中から別の曲になってる」。翌日、友人は二曲とも教えてくれました。聴き比べればすぐに分かるのに、私の鼻歌では最後まで一曲でした。", "余韻のひと席", "夜の弾き語りや、映画が終わっても耳に残る音の話を。靴音や台詞の前の静けさを、結末は伏せて聞かせてください。話す気分じゃない夜も、一曲ぶん座っていきませんか。", [["1K", "月の席からお祝い", "配信で名前を呼び、「今夜もこの席で、ありがとう」とお祝いします。"], ["5K", "余韻を残す一行", "心に残った会話を添え、あなた宛てのお礼をファミリーに書きます。"], ["10K", "月明かりの壁紙", "月と映画館の灯りを描いた、表示名入りのスマホ壁紙をお渡しします。"], ["20K", "余韻のお題リクエスト", "好きな音や曲調を聞き、あなたに合いそうな映画か曲を配信で一つ紹介します。"], ["30K", "夜色のポスターセット", "選んだ夜の色で、名前入りアイコンと映画ポスター風の壁紙を作ります。"], ["40K", "眠る前のお礼朗読", "今月の思い出を短いお礼の手紙にして、名前を添えて配信で読みます。"], ["48K", "今夜の上映後トーク", "あなたのお題で約5分の雑談とお礼の朗読。名前入りアイコンとポスター画像もお渡しします。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは。あてなです。\n\n伊沢拓司さんが出るクイズ番組を観ると、正解が出たあとも「どこで気づいたんだろう？」と考えます。謎解きには青いペンを一本。通った道を思い出して地図を描くのが得意です。ヒントは、どうにも進めなくなったらお願いします。\n\n脱出ゲームで、地図に椅子の位置を記録。立ったまま「この椅子、絶対怪しい」と書いていたら、係の人が「どうぞ座って休んでくださいね」。青いペンで「座ってよし」と追記しました。推理は外れましたが、休憩場所は見つかりました。", "仮説だらけの作戦室", "作戦会議は「実際に何を見た？」から。予想が外れても、そう考えた理由が次の手がかりになるかも。聞く係も歓迎です。答えが浮かんだら、まず「ヒント要る？」と聞いてね。", [["1K", "作戦室からのお祝い", "配信で名前を呼び、「新メンバー発見！」とコア達成をお祝いします。"], ["5K", "作戦メモのお礼", "印象に残ったコメントを一つ選び、ファミリーの作戦メモにお礼と一緒に残します。"], ["10K", "名前入り探偵アイコン", "虫眼鏡と青いペンを描いた、表示名入りの探偵風アイコンをお渡しします。"], ["20K", "なぞなぞのお題リクエスト", "選んだ題材で短いなぞなぞを一問作り、配信で出題します。"], ["30K", "色を選べる探偵セット", "好きな色で、名前入りアイコンと探偵証風の画像を作ります。"], ["40K", "あなたのお題で謎解き二問", "選んだ題材で配信中に二問出し、最後に名前を呼んでお礼を伝えます。"], ["48K", "名探偵の出番", "好きなテーマで約5分の謎解きとお礼。名前入りアイコンと解決記念カード画像もお渡しします。"]]],
  ["からあげレモン🍋", "からレモです🍋 冷蔵庫を開けて、献立が決まらないまま閉める。そんな日は枠で「今日、何食べた？」。手書きのお品書きに唐揚げがあれば、そっちは即決です。\n\n友人と大皿を囲んだ日。「レモンかけていい？」と聞くまでは満点でした。絞った汁がぴゅっと自分の目に。目を洗って戻ったら、友人は「めっちゃ酸っぱい」と言いながら唐揚げをもう一個。今は自分の小皿にだけ、そっと絞ります。\n\n合いの手の多い曲がかかると、つい声を出して話を聞き逃します。曲が終わったところで聞き返します。「で、唐揚げがおいしい店、どこだっけ？」", "ひと絞り食堂", "いらっしゃい、ひと絞り食堂です🍋 商店街で見つけた定食や、冷めてもおいしいお弁当のおかずの話をしましょう。最初のひと言は「衣はカリカリ派！」でも。しっとり派もお待ちしてます。", [["1K", "レモンひと絞りのお祝い", "配信で名前を呼んで「拍手、レモンひと絞り分！」。"], ["5K", "食堂のお礼メモ", "今月のお礼を、表示名入りの食堂メモにしてファミリーに投稿します。"], ["10K", "レモン食堂の名札アイコン", "唐揚げとレモンのお品書き風アイコンに、表示名を入れてお渡しします。"], ["20K", "今夜の副菜リクエスト", "好きなおかずを一品聞いて、それに合う副菜を配信で提案します。"], ["30K", "ひと絞りの画像セット", "レモン色か唐揚げ色で、名前入りアイコンと手書き風のお品書き画像を作ります。"], ["40K", "好きなおかずで献立会議", "好きなおかず二品で献立を考え、配信で名前を呼んでお礼も伝えます。"], ["48K", "ひと絞り食堂の主役席", "選んだ料理で約5分の献立会議。お礼に名前入りアイコンとお品書きカード画像をお渡しします。"]]],
  ["kohaku.", "こはくです。休日は開店したばかりの喫茶店へ。ピアノの音に交じって、カップが受け皿に触れる音がします。後ろに列ができると焦るので、席でメニューを読める店が落ち着きます。ひと通り迷って、今日も厚切りトーストです。\n\n本のカバーは包装紙で折ります。配信で耳に残った曲名を書いた付箋を、カバーの折り返しにぺたり。久しぶりに本を開くと、続きのページより先に、その夜の歌が浮かびます。\n\nある朝、本を忘れて行ったら、店主が「今日はお持ちじゃないんですね」。窓辺で読んでいたのを覚えてくれていたんだ。翌週は本を持っていつもの席へ。トーストを置いた店主が本にちらりと目をやって、ふと目が合いました。笑ったのは、たぶん同時です。", "付箋のある喫茶室", "好きな本の一場面に、一曲だけ流すなら何にしますか。「このページにだけ付箋を貼った」なんて話を、ゆっくり聞かせてください。今日は聴くだけなら、どうぞ窓側へ。", [["1K", "窓側の席でお祝い", "配信で名前を呼んで「いつもの窓側、空いています」。"], ["5K", "こはくの一行しおり", "心に残ったあなたのひと言を、お礼と一緒にファミリーに書き残します。"], ["10K", "付箋柄の名前入りアイコン", "付箋と厚切りトーストを描いたアイコンに、表示名を入れます。"], ["20K", "読書のおともリクエスト", "好みを聞いて、次に読む本か、読書中に聴く曲を一つ紹介します。"], ["30K", "選べる喫茶のしおりセット", "好きな色で、名前入りアイコンとひと言付きのしおり画像を作ります。"], ["40K", "あなた宛ての喫茶朗読", "今月のお礼を喫茶店の小話にして、配信で名前を添えて読みます。"], ["48K", "あなたのお題で喫茶朗読会", "選んだお題で約5分の朗読とお礼。名前入りアイコンと、小話の一節を載せたしおり画像も作ります。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかって呼んでね。サンドウィッチマンのコントは、話がかみ合わないのに二人とも真顔なところが好き。早口言葉は一回やって、すぐ見学に回りました。\n\nしりとりで誰より早く「みかん」。即終了。「仕切り直し！」の声に、今度は「だいこん」。枠主に「ぴか、拍手係お願い」と言われて、誰より早く👏。これなら「ん」で終わらない！\n\n大喜利で好きな答えが来たら、すぐ「それ好き！」。自分の答えは真顔で言うところまで浮かぶ文にしたくて、下書きが長引きます。送る寸前で「次のお題です！」。今日も、誰より早く👏。", "ぴかっと早押し部", "こんぴかー！⚡ 早押し、しりとり、ときどき大喜利。最初は好きなボケに👏を一つ。問題の前に押しちゃったら、ぴかと「もう一回お願いします！」", [["1K", "こんぴかのお祝い", "配信で名前を呼んで「小さめ落雷！」。勢いよく拍手します。"], ["5K", "一文字だけ変な祝辞", "名前はばっちり。祝辞だけ一文字わざと間違えて、ファミリーにお礼を書きます。"], ["10K", "稲妻の早押しアイコン", "稲妻と早押しボタンを描いた、表示名入りのアイコンです。"], ["20K", "クイズ・大喜利のお題リクエスト", "選んだお題で、早押しクイズか大喜利を配信で一問出します。"], ["30K", "拍手係の記念セット", "好きな稲妻の色で、名前入りアイコンと「拍手係」の賞状画像を作ります。"], ["40K", "ぴかの一人二役大喜利", "配信であなたのお題をぴかが出して、ぴかが回答。名前を呼んでお礼も伝えます。"], ["48K", "あなた杯・大喜利特番", "選んだお題で約5分の大喜利。名前入りの優勝賞状画像と早押しアイコンも付きます。"]]],
  ["しりゅう_08", "しりゅうです。アニメの二周目は、目で追う脇役を一人決めます。黙っていたと思った人が、よく見ると何か言いかけていたり。対戦ゲームでも相手の動きを見すぎて、こっちの反応が一拍遅れます。\n\n釣りには、初めてアジを三尾釣ったときの帽子で験担ぎ。一尾も釣れなかった日に魚屋で二尾買って帰ると、袋をのぞいた家族が「今日すごいじゃん」。黙ってレシートを渡したら「そりゃ大きさも揃うわけだ」。\n\n今は帽子を手に取るたび「海と魚屋、今日はどっち？」と聞かれます。まず海です。あの日の釣果ノートには「アジ、ゼロ」。レシートのほうには二尾。", "夜釣りとアニメ棚", "何も釣れなかった夜の海も、アニメを見返して気づいた脇役の表情も、ここでは話の種。釣りをしない人も、次に観たい一作があれば聞かせてください。結末を話す前には、ひと声かけましょう。", [["1K", "夜釣りの大物コール", "配信で名前を呼んで「今日の大物、来ました」とお祝いします。"], ["5K", "釣果メモのお礼", "印象に残ったやり取りを一つ、釣果メモ風のお礼にしてファミリーに書きます。"], ["10K", "釣り帽子の記念アイコン", "いつもの釣り帽子を描いた、表示名入りのアイコンを作ります。"], ["20K", "今夜のアニメリクエスト", "好みの雰囲気に合うアニメを一作紹介します。結末は伏せます。"], ["30K", "夜の波色アイコンセット", "選んだ夜の波の色で、名前入りアイコンと釣果カード画像をお渡しします。"], ["40K", "脇役の見どころトーク", "好きなアニメを一作聞き、結末を伏せて脇役の見どころを配信で話します。"], ["48K", "夜釣りとアニメの主役回", "釣りかアニメを選んで約5分のお礼トーク。名前入りアイコンと釣果図鑑風カード画像も作ります。"]]],
  ["たいやき＠しっぽ派", "たいやきでも、しっぽでも🐟 商店街を歩くときは、看板を一枚ずつ眺めます。バスケ中継では、コートの端でパスを待つ選手をつい目で追います。たい焼きも、まずは端から。\n\n辛いものはそのうち辛さしか分からなくなるので、辛党の友だちとは甘味屋で合流します。この前も、その友だちに「たい焼き半分こしよ」と言われて手を出したら、しっぽの先がひとかけ。「好きって言ってたでしょ」。うん、あんこが詰まった真ん中も好きです。\n\n今はあんことカスタードを一匹ずつ、同じ袋に入れてもらいます。どっちを引いたかはひと口目のお楽しみ。次に誰かと半分こするなら、私が真ん中から割ります。", "しっぽから商店街", "散歩で見つけたお店や、商店街のおやつの話でひと休み🐟 たい焼きは頭からでもしっぽからでも。詰めてみたい具を教えてね。甘いものも、おかず系も大歓迎。", [["1K", "しっぽからお祝い", "配信で名前を呼び、「今日の一匹、しっぽからどうぞ」とお祝いします。"], ["5K", "しっぽからお礼便", "心に残ったあなたのひと言を添えて、ファミリーに名前入りのお礼を投稿します。"], ["10K", "たい焼き袋のアイコン", "たい焼きの紙袋風アイコンに表示名を入れます。"], ["20K", "たい焼きの具リクエスト", "食べてみたい具を聞き、配信で架空の新作たい焼きに名前をつけます。"], ["30K", "あんこ色かカスタード色", "選んだ色で、名前入りアイコンとたい焼き柄の壁紙を作ります。"], ["40K", "おやつで商店街トーク", "配信で好きなおやつの話をし、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作たい焼きのお披露目", "選んだ具で約5分の配信トークとお礼。名前入りアイコンと手書き風メニュー画像も作ります。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでもどうぞ。夜はひと駅ぶん遠回り。足音が聞こえるくらいの音量で、歌や雑談を聴きます。帰りは街灯や看板が目印。歩数は気にせず、目に留まったものの前で足を止めるくらいがちょうどいいです。\n\n用事が片づかなかった夜の帰り道。配信で一曲歌い終えた枠主さんが「みんな、帰ったら寝ようね」とひと言。言われたとおり、帰ってすぐ布団に入りました。翌朝には、前の晩に手が止まった用事もひとつ片づけられました。\n\n話題に迷ったら「そっち、月見える？」。「こっちは曇り」と返ってくる日も、その人が見上げた空を想像してから、また歩きます。", "月夜の遠回り", "帰り道や寝る前に、夜の歌を一曲。今日ふと目に留まった色の話も聞かせてください。外を歩いている間は聴くだけでどうぞ。返事は家に着いてからで大丈夫です。", [["1K", "遠回りのおかえりコール", "配信で名前を呼び、「おかえり、今夜も遠回り？」とお祝いします。"], ["5K", "月夜のお礼メッセージ", "今日の空がどんな色だったかを添えて、ファミリーに名前入りのお礼を投稿します。"], ["10K", "街灯と三日月のアイコン", "街灯と細い月を描いたアイコンに表示名を入れます。"], ["20K", "帰り道の選曲リクエスト", "気分や好きな夜景に合わせ、夜道に似合う一曲を配信で紹介します。"], ["30K", "夜空の色を選べるセット", "選んだ色で、名前入りアイコンと月明かりのスマホ壁紙を作ります。"], ["40K", "夜景のお礼朗読", "好きな夜景を題材に書いたお礼を、名前を添えて配信で読みます。"], ["48K", "遠回りの月夜便", "選んだ夜景で約5分の配信トークとお礼の朗読。名前入りアイコンと、朗読の一文を載せた壁紙も作ります。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間に枠をのぞきます。急に黙ったら、たぶん両手がふさがってます。手書きの看板は、値段を書き直した跡まで見る派。バレー観戦の点数も手書きで記録します。時間制限つきのパズルは、残り秒数が目に入ると答えが飛びます。\n\nある日、枠で「おかえり」を「おかわり」と打ちました。それから顔を出すたび「大盛りにする？」。私も「漬物つけて」と乗っていたら、初見さんが「おすすめは？」。注文の話であんなに盛り上がっていたのに、そこで全員黙りました。\n\n次は「舞茸の天ぷらです」と答えます。看板には品名まで書きました。値段はまだ空欄。「いくら？」って聞かれたら、また黙ります。", "おかわり休憩所", "作業の合間に一息🍄 ゲームの進み具合も、送ったあとで気づいた誤字も、休憩中に聞かせてください。「おかわり」と打っても、ちゃんと「おかえり」って返します。", [["1K", "コア達成をセーブ", "配信で名前を呼び、「コア達成、セーブしました！」とお祝いします。"], ["5K", "おかわりの一行お礼", "覚えているコメントを一つ添え、ファミリーに名前入りのお礼を投稿します。"], ["10K", "セーブ画面風アイコン", "表示名を入れた、ゲームのセーブ画面風アイコンを作ります。"], ["20K", "今日のおかわり任務", "選んだ雑談のお題で、配信中に短い「休憩クエスト」に挑みます。"], ["30K", "任務名入りの画像セット", "好きなゲーム風の配色で、名前と任務名入りのアイコン、セーブ伝票の画像を作ります。"], ["40K", "あなた発の休憩ステージ", "選んだお題で配信のミニ企画を一つ。クリアしたら、名前を呼んでお礼を伝えます。"], ["48K", "クリア記念のおかわり回", "配信で約5分のゲーム風企画とお礼。名前入りアイコンと任務名入りのクリアカード画像も作ります。"]]],
  ["こうめい＊", "こうめいです。歴史小説を読むと、負けた側が何を考えていたかが気になります。ボードゲームの説明書には、遊んだ日を書いた付箋を一枚ずつ。早押しクイズでは、出題者の狙いを考えているあいだに、隣から正解が聞こえます。\n\n小学生を相手に、ボードゲームの次の作戦を得意げに話していたら、その子が盤面を指して「僕の番だよね。ここに置けば勝ちだよ」。私が「それを確認してたんだよ」と強がると、「じゃあ僕の番も確認して」。その日は、負けた側の気持ちがよく分かりました。\n\nそれから座右の銘は「作戦より先に盤面を」。お風呂が先か、ごはんが先か。最近では、うちの作戦会議もごはんが冷める前に決着をつけます。", "一手先の円卓", "ボードゲームも歴史も、円卓では「自分ならどうする？」から。駒の動かし方を聞くだけでもどうぞ。私が作戦を長々と語り始めたら、遠慮なく「そろそろ次の手」と声をかけてください。", [["1K", "円卓にお迎え", "配信で名前を呼び、「本日の作戦会議へようこそ」とお祝いします。"], ["5K", "軍師の一行お礼", "今月の気配りや面白かったひと言を取り上げ、ファミリーに名前入りのお礼を投稿します。"], ["10K", "盤面と駒のアイコン", "盤面と駒を描いたアイコンに表示名を入れます。"], ["20K", "軍師のお題リクエスト", "日常の迷いごとを一つ聞き、配信で軍師になりきって作戦を考えます。"], ["30K", "選べる陣営カラー", "好きな色で、名前入りアイコンと作戦図風の記念カード画像を作ります。"], ["40K", "円卓の好プレー表彰", "助けてもらった場面や心に残ったひと言を振り返り、配信であなたの一手をたたえます。"], ["48K", "円卓の作戦会議", "日常の相談か歴史をお題に、配信で約5分の作戦会議とお礼。名前入りアイコンと軍師の感謝状画像も作ります。"]]],
  ["れん_07", "れんです。ライブハウスでは、肩がぶつからない後ろの端が定位置。冬は開演までホットコーヒーで手を温めます。奥田民生さんの曲では、歌のすき間で鳴るギターが好き。中古CD屋で気になった曲は題名をメモして、帰り道に聴きます。\n\nある晩、ボーカルが客席にマイクを向けました。前のほうから歌声が広がって、気づけば後ろの僕まで歌っていました。客席をうれしそうに見渡していたボーカルは、歌に戻るタイミングを逃して、マイクを持ったまま照れ笑い。今もその曲を聴くと、同じところであの日の客席の声が聞こえる気がします。\n\n枠では挨拶のあとは聴くほうです。誰かが「ここの間奏、いいよね」と言うまでは。", "ギターが鳴る後列", "ライブ帰りのメモに一場面だけ残すとしたら、どこですか？ 後ろまで響いたギターも、客席が息をのんだ瞬間も聞きたいです。家でつい巻き戻す間奏の話もぜひ。", [["1K", "後列まで届くお祝い", "配信でライブのMC風に名前を呼び、「後ろまで届いてます！」とお祝いします。"], ["5K", "ライブ半券のひと言", "今月の思い出を一つ添え、名前入りのお礼をファミリーに書きます。"], ["10K", "ギターと半券のアイコン", "ギターとライブ半券を描いた、表示名入りのアイコンをお渡しします。"], ["20K", "聴きたい音リクエスト", "好きな楽器を聞き、その音がよく聴こえる一曲を配信で紹介します。聴きどころもお話しします。"], ["30K", "ライブカラーの画像セット", "好きな差し色で、名前入りアイコンと、おすすめ二曲を載せた半券画像を作ります。"], ["40K", "終演後のお礼MC", "選んだ音楽のお題で終演後のMC風に話し、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "アンコールのミニトーク", "希望の選曲テーマで約5分のお礼トーク。名前入りアイコンとセットリスト画像付き。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」。食べ物の話だと質問が二つ続く、じにです＊ 日村勇紀さんがうまそうに食べるのを見ると、こちらまで何か買いに出たくなります。一軒でお腹を満たしたら、あとは近所をぶらぶら。気になる場所は地図にピンを立てます。\n\nある日、地図の「絶対また行く」を頼りに、前に食べたたこ焼きを目指しました。席についてメニューを開くと、ずらっと定食。せっかくなので一つ頼んで、食べ終えて店を出たら、角の先からソースのいい匂い。やっと思い出しました。ピンを立てたのは、たこ焼き屋へ曲がる目印の店。\n\n角を曲がって、たこ焼きも買いました。地図を直すつもりで開いたのに、今は二軒とも「絶対また行く」。あの定食、もう一度食べたい。", "よりみち地図帳", "帰り道につい買うおやつや、旅先でふらっと入った店の話を集めています。いつもの注文も、地元ならではの食べ方もぜひ。店名が思い出せない日は「次もこれ頼む！」と思った一品だけでも＊", [["1K", "寄り道先からお祝い", "配信で名前を呼んで「本日の寄り道、いらっしゃい」とお迎えします。"], ["5K", "地図ピンのお礼メモ", "会話で聞いたおいしそうなひと言を添え、名前入りのお礼をファミリーに書きます。"], ["10K", "おやつと地図ピンのアイコン", "好きなおやつと地図ピンを描いた、表示名入りアイコンをお渡しします。"], ["20K", "寄り道のおやつ選び", "甘いもの派か、しょっぱいもの派かを聞いて、寄り道のおやつを一つおすすめします。"], ["30K", "寄り道地図の画像セット", "好きなおやつを描いた名前入りアイコンと、地図帳風のスマホ壁紙を作ります。"], ["40K", "ご当地おやつのお礼トーク", "好きなご当地おやつを一品聞き、配信でその話と今月のお礼をお届けします。"], ["48K", "商店街の寄り道特番", "好きなおやつで約5分の寄り道トーク。名前入りアイコンと架空の寄り道マップ画像付き。"]]],
  ["港レター_", "みなとです。港町に泊まった朝は、焼きたての塩パンを探します。速い曲を聴くと足までつられるので、散歩のときはイヤホンを外して。波の音に店のシャッターを開ける音が混じると、街が起きた合図です。\n\n旅先から自分宛てにはがきを出したことがあります。「明日の朝、港で塩パンを買う」。翌朝、まだ温かい紙袋を手に港を歩きました。家のポストにはがきが届いたのは、その数日後。はがきの中の私は、まだ明日の朝を待っています。「買えたよ。おいしかったよ」と、つい返事を書きたくなりました。\n\n次のはがきには「家族にも塩パンを買う」。帰りの電車で紙袋を開けずにいられますように。みなとより。", "海辺のポスト", "「朝七時、踏切の近くで焼きたてのパンの匂い」。歩いていてふと気づいた音や匂いを集めるポストです。旅の途中でも、いつもの通勤路でも。時刻を覚えていたら添えてください。", [["1K", "港からお祝いの声", "配信で名前を呼び、「今日も港に寄ってくれてありがとう」とお祝いします。"], ["5K", "海辺の一行はがき", "心に残った話を一つ添え、名前入りの短いお礼をファミリーに書きます。"], ["10K", "海辺の消印アイコン", "海辺の消印をあしらった、表示名入りアイコンをお渡しします。"], ["20K", "はがきの題材リクエスト", "好きな音や匂いを一つ取り入れた短い旅の便りを、配信で読みます。"], ["30K", "朝焼けと夕暮れの絵はがき", "朝焼けか夕暮れか、お好きな方で名前入りアイコンと海辺の絵はがき画像を作ります。"], ["40K", "あなた宛ての港レター", "選んだ風景をもとにお礼の便りを書き、名前を添えて配信で読みます。"], ["48K", "海辺のポスト特番", "選んだ旅のテーマで約5分の雑談と朗読。名前入り消印アイコンと、便りを載せた絵はがき画像付き。"]]],
  ["けんし♪", "イントロは分かる。サビも歌える。曲名だけ出てこない。けんしです♪ 秋のドライブでひと休みするときは、車を停めて塩むすび。食べながら帰りの一曲を選びます。登場人物の多い歴史小説でも、名前が出るたび「あれ、誰だっけ」と前のページへ。\n\nカラオケで珍しく曲名を思い出して、すぐ予約。イントロが流れたけど、待っても知ってるメロディーが来ません。同じ題名の別の曲でした。「これ歌える」と友人がマイクを取ったので、僕は横でタンバリン。「僕の歌詞は全部シャンシャンです！」\n\n次のカラオケで友人が「あれ入れてね」。僕の入れ間違いで、友人の十八番が一曲増えました。最近は曲名と歌手名を見てから予約します。タンバリンは先に取ります。", "サビから歌う会", "サビが来たら、つい一緒に歌い出すのはどの曲ですか♪ カラオケの十八番も、帰りの車で口ずさむ歌もどうぞ。合いの手を入れたい曲でも、黙って何度も聴き返す曲でも。一曲、聞かせてください。", [["1K", "シャンシャンでお祝い", "配信で名前を呼んで、口タンバリンの「シャンシャン！」でお祝いします。"], ["5K", "十八番のお礼メモ", "教えてくれた音楽の好みを一つ添え、名前入りのお礼をファミリーに書きます。"], ["10K", "タンバリンと音符のアイコン", "タンバリンと音符を描いた、表示名入りアイコンをお渡しします。"], ["20K", "帰りの一曲リクエスト", "ドライブの気分を聞いて、帰り道に似合う一曲を配信で紹介します。"], ["30K", "ラジオ番組表の画像セット", "好きな色で、名前入りアイコンと二曲を載せたラジオ風の番組表画像を作ります。"], ["40K", "ラジオ風のお礼DJ", "好きなジャンルから二曲選び、配信でDJ風に紹介してお礼を伝えます。"], ["48K", "あなたが選ぶ夜ラジオ特番", "選んだテーマで約5分のラジオ風トーク。名前入りアイコンと記念の番組表画像付き。"]]],
  ["かんうどん🍜", "「かけ、ちくわ天、ねぎ多め」。いつもの注文はこれです。かんです🍜 初めての店では、麺より先にだしをひと口。郷土料理の本で知らない具を見つけると、その土地まで食べに行きたくなります。\n\n白いシャツにカレーうどんの汁を飛ばした翌週、黒いシャツで同じ店へ。「前と同じので？」に、いつものかけのつもりでうなずきました。湯気の向こうに見えたのは、あのカレーうどん。店主が僕のシャツをちらっと見て「今日は黒でよかったね」。そこまで覚えてたんだ。\n\nうどんの写真には、だしと具をメモします。カレーうどんだけ、最後にもう一行。「次も黒」。", "ねぎ多めの席", "かけ、ねぎ多め。うどん一杯から話が広がります🍜 麺の太さ、だしの色、地元で人気の天ぷら。「うちは卵を落とすよ」みたいに、いつもの一杯を聞かせてください。明日のお昼が決まるかも。", [["1K", "ねぎ多めでお祝い", "配信で名前を呼び、「ねぎ多めで一杯！」と拍手します。"], ["5K", "店主のお礼メモ", "店主になりきり、あなた宛てのお礼をファミリーに一言書きます。"], ["10K", "うどん札のアイコン", "丼とちくわ天を描いた、表示名入りのアイコン画像を作ります。"], ["20K", "薬味のおすすめ", "好きなうどんの具を聞いて、合いそうな薬味を配信で一つ提案します。"], ["30K", "のれん色のお品書きセット", "好きなのれんの色で、名前入りアイコンとスマホ用のお品書き画像を作ります。"], ["40K", "あなた好みの一杯", "好きなだしと具の組み合わせを配信で紹介し、名前を呼んでお礼を伝えます。"], ["48K", "うどん屋の主役メニュー", "好きな具をお題に約5分の配信トークとお礼。名前入りアイコンと、考えた一杯のメニュー画像も作ります。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話は、いつまでも聞いていられます。数式が続く天文学の本は、そっと閉じます。晴れた休日は、星が見えた時刻と方角をメモ。流星を待ちながら、時計を見ずに三十秒ずつ数えます。\n\nある晩、流星が見えて「あっ」。隣の友人も同時に「あっ」。「見つけた？」「うん！」。同じ流星を見たと思っていたら、帰り道に友人が缶を掲げました。「探してたぶどうジュース、あそこの自販機にあったよ」。次は「何を？」まで聞きます。\n\n月と深海、行けるなら私は月。できれば窓側でお願いします。着いたら、いつもどおり方角までメモするつもりです。月でどっちが北かは、まだ知りません。", "土星の窓側席", "「コンビニの上で星が光ってた」。そんな観測メモを持ち寄る場所です◎ 今夜見えたものを、窓側で聞かせてください。月行きと深海行き、あなたならどっちの窓から外を眺めたいですか？", [["1K", "窓側へお迎え", "配信で名前を呼び、「今夜の窓側、空いてます」とお祝いします。"], ["5K", "星便りでひと言", "今月の思い出を一つ添え、お礼の星便りをファミリーに書きます。"], ["10K", "土星の輪のアイコン", "土星の輪に表示名を入れたアイコン画像をお渡しします。"], ["20K", "空のお題リクエスト", "気になる空の色や天体を聞き、配信で話します。"], ["30K", "選べる星空セット", "土星と月から好きなほうを選べます。名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "月・深海のお礼ガイド", "月か深海、選んだ行き先を配信で案内し、お礼を伝えます。"], ["48K", "月か深海へ出発", "選んだ行き先で約5分の配信トーク。名前入りアイコンと、架空の旅のしおり画像をお渡しします。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。洗いたての綿の毛布にくるまって、だいたい布団から配信をのぞいてます。「おやすみ」を打とうとして寝落ちすると、次のあいさつは「おはよう」です。\n\nお正月は、お雑煮のひと口目に「今年もよく食べて、よく眠れますように」。甘い黒豆は少し苦手ですが、お餅には目がありません。一つ食べ終えて箸を伸ばすと、だしの底にもう二つ。家の人が、子どもの頃に私が言った「一つじゃ足りない」を覚えてくれていました。\n\nうれしくて三つとも完食。布団に入る時間までお腹いっぱいでした。翌朝の「今日も三つ？」には、寝ぼけず「一つでいい」と答えました。", "毛布ときなこの部屋", "きなこ餅をお供に、毛布の中からこんばんは。「うちは丸餅」「焼いてから入れるよ」。お雑煮の話は眠くなるまで。続きはまた明日。", [["1K", "毛布の中から小さな拍手", "配信で名前を呼び、目が覚めないくらいの拍手でお祝いします。"], ["5K", "おやすみの一行", "ファミリーに名前入りのお礼を一行残します。寝る前にどうぞ。"], ["10K", "きなこ餅のアイコン", "きなこ餅と毛布の柄で、表示名入りのアイコン画像を作ります。"], ["20K", "冬のお題リクエスト", "お雑煮や冬の寝支度など、選んでもらったお題を配信で話します。"], ["30K", "選べる毛布柄セット", "好きな毛布の色で、名前入りアイコンとひと言付きのスマホ用壁紙を作ります。"], ["40K", "眠る前のお礼トーク", "好きな冬の話題でゆっくり雑談し、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "毛布の中のお礼会", "選んだお題で約5分の配信トークとお礼。名前入りアイコンと、おやすみの言葉を添えた壁紙も作ります。"]]],
  ["いかいかが？", "いかです🦑 水族館では、説明板はあと回し。まず一匹だけ選んで、ガラス越しに目で追います。長編ミステリーでは途中で誰が誰だか分からなくなりますが、水槽なら目の前の一匹が今日の主役です。\n\nエイに手を振りながら、隣の友人に「エイ語、習ってます」。振り返してくれたのは、水槽の向こうの子どもでした。もう一度振ると、その隣のお母さんも。エイはその間にするっと奥へ。字幕を付けるなら「エイ語の先生、先に帰る」。\n\n配信では、天気から始めた話が気づけば深海まで泳いでいきます。そちらの空模様、いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 岩陰から魚が顔だけちらっ。あなたなら何て字幕を付けますか？ 魚の名前が分からないときは、色や動きを教えてください。一緒に考えます。", [["1K", "クラゲ前へお迎え", "配信で名前を呼び、「クラゲ前でひと息、いかがですか」とお祝いします。"], ["5K", "水槽からの一行お礼", "クラゲやエイになりきり、名前入りのお礼をファミリーに一行書きます。"], ["10K", "水槽プレート風カード", "好きな水の生き物と表示名を入れた、解説プレート風のカード画像を作ります。"], ["20K", "水槽の字幕リクエスト", "選んだ生き物のしぐさに字幕を考え、配信で読み上げます。"], ["30K", "選べる水槽画像セット", "クラゲかエイを選べます。名前入りアイコンと水槽プレート風のカード画像を作ります。"], ["40K", "二匹の水槽ガイド", "好きな生き物を二つ選んでください。配信でガイド風に紹介し、名前を呼んでお礼を伝えます。"], ["48K", "クラゲ前の特別ガイド", "好きな生き物をお題に、配信で約5分の水族館トーク。名前入りアイコンと字幕付き水槽カード画像も作ります。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 温かいマグを両手で包んで、夜のバラードを一曲。声が入る直前の、息を吸う音まで聴きたいから、いつもの速さで再生します。\n\nある夜、歌枠で感想を書いては消しているうちに、次の曲が始まりました。結局送ったのは「さっきの曲、二番に入る前の息づかいが好きでした」の一行。歌い終えた枠主さんがコメントを読んで、「あそこ、落ち着こうと思って息を吸ったんだ」。私が聴いていたところが、一行で伝わってうれしかったです。\n\nふとマグを持ち上げたら、もう湯気がありませんでした。今夜は、曲が始まる前にひと口。", "雪あかりの歌席", "温かい飲み物を片手に、夜のバラードを❄ 「二番の前の息が好き」くらいの短い感想も、聞かせてもらえたらうれしいです。今日は聴くだけ、という夜もどうぞ。", [["1K", "雪あかりの乾杯", "配信で名前を呼び、温かい飲み物で小さく乾杯します。"], ["5K", "一行のおつかれさま", "今日のあなたに「おつかれさま」を一行、ファミリーに書きます。"], ["10K", "雪とマグのアイコン", "雪あかりとマグを描いた、表示名入りのアイコンです。"], ["20K", "夜のバラードリクエスト", "気分に合う一曲を選び、声の入り方や息づかいなど、聴きどころを配信で紹介します。"], ["30K", "色が選べる便箋セット", "雪色か灯り色を選べます。名前入りアイコンと、お礼を書いた便箋画像をお渡しします。"], ["40K", "あなたへのお礼の手紙", "今月の思い出をつづったお礼の手紙を、配信で名前を呼んで読みます。"], ["48K", "雪あかりの朗読会", "好きな冬景色をお題に、約5分の雑談と手紙の朗読。名前入りアイコンと便箋画像もお渡しします。"]]],
  ["じゃっくん☆", "はーい、参戦します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームが好きで、人のボケにはつい一行足します。年末は友だちとゲームで遊び納め。来年も笑いたいひと言は、その場でメモします。\n\nある対戦で、画面の真ん中のキャラが相手を追い詰めていたので「勝った！」。隣の友だちが「そっち俺」。画面の端を見たら、僕のキャラはとっくに負けてました。それ以来、喜ぶ前に自分のキャラの色を確認します。\n\n休憩では、苦手なレーズンクッキーを友だちの皿へ。「おっと、ここでクッキーが移籍です！」。友だちが黙って一枚食べたので、移籍成立です。", "とりあえず参戦部", "冷蔵庫を開けたら実況開始。最後のプリンが消えていたら大喜利です🙌 誰かのボケに一言足せそうなら、すかさず参戦。まずは「座布団一枚！」係からでもどうぞ。", [["1K", "種目はあとで、まず拍手", "配信で名前を呼んで拍手。「種目はあとで決めます！」"], ["5K", "日常の一行表彰", "最近できた小さなことに競技名を付けて、名前と一緒にファミリーで表彰します。"], ["10K", "メダル風の表彰カード", "表示名と架空の競技名を入れた、メダル風のカード画像です。"], ["20K", "実況種目のリクエスト", "選んだ日常の出来事を一つ、配信でスポーツ中継風に実況します。"], ["30K", "金か銀の表彰セット", "金か銀を選べます。名前入りアイコンと、競技名入りの表彰状画像をお渡しします。"], ["40K", "あなたの二種目実況", "配信で日常の出来事を二つ実況。最後に名前を呼んで表彰します。"], ["48K", "決勝特番の主役選手", "選んだお題で約5分の実況と表彰。名前入りアイコンと大会結果カード画像もお渡しします。"]]],
  ["さなだんご。", "さなです。だんごと呼ばれても振り向きます。休みの朝はパン屋さんへ。平野レミさんの料理番組を観ると、私も何か作りたくなります。クッキーはバターがふわっと香るものが好き。シナモンが強いと、香りだけでお腹いっぱいです。\n\n焼きすぎたクッキーを「端っこの焼き色がちょっと濃いよ」と友だちに渡したら、空っぽのお皿の写真と「次は倍で」が届きました。張り切って二回に分けて焼くと、二回目の天板だけまたこんがり。袋を分けて渡しました。「まず一枚、味見しよ。こっちは端っこ好き用ね」\n\n今は、天板を入れるたびにタイマーをかけます。人に渡す分とは別に、私の味見の一枚も焼きます。そっちは袋に入る前になくなります。", "焼きたてひと皿", "パン屋さんの新作でも、家で焼いたおやつでも。ひと口目、どうでした？ 「いつものクッキーに塩をひとつまみ」みたいな工夫も聞きたいです。こんがりした端っこが好きな方、いらっしゃい。", [["1K", "焼きたての味見係へ", "配信で名前を呼んでお祝い。「今日の味見係さん、ありがとう」"], ["5K", "ひと皿のお礼便り", "心に残ったやり取りを一つ添えて、あなた宛てのお礼をファミリーに書きます。"], ["10K", "パン袋ラベルのアイコン", "パン袋のラベルをかたどった、表示名入りのアイコンです。"], ["20K", "隠し味リクエスト", "選んだおやつに合う隠し味を、配信で一つ提案します。"], ["30K", "柄が選べるラベルセット", "パン柄かクッキー柄を選べます。名前入りアイコンとオリジナルのラベル画像を作ります。"], ["40K", "あなたの味見トーク", "好きなおやつと食感を聞き、配信でその話をしながら今月のお礼を伝えます。"], ["48K", "あなたの名物おやつ会", "好きな味で約5分のおやつ談義。お礼に、名前入りアイコンと架空のおやつのラベル画像を作ります。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方は洗濯物をたたむ手を止めて、枠で「おつかれ〜」。家事のあとには暮らしのエッセイを一篇。季節限定のおやつを買った日は、ラベルをノートに貼って日付を書きます。\n\n甘いゆず味を探して、三軒目で大きな「ゆず」の文字を発見。やっと買えたと思って、帰ってひと口。ゆず胡椒味でした。辛いのが苦手で水を飲んでいたら、家族が隣で甘いゆず味の袋を開けました。「同じ店にあったよ。袋の文字、最後まで読んだ？」\n\nノートに二枚のラベルを並べて、「探した味」「探してない味」。辛いほうを気に入った家族には「今度はわざと買ってね」と頼まれました。", "ゆず色おつかれ会", "家事の合間に聴きたい歌や、スーパーで見つけたおやつの話をしましょ🍊 来たら「おつかれ〜」の一言から。好きな曲が流れたら、洗濯物はあと一枚でも、先に曲を聴こ。", [["1K", "夕方のおつかれ拍手", "配信で名前を呼んでお祝い。「片付けはあとで。まず拍手！」"], ["5K", "ひと休みのお礼", "夕方ひと息つくときに読めるお礼を、ファミリーに一言書きます。"], ["10K", "ゆず色の夕焼けアイコン", "柑橘と夕焼けを描いた、表示名入りのアイコンです。"], ["20K", "ひと息の選曲リクエスト", "散歩か家事の合間かを聞き、その時間に合う曲を配信で一つ紹介します。"], ["30K", "柑橘色の待ち受けセット", "ゆず色かみかん色を選べます。名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "あなた宛て夕方ニュース", "今月の頑張りを夕方のニュース風に紹介し、配信で名前を呼んでお礼を伝えます。"], ["48K", "おつかれ特番の主役", "好きな話題で約5分のおつかれ特番。名前入りアイコンと「本日の家事終了」の画像もお渡しします。"]]],
  ["のぶにゃがฅ", "のぶでも、にゃがでも。夜の枠にしれっとおりますฅ 武将の書状は、最後の頼みごとまで読む派です。うちの書き置きもこの調子。「猫殿におやつは進呈済み。重ねて出されぬよう」。\n\n太鼓の音が苦手で、時代ものは音量を控えめに。ある日、武将が大事な台詞を言いかけたところで、猫殿がテレビの前を横切りました。巻き戻しても、同じ台詞でまたお出まし。三度目、武将が口を開いたとたん、家族そろって猫殿が現れるほうを見ていました。\n\n人が画面の前を通ると、つい「参戦ですか？」。猫殿がお通りのときは、黙って席を譲ります。", "ねこ殿の書状部屋", "夜更けの評定に、武将の書状で好きな一言や、わが家でいちばん偉そうな猫の話を持ち寄りませんか。「うちの猫殿は箱から動きません」も立派な議題。猫の話が出た日は、だいたい延長ですฅ", [["1K", "猫殿と座布団を半分こ", "配信で名前を呼び、「座布団は猫殿と半分ずつで」とお祝いします。"], ["5K", "猫殿の一行書状", "猫殿に代わり、名前入りのお礼を一行、ファミリーにしたためます。"], ["10K", "肉球の花押アイコン", "猫殿の肉球をサインに見立てた、表示名入りのアイコン画像を贈ります。"], ["20K", "猫殿が授ける二つ名", "好きな猫のしぐさにちなんで、配信で武将風の二つ名を一つ考えます。"], ["30K", "色を選べる家紋セット", "選んだ色で、名前と二つ名入りの家紋アイコンと、猫殿の書状画像を作ります。"], ["40K", "猫殿のお礼評定", "今月のうれしかったことを配信で振り返り、名前を呼んで猫殿に代わりお礼を伝えます。"], ["48K", "お城の任命式", "配信で約5分のお礼会を開き、選んだ城名を発表。名前入り家紋アイコンと任命状画像を贈ります。"]]],
  ["ぜうす_", "ぜうす。呼び捨てでどうぞ。コーヒーは深煎り。映画館の照明が落ちて、ざわめきがすっと引く瞬間が好きです。半券の裏には、もう一度観たい場面を一つ。「あの人はこう思っていた」と解説に書いてあると、あれだけ長い沈黙には別の理由もありそう、と考えます。\n\n帰りの電車で、友人と「あの人、最後に何を考えてたんだろう」。話は弾んだのに、降り際に名前を出したら、別々の人物の話でした。次の映画では、先に名前を確認。今度は同じ人物でしたが、思い浮かべていた場面が違いました。\n\n座右の銘は「まず、誰の話か」。最近は「あと、どの場面か」までセットです。", "深煎りの上映後", "深煎りを片手に、上映後も気になる場面の話を。「ほっとした顔だった」「何か隠してると思った」。表情やしぐさのどこでそう見えたか、聞かせてください。結末の話は、みんなが観てから。", [["1K", "エンドロールでお祝い", "配信で名前を呼び、「今日もエンドロールまでありがとう」と伝えます。"], ["5K", "深煎りの一行お礼", "心に残った感想を一つ添えて、名前入りのお礼をファミリーに書きます。"], ["10K", "映画半券のアイコン", "半券とコーヒーを描いた、表示名入りのアイコン画像を贈ります。"], ["20K", "好みに合う映画一本", "好きなジャンルから映画を一本選び、結末は伏せて配信で紹介します。"], ["30K", "色が選べるエンドカード", "好きな差し色で、名前入り半券アイコンとエンドカード風のスマホ壁紙を作ります。"], ["40K", "あなたの編集会議", "選んだ場面の見方を、結末を伏せて配信で二通り紹介します。名前を呼んでお礼も伝えます。"], ["48K", "二重エンドの上映後トーク", "配信で約5分、好きな話題で上映後トーク。名前入りアイコンと題名を二つ載せたタイトル画像を贈ります。"]]],
  ["りさっち＊", "りさっちです☺️ カフェめぐりが好き。気に入ったカップは、飲み干してから底の印まで見ます。飲む前に写真を撮ろうと決めたものの、三日目に撮れたのはレシートだけ。私のカフェ記録はそこでおしまいです。\n\nドラマの最終回の日は、推しの幸せを願って、友だちといつもの店で一杯。「推しが同じだね」と盛り上がった直後、友だちが「でも、同僚だったら困るよね」。私は場面を一つずつ思い出してかばいました。言い終えてカップを持ち上げると、コーヒーはすっかり冷めてました。\n\n最終回を観ても、二人とも推しは変わらず。もし同じ職場になったら、私も隣の席はそっと避けるかも。", "いつものカフェ席", "いつものカフェ席で、ドラマの感想やリップの話を☺️ 「推しにはこの色が似合いそう」から、つい話が弾みます。ドラマを観ていない日は、手元のカップの柄から話そうね。", [["1K", "いつもの席でお祝い", "配信で名前を呼び、「いつもの席、空けときました」とお迎えします。"], ["5K", "カップにひと言", "今日の気分に合わせて、名前入りのお礼をファミリーに書きます。"], ["10K", "注文シール風アイコン", "カップの注文シールに表示名を書き込んだ、カフェ風のアイコン画像です。"], ["20K", "カフェの話題リクエスト", "ドラマかリップを選んでください。配信であなたの好みを聞きながらおしゃべりします。"], ["30K", "リップ色のカップセット", "好きなリップの色を差し色に、名前入りアイコンとカップ柄のスマホ壁紙を作ります。"], ["40K", "あなたに似合う一杯", "好みに合わせて架空のドリンクを考え、配信で名前を呼んで紹介し、お礼を伝えます。"], ["48K", "カフェの主役コーナー", "好きな話題で約5分、配信でカフェ気分のおしゃべり。名前入りアイコンと限定メニュー画像を贈ります。"]]],
  ["ちょぱ丸_", "コンビニまで往復十分。寄り道込みなら三十分。ちょぱ丸です。卓球では相手のラケットに気を取られて、目の前を球がすっと通り過ぎます。\n\n前に寄った商店街のお店へ、友だちを案内したときのこと。「猫がいるところね」と猫ばかり探していたら、肝心の店を通り過ぎました。地図を見て引き返し、買い物を済ませて外へ出ると、店先に猫が。「ピンポーン。目印、ただいま出勤しました」。友だちが一言。「赤いのれんは開店から仕事してたけどね」。\n\nアニメでは、誰かが振り向く瞬間に低い音が鳴るのが好きです。グミの白い粉を砂糖だと思ってかじった日は、口いっぱいに酸っぱさが広がって、効果音なしでも一瞬で目が覚めました。", "寄り道アニメ部", "「あの音がしてから振り向いたよね」。アニメを観て気づいたことを一つ、持ち寄りませんか。推しが多い人は、今日の一人から。商店街のおやつまで話が飛んだら、一緒に寄り道しましょう。", [["1K", "寄り道先からピンポーン", "配信で名前を呼び、「ピンポーン、寄り道先でお迎えです」とお祝いします。"], ["5K", "猫は不定休のお礼便", "「目印の猫は不定休」を添えて、あなた宛てのお礼をファミリーに投稿します。"], ["10K", "赤いのれんの待ち受け", "赤いのれんと猫を描いた、表示名入りのスマホ壁紙を作ります。"], ["20K", "推しの見どころリクエスト", "好きな作品を聞いて、印象に残った場面や演出を配信で一つ取り上げます。"], ["30K", "寄り道番組表セット", "好きな色で、名前入りアイコンと寄り道の番組表風カード画像を作ります。"], ["40K", "あなたの寄り道外伝", "推し作品か町のおやつを選んで配信で外伝トーク。名前を呼んで今月のお礼も伝えます。"], ["48K", "寄り道特番の主役", "選んだお題で約5分、配信でアニメ風雑談。名前入りアイコンと寄り道マップ画像を贈ります。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 地図に空白が残っていれば、扉一枚のために引き返します。回復薬は決戦まで温存いたします。\n\n同行者に「そろそろ決戦へ」と促され、近道を選んだ日。同じ崖から二度落ちました。ようやくたどり着いたボス戦は、わずか二分。回復薬は一つも減っておりません。\n\nありふれた注意書きを決戦の口上に仕立てるのが得意です。では、低い声で。「足元をご確認くださいませ」。あの崖の手前にも、一枚立てておきたかったものでございます。", "決戦前の休憩室", "決戦前にひと休み。お気に入りのボス戦の効果音や、手こずった難所をお聞かせください。開かないジャムのふたも立派な難所でございます。わたくしが攻略を考える間に、お茶をどうぞ。", [["1K", "ご来城のお祝い", "配信でお名前を呼び、「本日もご来城ありがとうございます」とお迎えします。"], ["5K", "ラスボスから一行のお礼", "お名前を添え、丁寧すぎるほどのお礼をファミリーに記します。"], ["10K", "勇者の名前入りアイコン", "紋章と橋を描いたアイコンに表示名を入れてお渡しします。"], ["20K", "勇者の称号授与", "最近できたことを伺い、それにちなんだ称号を配信でお授けします。"], ["30K", "選べる紋章セット", "紋章の色を選べます。名前入りアイコンと称号入りの達成証画像を作ります。"], ["40K", "決戦前の二役寸劇", "お選びの決めゼリフで勇者とラスボスを演じ、配信でお礼をお伝えします。"], ["48K", "王国の授与式", "お好きなお題で約5分のゲーム風トークと称号発表。名前入りアイコンと感謝状画像もお贈りします。"]]],
  ["simba_", "シンバです。休日は行き先を一つだけ決めて車を出します。運転中は静かな曲を。ビッグバンドを流すと、つい演奏に聴き入っちゃうので。休憩のお供はたまごサンドです。\n\n海へ行った日、友だちと空いていたベンチに座りました。目の前は駐車場で、肝心の海は背もたれの向こう。おかしくなって海と愛車を一枚ずつ撮りました。帰って駐車場の写真を開いたら、あのときの笑い声まで思い出しました。\n\n動物園でも、水槽の前で足が止まります。ペンギンが目の前をすいっと横切る瞬間を待つうち、次の場所に着く予定時刻はとっくに過ぎています。いい休憩も旅のうち、です。", "停車中の見晴らし席", "車を降りてようやく見えた景色や、水槽の前で予定より長く過ごした話を聞かせてください。遠出しなかった日は、いつもの道で立ち止まった場所を一つ。たまごサンドを片手に待ってます。", [["1K", "見晴らしの席で拍手", "配信で名前を呼び、「景色がいいので、ここで拍手」とお祝いします。"], ["5K", "車窓からのひと言", "今月の会話を一つ添え、名前入りのお礼をファミリーに残します。"], ["10K", "見晴らしアイコン", "ペンギンや海辺を描いた、表示名入りのアイコンをお渡しします。"], ["20K", "次の寄り道リクエスト", "好きな景色を聞き、立ち寄ってみたい場所を配信で一つ紹介します。"], ["30K", "選べる風景セット", "海か動物園を選んで、名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなたの景色で休憩トーク", "選んだ景色から配信でドライブの話を広げ、名前を呼んでお礼を伝えます。"], ["48K", "見晴らしの寄り道特番", "好きな寄り道を聞いて約5分のドライブトーク。名前入りアイコンと風景カード画像を贈ります。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白い照明はまぶしいので、机の手元だけ灯します。バターがすっと溶ける焼きたてのトーストが好き。配信に聞き入ると、ひと口目にはもう冷めています。\n\n昔のゲームの続きを開きました。最後の城の手前まで来たはずが、読み込んだ先は最初の村。懐かしくて村を一周し、そこでセーブしました。好きな場所なら、戻ったぶんも進んだうち。\n\nゲームの曲は、流れた場所と一緒にメモします。あの夜は「最初の村、宿を出てすぐ」。曲名を調べたのは三晩目。それまでは曲が聴きたくなるたびに、ゲームを起動して村を一周していました。", "夜更けのセーブ地点", "作業中に聴くゲームの曲や、セーブしておきたい景色の話を。「雨がやまない村」「宿屋の明かり」。地名がうろ覚えでも、目に浮かんだものを一つ。今夜は耳だけでもどうぞ。", [["1K", "夜更けのコアセーブ", "配信で名前を呼び、「今日のコア、保存しました」とお祝いします。"], ["5K", "セーブ地点の一行メモ", "覚えている作業やゲームの話を一つ添え、ファミリーにお礼を書きます。"], ["10K", "名前入りセーブ画面アイコン", "セーブ画面風のアイコンに表示名を入れてお渡しします。"], ["20K", "作業BGMリクエスト", "好きなゲームの景色を聞き、作業中に聴きたい曲を配信で一つ紹介します。"], ["30K", "選べるセーブ地点セット", "夜の港か雨の村を選んで、名前入りアイコンとゲーム風の壁紙を作れます。"], ["40K", "あなたのゲーム散歩", "選んだ二つのゲーム風景を配信で語り、名前を呼んでお礼を伝えます。"], ["48K", "夜更けの最終セーブ会", "選んだ景色で約5分のゲーム雑談。名前入りアイコンと、その景色のセーブカード画像も作ります。"]]],
  ["まさむね_", "休日は城下町の脇道へ。まさむねです。行きの電車では三味線をよく聴きます。人混みを急いで抜けるのは苦手。説明板の前で足を止めて、その町の人の昔話を一つ聞けたら、遠回りしたかいがあります。\n\n城跡の急坂で、近所の方に「子どもの頃、ここを滑って下りましたよ」と教わりました。「どうやって止まるんですか」「止まれないから下まで行くんです」。帰りは私も同じ坂へ。一歩ずつ下りました。\n\n野球を観た日も、帰りに思い出すのは点が入る前の静けさや、隣の席のひと言です。坂で聞いた「下まで行くんです」は、忘れないうちに寄り道帳へ。説明板には載らない一行です。", "城下町の寄り道帳", "城下町の路地でも、球場への近道でも。つい足を止めた場所を聞かせてください。地名を忘れたら「コロッケの匂いがした角」でも。その一言を目印に、歩いてみたくなります。", [["1K", "城下町へお迎え", "配信で名前を呼び、「ご城下へようこそ」とお祝いします。"], ["5K", "史跡札風のひと言", "心に残った言葉を史跡札に見立て、名前とお礼を添えてファミリーに書きます。"], ["10K", "城下町の名前入りアイコン", "門と町並みを描いたアイコンに表示名を入れてお渡しします。"], ["20K", "曲がり角リクエスト", "好きな街の景色を聞き、歩いて訪ねたい場所を配信で一つ紹介します。"], ["30K", "選べる町並みセット", "路地か球場への道で、名前入りアイコンと寄り道帳風のカード画像を作ります。"], ["40K", "あなた宛て城下町案内", "選んだ寄り道を二つ、街歩きの案内役になって配信で紹介し、お礼を伝えます。"], ["48K", "城下町紀行の主役", "選んだお題で約5分の街歩きトーク。名前入りアイコンと架空の名物看板を描いたカード画像を贈ります。"]]],
  ["路面ベル♪", "「まもなく、商店街のパン屋さんの前です」。ベルと呼んでください♪ 車窓で気になる店を見つけたら、降りた電停の名前と一緒にノートへ。低音の強い曲はちょっと苦手。電停ではイヤホンを外して、発車ベルや店先の声を聴きます。\n\nある雨の日、傘を忘れて電停のあじさいを眺めていたら、隣の方が傘をそっと傾けてくれました。同じ電車に乗り、先に降りた私が振り返ると、その方は窓越しに小さく会釈。ノートの「傘を半分」を読み返すと、花の色より先にあの会釈が浮かびます。\n\nお目当てのパンが売り切れていたら、店の名前の横に「続きは次回」。電停を記録するはずのノートが、だんだんパン屋の再訪リストになってます。", "ベル待ちの電停", "車窓で見つけた看板や、思わず降りた電停の話をどうぞ♪ 路面電車が身近になければ、「窓からあの店が見えたら降りたい」から。ベルが鳴るまで、寄り道の話をしましょう。", [["1K", "ベルを鳴らしてお祝い", "配信で名前を呼び、「ご乗車ありがとうございます」とお迎えします。"], ["5K", "寄り道きっぷのお礼", "寄り道先を一つ選び、あなたの名前を添えたお礼をファミリーに載せます。"], ["10K", "名前入り電停アイコン", "路面電車と電停の看板を描いた、表示名入りのアイコン画像をお渡しします。"], ["20K", "電停リクエスト", "好きな景色を聞き、その景色に出会えそうな実在の電停を配信で一つ紹介します。"], ["30K", "車体色を選べる乗車券セット", "好きな車体色で、名前入りアイコンと架空の一日乗車券の画像を作ります。"], ["40K", "お名前入り車内放送", "好きな景色を車窓に見立て、配信で名前を呼んでお祝いとお礼を伝えます。"], ["48K", "架空路線の主役便", "選んだ景色と電停名で約5分の車内放送風トーク。名前入りアイコンと、その電停を載せた路線図画像をお渡しします。"]]],

  ["いなりまる。", "晩ごはんを食べながら、もう明日の献立を考えてます。「いなり」でどうぞ。料理エッセイで気になるのは、何を食べたかと、誰とどんな日に食べたか。脱出ゲームではヒントを読むのに夢中になって、「そもそも何を探してたっけ？」となります。\n\n食後は冷蔵庫を開けて、先に使いたい食材を一つメモ。合言葉は「迷ったら、まずだし」。それでも決まらない日は、うどんにおいなりさんを添えます。\n\nお弁当に一つだけ裏返ったおいなりさんがあったので、何かの目印だと思って真っ先にかじりました。苦手な梅干しが丸ごと一つ。家族は「当たりを入れたんだよ」と得意顔。目印だってところまでは正解でした。以来、裏返った一つは最後まで残します。", "いなりと明日の献立", "今日の晩ごはんから明日の献立を考える席です。「ねぎが少し余ったよ」の一言から、あと一品。「それ、誰と食べた？」とレシピから話がそれたら、その続きも聞かせてください。", [["1K", "おいなり一つ追加でお祝い", "配信で名前を呼び、「おいなり一つ追加です」とお祝いします。"], ["5K", "献立メモのお礼", "今月のごはんの話を一つ添え、ファミリーに名前入りのお礼を書きます。"], ["10K", "おいなりの名前入りアイコン", "おいなりさんと湯気を描いた、表示名入りのアイコン画像をお渡しします。"], ["20K", "冷蔵庫の一品リクエスト", "余った食材を聞き、それで作れそうな副菜を配信で一つ提案します。"], ["30K", "選べる献立カードセット", "うどんかおいなりの柄を選んで、名前入りアイコンとひと言入りの献立カード画像を作ります。"], ["40K", "食材二つの献立相談", "家にある食材を二つ聞き、配信で一食分の献立を考えながらお礼を伝えます。"], ["48K", "台所特番の主役", "好きな料理のお題で約5分の献立相談とお礼。名前入りアイコンと、その日の献立をまとめた画像もお渡しします。"]]],
  ["はんこびより。", "はんこです。夜の雑談を聴きながら、ノートの余白に日付印をぽん。流れた曲や、誰かが笑いながら言った一言を書き留めます。あとで読み返して、文字から声まで思い出せるのが好きです。\n\n問題集の小さな解答欄だと書ききれないので、続きはノートへ。ある日、ページを開くと余白に母の字で「牛乳買う」。何の問題を解いていたかは忘れましたが、帰りに牛乳はちゃんと買えました。あの日いちばん役に立った一行、私の字じゃなかったです。\n\n「私、押しは強いです。はんこ限定で。ポン！」。配信で返事が遅れたら、たぶん余白に何か書き足してます。「またメモ？」と言われると、その一言まで残したくなります。", "夜のひとことノート", "今日できたことや、配信で言いそびれた感想を持ち寄る夜のノートです。聴くだけの日は、笑った場面を一つ覚えて帰るだけでも。「さっきの一言、残したい」と教えてくれたら、今日の日付印を押します。", [["1K", "日付印でコアお祝い", "配信で名前を呼び、「今日の一ページに、ぽん」とお祝いします。"], ["5K", "できたことに一行はんこ", "今日できたことを一つ聞き、お祝いを一行、ファミリーに書きます。"], ["10K", "名前入り日付印アイコン", "日付印をかたどった、表示名入りのアイコン画像をお渡しします。"], ["20K", "残したい一言リクエスト", "書き留めたいひと言を選んでもらい、配信で名前を添えて読み上げます。"], ["30K", "インク色を選べるノートセット", "好きなインクの色で、名前入りアイコンとひと言入りのノート風壁紙を作ります。"], ["40K", "お名前入りのノート朗読", "今月の会話で心に残った場面を選び、名前とお礼を添えて配信で読みます。"], ["48K", "記念ノートの振り返り会", "選んだひと言で約5分の振り返りとお礼。名前入りアイコンと、そのひと言に日付印を押したノート画像をお渡しします。牛乳メモ欄つき。"]]]

const icons = ["01-rui_03.png", "02-初見じょうれん。.png", "03-あずき＊.png", "04-おちゃまる🍵.png", "05-ぼると⚡.png", "06-たっぷりん🍮.png", "07-mira☾.png", "08-あてな°.png", "09-からあげレモン🍋.png", "10-kohaku..png", "11-ぴかまる⚡.png", "12-しりゅう_08.png", "13-たいやき＠しっぽ派.png", "14-つきよみ☾.png", "15-きのぴ。.png", "16-こうめい＊.png", "17-れん_07.png", "18-じに＊.png", "19-港レター_.png", "20-けんし♪.png", "21-かんうどん🍜.png", "22-土星わっか◎.png", "23-しろもち。.png", "24-いかいかが.png", "25-ゆづる❄.png", "26-じゃっくん☆.png", "27-さなだんご。.png", "28-ゆずっこ。.png", "29-のぶにゃがฅ.png", "30-ぜうす_.png", "31-りさっち＊.png", "32-ちょぱ丸_.png", "33-敬語でラスボス🎮.png", "34-simba_.png", "35-kuroha_.png", "36-まさむね_.png", "37-路面ベル♪.png", "38-ねずち。.png", "39-いなりまる。.png", "40-はんこびより。.png"];
const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function imageButton(title, thumbnail, url, filename) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', title + 'を開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = thumbnail;
  button.append(image);
  button.addEventListener('click', () => {
    iconTitle.textContent = title;
    iconPreview.alt = title;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブでこのプロフィールが更新されました。入力内容をコピーしてページを再読み込みしたあと、もう一度編集してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。このサイトのデータ保存が許可されているか、ブラウザーの設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {copyText, successMessage = label + 'をコピーしました'} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('.family, li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しや右クリックでメニューを開き、「コピー」を選んでください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => {
          field.remove();
          if (feedback.textContent === manualHint) feedback.textContent = '';
        }, {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = successMessage;
  });
  return button;
}

function buildCorePerkTable(perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks, number) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリー説明・コア特典を見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value family-identity';
  const nameText = document.createElement('span');
  nameText.className = 'family-name';
  nameText.tabIndex = -1;
  nameText.textContent = familyName;
  const imagePath = './family-images/' + number;
  const preview = imageButton(familyName + 'のファミリー画像', imagePath + '.webp',
    imagePath + '.png', number + '-' + familyName + '.png');
  preview.className = 'family-image-button';
  const previewLabel = document.createElement('span');
  previewLabel.textContent = '画像を開く';
  preview.append(previewLabel);
  nameValue.append(preview, nameText);

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = 'ファミリー説明';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  const nameCopy = copyButton('ファミリー名', name, nameText);
  nameCopy.className = 'family-name-copy';
  actions.append(copyButton('ファミリー説明', name, description, {
    copyText,
    successMessage: '紹介文と全7段階のコア特典をコピーしました。ポコチャのファミリー説明欄に貼り付けてください。'
  }), nameCopy);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, feedback, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const number = icons[index].slice(0, 2);
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(number + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  const profileIcon = imageButton(name + 'のアイコン', './thumbnails/' + number + '.webp',
    './icons/' + number + '.png', icons[index]);
  profileIcon.className = 'icon-button';
  header.append(profileIcon, title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks, number), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
