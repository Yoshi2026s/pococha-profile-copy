<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<meta name="apple-mobile-web-app-title" content="ポコチャ文例集">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>ポコチャ プロフィール・ファミリー文例集</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px;text-wrap:balance}
h1 span {white-space:nowrap}
.note {font-size:14px;line-height:1.55;color:#ddd8ee;margin:0 0 12px}
.search {margin:16px 0}
.search label {display:block;font-weight:bold;margin-bottom:6px}
.search-controls {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.search input {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:9px;font:16px system-ui}
.search input::-webkit-search-cancel-button {display:none}
.search button {padding:0 12px}
.search button:disabled {opacity:.55;cursor:default}
#search-status {margin:8px 0 0}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-identity {display:flex;align-items:center;gap:12px}
.family-name {min-width:0}
.family-image-button {display:block;flex:none;width:76px;padding:0;overflow:hidden;background:#373c53;color:#fff}
.family-image-button img {display:block;width:76px;height:76px;object-fit:cover}
.family-image-button span {display:block;padding:4px 0;font-size:12px}
.family-intro {margin:0;white-space:pre-wrap}
.family .actions {grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-name-copy {background:#373c53;color:#fff}
.family-copy-field {display:block;width:100%;height:clamp(128px,35dvh,280px);margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:10px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-text {white-space:normal;overflow-wrap:anywhere;line-height:1.55;margin:0}
.perk-text strong {display:block;margin-bottom:2px}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
#icon-message:empty {display:none}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
dialog [hidden] {display:none}
.dialog-actions > :only-child,#icon-download[hidden] + button {grid-column:1/-1}
</style>
<h1><span>ポコチャ</span> <span>プロフィール・</span><wbr><span>ファミリー文例集</span></h1>
<p class="note">架空の100人の文例です。プロフィールは編集して、このブラウザーに保存できます。ファミリー説明は、紹介文と7段階のコア特典をまとめてコピーできます。</p>
<div class="search" role="search">
  <label for="entry-search">文例を探す</label>
  <div class="search-controls">
    <input id="entry-search" type="search" placeholder="名前・ファミリー名・話題" autocomplete="off">
    <button id="search-clear" type="button" disabled>クリア</button>
  </div>
  <p id="search-status" class="note" role="status"></p>
</div>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <p id="icon-message" class="note" role="status"></p>
  <img id="icon-preview" alt="" hidden>
  <p id="icon-help" class="note" hidden>iPhoneでは、画像を長押しすると写真に保存できる場合があります。</p>
  <div class="dialog-actions">
    <a id="icon-download" hidden>PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="manual-copy-dialog" aria-labelledby="manual-copy-title" aria-describedby="manual-copy-help">
  <h2 id="manual-copy-title">ファミリー説明を手動でコピー</h2>
  <p id="manual-copy-help" class="note">下の文章を長押しするか右クリックし、メニューから「コピー」を選んでください。</p>
  <textarea id="manual-copy-text" class="family-copy-field" aria-label="ファミリー説明とコア特典" readonly></textarea>
  <div class="dialog-actions">
    <button id="manual-copy-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["ハンマーひより","新人です。ひよりといいます。今日できる修理は、ほつれた縫い目を二センチまで。初めてお客さんに自分で説明したら、声が震えて「二メートル」と言いました。とても大きな靴でしたね、って師匠が横から。\n\n退勤前にはハンマーの頭を磨きます。先に鏡みたいになるのは師匠のほう。あの道具が使えるようになるまで、今日は自分の二センチを増やします。","修理前のぴかぴか","靴を一足お預かりします。直したいところと、残してほしい傷があれば先に教えてください。どちらも思い出せない日は、履いていった場所から聞きます。",[["1K","修理札でお迎え","名前を呼び、机に小さな札を置きます。"],["5K","靴ひものお礼","今日直した所を一箇所選び、お礼と書きます。"],["10K","かかとの印","好きな靴底模様で名前入りの図を作ります。"],["20K","修理台の順番","次に話す作業をかかとかひも穴から選べます。"],["30K","お出かけ前の一足","靴のアイコンと修理机の壁紙を描きます。"],["40K","よく歩いた靴","覚えている一足を聞き、その靴で行った場所を話します。"],["48K","修理済みの記念札","思い出の靴を絵にし、どこを直したかとお礼を添えます。"]]],
  ["白線の友子","運動会の白線が曲がっていると気になる友子です。結ぶひもを一度張ればいいのに、初めての係では線を自分の目で決めて旗の隣まで描き直しました。\n\n走る人はそんなこと気づかないだろうと思ってたら、最後に幼なじみが「友子の線、きのうよりまっすぐ」。あれだけ覚えてたら、今年も係を引き受けてしまう。","端っこのスタート地点","徒競走が始まる前に集合。係は水と線を準備し、眠かった人は立って見ていてください。競技の時間になっても、少しだけ朝の校庭の話を残しておきたいです。",[["1K","白い旗でお迎え","名前を呼んで、小さな旗を振ります。"],["5K","係の記録便","手伝ったことを一つ聞き、お礼を載せます。"],["10K","校庭の線印","好きな色のラインで表示名入りの場内図を描きます。"],["20K","準備の持ち場","スタートかゴールから次に話す地点を選べます。"],["30K","走る前の二枚","線のアイコンと、誰もいない校庭の壁紙を作ります。"],["40K","最初に来た人の実況","人が集まる前の場面を短い実況にして話します。"],["48K","係だけのプログラム","希望した役の仕事を一日ぶん並べ、名前入りの番組表を描きます。"]]],
  ["うら声の祖母","よお来はったな。私の手元は牌より湯のみばっかり見えてます。お茶、先にいれときますえ。\n\n何年か前に息子の友だちから「さっきあがってましたよ」と教えられました。いつ言うてくれるんか待ってたら、私が茶を注いでただけやそうで。今夜は二杯目から声張ります。","麻雀牌が鳴る居間","あがり方の指南より、人が集まったときの音を聞く居間です。休憩で台を囲んだ話、牌を積まなかった日も持ち込めます。",[["1K","牌を置いてご挨拶","名前を呼び、手元に牌を一枚置きます。"],["5K","休憩の一行","卓で聞こえた音を、お礼のお茶に見立てて書きます。"],["10K","卓の印","好きな色の無地の牌に名前を添えたアイコンを作ります。"],["20K","座る位置","卓のどちら側の話を聞きたいか選べます。"],["30K","手前と向こう側","牌のアイコンと卓の壁紙を作ります。"],["40K","こぼれ話の一局","教えてもらった集まりで聞いた声を、配信で短い小話にします。"],["48K","居間の話集","お題の団らんを短い話に書き、名前入りの表紙を贈ります。"]]],
  ["&ツインベル","自転車のベルは左手で鳴らす。卓上ベルは右手。そう決めてから、押し間違えた音のほうをよく覚えるようになりました。\n\nときどき玄関のチャイムと机のベルが続けて鳴ります。二音でも曲みたいに聞こえるので、枠ではどちらが先に鳴ったか発表します。","左右で音が違う","最初は家のベル、次は台所の音。二つの音を順に書いてください。左右の思い違いは消さずに置いておくと、翌週読むとき楽しいです。",[["1K","右手の一打","名前と一緒に机のベルを小さく鳴らします。"],["5K","左右の余白","その日の二音と、ありがとうを逆順でも読めるように書きます。"],["10K","ベルの反射印","好きな真鍮色で、名前を入れたベルの絵を作ります。"],["20K","先に鳴らす方","次の二音の順番を決められます。"],["30K","机と玄関の二景","ベル印と玄関の壁紙を揃えます。"],["40K","二音の聞き比べ","もらった組み合わせを配信で順を変えて鳴らします。"],["48K","音の担当表","あなたが選んだ二音を使って短いジングルを作り、演奏順の画像にします。"]]],
  ["teru^3","録音：日曜22時。\n\nＡ面：ラジオ。\n\nＢ面：無音のあと、父のくしゃみ（大）。\n\n備考：本人は出演と主張。放送作家には未連絡。\n\n同じことを十年くらいメモしているテルです。音楽が静かなときだけ、普通に喋ります。","中古カセットのB面","曲の題名の話より、録音を止め忘れたあとが好き。机から消しゴムを落とした音も、あとで聞くと立派な一場面です。",[["1K","B面を出す","名前を読み、テープをひっくり返す音で迎えます。"],["5K","停止ボタンのお礼","今日の音に一言添えて投稿します。"],["10K","磁気テープ札","好きなカセット色でラベル風アイコンを作ります。"],["20K","巻き戻し先","次に話す録音の最初か最後かを選べます。"],["30K","カセットの窓","ラベルアイコンと透明窓を大きくした壁紙を作ります。"],["40K","三秒の余白","どんな音が残ったか聞き、配信で短く音まねします。"],["48K","あなたのB面","好きな物音の小話を作り、曲順のように並べた画像を贈ります。"]]],
  ["画鋲ひとつ","校舎の掲示板って、紙をはがすと変色していない四角が残るじゃないですか。あれをずっと「下書き」と呼んでいます。\n\n店のアルバイトでは、ポスターを留める係になりました。空いた場所に追加するより、はがした直後を一度ちゃんと見る。それだけで次の配置が浮かびます。","掲示板の左上","【更新前】いま残っている紙　一枚。\n【更新後】いま残っている跡　一つ。\nポスター係の個人的な記録です。はがれた角や、昔のテープの色からの報告も受け付けます。",[["1K","留めてご挨拶","名前を呼んだあと、紹介する紙の角を一箇所留めます。"],["5K","四角のお礼","その日見つけた掲示の色を、あなたへのお礼に添えます。"],["10K","左上の画鋲印","好きな画鋲色に表示名を合わせてアイコンを描きます。"],["20K","掲示位置の指名","次の空想ポスターを貼る位置を、左上か右下から選べます。"],["30K","貼る前と後","画鋲のアイコンと掲示板の壁紙を作ります。"],["40K","消えた張り紙の話","覚えている紙の色から、貼ってあった内容を配信で空想します。"],["48K","あなたの掲示替え","希望の題で三枚の掲示を図にし、名前入りの記念画像を贈ります。"]]],
  ["栗田の湯加減","熱いおしぼりを渡されたとき、一回も落とさず広げられる栗田です。もっと役に立つ特技を覚える予定でしたが、冬の夜に試したら、友達が私より先に手を出しました。\n\n手で冷ますと早すぎるので、少し待ってから渡します。配信で遅れて反応するのも、そのくらいの間なら待ってほしいです。","蒸しタオル当番","手を洗って、冷えてたらこれ。みんなが話し始めたあとでも、温まったら入ってきてください。おしぼりは広げず、まず指先だけ入れる派です。",[["1K","おしぼりを一枚","名前を呼び、手を温める仕草で迎えます。"],["5K","手のひら通信","温かかった物と短いお礼を一行で載せます。"],["10K","湯気の名前印","好きな布色と表示名を合わせた図案を描きます。"],["20K","今日の温度","次の話の温度を、ぬるめかあつめから選べます。"],["30K","冬の手の二枚","湯気印と布の表面を描いた壁紙を作ります。"],["40K","温まるまでの話","あなたの体験を聞いて、温かくなった瞬間を配信で言葉にします。"],["48K","湯加減の冬便","お題から短い冬の話を作り、好きな布色のお礼カードにします。"]]],
  ["豆皿マンボ","いち、皿を出す。に、醤油。さん、間に合わない。し、甥が自分で取る。マンボのテンポでお膳を出した結果です。\n\n待たせたおわびに、甥が中身を決める日を一回。いち、納豆。に、キムチ。さん、プリン。し、台所の人が首をかしげる。テンポはとてもいいです。","四拍目の配膳","「あと一拍待って」で台所が止まるお膳です。好きな一品を持って来る人も、空いた小皿を下げる人も踊り手として数えます。",[["1K","一皿目の合図","名前に四拍のリズムを付けて呼びます。"],["5K","お膳の一行","今日置いた皿の話を、お礼といっしょに書きます。"],["10K","豆皿の音符印","好きな柄の皿に、名前と音の印を描きます。"],["20K","四拍目の品","次に置く一皿を、おかずか甘味から選べます。"],["30K","配膳カードの組","皿アイコンと四皿目まで並んだ壁紙を作ります。"],["40K","台所の伴奏","好きな料理を教えてもらい、台所の音で短く伴奏します。"],["48K","マンボのお品書き","お題で一膳分のリズムを作り、手書きのお品書き画像とともに渡します。"]]],
  ["空箱のノドカ","祖母の裁縫箱を開けたら、仕切りが全部薬の空箱でした。「小さい物ほど、買った物の箱が合う」と言う人です。\n\n私はその中のひとつを譲ってもらって、生地の色見本を入れています。初めて来た友人は「お大事に」と言って帰りました。今度来たらボタンも入ってるよ。","薬箱のあやしい仕切り","木箱　元はビスケット、今は針山。\n薬の箱　元はのど飴、今は布の色見本。\nお宅の引き出しで、まだこの名簿にない箱があれば教えてください。",[["1K","小箱を一つ","名前を呼び、引き出しをひとつ開けます。"],["5K","仕切りの伝言","今週しまった物とお礼を写真に添えます。"],["10K","小さな仕切り印","好きな箱に好きな色と名前を入れたアイコンを作ります。"],["20K","引き出しの指名","次に開ける浅い段か深い段を選べます。"],["30K","箱の中の二景","箱のアイコンと中身を並べた壁紙を作ります。"],["40K","ぴたりの収納相談","しまいたい小物を聞いて、合いそうな空箱を一緒に探します。"],["48K","あなたの引き出し図","希望の中身に合う配置を書き込み、名前入りで贈ります。"]]],
  ["FJORD:かな","海の地図で青が急に濃くなる場所を探しています。深さの数字を覚える気はなくて、色の境目だけずっと見ていたい。\n\n去年、珍しく山へ出かけました。地図の湖は青一色なのに、実際は橋の向こうだけよく光る。その橋を忘れないよう、地図に鉛筆で短い線を入れました。","氷の下を見ない地図","地図に載せたもの　水と、橋。\n地図の外に置いたもの　歩くと橋の下だけ聞こえた音。\n今日も載せにくいほうを話します。何の音か分からなければ、聞こえた方角だけで。",[["1K","青の入口","名前を読み、今日はどんな青から始めるか話します。"],["5K","地図にない欄","聞いた手掛かりに、短いお礼を書き添えます。"],["10K","境目の青印","好きな青の組み合わせに表示名を入れた図を描きます。"],["20K","描く岸の選び","湖の手前か奥か、次に話す岸を指定できます。"],["30K","地図と水面","青印アイコンと水面の壁紙を作ります。"],["40K","地図に線を足す","教えてもらった手掛かりを空想地図に描きます。"],["48K","名前のない湾","希望の光と橋で架空の湾を描き、名前入りの地図カードを贈ります。"]]],
  ["よもぎ急須。","祖母の庭には、雨が降っても直らない雨の跡が一本。使い終えた茶葉を急須から流した跡です。私はあれを地面のお茶と呼んでいました。\n\n自分の一服はいまだに茶を飲んだところで終わります。ふたを傾け、葉のかたまりを片付ける。家の静かさが戻るのはそこからだ、とこのごろ分かってきました。","茶殻を捨てるまで","一杯目より片づけの話。急須を洗うのはいつか、冷めたお茶を誰が飲むか。小さな違いを覚えて帰るお茶の間です。",[["1K","ふたを取って点呼","名前を読み、今日の急須のふたを開けます。"],["5K","茶殻の短い手紙","今日飲んだ一杯にお礼を添えて書きます。"],["10K","ふたつまみの印","好きな急須のつまみと名前で丸い絵にします。"],["20K","片づけの順番","次の話を急須洗いか茶殻捨てから選べます。"],["30K","一服の終わり","急須印と、湯気が消えた棚の壁紙を作ります。"],["40K","最後の一杯話","あなたの片づけの習慣を聞き、似た思い出を短く話します。"],["48K","茶器の一日手帖","希望のお茶がいれられて片づくまでを描き、名前を添えて贈ります。"]]],
  ["kaθe","発音しにくい音を浴室で試すと、反響のおかげで上手に聞こえます。カテです。廊下で同じ音を出すと、家族には「のどが渇いた？」と言われます。\n\nひとつだけ前よりうまく言える音があって、駅の階段でも声に出しそうになります。誰にも気づかれず口だけ動かせたら、それはそれで進歩です。","湯船の縁の発音帳","ことばを一つ発音してから、その音で思い浮かんだものを置いてください。音の当たり外れは採点しません。ひそかに練習していた音は、録らずに文字だけ書く参加も歓迎です。",[["1K","口を開く合図","名前を一度ゆっくり読み、今日の一音を鳴らします。"],["5K","反響の一行","聞こえ方に気づいた音と、お礼を記します。"],["10K","発音帳の耳印","好きな一音の図に、名前を添えたアイコンを作ります。"],["20K","響かせる場所","浴室か廊下、次の響きの話を選べます。"],["30K","声の距離絵","耳印と遠くへ届く響きの壁紙を作ります。"],["40K","耳の中の早口言葉","一音をもらい、短く言いにくい文を作って配信で試します。"],["48K","一音の練習帳","希望の響きを集めた短い読み物を作り、表紙にお礼を添えます。"]]],
  ["栞ではなく付箋","付箋が一冊に二十四枚。これは読み返してほしいところの数じゃなく、途中で呼ばれて立った回数です。\n\n愛読書は真ん中に何も貼っていません。そこから先は、誰かに呼ばれても聞こえないくらい集中して読むようです。家族にも、あの辺のページだけは読み終わるまで待ってもらってます。","本棚の仮どめ係","本を閉じる。手を離す。呼ばれたほうへ行く。\nいつもこの三つの間のどこかで、付箋が入る。読むのをやめた場所の話だけを聞く会です。読了欄は用意していません。",[["1K","仮どめのご挨拶","名前を読み、今日の話題のところに付箋を貼ります。"],["5K","読みかけの一行","あなたが中断したところにお礼を添えて記録します。"],["10K","色つき小口印","好きな付箋色で本の小口と名前を図案にします。"],["20K","貼る位置の指名","上端と横端から、次の見本で貼る場所を選べます。"],["30K","途中の二枚","付箋印アイコンと本を開いたままの壁紙を作ります。"],["40K","中断した日の話","選んだ出来事を話し、そのあと読書へ戻れたか聞きます。"],["48K","一冊の中断日記","お題を元に中断のある短編を書き、付箋の表紙を画像で贈ります。"]]],
  ["ぽっかり筒井","帰ります、と先に言いました。まだ明るいうちでした。歩いて七分の道で、駄菓子屋の電球が点くのを待っていたのです。待っている間に、隣の魚屋が先に二つ点けました。\n\n夕飯、二度目は温め直さなくていいよ、と伝えたら「今日は温めるおかずがない」。帰る時間だけは、私のほうが勝手に夕暮れに合わせているのかもしれません。","晩ごはんまで徒歩七分","夕飯までになんとなく見かけたものを、食卓に着く前に話したい場所です。焦げそうな日は、食べてから来てね。",[["1K","玄関先でお迎え","名前を呼んで、帰るまでに見た物を一つ挙げます。"],["5K","七分日記","道の途中で起きたことを、お礼といっしょに残します。"],["10K","晩の灯り印","好きな光色で道と表示名のアイコンを描きます。"],["20K","歩きはじめ","次に語る道を夕方か日暮れから選べます。"],["30K","玄関前の二景","灯り印と帰り道の壁紙をあなたの好きな色にします。"],["40K","七分の寄り道","選んだ一場面を配信で、ゆっくり歩く速さで話します。"],["48K","晩ごはんの前日譚","お題の帰り道を書き、名前入りの景色カードを贈ります。"]]],
  ["ゆめみ業務録","日報　閉店後の果物売り場\n\n・閉店時、台の端に梨が一点。\n\n・閉店八分後、冷凍庫の緑ランプを確認。\n\n・退勤時、果物を下げた台の跡が明るく見えた。\n\n以上です。明日のことを書かなかった日は、よく眠れます。","最後に点いている売り場","本日の日報\nレジは閉めました。通路は消灯。冷凍庫は点灯中。\n帰り際、一つだけ目についた光があれば、ここに追記してください。",[["1K","最終確認","名前を読み、今夜最後に見た光を話します。"],["5K","退勤メモ","今日残っていた灯りにお礼を一行添えます。"],["10K","夜の札","選んだ棚と色で名前入りの退勤札を描きます。"],["20K","点灯の指名","次の絵で残す灯りを一つ選べます。"],["30K","最後の売り場","退勤札のアイコンと店内地図の壁紙を作ります。"],["40K","閉店後の三分","選んだ売り場の音を一緒に想像し、配信で短い案内をします。"],["48K","無人店舗の小展示","お題の店を閉店後の姿で描き、あなた宛ての日報画像にします。"]]],
  ["朝青まわり","早朝の町で最初に鳴く鳥を教えてほしい、と配信で言ったら「新聞配達のバイク」と答えた人がいました。あの日から、順番を付けずに聞き取っています。\n\n起きてすぐに窓を開ける日は、色より音から空が明るくなります。今日の一音は、水筒のふたでした。","踏切より先に鳥が鳴く","最初に聞いた音を、名前があるものも、何か分からないものも一つ。起きてから何分たったかは、覚えていたら添えてください。",[["1K","朝の一音","名前を呼び、今日いちばんに聞いた音を一つまねます。"],["5K","起きぬけのお礼","聞かせてくれた音に、お礼を一行添えます。"],["10K","夜明けの耳印","好きな時刻を夜明けの色にして名前を合わせます。"],["20K","次の聞く位置","窓際か玄関で、次の朝の話の場所を選べます。"],["30K","明け方の二色","耳印と明るくなる前の窓の壁紙を作ります。"],["40K","聞こえる順会議","朝の場面を聞き、配信で音の順に並べて話します。"],["48K","あなたの朝の譜面","希望の朝から音を三つ想像して手描きの譜面にし、お礼を入れます。"]]],
  ["MISOJI_3℃","三℃って言ってるけど、冷凍庫が三℃だったら困る。帰ってきて外がそれくらいの日に、あえて枝豆を冷たいまま食べます。食べたの一粒なのにお茶は二杯。\n\nそういう手間の話を短く。今日の配信は、次のひと口が冷たすぎる前には終わります。","冷凍庫前の短い報告","今週の冷凍庫点検\n○ 霜が増えた。\n○ あとで食べる予定ができた。\n空っぽでよく冷えている場合も、ご報告を。",[["1K","霜の点呼","名前を読み、今日見つけた氷の形を話します。"],["5K","在庫の一言","冷凍庫から出した物とお礼を一行にします。"],["10K","霜粒のアイコン","好きな氷の色で表示名を入れた印を描きます。"],["20K","次に解凍する話","手元の食材から次に話すものを選べます。"],["30K","冷気の二景","霜のアイコンと空っぽの棚の壁紙を作ります。"],["40K","あたため直し会","凍ったものを温めたとき印象がどう変わったか話します。"],["48K","一週間の冷気便","希望の食材を題に記録を描き、あなた宛てのお礼を添えます。"]]],
  ["紺野キッズ席","展示を見るとき大人の説明から読み始めると、横で息子が展示台の脚を見ています。紺野です。こんな低い所に絵があったのか、と一緒にしゃがんで気づきました。\n\n最近は一人で出かけても、どこかで少ししゃがみます。大人の料金で入って、子どもの席から見た帰り道が好きです。","子ども料金の目線","普段より低いところから見えたものを教えてください。だっこした子が見ていた景色でも、小さい棚の下の落書きでも。こちらも同じ高さから見直します。",[["1K","低い目線のご挨拶","名前を呼び、今日低くかがんで見つけた物を話します。"],["5K","見上げたひと言","低い目線の発見とお礼を一行ずつ載せます。"],["10K","小さい席の印","好きな椅子に名前を添えたアイコンを描きます。"],["20K","見る高さの選択","次の写真の高さを膝か腰かから選べます。"],["30K","二つの目線","椅子印と見上げる展示室の壁紙を作ります。"],["40K","低い場所の案内","あなたの発見を聞き、その高さで景色を言葉にします。"],["48K","見上げる展示図","希望の展示を低い目線で描き、見えた物とお礼を添えます。"]]],
  ["オゾン伯母","あんなに立派な外玄関だったのに、伯母の家のことを思い出すと、最初に来るのは麻のにおいです。雨がにじむと少し青臭い。乾くと別の家みたい。\n\nあのとき話してもらったことは、たぶん三分の一も覚えていません。自分の家の前で、傘を閉じずにいるときだけ、戻ってくる声があります。","濡れた玄関マット","「雨のにおい」と言うには短すぎる匂いばかり。ぬれた犬、古い木の戸、まだ乾いたコンクリート。一語だけでも、土間に置いていってください。",[["1K","土間のお迎え","名前を呼んで、今日は何が濡れたか一つ話します。"],["5K","濡れた一語","教えてもらった匂いに、短いお礼を添えます。"],["10K","雨の日のしるし","好きな雨色で、名前を入れた玄関マットの図を描きます。"],["20K","傘を置く場所","次の話の場所を軒下か玄関の内側で選べます。"],["30K","雨脚の二場面","玄関印と、においが漂う雨の壁紙を作ります。"],["40K","においを言葉に","あなたの一語を聞き、雨の日の景色にして読みます。"],["48K","三歩の帰り道","希望の季節で帰宅までの短文を書き、名前入りの一枚にします。"]]],
  ["への字ジャム","苦いマーマレードは真ん中に少しだけ。横に広げると、渋い顔をした口みたいに見えます。私の朝はだいぶへの字です。\n\nある日、食パンの端にジャムを寄せたら笑った顔になりました。そこから食べてしまったので、今日も最後はへの字です。","トーストの肖像","（へ）苦い。\n（⌣）今日はおいしい。\nパンの形で近況を一つ。写真が間に合わなければ、機嫌だけ置いていってください。",[["1K","朝の顔合わせ","名前を呼び、今日のトーストの顔を一つ描きます。"],["5K","パン屑のお礼","朝食の一言とお礼を食卓のメモに書きます。"],["10K","への字の焼き札","好きな焼き色のパンに名前を添えて描きます。"],["20K","次の表情","次に描く顔を、笑い顔かむずかしい顔から選べます。"],["30K","トーストの縁取り","パンの札と朝食テーブルの壁紙を作ります。"],["40K","味から似顔絵","好きな塗りものを聞き、味の印象を顔にして配信で描きます。"],["48K","今日のパン画廊","希望の具で顔を三枚描き、題名とお礼入りの画像を贈ります。"]]],
  ["赤ワインの栓ぬき代行","開けられなくて頼まれたワインを、いいところでこぼしたことがあります。栓があんなに急に抜けるとは思わず、二人で長いこと床を拭きました。\n\nその空き瓶が捨てられなくて、今は夕方の窓辺に置いています。光が底から入ると、飲んだときより色がよく見える。私はこの眺めのほうに詳しいです。","空瓶の夕方","飲む人も、空き瓶の色だけ気に入った人もどうぞ。お祝いの日より、飲み終わって話し始めたころのことを聞きたいです。",[["1K","瓶を置いて点呼","名前を呼び、窓に空き瓶を一本かざします。"],["5K","栓の余韻便","今日見た色とありがとうを、短く書き残します。"],["10K","瓶底の丸印","好きなガラス色で表示名入りの丸いアイコンを作ります。"],["20K","瓶を置く位置","次の配信で照らす角度を、正面か横から選べます。"],["30K","窓と瓶の二枚","瓶底の印と夕方の窓辺の壁紙を作ります。"],["40K","空き瓶の聞き書き","教えてもらった一日の話を、瓶の色と一緒に短く読みます。"],["48K","夕方の瓶の詩","選んだ色で短い詩を書き、窓辺の写真に添えて贈ります。"]]],
  ["吠えないバン","わしの散歩。犬の休憩。合わない。\n\n昨日は別行動。わしが川まで。犬が玄関まで。帰って水を飲んだのは二人とも。\n\n何が違うのか聞いたら、向こうはしっぽを軽く振るだけ。わしも長々話すのやめたいんやけど、どこにしっぽ付けたらええんやろ。","犬抜き散歩会","犬がいない散歩の話も受け付けます。しっぽで返事したい人は、「わかった」を一言置いてくれると助かります。",[["1K","リードなしで点呼","名前を呼んで、散歩に行く足音を二歩鳴らします。"],["5K","帰ったよ便","帰宅して最初にしたこととお礼を書きます。"],["10K","しっぽの札","好きな犬のしっぽの形に表示名を添えます。"],["20K","今日はどっちへ","門の右か左か、次に話す方角を指定できます。"],["30K","散歩前と散歩後","しっぽのアイコンと玄関の壁紙を作ります。"],["40K","犬が見たかも会","人がしたことを、犬の視線で配信中に語り直します。"],["48K","あなただけの遠回り","お題の道を犬抜きで歩く小話と、散歩札の画像を贈ります。"]]],
  ["ほねまで鉛筆","絵を描く日は、消しゴムから先に出します。横の線を一度消して、紙が薄くなったころに好きな線が出る。そこまで待つのが好きです。\n\n美術の先生には「描きたいのはいす？ それとも座った跡？」と聞かれました。以来、椅子から立った直後の座布団だけ何度か描いてます。","デッサンの消し跡","いすを描いたつもりが、消した跡のほうが座布団に見えました。消したくなった線を一つ持ち寄り、どこから描いたかをゆっくり話します。",[["1K","薄い線の挨拶","名前を読み、最初の線を細く引きます。"],["5K","消し残しへの返事","今日消さずにいた線を一つ選び、お礼を書きます。"],["10K","線の座布団印","選んだグレーと表示名でアイコンを描きます。"],["20K","次の消し方","消し跡を残すか薄くするか、次の紙で選べます。"],["30K","残る線の二枚","座布団印と消し跡のある壁紙を作ります。"],["40K","線の留守番","選んだ物を描き、消し跡で見えるところを配信で一緒に探します。"],["48K","あなたの小さな習作","希望の物を一枚描き、気に入った線を言葉で添えます。"]]],
  ["レンチ半月","はじめまして。名前ほど道具に詳しくないです。都合が合えば、月の形の話をしながら夜の路地を散歩します。\n\n目印は月と言い切って道を間違えたあの日、実際に上にあったのは屋根の白い街灯。「あれ、今日まだ昼じゃない？」と隣の人に言われるまで見上げてました。","路地の万年カレンダー","路地の奥へ出る前に、今日見えた丸いものを一つ。月の話を聞く会ですが、あまりにいい丸だったら、自転車の反射板も採用します。",[["1K","路地口のお迎え","名前を読み、見上げた場所を一つ挙げます。"],["5K","今日の月まち便","丸く見えたものとあなたへのお礼を記録します。"],["10K","上弦の町印","好きな路地色に月と名前を入れた画像を作ります。"],["20K","街灯の選び","足元を照らす灯りか遠くの灯りか、次の話を選べます。"],["30K","丸い灯りの組","町印アイコンと夜道の大きな壁紙を作ります。"],["40K","月と思ったもの","あなたが見間違えた光を聞き、配信でその夜の続きを話します。"],["48K","架空の月見散歩","お題の路地と月を描き、帰り道のひと言を添えます。"]]],
  ["月見課77","開いてください。……あ、横に行くと開くんですね。\n\nすいません。戻ると閉まるんですね。\n\n自動ドアにこのくらい長くつき合います。枠を閉めるときだけそつないので、課長と呼ばれてます。扉の苦手な課長です。","入らない自動ドア","受付番号はありません。開かなくて横に一歩ずれた話、開いてしまって戻った話。ドアの向こうまで行かなくても、ここでは一件受理します。",[["1K","入口の案内","名前を呼び、手でドアが開く合図をします。"],["5K","通過記録","今日開いた扉とお礼を記録します。"],["10K","開かない札","好きなドアの形と名前で小さな札を描きます。"],["20K","次の開き方","横に滑るか手前に開くか、次に話す扉を選べます。"],["30K","ドアの両側","札のアイコンと閉まった入口の壁紙を作ります。"],["40K","一歩ずらす会","通れなかった場所の話を聞き、配信でその先を空想します。"],["48K","未入館の案内図","指定の入口をくぐった先を描いて、名前を添えた画像にします。"]]],
  ["月額ネコ代","契約は毎月更新で、支払いは段ボール一枚です。入居者さんは猫。昨日は大きい部屋を用意しましたが、書類を入れておいた小さい箱に即決でございました。\n\n私は管理人ですので、入居後の騒音には対応いたします。夜中に箱から出たときのドスンという音は、こちらの責任ではございません。","ダンボールの空室案内","空室案内\n一号箱　成約済。\n二号箱　猫が室外より確認中。\n三号箱　管理人が紙類を整理した時点で内見可。\n※猫が寝込んだ場合、いずれの内見も延期します。",[["1K","入居審査のご挨拶","名前を読み、空の物件を一つだけご案内します。"],["5K","家賃の領収書","今日の箱の見どころとお礼を台帳に記します。"],["10K","空室ピクト","選んだ箱の形に名前を添えたアイコンを描きます。"],["20K","空き箱の次の用途","屋根つきか屋根なしか、次の模型を選べます。"],["30K","内見セット","空室アイコンと箱の寸法が分かる壁紙を作ります。"],["40K","予算ゼロの設計会","手持ちの段ボールで、希望の間取りを描いて見せます。"],["48K","物件特集号","あなたのための架空物件を三つ描き、管理人のお礼入りの画像にします。"]]],
  ["Miss北極星","質問どうぞ。北は、駅を出て外灯が三本あるほう。星の位置は、ご近所の天文台で聞いたほうが早いです。名乗っておいてすみませんね。\n\nその受付の方に天文台で一番遠くに行った物を聞いたら「椅子です。移動はしてないけど、座っていろんな遠くを見たので」。道案内のあとに、そういう話をする人です。","星の数を暗記しない教室","学んだことより、聞いたとき誰がどんな声で言ったか。そこを一つ覚えて帰る、帰りたくなったら出ていい教室です。",[["1K","教室の入席札","名前を読み、今日覚えた声を一つ話します。"],["5K","ノートの端のお礼","印象に残ったひと言とお礼を並べます。"],["10K","外灯の目印","好きな光色と名前を使った簡素なアイコンを描きます。"],["20K","今夜の席","次の話を受付か玄関から選べます。"],["30K","帰り道に点る絵","外灯のアイコンと遠くの窓の壁紙を作ります。"],["40K","声の道案内","覚えている案内を聞き、配信で言葉だけで道をたどります。"],["48K","小さな夜の教室","希望の場所でありそうな会話を描き、名前を添えた夜のカードを贈ります。"]]],
  ["ナカミー散髪前","前髪の注文、あれほんとに難しくない？ 五ミリ、って言った二秒後に、五ミリってどこからだっけってなる。ナカミーです。\n\n後ろに鏡を置いて「どうです？」って聞かれたら、うちは真っ先に耳の後ろ見る。イヤホンが落ちない長さ、そこだけ譲れない。","鏡のうしろも見たい","ここでは髪型の名前の代わりに、どう見えたいかを言葉にします。「首にいっぽん毛が落ちてても気づけるように」みたいな細かい注文、歓迎。",[["1K","鏡越しの挨拶","名前を呼び、鏡を持つ姿でお迎えします。"],["5K","刈りあと便","髪を切った日の話を、お礼と一緒に投稿します。"],["10K","前髪の輪郭","好きな分け目で、名前入りの輪郭アイコンを描きます。"],["20K","帰り道の風","次に話す季節を、首の冷える日か暑い日から選べます。"],["30K","鏡と襟足","輪郭のアイコンと後ろからの鏡の壁紙を作ります。"],["40K","注文のことば相談","教えてもらった希望を、伝わりやすい散髪の頼み方にします。"],["48K","空想の床屋看板","希望の雰囲気で架空の床屋を描き、名前入りの看板画像にします。"]]],
  ["Oyogu_M31","泳ぎ始める前に、今日は何本泳ごうか考える。一本目が終わったら、どっちの壁から出たか考える。そうやって気づけば、時間も本数もわからない。\n\nゴーグルを外した直後だけ、天井が普段より白く見えます。枠で話すことを思いつくなら大体そこ。M31は最初のロッカーに貼ってあった番号です。","プールの反対側","向こう側の壁に着いたら、泳ぐ前には思いつかなかった話を一つ。速さの話は水に流して、帰りの自販機の前までご一緒しましょう。",[["1K","水際で点呼","名前を読み、掌で机に水音をまねます。"],["5K","プールサイド便","泳いだあとに思いついた話とお礼を載せます。"],["10K","透明なロッカー札","水色を選んでもらい、表示名入りの札を描きます。"],["20K","どっちの壁","プールの入口側か奥側か、次の話の場所を指定できます。"],["30K","水の表裏","ロッカー札風アイコンと水中から見上げた壁紙を作ります。"],["40K","息つぎ一回ぶん","あなたが好きな短い時間について配信で話します。"],["48K","一往復の記録","希望の場面をプールの往復になぞらえて書き、名前入りカードにします。"]]],
  ["夢中パンタグラフ","電車の音がすると、まず屋根を見ます。知らない音を聞いたら窓から離れられません。あだ名は長いので、パンタで。\n\n電車を見に行く日だけ早起きできると言われますが、洗濯物もちゃんと先に干します。染み抜きが終わるまでは各駅停車で。","架線の見えるベランダ","車両番号が分からなくても「あそこが上がった」だけで十分。屋根が見える場所から眺めたことを、ベランダ越しに話すファミリーです。",[["1K","架線の点呼","名前を呼び、知っている電車の音を一つまねます。"],["5K","屋根からの返信","今日見かけた車両の一箇所と、お礼を書きます。"],["10K","パンタの記念印","好きな金属色で名前入りの記号を描きます。"],["20K","屋根を見上げる日","次の写真で見る箇所を二つから選べます。"],["30K","二つの空の絵","屋根のアイコンと架線が遠のく壁紙を作ります。"],["40K","二枚の車両会議","配信で好きな構造が写った写真を選び、見どころを話します。"],["48K","ベランダ観察記録","希望の時間帯の空と架線を描き、名前入りの観察帳画像にします。"]]],
  ["産直リズ","うちの子が初めて食べた豆は、祖父の畑の名前札と取り違えた袋に入ってました。何の豆か聞くと祖父は「もう食べたんやろ、じゃあ食べた豆」。\n\n出荷の手伝いは札を書くところがいちばん好き。自分が書いた字が畑から店まで行くと思うと、うれしくて箱を見送る時間が長くなります。","畑の外の名札箱","店で会うまで何人かの手を通ったもの。名前札も入っていた箱も、最後まで見ます。買って帰って初めて読んだ一行があれば教えてください。",[["1K","荷札を一枚","名前を読み、その日の箱につけた札を見せます。"],["5K","売り場のお礼便","覚えていたひと言とお礼を手書き風に残します。"],["10K","豆袋の印","好きな豆の姿と名前を合わせたラベルを描きます。"],["20K","仕分けの箱","次に紹介する野菜を葉ものか実ものから選べます。"],["30K","畑から店の組","豆袋アイコンと木箱を並べた壁紙を作ります。"],["40K","値札の先の話","好きな野菜を聞き、選ぶときどこを見るか配信で話します。"],["48K","届いた日の伝票","お題の野菜の旅を短い絵にし、名前入りの産直カードを作ります。"]]],
  ["ビス子。締め直し中","机が揺れるのを直すために折った新聞紙が、いちばん読み返す記事になりました。ビス子です。背表紙がわりに折り目が増えてます。\n\n大工仕事が趣味というより、座ったときに揺れないのが好き。家具を買った日も、ヤスリと一緒に説明書を机の手前に置いて寝ます。","机がガタつく夜","ガタつく机に挟んだもの、ねじ穴に落としたもの、説明書で分からなかった絵。直るところまで一緒に待ちます。",[["1K","机に着いて点呼","名前を読み、脚を一度押して揺れを確かめます。"],["5K","締め直し日報","今日触った一箇所に、お礼を一行添えます。"],["10K","ビス頭アイコン","選んだねじの頭と名前で小さな図案を描きます。"],["20K","先に調べる脚","次の机の話を手前の脚か奥の脚から選べます。"],["30K","揺れ前と揺れ後","ねじ印と、机の脚を横から描いた壁紙を作ります。"],["40K","厚みに合う一枚","がたついた思い出を聞き、直したときの感触を言葉にします。"],["48K","あなたの説明書","希望の机を図解し、困ったところとお礼を手書き風に入れます。"]]],
  ["じぶんの字幕係","人の話が面白かったときほど、何が面白いか説明できないので。配信では二拍遅れて、「あ、今の」と言います。\n\n誰かに貸してもらった映画のメモには、筋より笑ったタイミングが書いてありました。私も今、枠で笑ったところだけ時間を書いて残しています。","二拍あとから来る言葉","（二拍）\n……ここです。今笑ったところ。\n言い直しはいつでも歓迎です。自分の字幕が一行遅れたと思ったら、遅れたまま送ってください。",[["1K","字幕の出だし","名前を読んだあと、一呼吸遅らせて挨拶します。"],["5K","二拍あとのお礼","配信で笑った場面に、お礼を添えて載せます。"],["10K","字幕枠のアイコン","好きな文字色に名前を入れた小さな画像を作ります。"],["20K","見逃した一行","次に振り返る話題を二つから選べます。"],["30K","開いている字幕","字幕アイコンと、空欄の多い配信風壁紙を描きます。"],["40K","二拍遅れの聞き書き","残った一言から話を思い出して、配信で読みます。"],["48K","短編の字幕係","希望の場面に架空の字幕を付け、題名と名前を添えた画像にします。"]]],
  ["麻のオクト","八本腕があったら片づけが進むと思ってた。でも今の二本でも、片手にスマホ、片手にお茶です。まず机をどうにかするのが先でした。\n\n枠では一回に一つだけ作業します。きのうは封を切るだけ。誰かが同じタイミングで封を切ったと聞いて、一人ぶんより音が大きく感じました。","八本ぶんの段取り","作業開始。机の前に座れたら、やることを一語。\n作業終了。五分たったら置けるところに置く。\nやりかけが増えただけでも、オクトが一つ片づけた音が聞けます。",[["1K","片手のお迎え","名前を読み、机から小物を一つ片づけます。"],["5K","ひと仕事のお礼","終えたことを一つ聞き、名前と一緒に記録します。"],["10K","八本手伝い印","好きな作業道具を交えた蛸のアイコンを描きます。"],["20K","今日の順番","切るかしまうか、配信で最初にする作業を選べます。"],["30K","机一枚の壁紙","作業道具の印と、片づけ前後が見える壁紙を作ります。"],["40K","五分だけ同席","選んだ机仕事を五分進め、終わったところで一言ずつ話します。"],["48K","八本腕の仕事帳","希望の仕事を一枚の図にし、あなたのやったことを記念の欄に入れます。"]]],
  ["春雷のかけら","雷が鳴るときは窓を閉めて、冷蔵庫の音が急に近くなるのを聴きます。春雷です。夏より春の空のほうが、まだこれからって顔をしてると思うんです。\n\n音が消えてから屋上へ行くと、工事中のクレーンがやけに大きい。雲がいつもより低く見える日だけ、そんな絵を残します。","屋上で空が低い日","窓を閉める。冷蔵庫の音が大きくなる。\n雨がやんだのを見計らって、いつもの屋上へ。\nその順番で空を見ます。大きな音が苦手な日は、玄関先までの話で十分です。",[["1K","雲のあいだから","名前を読み、その日の空の高さを一言で伝えます。"],["5K","雨あとの空便","今日大きく見えたものとお礼を記録します。"],["10K","低い雲の印","好きな空色の雲に表示名を添えます。"],["20K","屋根の選択","次の絵に入れる建物を、工事現場か古い屋上から選べます。"],["30K","雨前と雨後","雲のアイコンと、雨あとの屋上の壁紙を作ります。"],["40K","空の大きさ談義","教えてもらった空を小さな絵にして、他の日と見比べます。"],["48K","低気圧の絵便","お題の屋上を描き、その空に合う短文とお礼を入れます。"]]],
  ["つま先総務","【私物】灰色のスリッパ、右のみ。\n\n【特徴】歩くたびにキュッと鳴ります。\n\n総務と名乗っておりますが、家でそれを毎週片づけている私のことです。先週は冷蔵庫の前で発見。今週は出勤直前の私の左足にありました。右なのに。","なくしたスリッパ係","紛失届の記入例\n品名　スリッパ右\n最後に履いた場所　冷蔵庫の前\n発見時の姿勢　新聞を読んでいた\n係からの連絡　左足に履いておられます。",[["1K","受理の合図","名前を読み、書類を受け取るまねをします。"],["5K","発見報告","その週の小さな発見にあなた宛てのお礼を添えます。"],["10K","私物札","好きなスリッパの形で名前入りの札を描きます。"],["20K","巡回先指定","次の配信で話す捜索場所を玄関か台所から選べます。"],["30K","係の机まわり","私物札のアイコンと整理前の机の壁紙を作ります。"],["40K","紛失物聴取","最近見つからない物を聞き、一緒に最後に使った場面をたどります。"],["48K","係の特別報告書","お題から架空の紛失事件を語り、名前入りの発見報告を画像にします。"]]],
  ["ちぎり天パパ","ぱぱです。言い訳は先に書いときます。味見です。ちくわ天を二本に切ったうちの短いほうだけです。衣だけ取ったのは、息子が衣いらんて言ったからです。\n\nそのあと息子が「衣、まだ？」って聞きに来ました。話がちがうやん。今日は揚がっても紙に乗せるとこまで映しときます。","衣が先に帰る","家に届く前に食べたものから始める寄り道台所。買った豆腐がなくなった話でも、帰りに食べたコロッケでも。紙袋の端に油が染みたら報告どきです。",[["1K","揚げ台のご挨拶","名前を呼び、さいばしを一度鳴らします。"],["5K","紙袋からお礼","今日食べた最初の一口とお礼を書きます。"],["10K","衣の名札","好きな具を選び、名前入りの丸い図にします。"],["20K","揚げ順の指定","次に話す具を、野菜か練り物から選べます。"],["30K","寄り道おやつの絵","具のアイコンと紙袋柄の壁紙を作ります。"],["40K","食べ歩きの実況","教えてもらった寄り道おやつの話を、揚げ台の視点から話します。"],["48K","揚げたての三品札","希望の色から三品考え、名前入りのお品書きを描きます。"]]],
  ["島瀬、蓄音機休業中","昔の蓄音機を、音を出さずに手入れしています。壊れているところが一つでも残っている間は、鳴る曲を毎日違うように想像できる。それも楽しいのです。\n\n親戚の集まりでは機械を見せるだけでしたが、その前で叔父が昔の歌を口ずさみました。今のところ、そこだけ直ったことにしてあります。","針を落とさない音楽室","第一曲　針を上げたまま\n第二曲　叔父が口ずさんだ一節\n第三曲　まだ未定\n鳴るはずだった音を考えます。故障中の展示物には手を触れず、声はご自由に。",[["1K","針を上げて挨拶","名前を呼んで、今日手入れした部分を見せます。"],["5K","止まった曲便","聞いたことのない音を短く書き、お礼を添えます。"],["10K","蓄音器の影印","好きなラッパの形に表示名を添えます。"],["20K","次の空想曲","次に想像する音を、静かな曲か軽快な曲から選べます。"],["30K","音が出る前セット","影印アイコンと手入れ中の作業机の壁紙を描きます。"],["40K","口ずさんだ一節","お題から短い旋律を作り、配信で鼻歌にします。"],["48K","起こさない演奏会","選んだ道具の声を短編に書き、名前入りの演目札を贈ります。"]]],
  ["無限エスカ","実況席、乗り口の手前。動いている段が一、二、三。先頭は六段先へ。……六段先から見ていたのが、私です。\n\nいつでもどこか動いている街を、勝手に実況します。商店街のケーキの回転台は今日も最後まで一位でした。同じ一個しか乗ってないんで。","右側に立たない観察記","上がった話、下がった話、今朝は止まっていた話。乗る側と外から見る側で違うものを、空いた段に置くように一つずつ。",[["1K","動き出しの合図","名前を呼び、手で階段の形を作ります。"],["5K","一段分の記録","今日見た動きとお礼を書きます。"],["10K","階段の銀印","好きな段の形に表示名を入れたアイコンを描きます。"],["20K","進む向きの指定","次の動きを上がるか下がるか選べます。"],["30K","踊り場の二種","階段印と手すりの向こうを描いた壁紙を作ります。"],["40K","動きを止めて話す","何かが動き始めた一場面を聞き、止め絵のように描きます。"],["48K","動く街の一頁","希望の機械を描いて場面を作り、記念画像にします。"]]],
  ["うたたねメンテ班","修理の相談はバッジを机に置いてから。といっても、うちのぬいぐるみの縫い目を家族で塞いでいるだけです。\n\n最初の患者は目が片方取れたトラ。ボタンを選ぶ会議で右と左を取り違えました。今は左目だけ大きいけど、暗い部屋ではこちらを見つけるのが前より早そうです。","ぬいぐるみの縫い目外来","本日の外来\nトラ　左目のボタン交換済み\nねこ　綿のかたよりを経過観察中\n職員　糸が通るまで休憩中\n縫い目の思い出の聞き取りは、今日も終日受け付けています。",[["1K","外来受付","ぬいぐるみの手を持ち上げて名前を呼びます。"],["5K","糸の色のお礼","今日選んだ糸と、あなた宛てのお礼を書きます。"],["10K","片目のトラ印","好きなボタン色と名前を組み合わせたアイコンを作ります。"],["20K","縫い目を一つ","次に見せる場所を背中か腕から選べます。"],["30K","外来の棚柄","トラ印と修理待ちの棚の壁紙を作ります。"],["40K","ぬいぐるみの来歴","教えてもらった縫い目の思い出を短い聞き書きにします。"],["48K","あなただけの修理票","希望した小さな患者を紙に描き、名前入りの修理票を贈ります。"]]],
  ["眠いドットちゃん","きれいな丸が描けなくて、丸だけ描いてるドットです。塗りつぶすと余計ゆがんで見えるのに、端にもう一個添えると平気になりました。\n\n同じ紙に兄は四角ばかり描きます。二人で飽きると、丸と四角でしりとりを始めます。昨日の最後は、四角い食パン。","手書き丸の採点表","○ めがさめた。\n□ パンを食べた。\n○ またねむい。\n丸も四角もこれ以上うまくならなくていいので、眠くなるまで手元の紙に一緒にどうぞ。",[["1K","点を一つ","名前を呼び、丸を一つ紙に描きます。"],["5K","手描きの採点欄","今日の形に短い感想とお礼を書きます。"],["10K","丸と名前の印","好きな色の丸に表示名を添えた画像を作ります。"],["20K","形二択","次の絵の主役を丸と四角から選べます。"],["30K","今日は二色の日","好きな二色でアイコンと形の壁紙を作ります。"],["40K","丸だけ似顔絵","声やコメントから、丸だけで配信中に似顔絵を描きます。"],["48K","しりとりの一枚","出してもらった一語から続く絵を三つ並べ、記念画像を贈ります。"]]],
  ["12号の鳴砂","切手の収集を始めたのは、宛先を書いたあと封をする前にうろうろする時間が好きだったからです。鳴砂といいます。古い切手の端は、光に透かすと毛羽立ちまで見えます。\n\nよく間違えられますが十二号は部屋番号ではなく、最初に買ったアルバムの表紙の数字です。","封を切らない切手帳","封筒を並べて、一枚だけ違う切手を仮置きする。合わなければ元に戻す。ここではその時間をゆっくりやります。誰にも届かない宛先は、いくら増やしてもかまいません。",[["1K","切手帳の点呼","名前を呼んで今日見る一枚を掲げます。"],["5K","耳のかけら便","切手の縁で気づいたことを、お礼とともに書きます。"],["10K","切り取りの印","好きな土地を架空の切手図にし、表示名を添えます。"],["20K","次の紙色","見本の切手を貼る封筒を二色から選べます。"],["30K","発送前の組","切手アイコンと組み合わせた封筒の壁紙を贈ります。"],["40K","空想の宛先話","切手の絵から連想した宛先の話を配信でします。"],["48K","切手帳の一頁","好きなテーマの切手を三枚描き、記念日を入れた台紙にします。"]]],
  ["春のエンジン","車に乗らずに車の話ばかりする春です。祖父が乗っていた車は、助手席の窓を閉めると最後の一回だけハンドルが重かった。そこの感触を今も覚えています。\n\n机の引き出しのソケットをつい指で転がします。サイズが違うと音がちょっとずつ変わる。今日はどれが一番軽い音かな。","ソケットの引き出し","車の名前を忘れても、色やシートの手触りは話せる。エンジンがかかる前の小さな思い出を集める引き出しです。",[["1K","セル音のお迎え","名前を呼び、車の音を口でひとつまねます。"],["5K","引き出しの一行","今日触った道具を、お礼を添えて紹介します。"],["10K","工具サイズ印","選んだ数字と名前を入れたソケット型アイコンを作ります。"],["20K","思い出の座席","運転席か後部座席から、次に話す席を選べます。"],["30K","車庫のセット","道具アイコンと古い車庫の壁紙を描きます。"],["40K","帰りの車内話","選んだ車内の思い出を配信で聞き、似た話を一つお返しします。"],["48K","発車前スケッチ","好きな車のしぐさを描き、情景とお礼を一枚にまとめます。"]]],
  ["〇円ドリーマー","値札が空いてる棚に出会うと、そこで何を売るべきか決める空想をします。今日はスーパーの端の三角の隙間に「三角のおにぎり一個の専門店」。\n\n同僚に話したら「雨の日は入り口も三角」。続きが楽しくて、思わずノートに架空の売り場を作りました。全商品、値段はまだ未定です。","割引前の妄想部","実物を買わずに、棚ひとつ分のお店を空想します。商品が一個しかない売り場、逆に棚に入らないものの話も待ってます。",[["1K","仮開店のご挨拶","名前を呼び、小さなレジの音をまねます。"],["5K","空き棚の一行","今日の空想商品とお礼を短く載せます。"],["10K","値札ゼロの印","選んだ商品を名前入りの札の絵にします。"],["20K","商店街の一区画","次に開く空想店の場所を二つから選べます。"],["30K","棚の裏表","値札アイコンと天井までの空き棚の壁紙を作ります。"],["40K","店内アナウンス","提案された架空の商品を短い放送風に紹介します。"],["48K","一棚ぶんの開店式","お題の店を図にして、品ぞろえとお礼を一枚に書きます。"]]],
  ["SWAN♂","バレエを始めたら、最初に筋肉痛になったのが足じゃなくて笑う頬でした。先生が「肩の力を抜く」と言うたび、なぜか僕は笑顔になるんです。\n\nあだ名は勝手に白鳥。回ったあとの目の回り方は、だいぶ水鳥らしくなりました。","左足から始める夜","覚えた一歩と、間違えた一歩を両方持ち寄る練習後の部屋です。配信を見ながらイスでつま先を伸ばす参加も歓迎。",[["1K","つま先で挨拶","名前を呼び、稽古で覚えた小さなおじぎをします。"],["5K","忘れない一歩","今日練習した動きを一つ、お礼といっしょに書きます。"],["10K","床印アイコン","あなたの好きな靴色で名前入りの足形を描きます。"],["20K","最初の一歩","ゆっくり始めるか、軽く弾むか、次の動きを選べます。"],["30K","練習室の二色","足形アイコンと鏡のある壁紙を作ります。"],["40K","三つの動き","教えてもらった言葉を手掛かりに、短い振りを作ります。"],["48K","あなただけの練習曲","選んだ気分を短い振りにして、名前入りの手描き譜を贈ります。"]]],
  ["ぴた。○秒","コンビニでレンジの残り時間を当てる遊びをしています。三秒を当てようとして、店員さんの「温めますか」の最中にそっと指を折ったことがあります。\n\nたまに配信が長くなるのも、時間が読めないせい。今日はぴったり十分で切ると宣言して、十分目にようやく本題です。","ぴったりで止め隊","時間を数えてから投稿する必要はありません。「あとちょっとが長かった」出来事を教えてください。さっと読める一行で十分です。",[["1K","ゼロ秒の合図","名前を呼び、タイマーをゼロで止めます。"],["5K","誤差報告","数え間違いとお礼を一行ずつ載せます。"],["10K","針の止まり所","好きな秒数と表示名でタイマーアイコンを作ります。"],["20K","目標時間を指定","次に当てる秒数を一つ決められます。"],["30K","カウントの二画面","アイコンと秒針が動く途中の壁紙を描きます。"],["40K","目を閉じた一分","希望の時間で挑戦し、結果を一緒に見ます。"],["48K","誤差ゼロ表彰","選んだ長さで短い話を演じ、結果とお礼を表彰状画像にします。"]]],
  ["ギザ歯もちょ","消しゴムの角が少し欠けてると、何の歯型か一人で会議を始めます。もちょです。実際はほぼ、自分の爪です。\n\n配信の机には紙ねんどの歯型が三つ。姉にどれがワニか聞いたら「全部お母さんの奥歯」と言われたので、四つ目からちゃんと尻尾をつけました。","歯型標本室","モンスターの仕業にしたい欠け方を募集。食べかけのビスケットも立派な標本です。見つけた場所と、想像の犯人を添えてどうぞ。",[["1K","がぶっと点呼","ねんどの口を動かして、名前を呼びます。"],["5K","欠けかた報告","今日の欠けた形をスケッチし、お礼を書き添えます。"],["10K","ギザ歯標識","お好きな歯の形と名前で丸い印を作ります。"],["20K","犯人を決める日","架空の歯型の主を二択から決められます。"],["30K","標本箱二枚","選んだ怪物のアイコンと歯型を並べた壁紙を作ります。"],["40K","歯型鑑定の実況","お題の欠け方から怪物を想像して配信で描きます。"],["48K","あなたの標本展","思いついた怪物を一体仕立て、命名と標本札を入れた画像を贈ります。"]]],
  ["三度寝ルーペ","予定より三十分寝坊した日、近所の公園で三十分分の散歩を一平方メートルに縮めました。落ち葉の裏に赤い点が二つ。遠くに行かなくても見つけるものはありました。\n\n虫眼鏡を片手にしゃがむと、通りすがりの小学生に時々「何時からそこにいるの？」と聞かれます。三度寝したので今日はちょっと遅めです。","公園の一平方メートル","見つけたものが小さいほど報告しがいのある公園です。石の光り方、切り株の根元、誰かの靴裏の模様。見回す範囲は足元だけで充分。",[["1K","しゃがんでご挨拶","ルーペを掲げ、名前を呼びます。"],["5K","一平方メートル便","見つけた小さなものとお礼を一緒に書きます。"],["10K","虫眼鏡の縁取り","好きな物を拡大した名前入りアイコンを描きます。"],["20K","次にのぞく場所","砂場の端かベンチの下から、次の観察場所を選べます。"],["30K","足元の二枚","虫眼鏡のアイコンと、公園の小さな地図の壁紙を作ります。"],["40K","拡大写真の答え合わせ","気になる写真を一枚選び、配信でどこを写したか確かめます。"],["48K","あなたの一平方メートル","指定された場所の小物を三つ描き、観察カードにまとめます。"]]],
  ["南南東のピン子","ボードゲームを出すと、説明書の例に出てくる架空の人に勝手に性格を付けます。ピン子です。「ここで青を取る人は、帰りに人に傘を貸しそう」とか。\n\n一人で遊べるルールのつもりが、自分と自分で駒を出し合って夜更かし。今日はちゃんと負けた側に先にお茶を出します。","一人ルール図鑑","自分だけのゆるいルールを持ち寄ります。決めるのに勝った人と守った人が違ってもよし。ルールの名前だけ考える係も募集中。",[["1K","駒をひとつ置く","名前を読み、駒を一つ机に置いて迎えます。"],["5K","例題の横の一筆","今日出た話題に一行コメントを添えます。"],["10K","あなたの駒の色","好きな駒の形と色を選んだ名前入り画像を作ります。"],["20K","追加ルールの発案","空想ゲームのルールを一つ足せます。"],["30K","一人対戦盤","好きな二色で駒のアイコンと盤面の壁紙を作ります。"],["40K","ルール説明の聞き役","提案してもらったルールを声に出して試し、分かりにくい場所を相談します。"],["48K","あなた作の一人ゲーム","出してもらったテーマに合わせて遊びを一つ組み、図と遊び方を記念画像にまとめます。"]]],
  ["海底0.5m","腰まで水に入るとそわそわするので、海は足首から眺める0.5mです。波が引いた直後、小さな穴から水がぷっと出るのを待ってます。\n\n貝を拾おうとして一番大きな波を靴に入れた日は、何を探していたかすっかり忘れました。枠では砂を落としてから、足元にいたものだけご報告。","浅瀬の足あと部","砂が濡れてから乾くまでの、小さい変化を集めます。深い海の名前の人でも、観察するのは波打ち際に出た一歩です。",[["1K","足あと点呼","名前を呼び、小さな波の音で迎えます。"],["5K","ひいた波の一行","今日の砂浜で見つけたこととお礼を記録します。"],["10K","砂の足形印","好きな海色を選んだ名前入り足形アイコンを作ります。"],["20K","濡れた砂の見どころ","泡か貝の穴か、次に見る場所を選べます。"],["30K","浅瀬と乾いた浜","足形の印と、色の変わる砂浜の壁紙を作ります。"],["40K","波の去る順番","一枚の浜の写真で足跡や波の跡を一緒に探します。"],["48K","波打ち際の案内図","指定の浜辺を絵に描き、足元の発見と名前を添えます。"]]],
  ["mumuko.","ミシンを夜に動かすので、試し縫いの布にはおやつの名前を付けています。今週は「昨日のラスク」と「また買ったナッツ」。\n\n化粧ポーチにするつもりの布を裏返してみたら、表より内側のほうが好きでした。ひっくり返してそのまま持ち歩いてます。よく見ると、私の上着も今日は裏返し。","余り布の夜食部","作りかけで中断したものを机に持ってきてください。ほどいた話や、袋を裏返してから気付いたことも一品。縫わずにおやつだけ持ち寄る夜も。",[["1K","布を広げてご挨拶","名前を呼んで、今日使う端切れを見せます。"],["5K","裏地のお礼","今夜の布の裏側にまつわる話を、お礼と一緒に書きます。"],["10K","角丸ポーチ印","好きな布で表示名入りのポーチ風アイコンを描きます。"],["20K","内布の投票","次に合わせる裏地を手元の二枚から選べます。"],["30K","表裏セット","選んだ表地と裏地でアイコンと壁紙を作ります。"],["40K","端切れの使い道相談","気に入った布一枚から作れそうな小物を配信で図にします。"],["48K","あなただけの布見本帖","希望の色で端切れを並べ、折り目と手書きのお礼を写真に残します。"]]],
  ["BUNNY軍曹","目覚ましは一つ目で起き、二つ目で朝ごはんを思い出す軍曹です。二度目が鳴るまで布団に戻るので、偉そうな名前のわりに起床はぎりぎり。\n\n寝坊した日は朝に間に合わなかったことを夜に報告します。昨日の報告は「焼いたパンをトースターに置いたまま」。夜のほうがちょっと固かった。","早起きは二度鳴る","第一報。起床した者から今日いちばん最初にしたことを申告。第二報。目覚ましを止めて二度寝した場合は二件目に訂正のこと。以上、司令官はまだ布団から出ていません。",[["1K","一回目の点呼","名前を呼んで、小さな机上ベルを一回鳴らします。"],["5K","寝坊の申告書","今日遅れてやったことと、お礼を一行で報告します。"],["10K","起床バッジ","好きな目覚ましの形に表示名を入れます。"],["20K","ベルの係決め","次は一音か二音か、合図を選べます。"],["30K","朝と寝ぐせセット","ベルのアイコンとおふとん柄の壁紙を好きな色で作ります。"],["40K","朝の立て直し会","選んだ寝坊話から、次に先にやることを一緒に考えます。"],["48K","一日目の任務表","希望の朝の習慣を三つ絵にして、名前入りの任務表を贈ります。"]]],
  ["ゴムの木🐸","冬に公園へ行くのは池のカエルに会うため、ということにしています。本当は水面が凍っていると、その上に落ちた葉っぱがきれいだからです。\n\nカエルの鳴き声を覚えたことにして配信で披露したら、「ドアのきしむ音にそっくり」と返ってきました。今ではドアを開けるたび、元気だったか聞いてます。","三本脚の記録係","池にいたもの、池にいなかったけど似た音がしたもの。観察メモにはどちらも載せてください。雨の日の報告を特に楽しみにしています。",[["1K","けろっと出席","名前を呼んで、木のカエルを一回鳴らします。"],["5K","池の聞き書き","今日の池の音にお礼を添えて残します。"],["10K","折れ枝の蛙印","好きな木肌色で、表示名入りの蛙の印を作ります。"],["20K","岸辺のお題選び","次の観察で水面か土の上か、どちらを先に見るか選べます。"],["30K","池と森の組","蛙の印と、池の周りを描いた壁紙を作ります。"],["40K","似ている音三つ","出してもらったお題に似た音を探し、配信で鳴らします。"],["48K","あなただけの池しらべ","好きな季節の池を題に、暮らす生き物を短文と絵でまとめます。"]]],
  ["わさび少佐Δ","お寿司を買うと先に箸を出す少佐です。刺身の角にわさびをちょっとだけ、のつもりで山になったときの顔なら自信があります。\n\n会社の飲み会では毎回からし入りの皿を当てられるのに、家ではケーキの袋とからしチューブを並べたまま、ホイップクリームを探してました。","一口目だけ辛口","本日の報告欄\n・一口目の顔\n・二口目の余裕\n・残した薬味の量\n少佐は全部のせの日ほど、配信前に牛乳を用意してあります。",[["1K","つんと点呼","名前を呼び、わさびを見つけた顔を披露します。"],["5K","二口目のお礼","食べものの感想とお礼を一行ずつ載せます。"],["10K","辛口の丸印","辛さを表す好きな色で名前入りアイコンを作ります。"],["20K","薬味選定","しょうがか大葉から、次に合わせる薬味を選べます。"],["30K","薬味の小皿柄","好きな薬味のアイコンと小皿の壁紙を描きます。"],["40K","食卓の味見談義","もらった食べ方を題に、味見した反応を配信で話します。"],["48K","配膳係の特製札","選んだ皿と薬味でお品書きを作り、名前とお礼を入れます。"]]],
  ["宮原のブザー","部活でずっと補欠だった宮原です。今もバスケを見ると、いいパスより先に、次に誰が立ち上がるかベンチを見ます。\n\n卒業の日、先輩に「声だけは毎回聞こえてた」と言われたことがあって、今の配信のマイクは買う前から大きい声に強い機種にしました。","体育館二階席","二階席の奥、手すりの近くにいます。誰がベンチで立ったか見ていたあなた、そこ空いてます。歓声のあとで「その前のパス見た？」と話せる距離です。",[["1K","試合前の合図","名前を呼び、短いブザーのまねをします。"],["5K","二階席のメモ","あなたのいいプレーを一つ聞いてお礼と並べます。"],["10K","応援札アイコン","好きな色に名前と背番号を入れて描きます。"],["20K","見る位置の交代","次のプレーの見方をベンチかゴール下から選べます。"],["30K","体育館の設営","応援札のアイコンと二階からの壁紙を作ります。"],["40K","中継にない実況","教えてもらった一場面を控え席目線で語ります。"],["48K","あなたの試合記録","希望したプレーを組み込んだ架空の試合記事と記念画像を贈ります。"]]],
  ["西口のロバ","駅で人と待ち合わせて、いつも先に帰りの出口を考えてしまいます。西口に詳しいロバです。最近できた階段は左側の壁だけ曲がっていて、手を置いて歩くとちょっと早く着いた気がします。\n\nふだん使わない出口に出て、同じパン屋の裏側を見つけました。地図に載りそうにない発見を、一つずつ話します。","最後に出る出口","西口集合のつもりで、その日ちょっと歩いた話を。バス停で犬と待った話も、車で送ってもらって駅に着かなかった報告も大丈夫。",[["1K","改札外点呼","名前を呼んで、帰りに使う出口を一つ紹介します。"],["5K","出口の小さな便り","見つけた目印にお礼を添えて書きます。"],["10K","西口の矢印印","好きな矢印の色に表示名を入れたアイコンを作ります。"],["20K","遠回りの選択","次の駅前の話を、裏通りか大通りから選べます。"],["30K","駅前の二景色","矢印アイコンと希望した道側の壁紙を作ります。"],["40K","一駅の見取り図","覚えている目印を三つ聞き、駅前地図に並べます。"],["48K","あの日の帰り道","希望の帰り道を短編にして読み、名前入りの地図カードを渡します。"]]],
  ["ゆびさきスケボ","指で小さなボードを跳ねさせて遊んでます。机にスマホを置いて撮った映像は、ときどきボードより私の爪の傷がよく写ります。\n\n最初に一回跳べたとき、歓声を上げた手でミニボードをそのまま棚の裏へ。次は着地を喜ぶ前に回収します。","擦り傷のうら側","机の角や消しゴムが遊び場。指で跳べなくても「ここは台に良さそう」と見つけた場所を報告できます。机一枚ぶんの公園です。",[["1K","カツンと集合","名前を呼び、練習台でボードを鳴らします。"],["5K","擦り傷の一筆","今日の練習跡にお礼を添えて載せます。"],["10K","ボード裏の絵","選んだ色で名前入り指スケートのアイコンを描きます。"],["20K","台の材質指定","次に使う段差を木か金属から選べます。"],["30K","机上公園セット","ボードアイコンと小さなコースの壁紙を作ります。"],["40K","一技のスロー再生","選んだ動きを撮り、指の動きが見える速度で紹介します。"],["48K","机上コース設計会","手持ちの文具を使って希望のコースを作り、見取り図画像を渡します。"]]],
  ["アラキ040","短い旅行でも窓側を選んで、寝て起きたときにどこか当てるのが好きです。西に向かうはずの便で、見覚えのある川を見たことがあります。出発前、反対のホームの列に並んでただけでした。\n\n最近は地名を拾うより、家の屋根の色を見ています。川を越えると同じ赤でも急に暗くなる。行きと帰りの違いを話せたら、今日はそれで充分です。","窓ぎわの修学旅行","車窓の印象を「看板ひとつ」「屋根の色ひとつ」だけ持ち寄る旅行部。移動できない日も、昔見た帰り道の話でいっしょに遠出しましょう。",[["1K","窓側にお通し","名前を呼び、窓から見たい景色を一つ挙げます。"],["5K","車窓の余白","今日思い出した景色をお礼といっしょに残します。"],["10K","窓枠の席札","好きな景色を切り取った名前入り画像を作ります。"],["20K","車窓の行き先","田園かビル街から次に話す景色を選べます。"],["30K","夕方の乗車券","選んだ色で窓枠アイコンと車窓の壁紙を作ります。"],["40K","地名なしの旅話","教えてもらった色を手掛かりに空想の道をたどります。"],["48K","窓側の切符帖","希望の景色を三枚の車窓に描き、名前入りの旅程表を添えます。"]]],
  ["湯柱ゴジ（琥次）","湯気で眼鏡が曇って、脱衣所で別のロッカーに「お先です」って言うたことがある琥次です。風呂上がりは瓶のコーヒー牛乳派。\n\n常連さんが毎回ぶどう味を買うので、先週まねしたらとてもよかった。以来、棚の前でもう五分は迷います。配信は外のベンチから、牛乳がぬるくなる前まで。","サウナ後の牛乳会議","湯加減の話はほどほどに。出たらまず何を飲むか、歯磨きは先か後か、風呂帰りの議題だけで毎回盛り上がってます。途中参加も一票どうぞ。",[["1K","湯上がり点呼","瓶を掲げて名前を呼びます。"],["5K","脱衣かごの一筆","一番おいしそうだった飲み物の話とお礼を書きます。"],["10K","牛乳ふたの目印","好きな色の瓶ふたに表示名を入れます。"],["20K","今夜の飲み物票","次の配信の飲み物を二本から選べます。"],["30K","湯上がり手ぬぐい柄","色を選んでふたのアイコンと手ぬぐい柄の壁紙を作ります。"],["40K","ロビーの座談会","お題を一つもらい、迷ったところから話を広げます。"],["48K","今夜だけの風呂新聞","風呂帰りの一場面を取材風にまとめ、あなたを編集長にした画像にします。"]]],
  ["巳ノ宵","起きたらまず、夢に出てきた色をひとつ書きます。巳ノ宵です。乗ったはずの電車が畳の部屋になった朝は「うす緑」。\n\n夢の続きはいつも思い出せないけど、同じ色を見かけると、足の裏の畳の感触だけは戻ります。配信でひらくのは、そんな短い記録です。","七枚目の夢日記","ねぼけたまま来てください。夢を終わりまで思い出せた朝より、一色しか残らなかった朝に開く日記です。真っ白なら白紙を綴じます。それも七枚目に数えます。",[["1K","一枚目の点呼","名前と一緒に今朝の色を読みます。"],["5K","色の余白便","あなたの一色を教えてもらい、お礼を一行書きます。"],["10K","夢見の窓印","選んだ色を窓の形に切り取ったアイコンを作ります。"],["20K","続きの一場面","夢日記の続きを一言リクエストできます。"],["30K","明け方の配色","好きな二色で窓のアイコンと薄明の壁紙を作ります。"],["40K","夢の抜粋朗読","断片を三つ聞き、つないだ短文を静かに読みます。"],["48K","七枚目の夢紙","好きな色を主役に短い夢を書き、あなた宛てのページ画像を贈ります。"]]],
  ["けん爺の工具箱","退職してから覚えた配信で、家にあった古い工具を映しています。先日は六角レンチの話が五分、どの箱にしまったか探す時間が十分。けん爺です。\n\n息子からもらった新品の工具箱には、手のひらサイズの折り紙が一枚入ってた。孫からの説明書でした。今も工具を出すたびに読んでます。","ねじ一本ぶんの相談所","台所の引き出しに転がっている、何に使うか忘れたあれ。見るだけならお引き受けします。直った物の自慢は、遠慮なく。",[["1K","工具箱を開けて","名前を呼んで、昔から使っている工具を一つ見せます。"],["5K","直った物の欄","あなたが最近直したものとお礼を短く記録します。"],["10K","六角の印","好きな工具の影に名前を添えた図案を作ります。"],["20K","一本選び","次に取り上げる工具を、画面の箱から指名できます。"],["30K","仕事机の見取り図","お気に入りの工具でアイコンと机の壁紙を描きます。"],["40K","道具の思い出相談","長く持っている道具を一つ聞き、似た思い出を配信でお話しします。"],["48K","宝物の手入れ帖","希望の品を題に、見分け方や思い出を書き込んだ記念の図解を贈ります。"]]],
  ["水無瀬、再計算中","スーパーで買い物中に電卓を開くと、どの野菜の値段を足したか分からなくなる水無瀬です。レシートを眺めて、夕飯より先に合計の出し方を反省します。\n\n今月は買い物を我慢したと思ってたら、現金で買ったたい焼きが十回。紙の端に小さなたいやきマークを足して、月末まで数えます。","空欄の家計簿","月末にだけ開ける欄外です。\n今月の発見　銭湯帰りだけ炭酸を買う。\n来月への申し送り　たい焼きの日は袋を取っておく。\nこのくらいの報告を、お互いに横から読める場所。金額欄は空けてどうぞ。",[["1K","レシートを一枚","名前を読み、今日の買い物から一つ紹介します。"],["5K","欄外の記録","数字を使わず、今月の発見とお礼を一行で投稿します。"],["10K","集計印アイコン","好きな小物を記号化して名前を添えます。"],["20K","今月の見出し","次の配信でまとめる話題の見出しを選べます。"],["30K","空欄の文具セット","選んだ色でアイコンと表罫線の壁紙を作ります。"],["40K","三つの買い物話","好きな買い物を三つ聞き、どんな日だったか話を広げます。"],["48K","ひと月の小さな図鑑","選んだテーマで日々の小物を並べて描き、記念ページにします。"]]],
  ["檸檬九号室","指定は「コンビニで三年ぶりに会った元・魔王」。結局、別のレジに並んだまま終わりました。そんな寸劇を毎週やってる九号室です。\n\nすごい声が出ると思って買ったマイクは、床に落とした輪ゴムの音ばかりよく拾います。次の劇で輪ゴムを使う役、募集中。","一分だけの寸劇部","『一分劇のつくり方』\n１　場所を一つ書く。\n２　そこにいそうもない人を二人置く。\n３　一分待つ。\n間に合わなかったオチはあとから一行。席から声を出さず、笑っているだけでも参加です。",[["1K","開幕の合図","名前を読み、指を鳴らして開幕を告げます。"],["5K","幕間だより","今日のせりふを一つ選び、お礼と並べて書きます。"],["10K","九号室の通行証","好きな役柄の絵を小さな通行証に入れます。"],["20K","舞台の場所決め","次の一分劇の舞台を一か所決められます。"],["30K","登場人物の名札","選んだ役柄のアイコンと幕の壁紙を作ります。"],["40K","即興ふたり芝居","一行だけお題をもらい、二役に声を分けて配信で演じます。"],["48K","一分劇の製作席","選んだ舞台で台本を書いて演じ、名前入り演目カードをお渡しします。"]]],
  ["藤の庭86","学校で育てた朝顔が一日だけ咲いて、夜のうちにしぼんだと思ってた藤です。よく見たら、つぼみを一番花と勘違いしてました。\n\n今の鉢は巻きつくものを毎年変えます。今年は古いハンガー。窓を開けるたび、朝顔が私の服を着ているようでおかしいです。水やりの報告は月曜です。","朝顔の緑のうら","花がない週でも、つぼみ、葉っぱの裏、支柱に巻いたつるを見せ合います。何も持っていない日は、窓辺の空の色だけでも大丈夫です。",[["1K","葉っぱを一枚","今いちばん広い葉を見せ、名前を呼びます。"],["5K","鉢の週報","つぼみの数と一緒に、あなたへのお礼を書きます。"],["10K","つるの鉢札","好きな花色に名前を添えた鉢札画像を作ります。"],["20K","支柱の形案","次の鉢で使う支柱の形を二案から選べます。"],["30K","朝顔の表と裏","鉢札アイコンと葉裏から見上げた壁紙を作ります。"],["40K","写真の日付当て","育てている鉢の写真を選び、前後を一緒に並べます。"],["48K","ひと夏の花暦","希望の配色でひと夏の変化を描き、名前を添えた暦を贈ります。"]]],
  ["HIGE3","洗車機のブラシがスローモーションに見えると、つい選手紹介を口に出します。ひげさんです。先日は右のブラシが「戻りが早い」と家族にほめられてました。\n\n家で拭く日は、途中で雨が降るとピカピカの水玉が見られて得した気分。雨のない晴れ間のほうが話が短いです。","洗車待ち通信","泡が流れる間のつぶやき。車のことでも、窓ガラス越しの人の話でも。写真を貼るなら、水玉だけが主役の一枚をどうぞ。",[["1K","ブラシ選手入場","名前を呼んで、洗車機の実況風に迎えます。"],["5K","水玉写真のお礼","今日の水玉を一枚紹介し、お礼を添えます。"],["10K","泡粒ピン","好きな光沢と名前で泡の形のアイコンを作ります。"],["20K","右ブラシか左ブラシ","次の実況で紹介するブラシを選べます。"],["30K","洗いたての窓柄","泡のアイコンと水玉が残った壁紙を作ります。"],["40K","雨のあとの実況","お題を聞いて、窓ガラスの水を見ながら短い実況をします。"],["48K","洗車待ちミニ番組","あなたが選んだ場面をオープニングから演じ、番組ロゴ風の記念画像を作ります。"]]],
  ["川原サンダル","家の裏に川があるので、散歩はほとんどサンダルです。影の長い夕方にバッタを追い越して、帰りに同じ場所でまた追い越したことがあります。\n\n次の日は何もいませんでしたが、自分の足音だけが思ったより大きいことに気づきました。枠にはそのへんの、小さい発見を持ち帰ります。","バッタの向こう岸","川沿いを一周したら、実は半周で帰った日も話しに来てください。散歩の途中で道を譲った相手が虫でも人でも歓迎です。",[["1K","散歩の声がけ","名前を呼び、足音を二歩鳴らします。"],["5K","岸のすれ違い帳","今日通り過ぎたものとお礼を書きます。"],["10K","サンダル印","好きな底模様と表示名で足あとアイコンを作ります。"],["20K","次の歩く方向","上流か下流から、配信で話す景色を選べます。"],["30K","川沿いの二枚","足あとアイコンと岸の壁紙を作ります。"],["40K","一周ぶんの聞き書き","選んでもらった散歩の話を歩幅に合わせて朗読します。"],["48K","歩いた道のしおり","指定した季節の岸辺を描き、思い出とお礼の短文を入れて贈ります。"]]],
  ["ユカ、山にいます","山の天気図を開いたまま晩ごはんを作るユカです。晴れマークに釣られて早起きすると、だいたい頂上より手前のおにぎり休憩が一番楽しい。\n\n先週は霧で展望が真っ白。隣の人に借りた手袋だけが鮮やかな紫で、帰って描いた絵にはその紫を入れました。山の話は尾根を下りてから、温かい飲み物で。","尾根の休憩マット","山の名前がわからなくてもどうぞ。靴ひもを結び直した場所や、途中で分けてもらった飴の味。登頂報告の一行下に書きたいことを持ち寄る席です。",[["1K","登山口で点呼","名前を呼び、配信で小さな旗を振ります。"],["5K","峠からの報告","今朝見た空と短いお礼を活動記録に書きます。"],["10K","等高線のワッペン","好きな高度を一つ入れた名前入りの画像を描きます。"],["20K","休憩食の投票","次の山話で紹介するおやつを二つから選べます。"],["30K","山肌の配色帳","選んだ季節の色で稜線アイコンと壁紙を作ります。"],["40K","霧の日の絵日記","選んでもらった山の一場面を、その場で色にします。"],["48K","山頂に残さない記念品","希望の風景を描き、足元で見つけたものとお礼を入れた登山カードを作ります。"]]],
  ["rara×乱調","鼻歌はかなり自信があるのに、知らない人が一緒に歌い出すと半音ずれるララです。曲が終わると「今のどっちが正しかった？」から雑談が始まります。\n\n先週は妹がずれた音をそのまま覚えて、二人でずっとはもれました。今日も気づいた人だけ小さく笑ってね。","音外し歓迎の合唱団","出だしが揃ったら拍手、揃わず面白くなっても拍手。声は出せるときに。思い出した鼻歌の雰囲気だけをコメントしても参加できます。",[["1K","ひと息の点呼","名前を呼び、鼻歌で一音返します。"],["5K","乱調のお礼譜","その日の外れ方を短い言葉にしてお礼と載せます。"],["10K","ふたつの音丸","好きな二色を丸で並べた名前入りアイコンを描きます。"],["20K","入りの合図","次の鼻歌を指さしと手拍子のどちらで始めるか選べます。"],["30K","ずれた譜面柄","二色のアイコンと、音符の間がずれた壁紙を作ります。"],["40K","二声の答え合わせ","同じフレーズを二つの高さで歌って、聞こえ方を試します。"],["48K","あなただけの短い合唱","いただいた言葉を使って短い旋律を二声で歌い、記念譜を画像にします。"]]],
  ["六花トレモロ","ピアノを弾くとき、音を切る左手より余韻を残す右足が頑固です。六花です。小さい部屋で鳴りすぎた音を止めるのにも、ひと呼吸かかります。\n\n窓を開けたら遠くで救急車が通り、最後の音が聞こえなくなった日がありました。あの日だけはそのままにして、続きは弾かずに帰りました。","踏まなかったペダル","曲が終わったら、一拍待ってから拍手。そこまでを一曲と考える部屋です。音楽の言葉を思い出せなければ、最後に聞こえた音の遠さを教えてください。",[["1K","一音のご挨拶","名前を呼び、一音だけ鳴らして迎えます。"],["5K","消えぎわのメモ","今日の演奏で鳴り終えた時のことをお礼と一緒に書きます。"],["10K","黒鍵の札","好きな鍵盤位置と表示名で名前入り画像を描きます。"],["20K","余韻の長さ選び","次の一音を長めか短めか選べます。"],["30K","音の残る部屋","黒鍵アイコンと練習室の壁紙を作ります。"],["40K","間を探す即興","一言のイメージをもらって休符の目立つ即興を弾きます。"],["48K","椅子ひとつの演奏会","希望の気分で小曲を弾き、お礼を書いた手描きの曲カードを贈ります。"]]],
  ["雨衣 / AMAI","花火が終わったあとの煙が好きで、みんなが帰り始めてから空を見ます。雨衣です。雨の日は、線香花火のかわりに窓辺の雫が落ちるのを待っています。\n\n夏に一度、昼間の花火を音だけ聞きました。あの高さを想像して描くと、夜の花火よりずっと大きかった。","花火のあとの火の番","最初の一発より、最後に残った光の色を聞くファミリーです。朝まで覚えていた色なら、短い言葉だけ置いていってください。",[["1K","まだ消えない光","名前を読み、今日の残り火を絵に一粒置きます。"],["5K","雨衣の空模様","見つけた光の色に、短いお礼を書き添えます。"],["10K","残光のピン","好きな光色を一粒選び、名前入りアイコンを作ります。"],["20K","次の夜の色","次に描く夜空の色を二つから選べます。"],["30K","雨と花火の境目","一粒のアイコンと煙の残る空の壁紙を作ります。"],["40K","音から空を描く","短い音を聞かせ、浮かんだ空をその場で描きます。"],["48K","帰らない一夜","希望の色で小さな祭りの終わりを描き、献辞入りの画像にします。"]]],
  ["遠い電波 / みぞれ","ラジオのつまみをほんの少し回すと、知らない声が聞こえる。全部聞こえるように回すと消えてしまうところが好きです。\n\n小さいころは電波が雪の日だけよく来ると思っていました。本当は、家が静かで窓に当たる雪の音と一緒に聞いていたからかもしれません。","ノイズの縫い目","……受信できていますか。切れ切れでしたら、最初に拾った言葉を一つ書いてください。こちらでは雪の音と少し混ざっています。返事は途切れていても届けます。",[["1K","アンテナの点呼","名前を呼んで、短い雑音を楽器で鳴らします。"],["5K","受信ログのお礼","気づいた音をひと言で書いてお礼を添えます。"],["10K","目盛りの局印","好きな数字を一つ使い、名前入り目盛りアイコンを作ります。"],["20K","音の遠近","次の音を近くか遠くのどちらで鳴らすか選べます。"],["30K","聞こえる窓","局印アイコンと雪の窓辺の壁紙を作ります。"],["40K","片方だけの番組","短い音を作り、どんな声に聞こえるか感想を交換します。"],["48K","冬夜の短波便","お題から短い番組を録り、名入り受信証の画像を贈ります。"]]],
  ["押忍マカロン","お菓子作りは計量が九割と聞いたので、きっちり量った袋を四つ作りました。全部アーモンドでした。マカロンです。\n\n薄桃色に焼くはずが、うっかり食紅を倍入れて真紅に。会社に持っていったら、一人が「勝ちそう」と言って袋ごと持って帰りました。次は何に勝つ色にしようかな。","焼き割れ上等部","焼き割れ　けっこう。空洞　うまけりゃよし。\n一、試食の前に反省しない。\n一、二個食べたい人は一個目で言う。\n今日もトレーの前で、押忍。",[["1K","焼き上がりに押忍","トレーを掲げ、名前を勇ましく読みます。"],["5K","断面の成績表","今日の焼き割れに一言つけ、お礼を添えます。"],["10K","紅のマカロン紋","好きな焼き色に表示名をあしらった丸い画像を作ります。"],["20K","フィリングの対決","次の一組に挟む味を二択から指名できます。"],["30K","勇ましい箱入り","選んだ色で菓子箱の壁紙とマカロン紋を作ります。"],["40K","焼き色の品評会","選んでもらった二つを並べ、割って中まで配信で見比べます。"],["48K","特注おやつ決戦","指定の一色で試作し、結果とお礼を胸を張って写真カードにします。"]]],
  ["飴玉アフロ堂","湿気がある日は髪が先に教えてくれます。アフロ堂です。朝の予報は「今日は帽子ひとつぶん前に出ました」。\n\n美容室で少し切った日に雨が降ったら、初めて出かけるときまで縮んだままでした。うれしいはずなのに、窓を開けて相棒の復活を待ってしまいました。","ふくらんだ髪の天気予報","雨かどうか迷う日は、髪、洗濯物、においで分かったことを教えてください。傘を忘れた話は予報のあとにまとめてどうぞ。",[["1K","湿度の点呼","名前を呼んで、その日の髪の膨らみを手で示します。"],["5K","体感天気便","あなたから聞いた天気の合図とお礼を書きます。"],["10K","ふわっと予報印","好きな雲の色で、名前入りの雲型アイコンを描きます。"],["20K","明日の基準","次の体感予報で髪と空、どちらから見るか選べます。"],["30K","飴色の雨支度","雲のアイコンと雨粒模様の壁紙を作ります。"],["40K","窓辺の天気対談","教えてもらった合図二つから、架空の天気予報を読みます。"],["48K","一日だけの天気番組","好きな天気にまつわる小話を予報風に演じ、番組表画像を贈ります。"]]],
  ["moyuP","しゃべるより、テーブルの上を指で叩くほうが得意です。モユといいます。空き箱は特に音がよくて、中身を捨てたその日から「楽器」の棚へ。\n\n音を録るときだけ息を止めていたら、自分が終わりの合図を出せませんでした。ノートには「三秒で息をする」と書いてあります。","触った音メモ","ビニール袋、木べら、空のマグ。何を鳴らしたかは一度伏せて聞き比べます。静かに参加して、正体が分かったところで一言。",[["1K","指先の一音","名前を呼んで、机から一つだけ小さな音を届けます。"],["5K","今日の耳メモ","見つけた音と、その形に見立てたお礼を書きます。"],["10K","波形のピン","好きな小物の音を短い波形アイコンにします。"],["20K","鳴らすものの指名","机の上の候補から、次に鳴らすものを選べます。"],["30K","机の音と光","選んだ小物で波形アイコンと真上からの机の壁紙を作ります。"],["40K","音だけの三択","あなたに向けて三つの音を鳴らし、一緒に正体を当てます。"],["48K","30秒の小さな曲","好きな素材を決め、音を重ねた短い演奏と見本画像をお届けします。"]]],
  ["空耳セマ","遠くの声を勝手に聞き取って、自信満々に外すセマです。昨日は「皿を下げます」が「空を上げます」に聞こえたので、夕飯のあと窓を開けました。\n\nどう聞こえたかを先に書いてから、元の言葉を聞くと面白いです。空耳のほうが景色が広くなる夜もあります。","読唇に負ける夜","【今夜の空耳】皿を下げます → 空を上げます。\n正解が聞こえた方は、答える前にひと息。別の景色が見えた方は、窓を開けてからどうぞ。",[["1K","聞こえたよの挨拶","名前を呼び、返事の語尾だけ少し変えます。"],["5K","空耳欄の一筆","その日に出た面白い言葉とお礼を書きます。"],["10K","ことばの影印","選んだ言葉から連想した形でアイコンを描きます。"],["20K","聞き取りの場所","遠い廊下か狭い部屋から、次の場面を選べます。"],["30K","聞こえた二景","影印アイコンと空耳から描いた壁紙を作ります。"],["40K","同じ声の別解","一行を二通りに聞き分けて、空想の場面を配信で見比べます。"],["48K","空を上げる夜","選んだ空耳から短い話を書き、読み上げて挿絵カードを渡します。"]]],
  ["RX-おひる王","古い家電を箱に並べると、どう見ても基地っぽくなります。おひる王です。司令席は廃棄寸前の目覚まし。隊員の私より正確にお昼を知らせます。\n\n食堂から戻ったら、誰かが机の上で送風機の向きを変えてました。機材の配置図には今も「なぞの風あり」の矢印が残ってます。","正午の机上基地","12:00　基地、稼働。\n12:01　司令官、食堂に移動。\nこのあとは留守番の機械から報告をお願いします。家の冷蔵庫、止まった時計、卓上扇風機、どれを連れてきても隊員です。",[["1K","基地の点呼","小さなボタンを押してあなたを呼びます。"],["5K","昼の稼働報告","動かしたものにお礼と日付を添えて書きます。"],["10K","機材ラベル","選んだ装置を記号にして、表示名と組み合わせます。"],["20K","ファンの向き","次に風をどこへ送るか二方向から決められます。"],["30K","基地の配置図","装置アイコンと机全体の壁紙を作ります。"],["40K","故障という設定","使えなくなった道具の新しい役割を配信で一緒に考えます。"],["48K","基地の発足記念","好きな道具で空想の基地を設計し、お礼入りの見取り図を贈ります。"]]],
  ["砂場ナンバー404","落ちている手袋が片方だけだと、もう片方がどこで外れたのか気になります。404です。両方並べて置いてあった日は、小さな待ち合わせに見えました。\n\n道の忘れ物は拾わず、スケッチだけ。最後に必ず、もう片方が来そうなほうを少し空けます。","片方だけ博物館","常設展示は手袋右。イヤホン左と靴下右は寄託の写真のみ。\n※相方が見つかった展示品は、一度棚から下げます。\n心当たりのある片方があったら、図だけお寄せください。",[["1K","入館スタンプ","片方だけの手袋を掲げて名前を読みます。"],["5K","収蔵のお知らせ","聞いた落とし物を短いお礼といっしょに記録します。"],["10K","展示品番号","好きな片方の形に名前と番号を添えた画像を描きます。"],["20K","空いている展示台","次に探す片方を靴下かイヤホンから選べます。"],["30K","館内の対になる絵","片方のアイコンと空の展示台を描いた壁紙を作ります。"],["40K","もう片方の推理","見つけた物の相方がどこにいそうか配信で一緒に推理します。"],["48K","一品だけの企画展","選んだ物の来歴を空想し、展示札と名前入りの表紙画像を贈ります。"]]],
  ["きりん郵便局長","前の枠から持ち越した話題を、メモを頼りに今日の枠へ。字がへたすぎて「玄関にカラス」が「玄関にガラス」に見えた日から、できるだけ口でも復唱します。\n\n局長という肩書きは、首の長い置物を見て勢いで決めました。局長の往復は、配信机の右端から左端までです。","首の長い回覧板","まとめ役は首の長い置物。配信から配信へひと言運びます。前の続きを思い出せないときは、今日の報告から回覧板を始めてください。",[["1K","局長のひと回り","首を傾ける置物と一緒に名前を呼びます。"],["5K","回覧の一行","今日のひと言とお礼を回覧欄に載せます。"],["10K","消印の局長","好きな局番号を入れた小さな消印画像を作ります。"],["20K","次の配達先","次の回覧板で先に載せるお題を一つ選べます。"],["30K","郵袋のふた色","消印アイコンと、選んだ色の郵袋柄の壁紙を描きます。"],["40K","取り違え相談会","紛らわしかった言葉を一つ聞き、配信で二通りの話にします。"],["48K","あなた宛ての特別便","選んだ話題をつないだ短い回覧を読み、名前入りの消印カードをお渡しします。"]]],
  ["NEON深夜便","夜勤明けのコンビニで、毎回レジ横の同じおにぎりを選ぶ。昨日だけ売り切れてたので、初めて梅を買いました。思ったより酸っぱくて、駅まで眠気ゼロ。\n\n日が昇る前に、今日の忘れ物を一言。僕はいつも、冷蔵庫に買ったものを入れたことを忘れます。","午前2時の落とし物係","受付中の落とし物。「言いそびれたお礼」「聞きそびれた曲名」「どこかに置いた眠気」。ひとつ預けたら、ほかの人の落とし物も覗いていって。",[["1K","夜間受付","配信で名前を呼び、夜勤明けのひと言を贈ります。"],["5K","拾得メモ","今日あった小さな事件とお礼をファミリーに記録します。"],["10K","ネオンの受付札","好きな番号と表示名を入れたアイコンを作ります。"],["20K","午前2時の一問","聞きたいことを一つ選び、夜の声でお答えします。"],["30K","夜明け前の二色","看板風アイコンと空が白む壁紙を好きな二色で描きます。"],["40K","放送室のゲスト","預かった話に相づちを入れながら、配信で短いラジオドラマにします。"],["48K","終電後の落とし物","お題を一つもらって夜の短編を書き、あなた宛ての受付票画像とともに贈ります。"]]],
  ["8月の半券","映画館で席に着いた瞬間より、列で前の人の足音が止まったところが好きです。あと何歩で暗くなるかな、といつも数えます。\n\n初めて一人で行ったときの半券は、手帳の一番薄いページに挟んであります。作品名が消えかけても、入る前に手が冷たかったことは残りました。","幕が上がる前の列","席に着く前にあったことを一つ。上映前の売店、入る扉を間違えた話、終わってから暗さに目が慣れた話も、感想の代わりにどうぞ。",[["1K","開場の声","名前を呼び、短い開場案内風に迎えます。"],["5K","半券の裏のお礼","今日の覚えている場面をお礼と並べて書きます。"],["10K","ひと席の半券印","好きな席番号と表示名で半券のアイコンを作ります。"],["20K","列のどこから","次に話す場所を売店前か入り口から選べます。"],["30K","暗くなる前の二枚","半券アイコンと、客席が消灯する手前の壁紙を描きます。"],["40K","一人で観た帰り道","聞いた映画の日の記憶を五行の短文にします。"],["48K","最初の半券帖","希望の場面を短い朗読にし、名前入りの架空の半券画像を贈ります。"]]],
  ["sono","水族館でエイの裏側を見ていると一時間経つソノです。顔のように見えるところを覚えて描くと、だいたいうちの父の口元に似てしまいます。\n\n帰りの売店で薄い青の飴を一つ買います。家でなめるとまた水槽の音が戻る気がして、配信前だけ机に置いています。","影の底で潜る","エイの裏側が好きだった。照明は青かった。最後に立ち止まった水槽は思い出せない。そんな記憶を一つずつ持ち寄る、閉館後の水族館みたいな場所です。",[["1K","水槽のそばへ","名前を呼び、今日思い出した魚を一つ紹介します。"],["5K","水の向こうのお礼","気づいた泳ぎ方と、お礼の短文を載せます。"],["10K","泳ぐ影の印","好きな魚影に表示名を添えたアイコンを描きます。"],["20K","水槽の順路","次に語る水槽を大水槽か小水槽から選べます。"],["30K","うす青の思い出絵","魚影アイコンと水槽の明かりの壁紙を作ります。"],["40K","姿を言葉で当てる会","その魚の印象を聞いて、配信で特徴を一緒に拾います。"],["48K","見上げる水槽の案内","希望の生き物で空想の小水族館を描き、見取り図にして渡します。"]]],
  ["ゆらり本気。","「お先に」と言って降りた階が、自分の家より二階も下だったことがあります。ゆらりです。本気で間違えた日ほど、階段の明かりをよく覚えています。\n\n今は近所の建物の階段を絵にしてます。踊り場の窓があると、空が違う高さで二回見えるんです。配信では昨日の窓をひとつ。","エレベーターの三階","階段の手すり、エレベーターの音、いつも押し間違える階。日常で上がったり下がったりしたときの、小さい話を持ち寄ります。",[["1K","到着の合図","名前を呼んで、エレベーターの音を一度まねます。"],["5K","踊り場だより","今日見た窓の高さとお礼を記録します。"],["10K","昇降ボタンの印","好きな階の記号と表示名を入れた画像を作ります。"],["20K","次の踊り場","上りと下りから、次に話す向きを選べます。"],["30K","窓が二つの絵","ボタンのアイコンと階段の窓の壁紙を作ります。"],["40K","一階ぶんの案内","聞かせてもらった階段を配信で言葉だけで案内します。"],["48K","空の高さの見取り図","指定の建物を空想し、踊り場ごとの空と名前を地図にします。"]]],
  ["木曜レプタイル","トカゲの世話を覚え始めたころ、透明な抜け殻がガラスに貼りついていて驚きました。爪の先の形まで残ってる。木曜と呼ばれています。\n\n初めて我が家に来たのも、久々にすごくきれいな脱皮をしたのも木曜でした。配信は静かな夜だけ、顔が見えたら小声で実況します。","脱皮のカレンダー","爬虫類の仕草や、飼育箱の影に気づいたことを残す観察帳です。見てるだけの時間は観察時間としてちゃんと数えます。",[["1K","日陰から点呼","名前を呼んで、飼育箱の温度計をそっと見せます。"],["5K","木曜の目撃記録","今日見えた仕草とお礼を一緒に書きます。"],["10K","うろこの小印","好きなうろこ柄と表示名で小さな図案を描きます。"],["20K","見たい隠れ場所","飼育箱の枝と石、次に紹介する場所を選べます。"],["30K","日なたと日陰","うろこアイコンと飼育箱の壁紙を作ります。"],["40K","抜け殻の鑑賞","選んだ観察写真で指先や模様を配信で一緒に見ます。"],["48K","一夜の観察図譜","あなたのお題から小さな図譜を描き、観察日と名前を添えます。"]]],
  ["むぎちゃ法師","麦茶のやかんが鳴る前に火を止めたい法師です。台所から離れたときだけ、あんなに立派な音を出すのは何なんでしょう。\n\n祖母はふたが揺れ始める音を廊下で聞いていました。同じやかんなのに、私には台所まで戻らないと分かりません。配信では耳を澄ます時間が一回だけあります。","やかんが鳴る前","やかんや冷蔵庫の音の話を、耳を休めながらします。氷が一個しかできていなかった夜は、麦茶を二人でゆっくり分ける会です。",[["1K","湯気の挨拶","あなたの名前を呼び、やかんを机に置きます。"],["5K","麦茶のひと言","今日よく聞こえた音とお礼をファミリーに書きます。"],["10K","ふたの耳印","選んだつまみ色と表示名でやかんアイコンを描きます。"],["20K","冷やし方の投票","今日の麦茶を氷か冷蔵庫、どちらで冷やすか選べます。"],["30K","晩夏の台所","やかんアイコンと麦茶の待ち時間の壁紙を作ります。"],["40K","音の聞こえる間","二種類の容器で氷を鳴らし、耳で違いを比べます。"],["48K","やかん番の日","好きな夏の話を聞き、その日の台所を描いたお礼カードを贈ります。"]]],
  ["矢吹ハトメ","履きつぶした靴の底を比べてみると、毎回左側の後ろが先に減ってました。矢吹です。靴を買い替える日だけ、その日の歩数より歩き方が気になります。\n\n古い靴の裏に小石がひとつ刺さってたので、前の町から持ってきたものだと思って机に置きました。砂利の駐車場、昨日も通った気がします。","靴底の歩数計","歩数より道の硬さ。土、石畳、よく滑る玄関。履いていた靴と、足の下で覚えていることを一つだけ聞かせてください。",[["1K","靴底の点呼","名前を呼んで、今日履いた靴を見せます。"],["5K","足あと報告","一番覚えている路面とお礼を書きます。"],["10K","ハトメの名前印","選んだ靴ひもの色で名前入り金具アイコンを描きます。"],["20K","歩く床を指定","次に紹介する足音をタイルか土から選べます。"],["30K","足音の二景","金具アイコンと、歩いた道の壁紙を作ります。"],["40K","音から道を当てる","いくつかの足音からどの床だったか配信で当てっこします。"],["48K","一足の散歩地図","好きな道の手触りをつないで、名前入りの小地図を描きます。"]]],
  ["黒崎ピンズ倶楽部","ラペルピンを集めすぎて、たまに鎧って言われる黒崎です。お気に入りの一つはよく留め金がゆるむので、帰ったら最初に襟を裏返します。\n\n母からもらったピンは表が銀で裏が真っ黒。なくして見つからなかった日に、床の黒いほうを探したらすぐありました。","裏返した襟の話","今夜の展示は襟飾りの裏。銀色の表を知っている方も、まず留め金からご覧ください。自分の服についたものの話なら、糸一本から展示できます。",[["1K","襟を直して点呼","名前を呼び、今日のピンを見せます。"],["5K","留め金のお便り","今日身につけたものに短いお礼を書き添えます。"],["10K","小さな襟飾り","好きな形のピンに表示名を入れた画像を作ります。"],["20K","本日のピン係","手元の二つから次に付ける襟飾りを選べます。"],["30K","表と裏セット","表から見たピンのアイコンと、留め金側の壁紙を作ります。"],["40K","飾りの来歴談","好きな襟飾りを選び、持ち物にまつわる話をします。"],["48K","一日の襟の展示","希望のモチーフで三種類のピン案を描き、名前入りの台紙にします。"]]],
  ["樋口式仮眠","昼休みはどう座れば十分だけ眠れるかを研究しています。樋口式は肘をつかないのが特徴です。肘をつくと気づいたときには顔に袖の模様が残ります。\n\nいちばんよく眠れた日には、昼休みが終わる音に間に合いませんでした。次回は仕切り直しです。","座って寝る研究会","睡眠の報告要領\n①寝付く直前の姿勢\n②最後に聞いた物音\n③目が覚めたきっかけ\n②までしか覚えていない方は、おおむね成功。③を書けるほど目が覚めてからどうぞ。",[["1K","入室の小声","名前を呼んで、静かな声で挨拶します。"],["5K","仮眠記録の追記","今日の寝落ちにお礼の一行を書きます。"],["10K","椅子の角度印","選んだ椅子と表示名で小さな図解アイコンを作ります。"],["20K","次の仮眠位置","窓側か壁側から、話題にする席を選べます。"],["30K","休憩席の簡略図","椅子印と午後の窓辺の壁紙を作ります。"],["40K","目を閉じるまで","教えてもらった仮眠前の過ごし方を配信で紹介します。"],["48K","十分の小さな本","希望のお題でゆっくり読める短文を作り、名前入り表紙を贈ります。"]]],
  ["Q5","好きな本をすすめるとき、面白かったところより、止まったページを見せてしまうQ5です。一行だけよく分からなくて、コンビニへの道を一往復長く歩いたことがあります。\n\n枠では題名を伏せて、読んだあと何をしてたか話します。どのページで手が止まったかだけでも、聞かせてもらえたらうれしいです。","つまずいた行の読書会","読み終えた頁に、あとから戻ってくる人のための読書会。何が面白かったか答えにくい日は、読み終えたあと夕飯の支度まで何分かかったか、それだけ聞きたい。",[["1K","付箋一枚","名前を呼んで、今日ひっかかった話題を一行紹介します。"],["5K","余白への返事","いただいた感想に、短いお礼を添えて投稿します。"],["10K","五行目の栞","選んだ紙色に表示名を乗せた栞の画像を作ります。"],["20K","読む時間の指定","配信で話す読書時間を、通勤前か寝る前から選べます。"],["30K","読書灯の二枚組","色を選んだ栞アイコンと机の壁紙を作ります。"],["40K","題名なしの聞き書き","読んだ後の記憶を聞き、短いメモにまとめて読みます。"],["48K","あの日の五行","思い出の読書風景を短文にして、名前入りの読書記録画像にします。"]]],
  ["臼井メロ","喫茶店に入ると、コーヒーの前におしぼりと水が来ます。あの順番が落ち着く臼井です。出先で一度だけ、水のグラスが豆皿に乗って出てきて「ケーキはまだです」と慌てたことがあります。\n\n今は空いたグラスを窓にかざすのが好きです。まっすぐな窓枠が、底の厚みで少しゆがんで見えます。","喫茶店の水だけ","いらっしゃいませ。先にお水をお持ちしました。ご注文を決めるまで、窓側ではグラスの影がよく伸びます。話したいことが決まったら、そのころお伺いします。",[["1K","お水のお持ち先","名前を呼び、空の席にグラスを一つ置きます。"],["5K","注文前のお礼","待ち時間に見えたものを、お礼と一緒に書きます。"],["10K","水滴の丸印","好きなグラスと表示名を組み合わせた画像を作ります。"],["20K","席の場所決め","次の喫茶店の話を窓側か奥の席から選べます。"],["30K","窓とグラス","選んだグラス印と窓辺の壁紙を作ります。"],["40K","五分の喫茶談義","頼むものが決まるまでの五分を短い対話にして読みます。"],["48K","あなたの席の伝票","空想の喫茶店に席を一つ用意し、好きな注文とお礼を書いた伝票画像を贈ります。"]]],
  ["蚤の六郎","蚤の市でガラスのコップを買ったら、底に小さく六と書いてありました。六郎はそこから。値札を剝がす前に写真を撮って、いつか買った日のことを思い出す予定です。\n\n前の持ち主が貼ってた丸いシールを弟がきれいに取ってくれました。せっかくなので、はがしたシールにも額を付けました。","値札の裏側","高かったかどうかの話より、どうして足を止めたかを聞きます。見て帰っただけの品も歓迎。小さな傷が好きだったのなら、そこだけ覚えておいてください。",[["1K","のぞき見の挨拶","名前を呼んで、今日の一点を机に並べます。"],["5K","値札の裏の便り","手に取った理由とお礼を短く書きます。"],["10K","ガラスの見本印","好きな光の色で、表示名入りの瓶アイコンを描きます。"],["20K","棚の向き決め","次に紹介する小物を正面から見るか底から見るか選べます。"],["30K","二段の展示棚","選んだ品のアイコンと棚の壁紙を作ります。"],["40K","手が止まったところ","選んでもらった品の傷やくせをゆっくり眺めます。"],["48K","六郎の仮展示","好きな時代の小物をテーマに写真を揃え、お礼と展示キャプションを画像にします。"]]],
  ["めくる砂糖","カフェで砂糖を入れないので、紙袋がいつも一つ残る。そこに字を書きます。「雨窓」「傘の先」まで書いて、三行目は家で考えます。\n\nこの前、空だと思って持ち帰った袋は、きっちり砂糖入りでした。句帳の間からざらっと出た音が気に入ったので、一句変えました。","紙袋の句会","一句までできていなくても、好きな音を三つ。コメント欄に置いていくと、誰かが気づいて受け取ってくれます。",[["1K","一句はじめ","名前を呼んで今日の言葉を一つ読みます。"],["5K","紙袋の余白","いただいたひと言の隣にお礼を書きます。"],["10K","一粒の紙印","短い言葉を入れた名前入りの紙袋風画像を作ります。"],["20K","季節の単語","次の句会の季節を、二つから選べます。"],["30K","喫茶の句箋","選んだ紙袋印と、句を書く余白のある壁紙を作ります。"],["40K","七音の足し算","送ってもらった言葉に七音だけ足し、配信で読みます。"],["48K","三行の私家版","お題から作った短い句を三つ、献辞付きの画像にします。"]]],
  ["さば味噌は月曜","月曜だけ弁当にさば味噌を入れると、カレンダーを開く前に曜日が分かります。月曜さんです。祝日で火曜にずれると、お昼に一回だけ頭が混乱します。\n\n夕方、弁当箱が空になってるのを見るのも好きです。朝はふたが閉まらなかった日だって、持ち帰る荷物はちゃんと軽い。","働く日の弁当箱","月曜　さば味噌を確認。\n水曜　ふりかけが三袋に。\n金曜　空き箱で帰宅。\n弁当のことしか書いていない勤務日誌です。あなたの今週も一行どうぞ。",[["1K","ふたを開けて点呼","名前を読み、今日の弁当を見せます。"],["5K","おかずの欄外","今日のひと口とお礼を献立メモに添えます。"],["10K","弁当箱の印","好きな仕切りと表示名で四角いアイコンを描きます。"],["20K","火曜のおかず","次の弁当で最初に入れるおかずを選べます。"],["30K","朝夕の弁当柄","名前入りアイコンと空弁当箱の壁紙を作ります。"],["40K","残り一口の相談","終わりに残したいおかずを聞き、理由を配信で語ります。"],["48K","一週間の弁当図","希望の曜日のお弁当を描いて並べ、名前入りの献立表にします。"]]],
  ["柏木の赤丸","話し終わってから、言いたかったことは逆だったなと気づく柏木です。今朝も「帰りに来ました」と言って目が覚めました。\n\n枠の最後に一分だけ「言い直し」を設けてます。言い直す前とあと、どっちも覚えている人がいたら、どこが変わったか教えてください。","言い直し放送室","訂正前「枠の最後に次のお題」\n訂正後「枠の最後に今日のお題」\n今日のぶんは今日のうちに言い直します。コメントに赤丸が付いたら、そこまで聞こえたしるし。",[["1K","赤丸で点呼","名前を読んで、小さな印を紙に一つ付けます。"],["5K","訂正欄の一行","今日言い直した言葉と、お礼を添えて書きます。"],["10K","差し替え札","好きな訂正記号と名前でアイコンを作ります。"],["20K","読み方の採用","次の配信で一文を明るくか落ち着いて読むか選べます。"],["30K","赤鉛筆の組","訂正アイコンと紙の上の鉛筆の壁紙を作ります。"],["40K","言い直しの聞き比べ","選んだ文を二通りに読み、印象が変わるところを話します。"],["48K","放送室の小冊子","お題を短い放送原稿にして、訂正跡と名前を入れた画像を贈ります。"]]],
  ["せりな 19:03","お店で時刻入りのレシートを受け取ると、帰りの電車があと何分かを覚えてしまうせりなです。表示名は、就職して最初の給料日に買った小さいケーキの時刻。\n\n19時03分に何を買ったか、時々みんなに聞きます。あの日のケーキより大きい出来事じゃなくても、時間に印を付けられたら面白い。","レシートの時刻表","時刻　19:03\n場所　帰り道のケーキ屋\n覚えておく理由　箱を提げたら少し大人になった気がした\nこんなふうに、気分まで残る三行を持ち寄っています。時計を見なかった日の記録もどうぞ。",[["1K","今日の時刻を宣言","名前を呼んで今の時刻を読みます。"],["5K","時刻表の一行","あなたの覚えておきたい時刻とお礼を載せます。"],["10K","時計盤のラベル","好きな時刻と表示名のアイコンを描きます。"],["20K","覚えておきたい瞬間","次に話す出来事を、朝と帰り道から選べます。"],["30K","夕方の記録柄","時計のアイコンと選んだ時間帯の壁紙を作ります。"],["40K","ある一分の聞き書き","覚えている時刻の前後を聞き、短い話にします。"],["48K","一年の一分便","思い出の一分を短編にして読み、時刻入りの記念カードを渡します。"]]],
  ["ライム姐","筋トレを始めたのは、煮込み鍋を流しへ運びやすくしたかったからです。ライム姐です。先週は片手で持てたのがうれしくて、洗い終わってからも鍋をもう一回持ち上げました。\n\n配信では重さより「昨日から楽にできたこと」を聞きます。私は洗濯物を干す時間が一分短くなりました。","重い鍋の筋トレ日誌","今日は楽にできたことを一つだけ報告。回数の競争は休みです。重たいものを二人で運んで楽だった話でも歓迎します。",[["1K","できたこと点呼","名前を呼び、今日できたことに一拍拍手します。"],["5K","鍋の記録欄","進歩を一つ聞き、名前とお礼をファミリーに書きます。"],["10K","台所の力印","好きな調理器具の形で名前入りアイコンを描きます。"],["20K","次のお題を一つ","片づけか料理、次の話題を決められます。"],["30K","鍋とライムの二色","道具アイコンと台所の壁紙を選んだ二色で作ります。"],["40K","日常の小さな達成会","教えてもらった進歩を配信で一つずつ振り返ります。"],["48K","一か月の器具記録","好きな家事をテーマに成長を記録する用紙を作り、お祝いを入れて贈ります。"]]],
  ["トトトの8bit","昔のゲーム風の音を自分で作るトトトです。ピンポンと二音だけ鳴らしたら、家族から「電子レンジ終わった？」と返事がありました。\n\n最近覚えたのは、ゲームオーバー音を明るく鳴らすこと。失敗したのに外が晴れてきたみたいで、もう一回やりたくなります。枠の退出音もそれに変えました。","あと一機あります","電子音ができたら、何の場面に似合うか投票します。ジャンプ音が鍵を開ける音になったって大丈夫。音だけ聞いて帰る人にも、あと一機あります。",[["1K","起動画面の音","名前を読んで、三音の起動音を鳴らします。"],["5K","音の更新履歴","前の音から変えたところを、お礼と一緒に書きます。"],["10K","一機ぶんのドット絵","好きな形を限られた色で小さなアイコンにします。"],["20K","次の効果音","跳ぶ音と拾う音から、次に作るものを選べます。"],["30K","色数四つの画面","ドット絵アイコンと、同じ色数で画面風の壁紙を作ります。"],["40K","二音で間に合うか","あなたの出したお題を二音だけで表現し、配信で聞き比べます。"],["48K","架空ゲームの一面","選んだ場面の音を作り、面のタイトル入り画面風画像を添えます。"]]],
  ["塩麹は欠席","レシピ通りに作ろうとすると、いつも何かひとつ足りません。昨夜は塩麹が欠席。「あとはお前だけだぞ」と冷蔵庫に言ったけど返事なし。\n\n今日は昨日の煮汁でうどんを食べました。出来上がりより残りもののほうが好評なこと、うちではよくあります。","余った汁の使い道","夕飯の残りを前に、明日どう食べるか考える集合場所です。汁だけ残った日も、おいしかったところを一言添えてください。",[["1K","残り物の乾杯","名前を呼び、今日の汁をお椀で見せます。"],["5K","翌朝のお礼メモ","温め直したものにお礼を一行添えます。"],["10K","小鍋の相棒印","お好きな具と表示名で小鍋アイコンを描きます。"],["20K","ひと品の選択","残り汁をスープか麺のどちらに使うか選べます。"],["30K","台所の器柄","選んだ具のアイコンと器の壁紙を作ります。"],["40K","再登場献立","残った一品を聞き、翌日の一皿を配信で考えます。"],["48K","二日目のお品書き","選んだ材料で二日分の献立を組み、お礼入りのメニューにします。"]]],
  ["Cider_相沢","炭酸の瓶を開けたら、声量が負けるくらいの音がしました。相沢です。配信で「乾杯」をしようとして、最初の一言が瓶の音に全部持っていかれました。\n\n蚊取り線香の匂いがすると、その音と一緒に実家の階段を思い出します。夏以外も、忘れたころに一本開けてます。","ボトルの底は夏","毎回の乾杯に、夏に聞いた音を一つ添えてください。花火に間に合わなかった帰り道の足音ぐらい、小さなものが好きです。",[["1K","栓抜きの乾杯","名前を呼んで、手元の瓶を一回持ち上げます。"],["5K","ひと夏の音便","今日思い出した音に短いお礼を添えます。"],["10K","泡の名入りしるし","好きな色の泡を並べて名前入りのアイコンにします。"],["20K","次の乾杯の音","瓶かコップか、次の配信の乾杯音を選べます。"],["30K","ソーダ色の夏","泡のアイコンと夕暮れ色の壁紙を作ります。"],["40K","夏音の三択","教えてもらった季節の音を三つ鳴らし、一番近いものを選びます。"],["48K","帰り道を録る夜","思い出の夏を聞いて短い音の話を作り、栓のラベル風カードを贈ります。"]]],
  ["パンダ（留守）","どうも。画面中央にいるのは代役のパンダです。今日は配信者が遅れているので、代わりに「冷蔵庫にヨーグルトが三つあります」とお知らせします。\n\nなお昨日も代役でした。一昨日の配信については、担当からの返事をお待ちください。","白黒受信所","【本日の受付】\n　伝言　ぬいぐるみまで\n　至急　コメント欄まで\n　ご本人　戻り次第ご案内\n待ち時間が長い方は、先にお茶にしてください。局のご案内も代役が読んでいます。",[["1K","代理出席","ぬいぐるみが首をかしげながら、あなたの名前を呼びます。"],["5K","伝言のふせん","留守電風に、お礼をファミリーに書き残します。"],["10K","白黒出席印","パンダの耳と表示名だけで、すっきりしたアイコンを作ります。"],["20K","代役の指名","次の案内係を、手元のぬいぐるみから選べます。"],["30K","代理と本人の組","パンダの出席アイコンと、代役が並ぶ壁紙を描きます。"],["40K","伝言の読み上げ","短いお題をもらい、本人と代役のぶんを演じ分けます。"],["48K","留守番会議","あなたが司会の設定で短いぬいぐるみ会議を開き、議事録風画像を贈ります。"]]],
  ["弥勒ノ椅子","落語をまねするとき、緊張で座布団の端に座ってしまう椅子です。椅子なのに。\n\nこの前、お稽古の帰りにエレベーターでせりふを思い出して、うっかり「大家さん」と声に出しました。扉が開いて、向かいに本物の大家さん。あの日は稽古より自然におじぎができました。","立って聴く落語席","好きなせりふを一行、いい間があった場面を一つ。立ち聞きするつもりでもどうぞ。落語の知らない言葉は配信で一緒に調べます。",[["1K","座布団を直して","名前を読んで、軽く一礼します。"],["5K","まくらの一行便","今日のまくらから一行、お礼といっしょに載せます。"],["10K","扇の目印","選んだ扇の骨色で名前入りアイコンを描きます。"],["20K","次のお題の札","次回のまくらのお題を、季節か近所から選べます。"],["30K","高座の小道具","扇のアイコンと好きな座布団色の壁紙を作ります。"],["40K","読み分けの縁台","短い一行を、二人の声で読み分けて聞かせます。"],["48K","小さな一席","希望のお題で短い新作の一席を作り、名前入りの演目札を贈ります。"]]],

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');
const iconMessage = document.getElementById('icon-message');
const iconHelp = document.getElementById('icon-help');
const failedImages = new Set();
let imageRequest = 0;

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

async function openImage(title, url, filename) {
  const request = ++imageRequest;
  iconTitle.textContent = title;
  iconPreview.alt = title;
  iconPreview.hidden = iconDownload.hidden = iconHelp.hidden = true;
  iconMessage.textContent = '画像を読み込んでいます…';
  const separator = url.includes('?') ? '&' : '?';
  const source = failedImages.has(url) ? url + separator + 'retry=' + request : url;
  iconPreview.src = source;
  iconDialog.showModal();
  try {
    await iconPreview.decode();
  } catch {
    if (request !== imageRequest) return;
    failedImages.add(url);
    if (iconDialog.open) {
      iconMessage.textContent = '画像を読み込めませんでした。閉じてから、もう一度お試しください。';
    }
    return;
  }
  if (request !== imageRequest || !iconDialog.open) return;
  failedImages.delete(url);
  iconDownload.href = source;
  iconDownload.download = filename;
  iconMessage.textContent = '';
  iconPreview.hidden = iconDownload.hidden = iconHelp.hidden = false;
}

function entryImage(directory, number, extension) {
  return './' + directory + '/' + number + '.' + extension + '?v=2';
}

function imageButton(title, thumbnail, url, filename) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', title + 'を開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = thumbnail;
  button.append(image);
  button.addEventListener('click', () => openImage(title, url, filename));
  return button;
}

const list = document.getElementById('names');
const searchInput = document.getElementById('entry-search');
const searchClear = document.getElementById('search-clear');
const searchStatus = document.getElementById('search-status');
const manualCopyDialog = document.getElementById('manual-copy-dialog');
const manualCopyText = document.getElementById('manual-copy-text');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const entryNumber = index => icons[index].split('-', 1)[0];
const editKey = index => 'pococha-profile-copy:profile:v1:' + entryNumber(index);

function searchKey(value) {
  return value.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,
    character => String.fromCharCode(character.charCodeAt(0) - 0x60));
}

function filterEntries() {
  const query = searchKey(searchInput.value).trim();
  const terms = query ? query.split(/\s+/) : [];
  let matches = 0;
  for (const row of list.children) {
    row.hidden = !terms.every(term => row.dataset.search.includes(term));
    if (!row.hidden) matches++;
  }
  searchStatus.textContent = matches ? matches + '件の文例' : '一致する文例がありません。別の言葉でお試しください。';
  searchClear.disabled = !searchInput.value;
}

searchInput.addEventListener('input', event => {
  if (!event.isComposing) filterEntries();
});
searchInput.addEventListener('compositionend', filterEntries);
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  filterEntries();
});
document.getElementById('manual-copy-close').addEventListener('click', () => manualCopyDialog.close());
manualCopyDialog.addEventListener('close', () => {
  if (!manualCopyDialog.open) manualCopyText.value = '';
});

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブでこのプロフィールが更新されました。入力内容をコピーしてページを再読み込みしたあと、もう一度編集してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。このサイトのデータ保存が許可されているか、ブラウザーの設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  filterEntries();
  const searchCleared = updated.hidden;
  if (searchCleared) {
    searchInput.value = '';
    filterEntries();
  }
  updated.querySelector('.edit-button').focus({preventScroll:!searchCleared});
  updated.querySelector('.copy-status').textContent = searchCleared
    ? '変更を保存しました。編集した文例を表示するため、検索を解除しました。'
    : '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {copyText, successMessage = label + 'をコピーしました'} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('.family, li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      field.remove();
      button.focus({preventScroll:true});
      const manualHint = label + 'を選択しました。長押しや右クリックでメニューを開き、「コピー」を選んでください。';
      if (!copied && copyText !== undefined) {
        manualCopyText.value = value;
        manualCopyDialog.showModal();
        manualCopyText.focus();
        manualCopyText.setSelectionRange(0, value.length, 'backward');
        manualCopyText.scrollTop = 0;
        return;
      }
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = successMessage;
  });
  return button;
}

function buildCorePerkTable(perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks, number) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリー説明・コア特典を見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value family-identity';
  const nameText = document.createElement('span');
  nameText.className = 'family-name';
  nameText.tabIndex = -1;
  nameText.textContent = familyName;
  const preview = imageButton(familyName + 'のファミリー画像', entryImage('family-images', number, 'webp'),
    entryImage('family-images', number, 'png'), number + '-' + familyName + '.png');
  preview.className = 'family-image-button';
  const previewLabel = document.createElement('span');
  previewLabel.textContent = '画像を開く';
  preview.append(previewLabel);
  nameValue.append(preview, nameText);

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = 'ファミリー説明';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  const nameCopy = copyButton('ファミリー名', name, nameText);
  nameCopy.className = 'family-name-copy';
  actions.append(copyButton('ファミリー説明', name, description, {
    copyText,
    successMessage: '紹介文と全7段階のコア特典をコピーしました。ポコチャのファミリー説明欄に貼り付けてください。'
  }), nameCopy);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, feedback, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const number = entryNumber(index);
  const row = document.createElement('li');
  row.dataset.search = searchKey([number, name, entries[index][0], profile, familyName, familyDescription,
    ...perks.flatMap(([, title, description]) => [title, description])].join('\n'));
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(number + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  const profileIcon = imageButton(name + 'のアイコン', entryImage('thumbnails', number, 'webp'),
    entryImage('icons', number, 'png'), icons[index]);
  profileIcon.className = 'icon-button';
  header.append(profileIcon, title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks, number), edit);
  return row;
}

function shuffle(items) {
  for (let end = items.length - 1; end > 0; end--) {
    const pick = Math.floor(Math.random() * (end + 1));
    [items[end], items[pick]] = [items[pick], items[end]];
  }
  return items;
}

function reshuffleList() {
  const focused = document.activeElement;
  list.append(...shuffle([...list.children]));
  if (list.contains(focused)) focused.focus({preventScroll: true});
}

const initialOrder = shuffle(entries.map((_, index) => index));
list.append(...initialOrder.map(buildRow));
filterEntries();

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (standalone) {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reshuffleList();
  });
} else {
  window.addEventListener('pageshow', event => {
    if (event.persisted) reshuffleList();
  });
}
