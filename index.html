<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "るいです。帰りの電車では、イヤホンは片耳だけ。もう片方で車内放送を聞きながら、歌枠や雑談を聴いてます。コメントはだいたい家に着いてから。平成のJ-POPが流れると「これ昔めっちゃ聴いた」と書きかけますが、曲名を思い出した頃には二曲先です。\n\n曲を教えてもらうなら、タイトルの横に「二番のサビ前」とか「最後のベース」も書いてくれると嬉しい。翌朝もう一度聴くと、一人で聴いたはずなのに、薦めてくれた人の耳をちょっと借りた気がするんです。メモに「二番のあと」とだけ残った曲もあります。その日だけは誰の耳を借りても見つかってません。\n\n前に終電で、隣の人が窓に映る自分を見ながら、小さくエアギターしてました。同じ駅で降りても、まだ指が動いてる。曲名を当てたくて歩く速度まで合わせそうになって、いやいや何してるんだ、と発車メロディーで我に返りました。帰ってきて最初に再生したのは、その人が弾いてた曲じゃなくて、発車メロディーに似たイントロの曲でした。\n\n歌のおすすめは一曲で十分。好きなところの秒数も歓迎です。翌朝の通勤に、ちょっと楽しみが増えます。", "片耳プレイリスト", "帰りの電車に似合う曲を一曲ずつ。思い出せたのが「二番のあとでギターが入る」だけでも話は始められます。平成J-POPも新しい曲も、聴きどころを一つ添えてどうぞ。", [["1K", "おかえり放送", "名前を呼んで、車掌風に「今日もおつかれさま」。"], ["5K", "片耳メッセージ", "今日の気分に合う、名前入りのひと言を贈ります。"], ["10K", "帰り道の一曲", "あなたに似合う一曲と、聴いてほしい場所をお伝えします。"], ["20K", "臨時の車内放送", "「次は、よく頑張った○○さん前」と、今日の話を車内放送に。"], ["30K", "片耳きっぷ", "あなたの名前とおすすめ曲を、記念きっぷ画像に。"], ["40K", "帰り道ラジオ", "今の気分に似合う二曲とお礼を、1分のDJ風に。"], ["48K", "○○さん行きの終電", "あなた宛ての2分の車内放送と、名前入り終電きっぷ画像。"]]],
  ["初見じょうれん。", "「初見です！」「昨日もいたよね？」までが挨拶です。じょーれんです、どうもまた来ました。夕飯で抜けて、食べ終わって戻ったのに話がひとつも進んでないと、なぜか得した気がします。逆に全員が聞いたことのないお菓子を探していたら、何を聞き逃したかすごく気になります。\n\nうちで「会長」と呼ばれるのは、昨日じゃんけんで勝った人です。任期は次に負けるまで。こういう身内の呼び名は、初めて来た人に説明するときが一番面白い。みんなが当たり前みたいな顔で「会長、ご帰宅です」と言っている横で、僕が「たぶん今、風呂から戻っただけです」と補足します。\n\nそんな僕も一度、「初見さん、こんばんは！」と声をかけて「昨日あんたと一時間しゃべったよ」と返されました。しかも昨日の第一声も同じだったそうです。次に会ったときは向こうが「はじめまして」と先に言ってくれて、その日だけ僕のほうが「また来た人」の役をもらいました。\n\n分からない話題があったら「今なんの話？」って聞いてください。僕が答えます。ちょうど夕飯から戻ったところなら、二人で誰かに聞きましょう(´▽｀)", "また来た初見席", "初見です、昨日ぶりです、どっちも同じ温度でどうぞ。途中で来た人には「会長がどうして会長なのか」からお伝えします。ちなみに選考方法はじゃんけんです。", [["1K", "昨日ぶりの初見", "名前を呼んで「初見さん、昨日もありがとう！」。"], ["5K", "また来てくれて賞", "あなたが来てくれた日の思い出を一行で贈ります。"], ["10K", "自称初見の名札", "「初見・認定○回目」を添えて名前を紹介します。"], ["20K", "初見なのに表彰", "覚えているあなたの一言を「初対面の名言」として発表。"], ["30K", "初来店（自称）証明書", "名前と「昨日も来店」の認定カード画像。"], ["40K", "あなたを覚えてる理由", "好きなところや思い出を、1分の常連紹介に。"], ["48K", "○○さん歓迎総会", "あなたとの思い出を振り返る2分の総会と、会長名札画像。"]]],
  ["あずき＊", "あずきです🍡 粒あんと薄い毛布と、夜に小さな音で聴くゆっくりした歌が好き。いつもは聴いているだけですが、和菓子の話になるとお店の名前まですぐ聞きます。できれば、買った日に食べるのがよさそうか、翌日のお茶にとっておきたくなるかも教えてください。\n\nお店では、品名の札を見るのも楽しみです。「初雪」と書いてあるだけで、白いお菓子のふちが冷たそうに見える。味の感想に迷ったら、甘さを細かく説明するより「午後の濃いお茶と合いそう」と言う方が伝わることもあります。私の場合、お茶に理由をつけて夜にも一つ食べますけど。\n\n祖母がくれた紙袋に、おまんじゅうが二つ入っていたことがあります。一つは祖母の分だと思って返そうとしたら、「明日のあんたの分よ」と。家で包みを見ると、片方だけ小さく「明日」と書いてありました。翌日、昨日の自分が今日の分をちゃんと残したのがちょっと嬉しくて、急須まで出しました。\n\n今でも二日に分けるつもりで箱を買います。たいてい初日に二度開けます。二回目を「味見の続き」と呼ぶところまで含めて、私のお茶の時間です。", "粒あんと夜のお茶", "お茶をいれる間に、今日のおやつと夜に聴きたい歌の話を。和菓子のおすすめは、夕方の濃いお茶に合うか、明日のために取っておきたい味かまで聞かせてね🍡", [["1K", "湯のみ一つ", "名前を呼んで「今日のお茶、あなたの分もあります」。"], ["5K", "明日の包み紙", "「明日のあなたへ」の名前入りひと言便り。"], ["10K", "あずきのおやつ便", "お好みに合う和菓子と、お茶の組み合わせを一つ贈ります。"], ["20K", "架空の和菓子命名", "あなたのための一粒を命名。「二度目の味見」も候補。"], ["30K", "粒あんのお品書き", "名前と架空の銘菓を入れた和菓子カード画像。"], ["40K", "お茶の間お礼便", "あなたと話したことを思い出しながら、1分の茶席お礼。"], ["48K", "明日の分もある限定箱", "あなたを思わせる二品を2分で紹介。名前入りの箱絵画像付き。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 洗い物をしながら聴き始めるので、急に返事がなくなったら泡を流してるところです。ご当地のお菓子の話が出ると、あとで探せるように名前だけ覚えておきます。\n\nお茶の感想は一口目と少し冷めた頃で変わります。最初は湯気しか気にならなかったのに、甘い物を食べたあとで香ばしさが戻ってきたりする。どっちがおいしいか当てるより、その香りで何を思い出したか聞く方が好きです。僕のほうじ茶は祖母の台所。友人の答えが「いま開けたポテチ」でも、お茶がすすむので歓迎です。\n\n一度、奮発した茶葉といつものほうじ茶を飲み比べました。二人とも「こっちは香りが上品」と真剣に話していたのに、新しい茶葉を入れた急須はまだ使っていませんでした。友人が無言でそちらを持ち上げて「こちらが本日の新商品です」と。二人そろって味の違いを語った分、言い訳まで同じでした。\n\nそれ以来、家で飲み比べる日は、先にカップを二つ揃えて、それから急須も二つ使ったか確認します。食レポには自信がありませんが、お茶はちゃんといれます( ˘ω˘ )", "ほうじ茶の間", "お湯が沸いたらこんばんは🍵 ご当地のお菓子や、少し冷めてから分かるお茶の香りをゆっくり話す場所です。聴いてるだけの方にも湯のみは出してあります。", [["1K", "沸いたよコール", "名前を呼んで「湯のみ置いときました」と歓迎。"], ["5K", "湯気のひと言", "今のあなたに合う、お茶うけみたいなひと言。"], ["10K", "あなたのお茶合わせ", "好きなおやつに合うお茶を一つ、おすすめ理由つきで贈ります。"], ["20K", "急須の食レポ", "あなた向けの組み合わせを紹介。難しいときは「実家の台所の味です」。"], ["30K", "茶席の名札", "あなたの名前とおすすめのお茶を入れた茶席札画像。"], ["40K", "湯のみ一杯のお礼", "聞いてくれた時間への感謝を、1分のお茶トークで。"], ["48K", "○○さんの貸し切り茶席", "好みをもとに2分のお茶会トーク。名前入り茶席札画像付き。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこでようやく立ち上がる、ぼるとです。普段のコメントは省エネやけど、勝負どころだけ急に手が動きます。画面の前で立ったくらいで何が変わるんか。自分でも分からんけど、だいたい立ってます。\n\n逆転打のリプレーを見ると、できれば一つ前の打席まで戻したくなります。粘って塁に出た選手がおったから、その一振りで届く点が増えた。あと、打った瞬間にベンチの端から誰が飛び出したかも好きです。勝ち負けの話をするつもりで、気づけば得点にはならなかったプレーの話ばっかりしてます。\n\nある試合では、僕の配信が隣の部屋の中継より少し遅れてました。隣で家族が叫んだから「結果言うな！」と返したら「足つっただけ！」。数秒後にこっちで逆転して僕が叫ぶと、今度は「それ、もう見た」。試合が終わってから聞いたら、つったのは足の指でした。結果より先に詳しく教えてほしかったんは、そっちです。\n\n願掛けで立ち位置を変えた日に点が入って、家族から「次もそこで見て」と頼まれたこともあります。立ったのは五回でした。初めて九回までが長いと思いました⚡", "九回裏の応援席", "逆転打の話は大歓迎。その前に粘って塁に出た選手や、ベンチの端で先に立った人の話も聞きたい応援席です。途中から来ても、今のカウントからどうぞ⚡", [["1K", "応援席へ入場", "名前を呼んで「○○選手、入場です！」と拍手。"], ["5K", "本日の好プレー", "あなたの頑張りに一行の応援コメントを贈ります。"], ["10K", "応援ボードのひと言", "名前を入れたあなただけの応援フレーズを枠で紹介。"], ["20K", "代打アナウンス", "「代打、洗い物を終えた○○さん！」と頑張りを実況。"], ["30K", "名前入り選手カード", "あなたの得意技を載せた、架空の選手カード画像。"], ["40K", "九回裏のお祝い実況", "今日できたことを1分の逆転実況に。地味な好プレーも拾います。"], ["48K", "○○選手のヒーロー特番", "あなたを主役に2分の試合実況と名前入りスコアカード画像。"]]],
  ["たっぷりん🍮", "ぷりんと呼んでください🍮 固めのプリンに苦めのカラメルが好き。新作は棚の前で一度迷います。買わない方の理由までよく考えて、だいたい買います。歌枠で懐メロが流れると洗濯物をたたむ手が止まるので、タオルの山で枠の盛り上がりが分かります。\n\nおすすめを聞くときは、スプーンを入れた跡が残るかも知りたい。口に入れるまで角が残るものと、途中でふわっとほどけるものでは、同じ固めでも違う気分で食べられます。私はカラメルを最後の一口に合わせて残す派。三口目でもう計画が崩れるので、結局その日いちばん苦いところを途中で食べます。\n\nごほうび用を冷蔵庫に隠して、隠し場所ごと忘れたことがあります。翌朝、家族が野菜室から出して「昨日からここが高級デザート売り場」と。横には誰かが隠したシュークリーム。犯人は名乗り出ませんでしたが、その日のうちにプリン以外もきれいになくなりました。\n\nおやつの写真は断面でよければ撮れます。食べる前に撮ってと言われても、カメラよりスプーンが先に手に入ってるので。みんなの報告も、写真なしの一言から歓迎です。", "固めプリン同好会", "固め派にもとろとろ派にも席があります🍮 プリンの食感や、カラメルをどこで混ぜるかを話す部です。懐メロが流れたら、おやつの話も洗濯もいったん休憩。", [["1K", "スプーン一杯の拍手", "名前を呼んで「拍手をひとすくい！」。"], ["5K", "おやつの応援札", "忙しい日にひと息つける、名前入りの短いメッセージ。"], ["10K", "今日のごほうび候補", "好みの食感を聞いて、ごほうびプリンのタイプを一つおすすめ。"], ["20K", "新作プリン発表", "あなた専用のプリンを命名。「野菜室でひと晩熟成」は架空の売り文句。"], ["30K", "名前入りプリンラベル", "好みの食感とあなたの名前を入れたラベル画像。"], ["40K", "高級おやつ売り場の放送", "あなたをイメージしたプリンを、1分の売り場放送で紹介。"], ["48K", "○○さんの限定プリン", "オリジナルプリンの2分発表会と、名前入り限定ラベル画像。"]]],
  ["mira☾", "mira（ミラ）です。眠る前に弾き語りや、穏やかな雑談を聴いています。映画館では客席の照明がつくまで座っているほう。立つと映画から現実へ戻るので、エンドロールの間だけはもう少し居させてもらいます。\n\n好きな映画の話は、あらすじを全部説明するより「あの部屋の冷蔵庫、ずっと鳴ってたね」みたいなものが好きです。同じ場面を観た人が「そのとき手元で、出すか迷ってた手紙をしまってた」と言うと、もう一度観たいところが一つ増えます。話を聞いてから観る二度目は、一度目に見えなかったものまで入ってくる気がします。\n\n昔、ある映画の曲を探して友人に鼻歌を送りました。「途中から別の曲になってる」と返ってきて、翌日には正解と、混ざったほうの曲の名前まで届きました。どうも、好きなところを歌い終えたあと、無意識に次に好きな曲へ乗り換えていたようです。今でも二曲を続けて聴くと、あのときの妙なつなぎ目で笑ってしまいます。\n\nコメントは考えているうちに話題が変わることがあります。前の話に返事をしていたら、映画館でまだ立ってない人だと思って、そっとそのままにしておいてください。", "余韻のひと席", "映画を観終わっても、すぐには席を立たない人へ。夜の弾き語りと、その場で言いそびれた感想を聞く席です。あらすじより、耳に残った物音を一つ持ってきてくれると嬉しいです。", [["1K", "今夜のひと席", "名前を呼んで「照明がつくまでごゆっくり」。"], ["5K", "余韻のお礼", "あなたの言葉や今日の気分に合わせて、一行の感謝を贈ります。"], ["10K", "あなたへ一曲", "今夜の気分に合う曲を一つ、聴いてほしい理由と一緒に。"], ["20K", "今日のエンドロール", "一日の話を映画の配役に。「主演、開かなかった傘」もあり。"], ["30K", "一夜のポスター", "あなたの一日を題名と名前入りの映画ポスター画像に。"], ["40K", "眠る前の一分朗読", "あなた宛ての小さな物語とエンドロールを1分で朗読。"], ["48K", "あなたの一夜を上映", "あなたを主役に2分の朗読。名前入り上映ポスター画像付き。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。謎解きは答え合わせのちょっと手前が好き。手がかりは全部ありそうで、まだ全員の推理が割れている時間です。枠では答えを出す前に「ヒント要る？」と聞きます。私が急に「なるほど」としか言わなくなったら、だいたい自分の推理を片づけてます(￣▽￣)\n\nノートは左に見たもの、右に考えたこと。「引き出しに赤い丸」は左、「りんごの暗号だ」は右。分けておくと、仮説だけ消して初めから考えられます。便利なのですが、私の右側はよく字でぎっしりです。一度、左に「まだ何も見てない」とだけ書いていました。\n\n脱出ゲームで椅子の下をのぞき続けた日も、見たのは座面と四本の脚だけ。なのに「この椅子、絶対何かある」と言い切ったら、係の人が「お疲れでしたら座って大丈夫ですよ」と。引っ込みがつかなくなって全員で座りました。答えは出なかったけど、みんなちょっと休めました。\n\n見当違いの推理も、理由が聞けると面白いです。正解を当てた人も、謎のない椅子に座っていた人も、答え合わせまでは同じ作戦室にいてください。", "仮説だらけの作戦室", "見たものと推理したことを分けて書く、謎解き好きの作戦室。外れた案も、どうしてそう思ったか聞きたいです。休憩用の椅子は、そのまま座ってよし。", [["1K", "作戦室の一席", "名前を呼んで「椅子は普通です。安心してどうぞ」。"], ["5K", "認定・観察上手", "あなたの気づきに、短くてちょっと大げさな称号を贈ります。"], ["10K", "あなた宛ての一問", "好みに合わせた一問ミニ謎を、答えとセットで贈ります。"], ["20K", "名探偵の表彰", "あなたが気づいたことを探偵口調で称えます。椅子は証拠から除外。"], ["30K", "名前入り探偵証", "あなた向けの二つ名を入れた、架空の探偵証画像。"], ["40K", "あなたの一分捜査劇", "あなたを名探偵役に、1分で謎を解く短い寸劇。"], ["48K", "名探偵○○の解決編", "あなたが主役の2分の謎解き寸劇と、解決済みの捜査カード画像。"]]],
  ["からあげレモン🍋", "晩ごはんを考えながら、みんなの晩ごはんを聞きに来ます。からレモです🍋 ラーメンの話を聞けば、さっきまでの献立はすぐ変更。コメントに🍋だけ置く日はだいたい笑ってます。お弁当のおかずの話なら、翌朝まで忘れません。\n\n揚げたてがおいしいのは期待どおり。そのあと冷めても好きだったかを聞くのが、お弁当を決めるときの楽しみです。一度、すぐ食べる分と翌日用を買って比べようとしたのに、帰りに両方食べました。温度の比較はできなかったけど、お腹が減ってる間は仮説を立てない方がよさそう、とは分かりました。\n\nみんなの唐揚げに「レモンかけていい？」と声をかけたとき、力を入れすぎて汁が自分の目にも飛びました。こっちが涙目になっている横で、友人は冷静に一個つまんで「うん、この一個だけめっちゃ酸っぱい」。みんなの分は無事でした。僕はそのあと、横に置いてあった自分の水をまず探すところからでした。\n\n「あと一品どうする？」と聞かれたら残り物を全部聞きますが、最後にコンビニのコロッケを推すこともあります。相談しているうちに、相談した人よりこっちが食べたくなるんです。", "ひと絞り食堂", "晩ごはん、何にする？🍋 揚げたての唐揚げも、冷めてからおいしいお弁当のおかずも、ここでは話の主役。大皿のレモンは、絞る前に一声どうぞ。", [["1K", "ひと絞りのお礼", "名前を呼んで「拍手、レモンひと絞り分！」。"], ["5K", "おかず札", "あなたの一日に「今日のよくやった」を一行添えます。"], ["10K", "あなたの副菜案", "好きなおかずに合う副菜を一つ、理由つきでおすすめ。"], ["20K", "架空定食の店内放送", "あなた専用の定食をおすすめします。レモンは一声かけてから。"], ["30K", "名前入りお品書き", "あなたの好きなおかずを主役にしたメニュー画像。"], ["40K", "あなたへ一分食レポ", "専用定食を1分で紹介。店員のお腹が鳴る前に締めます。"], ["48K", "ひと絞りの特別コース", "あなた宛ての2分の架空コース紹介と、名前入り献立画像。"]]],
  ["kohaku.", "こはくと申します。休日は、開店したばかりの喫茶店で厚切りトーストを頼みます。食器の音くらいしか聞こえない席が好きです。メニューは毎回きちんと開き、「次は違うものを」と思いながら今日も同じ注文をします。\n\n家で本を読みながら配信を聴くと、耳に残った曲名を付箋に書きます。少し経ってそのページを開くと、小説の一場面と、そのとき聴いていた歌が一緒に戻ってくることがある。読み返したときに別のページに印をつけると、同じ本を読んでも目が止まる場所は変わるんだなと思います。昔の付箋を全部外した日だけは、どこに戻していいか分からず、そのまま読み直しました。\n\nしばらく通えなかった店に寄った帰り、店主に「今日は本、お持ちじゃないんですね」と言われました。本を読んでいた話をした覚えはなく、いつものトーストのついでに覚えてくれていたようです。次の週は本を一冊持っていきました。運ばれてきた皿の向こうで少しだけ目が合って、その日はそれで充分でした。\n\n最近の読書でも、昔から好きな曲でも、気に入った一文や一音だけ聞かせてください。続きを知りたくなったら、こちらからそっと聞きます。", "付箋のある喫茶室", "読みかけの本と、耳に残った曲を置いていける喫茶室です。どんな話か全部説明しなくても大丈夫。付箋を挟みたくなったところから話しましょう。", [["1K", "窓側へどうぞ", "名前を呼んで「今日もお越しいただきありがとうございます」。"], ["5K", "一行しおり", "あなたの好きな言葉から、名前入りのお礼の一行を贈ります。"], ["10K", "今日の喫茶おすすめ", "今の気分に合わせて、読む本のテーマか聴く一曲をおすすめ。"], ["20K", "一文の注文", "あなたの言葉をもとに短い物語を書き、焼き上がり待ちの間に朗読。"], ["30K", "名前入りしおり", "あなたの言葉を入れた、喫茶室のしおり画像。"], ["40K", "あなたの一分掌編", "あなたがふらっと来店する、小さな喫茶店の話を1分で朗読。"], ["48K", "○○さんの開店祝い", "あなたが主役の2分の喫茶短編と、作品の一文入りしおり画像。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかで呼んでね。早押しが得意というより、考えがまとまる前に送信できます。前に「こんぴざー！」って挨拶したら翌日もそう呼ばれて、一晩だけピザ屋をやった気分でした。朝一発で目が覚める曲、引き続き募集中です。\n\n大喜利で何も浮かばないときは「誰がこれを言ったらおもしろいか」から考えます。ふつうの「お待たせしました」でも、店の中で迷った館内放送の係が言えばちょっと笑う。そうやって頭の中で一人二役やってる間に、枠はもう次のお題。早押し部の部長、考えると遅いです。\n\nしりとりで得意げに「みかん」と送ったことがあります。みんなが「ん」から始まる言葉を探してくれたのに、次に自分が送ったのは「だいこん」。枠主に「ぴかは拍手係できる？」と聞かれて、そこからは持ち味を発揮しました。最後に優勝した人より先に👏を送った自信があります。\n\n挨拶間違いも、すべった答えも、誰かが拾うとその日の看板になります。変な言葉で呼ばれたくない人は今のうちに教えてね。私もそろそろピザの人から戻りたいです。", "ぴかっと早押し部", "こんぴかー！ 早押し、しりとり、急な大喜利が始まります⚡ 「ん」で終わっても拍手係は続行。誤字は拾って笑えるくらいのやつだけ、今日のお題にしよう。", [["1K", "こんぴか落雷", "名前を呼んで「小さめ落雷！」と一拍手。"], ["5K", "誤字つきお祝い札", "名前は正しく、祝辞だけ一文字まちがえた一行を贈ります。"], ["10K", "元気が出る一曲", "あなたへ一曲を選び、早押しクイズ風に紹介します。"], ["20K", "ぴかのお題返し", "あなた向けのお題で10秒大喜利。すべったらぴかが一人で拍手。"], ["30K", "名回答の賞状", "あなたの面白かった一言を載せた、名前入りの賞状画像。"], ["40K", "あなたの一分大喜利", "あなたの話題でぴかが一人二役。初戦とリベンジを1分で。"], ["48K", "○○さん杯の優勝放送", "あなたを主役に2分の大喜利特番と、名前入りの優勝賞状画像。"]]],
  ["しりゅう_08", "しりゅう。夜にふらっといます。アニメは少し前の作品を見返すことが多いです。昔は退屈で飛ばした回が、今になって一番好きになる。結末の話をする前は相手が観たか聞きます。まだなら、まず主題歌の話くらいから。\n\n二周目は脇役を一人決めて、その人の表情を見ます。主人公が前を向いている間に、横で目をそらしたり手を止めたりしてる。一度目にはただ間が空いたと思ったところで、あの人は言い出せずに黙ったんだな、と気づくのが好きです。\n\n釣りから帰ったら場所と時間をメモしています。坊主の日も空の色くらいは覚えておきたい。ある日、まったく釣れなかったので、帰りの魚屋でアジを買いました。袋を見た家族は「すごいじゃん」。レシートを見せると「そりゃ大きさも揃うわけだ」と、夕飯では魚屋さんがやけに褒められました。翌週から家を出るたび「今日はどっち行くの？」と聞かれます。まず海には行くよ。\n\n見返して見つけた脇役の一言でも、釣れたのか買ったのか微妙な魚でも、気が向いたら教えてください。魚屋の営業時間のメモが一番詳しいのは、ここだけの話です。", "夜釣りとアニメ棚", "釣れた日も、魚屋に寄った日も。昔のアニメを観返して気づいた表情や主題歌の話も歓迎です。結末に触れるときは、先に相手がもう観たか聞いてから。", [["1K", "釣り帰りのお礼", "名前を呼んで「今日も来てくれて助かった」と短くお礼。"], ["5K", "本人の釣果札", "あなたができたことを「本日の一尾」として一行で贈ります。"], ["10K", "今夜の一話便", "好みに合うアニメの見どころを、結末を伏せて一つ紹介。"], ["20K", "本日の釣果実況", "「出勤前にゴミ出し達成、一尾」みたいにあなたの成果を実況。"], ["30K", "あなたの釣果図鑑", "小さな成果を一尾に見立てた、名前入りの図鑑カード画像。"], ["40K", "あなたが主役の次回予告", "今日の出来事を、1分の釣りアニメの予告風に。"], ["48K", "○○さんの二本立て", "あなたの一日を釣果ニュースと架空アニメの予告にして2分。図鑑画像付き。"]]],
  ["たいやき＠しっぽ派", "先にしっぽからいきます。名前はたいやきでも、しっぽでも。先端のカリッとしたところが本番なので、買うときは横からも見ます。「あんこ入ってないところを真剣に選ぶ人、初めて見た」と言われました。そういえば自分で買うならあんこ派なのに、最初に食べるところは、あんこがなくていい。\n\n商店街の寄り道も、元のお題をみんなで忘れるくらい脱線した雑談も好きです。「それ何味？」と聞いた相手が実は飲み物の話をしていて、私だけたい焼きの新作を想像していたこともあります。うっかりしたときは、そのままおやつの話に誘います。\n\n頭派の友だちに「うまいこと分けよう」と一匹を任せたら、渡されたのは先端だけ。向こうの皿には頭から胴体まで乗っていました。「しっぽが好きって言ったでしょ」と言われたら、うまい返事も出ません。あれから二匹買います。今では向こうから「しっぽ二ついる？」と聞いてくれるので、まず食べるところの話が早いです。\n\nカスタードとあんこを同じ袋に入れてもらうと、しっぽからでは味が分かるまでちょっとかかります。この時間も含めて買い物なので、袋に印はつけなくていい派です🐟", "しっぽから商店街", "頭派もしっぽ派も寄ってって🐟 あんこがないほどカリッとした端っこも、熱く語る立派な話題です。脱線して誰も話を戻さなくなったら、二匹目を買う合図。", [["1K", "端っこでお祝い", "名前を呼んで「今日のカリッとしたとこ、どうぞ」。"], ["5K", "しっぽ札", "あなたに合う「カリッとひと言」を、焼き上がり札風に。"], ["10K", "頭としっぽのおすすめ", "好みの味を聞き、いちばん好きそうなひと口を紹介します。"], ["20K", "架空たい焼きの売り口上", "あなた向けの具で一匹を宣伝。しっぽまで入ったかも報告。"], ["30K", "名前入りたい焼き袋", "架空たい焼きの絵と名前を入れた包装紙風画像。"], ["40K", "あなたの一分販売会", "あなたをイメージした二匹を1分で紹介。しっぽの厚みも解説。"], ["48K", "○○さんの看板たい焼き", "あなた専用のたい焼きを2分でお披露目。名前入り包装紙画像付き。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけで大丈夫。ひと駅ぶん遠回りする夜に、歩く音が聞こえるくらいの音量で話や歌を聴きます。雨の日は傘をさしているので返事は家に着いてから。最後に聴いた曲だけ、先に一言残すことがあります。\n\n帰り道の曲は、歩く速さに合うかより、足を止めても続きを聴いていたいかで選びます。ある夜、ポストの横で立ち止まって、曲が終わるまでぼんやりしていました。翌日も同じところで止まって、あのポストが僕の一時停止ボタンみたいだと思いました。\n\n大事な用事がうまくいかなかった晩に、歌い終えた枠主が「今日はここまで。みんな、帰ったら寝ようね」と言いました。励まそうと何か言われたわけでもないのに、もう家に帰っていいんだと肩の力が抜けました。信号が変わるのを待って、家に着いたら本当に電気を消して寝ました。\n\n一日を全部話そうとすると、最初の一言がなかなか出ません。そんな日は「今日は月が見えた」とだけ書きます。「こっちは曇り」と返ってくると、短いやりとりの間に、自分の街と誰かの街が一つずつ入った感じがして好きです。", "月夜の遠回り", "いつもより少し遠い帰り道に、夜の歌と他愛ない話を。何を書こうか迷う日は、今見える空のことだけでも聞かせてください。返事は家に着いてからで大丈夫。", [["1K", "ひと駅のおかえり", "名前を呼んで「今日もおかえり」と静かに迎えます。"], ["5K", "月夜の便り", "あなたの空模様に合わせた、一行のお礼。"], ["10K", "遠回りのおとも", "今の気分に合う一曲を、聴きたくなる道と一緒におすすめ。"], ["20K", "寄り道予報", "「○○さん地方、明朝まで家事が弱まる見込み」と今日を予報に。"], ["30K", "帰り道カード", "あなたと好きな風景を添えた、名前入りの夜道カード画像。"], ["40K", "あなたへ一駅朗読", "その日の話をもとに、1分の散歩話を読みます。"], ["48K", "○○さんへの月夜便", "あなたに贈る2分の散歩朗読と、名前入りの夜道カード画像。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間にいます。好きなのは舞茸の天ぷら、ゲーム、誰かのコメントにそっと乗っかること。急に黙ったときは、たいてい手がふさがってます。手が空くと、何事もなかったみたいに戻ってきます。\n\nゲームで迷ったら、曲がり角の看板まで戻ります。現実でも同じ作戦で店を探したら、赤い看板の店が三軒並んでました。最後に役に立ったのは、隣の店の前でいつも寝ている犬。翌週いなかったので、目印にした犬に休憩日があるところまでは考えていませんでした。\n\nある日「おかえり」を「おかわり」と送って、数日間「大盛りにする？」と聞かれました。「漬物も」と返したら「今日は切らしてます」。枠主が「うち、何屋だと思われてる？」と言ったところに、初見さんが来て「何がおすすめですか？」。そのときだけ返事が思いつかず、三人くらい同時に黙りました。次からもう舞茸の天ぷらって答えようと思います。\n\n作業しながらの「りょ」を「り」だけ送って、しりとりを始められたこともあります。訂正より先に「りんご」を取られる枠、けっこう居心地がいいです。", "おかわり休憩所", "作業の合間にひと休み🍄 ゲームも小ボケも、つい送っちゃった誤字の話も歓迎。「おかわり」と書いてあっても、大盛りの相談より先に、まずおかえり。", [["1K", "ログインおめ", "名前を呼んで「ログイン確認。おかわり！」。"], ["5K", "セーブのひと言", "今日の頑張りを、ゲームの記録みたいに一行で贈ります。"], ["10K", "今日の任務札", "あなたがもう終えたことに、かっこいいクエスト名をつけます。"], ["20K", "クエストクリア実況", "あなたの家事を「タオル討伐完了！」などのクリア実況に。"], ["30K", "セーブ済み伝票", "名前とクリア名を入れた、ゲーム風の伝票カード画像。"], ["40K", "あなただけの追加ステージ", "あなたの頑張りをネタに、1分のゲーム風お祝い寸劇。"], ["48K", "○○さんのクリア記念", "あなたが主人公の2分の冒険寸劇と、名前入りクリア伝票画像。"]]],
  ["こうめい＊", "こうめいです。問題を出されると、答える前に出題者の狙いを考えます。考えた結果、最初に浮かんだ答えをわざわざ変えて外すことがあります。歴史ものでは「あそこでこうしていれば」と言いやすいのに、自分が打つボードゲームでは毎回、次の一手で悩みます。\n\n初参加の人には「どっちが気になる？」と先に聞くようにしています。慣れている側から見ると不思議な手でも、理由を聞くと、同じ盤面の違うところを見ていたと分かる。あとからルールを説明するときも、その人が使った言葉を借りる方が伝わることがあります。\n\n前に、小学生に自分の作戦を丁寧に話したら「でも、僕のコマをそこに置けば勝ちだよ」と言われました。本当にその一手で終わりです。「確認してたんだよ」と答えると、「じゃあぼくの番も確認して」。その子は責めている顔でもなく、ただ早く次の番をやりたそうでした。僕だけ手を動かさずに長話をしてました。\n\n枠で会議をするなら、先に風呂か先にごはんかくらいでも十分。どっちを選んだかより、どうしてそっちだったかを聞かせてください。空腹の軍師が長く話し始めたら、そのまま次の人へ手番を回して大丈夫です。", "一手先の円卓", "ボードゲームと歴史の話を囲む円卓。慣れてる人の定石も、初参加の「ここに置いたら？」も、理由まで聞くと面白い。私が作戦だけ延々と語り出したら、手番を進めてください。", [["1K", "円卓の一席", "名前を呼んで「○○殿、本日の先手をどうぞ」。"], ["5K", "軍師のひと言", "あなたの一手をたたえる、短い軍師風メッセージ。"], ["10K", "あなたの小さな作戦名", "普段うまくやっていることに、戦略っぽい名前をつけます。"], ["20K", "功績の評定", "日常の頑張りを軍師口調で解説。「先に風呂作戦、無事成功」など。"], ["30K", "名前入り作戦図", "あなたの好プレーを描いた、架空の盤面カード画像。"], ["40K", "あなたの一分作戦会議", "あなたの工夫や一手を、軍師が1分かけてたたえます。"], ["48K", "○○殿の勝利評定", "あなたを主役に2分の作戦トーク。名前入りの勝利作戦カード画像付き。"]]],
  ["れん_07", "れん。邦ロックと弾き語りが好きです。音源では気づかなかったギターがライブでやけに良かった、という話に弱い。外では聴いてるだけで、家に着いたら「こんばんは」。教えてもらった曲は、次の朝に歩きながら聴くことも多いです。\n\n一回目はそのまま聴いて、二回目は歌の合間の楽器を追います。三回目からは探さなくても、その音が歌と一緒に聞こえてくる。昔好きだった曲で試すと、友だちとサビばかり歌っていたせいか、いいところを半分くらい聞き逃してた気がします。\n\n小さいライブハウスで機材が止まったとき、歌い手さんが「ここだけ歌える？」と客席を見ました。最初は前の数人だけだったのに、次の歌詞になると後ろの列からも声が聞こえて、最後は本人が笑って歌えなくなりました。音源を聴くと今でも、その辺で後ろの列の声を待ってしまいます。曲は普通に先へ進むのに。\n\n逆に、隣の人の手拍子を終演の拍手だと思って、曲の途中で一人きっちり拍手したこともあります。前列がよく見えるとは限らないし、後列が静かとも限らない。どの席で何が聴こえたかまで聞けると、またその曲を聴きたくなります。", "ギターが鳴る後列", "邦ロックや弾き語りの話を、ギターがよく聞こえる後列で。好きな音が出てくるところや、客席が思わず歌い出したサビの話を一つ聞かせてください。", [["1K", "後列の歓迎", "名前を呼んで「ギターがよく聞こえる席へどうぞ」。"], ["5K", "夜の半券メッセージ", "あなたへ、今夜のライブに来てくれた気分のお礼を一行。"], ["10K", "あなたへの推し曲", "気分に合う曲と、最初に聴いてほしい楽器の音を紹介。"], ["20K", "一音のスポットライト", "あなたの好きな一音を、ライブでの曲振り風に紹介します。"], ["30K", "名前入りセットリスト", "あなた向けの二曲と聴きどころをカード画像に。"], ["40K", "一分アンコールMC", "あなた宛てに、紹介したい二曲を1分でMC風に伝えます。"], ["48K", "○○さんの記念ライブ口上", "あなたのための2分のライブ風トークと、名前入りセットリスト画像。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」と続けて聞いてたら、たぶんじにです＊ 旅の話がいつのまにか駄菓子の話になってる枠が好き。教わったお店は地図に保存して、次に頼みたいものを短く書いておきます。短くしすぎて、あとで困ります。\n\nメモに「絶対また行く」とだけ書いた店へ、理由を確かめにもう一度行きました。おいしいけど、何かが違う。駅まで歩いてやっと思い出しました。私が食べたかったのは、その店を目印に曲がった先のたこ焼きでした。今は近所にピンが二つ立っています。そのうち一つには「前のピン参照」とあります。直したつもりでした。\n\n最近は「誰と行きたいか」も書きます。立ち食いなら一人、大盛りなら友だちと半分ずつ。ある店に「次は一人で」と書いたら、翌週本当に一人で行くことになり、店員さんに「先週のお連れさまは？」と聞かれました。先週は最後の一口を取り合ったんです、とまでは言わず、今日は一人で食べきりました。\n\nおすすめは味だけでも嬉しいです。帰宅まで袋を開けずにいられたかまで聞くのは、私が待てない方だからです。お店のメモの見出しは、最近ますます長くなりました。", "よりみち地図帳", "旅先のおやつや、地元の人が帰りに寄る店を記録する地図帳です。「次は何を頼むか」までぜひ。目印のお店と本命のお店のピンが逆でも、気づいたら教えてね＊", [["1K", "寄り道歓迎", "名前を呼んで「○○さんの席にピン立てました」。"], ["5K", "あなたの目印メモ", "好きなおやつに、名前入りの一行メモを添えます。"], ["10K", "おやつの寄り道案", "好みに合いそうなおやつを一つ、どこが好きそうか添えて紹介。"], ["20K", "新店の看板紹介", "あなた好みの架空のおやつ屋さんを店名から紹介します。"], ["30K", "あなたの寄り道マップ", "名前入りの店と、隣のたこ焼き屋を入れた地図画像。"], ["40K", "あなた宛て一分食べ歩き", "好きな味をもとに、二軒の架空のお店を1分で案内します。"], ["48K", "○○さんの商店街", "好みに合わせた2分の架空街歩き。あなただけの寄り道マップ画像付き。"]]],
  ["港レター_", "旅の話が好きな方へ。みなとです。海沿いを歩くことと、出先でポストを探すことが好きです。知らない街の名前を聞くと、名所の景色と一緒に「朝、どこでパンを買うんだろう」と思い浮かべます。\n\n道案内の矢印を見ても、地元の人が反対向きに歩いていると、その先が気になります。地図に印のない通りで、シャッターを開ける音と朝ごはんの匂いがすると、街に住む人の朝を少し見せてもらった気がします。同じ道でも、歩いた時刻は旅のメモに残します。店が閉まった頃しか知らない場所も、今度は早起きして行ってみたくなるので。\n\n自分宛てに旅先からはがきを送ったことがあります。帰宅した夜に届いて、裏には「明日の朝は港でパンを買う」とだけ。読みながら、書いたときは明日の予定で頭がいっぱいだったのに、届いたときにはもう味まで知っているんだなと思いました。自分の字なのに、旅先にいた誰かから届いたようでした。\n\n近所の道でもいいので、好きな寄り道を一つ聞かせてください。時刻や、お店から何の匂いがしていたかまで覚えていたら、私はそこを歩いてみたくなります。みなとより。", "海辺のポスト", "旅先で見つけた寄り道を、はがき一枚ぶんだけ。朝のパン屋でも、地元の人がよく通る裏道でも。場所と一緒に、そのときの匂いや音を聞かせてください。", [["1K", "港からひと言", "名前を呼んで「○○さん宛て、無事届きました」。"], ["5K", "海辺の一行便り", "好きな風景を想像して、あなた宛ての一行を書きます。"], ["10K", "あなたの朝の寄り道", "気分に似合う架空の街と、おすすめの朝の寄り道を一つ。"], ["20K", "旅はがきの朗読", "あなた宛ての短いはがきを朗読。追伸にはパン屋の話。"], ["30K", "名前入り絵はがき", "あなた宛ての言葉と架空の消印を入れた画像。"], ["40K", "港町の一分便り", "あなたの好きな風景から朝と夜を想像し、1分の手紙に。"], ["48K", "○○さん宛ての港町", "あなたへ架空の街から2分の旅便り。名前入り絵はがき画像付き。"]]],
  ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ 懐メロとカラオケの十八番によく反応します。ドライブ用なら、行きは思わず音量を上げる曲、帰りは窓を少し開けて聴きたい曲。みんなは行きと帰りで何を変えるのかも聞きたいです。\n\n誰かが十八番を歌うときは、マイクを口元から離す瞬間を見るのが好きです。長い音で少し離したり、静かなところで近づけたり。同じ曲でも覚えている間が人によって違います。僕は笑うとマイクを離すので、録音ではその場所だけ急に真顔になったみたいに静かです。\n\nカラオケで自信満々に入れた曲の歌詞が全然知らないものだったことがあります。同じ題名の別の曲でした。その曲も知っていた友人がマイクを拾って歌い切り、僕は横でタンバリン。後日「またあれ入れてね」と言われました。あれはもう彼の十八番だと思うんですが、選曲したのは確かに僕です。\n\nそういうわけで、曲名が出ないときに無理に当てなくても大丈夫。サビの雰囲気や、いつ聴いていたかを話してるうちに、思い出す人がどこからか出てきます。出てこないときは、しばらく僕が口でタンバリンをやります。", "サビから歌う会", "十八番とドライブの一曲を持ち寄る会♪ 曲名が出なければ、どんな日に聴いてたかからどうぞ。サビが来たところでコンビニに着いたら、降りるのは歌い終えてから。", [["1K", "口タンバリン一発", "名前を呼んで「シャカッ」と拍手代わりにお祝い。"], ["5K", "十八番のお礼札", "あなたの曲の好みを思い出し、名前入りのひと言を贈ります。"], ["10K", "運転席へ一曲", "気分に合いそうなドライブ曲を、聴きどころと一緒におすすめ。"], ["20K", "昔のラジオの曲振り", "あなたへの一曲をDJ風に紹介。最後は口タンバリン。"], ["30K", "名前入り番組表", "あなたへ贈る二曲を、ラジオの番組表画像に。"], ["40K", "あなたへ一分の選曲便", "あなた向けの二曲と曲を選んだ理由を1分のDJ風で。"], ["48K", "○○さん宛て夜ラジオ", "あなたがリクエストした雰囲気で2分の番組。名前入りの番組表画像付き。"]]],
  ["かんうどん🍜", "かけ、ちくわ天、ねぎ多め。「かん」で大丈夫です🍜 寒い日だけカレーに寄り道します。夕飯を作りながら枠を聴くので返事は一拍遅れますが、だしの話だけは包丁を置いてすぐ書きます。地元のうどんに何が乗るか、家で煮るだしとはどこが違うか、そういう話に弱いです。\n\n初めての店では天ぷらを浸す前にだしをひと口。次は衣がふやけてきた頃にもう一口。温かいうちにも、具を食べ進めているうちにも、好きなところが違います。次は順番を守るとメモして、揚げたてのちくわ天が来るとだいたいそのまま浸します。\n\nいつもの店で初めて「いつもので？」と聞かれたとき、覚えてもらえたのが嬉しくて即うなずきました。来たのはカレーうどん。前の週に一度だけ頼み、白いシャツに汁を飛ばしたことがありました。帰り際、店主から「今日は黒い服で良かったね」。注文より服のほうをよく覚えていたようです。次にかけを頼んだら、今度は向こうが笑ってました。\n\n旅の写真は、城と橋の区別がつかなくても二日目のうどんだけすぐ分かります。ねぎの下に何が乗っていたかまで思い出せるので、旅の記録はもうお品書きにしてもいいかもしれません。", "ねぎ多めの席", "かけ、ちくわ天、ねぎ多め🍜 うどんの話なら、何が乗っていたかも聞きたい席です。季節の変わり目はカレーの話が増えます。白い服の方は少し後ろへ。", [["1K", "ねぎ多めの拍手", "名前を呼んで「○○さんの分、拍手もねぎも多め！」。"], ["5K", "今日の一杯メモ", "あなたの一日に合う、短い店主風のお礼メッセージ。"], ["10K", "あなたのうどん合わせ", "好みの具に合う薬味を、ひとつ理由つきでおすすめ。"], ["20K", "だしの実況中継", "あなた専用のうどんを想像して食レポ。「天ぷら、入れちゃいました」。"], ["30K", "ねぎ多めのお品書き", "あなたの名前と好みの具を入れたメニュー画像。"], ["40K", "あなたの一分試食会", "好みの一杯をだしと天ぷらに分けて1分で紹介。"], ["48K", "○○製麺の特別営業", "あなたの看板うどんを2分でお披露目。名前入りメニュー画像付き。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 星座は勉強中。夜空に明るいものを見つけたら、まず何時でどっちの方角か覚えます。星だったら嬉しいし、飛行機ならどこ行きか気になる。方角を忘れた日は「近所のコンビニの上」で説明します。遠くの人に分かるはずがないのに、そこから一生懸命説明してしまいます。\n\n同じ場所から翌日も見上げると、屋根の角やアンテナが目印になります。詳しい人が何を見ているか最初はよく分からなかったけど、今は前の日と比べられるだけでも楽しい。昔の自分なら見上げなかった空を、一分だけ気にするようになりました。\n\n友人と流星を待っていた夜、僕が「あっ」と言ったとき向こうも「あっ」。二人で「やっと見つけたね」と喜びました。帰り際に友人が「あと一本あった」と言うまで、私は一緒に流星を見たと思っていました。相手が見つけたのは、近くの自販機にあったお気に入りの缶ジュース。私は空、向こうは自販機を見ていました。\n\n月と深海なら今は月に行きたいです。通路側しか取れなかったら、窓側の人にメモ帳を渡して、外で何が見えたか書いてもらうつもり。現地の感想なら、流星じゃなくて缶ジュースでも一応読みます。", "土星の窓側席", "今日見えた星、月と深海ならどちらに行くか、正解がいらない夜の話をする窓側席◎ 星座が分からなければ「コンビニの上」からどうぞ。", [["1K", "窓側へのご案内", "名前を呼んで「窓側空いてます。コンビニの上を経由します」。"], ["5K", "一行の星便り", "あなたの今日を、窓側からの短いお礼便りに。"], ["10K", "あなたの星空のおとも", "気分を聞いて、夜空を楽しむ見どころを一つ紹介。"], ["20K", "あなたの新星座", "今日あったことに星座名をつけます。「洗濯ばさみ座」も立派な候補。"], ["30K", "名前入り星座カード", "あなただけの架空の星座を、名前と星の絵で画像に。"], ["40K", "あなたの一分宇宙案内", "あなたの星座を1分で解説。途中で自販機も目印にします。"], ["48K", "○○天文台の夜", "あなただけの星を紹介する2分の架空案内。名前入り星図画像付き。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。「もち」だけでも振り向きます。たくさん話せる日と、ただぬくぬく聴いていたい日があります。昨日の続きのはずなのに朝になって「おはよう」と言ったら、そのまま寝ていたと思ってください(-_-)zzz\n\nお餅はきなこ派。お雑煮は「いつものと違ったら最初にどこに気づく？」と聞くのが好きです。湯気の匂いで分かる人もいれば、箸を入れて餅の形が違うと分かる人もいる。毎年同じお椀を前にしているからこそ、人の家の話がちょっとした旅みたいに聞こえます。\n\n前のお正月は、食べ進めると底からお餅が三つ出てきました。小さい頃に「一つじゃ足りない」と何度も言ったらしく、家の人が覚えていたんです。今は三つもいらないと思いつつ、結局きれいに食べました。翌朝「今日も三つ？」と聞かれて初めて「一つでいい」と言えました。足りなかった頃の僕が聞いたら、たぶん信じません。\n\n枠主の「おやすみ」だけちょうど聞こえて目が覚めた晩があります。起きるために鳴る音の反対をもらったみたいで、そのままもう一度寝ました。そういう晩があるので、「聴いてるよ」と打ったかどうかは翌朝まで自分でも分かりません。", "毛布ときなこの部屋", "きなこ餅派も、お雑煮にその家の決まりがある人も、毛布の中からこんばんは。挨拶の返事が翌朝でも気にしない、ぬくぬく聴ける部屋です。", [["1K", "毛布から拍手", "名前を呼んで「毛布から出なくて大丈夫」と小声でお祝い。"], ["5K", "ぬくぬくの一行", "疲れた日のあなたに、肩の力が抜ける一行を贈ります。"], ["10K", "あなたのおやすみ札", "今夜の気分を思い出して、名前入りのおやすみの言葉を贈ります。"], ["20K", "寝落ち実況", "「○○選手、毛布に入ったまま静かに優勝です」と小声で実況。"], ["30K", "布団で優勝認定", "あなたの名前と勝因を添えた、おやすみ賞状画像。"], ["40K", "ぬくぬく一分便り", "あなた宛てに1分のひと息トーク。最後は静かに「おやすみ」。"], ["48K", "○○さんの毛布大会", "あなたが静かに優勝する2分の実況劇。名前入りのおやすみ賞状画像付き。"]]],
  ["いかいかが？", "いかです🦑 名前を「いかがですか？」まで読んでもらえるとちょっと嬉しい。水族館ではクラゲの前で同行者に置いていかれます。置いていかれたと言うより、「あとで追いつく」と言ったきり、しばらくクラゲを見てます。\n\n水槽の前では説明板より先に、「この魚、今なに考えてるんだろう」と想像します。隅にじっとしている魚を眺めて「恋の悩みかな」と言ったら、連れは「あそこは水の流れがゆるそう」。同じ魚を見て、こっちは恋愛相談、向こうは水槽の設計の話。正反対なのに、二人ともその場を離れませんでした。\n\n前にエイに向かって水槽越しに手を振ったら、向こうの通路の子が笑って振り返してくれました。そのあと隣のお母さんまで手を振って、私ももう一度振ったので、ひと通り挨拶が済む頃にはエイの行き先が分かりませんでした。友人に「知り合い？」と聞かれ、「今、知り合った」と返しました。名前も知らない人と、あれだけ挨拶したのは水族館が初めてです。\n\n枠でも天気の話から深海まで来て、よく「そもそも誰が始めた話？」となります。最初に天気を聞いたのは私だったりします。今日はどこまで流れてみますか。いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 雨の話から深海まで、流れ着いた話題を眺める部屋です。水槽の向こうに手を振り返す人がいたら、その話からどうぞ。", [["1K", "クラゲ前の歓迎", "名前を呼んで「クラゲ前、あなたの席空いてます」。"], ["5K", "水槽のひと言便り", "好きな生き物から、あなたへの短いお礼を一行。"], ["10K", "あなたの一槽", "好みを聞き、眺めていたくなる生き物と、注目する動きをおすすめ。"], ["20K", "水槽の代弁放送", "あなたの気分を水槽案内に。「考え事中につき低速運転」など。"], ["30K", "名前入り水槽プレート", "あなたと好きな生き物の組み合わせを、説明板風の画像に。"], ["40K", "あなた宛て一分ガイド", "好きな生き物二つを、1分の館内ガイド風に紹介。"], ["48K", "○○さんの閉館後ツアー", "好みに合わせた2分の架空ツアー。名前入り入館票画像付き。"]]],
  ["ゆづる❄", "こんばんは。ゆづるです。温かいものをひと口飲んでから、夜の歌枠を聴きに来ます。静かな声で始まるバラードが好きです。周りが静かだと、歌い手さんが息を吸うところまで聞こえる。大きく声が出る曲も好きだけど、耳を澄ませたくなる歌は、終わってからもしばらく残ります。\n\n感想は、うまくまとめようとするより、聴いたところを一つ書きます。「二番の前で息を吸う音が好きでした」。その一行で、どこを聴いていたかが伝わる気がします。たまに一行を打っては消している間に次の曲が始まります。歌の区切りでやっとカップに手を伸ばすと、もう飲み物は冷めています。\n\n少し雪が積もった朝、出勤しようと出たら家の前だけ雪がよけてありました。隣のおじさんが通りがかりにやってくれたそうです。次に降った日に早起きしてお返ししようと思ったら、もう半分終わっていて「せっかくだから一緒にやるか」と。寒かったはずなのに、今でも思い出すのは手の冷たさより、二人で近所のパン屋の開店時間を話したことです。\n\n歌のことを聞く日も、言葉が一つしか出ない夜も、ここではどちらもいいと思っています。今日は書くより先に、飲みごろのうちにひと口いただきます。", "雪あかりの歌席", "温かいものを一口、夜に聴きたい歌を一曲。感想は、心に残ったところを一つだけでも。返事を考えて飲み物が冷めた人には、ここにも仲間がいます。", [["1K", "ひと息のお祝い", "名前を呼んで「今日も一息ついていってください」。"], ["5K", "一行のおやすみ便り", "その日のあなたへ、短い労いの言葉を贈ります。"], ["10K", "あなたへ夜の一曲", "気分に合うバラードを一曲、聴きどころも添えておすすめ。"], ["20K", "ひと口ぶんの手紙", "好きな夜の景色を添え、あなた宛てに短く朗読します。"], ["30K", "雪あかりの便箋", "名前と手紙の一行を入れた、便箋カード画像。"], ["40K", "あなたへ一分朗読", "今日の気分に合わせた1分の手紙。飲み物が冷める前に。"], ["48K", "○○さんの雪あかり", "あなただけに選んだ風景で2分の朗読。名前入り便箋画像付き。"]]],
  ["じゃっくん☆", "はーい参加します！ 何に参加するかは今から聞きます。じゃっくんです🙌 実況、早押し、大喜利。誰かが置いたボケに一人一個ずつ足して、最後には最初のお題が思い出せなくなってるのが一番好きです。隣の部屋に聞こえないように笑うのが、そのときだけ本気の勝負です。\n\n大喜利で「冷蔵庫に社長が住んでます」と誰かが書いたら、僕は社長が自分のプリンに何て書くか考えます。「無断で食べた者は会議室へ」くらいまで出ると、次の人が「会議室も冷蔵庫の中」と続きをつけられる。正しい答えはなくても、前の一行を拾うと初参加の人が混ざりやすくなるんです。うちの冷蔵庫なら、それでも社長のプリンは食べます。\n\n対戦ゲームで「やった勝った！」と叫んだのに、追っていたのはずっと友だちのキャラでした。自分のキャラは端っこで壁に向かって走ってました。「声は完全に勝者だった」と言われて笑いすぎ、次の試合は自分を見つけた頃に終わりました。\n\n冷蔵庫を開けただけでも、実況をつけると決勝戦みたいになります。話すことが決まってなくても、とりあえず挙手してみてください。ルール説明は僕も一緒に聞きます。", "とりあえず参戦部", "実況も大喜利も、まず挙手🙌 誰かの一言に一個ずつ足して、電子レンジの残り一秒まで勝負にします。はじめましての人も、何に参加するかはあとで聞いて大丈夫。", [["1K", "いきなり表彰", "あなたの名前を呼んで「種目は未定ですが拍手！」。"], ["5K", "仮エントリー表彰", "日常の小さな頑張りに、面白い競技名を一行で贈ります。"], ["10K", "あなたの実況見出し", "一日の出来事から、スポーツ新聞風の一行を贈ります。"], ["20K", "日常の決勝戦", "あなたの一場面を実況。「電子レンジ、残り一秒を見送ったー！」。"], ["30K", "あなたの仮競技メダル", "名前と競技名入りの、お祝いメダル風画像。"], ["40K", "あなたへ一分二種目杯", "あなたの普段の活躍を二つ拾い、1分で入場から表彰まで。"], ["48K", "○○さん杯の決勝特番", "あなたが優勝する2分の架空大会。名前入り結果カード画像付き。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。休みの午前中はパン屋さんに寄ることが多いです。「家に帰ってから食べる」と言いつつ、袋の匂いがいいと、店を出てすぐに一つ食べます。家に着いて減っていたら、焼きたてを一つ食べて、家に一つ持って帰る予定だったと思うことにしています。\n\n料理の話を聞くと、何を入れたかに加えて「いつ入れた？」も聞きたくなります。同じ材料でも、最初から煮るのと最後に一振りするのとでは印象が違う。同じだしを使っているのに家によって味が少し違う話も、そうやって聞くと納得することがあります。私だったら「最後に少し」のあとでもう少し入れて、家族に何をしたかすぐ見抜かれます。\n\n焼きすぎたクッキーを「焦げたところはよけてね」と友だちに渡したら、あとから送られてきたのは空っぽのお皿の写真でした。横に「次は倍で」の紙。その後、張り切って倍の量を仕込んだら、天板を二枚使ったせいで焼く時間を取り違えました。今では渡すときに「焼き具合チェックお願いします」と言います。味の話ができる相手がいると、この程度の失敗は持っていきたくなります。\n\n歌枠なら曲の前に昔の思い出を聞ける時間が好きです。レシピでも歌でも、やり方だけより、そのとき誰と何を話したかまで聞く方が、あとでよく思い出します。", "焼きたてひと皿", "パンの匂いと隠し味の話をする、焼きたての一皿。何を入れたかと、いつ入れたかを両方聞きたいです。ちょっと焼きすぎた分も、ここでは味見のうち。", [["1K", "焼きたてのひと言", "名前を呼んで「味見の一枚ぶん、ありがとう」。"], ["5K", "おやつの一行札", "今日のあなたを思い浮かべた、小さなお礼を一行。"], ["10K", "あなたの隠し味案", "好みの材料に合うものを一つ、おすすめ理由つきで贈ります。"], ["20K", "焼きすぎ新作発表", "あなた好みの架空の焼き菓子を命名。焦げ目も個性として紹介。"], ["30K", "あなたの焼き菓子ラベル", "名前と好きな材料を入れた包装カード画像。"], ["40K", "あなた宛て一分試食会", "好みをもとに新作を想像し、1分で食感と香りを紹介。"], ["48K", "○○さんの限定焼き菓子", "あなた宛ての新作発表を2分で。名前入り限定ラベル画像付き。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方に家事をしながら「おつかれ〜」とだけ書いて、また耳に戻ることがあります。拍手のコメントが並んでたら、しれっと一つだけ足します。散歩の曲は、気づくと足が速くなるくらいが好きです。\n\n家事用の曲は、一曲目でタオル、二曲目で食器。サビまでに一区切りつくと地味に得した気分です。この前は一曲目に聴き入ってしまい、食器のほうは次の曲を待たずに明日の予定になりました。音楽で家事がはかどる日はあるけど、はかどらなかった日の曲の方をよく覚えています。\n\n季節限定のゆず味を探して三軒回り、最寄りの店のレジ横でそれっぽい袋の山を見つけたことがあります。「今なら二個お得」に乗って帰り、食べてからゆず胡椒味だと判明。悔しくて家族に「見つけたよ」と出したら、向こうは「探してたのこれでしょ」と本物を出してきました。同じ店で、商品名を最後まで読んで買ったそうです。\n\n柑橘のおやつは、香りが先か、すっぱさが先か。みんなで食べて一斉に「すっぱ！」になるものがあったら教えてください。私はその声を聞きながら、ちょっと先に水を探しておく係です。", "ゆず色おつかれ会", "夕方の「おつかれ〜」だけでも歓迎🍊 家事の区切りに一曲。買った柑橘おやつがゆず胡椒味だった報告も歓迎です。片付けより歌に聴き入った日は、ひとまず拍手しとこ。", [["1K", "夕方おつかれ拍手", "名前を呼んで「家事の途中でも一回拍手！」。"], ["5K", "柑橘ひと口メッセージ", "あなたへ夕方に読み返せる、一行のおつかれさま。"], ["10K", "今日の一曲便", "散歩か休憩か、気分に合う一曲と聴きどころを贈ります。"], ["20K", "柑橘表彰タイム", "「洗濯完走賞。乾くのは明日でも拍手！」と頑張りを表彰。"], ["30K", "名前入り家事クリア札", "あなたの頑張りを柑橘イラスト入りのカード画像に。"], ["40K", "あなたの一分夕方ニュース", "今日できたことと、おつかれさまを1分の夕方ニュース風に。"], ["48K", "○○さんのおつかれ特番", "あなた宛ての2分の夕方ニュース。名前入り「本日の家事終了」画像付き。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。戦国の話で気になるのは、合戦の勝ち負け以上に、誰が誰にどんな手紙を出したか。猫の話も守備範囲広めです。コメントが「かわいい」だけの日ほど、ちゃんと聞いております。\n\n手紙では、堂々とした本文より、最後にそっと添えられたお願いが好きです。立派な言葉を並べたあとに「これだけは忘れずに」と続くと、書いた人が本当に心配していたことが見える気がします。我が家の置き手紙でいちばん効くのは「猫のおやつ一回分を忘れずに」。家中の誰が書いても、そこだけしっかり読まれます。\n\n武将を紹介する番組を家族と見ていたら、いい場面で猫がテレビの前に座りました。巻き戻しても、また同じところで画面にかぶる。三度目には、全員が武将より猫の参戦を待っていました。以後、家族がテレビの前に立つと「参戦ですか？」と声がかかります。本人が何もしていなくても、立ち位置一つで話題を持っていくのは強い。\n\n先日も枠で戦国の話をしながら猫殿に座布団を勧めたら、私の座っていた方へ。当然の顔だったので、そのまま譲りました。領地を取られるときって、意外と静かでござるฅ", "ねこ殿の書状部屋", "武将の書状と猫の話を、夜にしれっと。武将が決めゼリフを言うところでも、猫殿が画面前に来たら、皆でいったんそちらに注目ですฅ", [["1K", "猫殿への拝謁", "名前を呼んで「座布団は猫殿と半分ずつで」と歓迎。"], ["5K", "肉球の一行書状", "あなたの名前を入れ、猫殿から短いお礼を贈ります。"], ["10K", "猫殿の称号", "あなたの良いところに、猫殿が大げさな二つ名を贈ります。"], ["20K", "猫殿からの書状朗読", "あなた宛ての書状を朗読。追伸は「おやつを追加されたし」。"], ["30K", "名前入り肉球花押", "猫殿からあなたへのお礼を、肉球印つきの書状画像に。"], ["40K", "あなたの一分御前評定", "あなたの功績を1分まじめにたたえます。猫殿は途中で帰る予定。"], ["48K", "○○殿の一城進呈", "あなたの城名をお披露目する2分の授与式。名前入りの書状画像付き。"]]],
  ["ぜうす_", "ぜうす。呼び捨てで平気です。コーヒーは深煎り。映画の帰りに感想が割れて、降りる駅の手前まで話したのに結論が出ない、あの時間が好きです。枠では普段は聴いているほう。返事を考えている間に、話題が二つくらい先へ行きます。\n\n意見が割れたときは、どっちが正しいかを言う前に、相手がどの場面を覚えていたかを聞きます。自分は黙って立っていた人物の顔を覚えていて、相手はその人が手をずっと動かしていたと言う。見直したら単に袖を直しただけでも、友人が見なければ私も最後まで気に留めなかった仕草です。\n\n帰りの電車で友人と「あの主人公、あそこで何を考えてたんだろう」とずっと話したことがあります。話が妙にかみ合うので油断していたら、降りる直前に別々の人物を主人公だと思っていたと判明。家に着いて場面を思い返すと、どちらを主人公にしても話が通る。もう一駅ぶん話したくなりました。\n\nゲームは見た目で装備を決める派。友人と同じ衣装にしたら、一人だけ写っている写真を二人とも「自分」として保存しました。見た目だけで話を決めると困ることもある。そう思いながら、次も装備は見た目で選びます。", "深煎りの上映後", "深煎りを一杯、映画の終わったあとの話を。答えが割れたら、先に覚えている場面を聞かせてください。結末に触れそうなら、まだ観ていない人に一声。", [["1K", "深煎りの一声", "名前を呼んで「上映後の一杯、どうぞ」と迎えます。"], ["5K", "余韻の一行", "あなたの話から心に残ったところを、一行にしてお返し。"], ["10K", "あなた宛ての一本", "好みに合いそうな映画を、結末に触れず一つ紹介。"], ["20K", "今日の別解", "あなたの一日を、二つの結末がある短い映画風に語ります。"], ["30K", "名前入りエンドカード", "あなたの言葉を残した、架空映画のエンドカード画像。"], ["40K", "あなたの一分編集会議", "一日の出来事から、二つの見え方を1分で楽しむ映画風トーク。"], ["48K", "○○さんの二重エンド", "あなたを主役に、二つの結末を計2分で朗読。名前入りタイトル画像付き。"]]],
  ["りさっち＊", "りさっちです☺️ カフェではだいたいいつものメニュー。リップは新しい色も試したい派。ドラマは観終わった日のうちに一人くらいに感想を言いたいです。洗い物の途中でも「みんなならどうする？」と聞こえたら、一回手を拭いて返事を打ちに来ます。\n\nドラマは「推し」と「自分が同僚だったら味方につく人」を分けて答えるのが好き。登場すると目で追っちゃうのに、同じ職場なら毎日早く帰りたくなりそうな人物、いますよね。同じ人を好きだと分かったあとで、どの場面で味方をやめるか話すと、その人の好みまで少し分かって面白いです。\n\n派手かもと迷っていたリップを塗って出かけた日、友だちが「今日なんか顔が明るいね」と言いました。色を変えたことは言ってなかったので、その一言が嬉しかった。帰って購入履歴を見たら、同じ色をすでに二本買っていました。私が欲しかったのは三本目じゃなく、塗って外に出るきっかけだったようです。\n\nカフェでは新作の写真をきちんと見て、結局「いつもので」と頼みます。店員さんに感想を聞かれて「写真はすごくおいしそうでした」と答えたら、相手に「次はぜひ」と言われました。次こそ、は次の晴れの日まで持ち越しです。今日もいつものホットにしました。", "いつものカフェ席", "いつものカフェ席で、ドラマの感想と気になるリップの話を☺️ 「推しだけど同僚にはしたくない」みたいな話も大歓迎。洗い物が途中なら、話はカップが冷めるまで待ちます。", [["1K", "いつもの席へ", "名前を呼んで「○○さん、今日もお席あります」。"], ["5K", "カップにひと言", "あなたの気分に合う、お礼の言葉を注文シール風に。"], ["10K", "あなたのカフェおすすめ", "気分や好みに合わせた一杯を、理由つきでおすすめ。"], ["20K", "気分のおまかせドリンク", "あなた専用の一杯を命名。初めての注文でも「いつもので？」。"], ["30K", "名前入り限定カップ", "あなたが好きな色と名前を入れたカップカード画像。"], ["40K", "あなた宛て一分カフェ", "一杯の名前と、あなたの好きな話題を1分の店内トークに。"], ["48K", "○○さんの貸し切り席", "あなたを迎える2分のカフェ小話。名前入り限定メニュー画像付き。"]]],
  ["ちょぱ丸_", "予定　コンビニまで往復10分\n結果　寄り道込みで30分\n買いに行ったもの　忘れた\n\nちょぱ丸です。アニメの話は長め。推しを一人に絞ってと言われたら「今日の一人」で答えます。昨日の答えと違っても大丈夫。昨日観た回と今日観た回が違うから、しばらく隅に座ってただけの人が急に推しになることもあります。\n\n道に迷わないよう、角を曲がったときに見えたものを一つ覚えます。「赤いのれんの隣に猫」まで覚えた日、次に来たら猫がいませんでした。のれんを見ればいいのに猫を先に探してしまって、店の前を一度通過。生き物を目印にするなら、向こうにも予定があると思ったほうがよさそうです。\n\nお店を聞かれて、自信満々に「この先です」と教えたこともあります。そのあと自分も同じ方向へ歩いたのに見当たらず、引き返す途中でさっきの人と再会。地図を開いたら二人とも同じ店に行くところでした。ようやく一緒に着いて、店員さんに「お連れさまですね」と言われたので、訂正するより先に席につきました。\n\n名場面より、一瞬だけの仕草を誰かが覚えてると気になります。「そこ見てた？」からもう一回観たら、寝る時間まで30分ぶん遠回り。その手の寄り道には、今のところ反省がありません。", "寄り道アニメ部", "推しを一人に絞るなら「今日の一人」でOK。アニメの一瞬の仕草から、迷った先のお店までよく話がそれます。案内役が猫を探し始めたら、地図を開いてください。", [["1K", "寄り道で歓迎", "名前を呼んで「○○さんの席、今日は迷わず着きました」。"], ["5K", "あなたの道しるべ", "一行のお礼に「猫は不定休」の注釈を添えます。"], ["10K", "今日の推し便り", "あなたが好きな作品の、細かい好きポイントを一つ語ります。"], ["20K", "寄り道の次回予告", "あなたが主役の短い予告。「次回、○○さん、気づけば二階へ」。"], ["30K", "寄り道の名前入り番組表", "あなたの寄り道を本編にした、架空の番組表画像。"], ["40K", "あなたの一分外伝", "今日の話を聞き、あなたが主役の番外編を1分で語ります。"], ["48K", "○○さんの寄り道特番", "あなたを主役に2分のアニメ風物語。名前入り寄り道マップ画像付き。"]]],
  ["敬語でラスボス🎮", "ようこそお越しくださいました。ラスボスとお呼びいただければ幸いです🎮 終盤のゲームでは寄り道が増えます。装備と回復アイテムを揃え、最後の扉の前で一度休憩。お気に入りのボス戦の曲がありましたら、戦い始めと追い詰めたあと、どちらがお好きかまでお聞かせください。\n\n負けたときは原因を一つだけ書き留め、次はそこだけ対策するようにしております。装備も立つ位置も全部変えてしまうと、勝っても、何が効いたのか分かりませんので。ただ、敗因の欄に「落下」が続いた日、同行者の助言は「まず足元を見てお歩きください」でした。手帳を出す前に、見ておくべきものがあったようです。\n\n一時間かけて決戦の装備を揃えたときも、入り口の崖で二回落ちました。三度目で足元を確認すると、すぐ脇に渡れる橋がございました。回復は十分、橋は未確認。ボス戦自体は二分で終わりましたので、準備に使った一時間のうち、もう少し散歩に回せばよかったと考えております。\n\n枠では、勝った話はもちろん、どこで転んだかも安心してお話しください。洗濯が終わった夜などは、当城の決戦を一度お休みしていただいて構いません。挑戦者にもご都合がございますので。", "決戦前の休憩室", "決戦前の休憩室へようこそ。攻略の失敗談も、ボス戦の好きな一音も歓迎いたします。最後の扉へ向かう前に、どうぞ回復アイテムと足元、特に横に橋がないかをご確認ください。", [["1K", "ご来城のお礼", "名前を呼んで「○○様、本日もご来城ありがとうございます」。"], ["5K", "通行許可証のひと言", "あなたの名前を入れ「本日の橋の利用を推奨いたします」と贈ります。"], ["10K", "あなたの二つ名", "今日できたことに合わせて、ラスボスが称号を一つ授けます。"], ["20K", "功績のお祝い", "「洗濯を終えた功績により、今夜の決戦は免除いたします」と丁重に祝います。"], ["30K", "名前入りクエスト達成証", "あなたの功績を記した、紋章つき賞状画像。"], ["40K", "あなたの一分決戦劇", "あなたが勝つ最終戦を、ラスボスが一人二役で1分上演。"], ["48K", "○○様の王国授与式", "あなたを主役に2分の式典。選んだ称号と名前入りの感謝状画像付き。"]]],
  ["simba_", "シンバです。景色がよければ車を止めるし、曲がよければ頭から聴き直します。出発より休憩が長い方です。動物園ではペンギンが水に入るまで見ていて、混んでたら少し横へずれてしゃがみます。水面と同じ高さにすると、飛び込むところと水の下を進むところが続けて見えるので。\n\nある日、水際のペンギンに知らない子が「行ける、行ける」と小声で声援を送ってました。飛び込んだ瞬間、隣のお父さんが誰より大きく拍手。振り向くと、大人が何人も立ち止まっていて、目が合ってちょっと笑いました。次の一羽が来たときは誰もすぐに帰らなかったので、みんな同じところを見たかったみたいです。\n\nドライブの休憩ではベンチの向きを確認します。海が見えるつもりで座ったら、正面に並んでいたのは駐車場の車でした。友だちが隣で「車が見守ってくれてる」と言ってから、その場所も少し好きになりました。景色の話は、何が見えたかだけじゃなく、誰とそこに座ったかまで聞くと面白い。\n\n配信は飲み物片手に聴きながら、動物園や旅の話が出たらコメントします。しゃがんだ人にしか見えなかったものや、予定にはなかった休憩の話を聞かせてくれたら嬉しいです。", "停車中の見晴らし席", "景色が気になったら、いったん停車。車で聴く曲も、動物園でしゃがんで初めて見えたものも話せる休憩席です。ペンギンが飛び込むところだけ、もう少し一緒に待ちましょう。", [["1K", "見晴らし席へ", "名前を呼んで「景色がいいので、○○さんの席で一旦停車」。"], ["5K", "車窓の一行便り", "好きな景色を思い浮かべ、あなた宛てに一行のお礼。"], ["10K", "あなたの寄り道案内", "気分に合う風景や動物の見どころを一つおすすめ。"], ["20K", "ペンギンの一声実況", "あなたの小さな挑戦を「行けるか、今度こそ水に入るか」と応援。"], ["30K", "名前入り風景カード", "好きな景色と表示名を添えた、休憩の記念画像。"], ["40K", "あなた宛て一分ドライブ", "好きな景色を二つつなぎ、1分の車窓トークを贈ります。"], ["48K", "○○さんの見晴らし便", "あなたの好みに合わせた2分の架空ドライブ。名前入り行程カード画像付き。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。邪魔にならない音量で配信をつけて、結局いちばん面白いところで手が止まります。ゲームも音と背景が好きで、町のBGMがよければ進行を忘れてうろうろします。同じ店の前を何度も通って、店の人がいたら覚えられるくらい。\n\n手を動かすだけの日と、文章を考える日では選ぶBGMが違います。好きすぎる曲を流すと「ここの村の先、どんな洞窟だっけ」と調べ始めるから、考え事をするときは外します。曲を我慢して仕事を終え、休憩時間に攻略動画を四本観た日は、まとめて誘惑された感じがしました。\n\n昔のセーブデータを開いたら、決戦前のはずが、最初の村に戻っていました。何をするつもりだったか思い出せなかったのに、村の曲が流れたら、学校から帰ってランドセルをそのまま置き、ゲームを始めた部屋のことはすぐ思い出せました。昔もそこで音楽を聴いてたのかもしれません。決戦に向かう用もないのに戻ってくるくらいには、居心地がよかったようです。\n\nすすめたいゲーム曲は、題名が出なければ場所を教えてください。「雪の町の出口」とか「三回迷った洞窟」とか。まだ見つかってなくても、その場所を思い浮かべる時間がちょっと好きです。", "夜更けのセーブ地点", "夜の作業をしながら、ゲームの音と風景を話す場所。曲の名前がうろ覚えなら、雪の町や夕方の港からどうぞ。一曲を探して手が止まったら、そこが今日のセーブ地点です。", [["1K", "今日のセーブ音", "名前を呼んで「○○さん、今日のログを保存しました」。"], ["5K", "一行のセーブ便り", "あなたが終えた作業を、一行のゲーム風お祝いに。"], ["10K", "作業のおとも一曲", "好みに合うゲームの曲を、聞きどころの場面と一緒におすすめ。"], ["20K", "今日のセーブ画面", "あなた宛てに「食器をしまった。宿屋に戻ります」などと読みます。"], ["30K", "名前入りセーブカード", "あなたの作業と好きな風景を、セーブ画面風の画像に。"], ["40K", "あなたの一分ゲーム散歩", "好きな風景をつなぎ、あなたが主役の小話を1分。"], ["48K", "○○さんの最終セーブ", "あなたを主人公に2分の夜の物語。名前入りセーブカード画像付き。"]]],
  ["まさむね_", "まさむねです。休日は城下町を歩いたり、道の駅で買い物をしたり。旅先では説明板を全部読みたいので、一緒にいる人をお待たせすることがあります。定食屋さんへは観光のついでに入ったはずが、次に同じ町へ行く理由がそこの昼ごはんになることもあります。\n\n歩き出す前に昔の地図を見ると、今の道が急に曲がるところが気になります。「この角は堀の跡かな」と得意げに言った日に、同行者から「地図と道の向き、逆だよ」。向きを直しても今の地図で迷いました。以来、昔の町を説明する前に、まず現代の自分がどこにいるか確かめます。\n\n城跡の坂で、通った方に「何か見つけましたか」と声をかけられました。昔は近所の子の遊び場で、その人もよくここを滑り降りたそうです。案内板にはお城のことが書いてありましたが、帰りにはその人が教えてくれた坂を何度も見ました。どうやって足を止めたんだろうと考えると、少し前のその町まで見えた気がします。\n\nそれで定食屋でも、つい「このメニューはいつから」と聞きます。「昨日から」と言われた日には、百年前の話を想像していたと伝えて店の人と笑いました。長く続いたものと、行った日に始まったものを、どちらも覚えて帰れると嬉しいです。", "城下町の寄り道帳", "城下町の曲がり角、説明板に載らない近所の話、定食屋で頼んだもの。旅先でつい足を止めた場所を聞かせてください。ここでは寄り道のほうが長くなっても大丈夫。", [["1K", "ご城下へようこそ", "名前を呼んで「○○殿、説明板の前へどうぞ」。"], ["5K", "今日の一行史跡札", "あなたの出来事を、短い史跡の記録風に書きます。"], ["10K", "あなたの旅の見どころ", "好みに合う寄り道の見つけ方を、一つお伝えします。"], ["20K", "現代史跡の案内", "あなたの日常を紹介。「○○氏、ここでコロッケを食す。つい先日です」。"], ["30K", "名前入り小さな説明板", "あなたの寄り道を、日付入りの案内板画像に。"], ["40K", "あなた宛て一分城下町案内", "好きな風景を二つつないで、1分の架空ツアーを贈ります。"], ["48K", "○○殿の城下町紀行", "あなたの好みに合わせた2分の架空町案内。名前入り地図画像付き。"]]],

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

function copyButton(label, name, target, {buttonText = label + 'をコピー', copyText} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しやメニューからコピーしてください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => field.remove(), {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, {buttonText:'コピー'}));
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリーを見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = '紹介文';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(name, perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  actions.append(
    copyButton('ファミリー名', name, nameValue),
    copyButton('紹介文', name, description, {copyText})
  );

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
</html>
