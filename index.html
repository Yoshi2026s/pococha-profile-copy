<title>ポコチャ プロフィール・ファミリー文例集</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px;text-wrap:balance}
h1 span {white-space:nowrap}
.note {font-size:14px;line-height:1.55;color:#ddd8ee;margin:0 0 12px}
.search {margin:16px 0}
.search label {display:block;font-weight:bold;margin-bottom:6px}
.search-controls {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.search input {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:9px;font:16px system-ui}
.search input::-webkit-search-cancel-button {display:none}
.search button {padding:0 12px}
.search button:disabled {opacity:.55;cursor:default}
#search-status {margin:8px 0 0}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.profile-question,.profile-answer {display:block}
.profile-question {min-block-size:100vh;min-block-size:100svh}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-identity {display:flex;align-items:center;gap:12px}
.family-name {min-width:0}
.family-image-button {display:block;flex:none;width:76px;padding:0;overflow:hidden;background:#373c53;color:#fff}
.family-image-button img {display:block;width:76px;height:76px;object-fit:cover}
.family-image-button span {display:block;padding:4px 0;font-size:12px}
.family .actions {grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-name-copy {background:#373c53;color:#fff}
.family-copy-field {display:block;width:100%;height:clamp(128px,35dvh,280px);margin:8px 0;padding:8px;font:16px system-ui}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
#icon-message:empty {display:none}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
dialog [hidden] {display:none}
.dialog-actions > :only-child,#icon-download[hidden] + button {grid-column:1/-1}
</style>
<h1><span>ポコチャ</span> <span>プロフィール・</span><wbr><span>ファミリー文例集</span></h1>
<p class="note">架空の100人の文例です。プロフィールは編集して、このブラウザーに保存できます。ファミリー紹介文とコア特典はまとめてコピーできます。</p>
<div class="search" role="search">
  <label for="entry-search">文例を探す</label>
  <div class="search-controls">
    <input id="entry-search" type="search" placeholder="名前・ファミリー名・話題" autocomplete="off">
    <button id="search-clear" type="button" disabled>クリア</button>
  </div>
  <p id="search-status" class="note" role="status"></p>
</div>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <p id="icon-message" class="note" role="status"></p>
  <img id="icon-preview" alt="" hidden>
  <p id="icon-help" class="note" hidden>iPhoneでは、画像を長押しすると写真に保存できる場合があります。</p>
  <div class="dialog-actions">
    <a id="icon-download" hidden>PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="manual-copy-dialog" aria-labelledby="manual-copy-title" aria-describedby="manual-copy-help">
  <h2 id="manual-copy-title">ファミリー説明を手動でコピー</h2>
  <p id="manual-copy-help" class="note">下の文章を長押しするか右クリックし、メニューから「コピー」を選んでください。</p>
  <textarea id="manual-copy-text" class="family-copy-field" aria-label="ファミリー説明とコア特典" readonly></textarea>
  <div class="dialog-actions">
    <button id="manual-copy-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["ハンマーひより","靴の修理を勉強中のひよりです。初めての接客で「ほつれは二センチまで直せます」を「二メートルまで」と言い間違えました。師匠がすぐに「靴は片方ずつお持ちください」。🥾\n\n測るときの小ワザ。定規の端が欠けていたら、1センチの目盛りから測れます。縫い目の端が3センチの位置なら、3から1を引いて2センチ。二メートルの仕事は、まだ受け付けていません。🔨","修理前のぴかぴか","靴の修理を勉強しているひよりの部屋です。長く履いた一足や、残しておきたい傷の話を聞かせてください。二センチのほつれを「二メートル」と言い間違えた話も、たまに出ます。","思い出の靴を一足教えてもらい、名前入りの修理札風イラストにします。"],
  ["白線の友子","運動会で白線を引く友子です。競技が始まる前、スタートの線を引いていると、子どもが一人やってきました。\n\n子「先生もここから走るの？」\n友子「先生はゴールで待ってるよ」\n子「じゃあ、先生は走らずに一着だね」\n\nその子は競技が始まるまで、ゴールにいる先生をずっと見ていました。私が何度も引き直した白線より、先生のほうが気になったみたいです。","端っこのスタート地点","運動会で走った人も、水を運んだり白線を引いたりした人もどうぞ。競技が始まる前の校庭で、何を見たかを話しましょう。ここの白線は踏んで大丈夫です。","運動会で担当した役を聞き、その仕事をたたえる短い表彰文をファミリーに載せます。"],
  ["うら声の祖母","架空の推し、湯のみ日和さんへ。🍵\n\nこの前、配信の途中で「お茶をいれてきてもいいよ」と言ってくれましたね。私がお茶を取って戻ると、画面の向こうでも日和さんが湯のみを持っていました。「私も今いれたところ」。おかげで、一緒に休んでいたような気になりました。\n\n次の麻雀（マージャン）の配信にもお邪魔します。私が「リーチ」と言うと声が裏返るので、画面の前で言うだけにしときます。🀄","麻雀牌が鳴る居間","お茶を飲みながら、麻雀や家族で集まった日の話をする居間です。役が分からなくても大丈夫。湯のみを置いて、気楽に聞いていってください。","配信でお名前を呼び、湯のみと麻雀牌を一つずつ置いてお迎えします。"],
  ["&ツインベル","実況です。いま机のベルを鳴らして試していたら、続けて玄関のチャイムが鳴りました。二つの音が合うなあ、と座ったまま聴いています。\n\nここで家族から「宅配だよ。早く出て」。実況を中断します。","左右で音が違う","自転車のベルや玄関のチャイムなど、暮らしの中で聞いた音を持ち寄ります。二つ続けて鳴ったら、どちらが先だったかも聞かせてください。","教えてもらった二つの音を、配信で続けて鳴らしてみます。"],
  ["teru^3","作文　お父さんのくしゃみ\n\n日よう日にラジオをテープにとりました。番組が終わっても、録音を止めるのをわすれました。そのあと、お父さんのくしゃみも入りました。\n\nきかせると、お父さんは「もう一回、ぼくの出番から」。お父さんは、ラジオに出たと思っているみたいです。📼\n\n読み方　teru（テル）","中古カセットのB面","カセットやラジオの思い出を話す部屋です。番組が終わったあと、録音にたまたま入った音も歓迎。うちの父のくしゃみは、本人いわくゲスト出演です。","思い出に残った物音を聞き、出演者を紹介するような短いお礼をファミリーに書きます。"],
  ["画鋲ひとつ","19:02　店長「掲示板の左上の告知、もう外した？」\n19:03　私「外しました」\n19:04　店長「でも白い四角が残ってるよ」\n19:05　私「そこだけ日に焼けてません。次は『日焼け跡』って貼ります？」📌\n読み方　画鋲（がびょう）","掲示板の左上","学校やお店の掲示板で、つい目に留まった一枚を話しましょう。紙を外したあとに残った白い四角も、ここでは話の種になります。","好きな色を聞き、名前入りの掲示板風カードを描きます。"],
  ["栗田の湯加減","今だから言えます。寒がっていた友達に温かいおしぼりを渡したことがあります。その前に、私も冷えていたので、新しいおしぼりを袋のまま膝にのせて温まりました。\n\n友達は受け取るなり「あと二枚あれば布団になるね」。本当は私も二枚ほしかったのですが、親切な顔をしたまま自分の分を取りに行きました。","蒸しタオル当番","おしぼりや湯たんぽなど、寒い日に手を温めてくれたものを話します。聞くだけの方も、お茶が入るまでここで温まっていってください。","手が温まった思い出を一つ聞いて、ファミリーに短いお礼を書きます。"],
  ["豆皿マンボ","一石二鳥。マンボを口ずさみながら豆皿を配れば、歌も配膳もできると思ったんです。四拍目で甥（おい）が皿を取り、「歌ってていいよ」。配膳は甥に取られました。","四拍目の配膳","好きなおかずを持ち寄り、豆皿にどんな順番で並べたいか話す台所です。四拍目まで待てずに取っても大丈夫。うちの甥がいつも先に取ります。","教えてもらった好きなおかずを使い、四拍の掛け声を作って配信で披露します。"],
  ["空箱のノドカ","こちら祖母の裁縫箱です。のど飴の空き箱からボタン、薬の空き箱から針山が出てきました。\n\n私「薬の箱に入れて分かる？」\n祖母「置き場所を覚えてるから、一回で出せるよ」\n\n言われてみれば、色ごとに仕切りを作っている私のほうが、いつもボタンを探しています。","薬箱のあやしい仕切り","お菓子の缶を裁縫箱にしたり、空き箱を仕切りにしたり。別の使い道を見つけた箱の話をする部屋です。元のラベルも覚えていたら教えてください。","今使っている空き箱を聞き、今の中身に合う新しいラベルの絵を描きます。"],
  ["FJORD:かな","湖へ行った日、水を渡る橋が気に入りました。帰宅して地図を広げ、友達に「この線が橋」と指で示しました。友達が地図を手で伸ばすと、線が消えました。指したのは地図の折り目でした。🗺️\n\n春の水　地図の折り目に　橋ひとつ\n\n私が実際に渡った橋は地図に載っていません。次に行く人に聞かれたら、今度は写真を見せます。\n\n読み方　FJORD（フィヨルド）","氷の下を見ない地図","地図を見ながら、海の青い境目や湖にかかる橋の話をします。場所の名前を忘れていても、見えた色や聞こえた音から始められます。","好きな水辺の風景を聞き、架空の地図にしてお渡しします。"],
  ["よもぎ急須。","作文　おばあちゃんとお茶\n\nおばあちゃんがお茶を飲んだあと、急須（きゅうす）の茶葉を庭に捨てます。三日見ていたけど、庭は一回も「おかわり」と言わずに三回もらいました。いいなと思いました。","茶殻を捨てるまで","お茶を飲んだあとの話をするお茶の間です。急須を片づける人も、冷めた二杯目が好きな人もどうぞ。祖母は庭まで茶葉を運んでいました。","好きな茶器の形を教えてもらい、名前入りの急須の絵を描きます。"],
  ["kaθe","ひとこと日記。浴室で英語の発音を録音した。あとで聞き直すと、いちばんはっきり入っていたのは廊下からの「麦茶あるよ」だった。\n読み方　kaθe（カテ）","湯船の縁の発音帳","外国語の発音や、声がよく響く場所の話をします。上手に言えた音も、家族の声のほうがはっきり録れた音も聞かせてください。","選んだ一音を使って短い早口言葉を作り、配信でゆっくり読んでみます。"],
  ["栞ではなく付箋","📖 本を読む人と、横から声をかける弟の二人芝居。\n\n弟「その付箋（ふせん）、好きな場面？」\n私「宅配が来て本を閉じたところ」📦\n弟「次の赤いやつは？」\n私「晩ごはんに呼ばれたところ」🍚\n\n兄弟の予定は分かるのに、小説の犯人はまだ分かりません。\n\n読み方　栞（しおり）","本棚の仮どめ係","本を読みかけで閉じた日の話をします。宅配や晩ごはんで呼ばれた方もどうぞ。作品名より、どこまで読んで何の用で立ったかを聞きたいです。","読書を中断したきっかけを聞き、名前入りの付箋風カードに書きます。"],
  ["ぽっかり筒井","有言実行のつもりで「すぐ帰る」と連絡しました。帰り道で駄菓子屋の電球がつくのを待ったので、家に着くのは遅くなりました。\n\n「夕飯、もう一回温めなくていいよ」と伝えたら、「今日は冷ややっこだよ」。急いで心配する必要はありませんでした。","晩ごはんまで徒歩七分","晩ごはんの前に、帰り道で見かけたものを一つ話しましょう。お店の電球がつくのを待って遠回りした話も歓迎です。食事が待っている日は先にどうぞ。","帰り道で見たい景色を聞き、街灯がつく頃の絵を一枚描きます。"],
  ["ゆめみ業務録","🗒️ 閉店クイズ\n\n閉店前、台には梨が1個、りんごが2個、みかんが3個ありました。片づけが終わると、果物が1個だけ台に残りました。\n\n片づけた記録を見ると、同じ種類の果物を3個片づけた欄はありません。台に残ったのはどの果物？\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\nみかんです。梨やりんごが残っていたなら、みかんは3個とも片づけたはずです。みかんが1個残れば、片づけたみかんは2個になります。","最後に点いている売り場","店を閉めたあと、最後まで光っていたものや、片づけるまで残っていた品を記録します。梨が一個残った日も、立派な日報です。","帰り際に目に留まったものを聞き、名前入りの日報風カードにします。"],
  ["朝青まわり","朝のなぞなぞ\n\n散歩中、トンネルの入口で「おはよう」と言ったら、少し遅れて同じ「おはよう」が聞こえました。「誰ですか」と聞いても、返ってくるのは「誰ですか」。周りには人も機械もありません。\n\n返事をしたのは何でしょう？\n\n読み方　朝青（あさあお）\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\nこだまです。声がトンネルの壁などに反射し、少し遅れて自分のところへ戻ってきました。","踏切より先に鳥が鳴く","朝起きて最初に聞いた音を一つ書く部屋です。鳥でも配達のバイクでも、台所のレンジでも歓迎。分からない音は、どんな音だったかだけで十分です。","教えてもらった朝の音を、配信で一度まねします。"],
  ["MISOJI_3℃","枝豆を　ひと粒食べて　茶を二杯\n\n家族に「お茶が飲みたかっただけでしょ」。そのとおりです。\n読み方　MISOJI（ミソジ）","冷凍庫前の短い報告","冷凍庫から何を出したか、夜に短く報告する場所です。枝豆一粒でも今週の報告になります。私の場合は、一緒にお茶が二杯減りました。","今週つい食べたものを聞き、在庫表風のお礼をファミリーに載せます。"],
  ["紺野キッズ席","作文　博物館で見えたもの\n\n大人は展示台の上の説明を読んでいました。子どもは台の下を見ていました。「ここにも絵があるよ」と言われて、大人もしゃがみました。\n\nそれを見た係の人が、休めるように椅子を置いてくれました。大人はお礼を言いましたが、椅子の脚で絵が隠れました。🪑\n\nその大人は私です。次は「台の下を見てます」と先に言います。","子ども料金の目線","博物館や街で、しゃがんだときに見つけたものを話します。展示台の下の絵や椅子の裏など、立ったままだと見逃しそうな話を聞かせてください。","膝の高さから見てみたい場所を聞き、その眺めを言葉で配信中に案内します。"],
  ["オゾン伯母","五月雨や　伯母の声する　土間の奥\n\n雨が降ると、伯母（おば）の家で「洗濯物を入れなさい」と呼ばれたのを思い出します。この前、懐かしいなと窓を眺めてから気づきました。いま干しているシャツも取り込まなきゃ。\n読み方　五月雨（さみだれ）","濡れた玄関マット","雨が降り出したときに思い出す場所や匂いを持ち寄ります。濡れた玄関マット、古い木の戸、取り込み忘れた洗濯物の話も聞きます。","雨の日の思い出を一つ聞き、その情景を短い俳句風のお礼にして載せます。"],
  ["への字ジャム","🍞 パン「ジャムで笑顔を描いてよ」\n私「できた。笑ってるほうから食べるね」🍊\nパン「じゃあ残りは？」\n私「苦い顔に見える」😐\n\nマーマレードをどこから食べるかで、朝のパンの表情が変わります。🧈","トーストの肖像","朝のパンに塗ったものや、どこからかじったかを話すテーブルです。ジャムが笑顔に見えたら、食べちゃう前に教えてください。","好きなジャムで作ったトーストの顔を、名前入りのイラストにします。"],
  ["赤ワインの栓ぬき代行","うちだけの作り話です。夕暮れに窓辺（まどべ）の空き瓶が光ると、床にワインの跡が戻ってくるそうです。🍷\n\n話のもとになったのは、私がワインを開けそこねて床にこぼした日。今は同じ辺りに瓶の影が落ちます。友達はその影を見るたび、まだこぼれていないのに布を取りに行きます。","空瓶の夕方","夕方の窓辺に置いた空き瓶を眺めながら、その日の話をします。瓶の色が好きな人も歓迎。栓を抜くのが苦手だった話は私からします。","好きなガラスの色を聞き、夕日が当たる空き瓶の絵を描きます。"],
  ["吠えないバン","わしは川まで散歩。犬は玄関まで出て、すぐ家に戻った。\n帰宅してわしが座ったら、犬が散歩のひもを持ってきた。\n\n犬の散歩は一回、わしの散歩は二回。歩くほうだけ残業です。","犬抜き散歩会","散歩から帰ってきたら、どこで立ち止まったかを一つ聞かせてください。犬が玄関から一歩も出なかった日も、自分だけ川まで歩いた日も報告できます。","歩いた道を聞き、犬が決めたことにした名前入りの散歩札を作ります。"],
  ["ほねまで鉛筆","消し跡に　座った跡を　描いている\n\n人が立ったあと、座布団にできたへこみが好きで描きます。展示した日に「座ってもいい？」と聞かれて、絵が本物みたいに見えたのかと思いました。\n\nその人が指していたのは、絵の隣の本物の椅子でした。","デッサンの消し跡","デッサンで残った消し跡や、人が立ったあとの座布団を眺める場所です。うまく描けた線より、消すか迷った線の話が好きです。","描いてほしい身近な物を一つ選んでもらい、短いデッサンを配信で描きます。"],
  ["レンチ半月","🌙 友達に電話で「あの月が見える屋根の下で待ってる」と伝えました。少し歩いて振り返っても白い丸が屋根にのっていたので、ぐるっと回って近づきました。\nよく見たら、屋根についている丸い街灯。\n\n友達は最初に決めた電柱の下で待っていました。あとで送られてきた地図には、電柱にだけ目印があり、月については一言もありませんでした。次は最初から地図を開きます。\n\n読み方　半月（はんげつ）","路地の万年カレンダー","夜道で月や街灯を見つけた話をします。屋根の白い丸を月と間違えた人もどうぞ。待ち合わせの目印なら、電柱でも十分です。","好きな夜道の目印を聞いて、名前入りの小さな散歩地図を描きます。"],
  ["月見課77","課長は自動ドアの前で「どうぞ」とおじぎをしました。ドアは『もう一歩前に来てほしいな』と思いましたが、声は出ません。もう一度おじぎしても開きません。\n\n掃除に来た人が、課長の横を通ると扉はすっと開きました。「課長、もう一歩前ですよ」。\n\nそれから課長は、開くまでおじぎするのをやめました。中へ入れたときだけ、ドアにお礼を言っています。","入らない自動ドア","自動ドアが開かなくて横に一歩ずれた話や、出入りを間違えた話を集めます。中まで入れたかどうかは、書ける人だけ書いてください。","困った入口の話を聞き、月見課からの案内状風のお礼をファミリーに投稿します。"],
  ["月額ネコ代","段ボール物件のなぞなぞ\n\nＡ・Ｂ・Ｃの箱のどれか一つに猫がいます。\n\nＡの札「猫はＡにいる」\nＢの札「猫はＡにいない」\nＣの札「猫はＢにいない」\n\n正しい札は一枚だけ。猫が選んだ箱はどれ？\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\nＢです。ＡとＢの札は、どちらか一枚が必ず正しいので、Ｃの札は間違いです。「猫はＢにいない」が間違いなら、猫はＢにいます。","ダンボールの空室案内","段ボールを見つけた猫が、どの箱を選んだか報告する場所です。大きい箱を用意したのに書類箱で寝た話も歓迎。寝てしまったら、管理人はその箱を成約扱いにします。","猫が選んだ箱を聞き、家賃が段ボール一枚の物件案内にしてお渡しします。"],
  ["Miss北極星","夜道の方向クイズ\n\n駅を出たところで東を向いています。まず左に向き直り、その向きのまま次の角まで歩きます。そこで右に曲がり、さらに次の角でも右へ曲がりました。\n\n最後はどちらを向いているでしょう？\n\n読み方　Miss（ミス）\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n南です。東から左を向くと北。そこから右に曲がるたび、東、南の順に向きが変わります。","星の数を暗記しない教室","夜道で迷わない目印を話す教室です。星に詳しくなくても、駅の外灯や明るいコンビニの場所なら一緒に考えられます。","覚えている目印を一つ教わり、その場所への空想の道案内を配信で読みます。"],
  ["ナカミー散髪前","美容師「前髪、どれくらい切ります？」\n私「今日は思い切ってください」\n美容師「じゃあ一センチ」\n私「……五ミリで」\n\n私の思い切りには、だいたい五ミリの上限があります。","鏡のうしろも見たい","髪を切るとき、どう頼めば伝わったかを話す散髪の待合室です。「耳が冷えないくらい」「前髪だけ五ミリ」など、長さの伝え方を聞かせてください。","こう切ってほしいという希望を聞き、美容師さんに伝える短い一文を一緒に考えます。"],
  ["Oyogu_M31","🏊 私が作ったプールのうわさ。ロッカーM31を開けると、何本泳いだか出てくるそうです。\n\n本当は画面などありません。先週、泳いだ本数を忘れて「今日は何本？」と書いた紙を自分で入れました。\n\n次に開けたときも答えは出ず、昨日の自分に同じ質問をされました。今日は泳ぐたびに数えます。受付で違う番号を渡されても、もう迷わなくて済みます。\n\n読み方　Oyogu_M31（オヨグ・エムさんいち）","プールの反対側","水泳のあと、プールで気づいたことを話す休憩室です。速さも距離も問いません。本数を忘れた人は、帰りの自販機で何を飲んだかでもどうぞ。","好きな水の色を聞き、名前入りのロッカー札風イラストを描きます。"],
  ["夢中パンタグラフ","家族には「外で洗濯物を干すついでに電車を見ている」と言っています。\n\n本当は電車が来る時刻に合わせてベランダへ出たくて、洗濯物を後回しにしています。この前も、架線（かせん）の下を電車が通った瞬間に「来た！」と言ったら、家族に「靴下はまだ？」と聞かれました。\n見たかった車両が去ってから、ようやく一枚目を干しました。","架線の見えるベランダ","電車の屋根や、その上に通る電線を眺めるベランダです。部品の名前を知らなくても、「ここが上がった」と気づいた話から始められます。","好きな時間帯を聞き、そこを走る電車と架線の絵を描きます。"],
  ["産直リズ","火曜の日記。🫛 祖父の名前を大きく書いた札を、豆の袋につけた。豆が売れたので札も片づけたら、「まだ次の豆にも使う」と言われた。📦 名前だけ先に名物になりそう。","畑の外の名札箱","産直の野菜を買ったら、箱の端についた手書きの札まで読んでみます。どんな野菜を手に取ったか、字の大きさが気になった話も聞かせてください。","好きな野菜を教えてもらい、名前入りの荷札風カードを作ります。"],
  ["ビス子。締め直し中","🪛 こちら机の下です。ガタつく脚に、新聞を折って差し込みました。机はぴたりと止まりました。\n\n一点だけ問題です。読んでいた記事の続きは折った内側。机をまた揺らすか、続きを諦めるか、現場は判断を迫られています。","机がガタつく夜","机がガタつくとき、脚の下に何を挟んで直したかを話します。新聞を挟んだまま続きが読めなくなった人には、私の机も見せられます。","机や椅子のガタつきを直した工夫を聞き、手書きの作業メモ風に紹介します。"],
  ["じぶんの字幕係","📺 時差のなぞなぞ\n\n配信を、映像が流れた時刻より4分遅れで見ていました。ある場面で笑い、その2分後に「今の好き」とコメント。コメントを送った時刻は20時03分です。\n\n笑った場面が配信で流れたのは何時でしょう？\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n19時57分です。笑ったのはコメントの2分前、20時01分。場面が配信で流れたのは、そこからさらに4分前です。","二拍あとから来る言葉","配信の話題が変わったあとに、さっきの面白さが分かることがあります。遅れて笑ったときも「五分前の話だけど」と書き込める部屋です。","印象に残った一言を聞き、字幕風のカードにしてお礼を添えます。"],
  ["麻のオクト","🐙 タコが机を片づけて、何もなくなった記念に写真を撮ろうとしました。ところがスマホが見つかりません。\n\n机の下で通知が鳴り、ようやく気づきました。最初に手に取ったスマホを、一本目の腕がずっと机の下で持っていました。📱\n\n私は腕が二本しかないけれど、片手にスマホを持ったまま「スマホ知らない？」と家族に聞いたことがあります。","八本ぶんの段取り","机の上を五分だけ一緒に片づけます。始めるときに何をするか、終わったら何が済んだかを一言ずつ。片づけた物を探し始めても参加できます。","片づけた物を一つ聞き、タコが八本腕で拍手する名前入りカードを描きます。"],
  ["春雷のかけら","春雷や　冷蔵庫から　返事あり 🌩️\n\n外の雷がやんで、やっと静かになったと思ったとき、台所で「ドサッ」。自動製氷（せいひょう）の氷がケースに落ちた音でした。\n家族と顔を見合わせて「うちの雷は冷蔵庫にもいるね」。外より先に台所を確かめました。\n\n読み方　春雷（しゅんらい）","屋上で空が低い日","雨がやんだあと、屋根の向こうの雲やクレーンを見て回る場所です。外に出なかった日は、窓を閉めたあとに家の中で聞いた音を教えてください。","雨上がりに見たい風景を聞き、その空の下にある屋上を絵にします。"],
  ["つま先総務","19時のニュースです。行方不明だった右のスリッパが、捜索係の左足から見つかりました。\n\nさらに、左のスリッパも捜索係の右足から見つかりました。\n\n捜索係本人は「家の中をよく探した」と話しています。足元だけは、最後まで見ていなかったそうです。","なくしたスリッパ係","家の中でなくした物と、見つかった場所を報告する係です。スリッパが見当たらなかった方は、書き込む前に足元も一度見てください。","探し物が見つかった場所を聞き、名前入りの発見報告書にします。"],
  ["ちぎり天パパ","息子よ、昨日の天ぷらの衣を食べたのはパパです。「揚げ具合を確かめた」は一枚目まで本当。\n\n二枚目は、一枚目がおいしかったから食べました。\n\n今日は味見の前に、息子の分を皿へ。私の分には「衣なし」と書かれていました。","衣が先に帰る","揚げたてや買ったばかりの食べ物を、家族に出す前に味見した話を聞きます。天ぷらの衣だけ食べたことがある人も、遠慮なくどうぞ。","好きな天ぷらを一つ聞き、名前入りの手書きメニュー風イラストを作ります。"],
  ["島瀬、蓄音機休業中","「蓄音機（ちくおんき）、もう直った？」\n「まだ。でも叔父が何度でも同じ所を歌ってくれる。リピートだけ先に直った」\n読み方　島瀬（しませ）","針を落とさない音楽室","古い蓄音機や、しばらく鳴らしていない楽器の話をする音楽室です。機械が動かないときは、そこにいた人が口ずさんだ歌を覚えていたら聞かせてください。","覚えている雰囲気を聞き、短い鼻歌を作って配信で披露します。"],
  ["無限エスカ","水曜の日記。🎙️ エスカレーターが止まった。私は先頭にいたので「誰が最初に歩くかな」と実況。🚶 真っ先に階段をのぼってきたのは、作業に来た清掃員さんだった。競争にしていたのは私だけ。","右側に立たない観察記","エスカレーターや商店街の回転台など、街で動くものを実況します。止まってしまった場面もお題になります。乗った人でも外で見た人でもどうぞ。","お題の機械を一つ選んでもらい、動き出すまでの短い実況をします。"],
  ["うたたねメンテ班","ぬいぐるみのトラの左目が取れたので、家にあったボタンで直しました。黒くて立派なボタンだったので、前より左目だけよく光ります。\n\n仕上げを見に来た祖母が、カーディガンを押さえながら「前のボタンが一つないの」。トラは黒い左目をそらしました。\n\n次の修理は、祖母のカーディガンから取りかかります。","ぬいぐるみの縫い目外来","古くなったぬいぐるみを直したり、ほつれや目のボタンの話をしたりする部屋です。直す前に、どんなふうに遊んだかも聞かせてください。","大事にしているぬいぐるみを聞き、名前入りの修理票風イラストを作ります。"],
  ["眠いドットちゃん","兄「丸と四角しか描けないの？」\n私「おにぎりも描けるよ」\n兄「じゃあ描いて」\n\n○　食べたあとのおなかです。","手書き丸の採点表","丸と四角だけを使って絵しりとりをします。四角を食パンにしたり、丸をおなかにしたり。描くだけでも、みんなの絵を見て答えを考えるだけでもどうぞ。","好きな言葉を一つ聞き、丸と四角だけで名前入りの絵にします。"],
  ["12号の鳴砂","切手帳の「十二号」は、私が最初に買ったアルバムの番号です。古い切手は、光に透かすと端の毛羽立ち（けばだち）まで見える。そこが好きだと友達に言っていました。\n\n本当は、表紙を閉じたときの「ぱたん」という音で選びました。切手を買い足さなくても、一日に何度でも楽しめます。\n\n読み方　鳴砂（なきすな）","封を切らない切手帳","古い切手や封筒を並べ、どの組み合わせが好きかを話します。宛先は実在しない場所で大丈夫。その手紙が届きそうな景色を一緒に考えます。","架空の宛先を一つ聞き、その場所を描いた名前入りの切手風カードを作ります。"],
  ["春のエンジン","机の引き出しの奥に、車を直す小さな工具、ソケットがありました。その隣にはネジ。\n\n「ぼくは一度、車の中に入ったことがあるよ」とネジが自慢すると、工具は「ぼくは駐車が得意だよ」。\n\n翌朝、私が引き出しを勢いよく開けました。ネジは床へ転がり、工具は奥に挟まったまま動きません。\nそんな会話があったら、確かに駐車がうまい方はこっちです。まず床のネジから回収します。","ソケットの引き出し","昔の車で覚えている音や、よく使った道具の話を持ち寄ります。車種を忘れていても、窓を閉める手回しのハンドルの重さだけで話が始まります。","思い出の車の部品を一つ聞き、当時の使い方や思い出を配信で紹介します。"],
  ["〇円ドリーマー","三角形の三つの角を寄せると一直線、180度。空想のおにぎり店の入り口は三角です。図面は完成、値段だけ未定。","割引前の妄想部","棚一つぶんの小さな空想のお店を考えます。三角のおにぎりが一つだけでも開店できます。値段より先に、何を売る店かを教えてください。","提案してもらった空想の商品を一つ、店内アナウンス風に配信で紹介します。"],
  ["SWAN♂","🩰「バレエは上達した？」\n「先生に、左足が二本あるみたいだと言われた」\n「それでどうするの？」\n「来週は左足用の靴を二足買うよ」🕰️\n読み方　SWAN（スワン）","左足から始める夜","バレエの練習を始めたばかりの人も、見守る人もどうぞ。できた一歩と、緊張して間違えた一歩の話を聞きます。見た練習の感想を一言残すだけでも参加できます。","練習でできるようになった動きを聞き、名前入りの小さな練習記録を作ります。"],
  ["ぴた。○秒","⏱️「今日は十分で終わります」\n（十分後）\n🎤「では本題に入ります」\n\n常連さんから「時間どおりに前置きが終わりましたね」。次回は、あいさつの前にタイマーを押します。","ぴったりで止め隊","「あとちょっとで終わる」が長く続いた話を持ち寄ります。気づけばすごく早く終わった話も歓迎。私は十分配信の十分目に本題を始めたことがあります。","お題を一つ聞き、前置きも含めて一分で話すミニトークをします。"],
  ["ギザ歯もちょ","架空の広告　欠け跡を調べます\n\nかじりかけのビスケット、角が欠けた消しゴム。何がかじったか、紙ねんどで歯型を作ってみます。\n\n見本はワニの歯型。姉に見せたら「お母さんの奥歯みたい」。ワニと分かるようにしっぽを足したら「しっぽのあるお母さんだ」。\n\n鑑定のご依頼は、証拠を食べきる前にどうぞ。","歯型標本室","角が欠けた消しゴムや食べかけのビスケットを見て、何がかじったか空想する標本室です。犯人が自分でも歓迎。証拠は食べきる前に見せてください。","教えてもらった欠け跡から、空想の犯人を描いた名前入りの標本カードを作ります。"],
  ["三度寝ルーペ","架空のツアー案内。寝坊した朝でも行ける「近足」。\n\n行き先は公園の足元一平方メートル。落ち葉の裏をめくり、ベンチの脚を見るコースです。虫眼鏡を持っていると楽しめます。\n集合場所と解散場所は同じ。歩きすぎた方は、それ以上進まず一歩だけお戻りください。","公園の一平方メートル","公園の足元一平方メートルで、小石や落ち葉を観察します。遠くへ行けない日も、虫眼鏡がなくても大丈夫。しゃがんで見つけた物を一つ教えてください。","観察した小物を聞き、見つけた時の様子を名前入りの観察カードに描きます。"],
  ["南南東のピン子","🎲 公平な六面サイコロで「1〜3が負け」なら、負ける確率は半分。うちのゲームでは負けたらお茶が出ます。「1〜5が負け」に変えたら、勝負より先に急須（きゅうす）が空になりました。\n読み方　南南東（なんなんとう）","一人ルール図鑑","一人で遊べるボードゲームの、ちょっと変わったルールを持ち寄ります。負けた人にお茶を出すルールでは、私と私の両方が負けたがりました。","考えたルールを一つ聞き、どう遊ぶかを配信で実演します。"],
  ["海底0.5m","浅瀬クイズ\n\n袋には、同じサイズのサンダルが右足用2つ、左足用2つ入っています。袋の中は見えません。左右を選ばずに1つずつ取り出し、袋には戻しません。\n\n右と左が必ず1つずつそろうには、最低でいくつ取り出せばいいでしょう？\n\n読み方　0.5m（れいてんごメートル）\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n3つです。2つだと両方が右用、または両方が左用の場合があります。片側は2つしかないので、3つ取れば反対側も必ず入ります。","浅瀬の足あと部","波打ち際で足元だけ観察します。引いた波のあとにできた穴、砂に残った足あとなどを話してください。深くまで行かずに見つけたものが好きです。","好きな浜辺の色を聞き、名前入りの足あとイラストを作ります。"],
  ["mumuko.","夜に布を縫い、表より裏の色が気に入ったので、ポーチを裏返して使った。翌朝は、寝ぼけて上着まで裏返しで出かけた。「こういうデザインです」と言ったら、友達が裏から飛び出した値札をそっと押し込んだ。\n読み方　mumuko.（ムムコ）","余り布の夜食部","夜にミシンを使ったり、余り布で小物を作ったりする部屋です。仕上げた物はもちろん、裏返したほうがかわいかった試作品も見せてください。夜食の話でも参加できます。","好きな布の色と柄を聞き、名前入りのポーチの絵を描きます。"],
  ["BUNNY軍曹","軍曹は　ふとんで点呼　パンは夜\n\n二度寝して、トースターに朝のパンを置いたまま出かけました。夜に発見。焼き上がる時間を守ったのはパンだけでした。\n読み方　BUNNY（バニー）","早起きは二度鳴る","朝いちばんに何をしたかを報告する軍曹の部屋です。二度寝した人は二度目から書けば大丈夫。トースターに朝のパンを忘れた日も受け付けています。","朝の出来事を一つ聞き、軍曹が短い点呼の記録にしてファミリーに載せます。"],
  ["ゴムの木🐸","🐸 二つの音を録って比べるときは、マイクをそれぞれ同じくらい離すと、大きさの違いに惑わされにくくなります。\n\n私はカエルそっくりのドアの音を録ろうとして「元気？」と声をかけたら、向こう側の家族の「ふつう」だけが録れました。","三本脚の記録係","公園の池で見たカエルや、雨の日に聞いた音を記録します。カエルのような声を聞いたら、どこで聞いたかも教えてください。家のドアが犯人でも歓迎です。","気になった物音を聞き、その正体を想像した絵を観察カードにします。"],
  ["わさび少佐Δ","架空の商品案内。少佐（しょうさ）の牛乳待機セット 🌶️\n\nわさびを少しだけ出すつもりが、皿に山を作ってしまった方へ。中身は牛乳一本と、平気な顔の見本です。\n\n「誰が最初に味見する？」と聞くと、私だけ先に皿を渡されます。少佐だからだそうです。\n\n平気な顔をしていても、牛乳を取ってほしいときはあります。無言になったら、見本より牛乳をお渡しください。","一口目だけ辛口","わさびやからしで、一口目にどんな顔になったかを話す食卓です。辛いものが苦手な人も、牛乳に助けられた人もどうぞ。少佐の席には、今日も牛乳を置いています。","好きな薬味を一つ教えてもらい、少佐が配信でその薬味を使った食べ方を紹介します。"],
  ["宮原のブザー","部活帰りに友達と「体育館の二階に、小声で応援しても選手に届く席がある」って作り話を考えました。\n\n試しにその席から、コートにいる先輩に小さく「がんばれ」と言いました。先輩は振り向かず、すぐ隣の友達にまで「何か言った？」。\n反対に、自宅で大きな声を出したときは壁の向こうの家族から「マイクなしで聞こえるよ」と返事が来ました。二階の席に行ったら、今日もふつうに拍手で応援します。","体育館二階席","バスケの試合で、点が入る直前のパスや控え席の動きを見ていた人が集まる二階席です。中継で見逃しそうなプレーでも、一つずつ話せます。","覚えているプレーを聞き、ベンチ側から見た短い実況にして披露します。"],
  ["西口のロバ","西口のパン屋クイズ\n\n駅の西口から、パン屋へ向かいます。店には表と裏の入り口があります。\n表へは徒歩4分。前に3組いて、1組につき2分かかります。\n裏へは徒歩7分。レジでは1分だけ待ちます。\n\n自分の会計にかかる時間が同じなら、どちらが何分早いでしょう？\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n裏から入るほうが2分早いです。歩く時間とレジ待ちを足すと、表は4＋6で10分、裏は7＋1で8分です。","最後に出る出口","駅前の近道や、お店の裏にある入り口を話す集まりです。道を思い出せなければ、目に入ったパン屋や看板から聞かせてください。","好きな目印を聞き、駅からそこへ向かう架空の散歩地図を作ります。"],
  ["ゆびさきスケボ","七転八起。指で跳ねさせて遊ぶ小さなボードを、棚の裏に七回落としました。八回目に立ち上がったのも私です。今度は懐中電灯を持って。","擦り傷のうら側","指で小さなスケートボードを跳ねさせて遊びます。机の角や文具をどう使ったか、上手く跳べた話も棚の裏まで飛ばした話も歓迎です。","机にある物を一つ聞き、それを使った小さなコースの見取り図を描きます。"],
  ["アラキ040","06:40　友達「電車、窓側に座れた？」\n06:41　私「座ったから、ひと眠りした」\n06:42　友達「窓の外に何が見える？」\n06:43　私「さっき飲み物を買った自販機」\n06:43　友達「それ、ホームのベンチだね」\n\n🚌 窓側を確保した気になって、電車より先に眠ってしまうアラキです。","窓ぎわの修学旅行","電車やバスの窓から見えた屋根、川、看板の色を持ち寄ります。着いた町の名前は覚えていなくても大丈夫。乗る前に寝てしまった日の話も聞きます。","好きな窓の外の風景を聞き、名前入りの切符風カードに描きます。"],
  ["湯柱ゴジ（琥次）","風呂上がり、眼鏡が曇って、誰かが立っていると思って「お先です」。返事がなくて近づくとロッカーでした。\n\n眼鏡を拭いて、ロッカーの前であいさつを聞いた人はいないか見回しました。家族が向こうから「今度は私に言ってね」。全部聞かれていました。\n\n今日も牛乳を買って帰ります。人に会ったら、相手の顔が見えてからあいさつします。\n\n読み方　琥次（ゴジ）","サウナ後の牛乳会議","お風呂から上がったら何を飲むかを話します。瓶のコーヒー牛乳派も、ぶどう派も一票。眼鏡を拭いてからゆっくり選んでください。","選んだ風呂上がりの飲み物で乾杯し、配信でお名前を呼びます。"],
  ["巳ノ宵","06:56　私「電車の床が全部畳の夢を見た」\n06:57　友達「どこで降りた？」\n06:57　私「放送で『次は居間です』」\n06:58　友達「電車でも靴は脱ぐの？」\n06:58　私「それ聞く前に起きた」\n\n夢日記の七枚目に、畳のうす緑だけ残しておきます。\n\n読み方　巳ノ宵（みのよい）","七枚目の夢日記","夢から覚めた朝に、色や景色を一つだけ残す日記です。電車に畳が敷いてあったような変な夢も歓迎。夢を覚えていない日は白紙で参加できます。","覚えていた色を一色聞き、その色が出てくる架空の夢日記を一ページ書きます。"],
  ["けん爺の工具箱","孫「工具箱の説明書、読んだ？」\n私「『使ったら戻して』ってやつ？」\n孫「うん。六角レンチ、箱の下だったよ」\n私「じゃあ『箱の下を探して』に書き直して」\n孫「使ったら戻したら？」\n読み方　爺（じい）","ねじ一本ぶんの相談所","古い工具を見せながら、使い方や直した物の思い出を話します。何の工具か忘れた物もどうぞ。工具そのものを探している時間も、配信のうちです。","長く使った道具を一つ聞き、名前入りの道具図鑑カードを描きます。"],
  ["水無瀬、再計算中","たい焼きを十一個。家計簿で「たい焼き代」を「食費」から分けたら、食費が下がりました。🐟🧾 買った数は十一個のままです。\n読み方　水無瀬（みなせ）","空欄の家計簿","家計簿を見て、自分が思った以上によく買っていた物を報告します。金額は伏せて大丈夫。うちは、たい焼きだけで一欄増えました。","つい買ってしまう物を一つ聞き、名前入りの家計簿の欄にしてお礼を載せます。"],
  ["檸檬九号室","一分芝居で、久しぶりに会った魔王と勇者を演じた。二人の再会場所はコンビニ。別々のレジに並んだまま、どちらからも話しかけなかった。\n\n終了間際、私が手元の輪ゴムを床へ落とした。マイクが拾ったのは、一分間でその音だけ。\n\n翌週の感想欄には「輪ゴムが一番よく聞こえた」。次の芝居にも出てもらうことにした。\n\n読み方　檸檬（れもん）","一分だけの寸劇部","場所と登場人物を決めて、配信で一分だけ寸劇をします。たとえばコンビニに勇者と魔王。時間内に話が終わらなかったら、続きはコメントでどうぞ。","舞台にする場所と二人の役を提案してもらい、そのお題で一分の寸劇を演じます。"],
  ["藤の庭86","架空の推しライバー、苗床ひなたさんへ。\n\n朝の配信で、毎日同じ鉢を映してましたね。「今日も咲いてません」と言ったあと、視聴者が「私も今日は起きただけです」と書いて、思わず笑いました。\n\nそれから私も朝顔を育てています。古いハンガーを支柱に使ったら、家族に「洗濯物、入れといて」と言われて間違えて鉢を持っていきました。入れるのは横の靴下だったそうです。\n\n次の配信でも、花が咲いていなければ「おはよう」だけ書きます。しばらくは、咲くまでの話を一緒に聞いていたいです。","朝顔の緑のうら","鉢植えの朝顔を見ながら、花が咲いた日も、葉っぱしか見えない日も報告します。水やりの失敗や、つるが思わぬものに巻きついた話も歓迎です。","好きな花の色を聞き、名前入りの鉢札風の絵にします。"],
  ["HIGE3","洗車場でのジョーク。\n\n整備士「さっきから、左のブラシを応援してましたね」\n私「はい。調子はどうですか？」\n整備士「ブラシはもう止まってます。いま窓を走ってるのは泡です」\n\n次からは泡も応援します。一番長く走ってたので。\n\n読み方　HIGE3（ひげさん）","洗車待ち通信","洗車機でブラシが回り、泡が流れるところを実況します。好きなブラシを応援しても、窓に残った水玉の話をしても大丈夫です。","右か左のブラシを選んでもらい、次の洗車実況でそのブラシをひいきして紹介します。"],
  ["川原サンダル","川の土手　先ゆくバッタ　また会った 🦗\n\n散歩の行きと帰りに同じ場所で一匹ずつ。私が一周する間、向こうはずっとあそこで跳ねていたみたいです。🩴\n読み方　川原（かわら）","バッタの向こう岸","川の土手を散歩して、通り過ぎた虫や人を一つ報告します。帰りに同じ場所でまたバッタに会ったら、先に戻っていたのはどちらかも聞かせてください。","川辺で見つけたものを聞き、その場面を描いた名前入りの散歩しおりを作ります。"],
  ["ユカ、山にいます","霧の中、山の頂上で借りた手袋だけが鮮やかな紫だった。帰って、白い紙に紫の手袋を描いた。\n\n家族に「手袋の広告？」と聞かれたので、横におにぎりを描き足した。🍙「今日のお昼？」。\n\n頂上の絵だと伝わるように、次は山の名前が書かれた看板も覚えて帰ろうと思う。","尾根の休憩マット","山歩きのあとに、足を止めて見た景色や食べたおにぎりの話をします。頂上に着かなかった日も、霧で何も見えなかった日も、その日に覚えている一つがあれば十分です。","その日印象に残った景色や色を聞き、登山絵日記の一ページにします。"],
  ["rara×乱調","🎶 半音を　外した場所で　仲直り\n\n妹と一緒に歌うと、同じ場所で半音ずれます。私は妹が私に合わせてくれたと思い、妹は逆だと思っていました。\n\n家族に聴かせると「どっちも外れてるよ」。そう言われても、二人で揃うと気持ちよくて、次も同じ高さで歌います。🎤\n\n読み方　rara（ララ）／乱調（らんちょう）","音外し歓迎の合唱団","鼻歌を歌って、音が合ったところや外れたところを笑って話す合唱団です。歌わずに聞くだけでもどうぞ。二人で同じ音に外れたら、私たちはハーモニーと呼んでいます。","短い言葉を一つもらい、二つの高さで歌ってどちらが好きか一緒に聞きます。"],
  ["六花トレモロ","🎹 テンポが1分に60拍なら、1拍は1秒。曲が終わってからその一秒を待つと、最後の音の伸びが聴きやすくなります。\n\n先生に「最後の音、ずいぶん長いね」と言われた日は、私がペダルを踏んだままでした。あわてて足を上げたら、ちゃんと曲が終わりました。\n\n読み方　六花（りっか）","踏まなかったペダル","ピアノの曲が終わって、最後の音が消えるまで耳を澄ませる部屋です。音楽に詳しくなくても、「ここで一息つきたくなった」という感想から始められます。","好きな雰囲気を一つ聞き、余韻を残す短いピアノのフレーズを弾きます。"],
  ["雨衣 / AMAI","8月の日記。🎆 昼に「ドン」と鳴った。花火だと思い、大きな煙まで描いた。\n夕飯のとき「花火、聞こえた？」と聞いたら、家族が「さっき米袋を床に置いた音かな」。\n今夜は、米袋の絵を隣に描いて残しておく。\n読み方　雨衣（あまい）／AMAI（アマイ）","花火のあとの火の番","花火が終わって最後に残った色や、音だけ聞いたときに想像した景色を持ち寄ります。雨の日は窓辺のしずくの話でも参加できます。","覚えている音を一つ聞き、その音を花火に見立てて絵にします。"],
  ["遠い電波 / みぞれ","📻 架空のラジオ「ゆきの夜」\n\n雪の日に遠い放送を探す、想像のラジオです。つまみをゆっくり回してください。\n\n「そろそろ寝なさい」がはっきり聞こえたら、つまみを止めて廊下を見てください。たぶん、家族の声です。\n\nその声に返事をするのに、アンテナはいりません。","ノイズの縫い目","ラジオのつまみを回したとき、途切れ途切れに聞こえた音を話します。聞き取れたのが一語だけでも歓迎。廊下からの家族の声なら先に返事してきてください。","聞き取れた一語に、ファミリーに受信記録風のお礼を一行書きます。"],
  ["押忍マカロン","架空広告　真っ赤なマカロン 🥊\n\n食紅を倍入れたので、見た目が強そうです。実際に強いのは袋を留めたテープ。\n負けずに食べたい方は、はさみをご用意ください。\n読み方　押忍（おす）","焼き割れ上等部","焼き上がったマカロンの色や、割れたところを見せ合います。うまく焼けなかった日は、味見してから報告でも大丈夫。袋が開きにくいときは無理せずはさみを。","好きなマカロンの色を聞き、名前入りの箱ラベル風カードを描きます。"],
  ["飴玉アフロ堂","梅雨の朝　髪がひと足　先に出る ☔\n\n湿気で髪がふくらんだら、今日は傘を持って出ます。","ふくらんだ髪の天気予報","髪がふくらんだり洗濯物が乾きにくかったり、空を見なくても雨に気づいた話をします。うちの予報の単位は帽子一つぶんです。","聞かせてもらった雨の合図を、短い天気予報として配信で読みます。"],
  ["moyuP","🎧 録音室のジョーク。\n\n客「この音、何で出したんですか？」\n私「猫が空き箱に飛び込んだ音です」🐈📦\n客「もう一度、同じ音を録れますか？」\n私「箱は用意できます。猫には聞いてください」🐾\n\n🎙️ しゃべるより音を録るのが好きです。猫の出演がない日は、私がスプーンを鳴らします。🥄\n\n読み方　moyuP（モユピー）","触った音メモ","空き箱やスプーンの音を録り、何を鳴らしたか隠して当てっこします。猫が箱に飛び込んだ偶然の音も、録れていたら出題します。","選んでもらった小物を鳴らして、短いジングルを作ります。"],
  ["空耳セマ","食事のあと「空を上げます」と聞こえて、窓を開けた。\n振り向くと、店員さんが皿を下げていた。","読唇に負ける夜","聞き間違えた言葉と、本当は何と言っていたかを持ち寄ります。「皿を下げます」が「空を上げます」に聞こえるような話が好きです。","教えてもらった空耳を、本来の言葉と聞き間違えた言葉の二通りで読みます。"],
  ["RX-おひる王","机の上で、風が右から来たり左から来たりしました。私は「誰かが送風機の向きを変えてる」と、家族に聞いて回りました。\n\n説明書を見たら「首振りモード」。朝にそのボタンを押したのは私でした。\n読み方　RX（アールエックス）","正午の机上基地","卓上扇風機や古い目覚まし時計を並べて、机の上に空想の基地を作ります。使わなくなった道具があれば、隊員として何を担当できそうか考えてみましょう。","家にある小さな道具を一つ聞き、その道具を隊員に任命するカードを描きます。"],
  ["砂場ナンバー404","作文　かたほうの手ぶくろ\n\n公園に手ぶくろが一つ落ちていました。赤くて、ベンチの横にありました。ひろわずに絵だけかきました。\n\n次の日、同じ所に左と右がならんでいました。ぼくの絵の博物館では、そろった手ぶくろはもう展示しません。よかったです。","片方だけ博物館","片方だけ落ちていた手袋やイヤホンを、拾わずに絵で記録する博物館です。左右が揃っていたら、展示を終えた品として報告できます。","見つけた片方を聞き、名前入りの展示札にしてお礼を書きます。"],
  ["きりん郵便局長","以心伝心、のつもりで「玄関にカラス」と書きました。字が下手で「玄関にガラス」と読まれ、次の配信では窓の話になりました。🦒","首の長い回覧板","枠で出た言葉を一つ、次の枠へ回覧板で運びます。覚えているところだけ書いてください。カラスをガラスと読み違えた局長が、今回は確認してから届けます。","運んでほしい短い言葉を一つ選んでもらい、局長が配信で名前と一緒に読み上げます。"],
  ["NEON深夜便","自業自得。夜勤明けに梅おにぎりを食べたら、酸っぱくて眠気が吹き飛びました。二個目は冷蔵庫に入れました。\n\n次の朝、ほかのおにぎりと間違えて、また梅をひと口。眠気は飛んだけれど、冷蔵庫に入れたのも、取り出したのも私です。\n\n読み方　NEON（ネオン）","午前2時の落とし物係","夜勤明けや眠れない夜に、日が昇る前の小さな話を置いていく場所です。忘れた曲名、言いそびれたお礼、梅おにぎりで目が覚めた話もどうぞ。","今日ふと思い出したことを聞き、名前入りの拾得票風のお礼を書きます。"],
  ["8月の半券","🎟️ 映画の半券（はんけん）を手帳に挟むと、開いたときにその映画の一場面を思い出す。私が考えた、映画館の都市伝説です。\n\n📒 試したつもりで開くと、挟んでいたのは売店のレシート。🍿 思い出したのは、塩味のポップコーンでした。\n\n🚪 題名を忘れても、上映前に何を食べたかはよく覚えています。","幕が上がる前の列","映画館で上映が始まる前、列や売店であったことを話します。題名や結末を言わずに参加できます。半券より先にポップコーンの味を思い出した方もどうぞ。","好きな映画館の席を聞き、名前と席番号を入れた架空の映画券の半券を描きます。"],
  ["sono","架空のポコチャライバー、深窓ねむさんへ。\n\n水族館の配信で、エイの顔を見ながら「だれかに似ていますか」と聞いてくれましたね。私が「父です」と書いたら、みんなが笑って、ねむさんが「今度、お父さんにも見せたいね」と言いました。\n\n家でエイを描いて父に見せたら「よく描けてるね、タコ」。似顔絵を渡す前に、魚の種類から説明することになりました。\n\n次は父を連れて水族館に行きます。エイとタコの両方を見て、どっちが似ているか本人にも聞きます。配信でその答えを話せたらうれしいです。\n\n読み方　sono（ソノ）","影の底で潜る","水族館で長く見ていた生き物の話をします。名前が分からなくても、泳ぐ向きや顔に見えたところを教えてください。人に似ていた話も歓迎です。","好きな生き物を一つ聞き、水槽の中から見上げた絵を描きます。"],
  ["ゆらり本気。","今だから言えます。近所の階段を描くのが趣味で、三階の窓を何度も描きました。「よく観察してるね」と言われますが、私は五階に住んでいます。\n\n三階をよく知っているのは、エレベーターで何度も間違えて降りたからです。ある日は同乗した人とすぐ会うのが恥ずかしくて、残りを階段で上りました。四階の廊下で、ちょうどエレベーターを降りたその人に「またですね」。\n\n🚪 今度から堂々と、扉が閉まる前に乗り直します。","エレベーターの三階","階段の踊り場で見た景色や、エレベーターを違う階で降りた話を持ち寄ります。階数が分からなくても、窓や手すりの色を覚えていたら教えてください。","覚えている階段の風景を聞き、踊り場の窓からの眺めを絵にします。"],
  ["木曜レプタイル","🦎 架空の推し、殻待ちミナさんへ。\n\n👀 トカゲをずっと映す配信で「見えない日は、見えないって言っていい」と言ってくれましたね。\n📝 私は昨日、抜け殻を本物だと思って実況していました。\n🦗 本物は画面の外で、虫を追いかけていました。次は見つけてから報告します。","脱皮のカレンダー","トカゲの仕草や、飼育箱の中で見えたものを記録します。じっとしていて見えにくい日も、抜け殻しか映らなかった日も観察の一日です。","好きな爬虫類を一種類聞き、その特徴が分かる名前入りの観察カードを描きます。"],
  ["むぎちゃ法師","🫖 私「やかんが鳴る前に音が分かる」\n👂 廊下へ出て、ふたが動く音をじっと待つ。\n🗣️ 祖母「聞こえてるなら止めておいで」\n🧊 祖母の声で台所に戻り、麦茶は間に合いました。\n\n我が家の合図は、やかんより祖母の方が早いです。\n\n読み方　法師（ほうし）","やかんが鳴る前","やかんのふたや氷の音など、台所で聞こえた音を持ち寄ります。鳴ってから気づいた方も、家族の声のほうが先だった方も、麦茶を飲みながらどうぞ。","選んでもらった台所の音を一つ、配信で鳴らしてみます。"],
  ["矢吹ハトメ","「古い靴の底には、前に住んだ町の小石が一つ残る」。僕が考えた、靴箱の都市伝説です。\n\n底から取った小石を机に置き、前の町の名前を書いた札を付けました。車で送ってくれた友達に見せたら、「それ、昨日の駐車場で拾った石だよ」。\n\nその駐車場は歩いて三分。札だけ貼り替えました。","靴底の歩数計","靴底を見ながら、よく歩く道や足音を話します。歩数より、石畳の固さや、小石が挟まっていた日のことを聞きたいです。","好きな道の手触りを教えてもらい、名前入りの足あと地図を作ります。"],
  ["黒崎ピンズ倶楽部","21:10　家族「床に金具が落ちてるよ」\n21:11　私「それは襟（えり）につけるピンの留め金」\n21:11　家族「窓の下にも一個あったよ」\n21:12　私「それは何の部品か分からない」\n21:13　家族「一緒の箱に入れるの？」\n21:13　私「うん。箱に『何の部品か分かりません』って貼る」\n21:14　家族「ピンの留め金まで？」\n\n読み方　倶楽部（くらぶ）","裏返した襟の話","襟につけるピンや、その裏の留め金を見せ合います。服を裏返して初めて気づいたことや、小さな飾りを拾ったときの話でも参加できます。","気に入った形を聞き、その形のピンを名前入りの展示台紙に描きます。"],
  ["樋口式仮眠","仮眠研究会のクイズ\n\n昼休みは13時まで。目が覚めてから席に戻るまで4分かかります。私は最初のアラームでは起きず、その5分後に鳴る2回目で必ず起きます。\n\n13時ちょうどまでに戻るには、最初のアラームを何時何分までに鳴らせばいいでしょう？\n\n読み方　樋口（ひぐち）\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n12時51分です。2回目は12時56分。そこから4分で13時に席へ戻れます。最初を1分遅らせると間に合いません。","座って寝る研究会","昼休みに椅子で少し眠る人が、どんな場所や姿勢だったかを話す研究会です。よく眠れた日も、昼休みが終わるまで起きられなかった日も報告できます。","仮眠から起きたときに最初に気づいたことを聞き、研究記録風のお礼を載せます。"],
  ["Q5","こちら読書の実況です。読者は意味が分からない一行を覚えたまま、コンビニまで歩きます。一往復では答えが出ず、同じ道をもう一度。\n\n二回目のコンビニ前で、「そういう意味か」と止まりました。鉛筆を取り出して、気に入ったところに線を引こうとしています。\n\n現場からお知らせです。本は、自宅の机に開いたままです。\n\n読み方　Q5（キューファイブ）","つまずいた行の読書会","本の題名を伏せたまま、読む手が止まった一行の話をします。どういう意味か考えたとき、どこを歩いたか、何をしていたかを教えてください。","読書の途中で思い出した景色を聞き、その景色を描いた名前入りのしおりを作ります。"],
  ["臼井メロ","🥛 喫茶店で水のグラス越しにメニューを見たら、ケーキの値段にゼロが一つ増えて見えました。グラスをどけて、安心して注文しました。\n読み方　臼井（うすい）","喫茶店の水だけ","喫茶店で注文が来るまでの、ちょっとした出来事を話します。水のグラスやおしぼり、窓の影が気になったら、メニューを決める前に教えてください。","窓側か奥の席かを選んでもらい、名前入りの架空の喫茶伝票を作ります。"],
  ["蚤の六郎","弟「コップの値札、取れたよ」🏷️\n私「記念に、その値札を額に入れるね」🖼️\n弟「じゃあ今度は、額に値札を貼っておく」\n私「うちは蚤（のみ）の市じゃないよ」","値札の裏側","蚤の市で、買った品や手に取って戻した品の話をします。値段より、傷や値札の跡にどうして目が留まったかを聞きたいです。","気に入った一品を聞き、品の来歴を想像した名前入りの展示札を作ります。"],
  ["めくる砂糖","小学生風の作文　さとうの音\n\nカフェでのこったさとうのふくろに、「雨のまど」と書きました。家でふくろをあけると、ざらっといい音がして、さとうがぜんぶゆかに落ちました。\n\n家の人に「ゆかまで作品になってるよ」と言われました。ぼくはちりとりで作品をあつめました。","紙袋の句会","紙袋に書けるくらいの短い言葉を持ち寄る句会です。一句になっていなくても「傘の先」など一言から参加できます。砂糖をこぼした音も、お題にできます。","もらった一語から、その場で短い一句を作って読みます。"],
  ["さば味噌は月曜","🍱 弁当箱のなぞなぞ\n\n机に「月」「火」「水」「木」「金」の札を一枚ずつ用意します。仕事に弁当を持っていく朝、その曜日の札を一枚だけ、弁当箱に貼ります。\n\n今週は月曜だけが休みで、火曜から金曜まで毎日持っていきました。金曜の夜、机に最後まで残っているのはどの札？\n\n解答はプロフィールのいちばん下です。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n【解答】\n「月」の札です。休みで弁当を持っていかなかった月曜の分だけ、使いませんでした。さば味噌を火曜に入れたとしても、貼るのは「火」の札です。","働く日の弁当箱","仕事に持っていった弁当や、帰りに空になった容器の話をします。月曜のさば味噌が祝日で火曜になったら、そのずれも立派な報告です。","好きなおかずを一つ聞き、名前入りのお弁当のお品書きを作ります。"],
  ["柏木の赤丸","配信を始めると、初めて見る人が来た。司会者は「いってらっしゃい」と言ってから、「ようこそ」と言い直した。\n\n五分後、その人が「そろそろ帰ります」と書いた。なぜか今度は「あ、おかえりなさい」。その人は一度退出し、すぐ戻ってきた。\n\n「おかえりなさい」と司会者が言うと、「今のは合ってます」と返ってきた。言い直さなくてよかったのは、その一回だけだった。","言い直し放送室","言い間違えた一言や、言い直して伝わった一言を持ち寄る放送室です。来た人に「いってらっしゃい」と言った私が、最後に訂正欄を読みます。","言い直したい一言を聞き、訂正放送風に配信で読みます。"],
  ["せりな 19:03","喫茶店でのジョーク。\n\n客「このレシート、19時03分です。19時閉店じゃなかったですか？」\n店員「すみません。レジの時計が三分進んでいます」\n客「じゃあ、閉店に間に合ったんですね？」\n店員「ええ。遅刻したのはレシートだけです」\n\n初任給でケーキを買った日の時刻なので、気に入ってそのまま名前にしました。","レシートの時刻表","覚えておきたい時刻と、そのとき何をしていたかを書きます。私は初任給のケーキで19時03分。時計が三分早かったと分かったあとも、この時刻が好きです。","覚えておきたい時刻を聞き、名前入りのレシート風カードを作ります。"],
  ["ライム姐","鍋上げて　ほめられるかと　棚へ置く\n\n片手で鍋を持ち上げたら、家族は「そのまま棚に戻して」。筋トレより先に片づけが終わりました。\n読み方　姐（ねえ）","重い鍋の筋トレ日誌","家事や運動で昨日より楽にできたことを一つ報告します。鍋を運べた話も、家族と二人で持ったら楽だった話も歓迎。棚に戻すまでが一回です。","今日できたことを一つ聞き、その場面をほめる短い一文をファミリーに載せます。"],
  ["トトトの8bit","発明家は、ゲームでジャンプするときの音を作りました。村のみんなに聞かせると、全員が台所へ走りました。🎮 「電子レンジが終わったと思った」そうです。\n\n次にゲームが終わる音を作りました。今度は村の人が、お皿を持って台所へ。📣 「何が温まったの？」\n\nゲームの音としてはまだ採用されていませんが、村では夕飯を知らせる係に任命されました。\n\n読み方　8bit（はちビット）","あと一機あります","短い電子音を作り、どんなゲームの場面に合うかを当てっこします。電子レンジが終わったように聞こえたら、何を温めていそうか教えてください。","指定してもらった場面に合う、二音だけの効果音を作ります。"],
  ["塩麹は欠席","客「この料理、塩麹（しおこうじ）が入ってませんね」\n料理長「冷蔵庫を探したんですが、いなくて」\n客「さっき、いちばん手前にありましたよ」\n料理長「失礼しました。欠席したのは私の注意力です」🥣","余った汁の使い道","昨日の料理で余ったものを、明日はどう食べるか考える台所です。煮汁だけでも参加できます。欠席だと思った調味料が翌朝見つかった話もどうぞ。","余った食材を一つ聞き、それを使った翌日の一皿を配信で考えます。"],
  ["Cider_相沢","架空の推しライバー、風鈴ソーダさんへ。\n\n配信で瓶を開ける音が大きすぎて、「こんばんは」が聞こえなかった日を覚えています。風鈴さんが「じゃあ今のは瓶の挨拶」と言い直したら、コメント欄に「瓶さんこんばんは」が次々に流れて笑いました。\n\n私も家でやってみました。今度は音に負けないように、ふたを開ける前に「乾杯」。家族はお茶を飲み始めて、私がようやく瓶を開けたときには飲み終わっていました。\n\n次の配信では、私も先にふたを開けておきます。もしまた音で挨拶が聞こえなかったら、「瓶さんこんばんは」と書きますね。\n\n読み方　Cider（サイダー）","ボトルの底は夏","炭酸で乾杯しながら、夏に聞いた音を一つ持ち寄ります。花火の音も、帰り道の足音も歓迎。挨拶が瓶の音に消えたら、飲んでからもう一度。","思い出の夏の音を一つ聞き、名前入りの瓶ラベル風イラストにします。"],

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');
const iconMessage = document.getElementById('icon-message');
const iconHelp = document.getElementById('icon-help');
const failedImages = new Set();
let imageRequest = 0;

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

async function openImage(title, url, filename) {
  const request = ++imageRequest;
  iconTitle.textContent = title;
  iconPreview.alt = title;
  iconPreview.hidden = iconDownload.hidden = iconHelp.hidden = true;
  iconMessage.textContent = '画像を読み込んでいます…';
  const separator = url.includes('?') ? '&' : '?';
  const source = failedImages.has(url) ? url + separator + 'retry=' + request : url;
  iconPreview.src = source;
  iconDialog.showModal();
  try {
    await iconPreview.decode();
  } catch {
    if (request !== imageRequest) return;
    failedImages.add(url);
    if (iconDialog.open) {
      iconMessage.textContent = '画像を読み込めませんでした。閉じてから、もう一度お試しください。';
    }
    return;
  }
  if (request !== imageRequest || !iconDialog.open) return;
  failedImages.delete(url);
  iconDownload.href = source;
  iconDownload.download = filename;
  iconMessage.textContent = '';
  iconPreview.hidden = iconDownload.hidden = iconHelp.hidden = false;
}

function entryImage(directory, number, extension) {
  return './' + directory + '/' + number + '.' + extension + '?v=2';
}

function imageButton(title, thumbnail, url, filename) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', title + 'を開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = thumbnail;
  button.append(image);
  button.addEventListener('click', () => openImage(title, url, filename));
  return button;
}

const list = document.getElementById('names');
const searchInput = document.getElementById('entry-search');
const searchClear = document.getElementById('search-clear');
const searchStatus = document.getElementById('search-status');
const manualCopyDialog = document.getElementById('manual-copy-dialog');
const manualCopyText = document.getElementById('manual-copy-text');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const entryNumber = index => icons[index].split('-', 1)[0];
const editKey = index => 'pococha-profile-copy:profile:v1:' + entryNumber(index);

function searchKey(value) {
  return value.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,
    character => String.fromCharCode(character.charCodeAt(0) - 0x60));
}

function filterEntries() {
  const query = searchKey(searchInput.value).trim();
  const terms = query ? query.split(/\s+/) : [];
  let matches = 0;
  for (const row of list.children) {
    row.hidden = !terms.every(term => row.dataset.search.includes(term));
    if (!row.hidden) matches++;
  }
  searchStatus.textContent = matches ? matches + '件の文例' : '一致する文例がありません。別の言葉でお試しください。';
  searchClear.disabled = !searchInput.value;
}

searchInput.addEventListener('input', event => {
  if (!event.isComposing) filterEntries();
});
searchInput.addEventListener('compositionend', filterEntries);
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  filterEntries();
});
document.getElementById('manual-copy-close').addEventListener('click', () => manualCopyDialog.close());
manualCopyDialog.addEventListener('close', () => {
  if (!manualCopyDialog.open) manualCopyText.value = '';
});

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブでこのプロフィールが更新されました。入力内容をコピーしてページを再読み込みしたあと、もう一度編集してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。このサイトのデータ保存が許可されているか、ブラウザーの設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  filterEntries();
  const searchCleared = updated.hidden;
  if (searchCleared) {
    searchInput.value = '';
    filterEntries();
  }
  updated.querySelector('.edit-button').focus({preventScroll:!searchCleared});
  updated.querySelector('.copy-status').textContent = searchCleared
    ? '変更を保存しました。編集した文例を表示するため、検索を解除しました。'
    : '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {copyText, successMessage = label + 'をコピーしました'} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('.family, li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      field.remove();
      button.focus({preventScroll:true});
      const manualHint = label + 'を選択しました。長押しや右クリックでメニューを開き、「コピー」を選んでください。';
      if (!copied && copyText !== undefined) {
        manualCopyText.value = value;
        manualCopyDialog.showModal();
        manualCopyText.focus();
        manualCopyText.setSelectionRange(0, value.length, 'backward');
        manualCopyText.scrollTop = 0;
        return;
      }
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = successMessage;
  });
  return button;
}

function buildFamilyDetails(name, familyName, familyDescription, corePerk, number) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリー説明・コア特典を見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value family-identity';
  const nameText = document.createElement('span');
  nameText.className = 'family-name';
  nameText.tabIndex = -1;
  nameText.textContent = familyName;
  const preview = imageButton(familyName + 'のファミリー画像', entryImage('family-images', number, 'webp'),
    entryImage('family-images', number, 'png'), number + '-' + familyName + '.png');
  preview.className = 'family-image-button';
  const previewLabel = document.createElement('span');
  previewLabel.textContent = '画像を開く';
  preview.append(previewLabel);
  nameValue.append(preview, nameText);

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = 'ファミリー説明';
  const description = document.createElement('dd');
  description.className = 'family-value family-intro';
  description.textContent = familyDescription;

  const perkLabel = document.createElement('dt');
  perkLabel.textContent = 'コア特典';
  const perk = document.createElement('dd');
  perk.className = 'family-value core-perk';
  perk.textContent = corePerk;

  const copyText = [familyDescription, '', '【コア特典】', corePerk].join('\n');
  const nameCopy = copyButton('ファミリー名', name, nameText);
  nameCopy.className = 'family-name-copy';
  actions.append(copyButton('ファミリー説明', name, description, {
    copyText,
    successMessage: '紹介文とコア特典をコピーしました。ポコチャのファミリー説明欄に貼り付けてください。'
  }), nameCopy);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');

  fields.append(nameLabel, nameValue, descriptionLabel, description, perkLabel, perk);
  details.append(summary, actions, feedback, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, corePerk] = entries[index];
  const number = entryNumber(index);
  const answerStart = profile.indexOf('\n【解答】\n');
  const question = answerStart < 0 ? profile : profile.slice(0, answerStart + 1);
  const row = document.createElement('li');
  row.dataset.search = searchKey([number, name, entries[index][0], question.trimEnd(), familyName, familyDescription,
    corePerk].join('\n'));
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(number + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  if (answerStart < 0) {
    body.textContent = profile;
  } else {
    const questionBlock = document.createElement('span');
    questionBlock.className = 'profile-question';
    questionBlock.textContent = question;
    const answerBlock = document.createElement('span');
    answerBlock.className = 'profile-answer';
    answerBlock.textContent = profile.slice(answerStart + 1);
    body.append(questionBlock, answerBlock);
  }
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  const profileIcon = imageButton(name + 'のアイコン', entryImage('thumbnails', number, 'webp'),
    entryImage('icons', number, 'png'), icons[index]);
  profileIcon.className = 'icon-button';
  header.append(profileIcon, title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, corePerk, number), edit);
  return row;
}

function shuffle(items) {
  for (let end = items.length - 1; end > 0; end--) {
    const pick = Math.floor(Math.random() * (end + 1));
    [items[end], items[pick]] = [items[pick], items[end]];
  }
  return items;
}

function reshuffleList() {
  const focused = document.activeElement;
  list.append(...shuffle([...list.children]));
  if (list.contains(focused)) focused.focus({preventScroll: true});
}

const initialOrder = shuffle(entries.map((_, index) => index));
list.append(...initialOrder.map(buildRow));
filterEntries();

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (standalone) {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reshuffleList();
  });
} else {
  window.addEventListener('pageshow', event => {
    if (event.persisted) reshuffleList();
  });
}
