<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "るいです。帰りの電車では、イヤホンは片耳だけ。もう片方で車内放送を聞きつつ、歌枠や雑談を聴いてます。平成のJ-POPが流れると「昔めっちゃ聴いた」と書きたくなるけど、曲名を思い出す頃にはだいたい二曲先です。\n\n最近は、枠で教わった曲を翌朝に聴いて、好きな音が入る秒数をメモするのがマイブーム。人から「二番のサビ前」と教えてもらうと、その人の耳をちょっと借りた気がします。歌詞が息つく間もなく続く、テンポの速い曲は少し苦手。声やギターの余韻が聞こえる曲を選びがちです。\n\n前に終電で、向かいの人が窓に映る自分を見ながら小さくエアギターをしてました。何の曲か考えてるうちに降りる駅に着き、結局その晩いちばん耳に残ったのは、降りてからホームで聞いた発車メロディーでした。おすすめは一曲で十分。好きなところの秒数まで教えてくれたら、明日の通勤で待ち構えます。", "片耳プレイリスト", "帰りの電車に似合う曲を一曲ずつ。思い出せたのが「二番のあとでギターが入る」だけでも話は始められます。平成J-POPも新しい曲も、聴きどころを一つ添えてどうぞ。", [["1K", "おかえり放送", "名前を呼んで、車掌風に「今日もおつかれさま」。"], ["5K", "片耳メッセージ", "今日の気分に合う、名前入りのひと言を贈ります。"], ["10K", "帰り道の一曲", "あなたに似合う一曲と、聴いてほしい場所をお伝えします。"], ["20K", "臨時の車内放送", "「次は、よく頑張った○○さん前」と、今日の話を車内放送に。"], ["30K", "片耳きっぷ", "あなたの名前とおすすめ曲を、記念きっぷ画像に。"], ["40K", "帰り道ラジオ", "今の気分に似合う二曲とお礼を、1分のDJ風に。"], ["48K", "○○さん行きの終電", "あなた宛ての2分の車内放送と、名前入り終電きっぷ画像。"]]],
  ["初見じょうれん。", "「初見です！」「昨日もいたよね？」までが挨拶。じょーれんです、どうもまた来ました。夕飯で抜けて戻ったのに、話が一つも進んでないと妙に安心します。音楽は、みんなでサビを口ずさめる昔のJ-POPが好き。夕飯にパクチーがのってたら、そっと皿の端へ。あの香りには今も慣れません。\n\nここで「会長」と呼ばれるのはじゃんけんに勝った人。任期は次に負けるまでです。初めて来た人には誰が誰だか分かりにくいので、僕が得意げに説明します。\n\n一度「初見さん、こんばんは！」と迎えたら、「昨日あんたと一時間しゃべったよ」と。前の日の第一声も、僕の「初見さん、こんばんは！」だったそうです。次は向こうから「はじめまして」と言ってくれたので、もう毎晩、お互いに初見でいいかなと思ってます(´▽｀) 話の途中で来た人は「今なんの話？」からどうぞ。", "また来た初見席", "初見です、昨日ぶりです、どっちも同じ温度でどうぞ。途中で来た人には「会長がどうして会長なのか」からお伝えします。ちなみに選考方法はじゃんけんです。", [["1K", "昨日ぶりの初見", "名前を呼んで「初見さん、昨日もありがとう！」。"], ["5K", "また来てくれて賞", "あなたが来てくれた日の思い出を一行で贈ります。"], ["10K", "自称初見の名札", "「初見・認定○回目」を添えて名前を紹介します。"], ["20K", "初見なのに表彰", "覚えているあなたの一言を「初対面の名言」として発表。"], ["30K", "初来店（自称）証明書", "名前と「昨日も来店」の認定カード画像。"], ["40K", "あなたを覚えてる理由", "好きなところや思い出を、1分の常連紹介に。"], ["48K", "○○さん歓迎総会", "あなたとの思い出を振り返る2分の総会と、会長名札画像。"]]],
  ["あずき＊", "あずきです🍡 粒あんのおまんじゅうが好き。夜は薄い毛布をかけて、ゆっくりした歌を小さな音で聴いています。和菓子屋さんなら何軒も回れるのに、タイムを気にして走る長距離ランニングは苦手。急がずに和菓子屋さんの札を眺めてる方が、私には性に合います。\n\n祖母から紙袋をもらったとき、おまんじゅうが二つ入っていました。一つは祖母の分だと思って差し出すと、「明日のあんたの分よ」と。家でよく見たら、片方の包みにだけ小さく「明日」。翌日は急須まで出して、昨日の私、よく残したなと思いながらゆっくり食べました。\n\n今でも、箱を買うときは二日に分けるつもりです。初日に二度開けてしまうこともあって、二回目はあくまで「味見の続き」。おすすめを教えてくれるなら、今日の濃いお茶に合うか、明日までとっておきたくなるかも聞きたいです。", "粒あんと夜のお茶", "お茶をいれる間に、今日のおやつと夜に聴きたい歌の話を。和菓子のおすすめは、夕方の濃いお茶に合うか、明日のために取っておきたい味かまで聞かせてね🍡", [["1K", "湯のみ一つ", "名前を呼んで「今日のお茶、あなたの分もあります」。"], ["5K", "明日の包み紙", "「明日のあなたへ」の名前入りひと言便り。"], ["10K", "あずきのおやつ便", "お好みに合う和菓子と、お茶の組み合わせを一つ贈ります。"], ["20K", "架空の和菓子命名", "あなたのための一粒を命名。「二度目の味見」も候補。"], ["30K", "粒あんのお品書き", "名前と架空の銘菓を入れた和菓子カード画像。"], ["40K", "お茶の間お礼便", "あなたと話したことを思い出しながら、1分の茶席お礼。"], ["48K", "明日の分もある限定箱", "あなたを思わせる二品を2分で紹介。名前入りの箱絵画像付き。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 洗い物をしながら聴くので、返事が止まったらだいたい泡を流しています。趣味はほうじ茶の飲み比べ。最近よく見かける、飲む前にお茶を何杯も並べて撮るのは苦手です。撮る前に、気になる一杯をつい飲んでしまいます。\n\n前に友人と、いつものほうじ茶と、少し奮発して買ったほうじ茶を飲み比べることにしました。「こっちは香りが上品だね」と二人で真剣に話したあと、友人がもう一つの急須を掲げて一言。「こちらが本日の新商品です」。僕が二つのカップに、いつものほうじ茶をいれてました。\n\nそれから味を当てるのはほどほどにして、その香りで何を思い出したか聞く方が好きになりました。僕は祖母の台所、友人は「いま開けたポテチ」。次の飲み比べは、二つの急須をちゃんと使うところからです( ˘ω˘ )", "ほうじ茶の間", "お湯が沸いたらこんばんは🍵 ご当地のお菓子や、少し冷めてから分かるお茶の香りをゆっくり話す場所です。聴いてるだけの方にも湯のみは出してあります。", [["1K", "沸いたよコール", "名前を呼んで「湯のみ置いときました」と歓迎。"], ["5K", "湯気のひと言", "今のあなたに合う、お茶うけみたいなひと言。"], ["10K", "あなたのお茶合わせ", "好きなおやつに合うお茶を一つ、おすすめ理由つきで贈ります。"], ["20K", "急須の食レポ", "あなた向けの組み合わせを紹介。難しいときは「実家の台所の味です」。"], ["30K", "茶席の名札", "あなたの名前とおすすめのお茶を入れた茶席札画像。"], ["40K", "湯のみ一杯のお礼", "聞いてくれた時間への感謝を、1分のお茶トークで。"], ["48K", "○○さんの貸し切り茶席", "好みをもとに2分のお茶会トーク。名前入り茶席札画像付き。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこでようやく立ち上がる、ぼるとです⚡ 普段のコメントは省エネやけど、勝負どころだけ手が動きます。読むなら野球選手の自伝が好き。逆転打だけじゃなく、その前の打席で何を考えてたか、あとから知れるのが面白いんよ。\n\nジョギングは一定のペースで走るのが苦手ですぐ歩くくせに、野球では選手が出塁を懸けて粘る打席なら、何球でも見ていられます。ベンチの端で誰が先に立つかまで気になるから、リプレーもつい前の打席から見直します。\n\nある試合で、僕が見ていた配信は、隣の部屋のテレビ中継より遅れてました。家族が叫んだので「結果言うな！」と返したら「足つっただけ！」。数秒後にこっちで逆転して僕が叫ぶと、「それ、もう見た」。試合後に「で、どこつったん？」と聞いたら、足の指。その日最後に答え合わせしたんは、試合やなくて足の指でした。", "九回裏の応援席", "逆転打の話は大歓迎。その前に粘って塁に出た選手や、ベンチの端で先に立った人の話も聞きたい応援席です。途中から来ても、今のカウントからどうぞ⚡", [["1K", "応援席へ入場", "名前を呼んで「○○選手、入場です！」と拍手。"], ["5K", "本日の好プレー", "あなたの頑張りに一行の応援コメントを贈ります。"], ["10K", "応援ボードのひと言", "名前を入れたあなただけの応援フレーズを枠で紹介。"], ["20K", "代打アナウンス", "「代打、洗い物を終えた○○さん！」と頑張りを実況。"], ["30K", "名前入り選手カード", "あなたの得意技を載せた、架空の選手カード画像。"], ["40K", "九回裏のお祝い実況", "今日できたことを1分の逆転実況に。地味な好プレーも拾います。"], ["48K", "○○選手のヒーロー特番", "あなたを主役に2分の試合実況と名前入りスコアカード画像。"]]],
  ["たっぷりん🍮", "ぷりんと呼んでください🍮 プリンは固め、カラメルは苦めが好き。歌枠で昭和の歌謡曲が流れると、洗濯物をたたむ手が止まります。タオルの山が減らない日は、だいたいいい夜です。\n\nスプーンを入れた跡が残るか、最後にカラメルがどれくらい残るかまで気になるのに、工程が何ページも続くお菓子のレシピ本は苦手です。新作の棚の前なら平気で迷うので、たぶん買う方が向いてます。最後の一口にカラメルを残すつもりが、毎回三口目あたりから予定が狂います。\n\nある晩、ごほうびのプリンを冷蔵庫に隠して、隠した場所まで忘れました。翌朝、家族が野菜室からプリンを出して「ここ、高級デザート売り場になってるよ」と。奥には家族が隠したシュークリームまで。示し合わせた覚えはないけど、甘い物を隠す場所の好みは似てるみたいです。写真を頼むならお早めに。カメラより先にスプーンを取るので、あとからだと断面しか残ってません。", "固めプリン同好会", "固め派にもとろとろ派にも席があります🍮 プリンの食感や、カラメルをどこで混ぜるかを話す部です。懐メロが流れたら、おやつの話も洗濯もいったん休憩。", [["1K", "スプーン一杯の拍手", "名前を呼んで「拍手をひとすくい！」。"], ["5K", "おやつの応援札", "忙しい日にひと息つける、名前入りの短いメッセージ。"], ["10K", "今日のごほうび候補", "好みの食感を聞いて、ごほうびプリンのタイプを一つおすすめ。"], ["20K", "新作プリン発表", "あなた専用のプリンを命名。「野菜室でひと晩熟成」は架空の売り文句。"], ["30K", "名前入りプリンラベル", "好みの食感とあなたの名前を入れたラベル画像。"], ["40K", "高級おやつ売り場の放送", "あなたをイメージしたプリンを、1分の売り場放送で紹介。"], ["48K", "○○さんの限定プリン", "オリジナルプリンの2分発表会と、名前入り限定ラベル画像。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、アコースティックギターの音がよく聞こえる弾き語りを聴きます。タイマー付きの早押しゲームは苦手で、答えが浮かぶ頃には次の問題。映画館でも照明がつくまで席を立たない方なので、急がず気持ちが追いつくのを待つ時間が好きです。\n\n映画の感想は「あの部屋、冷蔵庫の音がずっとしてたね」みたいな一言が嬉しい。同じ場面で相手が「登場人物が迷った末に手紙をしまってた」と覚えていたら、もう一度観る理由が一つ増えます。\n\n前に映画の曲を探して友人に鼻歌を送ったら、「途中から別の曲になってる」と。翌日には本来の曲と、間違って混ぜた曲の名前まで届きました。今も二曲を続けて聴くと、私の変なつなぎ目を思い出して笑います。コメントが前の話題への返事になっていたら、まだエンドロールの途中だと思ってください。", "余韻のひと席", "映画を観終わっても、すぐには席を立たない人へ。夜の弾き語りと、その場で言いそびれた感想を聞く席です。あらすじより、耳に残った物音を一つ持ってきてくれると嬉しいです。", [["1K", "今夜のひと席", "名前を呼んで「照明がつくまでごゆっくり」。"], ["5K", "余韻のお礼", "あなたの言葉や今日の気分に合わせて、一行の感謝を贈ります。"], ["10K", "あなたへ一曲", "今夜の気分に合う曲を一つ、聴いてほしい理由と一緒に。"], ["20K", "今日のエンドロール", "一日の話を映画の配役に。「主演、開かなかった傘」もあり。"], ["30K", "一夜のポスター", "あなたの一日を題名と名前入りの映画ポスター画像に。"], ["40K", "眠る前の一分朗読", "あなた宛ての小さな物語とエンドロールを1分で朗読。"], ["48K", "あなたの一夜を上映", "あなたを主役に2分の朗読。名前入り上映ポスター画像付き。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。伊沢拓司さんがクイズの答えを考える場面は、正解より途中の考え方が気になって見ています。自分で謎を解くなら、答えを先に言われるのは苦手。枠で私が何かひらめいても、まず「ヒント要る？」と聞きます。「なるほど」としか言わなくなったら、私の方が外したときです(￣▽￣)\n\nノートは左に見たこと、右に推理。前に脱出ゲームで「椅子は絶対怪しい」と右側だけ埋めていたら、係の人が「お疲れでしたら座って大丈夫ですよ」と。椅子を一緒にのぞき込んでいた仲間と、順番に腰かけました。左に書ける事実がようやく一つ増えました。「座ってよし」。\n\n正解の発表も好きですが、私はその直前が一番好きです。みんな同じ物を見たはずなのに、予想が違う。外れた案も、どうしてそう考えたのかまで聞かせてください。", "仮説だらけの作戦室", "見たものと推理したことを分けて書く、謎解き好きの作戦室。外れた案も、どうしてそう思ったか聞きたいです。休憩用の椅子は、そのまま座ってよし。", [["1K", "作戦室の一席", "名前を呼んで「椅子は普通です。安心してどうぞ」。"], ["5K", "認定・観察上手", "あなたの気づきに、短くてちょっと大げさな称号を贈ります。"], ["10K", "あなた宛ての一問", "好みに合わせた一問ミニ謎を、答えとセットで贈ります。"], ["20K", "名探偵の表彰", "あなたが気づいたことを探偵口調で称えます。椅子は証拠から除外。"], ["30K", "名前入り探偵証", "あなた向けの二つ名を入れた、架空の探偵証画像。"], ["40K", "あなたの一分捜査劇", "あなたを名探偵役に、1分で謎を解く短い寸劇。"], ["48K", "名探偵○○の解決編", "あなたが主役の2分の謎解き寸劇と、解決済みの捜査カード画像。"]]],
  ["からあげレモン🍋", "晩ごはんを考えながら、みんなの晩ごはんを聞きに来ます。からレモです🍋 手書きのお品書きが好きで、「本日のおすすめ」が唐揚げだと、その日の献立はすぐ変更。食卓で掛け声の多い曲が流れるのは少し苦手。曲につられて返事まで元気になり、その先の話を聞き逃します。\n\n唐揚げは揚げたてもいいけど、お弁当で冷めてもおいしかったかまで聞きたい派。レモンはみんなの分にかける前に、一声かけます。この前も「かけていい？」までは落ち着いて聞けたのに、勢いよく絞ったら汁が自分の目に。僕が目を押さえている横で、友人が一つつまんで「これだけ、めっちゃ酸っぱい」と冷静に食レポしました。以来、レモンは自分の小皿でそっと絞ります。\n\nコメントに🍋だけ置く日は、だいたい笑ってます。冷めてもおいしかったおかずの話なら、次の日の朝まで覚えてますよ。", "ひと絞り食堂", "晩ごはん、何にする？🍋 揚げたての唐揚げも、冷めてからおいしいお弁当のおかずも、ここでは話の主役。大皿のレモンは、絞る前に一声どうぞ。", [["1K", "ひと絞りのお礼", "名前を呼んで「拍手、レモンひと絞り分！」。"], ["5K", "おかず札", "あなたの一日に「今日のよくやった」を一行添えます。"], ["10K", "あなたの副菜案", "好きなおかずに合う副菜を一つ、理由つきでおすすめ。"], ["20K", "架空定食の店内放送", "あなた専用の定食をおすすめします。レモンは一声かけてから。"], ["30K", "名前入りお品書き", "あなたの好きなおかずを主役にしたメニュー画像。"], ["40K", "あなたへ一分食レポ", "専用定食を1分で紹介。店員のお腹が鳴る前に締めます。"], ["48K", "ひと絞りの特別コース", "あなた宛ての2分の架空コース紹介と、名前入り献立画像。"]]],
  ["kohaku.", "こはくと申します。休日は開店したばかりの喫茶店へ。店内の静かなピアノ曲に、カップを置く音が重なる時間が好きです。後ろに列ができると焦ってしまうので、注文は席でゆっくり決めたいほうです。もっとも、メニューを一通り見ても頼むのは厚切りトーストです。\n\n家で本を読みながら配信を聴くと、耳に残った曲名を付箋に書きます。あとで同じページを開くと、物語と一緒にその曲を思い出すことがあります。筋の細かいところは忘れたのに、付箋を貼った日の歌い出しだけ妙にはっきり覚えていたりします。\n\n久しぶりにいつもの店へ寄った日、店主に「今日は本、お持ちじゃないんですね」と言われました。本の話をした覚えはありませんが、いつも席で読んでいるのを覚えてくれていたようです。翌週は一冊持っていきました。トーストを置く店主と目が合って、少しだけ笑いました。", "付箋のある喫茶室", "読みかけの本と、耳に残った曲を置いていける喫茶室です。どんな話か全部説明しなくても大丈夫。付箋を挟みたくなったところから話しましょう。", [["1K", "窓側へどうぞ", "名前を呼んで「今日もお越しいただきありがとうございます」。"], ["5K", "一行しおり", "あなたの好きな言葉から、名前入りのお礼の一行を贈ります。"], ["10K", "今日の喫茶おすすめ", "今の気分に合わせて、読む本のテーマか聴く一曲をおすすめ。"], ["20K", "一文の注文", "あなたの言葉をもとに短い物語を書き、焼き上がり待ちの間に朗読。"], ["30K", "名前入りしおり", "あなたの言葉を入れた、喫茶室のしおり画像。"], ["40K", "あなたの一分掌編", "あなたがふらっと来店する、小さな喫茶店の話を1分で朗読。"], ["48K", "○○さんの開店祝い", "あなたが主役の2分の喫茶短編と、作品の一文入りしおり画像。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかで呼んでね。サンドウィッチマンのコントが好き。話がかみ合ってないのに、二人とも真顔で話を進めるところで笑っちゃいます。友だちの間で流行った早口言葉チャレンジは、一度やって苦手だと分かりました。コメントだけはすぐ送れるのに、口が指の速さについてきません。\n\nしりとりでも、早く答えたくて得意げに「みかん」と送ったことがあります。「ぴか、それ終わるやつ」と言われ、仕切り直して次に出したのが「だいこん」。枠主に「ぴかは拍手係できる？」と聞かれ、そこからは誰より先に👏を送りました。拍手なら「ん」で終わる心配もありません。\n\n大喜利で何も浮かばないときは、妙に真面目な店員さんなら何て言うか考えます。頭の中で一人二役やってる間に、枠はもう次のお題。早押し部の部長、考えると遅いです。今日も拍手の準備だけはできてます。", "ぴかっと早押し部", "こんぴかー！ 早押し、しりとり、急な大喜利が始まります⚡ 「ん」で終わっても拍手係は続行。誤字は拾って笑えるくらいのやつだけ、今日のお題にしよう。", [["1K", "こんぴか落雷", "名前を呼んで「小さめ落雷！」と一拍手。"], ["5K", "誤字つきお祝い札", "名前は正しく、祝辞だけ一文字まちがえた一行を贈ります。"], ["10K", "元気が出る一曲", "あなたへ一曲を選び、早押しクイズ風に紹介します。"], ["20K", "ぴかのお題返し", "あなた向けのお題で10秒大喜利。すべったらぴかが一人で拍手。"], ["30K", "名回答の賞状", "あなたの面白かった一言を載せた、名前入りの賞状画像。"], ["40K", "あなたの一分大喜利", "あなたの話題でぴかが一人二役。初戦とリベンジを1分で。"], ["48K", "○○さん杯の優勝放送", "あなたを主役に2分の大喜利特番と、名前入りの優勝賞状画像。"]]],
  ["しりゅう_08", "しりゅう。夜にふらっといます。アニメは二周目で脇役を一人決めて、表情を追うのが好きです。一度目にはただ黙っていた人が、二度目には何か言いかけているように見える。結末を話す前には相手が観たか聞きます。反射神経で勝負する対戦ゲームは苦手です。つい相手の動きに見入って、自分の反応が遅れます。\n\n釣りでは何も釣れない日も竿を出した場所と時間をメモします。ある日、まったく釣れなかった帰り道に、好きなアジの塩焼きが食べたくなって魚屋で二尾買いました。袋を見た家族に「すごいじゃん」と言われ、魚より先にレシートを渡しました。「そりゃ大きさも揃うわけだ」と、その晩は魚屋さんばかり褒められました。\n\n翌週から出かけるたび「今日は海と魚屋どっち？」と聞かれます。まず海には行くよ。魚屋の営業時間だけは、潮の時間より正確に覚えてます。", "夜釣りとアニメ棚", "釣れた日も、魚屋に寄った日も。昔のアニメを観返して気づいた表情や主題歌の話も歓迎です。結末に触れるときは、先に相手がもう観たか聞いてから。", [["1K", "釣り帰りのお礼", "名前を呼んで「今日も来てくれて助かった」と短くお礼。"], ["5K", "本人の釣果札", "あなたができたことを「本日の一尾」として一行で贈ります。"], ["10K", "今夜の一話便", "好みに合うアニメの見どころを、結末を伏せて一つ紹介。"], ["20K", "本日の釣果実況", "「出勤前にゴミ出し達成、一尾」みたいにあなたの成果を実況。"], ["30K", "あなたの釣果図鑑", "小さな成果を一尾に見立てた、名前入りの図鑑カード画像。"], ["40K", "あなたが主役の次回予告", "今日の出来事を、1分の釣りアニメの予告風に。"], ["48K", "○○さんの二本立て", "あなたの一日を釣果ニュースと架空アニメの予告にして2分。図鑑画像付き。"]]],
  ["たいやき＠しっぽ派", "しっぽから食べます。たいやきでも、しっぽでも呼びやすいほうで🐟 趣味は商店街の散歩。看板を眺めてたら一駅ぶんくらい平気で歩きます。友だちと一時期、激辛グルメ巡りを試したけど、辛さ一色になると私には料理の味が分かりません。今は向こうが辛い物を食べたあと、甘いものの店で合流します。\n\nたい焼きを買うときは横からも見ます。端の生地の焼け具合を確かめたいからです。頭派の友だちに一匹を分けてもらったとき、渡されたのは先端だけ。向こうのお皿には頭も胴体も残っていました。「しっぽが好きって言ったでしょ」と返されて、言い返す間に向こうは胴体を食べてました。\n\nあれから二匹買います。あんことカスタードを一匹ずつ同じ袋に入れてもらうと、しっぽをかじっても何味かすぐには分かりません。あんこにたどり着くまでのちょっとした寄り道も、楽しみのうちです。", "しっぽから商店街", "頭派もしっぽ派も寄ってって🐟 あんこがないほどカリッとした端っこも、熱く語る立派な話題です。脱線して誰も話を戻さなくなったら、二匹目を買う合図。", [["1K", "端っこでお祝い", "名前を呼んで「今日のカリッとしたとこ、どうぞ」。"], ["5K", "しっぽ札", "あなたに合う「カリッとひと言」を、焼き上がり札風に。"], ["10K", "頭としっぽのおすすめ", "好みの味を聞き、いちばん好きそうなひと口を紹介します。"], ["20K", "架空たい焼きの売り口上", "あなた向けの具で一匹を宣伝。しっぽまで入ったかも報告。"], ["30K", "名前入りたい焼き袋", "架空たい焼きの絵と名前を入れた包装紙風画像。"], ["40K", "あなたの一分販売会", "あなたをイメージした二匹を1分で紹介。しっぽの厚みも解説。"], ["48K", "○○さんの看板たい焼き", "あなた専用のたい焼きを2分でお披露目。名前入り包装紙画像付き。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでも大丈夫。趣味は帰り道の夜散歩です。いつもの道をひと駅ぶん遠回りして、足音が聞こえるくらいの音量で歌や雑談を聴きます。友だちの間で流行った歩数競争は、やってみたけれど苦手。数字を追うと、街灯の下で立ち止まって歌を聴く余裕がなくなるからです。\n\n大事な用事がうまくいかなかった晩、歌い終えた枠主が「みんな、帰ったら寝ようね」と言いました。家に帰っても考え込むと思っていたのに、その言葉を聞いたら、答えを出すのは明日でいい気がしました。家に着くなり電気を消して、本当にそのまま寝ました。\n\n一日のことを全部話そうとすると、最初の一言が出ません。そんな夜は「今日は月が見えた」とだけ書きます。「こっちは曇り」と返ってきたら、それだけで誰かと夜道を歩いた気分になります。", "月夜の遠回り", "いつもより少し遠い帰り道に、夜の歌と他愛ない話を。何を書こうか迷う日は、今見える空のことだけでも聞かせてください。返事は家に着いてからで大丈夫。", [["1K", "ひと駅のおかえり", "名前を呼んで「今日もおかえり」と静かに迎えます。"], ["5K", "月夜の便り", "あなたの空模様に合わせた、一行のお礼。"], ["10K", "遠回りのおとも", "今の気分に合う一曲を、聴きたくなる道と一緒におすすめ。"], ["20K", "寄り道予報", "「○○さん地方、明朝まで家事が弱まる見込み」と今日を予報に。"], ["30K", "帰り道カード", "あなたと好きな風景を添えた、名前入りの夜道カード画像。"], ["40K", "あなたへ一駅朗読", "その日の話をもとに、1分の散歩話を読みます。"], ["48K", "○○さんへの月夜便", "あなたに贈る2分の散歩朗読と、名前入りの夜道カード画像。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間にいます。急に黙ったら、たいてい手がふさがってます。古い店の手書き看板が好きで、値段が直された跡まで眺めます。ゲームも好きだけど、時間制限のあるパズルは苦手。「残り十秒」と出ると、考えていた答えより時計のほうが気になります。\n\nある日、枠で「おかえり」を「おかわり」と送ったら、翌日から「大盛りにする？」と聞かれるようになりました。私もつい「漬物も」と返し、枠主が「うち何屋だと思われてる？」と一言。そこで来た初見さんが「何がおすすめですか？」と聞き、それまで店員みたいに返事してた人が一斉に黙りました。次は舞茸の天ぷらと言おうと思います。看板を作るなら、値段を書き直せるように手書きで。\n\n作業中に「りょ」を「り」だけ送って、しりとりが始まったこともあります。訂正するより先に「りんご」を取られる枠、けっこう居心地がいいです。", "おかわり休憩所", "作業の合間にひと休み🍄 ゲームも小ボケも、つい送っちゃった誤字の話も歓迎。「おかわり」と書いてあっても、大盛りの相談より先に、まずおかえり。", [["1K", "ログインおめ", "名前を呼んで「ログイン確認。おかわり！」。"], ["5K", "セーブのひと言", "今日の頑張りを、ゲームの記録みたいに一行で贈ります。"], ["10K", "今日の任務札", "あなたがもう終えたことに、かっこいいクエスト名をつけます。"], ["20K", "クエストクリア実況", "あなたの家事を「タオル討伐完了！」などのクリア実況に。"], ["30K", "セーブ済み伝票", "名前とクリア名を入れた、ゲーム風の伝票カード画像。"], ["40K", "あなただけの追加ステージ", "あなたの頑張りをネタに、1分のゲーム風お祝い寸劇。"], ["48K", "○○さんのクリア記念", "あなたが主人公の2分の冒険寸劇と、名前入りクリア伝票画像。"]]],
  ["こうめい＊", "こうめいです。歴史小説を読むと、負けた側が何を考えていたのか気になります。結果を知っている読者なら名案はすぐ浮かぶのに、いざボードゲームでは自分の番でよく手が止まります。早押しクイズも苦手です。出題者の狙いを考えているうちに、相手は答えを出して次の問題です。\n\n前に小学生との対局で、どんな作戦で行くか長々と説明していたら、「でも、僕のコマをそこに置けば勝ちだよ」と言われました。盤面を見直すと、その一手で僕の負け。「確認してたんだよ」と言うと「じゃあ僕の番も確認して」。どうやら僕の長い説明を聞きながら、自分の番を待っていただけでした。そこでようやく、「どうぞ」と言えました。\n\n枠では風呂が先か、ごはんが先かくらいの話でも喜びます。答えより、どうしてそっちか聞くのが好きです。軍師が長くなったら、次の人へどうぞ。", "一手先の円卓", "ボードゲームと歴史の話を囲む円卓。慣れてる人の定石も、初参加の「ここに置いたら？」も、理由まで聞くと面白い。私が作戦だけ延々と語り出したら、手番を進めてください。", [["1K", "円卓の一席", "名前を呼んで「○○殿、本日の先手をどうぞ」。"], ["5K", "軍師のひと言", "あなたの一手をたたえる、短い軍師風メッセージ。"], ["10K", "あなたの小さな作戦名", "普段うまくやっていることに、戦略っぽい名前をつけます。"], ["20K", "功績の評定", "日常の頑張りを軍師口調で解説。「先に風呂作戦、無事成功」など。"], ["30K", "名前入り作戦図", "あなたの好プレーを描いた、架空の盤面カード画像。"], ["40K", "あなたの一分作戦会議", "あなたの工夫や一手を、軍師が1分かけてたたえます。"], ["48K", "○○殿の勝利評定", "あなたを主役に2分の作戦トーク。名前入りの勝利作戦カード画像付き。"]]],
  ["れん_07", "れん。邦ロックと弾き語りをよく聴きます。奥田民生さんの曲が好きで、歌の合間に入るギターを追いかけるのが楽しい。人混みで肩がぶつかるのは苦手なので、ライブハウスでは後ろの端に立つことが多いです。\n\n別の歌い手さんのライブで、途中で伴奏が止まったことがあります。その人がマイクを下ろし、「ここだけ歌える？」と客席に聞きました。最初は前の数人だけ。少しずつ後ろからも声が上がって、気づいたら自分も歌ってました。歌い手さんは客席を見渡して笑い、続きを歌えなくなりました。\n\n普段聴く音源にあの客席の声は入っていません。それでも曲があの一節に差しかかると、後ろの席で一緒に歌った声を思い出します。外では静かに聴いて、家に着いたら「こんばんは」。ライブでしか気づかなかった音があったら、どの席で聞いたかも教えてください。", "ギターが鳴る後列", "邦ロックや弾き語りの話を、ギターがよく聞こえる後列で。好きな音が出てくるところや、客席が思わず歌い出したサビの話を一つ聞かせてください。", [["1K", "後列の歓迎", "名前を呼んで「ギターがよく聞こえる席へどうぞ」。"], ["5K", "夜の半券メッセージ", "あなたへ、今夜のライブに来てくれた気分のお礼を一行。"], ["10K", "あなたへの推し曲", "気分に合う曲と、最初に聴いてほしい楽器の音を紹介。"], ["20K", "一音のスポットライト", "あなたの好きな一音を、ライブでの曲振り風に紹介します。"], ["30K", "名前入りセットリスト", "あなた向けの二曲と聴きどころをカード画像に。"], ["40K", "一分アンコールMC", "あなた宛てに、紹介したい二曲を1分でMC風に伝えます。"], ["48K", "○○さんの記念ライブ口上", "あなたのための2分のライブ風トークと、名前入りセットリスト画像。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」と続けて聞くのは、たぶんじにです＊ 日村勇紀さんがおいしそうに食べる姿が好きで、見てると買いに出たくなります。友だちの間で流行った「一日で話題の店を何軒も回る食べ歩き」は苦手でした。一軒見つけたら、その近所をぶらぶらしたいです。\n\n前に地図を見返したとき、ある店のピンに「絶対また行く」とだけメモしてありました。行ってみたら、頼んだものはおいしいのに、どうも食べたかったのはこれじゃない。お店を出て角まで歩き、たこ焼きの匂いがしたところで思い出しました。本命は角の先のたこ焼き屋で、ピンを立てた店は曲がり角の目印でした。\n\n今は近所にピンが二つ。そのうち一つは「前のピン参照」。次に探すときも、たぶん角まで行くことになります。おすすめを教えてくれるなら、店名と一緒に、そこで何を食べたかも聞かせてください。次のメモには必ず両方書きます。", "よりみち地図帳", "旅先のおやつや、地元の人が帰りに寄る店を記録する地図帳です。「次は何を頼むか」までぜひ。目印のお店と本命のお店のピンが逆でも、気づいたら教えてね＊", [["1K", "寄り道歓迎", "名前を呼んで「○○さんの席にピン立てました」。"], ["5K", "あなたの目印メモ", "好きなおやつに、名前入りの一行メモを添えます。"], ["10K", "おやつの寄り道案", "好みに合いそうなおやつを一つ、どこが好きそうか添えて紹介。"], ["20K", "新店の看板紹介", "あなた好みの架空のおやつ屋さんを店名から紹介します。"], ["30K", "あなたの寄り道マップ", "名前入りの店と、隣のたこ焼き屋を入れた地図画像。"], ["40K", "あなた宛て一分食べ歩き", "好きな味をもとに、二軒の架空のお店を1分で案内します。"], ["48K", "○○さんの商店街", "好みに合わせた2分の架空街歩き。あなただけの寄り道マップ画像付き。"]]],
  ["港レター_", "旅の話が好きな方へ。みなとです。海沿いを歩いて、朝の散歩で焼きたての塩パンを買うのが好きです。テンポの速い曲は、足までつられて寄り道を通り過ぎるので、散歩のお供には向きません。旅先ではイヤホンを外し、店のシャッターが開く音を聞きながら歩きます。\n\n港町に泊まったとき、夕方のうちに自宅宛ての絵はがきを出しました。裏に書いたのは「明日の朝は、港で塩パンを買う」だけ。翌朝、本当にパンを買うと、宿に戻るまで紙袋は温かいままでした。旅から帰って数日後、あのはがきが届きました。\n\nパンの味はもう知っているのに、はがきの中の自分はまだ明日の朝を待っている。短い一行でしたが、旅先の自分に「パン、おいしかったよ」と返事をしたくなりました。近所の道でもかまいません。好きな寄り道と、そこを通りたくなる時間を一つ聞かせてください。みなとより。", "海辺のポスト", "旅先で見つけた寄り道を、はがき一枚ぶんだけ。朝のパン屋でも、地元の人がよく通る裏道でも。場所と一緒に、そのときの匂いや音を聞かせてください。", [["1K", "港からひと言", "名前を呼んで「○○さん宛て、無事届きました」。"], ["5K", "海辺の一行便り", "好きな風景を想像して、あなた宛ての一行を書きます。"], ["10K", "あなたの朝の寄り道", "気分に似合う架空の街と、おすすめの朝の寄り道を一つ。"], ["20K", "旅はがきの朗読", "あなた宛ての短いはがきを朗読。追伸にはパン屋の話。"], ["30K", "名前入り絵はがき", "あなた宛ての言葉と架空の消印を入れた画像。"], ["40K", "港町の一分便り", "あなたの好きな風景から朝と夜を想像し、1分の手紙に。"], ["48K", "○○さん宛ての港町", "あなたへ架空の街から2分の旅便り。名前入り絵はがき画像付き。"]]],
  ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ ドライブの途中で買う塩むすびが好きで、これだけのために遠回りすることもあります。分厚い歴史小説は登場人物の名前を途中で見失うので苦手。カラオケの曲選びも、名前だけを頼りにして失敗したことがあります。\n\nカラオケで、一時期よく聴いていた曲を得意げに入れたら、画面に知らない歌詞が出ました。題名が同じ別の曲だったんです。止めようとしたら、友人が「これ歌える」とマイクを取り、最後までさらっと歌い切りました。僕は隣で、出番を失った分だけ元気にタンバリンを鳴らしました。\n\n次に会ったとき「またあれ入れてね」と頼まれました。別の曲を入れたのは僕ですが、あれはもう彼の十八番だと思ってます。あなたの十八番や、帰りの車で聴きたい曲も教えてください。曲名が出なければ、どんな日に聴いてたかからで大丈夫です。", "サビから歌う会", "十八番とドライブの一曲を持ち寄る会♪ 曲名が出なければ、どんな日に聴いてたかからどうぞ。サビが来たところでコンビニに着いたら、降りるのは歌い終えてから。", [["1K", "口タンバリン一発", "名前を呼んで「シャカッ」と拍手代わりにお祝い。"], ["5K", "十八番のお礼札", "あなたの曲の好みを思い出し、名前入りのひと言を贈ります。"], ["10K", "運転席へ一曲", "気分に合いそうなドライブ曲を、聴きどころと一緒におすすめ。"], ["20K", "昔のラジオの曲振り", "あなたへの一曲をDJ風に紹介。最後は口タンバリン。"], ["30K", "名前入り番組表", "あなたへ贈る二曲を、ラジオの番組表画像に。"], ["40K", "あなたへ一分の選曲便", "あなた向けの二曲と曲を選んだ理由を1分のDJ風で。"], ["48K", "○○さん宛て夜ラジオ", "あなたがリクエストした雰囲気で2分の番組。名前入りの番組表画像付き。"]]],
  ["かんうどん🍜", "「かん」で大丈夫です🍜 かけ、ちくわ天、ねぎ多め。郷土料理の本を読むのが好きで、同じうどんでも地域で具が違うのを見ると食べに行きたくなります。夕飯を作りながら枠を聴くので返事は一拍遅れますが、だしの話だけはいったん手を止めます。\n\n真っ白な服で汁ものを食べるのは苦手です。近所の店で一度、白いシャツにカレーうどんの汁を飛ばしてしまいました。次の週、黒い服で行くと店主に「いつもので？」と聞かれ、かけうどんのつもりでうなずきました。出てきたのはカレーうどんでした。「今日は黒い服で良かったね」と言われて、注文より前回の惨事を覚えられてたんだと分かりました。\n\nふだんは天ぷらを浸す前にまずだしを一口、と思ってます。その通りにできるかは、目の前のちくわ天次第。地元でよく乗せる具があったら、どんなだしと合わせるかも教えてください。", "ねぎ多めの席", "かけ、ちくわ天、ねぎ多め🍜 うどんの話なら、何が乗っていたかも聞きたい席です。季節の変わり目はカレーの話が増えます。白い服の方は少し後ろへ。", [["1K", "ねぎ多めの拍手", "名前を呼んで「○○さんの分、拍手もねぎも多め！」。"], ["5K", "今日の一杯メモ", "あなたの一日に合う、短い店主風のお礼メッセージ。"], ["10K", "あなたのうどん合わせ", "好みの具に合う薬味を、ひとつ理由つきでおすすめ。"], ["20K", "だしの実況中継", "あなた専用のうどんを想像して食レポ。「天ぷら、入れちゃいました」。"], ["30K", "ねぎ多めのお品書き", "あなたの名前と好みの具を入れたメニュー画像。"], ["40K", "あなたの一分試食会", "好みの一杯をだしと天ぷらに分けて1分で紹介。"], ["48K", "○○製麺の特別営業", "あなたの看板うどんを2分でお披露目。名前入りメニュー画像付き。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話を聞くのが好きです。星座は勉強中。数式が何ページも続く天文学の本は苦手なので、空を見て時刻と方角を覚えるところから始めました。方角がうろ覚えの日は「近所のコンビニの上」と言ってます。\n\nある夜、友人と流星を待っていたら、私が「あっ」と言った瞬間に向こうも「あっ」。二人で「やっと見つけたね」と喜びました。私は、友人も同じ流星を見たのだと思っていました。帰りに友人が「最後の一本だったから買った」と缶ジュースを見せてきて、ようやく何が違ったか分かりました。友人が見つけたのは、そばの自販機に残っていた缶ジュースでした。\n\n今度は何を見つけたのかまで聞くことにします。枠では「月と深海、行けるならどっち？」みたいな、正解のない話も好きです。私は月。席まで選べるなら窓側をお願いします。", "土星の窓側席", "今日見えた星、月と深海ならどちらに行くか、正解がいらない夜の話をする窓側席◎ 星座が分からなければ「コンビニの上」からどうぞ。", [["1K", "窓側へのご案内", "名前を呼んで「窓側空いてます。コンビニの上を経由します」。"], ["5K", "一行の星便り", "あなたの今日を、窓側からの短いお礼便りに。"], ["10K", "あなたの星空のおとも", "気分を聞いて、夜空を楽しむ見どころを一つ紹介。"], ["20K", "あなたの新星座", "今日あったことに星座名をつけます。「洗濯ばさみ座」も立派な候補。"], ["30K", "名前入り星座カード", "あなただけの架空の星座を、名前と星の絵で画像に。"], ["40K", "あなたの一分宇宙案内", "あなたの星座を1分で解説。途中で自販機も目印にします。"], ["48K", "○○天文台の夜", "あなただけの星を紹介する2分の架空案内。名前入り星図画像付き。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。「もち」だけでも振り向きます。洗い立ての綿の毛布の匂いが好きです。毛布にくるまってよく話す日も、静かに配信を聴く日もあります。翌朝「おはよう」と返したら、途中で寝ていたと思ってください(-_-)zzz\n\nお餅はきなこ派。正月に並ぶものでは、甘く煮た黒豆がちょっと苦手です。お雑煮は好きで、前のお正月は、食べ進めるうちにお椀の底からお餅が三つ出てきました。小さい頃の僕が「一つじゃ足りない」とよく言っていたのを、家の人が覚えていたんです。今なら二つでも十分なのに、少し嬉しくて、結局きれいに食べました。翌朝「今日も三つ？」と聞かれたときは、素直に「今日は一つでいい」と答えました。\n\nよそのお雑煮の話も好きです。だしの匂いか、お餅の形か、うちと違ったら最初にどこで気づくかを教えてください。たぶんそこまでは起きています。", "毛布ときなこの部屋", "きなこ餅派も、お雑煮にその家の決まりがある人も、毛布の中からこんばんは。挨拶の返事が翌朝でも気にしない、ぬくぬく聴ける部屋です。", [["1K", "毛布から拍手", "名前を呼んで「毛布から出なくて大丈夫」と小声でお祝い。"], ["5K", "ぬくぬくの一行", "疲れた日のあなたに、肩の力が抜ける一行を贈ります。"], ["10K", "あなたのおやすみ札", "今夜の気分を思い出して、名前入りのおやすみの言葉を贈ります。"], ["20K", "寝落ち実況", "「○○選手、毛布に入ったまま静かに優勝です」と小声で実況。"], ["30K", "布団で優勝認定", "あなたの名前と勝因を添えた、おやすみ賞状画像。"], ["40K", "ぬくぬく一分便り", "あなた宛てに1分のひと息トーク。最後は静かに「おやすみ」。"], ["48K", "○○さんの毛布大会", "あなたが静かに優勝する2分の実況劇。名前入りのおやすみ賞状画像付き。"]]],
  ["いかいかが？", "いかです🦑 「いかがですか？」まで読んでもらえるとちょっと嬉しい。最近は水族館で、魚のしぐさに勝手に一行の字幕をつけるのがマイブーム。登場人物が何十人も出てくる長編ミステリーは誰と誰が知り合いか途中で分からなくなるので苦手です。水槽は、前を通る一匹だけ見ていても楽しめます。\n\n前にエイに向かって手を振ったら、向こうの通路の小さい子が笑って手を振り返してくれました。私もついもう一回振ると、隣のお母さんまで手を振ってくれました。やりとりの間にエイは泳ぎ去っていました。友人に「あの子、知り合い？」と聞かれ、「今、知り合った」と返しました。あとで考えた字幕は「主役のエイ、途中退席」です。\n\n枠でも天気の話が深海まで流れていくような雑談が好きです。きっかけはたいてい私が聞いた天気。よければ、そちらの空模様からいかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 雨の話から深海まで、流れ着いた話題を眺める部屋です。水槽の向こうに手を振り返す人がいたら、その話からどうぞ。", [["1K", "クラゲ前の歓迎", "名前を呼んで「クラゲ前、あなたの席空いてます」。"], ["5K", "水槽のひと言便り", "好きな生き物から、あなたへの短いお礼を一行。"], ["10K", "あなたの一槽", "好みを聞き、眺めていたくなる生き物と、注目する動きをおすすめ。"], ["20K", "水槽の代弁放送", "あなたの気分を水槽案内に。「考え事中につき低速運転」など。"], ["30K", "名前入り水槽プレート", "あなたと好きな生き物の組み合わせを、説明板風の画像に。"], ["40K", "あなた宛て一分ガイド", "好きな生き物二つを、1分の館内ガイド風に紹介。"], ["48K", "○○さんの閉館後ツアー", "好みに合わせた2分の架空ツアー。名前入り入館票画像付き。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 冷えた手で温かいマグカップを包む瞬間が好きです。夜はそうして歌枠を開き、静かな声で始まるバラードを聴きます。周りで歌の動画を倍速で聴くのが流行ったとき、私も試しました。歌い出す前の息づかいまで慌ただしく聞こえるのが苦手で、すぐいつもの速さに戻しました。\n\nこの前は感想を打っては消しているうちに、次の曲が始まりました。「一つ前の曲、二番の前の息づかいが好きでした」と送ったら、曲の合間に枠主さんが「あそこ、落ち着こうと思って深く息を吸ったんだよ」と返してくれました。短い一行でも、私がどこを聴いていたか伝わったのが嬉しくて、そのあと冷めたお茶を飲みました。\n\n次はお茶が温かいうちにひと口。感想が一曲遅れて届いたら、また言葉を選びすぎたと思ってください。", "雪あかりの歌席", "温かいものを一口、夜に聴きたい歌を一曲。感想は、心に残ったところを一つだけでも。返事を考えて飲み物が冷めた人には、ここにも仲間がいます。", [["1K", "ひと息のお祝い", "名前を呼んで「今日も一息ついていってください」。"], ["5K", "一行のおやすみ便り", "その日のあなたへ、短い労いの言葉を贈ります。"], ["10K", "あなたへ夜の一曲", "気分に合うバラードを一曲、聴きどころも添えておすすめ。"], ["20K", "ひと口ぶんの手紙", "好きな夜の景色を添え、あなた宛てに短く朗読します。"], ["30K", "雪あかりの便箋", "名前と手紙の一行を入れた、便箋カード画像。"], ["40K", "あなたへ一分朗読", "今日の気分に合わせた1分の手紙。飲み物が冷める前に。"], ["48K", "○○さんの雪あかり", "あなただけに選んだ風景で2分の朗読。名前入り便箋画像付き。"]]],
  ["じゃっくん☆", "はーい参加します！ ルールは今から聞きます。じゃっくんです🙌 趣味は対戦ゲームと、人のボケにコメントで一行足すこと。冷蔵庫のプリンの話が、いつの間にか「冷蔵庫に社長が住んでる」に変わるくらいの脱線が好きです。社長のプリンはたぶん食べます。レーズン入りのお菓子なら、噛んだ瞬間の甘さが苦手なので社長に返します。\n\n友だちとゲームで対戦した日、攻めていたキャラを見て「やった、勝った！」と叫びました。見ていたのは友だちのキャラ。僕のキャラは画面の端で、壁に向かって全力で走ってました。「声だけなら優勝」と言われて笑っているうちに、また自分のキャラの色を確かめないまま次の試合が始まりました。\n\n以来、対戦前には「僕どっち？」と聞きます。実況だけならいつでも任せてください。冷蔵庫のドアを閉める五秒間でも、たぶん決勝戦にできます。", "とりあえず参戦部", "実況も大喜利も、まず挙手🙌 誰かの一言に一個ずつ足して、電子レンジの残り一秒まで勝負にします。はじめましての人も、何に参加するかはあとで聞いて大丈夫。", [["1K", "いきなり表彰", "あなたの名前を呼んで「種目は未定ですが拍手！」。"], ["5K", "仮エントリー表彰", "日常の小さな頑張りに、面白い競技名を一行で贈ります。"], ["10K", "あなたの実況見出し", "一日の出来事から、スポーツ新聞風の一行を贈ります。"], ["20K", "日常の決勝戦", "あなたの一場面を実況。「電子レンジ、残り一秒を見送ったー！」。"], ["30K", "あなたの仮競技メダル", "名前と競技名入りの、お祝いメダル風画像。"], ["40K", "あなたへ一分二種目杯", "あなたの普段の活躍を二つ拾い、1分で入場から表彰まで。"], ["48K", "○○さん杯の決勝特番", "あなたが優勝する2分の架空大会。名前入り結果カード画像付き。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。休みの朝はパン屋さんに寄るのが楽しみ。平野レミさんの料理番組を見たあとは、私も何か作りたくなります。甘いものは好きだけど、シナモンが強いお菓子は苦手。家でクッキーを焼くなら、バターの香りがふわっとするのが好きです。\n\n前にクッキーを焼きすぎて、「焦げたところはよけてね」と友だちに渡しました。あとで届いたのは空っぽのお皿の写真と「次は倍で」のメモ。嬉しくて倍の量を仕込んだら、二枚目の天板を出すのが遅れました。二枚で焼き色が違ったので、袋を分けて「薄い色のほうからどうぞ」と渡しました。倍にしたのは量で、焼き時間じゃなかったんだけど。\n\n同じ生地でも焼き上がりが違うので、料理の話では味つけだけでなく「何分くらい焼いた？」まで聞きたくなります。生地を仕込んだら、今日は先にタイマーをセットします。", "焼きたてひと皿", "パンの匂いと隠し味の話をする、焼きたての一皿。何を入れたかと、いつ入れたかを両方聞きたいです。ちょっと焼きすぎた分も、ここでは味見のうち。", [["1K", "焼きたてのひと言", "名前を呼んで「味見の一枚ぶん、ありがとう」。"], ["5K", "おやつの一行札", "今日のあなたを思い浮かべた、小さなお礼を一行。"], ["10K", "あなたの隠し味案", "好みの材料に合うものを一つ、おすすめ理由つきで贈ります。"], ["20K", "焼きすぎ新作発表", "あなた好みの架空の焼き菓子を命名。焦げ目も個性として紹介。"], ["30K", "あなたの焼き菓子ラベル", "名前と好きな材料を入れた包装カード画像。"], ["40K", "あなた宛て一分試食会", "好みをもとに新作を想像し、1分で食感と香りを紹介。"], ["48K", "○○さんの限定焼き菓子", "あなた宛ての新作発表を2分で。名前入り限定ラベル画像付き。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方、家事の合間に「おつかれ〜」とだけ書きに来ます。暮らしのエッセイが好きで、スーパーのおやつや家での小さな失敗が出てくると、うちでもありそうと思いながら読みます。一話で区切れる本だと、洗濯物を取り込む前でもつい手が伸びます。\n\n季節限定のゆず味を探して三軒回った日、最寄りのお店のレジ横でそれっぽい黄色い袋を発見。「二袋でお得」につられたのに、帰って開けたらゆず胡椒味でした。辛いお菓子は苦手で、一枚食べてさっそく水を取りに。そこへ家族が、私が探していた甘いゆず味のお菓子を出してきました。同じ店で、袋の商品名を最後まで読んで買ったそうです。\n\nその晩はエッセイの一話だと思ってレシートを残しました。今は「二袋でお得」を見ても、まず表の商品名を最後まで読みます。辛いほうは、家族がおいしく食べてくれました。", "ゆず色おつかれ会", "夕方の「おつかれ〜」だけでも歓迎🍊 家事の区切りに一曲。買った柑橘おやつがゆず胡椒味だった報告も歓迎です。片付けより歌に聴き入った日は、ひとまず拍手しとこ。", [["1K", "夕方おつかれ拍手", "名前を呼んで「家事の途中でも一回拍手！」。"], ["5K", "柑橘ひと口メッセージ", "あなたへ夕方に読み返せる、一行のおつかれさま。"], ["10K", "今日の一曲便", "散歩か休憩か、気分に合う一曲と聴きどころを贈ります。"], ["20K", "柑橘表彰タイム", "「洗濯完走賞。乾くのは明日でも拍手！」と頑張りを表彰。"], ["30K", "名前入り家事クリア札", "あなたの頑張りを柑橘イラスト入りのカード画像に。"], ["40K", "あなたの一分夕方ニュース", "今日できたことと、おつかれさまを1分の夕方ニュース風に。"], ["48K", "○○さんのおつかれ特番", "あなた宛ての2分の夕方ニュース。名前入り「本日の家事終了」画像付き。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。武将の手紙を集めた本が好きです。立派な決まり文句より、最後にそっと添えてある頼みごとが気になります。うちの置き手紙で一番よく読まれるのは「猫のおやつを一回分だけ」。書き手を問わず効く一行でござる。\n\n武将の番組を家族と見ていたら、盛り上がったところで猫殿がテレビの前に座りました。巻き戻しても、また同じ場面で参戦。大きな太鼓が鳴り続ける勇ましい曲が苦手で、最初に音量を下げておいたのですが、猫殿の出番だけは見逃しませんでした。画面の真ん中に座るので、効果音など要りません。\n\n三度目には、武将より猫殿の登場をみんなで待っていました。今では誰かがテレビの前に立つだけで「参戦ですか？」と声が飛びます。猫の話題で私が「かわいい」としか書かなくても、ちゃんと聞いておりますฅ", "ねこ殿の書状部屋", "武将の書状と猫の話を、夜にしれっと。武将が決めゼリフを言うところでも、猫殿が画面前に来たら、皆でいったんそちらに注目ですฅ", [["1K", "猫殿への拝謁", "名前を呼んで「座布団は猫殿と半分ずつで」と歓迎。"], ["5K", "肉球の一行書状", "あなたの名前を入れ、猫殿から短いお礼を贈ります。"], ["10K", "猫殿の称号", "あなたの良いところに、猫殿が大げさな二つ名を贈ります。"], ["20K", "猫殿からの書状朗読", "あなた宛ての書状を朗読。追伸は「おやつを追加されたし」。"], ["30K", "名前入り肉球花押", "猫殿からあなたへのお礼を、肉球印つきの書状画像に。"], ["40K", "あなたの一分御前評定", "あなたの功績を1分まじめにたたえます。猫殿は途中で帰る予定。"], ["48K", "○○殿の一城進呈", "あなたの城名をお披露目する2分の授与式。名前入りの書状画像付き。"]]],
  ["ぜうす_", "ぜうす。呼び捨てで平気です。コーヒーは深煎り。好きなのは、映画館が暗くなる直前のざわめき。上映が始まるとみんな黙るのに、観終わったら同じ場面について全然違うことを話す、その時間も面白いです。登場人物の気持ちまで一つに決めつける解説本は少し苦手。読んでからまた映画を観たら、その人の言葉ばかり浮かぶので。\n\n映画の帰りに友人と「あの主人公、最後に何を考えてたんだろう」と話したことがあります。降りる直前になって、僕は黙って席を立った人、友人はその人を見送った人を指していたと判明。名前を言わずにずっと「主人公」と話していたので、やけに意見が合うと思っていました。思い返すと、どちらを中心にしても筋が通る。もう一駅ぶん、話したくなりました。\n\n枠では聴いていることが多いです。感想が割れた日は、まず誰の話をしてるのか聞きます。", "深煎りの上映後", "深煎りを一杯、映画の終わったあとの話を。答えが割れたら、先に覚えている場面を聞かせてください。結末に触れそうなら、まだ観ていない人に一声。", [["1K", "深煎りの一声", "名前を呼んで「上映後の一杯、どうぞ」と迎えます。"], ["5K", "余韻の一行", "あなたの話から心に残ったところを、一行にしてお返し。"], ["10K", "あなた宛ての一本", "好みに合いそうな映画を、結末に触れず一つ紹介。"], ["20K", "今日の別解", "あなたの一日を、二つの結末がある短い映画風に語ります。"], ["30K", "名前入りエンドカード", "あなたの言葉を残した、架空映画のエンドカード画像。"], ["40K", "あなたの一分編集会議", "一日の出来事から、二つの見え方を1分で楽しむ映画風トーク。"], ["48K", "○○さんの二重エンド", "あなたを主役に、二つの結末を計2分で朗読。名前入りタイトル画像付き。"]]],
  ["りさっち＊", "りさっちです☺️ 趣味はカフェめぐり。頼むのはだいたいいつものホットですが、器が違うと、飲み終わったあとに底の印までつい見ちゃいます。友だちの間で流行ったカフェ記録は、毎回飲む前にスマホを出すのが苦手で三日で終了。三日目は飲んでから思い出して、レシートだけ撮りました。\n\nドラマは観た日のうちに感想を言いたい派です。カフェで友だちと話して、推している登場人物が一緒だと分かったので安心していたら、「でも同僚なら絶対に困るよね」と言われました。もし同僚なら味方につくと思っていたので、どの場面で嫌になったかまで聞きました。コーヒーが冷める頃には、二人とも結局推しは同じ。ただ、本当に同じ職場にいたら、私はその人の隣の席を避けると思います。\n\n枠で「みんなならどうする？」と聞こえたら、洗い物を一度止めて返事します。どの場面で味方を降りるかまで聞かせてください。", "いつものカフェ席", "いつものカフェ席で、ドラマの感想と気になるリップの話を☺️ 「推しだけど同僚にはしたくない」みたいな話も大歓迎。洗い物が途中なら、話はカップが冷めるまで待ちます。", [["1K", "いつもの席へ", "名前を呼んで「○○さん、今日もお席あります」。"], ["5K", "カップにひと言", "あなたの気分に合う、お礼の言葉を注文シール風に。"], ["10K", "あなたのカフェおすすめ", "気分や好みに合わせた一杯を、理由つきでおすすめ。"], ["20K", "気分のおまかせドリンク", "あなた専用の一杯を命名。初めての注文でも「いつもので？」。"], ["30K", "名前入り限定カップ", "あなたが好きな色と名前を入れたカップカード画像。"], ["40K", "あなた宛て一分カフェ", "一杯の名前と、あなたの好きな話題を1分の店内トークに。"], ["48K", "○○さんの貸し切り席", "あなたを迎える2分のカフェ小話。名前入り限定メニュー画像付き。"]]],
  ["ちょぱ丸_", "コンビニまで往復10分。寄り道込みで30分。買うはずだった飴は、忘れて帰りました。ちょぱ丸です。音楽はアニメの劇伴が好き。登場人物が黙って振り返った瞬間に低い音が入る、みたいなところを覚えがちです。すっぱい粉がたっぷりついたグミは苦手。一度、砂糖だと思って口に入れて、一粒で目が覚めました。\n\n商店街で目をつけたお店は「赤いのれんの隣に猫」と覚えてました。次に行くと猫がいない。のれんは見えたのに店の前を通り過ぎて、地図を開いてから引き返しました。帰りには猫が戻っていました。猫を目印にしたのはこっちの都合なので、そりゃ向こうにも休憩時間くらいあります。\n\nアニメを二度目に観ると、主役の後ろにいた脇役や、ふいに入った一音に気づくことがあります。「そこ見てた？」という感想は大歓迎。今日の推しも、その話を聞いてから決めます。", "寄り道アニメ部", "推しを一人に絞るなら「今日の一人」でOK。アニメの一瞬の仕草から、迷った先のお店までよく話がそれます。案内役が猫を探し始めたら、地図を開いてください。", [["1K", "寄り道で歓迎", "名前を呼んで「○○さんの席、今日は迷わず着きました」。"], ["5K", "あなたの道しるべ", "一行のお礼に「猫は不定休」の注釈を添えます。"], ["10K", "今日の推し便り", "あなたが好きな作品の、細かい好きポイントを一つ語ります。"], ["20K", "寄り道の次回予告", "あなたが主役の短い予告。「次回、○○さん、気づけば二階へ」。"], ["30K", "寄り道の名前入り番組表", "あなたの寄り道を本編にした、架空の番組表画像。"], ["40K", "あなたの一分外伝", "今日の話を聞き、あなたが主役の番外編を1分で語ります。"], ["48K", "○○さんの寄り道特番", "あなたを主役に2分のアニメ風物語。名前入り寄り道マップ画像付き。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 趣味はゲームの地図を隅まで埋めることです。目印のない脇道から戻る頃には、本来どこへ向かっていたか忘れていることもございます。\n\n急かされるのは少々苦手です。以前、決戦の装備を揃えている最中に、同行者から「そろそろ行きましょう」と声がかかりました。慌てて近道を選び、崖から二度落下。三度目で足を止めてみれば、すぐ脇に橋がございました。攻略に夢中で、足元の道を見落としておりました。なお、ボス戦は二分で終わりました。準備した回復薬は一つも使っておりません。\n\n枠では、勝った話と同じくらい、通り過ぎた橋の話も好きです。ボス戦の曲なら、どの瞬間に流れ始めるのかまで教えていただけると嬉しいです。お急ぎでなければ、決戦の前に一度、休憩室へどうぞ。", "決戦前の休憩室", "決戦前の休憩室へようこそ。攻略の失敗談も、ボス戦の好きな一音も歓迎いたします。最後の扉へ向かう前に、どうぞ回復アイテムと足元、特に横に橋がないかをご確認ください。", [["1K", "ご来城のお礼", "名前を呼んで「○○様、本日もご来城ありがとうございます」。"], ["5K", "通行許可証のひと言", "あなたの名前を入れ「本日の橋の利用を推奨いたします」と贈ります。"], ["10K", "あなたの二つ名", "今日できたことに合わせて、ラスボスが称号を一つ授けます。"], ["20K", "功績のお祝い", "「洗濯を終えた功績により、今夜の決戦は免除いたします」と丁重に祝います。"], ["30K", "名前入りクエスト達成証", "あなたの功績を記した、紋章つき賞状画像。"], ["40K", "あなたの一分決戦劇", "あなたが勝つ最終戦を、ラスボスが一人二役で1分上演。"], ["48K", "○○様の王国授与式", "あなたを主役に2分の式典。選んだ称号と名前入りの感謝状画像付き。"]]],
  ["simba_", "シンバです。ドライブの休憩が長いほうです。にぎやかなビッグバンドの曲は、運転中だと少し苦手です。静かな曲に替えて、休憩先で好きなたまごサンドを食べると元気になります。\n\nある日、海辺で車を止めて、友だちとベンチに座りました。海を眺めて休むつもりが、座ると正面は駐車場。海は背もたれの向こうでした。海のほうを向こうとしたら、友だちが「車が見守ってくれてる」と。結局そこでたまごサンドを食べきって、ベンチから見えた駐車場まで写真に撮りました。帰って見返したら、海の写真よりその一枚のほうが、何を話したかまでよく思い出せました。\n\n動物園でも、ペンギンの水槽の前でしゃがむと、立っているときとは違うところが見えます。旅の話でも、予定になかった休憩や途中で立ち止まった場所のこと、聞かせてもらえると嬉しいです。", "停車中の見晴らし席", "景色が気になったら、いったん停車。車で聴く曲も、動物園でしゃがんで初めて見えたものも話せる休憩席です。ペンギンが飛び込むところだけ、もう少し一緒に待ちましょう。", [["1K", "見晴らし席へ", "名前を呼んで「景色がいいので、○○さんの席で一旦停車」。"], ["5K", "車窓の一行便り", "好きな景色を思い浮かべ、あなた宛てに一行のお礼。"], ["10K", "あなたの寄り道案内", "気分に合う風景や動物の見どころを一つおすすめ。"], ["20K", "ペンギンの一声実況", "あなたの小さな挑戦を「行けるか、今度こそ水に入るか」と応援。"], ["30K", "名前入り風景カード", "好きな景色と表示名を添えた、休憩の記念画像。"], ["40K", "あなた宛て一分ドライブ", "好きな景色を二つつなぎ、1分の車窓トークを贈ります。"], ["48K", "○○さんの見晴らし便", "あなたの好みに合わせた2分の架空ドライブ。名前入り行程カード画像付き。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白くてまぶしい照明が苦手で、夜は机の手元だけを照らすランプを使います。好きなのはバターを塗ったトーストです。枠が面白いと、食べるのを忘れて冷めてしまうこともあります。\n\n最後の城の手前で保存したと思っていた昔のデータを開くと、なぜか最初の村にいました。何をするつもりだったかは思い出せません。でも村の曲が流れたら、ランドセルを机の横に置いて、夕飯まで遊んでいた部屋のことはすぐ浮かびました。あの頃なら、城に着くより村の曲を最後まで聴くほうを選んだかもしれません。結局、その晩も村を一周しただけでセーブしました。\n\n配信でゲームの曲を勧めるなら、題名が出てこなくても大丈夫。「雪の町の出口」とか「三回迷った洞窟」とか。曲を探しながら、ようやく冷めたトーストに手を伸ばします。", "夜更けのセーブ地点", "夜の作業をしながら、ゲームの音と風景を話す場所。曲の名前がうろ覚えなら、雪の町や夕方の港からどうぞ。一曲を探して手が止まったら、そこが今日のセーブ地点です。", [["1K", "今日のセーブ音", "名前を呼んで「○○さん、今日のログを保存しました」。"], ["5K", "一行のセーブ便り", "あなたが終えた作業を、一行のゲーム風お祝いに。"], ["10K", "作業のおとも一曲", "好みに合うゲームの曲を、聞きどころの場面と一緒におすすめ。"], ["20K", "今日のセーブ画面", "あなた宛てに「食器をしまった。宿屋に戻ります」などと読みます。"], ["30K", "名前入りセーブカード", "あなたの作業と好きな風景を、セーブ画面風の画像に。"], ["40K", "あなたの一分ゲーム散歩", "好きな風景をつなぎ、あなたが主役の小話を1分。"], ["48K", "○○さんの最終セーブ", "あなたを主人公に2分の夜の物語。名前入りセーブカード画像付き。"]]],

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'

function copyButton(label, name, target, {buttonText = label + 'をコピー', copyText} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しやメニューからコピーしてください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => field.remove(), {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    perk.tabIndex = -1;
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, {buttonText:'コピー'}));
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリーを見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = '紹介文';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(name, perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  actions.append(
    copyButton('ファミリー名', name, nameValue),
    copyButton('紹介文', name, description, {copyText})
  );

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
</html>
