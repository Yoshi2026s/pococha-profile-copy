<script>
const entries = [["rui_03", "るいです。帰りの電車で片耳だけイヤホンをつけて、歌枠や雑談を聴いてます。平成のJ-POPは、曲名より先に「これ、昔めっちゃ聴いた」が出るタイプ。\n\n外だとほぼ聴くだけ。家に着いたら一言書きます。枠で教えてもらった曲を翌朝に聴くのが楽しみで、再生リストは通勤用なのに夜の曲ばかりです。\n\n前に終電で、隣の人が窓に映る自分を見ながら、すごく静かにエアギターしてました。降りる駅が同じで、ホームでもまだ指が動いてた。なんとなく曲を当てたくなって、その人の指が止まるまで発車メロディーを聞き逃しました。"], ["初見じょうれん。", "「初見です！」って書いたら、まず過去の入室回数を確認されます。じょーれんです。どうも、また来ました。\n\n夕飯で抜けて、食べ終わったら戻ります。話題がひとつも進んでないと嬉しいし、なぜか全員が同じお菓子を探し始めてる日も好き。初めましての人には、今なんでみんな笑ってるのか説明したくなります。\n\n一度「初見さん、こんばんは！」って挨拶したら、返事が「昨日あんたと一時間しゃべったよ」でした。そうでした。しかも前の日も同じ挨拶をしてたらしい。次に会った日は向こうが先に「はじめまして」と言ってくれました。もうどっちも訂正しません(´▽｀)"], ["あずき＊", "あずきです🍡\n粒あん、薄い毛布、夜のゆっくりめな歌が好き。休日は和菓子屋さんの小さな箱を持って帰るだけで、帰り道が少し楽しいです。\n\n配信では聴いてる時間が多め。おやつの話だけは気づくと会話にいます。教えてくれるなら「おいしいよ」に加えて、どこのお店かも書いてもらえると喜びます。\n\n昔、祖母にもらった紙袋に、おまんじゅうが二つ入っていました。片方は自分用かと思って渡そうとしたら、「明日のあんたの分よ」と。帰って開けたら、片方だけ包み紙に小さく「明日」って書いてあった。翌日、急いで食べるのがもったいなくて、ちゃんとお茶をいれました。"], ["おちゃまる🍵", "お湯が沸いたら、だいたいこんばんはの時間です🍵\nおちゃでも、まるでも、呼びやすい方でどうぞ。\n\nほうじ茶と和菓子がある夜は機嫌がいいです。洗い物の途中で枠を開くので、急に黙ったら手が泡だらけだと思ってください。ご当地のお菓子は、名前を聞くだけでも楽しい。食べたことのない味を想像してます。\n\n前に奮発して買った茶葉を友人と飲み比べたとき、二人で「こっちは香りが上品だね」と真剣に語りました。飲み終わって見たら、相手のカップにも自分と同じほうじ茶を注いでました。友人は黙ってもう片方の急須を指さして、一言。「こちらが本日の新商品です」( ˘ω˘ )"], ["ぼると⚡", "９回裏、２アウト。まだランナーおる。こういう場面でようやく立ち上がる、ぼるとです。普段の雑談では省エネですが、勝負どころだけ急にコメントが増えます。\n\nスポーツはハイライトも見ます。けど、あの場面になるまで何があったかを聞く方が好きです。派手な得点の前に、ちゃんと仕事した選手の話ならいくらでも聞きたい。\n\nある試合で、自分だけ配信が少し遅れてました。家族が隣の部屋で先に叫んだので「結果言うな！」と叫び返したら、「足つっただけ！」と。その数秒後に本当に逆転が起きて、今度は二人同時に叫びました。その日いちばん気になったのは、結局どっちの足だったかです。"], ["たっぷりん🍮", "🍮 プリンは固め、カラメルは苦め\n🍮 新作は棚の前で一度迷ってから買う\n🍮 おやつの相談、夕食直後でも歓迎\n\n「ぷりん」で呼んでください。洗濯物をたたみながら歌枠を聴いて、懐メロが流れたら手が止まります。タオルを早くたためる日は、たぶん枠が静かだった日。\n\n前にごほうび用のプリンを冷蔵庫に隠したら、自分で隠し場所を忘れました。翌朝、野菜室から出てきたプリンを見て、家族が「昨日からここが高級デザート売り場になってる」と。よく見たら、その横に家族の分のシュークリームも隠してありました。お互い生活の知恵が同じでした。"], ["mira☾", "mira（ミラ）といいます。\n\n眠る前に、弾き語りや穏やかな雑談を聴きにきます。映画は席が明るくなるまで座っている方です。余韻が残って、そのあと誰かに一曲だけ渡したくなるような映画が好き。\n\nコメントを考えているうちに話題が変わることがあります。だいぶ前の話に返事をしていたら、そのまま軽く流してください。\n\n昔、映画で流れた曲が見つからず、友人に鼻歌を送りました。返事は「途中から別の曲になってる」。翌日、正解のリンクと一緒に、なぜか途中から混ざった曲の名前まで届きました。あの人、律儀なんです。今でも二曲続けて聴くと、笑ってしまいます。"], ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。謎解きやゲーム実況では、答え合わせの直前がいちばん好き。推理を聞かれたら長めに答えますが、見当違いだったときは「なるほど」とだけ言ってひっそり引き下がります(￣▽￣)\n\nこの前、脱出ゲームで仲間に「この椅子、絶対に何かある」と言い張りました。座面を裏返す勢いで調べていたら、係の方に「お疲れでしたら座って大丈夫ですよ」と。親切にされるほど引っ込みがつかなくて、とりあえず全員で一回ずつ座りました。もちろん何も起きませんでした。"], ["からあげレモン🍋", "晩ごはんのことを考えながら、晩ごはんの話を聞きに来ます。からレモです🍋\n\nラーメンの話を聞けばラーメンに変更。弁当に入れておいしかったおかずの話は、翌朝までちゃんと覚えてます。🍋だけ置いていくときは、たいてい笑ってるとき。お店の唐揚げなら、次の日に冷めても好きです。\n\n昔、みんなに「レモンかけていい？」って確認してから、思い切り絞った汁が自分の目に直撃しました。「うわ、痛っ」と叫んだ横で、友人が何事もなかったように唐揚げを一口。「うん、この一個だけめっちゃ酸っぱい」。被害が広がってなくて良かったけど、せめて水をください😂"], ["kohaku.", "こはくと申します。休日は、開店してまもない喫茶店で厚切りのトーストを食べます。まだ食器の音くらいしか聞こえない時間が好きです。\n\n家では本を開いて、歌や雑談を聴いています。耳に残った曲名は付箋へ。読み終わった本を久しぶりに開くと、内容と一緒にその頃の音楽まで思い出すことがあります。\n\n以前、通っていた店に久しぶりに寄ったら、帰り際に店主が「今日は本、お持ちじゃないんですね」と。店で本の話をした覚えはありませんでした。次の週は本を一冊持って行きました。たまたま目が合って、お互い少しだけ笑ったのをよく覚えています。"], ["ぴかまる⚡", "こんぴかー！⚡ 「ぴか」で呼んでね。\n早押しは得意！ ……と言いたいけど、送るのが早いだけです。誤字を見つけるのと引き返すのは遅いです。\n\n明るい歌枠、しりとり、急に始まる大喜利に出没します。朝に聴いたら一発で目が覚める曲、募集中。電車の中で笑わせてくる枠、悔しいけど何度でも行きます(≧▽≦)\n\n前にしりとりで、どや顔で「みかん」と送ったら一巡目で終了。みんなが「ん」から始まる言葉を必死で探してくれました。助かったと思ったら次は「だいこん」。枠主が笑いながら「ぴかは拍手係できる？」と。そこからは誰よりも仕事しました👏"], ["しりゅう_08", "しりゅう。夜にふらっといます。\n\nアニメは少し前の作品を見返しがちです。昔は退屈だと思って飛ばした回が、今になって一番好きだったりする。結末の話は観たか聞いてから。知らない作品のときは主題歌から入ることもあります。\n\n釣りもします。前にまったく釣れなかった帰り、魚屋でアジを買いました。袋を見た家族が「今日すごいじゃん」と。黙ってレシートを渡したら「よくこの大きさで揃ったよね。魚屋さんだから」と、その日の夕飯はやたら店への感謝が厚かったです。翌週からは出発前に「どっちに行くの？」と聞かれます。いや、まず海には行くよ。"], ["たいやき＠しっぽ派", "しっぽからいきます。先端のカリッとしたところが本番です。名前は「たいやき」「しっぽ」、その日の気分でどうぞ🐟\n\n商店街の寄り道と、元の話題を誰も覚えてないくらい脱線した雑談が好きです。枠では「それ何味？」から話に入りがち。カスタードは差し入れで喜ばれるけど、自分で買うならやっぱりあんこ。\n\n頭派の友だちと一匹を分けたとき「うまいこと分けよう」と任せたら、渡されたのが本当に先端だけ。向こうは胴体ごといただいてました。抗議したら「しっぽが好きって言ったでしょ」と正論をかまされた。以来、最初から二匹買ってます。今日は自分がしっぽを二つもらう番です。"], ["つきよみ☾", "ひと駅ぶん遠回りして帰る夜、雑談や歌を聴きます。歩く音と人の声が一緒に聞こえるくらいの音量が好きです。名前は「つき」だけで呼んでもらえれば。\n\n雨の日は傘をさしているので、返事は家に着いてから。話すことを考えていても、最後に聴いた曲のことを先に書く日があります。\n\n以前、大事な用事がうまくいかなかった晩に、よく通る道で歌を聴いていました。歌い終わった枠主が、ふつうの声で「今日はここまで。みんな、帰ったら寝ようね」と言っただけで、急に肩の力が抜けました。信号が変わるまで立っていて、帰ったら本当に、電気を消してすぐ寝ました。"], ["きのぴ。", "【出没】作業の合間、夕飯決めたくない時間帯\n【好き】舞茸の天ぷら、ゲーム、コメント欄の小ボケ\n【弱点】送信直後に見つかる誤字\n\nきのぴです🍄 ときどき話に混ざります。急に黙っても機嫌は通常です。手が空いたら、何事もなかったように戻ってきます。\n\nある日「おかえり」を「おかわり」と打ち、そのまま数日間「大盛りにする？」と聞かれ続けました。乗っかって「じゃあ漬物も」と返したら、別の人が「今日ないです」。枠主が一言、「うち、何屋だと思われてる？」。そのあと来た初見さんが「何がおすすめですか？」って聞いて、全員ちょっと困りました。"], ["こうめい＊", "問題が出ると、答えを考える前に出題者の狙いを考えます。こうめいです。そのまま答えていれば正解だったことがよくあります。\n\nボードゲームと歴史ものが好きです。慣れてる人同士の駆け引きも面白いけど、初めて参加した人が思いがけない手を選んで、卓がしんとなるところも好き。自分も一応、意見を聞かれたときだけしゃべるつもりです。\n\n昔、初参加の小学生に作戦を丁寧に伝えたら、黙って聞いたあと「でも、そこに置けば今勝てるよ」と。よく見たら本当にそうだった。「確認してたんだよ」と言い訳したら、「じゃあぼくの番も確認して」と返された。もう大人の顔で座るしかありませんでした。"], ["れん_07", "れん。邦ロックと弾き語りが好きです。特に、音源だと気づかなかったギターがライブではやけに良かった、みたいな話に弱いです。\n\n外では聴くだけで、家に着いたら「こんばんは」。帰り道に教えてもらった曲は、翌日の行きに聴きます。何度か聴いてから、やっぱりあの曲いいねと伝えられたら嬉しいです。\n\n昔、小さいライブハウスで機材が止まったとき、歌い手さんが客席に「ここだけ歌える？」って聞きました。最初は前の列の数人だけ。次の行から後ろの方も歌い出して、最後は歌い手さん本人が笑って歌えなくなった。今でもその曲を聴くと、機材が止まったところで少し待ってしまいます🎧"], ["じに＊", "「それ、どこの？」「どんな味？」\n配信でちょこちょこ質問してたら、たぶんじにです＊\n\n旅行の話から駄菓子の話にすべっていく雑談が好き。おすすめのお店は地図に保存するけど、行ったときのために短いメモも書くようにしてます。短すぎて役に立たないことがあります。\n\nある店のメモに「絶対また行く」とだけ残っていて、理由を思い出せず、もう一度行きました。味はおいしい。でも何か違う。駅まで歩いてようやく気づきました。店の先にあったたこ焼き屋が目当てだったんです。今はピンを直したかって？ たぶんあのへんに二つあります(・_・;)"], ["港レター_", "旅の話が好きな方へ。\n\n海沿いを歩くことと、出先でポストを探すことが好きです。みなとといいます。観光地の名前を聞くと、景色と一緒に「朝どこでパンを買うんだろう」と考えます。\n\n枠では知らない街の話が楽しみです。地図で見るだけの場所も多いですが、そこに住んでる人がどこで寄り道するか聞くと、急に行ってみたくなります。\n\n昔、自分宛てに旅先から絵はがきを送りました。疲れて帰宅した夜に届いて、裏には「明日の朝は港でパンを買う」とだけ。パンがおいしかったことより、明日のことを考えて書いた自分の字が、妙に遠くの人みたいに見えたのを覚えています。みなとより。"], ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ 懐メロとカラオケの十八番に反応します。\n\nドライブ用の曲も集めてます。行きは思わず音量を上げる曲。帰りは、窓を少し開けてゆっくり聴ける曲。昔の曲も最近の曲も、みんなの選び方を聞くのが好きです。\n\n友人とカラオケに行って、自信満々で入れた曲から知らない歌詞が出てきました。同じタイトルの別の曲です。友人がさらっと歌い切って拍手を浴びる横で、僕は手持ち無沙汰でタンバリンを鳴らしてました。後日「またあの曲入れてね」と頼まれたけど、あの曲はもう彼の持ち歌だと思ってます(￣ー￣)"], ["かんうどん🍜", "かけ、ちくわ天、ねぎ多め。寒い日だけカレーに浮気します🍜 「かん」で大丈夫です。\n\n夕飯を作りながら配信を聴いているので、返事は一拍遅れます。だしの話だけ、包丁を置くので早め。地元のうどんに何が乗ってるか聞くのが好きで、帰省でも旅行でもとりあえず一杯食べてみます。\n\nいつもの店で初めて「いつもので？」と聞かれ、覚えてもらえた嬉しさで即うなずきました。来たのはカレーうどん。記憶をたどると、前に白シャツで来てカレーを派手に飛ばした日がありました。帰り際「今日は黒い服で良かったね」と。覚えられてたの、そっちかい。"], ["土星わっか◎", "土星でも、わっかでも。星座は勉強中です。夜空に明るいものがあるとまず調べます。星だったら嬉しいし、飛行機だったらどこに行くのか気になります。\n\n「月と深海、どっちなら行ってみたい？」みたいな、正解のない雑談には長居します。今なら月です。窓側が取れなかったら最後まで迷うかも。\n\n昔、友人と流星を見に行って、一時間ほど粘りました。ようやく見えたと思って「あっ」と叫んだら、友人も一緒に「あっ」。やっと見られたねと喜んでいたら、友人のほうは近くの自販機に飲みたい缶があるのを見つけただけでした。会話が通じすぎて、帰りまで気づきませんでした。"], ["しろもち。", "毛布に入ってからこんばんは。しろもちです。\n「もち」だけで呼んでもらって大丈夫です。\n\nたくさん話す日と、静かにぬくぬく聴く日があります。翌朝「おはよう」から出直していたら、前の日はそのまま寝たんだと思ってください(-_-)zzz\n\nお餅はきなこ派。お雑煮は家ごとに違うところが好きです。前のお正月、家族が重そうなお椀を出してきて、底からお餅が三つ出ました。小さい頃は足りなくてよく文句を言ってたのを覚えていたらしい。今は三つだときついから半分残そうと思ったのに、結局きれいに食べました。翌日に「今日も三つ？」と聞かれて、その日は素直に一つにしました。"], ["いかいかが？", "いかです🦑 いかがですか、まで読んでくれるとちょっと嬉しい。\n\n水族館ではクラゲから離れられなくて、同行者に先の水槽で待ってもらうことがあります。雑談も行き先が分からない方が好き。天気の話から深海まで来たら、たぶん終わりまでいます。\n\n昔、水槽越しにエイへ手を振ったら、向こう側の通路にいた子が笑顔で振り返してくれました。こっちもそのまま何回か振ってたら、最後の最後で隣のお母さんまで振ってくれた。連れに「あの子、知り合い？」って聞かれて、「今なった」と答えました。肝心のエイがそのあとどこに泳いでいったかは見てません。"], ["ゆづる❄", "こんばんは。ゆづるです。\n\n温かいものをひと口飲んで、夜の歌枠を聴きに来ます。バラードは、最初の声が小さくて、自然に音量を上げたくなる曲が好き。曲のあとに短い感想だけ書くことがあります。\n\n昔、雪が少しだけ積もった朝に、出勤しようとしたら家の前だけ足元がきれいでした。隣のおじさんがついでに雪をよけてくれたと、帰ってから聞きました。何かお礼をしたくて次に雪が降った日に早起きしたら、おじさんがもう半分やっていて「せっかくだから一緒にやるか」と。寒かったはずなのに、何をしゃべりながら作業したかの方を覚えています。"], ["じゃっくん☆", "はーい参加します！ 何に参加するかは今から聞きます。じゃっくんです🙌\n\n実況、早押し、大喜利。誰かの一言に、みんなが一個ずつボケを足していく流れが好きです。コメントの「w」が多いほど、自分も隣の部屋に聞こえないよう必死です(≧▽≦)\n\n昔、友だちと対戦ゲームしてて「やった、勝った！」と叫びました。自分が見てたのはずっと友だちのキャラで、こっちは画面の端で壁に向かって走ってました。「声だけは完全に勝者だった」と言われて、それが一番おかしくて二人で床に座り込みました。次の対戦では、やっと自分のキャラを見つけた頃に試合が終わってました。"], ["さなだんご。", "さなです。だんごでも反応します。\n\n休日の午前中、パン屋さんへ。家まで我慢できる日は少ないです。料理の話では、何を作ったかより「何を入れたらおいしかった？」が気になります。歌枠なら、曲の前に昔の思い出を聞ける時間も好きです。\n\n昔、焼きすぎたクッキーを「焦げたとこはよけてね」と言って友だちに渡しました。あとで送られてきた写真は、クッキーが一枚も写ってない空っぽのお皿。その横に紙で「次は倍で」とありました。ちょっと嬉しくなって同じ型を出したんですが、次は気を抜いて焼く時間を間違えました。それ以来、渡すときは「今日の焼き具合チェックお願いします」と言ってます。"], ["ゆずっこ。", "ゆずです〜🍊\n夕方によくいます。家事しながら「おつかれ〜」とだけ書いて、また耳だけに戻ることも。拍手が並んでたら、しれっと一つ足す派です。\n\n散歩には、気づくと足が速くなる曲。お菓子は柑橘の季節限定に弱くて、味が気になると家まで待てません。\n\n前に限定のゆず味を求めて三軒回ったら、最寄りの店でレジ横に山積みでした。「今なら２個でお得」とあったので、二袋買って帰宅。開けたらゆずじゃなくて、ゆず胡椒でした。ちょい辛。悔しいから家族に「見つけたよ」とだけ渡したら、「探してたのこれでしょ」と本物を出してきた。同じ店で買ったそうです。"], ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。\n\n戦国の話は、合戦よりも、誰が誰にどんな手紙を残したかが気になります。猫の話は守備範囲広め。コメントが「かわいい」だけでも、だいたいちゃんと聞いてます(=^･ω･^=)\n\n以前、好きな武将を紹介する番組を家族と見てたら、一番いいところで猫がテレビの前に座りました。巻き戻したら、また同じ場所で座る。三回目はもう全員、武将より猫が来るかどうかに注目してました。結局その日は番組の話が全然できなかったけど、今でも家族の誰かが画面の前に立つと「参戦ですか？」と聞かれます。"], ["ぜうす_", "ぜうす。コーヒーは深煎り。呼び捨てで平気です。\n\n映画を見終わったあとの感想や、答えが一つに決まらない話が好きです。普段は聴いてるほう。考えてるうちに話題が変わって、そのまま返事を飲み込むこともよくあります。ゲームは見た目優先で装備を決めて、あとから性能をどう補うか考えます。\n\n前に友人と同じ映画を観て、帰りの電車でずっと「あの主人公、あそこで何を考えてたんだろう」と話してました。降りる直前、ようやく双方が別の人物を指してると判明。言われて画面を思い出してみると、どっちの解釈でもあの映画が一本成り立つのが、今でもちょっとモヤモヤします。"], ["りさっち＊", "りさっちです☺️ カフェではいつものメニュー。リップは新しい色も試してみたい。ドラマは観終わった日のうちに誰かと感想をしゃべりたい派です。\n\n配信を開くのは洗い物の途中が多め。「みんなだったらどうする？」って聞こえたら、一回手を拭いて書きに来ます。雨でも入りやすいカフェの話も歓迎です。\n\n以前、気に入ってるけど派手かなと迷っていたリップをつけた日、友だちに「今日、なんか顔が明るいね」って言われました。私からは何も話してなかったので、その一言が嬉しかった。あとで購入履歴を見たら、同じ色をすでに二本買ってました。どうやら迷っていたのは、つける勇気だけだったみたいです。"], ["ちょぱ丸_", "予定　コンビニまで往復10分\n結果　寄り道込みで30分\n買いに行ったもの　忘れた\n\nちょぱ丸です。アニメの話は長め。推しを一人に絞れと言われたら「今日の一人」で答えます。枠では最初に挨拶して、しばらく流れを聴いてます。\n\n前に道を聞かれて、自信満々に「この先です」と教えた数分後、自分が逆の道で迷いました。さっきの人と再会した瞬間「あ、違いました？」って相手の口から。二人で地図を開いたら同じ店が目的地で、そのまま一緒に着きました。店員さんに「お連れさまですね」と言われて、お互い否定するタイミングを失いました。"], ["敬語でラスボス🎮", "ようこそお越しくださいました。ラスボスとお呼びいただければ幸いです🎮\n\nゲームは終盤ほど寄り道が増えます。装備を揃え、回復も用意し、最後の扉の前でいったん休憩。配信では勝負の行方を皆さまと見守る時間が好きです。お気に入りのボス戦の曲がございましたら、ぜひお聞かせください。\n\nかつて決戦のために一時間ほど装備を整え、いざ突入した直後、足を滑らせて崖から落ちました。復帰してもう一度挑んだらまた落ちました。三度目は慎重に歩きましたが、そこで初めて橋が別にあると気づきました。なお、ボス戦は二分で終了しました。準備にかけた時間の使い道を今も考えております。"], ["simba_", "シンバです。景色が良ければ車を止めるし、曲が良ければ頭から聴き直します。先へ進むまでが長いです。\n\n雑談はだいたい飲み物片手に聴いてます。動物園の話になるとコメントが増えます。いちばん長くいるのはペンギンの前。腰を落として、水に入るか入らないか見てる時間が好きです。\n\n前に動物園で、知らない子がペンギンに「行ける、行ける」と小声で声援を送ってました。飛び込んだ瞬間、いちばん大きく拍手したのが隣のお父さん。振り向いたら通りすがりの大人まで数人のぞき込んでいて、みんななんとなく照れ笑いしてました。次の一羽が来たとき、誰も帰りませんでした。"], ["kuroha_", "夜。作業。イヤホン。\nくろはです。邪魔にならない音量で聴き始めて、気づけば一番おもしろいところで手が止まってます。\n\nゲームは背景と音楽が気になる方です。好きな曲が流れる場所では無意味にうろうろします。作業用BGMもゲームのサントラが多め。おすすめは曲名が分からなくても、どんな場面で流れるか聞けたら探します。\n\n昔のセーブを開いたら、最終決戦の手前だったはずなのに、わざわざ最初の村に戻ってました。そこで曲が流れた瞬間、学校から帰って急いでランドセルを下ろした頃の部屋を思い出しました。何で戻ったか忘れてたけど、たぶん昔もあそこで音楽を聴いてたんだと思います。"], ["まさむね_", "まさむねです。休日は城下町を歩いたり、道の駅で買い物をしたり。旅先の説明板を全部読みたいので、一緒に行った人をお待たせすることがあります。\n\n雑談枠では地元の定食屋の話や、もう一度行きたい町の話が好きです。観光のついでに食べるつもりが、次はその店だけ目当てに出かけることもあります。\n\n昔、城跡で説明板を読んでいたら、通った方に「何か見つけましたか」と声をかけられました。立ち話していたら、昔は同じ場所が子どもの遊び場だったそうで、「坂はここから滑ると速いんですよ」と。史跡を見に行って、帰りにはその人が滑り降りた坂ばかり目で追ってました。"], ["路面ベル♪", "まもなく、商店街のパン屋さんの前です。お降りの方はどうぞ♪\nベルと呼んでください。\n\n路面電車の窓から、お店の看板や買い物帰りの人が見えるのが好きです。旅先では目的地に着く前に写真がいっぱいになります。散歩中の返事は、渡り終わってから書くので少しのんびり。\n\n以前、雨の電停にいたら、知らない人が傘をそっとこっちに寄せてくれました。話したのは「もうすぐ来ますね」の一言だけ。降りるときに振り返ったら、その人が窓越しにちょこんと頭を下げてくれました。休日に撮った写真は何十枚もあるのに、いちばん思い出すのは、写真にないあの傘です☂️"], ["ねずち。", "すみっこ、空いてますか。ねずちです🐭\n初めはあいさつだけ。知ってるアニメやゲームが話題になったら、ひょこっとしゃべります。\n\nチーズのおやつをつまみながら枠を聴くことが多いです。誰かの笑い声につられて笑って、肝心の話の中身を聞き逃すこともあります。返事が遅いのは、だいたい食べてる間です。\n\n前に作業しつつ「今のわかる」とコメントしたら「え、実家でヤギ飼ってた話だけど」と返されました。一個前の話のつもりだったのに、初見さんに「ヤギって何食べるんですか？」と真剣に聞かれました。「ちょっと家族に確認します」と書いてから、我が家にいるのは金魚だけだと白状しました。"], ["いなりまる。", "晩ごはんを食べながら、明日の献立を決めてます。配信で飲食店の話になったら、何が乗ってたかまで聞くタイプ。「いなり」でどうぞ。\n\n好きな組み合わせは、だしのきいたうどんとおいなりさん。枠では夕飯後から少しずつしゃべります。初めて来た人も一緒に笑ってる雑談には、つい長居します。\n\n昔、お弁当のおいなりさんが一つだけ裏返しで入ってました。開けたら、小さい梅干し。帰宅して聞いたら「当たりを一個だけ入れたよ」と言われました。梅干しが苦手なのは、きれいに忘れられてました。でも次に同じお弁当が来た日、ひとつ裏返しになってないか探したのは覚えてます。"], ["はんこびより。", "今日のメモ\n□ 枠で聞いた曲をあとで探す\n□ 試し書きしてからペンを買う\n□ シールは家にある分を思い出す\n\nはんこです。ノートを開いたまま、夜の雑談をよく聴きます。書いてるうちに話題が変わるので、返事は少し遅いです。使い込んだペンや、ずっと手放せないノートの話が好きです ( ..)φ\n\n片付け中に出てきた昔のノート。気合いを入れて書いたらしい予定はどこも真っ白で、最後のページだけに「今日はよく寝た。明日もそうしたい」と一行ありました。もっといろいろ書けたはずなのに、その一行だけ残した自分がおかしくて、笑ってから久しぶりにその晩は早く寝ました。"]];

const icons = ["01-rui_03.png", "02-初見じょうれん。.png", "03-あずき＊.png", "04-おちゃまる🍵.png", "05-ぼると⚡.png", "06-たっぷりん🍮.png", "07-mira☾.png", "08-あてな°.png", "09-からあげレモン🍋.png", "10-kohaku..png", "11-ぴかまる⚡.png", "12-しりゅう_08.png", "13-たいやき＠しっぽ派.png", "14-つきよみ☾.png", "15-きのぴ。.png", "16-こうめい＊.png", "17-れん_07.png", "18-じに＊.png", "19-港レター_.png", "20-けんし♪.png", "21-かんうどん🍜.png", "22-土星わっか◎.png", "23-しろもち。.png", "24-いかいかが.png", "25-ゆづる❄.png", "26-じゃっくん☆.png", "27-さなだんご。.png", "28-ゆずっこ。.png", "29-のぶにゃがฅ.png", "30-ぜうす_.png", "31-りさっち＊.png", "32-ちょぱ丸_.png", "33-敬語でラスボス🎮.png", "34-simba_.png", "35-kuroha_.png", "36-まさむね_.png", "37-路面ベル♪.png", "38-ねずち。.png", "39-いなりまる。.png", "40-はんこびより。.png"];
const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const search = document.getElementById('search');
const resultCount = document.getElementById('result-count');
function normalize(value) { return value.normalize('NFKC').toLocaleLowerCase('ja'); }
function filterEntries() {
  const query = normalize(search.value.trim()); let count = 0;
  list.querySelectorAll('li').forEach(row => { const matches = !query || row.dataset.search.includes(query); row.hidden = !matches; if (matches) count++; });
  resultCount.textContent = count + '件表示' + (query ? ' / 全' + entries.length + '件' : '');
}
search.addEventListener('input', filterEntries);
document.getElementById('clear-search').addEventListener('click', () => { search.value = ''; filterEntries(); search.focus(); });
const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, value) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + button.textContent);
  button.addEventListener('click', async () => {
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const row = button.closest('li');
        const details = row.querySelector('details');
        const target = label === '名前' ? row.querySelector('.nickname') : row.querySelector('.profile');
        if (label === '本文') details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = label + 'を選択しました。長押しやメニューからコピーしてください。';
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

entries.forEach(([name, profile], index) => {
  const row = document.createElement('li');
  row.dataset.search = normalize(name + ' ' + profile);
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.append(copyButton('名前', name, name), copyButton('本文', name, profile));

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  row.append(header, actions, feedback, details);
  list.append(row);
});
filterEntries();
</script>
