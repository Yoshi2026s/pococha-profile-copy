<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<meta name="apple-mobile-web-app-title" content="ポコチャ文例集">
<link rel="apple-touch-icon" href="./app-icon-180.png">

<title>ポコチャ プロフィール・ファミリー文例集</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px;text-wrap:balance}
h1 span {white-space:nowrap}
.note {font-size:14px;line-height:1.55;color:#ddd8ee;margin:0 0 12px}
.search {margin:16px 0}
.search label {display:block;font-weight:bold;margin-bottom:6px}
.search-controls {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.search input {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:9px;font:16px system-ui}
.search input::-webkit-search-cancel-button {display:none}
.search button {padding:0 12px}
.search button:disabled {opacity:.55;cursor:default}
#search-status {margin:8px 0 0}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-identity {display:flex;align-items:center;gap:12px}
.family-name {min-width:0}
.family-image-button {display:block;flex:none;width:76px;padding:0;overflow:hidden;background:#373c53;color:#fff}
.family-image-button img {display:block;width:76px;height:76px;object-fit:cover}
.family-image-button span {display:block;padding:4px 0;font-size:12px}
.family-intro {margin:0}
.family .actions {grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-name-copy {background:#373c53;color:#fff}
.family-copy-field {display:block;width:100%;height:clamp(128px,35dvh,280px);margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:10px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-text {white-space:normal;overflow-wrap:anywhere;line-height:1.55;margin:0}
.perk-text strong {display:block;margin-bottom:2px}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
#icon-message:empty {display:none}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
dialog [hidden] {display:none}
.dialog-actions > :only-child,#icon-download[hidden] + button {grid-column:1/-1}
</style>
<h1><span>ポコチャ</span> <span>プロフィール・</span><wbr><span>ファミリー文例集</span></h1>
<p class="note">架空の100人の文例です。プロフィールは編集して、このブラウザーに保存できます。ファミリー説明は、紹介文と7段階のコア特典をまとめてコピーできます。</p>
<div class="search" role="search">
  <label for="entry-search">文例を探す</label>
  <div class="search-controls">
    <input id="entry-search" type="search" placeholder="名前・ファミリー名・話題" autocomplete="off">
    <button id="search-clear" type="button" disabled>クリア</button>
  </div>
  <p id="search-status" class="note" role="status"></p>
</div>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <p id="icon-message" class="note" role="status"></p>
  <img id="icon-preview" alt="" hidden>
  <p id="icon-help" class="note" hidden>iPhoneでは、画像を長押しすると写真に保存できる場合があります。</p>
  <div class="dialog-actions">
    <a id="icon-download" hidden>PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="manual-copy-dialog" aria-labelledby="manual-copy-title" aria-describedby="manual-copy-help">
  <h2 id="manual-copy-title">ファミリー説明を手動でコピー</h2>
  <p id="manual-copy-help" class="note">下の文章を長押しするか右クリックし、メニューから「コピー」を選んでください。</p>
  <textarea id="manual-copy-text" class="family-copy-field" aria-label="ファミリー説明とコア特典" readonly></textarea>
  <div class="dialog-actions">
    <button id="manual-copy-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "片耳に歌枠の歌声、もう片耳に「次は……」の車内放送。帰りの電車から、るいです。平成のJ-POPはサビならすぐ口ずさめます。曲名を思い出した頃には、配信ではもう二曲先。歌詞を追いきれなかった曲は、帰ってからゆっくり聴き直します。\n\n休みの日は、枠で教えてもらった曲をかけてひと駅ぶん歩きます。「二番のサビに入る前、ベース聴いてみて」。言われた場所に耳を澄ますと、聴き慣れた曲でも低い音がふっと近づきます。\n\nある日の終電。向かいの人がひざの上でエアギター。指の動きから曲を当てようと見入っているうちに、降りる駅に着いちゃいました。ホームで発車メロディーが流れて、つい「これ昔めっちゃ聴いた」。毎日のように聞くこのメロディーも、曲名は知らないんですけどね。", "片耳プレイリスト", "帰り道にかけたい曲を、一人一曲持ち寄りませんか。発車してすぐの一曲も、降りるひと駅前の一曲も。再生ボタンを押したくなるタイミングまで聞けたら、次の帰りに試してみます。", [["1K", "車掌風のお祝い", "配信で名前を呼び、車内放送風に「今日もおつかれさま」とお祝いします。"], ["5K", "帰り道のひと言", "帰り道に読んでほしいひと言に、名前を添えてファミリーに投稿します。"], ["10K", "名前入りきっぷアイコン", "表示名を入れた乗車券風のアイコンをお渡しします。"], ["20K", "帰り道の選曲リクエスト", "あなたの気分に合う一曲を選び、配信で聴きどころを紹介します。"], ["30K", "色を選べる終電セット", "選んだ色で、名前入りきっぷアイコンとスマホ壁紙を作ります。"], ["40K", "名前を呼ぶ車内放送", "配信で名前を呼び、今月の思い出を振り返ります。おすすめの二曲は車内放送風にご案内します。"], ["48K", "帰り道ラジオの主役", "お好きな曲調に合わせて、約5分のDJ風お礼番組をお届けします。名前入りきっぷアイコンと番組表画像もお渡しします。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」。ここまでがうちの挨拶。じょーれんって呼んでね。昔のJ-POPが流れたら、歌詞があやしくてもサビは一緒に歌うよ。パクチーの香りは苦手なので、そっと皿の端へ寄せます。\n\n週末は友だちとバドミントン。ダブルスで二人の間にシャトルがふわっと来ました。「任せた！」と二人の声がぴたりと重なりました。動かない二人の真ん中に、シャトルがぽとり。次こそ、先に「取るよ」って言います。\n\n枠で「初見さん、こんばんは！」と迎えたら、「昨日あんたと一時間しゃべったよ」とひと言。翌日、同じ人が「はじめまして」。今度は僕が「昨日ぶりですね」と返せました。コートでも、これくらいきれいに返したい。", "また来た初見席", "本当に初めての人も、「初見です」が口癖の人も大歓迎。途中から来たら「今、なんの話？」ってひと言で混ざってね。会長がじゃんけんで決まった話は、初めて聞く顔をしてくれたら何度でも。", [["1K", "昨日ぶりのお祝い", "配信で名前を呼んで、「初見さん、今日もありがとう！」と迎えます。"], ["5K", "おかえりメッセージ", "心に残ったやり取りを添えて、あなた宛てのお礼をファミリーに書きます。"], ["10K", "自称初見の名札アイコン", "表示名と「初見・認定○回目」を入れた名札風アイコンをお渡しします。"], ["20K", "肩書きのお披露目", "「初見のベテラン」などの候補から、お好きな肩書きを選べます。配信でお披露目します。"], ["30K", "来店認定カードとアイコン", "選んだ肩書きと表示名を入れた直筆風カードを、色違いのアイコンと一緒にファミリーへ投稿します。"], ["40K", "いつもの席のお礼トーク", "配信で名前を呼び、今月心に残ったコメントや助けてもらった場面を振り返ります。"], ["48K", "歓迎総会の主役", "選んでもらった話題で約5分おしゃべりし、お礼を伝えます。名前入りの会長名札風アイコンと認定カード画像もお渡しします。"]]],
  ["あずき＊", "あずきです🍡 おまんじゅうを割って粒あんがのぞくと、うれしくなります。包み紙まで好みの柄だったら、しわを伸ばして缶にしまいます。\n\n冬はフィギュアスケート観戦が楽しみ。着氷までつい息を止めちゃいます。長い距離を走る番になると、タイムを測られるだけでそわそわします。\n\n祖母がおまんじゅうを二つくれた日、一つ差し出して「おばあちゃんも食べる？」と聞いたら、「それは明日のあんたの分よ」。その包み紙の端に、小さく「明日」と書いてあったんです。\n\n今も二日に分けるつもりで、おまんじゅうを買うんです。その日のうちに箱を開け直したら、二つ目も「味見の続き」です。自分で包みに「明日」と書いても、おばあちゃんの字ほどは効きません。", "粒あんと夜のお茶", "夜のお茶とおやつをお供に、歌とおしゃべりを🍡 「粒がごろっとしてた」「包み紙が好きで選んだ」など、おすすめのお菓子を聞かせてください。お茶をいれ直したら、話の途中からどうぞ。", [["1K", "湯のみでお祝い", "配信で名前を呼んで、「お茶、あなたの分もいれました」とお迎えします。"], ["5K", "明日の包み紙メッセージ", "翌日に読み返したくなるお礼のひと言を、名前を添えてファミリーに投稿します。"], ["10K", "和菓子の包み紙アイコン", "小豆色の包み紙をイメージしたアイコンに、表示名を入れてお渡しします。"], ["20K", "おやつ選びリクエスト", "あんこ派かきなこ派かを聞き、配信で和菓子とお茶の組み合わせを一つ紹介します。"], ["30K", "おそろいの甘味柄", "選んだ和菓子を柄にして、名前入りアイコンとおそろいのスマホ壁紙を作ります。"], ["40K", "あなたのお茶会トーク", "配信で、あなたに似合いそうな和菓子を一つ見立てます。名前を呼んで今月のお礼も伝えます。"], ["48K", "あずきの甘味お礼会", "好きなおやつを話題にした約5分のお茶会です。名前入りアイコンと、ひと言入りの甘味カード画像もお渡しします。"]]],
  ["おちゃまる🍵", "お湯が沸いたら、こんばんは。おちゃでも、まるでもどうぞ🍵 好きな組み合わせはほうじ茶と焼き芋。並べて撮るつもりが、カメラを構える頃には僕の湯のみはもう空です。\n\n友人と二種類のほうじ茶を飲み比べた日のこと。二杯目を出したら、友人が「こっちのほうが香りが上品だね」。急須を見て気づきました。二杯とも、僕が同じほうから注いでました。\n\n今度こそ、もう一つの急須から。「あ、焼き芋の香り」。そのとき僕の手には、割ったばかりの焼き芋。\n\n次に飲み比べるときは、急須に印をつけます。枠でぱたっと返事が途切れたら、たいてい台所です。湯のみをすすいだら戻ります。", "ほうじ茶の間", "いれたてのお茶と、お茶うけの話をする席です🍵 熱いうちと、少し冷めてから。どっちが好みか聞かせてください。聞くだけの方にも、湯のみを一つ置いておきます。", [["1K", "ほうじ茶の間のお祝い", "配信で名前を呼んで、「湯のみ、置いときました」と迎えます。"], ["5K", "お茶うけのひと言", "今のあなたに届けたいひと言を、名前を添えてファミリーに書きます。"], ["10K", "ほうじ茶ラベルアイコン", "ほうじ茶の袋のラベル風に、表示名入りのアイコンを作ります。"], ["20K", "お茶うけリクエスト", "好きなお菓子に合うお茶を一つ選び、配信でその理由と一緒に紹介します。"], ["30K", "色が選べる茶席セット", "茶色か生成りから選べます。その色で、名前入りアイコンと湯のみ柄のスマホ壁紙を作ります。"], ["40K", "ほうじ茶のいれ方とお礼", "配信でほうじ茶のおすすめのいれ方を一つ紹介します。名前を呼んで今月のお礼も伝えます。"], ["48K", "あなたのお茶会コーナー", "好きなお茶を題材に約5分の飲み比べトークをします。名前入りアイコンと茶席カード画像もお渡しします。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。ここで座ってられへん、ぼるとです⚡ 選手の自伝は、逆転打の直前で読む手が止まります。あの打席へ向かう途中、何を考えてたんやろ。自分のジョギングは、三分走ったら歩きに切り替え。ペース配分は研究中。\n\n中継前はお茶をいれて、スマホの速報はオフ。隣の部屋から「うわっ！」と聞こえた日。「結果言うな！」と返したら「足つっただけ！」。数秒遅れの中継を観て、今度は僕が「うわっ！」。隣からは「ああ、それはもう見た」のひと言。\n\n試合後、こぶしをマイクに見立てて隣の部屋へ。「あの瞬間、何があったんですか？」「足の指がつりました」。これが、うちの最速速報でした。", "九回裏の応援席", "逆転打の話は、粘って塁に出た選手から⚡ 野球を観ていない日も、あなたの今日の好プレーを聞かせてください。話の途中なら「今、何回？」のひと言でどうぞ。", [["1K", "応援席からナイスコア", "配信で名前を呼び、「ナイスコア！」と拍手します。"], ["5K", "今月の好プレー便り", "助けてもらったことや、場を盛り上げてくれたひと言を、名前を添えてファミリーで紹介します。"], ["10K", "背番号入り選手アイコン", "名前とお好きな背番号を入れた選手カード風のアイコンをお渡しします。"], ["20K", "あなたの一打を実況", "最近うれしかったことを一つ、配信で逆転打さながらに実況します。"], ["30K", "チームカラーの応援セット", "お好きな色で、名前と背番号を入れたアイコンとスマホ壁紙を作ります。"], ["40K", "九回裏のお礼インタビュー", "配信で、今月のあなたの好プレーに感謝を伝えます。あなたからの質問にも一つ答えます。"], ["48K", "ヒーロー特番の主役", "選んだ話題で約5分の野球風お祝いトーク。名前入り選手アイコンとヒーローカード画像もお渡しします。"]]],
  ["たっぷりん🍮", "ぷりんです🍮 プリンは固め、カラメルは苦め。昭和歌謡が流れると手が止まります。たたみかけのタオルは、曲が終わるまで膝の上。手順の多いレシピは読んでるうちにお腹がすくので、新作のおやつは買う派です。\n\nプリンを食べていた晩、ずっと探していた曲が偶然流れました。あれから大事な日の前夜は、お守り代わりにプリンを一個、冷蔵庫へ。「カラメルは最後のお楽しみ」と言いながら、三口目にはもう全部混ぜてます。\n\n内緒でプリンを隠して、自分でも場所を忘れたことがあります。野菜室で見つけてくれたのは家族。さらに奥には、ほかの家族がしまったシュークリームまで。「ここ、高級デザート売り場？」 今も野菜室を開けると、野菜より先に奥をのぞきます。", "固めプリン同好会", "固め派もとろとろ派も、同じテーブルへ🍮 カラメルは何口目で混ぜますか？ 今日のおやつの話も聞かせてください。昭和歌謡が流れたら、おしゃべりは一曲ぶんお休みです。", [["1K", "スプーンを掲げてお祝い", "配信で名前を呼び、プリン用のスプーンを掲げてお祝いします。"], ["5K", "カラメルを添えたお礼", "「カラメルは最後のお楽しみ」など、ぷりんらしいひと言を添えてファミリーにお礼を書きます。"], ["10K", "名前入りプリンアイコン", "表示名入りのプリンラベル風アイコンをお渡しします。"], ["20K", "おやつトークのリクエスト", "好きなプリンか懐メロの思い出を聞かせてください。配信でその話をします。"], ["30K", "固め・とろとろ画像セット", "固め・とろとろから選んだデザインで、名前入りアイコンとおやつ柄の壁紙を作ります。"], ["40K", "プリン部のお礼放送", "配信で、選んでもらったおやつについて話します。名前を呼んで今月のお礼も伝えます。"], ["48K", "新作プリンのお祝い回", "選んだ味から新作プリンを考える、約5分のお礼トークです。名前入りラベルアイコンと直筆風コメント画像もお渡しします。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、弦をすべる指の音まで聞こえる弾き語りを聴きます。早押しクイズはちょっと苦手。私が「あ、分かった」と思う頃には、もう次の問題です。\n\n映画の日は月柄のハンカチを持って出かけます。帰ったら、耳に残った音を一つだけメモします。たとえば「廊下の靴音」。その一行を読み返すと、遠ざかる背中まで浮かぶことがあります。\n\n劇中で流れた曲の題名が分からず、鼻歌を録って友人に送ったことがあります。「途中から別の曲になってる」と返事が来て、翌日には二曲とも題名を教えてくれました。聴き比べれば違いはすぐ分かります。私の鼻歌の中では、最後まで一曲でした。", "余韻のひと席", "夜は弾き語りを聴いたり、映画のあとも耳に残る音の話をしたり。「あの廊下の靴音が好き」の一言からどうぞ。映画の結末は伏せてください。聴くだけの夜も、一曲ぶん座っていきませんか。", [["1K", "月の席からお祝い", "配信で名前を呼び、「今夜もこの席で、ありがとう」とお祝いします。"], ["5K", "余韻を残す一行", "心に残った会話に触れながら、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "月明かりの壁紙", "月と映画館の灯りを描いた、表示名入りのスマホ壁紙をお渡しします。"], ["20K", "余韻のお題リクエスト", "好きな音や曲調を聞いて、好みに合いそうな映画か曲を一つ、配信で紹介します。"], ["30K", "夜色のポスターセット", "お好きな夜の色で、名前入りアイコンと映画ポスター風の壁紙を作ります。"], ["40K", "眠る前のお礼朗読", "今月の思い出を短いお礼の手紙にまとめ、名前を添えて配信で朗読します。"], ["48K", "今夜の上映後トーク", "あなたのお題で約5分、雑談とお礼の朗読をします。名前入りアイコンとポスター画像もお渡しします。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは。あてなです。\n\n伊沢拓司さんが出るクイズ番組を観ると、正解を聞いたあとも「あの人、どこで気づいたんだろう？」と考えてしまいます。謎解きには青いペンを一本。通った道を思い出して見取り図を描くのが得意です。ヒントは、どうにも進めなくなったときにだけお願いします。\n\nある脱出ゲームでは、部屋の見取り図に椅子の位置まで書き込みました。立ったまま「この椅子、絶対怪しい」とメモしていたら、係の人に「どうぞ座って休んでくださいね」と声をかけられました。\n\n青いペンで、椅子の印の横に「座ってよし」と書き足しました。この日の推理は外れ。見取り図には休憩場所が一つ増えました。", "仮説だらけの作戦室", "謎解きの作戦会議は「実際に何を見た？」から。気になったところを聞かせてくれたら、次の手がかりが見つかるかも。外れた仮説も、聞くだけの参加も歓迎です。答えが浮かんだら、まず「ヒント要る？」と聞いてね。", [["1K", "作戦室からのお祝い", "配信で名前を呼んで「新メンバー発見！」。コア達成をお祝いします。"], ["5K", "作戦メモのお礼", "印象に残ったコメントを一つ選び、お礼を添えてファミリーの作戦メモに残します。"], ["10K", "名前入り探偵アイコン", "虫眼鏡と青いペンを描いた探偵風アイコンに、表示名を入れてお渡しします。"], ["20K", "なぞなぞのお題リクエスト", "選んでもらった題材で短いなぞなぞを一問作り、配信で出題します。"], ["30K", "色を選べる探偵セット", "選んでもらった色で、名前入りアイコンと探偵証風の画像を作ります。"], ["40K", "あなたのお題で謎解き二問", "あなたが選んだ題材で、配信中に謎解きを二問出します。最後は名前を呼んでお礼を伝えます。"], ["48K", "名探偵の出番", "あなたが選んだテーマで約5分の謎解きとお礼。名前入りアイコンと解決記念カード画像もお渡しします。"]]],
  ["からあげレモン🍋", "からレモです🍋 冷蔵庫を開けて、晩ごはんが決まらないまま閉める。そんな日は枠で「今日、何食べた？」と聞いてます。手書きのお品書きに唐揚げを見つけたら、もう迷いません。\n\n友人と大皿を囲んだ日。「レモンかけていい？」と聞くまでは満点。いざ絞ったら、汁がぴゅっと自分の目に。目を洗って戻ると、友人は「めっちゃ酸っぱい」と言いながら唐揚げをもう一個。今は自分の小皿にだけ、そっと絞ります。\n\n合いの手の多い曲がかかると、つい声が出て、話を聞き逃します。曲が終わるのを待って、「で、唐揚げがおいしい店、どこだっけ？」", "ひと絞り食堂", "いらっしゃい、ひと絞り食堂です🍋 商店街の定食や、冷めてもおいしいお弁当のおかず。今日は何がおいしかったですか？ 最初のひと言は「衣はカリカリ派！」だけでも。しっとり派もお待ちしてます。", [["1K", "レモンひと絞りのお祝い", "配信で名前を呼び、「拍手、レモンひと絞り分！」とお祝いします。"], ["5K", "食堂のお礼メモ", "今月のお礼を食堂のメモに書き、表示名を添えてファミリーに投稿します。"], ["10K", "レモン食堂の名札アイコン", "唐揚げとレモンのお品書き風アイコンに、表示名を入れてお渡しします。"], ["20K", "今夜の副菜リクエスト", "好きなおかずを一品教えてください。それに合う副菜を配信で提案します。"], ["30K", "ひと絞りの画像セット", "レモン色か唐揚げ色を選べます。名前入りアイコンと手書き風のお品書き画像を作ります。"], ["40K", "好きなおかずで献立会議", "好きなおかず二品をもとに献立を考え、配信で名前を呼んでお礼を伝えます。"], ["48K", "ひと絞り食堂の主役席", "選んだ料理をもとに、約5分の献立会議。お礼に名前入りアイコンとお品書きカード画像をお渡しします。"]]],
  ["kohaku.", "こはくです。休日の朝は、開店直後の喫茶店へ。ピアノの音に交じって、カップが受け皿に触れる音がします。後ろに列ができると焦るので、席でゆっくりメニューをめくれる店が落ち着きます。ひと通り迷って、今日も厚切りトーストです。\n\n本のカバーは包装紙で折ります。配信で耳に残った曲名を付箋に書いて、折り返しにぺたり。久しぶりに本を開くと、読みかけのページより先に、あの晩の歌が浮かびます。\n\nある朝、本を忘れて行ったら、店主が「今日はお持ちじゃないんですね」。窓辺で読んでいたのを覚えてくれていたんだ。翌週は本を持っていつもの席へ。トーストを置いた店主が本をちらりと見て、それから目が合いました。笑ったのは、たぶん同時です。", "付箋のある喫茶室", "好きな本の一場面に一曲だけ流すなら、何にしますか。「このページにだけ付箋を貼った」から始まる話も、ゆっくり聞かせてください。今日は聴くだけなら、どうぞ窓側へ。", [["1K", "窓側の席でお祝い", "配信で名前を呼び、「いつもの窓側、空いています」とお迎えします。"], ["5K", "こはくの一行しおり", "心に残ったあなたのひと言にお礼を添え、ファミリーに書き残します。"], ["10K", "付箋柄の名前入りアイコン", "付箋と厚切りトーストを描いたアイコンに、表示名を入れてお渡しします。"], ["20K", "読書のおともリクエスト", "好みを聞いて、次に読む本か読書中に聴く曲を一つご紹介します。"], ["30K", "選べる喫茶のしおりセット", "好きな色を選べます。名前入りアイコンと、ひと言を添えたしおり画像を作ります。"], ["40K", "あなた宛ての喫茶朗読", "今月のお礼を喫茶店の小話にして、名前を添えて配信で読み上げます。"], ["48K", "あなたのお題で喫茶朗読会", "選んだお題で約5分の朗読とお礼。名前入りアイコンと、小話の一節を載せたしおり画像も作ります。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかって呼んでね。サンドウィッチマンのコントは、話がかみ合わなくても二人とも真顔。そこが好きです。早口言葉は一回やって、すぐ見学に回りました。\n\n枠のしりとりで真っ先に「みかん」と答えて、一手で終了。「仕切り直し！」で今度は「だいこん」。また「ん」です。枠主に「ぴか、拍手係お願い」と言われて、すかさず👏。👏なら「ん」で終わらない！\n\n大喜利で好きな答えが来たら、すぐ「それ好き！」。自分の答えは、真顔で言っているところまで想像してほしくて、言い回しを考え込みます。送ろうとした瞬間、枠主が「次のお題です！」。結局、今日も真っ先に送ったのは👏。", "ぴかっと早押し部", "こんぴかー！⚡ 早押し、しりとり、ときどき大喜利。初参加なら、好きなボケに👏を一つ送るところから。早押しでつい先走ったら、ぴかと一緒に「もう一回お願いします！」", [["1K", "こんぴかのお祝い", "配信で名前を呼び、「小さめ落雷！」の掛け声で勢いよく拍手します。"], ["5K", "一文字だけ変な祝辞", "ファミリーにお礼を書きます。名前は正しく、祝辞は一文字だけわざと間違えます。"], ["10K", "稲妻の早押しアイコン", "稲妻と早押しボタンを描いたアイコンに、表示名を入れます。"], ["20K", "クイズ・大喜利のお題リクエスト", "あなたが選んだお題で、配信中に早押しクイズか大喜利を一問出します。"], ["30K", "拍手係の記念セット", "稲妻の色を選んでもらい、名前入りアイコンと「拍手係」の賞状画像を作ります。"], ["40K", "ぴかの一人二役大喜利", "配信であなたのお題をぴかが出して、自分で答えます。名前を呼んでお礼も伝えます。"], ["48K", "あなた杯・大喜利特番", "あなたが選んだお題で約5分の大喜利。名前入りの優勝賞状画像と早押しアイコンもお渡しします。"]]],
  ["しりゅう_08", "しりゅうです。アニメを見返すときは、脇役を一人決めて目で追います。一周目では黙っていたように見えた人が、実は何か言いかけていたりします。対戦ゲームでも相手の動きを見すぎて、自分の反応は一拍遅れます。\n\n初めてアジを三尾釣った日の帽子は、今も釣りのお守りです。一尾も釣れなかった日は、魚屋でアジを二尾買って帰りました。袋をのぞいた家族が「今日すごいじゃん」。黙ってレシートを渡したら「そりゃ大きさもそろうわけだ」。\n\n今はその帽子を手に取るたび「海と魚屋、今日はどっち？」と聞かれます。まず海です。あの日の釣果ノートには「アジ、ゼロ」。レシートには二尾。", "夜釣りとアニメ棚", "何も釣れなかった夜の海も、アニメを見返して気づいた脇役の表情も、ここでは話の種。釣りをしない人も、次に観たい一作を聞かせてください。結末の話は、ひと声かけてから。", [["1K", "夜釣りの大物コール", "配信で名前を呼んで「今日の大物、来ました」とお祝いします。"], ["5K", "釣果メモのお礼", "印象に残ったやり取りを一つ選び、釣果メモに見立ててファミリーにお礼を書きます。"], ["10K", "釣り帽子の記念アイコン", "いつもの釣り帽子を絵にして、表示名入りのアイコンを作ります。"], ["20K", "今夜のアニメリクエスト", "好みの雰囲気を聞いて、合いそうなアニメを一作紹介します。結末は伏せます。"], ["30K", "夜の波色アイコンセット", "選んだ夜の波の色で、名前入りアイコンと釣果カード画像をお渡しします。"], ["40K", "脇役の見どころトーク", "好きなアニメを一作聞き、配信で脇役の見どころを紹介します。結末には触れません。"], ["48K", "夜釣りとアニメの主役回", "釣りかアニメを選んで、約5分のお礼トークをします。名前入りアイコンと釣果図鑑風カード画像も作ります。"]]],
  ["たいやき＠しっぽ派", "たい焼きは、しっぽから🐟 「たいやき」でも「しっぽ」でも、好きなほうで呼んでください。商店街では、軒先の看板を一枚ずつ眺めて歩きます。バスケ中継でも、視線はコートの端へ。パスを待つ選手をつい目で追います。\n\n辛いものは、食べ進めると辛さしか分からなくなります。辛党の友だちとは、甘味屋で待ち合わせます。\n\nこの前、その友だちに「たい焼き半分こしよ」と誘われて手を出したら、もらったのはしっぽの先がひとかけ。「好きって言ってたでしょ」と友だち。うん、あんこが詰まった真ん中も好きです。\n\n今はあんことカスタードを一匹ずつ、同じ袋に入れてもらいます。どっちを引くかは、ひと口目のお楽しみ。次の半分こは、私が真ん中で割る番です。", "しっぽから商店街", "散歩で見つけたお店や、商店街のおやつの話でひと休み🐟 頭派もしっぽ派も、たい焼きに詰めてみたい具を教えてね。甘いものも、おかず系も大歓迎です。", [["1K", "しっぽからお祝い", "配信で名前を呼び、「今日の一匹、しっぽからどうぞ」とお祝いします。"], ["5K", "しっぽからお礼便", "あなたの名前と印象に残ったひと言を添え、ファミリーにお礼を投稿します。"], ["10K", "たい焼き袋のアイコン", "たい焼きの紙袋をイメージしたアイコンに、表示名を入れます。"], ["20K", "たい焼きの具リクエスト", "食べてみたい具を聞き、その具を使った架空のたい焼きに配信で名前をつけます。"], ["30K", "あんこ色かカスタード色", "選んだ色で、名前入りアイコンとたい焼き柄の壁紙を作ります。"], ["40K", "おやつで商店街トーク", "配信で好きなおやつについて話し、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作たい焼きのお披露目", "選んだ具を題材に、配信で約5分お話ししてお礼を伝えます。名前入りアイコンと手書き風のメニュー画像も作ります。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでもどうぞ。夜の帰り道は、ひと駅ぶん遠回りします。足音が聞こえるくらいの音量で歌や雑談を聴き、街灯と店の看板を目印に歩きます。歩数は気にせず、目に留まったものの前で足を止めるくらいがちょうどいいです。\n\n用事が片づかなかった夜も、帰りに配信を聴いていました。一曲歌い終えた枠主さんが「みんな、帰ったら寝ようね」と言うので、家に着くなり布団に入りました。翌朝、前の晩に手が止まった用事をひとつ片づけられました。\n\n雑談で話題に迷ったら「そっち、月見える？」。「こっちは曇り」と返ってくる日も、その人が見上げた空を想像してから、また歩きます。", "月夜の遠回り", "帰り道や寝る前に、夜の歌を一曲。今日ふと目に留まった色があれば、どこで見たかも聞かせてください。歩いている間は聴くだけでどうぞ。返事は家に着いてからで大丈夫です。", [["1K", "遠回りのおかえりコール", "配信で名前を呼び、「おかえり、今夜も遠回り？」とお祝いします。"], ["5K", "月夜のお礼メッセージ", "今日の空の色を添えて、ファミリーに名前入りのお礼を投稿します。"], ["10K", "街灯と三日月のアイコン", "街灯と三日月を描いたアイコンに、表示名を入れます。"], ["20K", "帰り道の選曲リクエスト", "今の気分や好きな夜景に合わせて、夜道に似合う一曲を配信で紹介します。"], ["30K", "夜空の色を選べるセット", "選んだ色で、名前入りアイコンと月明かりのスマホ壁紙を作ります。"], ["40K", "夜景のお礼朗読", "好きな夜景を題材にお礼を書き、配信で名前を添えて朗読します。"], ["48K", "遠回りの月夜便", "選んだ夜景について配信で約5分語り、お礼を朗読します。名前入りアイコンと、朗読の一文を載せた壁紙も作ります。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間に配信をのぞきます。急にコメントが止まったら、たぶん両手がふさがってます。手書きの看板は、値段を直した跡まで見ます。バレー観戦でも、点数は手書きです。時間制限つきのパズルは、残り秒数を見たとたん、答えが飛びます。\n\nある日、「おかえり」と打ったつもりが「おかわり」。それから顔を出すたび、「大盛りにする？」と声がかかります。私も「漬物つけて」と乗っていたら、初めて来た人に「おすすめは？」と聞かれました。さっきまでにぎやかだったのに、全員ぴたりと黙りました。\n\n次は「舞茸の天ぷらです」と答えます。看板には品名まで書きました。値段はまだ空欄。「いくら？」って聞かれたら、たぶんまた黙ります。", "おかわり休憩所", "作業の合間にひと息🍄 ゲームの進み具合でも、送ってから気づいた誤字の話でも。休憩がてら聞かせてください。「おかわり」と打っても、ちゃんと「おかえり」って返します。", [["1K", "コア達成をセーブ", "配信で名前を呼んで、「コア達成、セーブしました！」とお祝いします。"], ["5K", "おかわりの一行お礼", "心に残ったコメントを一つ添えて、ファミリーに名前入りのお礼を投稿します。"], ["10K", "セーブ画面風アイコン", "ゲームのセーブ画面をイメージして、表示名入りのアイコンを作ります。"], ["20K", "今日のおかわり任務", "あなたが選んだ雑談のお題で、配信中に短い「休憩クエスト」に挑みます。"], ["30K", "任務名入りの画像セット", "ゲーム風の配色を選べます。その色で、名前と任務名を入れたアイコンとセーブ伝票の画像を作ります。"], ["40K", "あなた発の休憩ステージ", "あなたが選んだお題で、配信中にミニ企画を一つ行います。クリアしたら、名前を呼んでお礼を伝えます。"], ["48K", "クリア記念のおかわり回", "配信で約5分のゲーム風企画を行い、お礼を伝えます。名前入りアイコンと、任務名を載せたクリアカード画像も作ります。"]]],
  ["こうめい＊", "こうめいです。歴史小説を読みながら、負けた側がそのとき何を考えていたかをつい想像します。ボードゲームの説明書には、遊んだ日を書いた付箋を一枚ずつ。早押しクイズでは、出題者の狙いを考えているうちに隣から正解が聞こえます。\n\nボードゲームで小学生と対戦した日。次の一手を得意げに解説していたら、その子が盤面を指して「僕の番だよね。ここに駒を置けば勝ちだよ」。私が「それを確認してたんだよ」と強がると、「じゃあ僕の番も確認して」と返されました。その日は、負けた側の気持ちが身にしみました。\n\nそれから座右の銘は「作戦より先に盤面を」。お風呂が先か、ごはんが先か。家の作戦会議も、最近はごはんが冷める前に決着をつけています。", "一手先の円卓", "ボードゲームの一手も、歴史の分かれ道も。「自分ならどうする？」から始まる円卓です。駒の動かし方を聞くだけでも大丈夫。私が作戦を長々と語りだしたら、「そろそろ次の手」と声をかけてください。", [["1K", "円卓にお迎え", "配信で名前を呼んで、「本日の作戦会議へようこそ」とお祝いします。"], ["5K", "軍師の一行お礼", "今月の気配りや面白かったひと言を添えて、ファミリーに名前入りのお礼を投稿します。"], ["10K", "盤面と駒のアイコン", "盤面と駒を描いたアイコンに、表示名を入れます。"], ["20K", "軍師のお題リクエスト", "日常の迷いごとを一つ聞いて、配信で軍師になりきり、作戦を考えます。"], ["30K", "選べる陣営カラー", "選んだ色で、名前入りアイコンと作戦図風の記念カード画像を作ります。"], ["40K", "円卓の好プレー表彰", "助けてもらった場面や心に残ったひと言を振り返り、配信であなたの一手をたたえます。"], ["48K", "円卓の作戦会議", "日常の相談か歴史をお題に、配信で約5分の作戦会議を開いて、お礼を伝えます。名前入りアイコンと軍師の感謝状画像も作ります。"]]],
  ["れん_07", "れんです。ライブハウスでは、後ろの端が定位置です。肩がぶつからない場所だと、落ち着いて聴けます。冬の開演待ちには、ホットコーヒーで手を温めます。奥田民生さんの曲では、歌のすき間で鳴るギターについ耳が向きます。中古CD屋で気になる曲を見つけたら、曲名をメモ。帰り道に聴きます。\n\nある晩、ボーカルが客席にマイクを向けると、前の列から歌声が広がりました。後ろにいた僕も、気づけば歌っていました。ボーカルは、客席をうれしそうに見渡しているうちに、自分が歌に戻るタイミングを逃して照れ笑い。今もあの曲を聴くと、同じところであの日の客席の声が混じる気がします。\n\n枠でも、挨拶のあとはたいてい聴くほうです。誰かが「ここの間奏、いいよね」と言うまでは。", "ギターが鳴る後列", "ライブ帰りのメモに一場面だけ残すなら、どこですか？ 後ろまで響いたギターや、客席が息をのんだ瞬間を聞かせてください。家でつい巻き戻す間奏の話からでも。", [["1K", "後列まで届くお祝い", "配信でライブのMC風に名前を呼び、「後ろまで届いてます！」とお祝いします。"], ["5K", "ライブ半券のひと言", "今月の思い出を一つ添えて、ファミリーに名前入りのお礼を書きます。"], ["10K", "ギターと半券のアイコン", "ギターとライブ半券の絵に表示名を入れたアイコンをお渡しします。"], ["20K", "聴きたい音リクエスト", "好きな楽器を聞いて、その音がよく聴こえる一曲を、聴きどころと一緒に配信で紹介します。"], ["30K", "ライブカラーの画像セット", "選んだ差し色で、名前入りアイコンとおすすめの二曲を載せた半券画像を作ります。"], ["40K", "終演後のお礼MC", "選んでもらった音楽のお題で、配信中に終演後のMC風トークをします。名前を呼んで、今月のお礼も伝えます。"], ["48K", "アンコールのミニトーク", "希望の選曲テーマで約5分のお礼トーク。名前入りアイコンとセットリスト画像もお渡しします。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」。食べ物の話になったら、まずこの二つ。じにです＊ 日村勇紀さんがうまそうに食べるのを見ると、こちらまで何か買いに出たくなります。一軒でお腹を満たしたら、近所をぶらぶら。気になる場所を見つけたら、地図にピンを立てます。\n\nある日、地図で「絶対また行く」とメモしたピンを頼りに、前に食べたたこ焼きを目指しました。店に入って品書きを開くと、並んでいるのは定食ばかり。せっかくなので一つ頼みました。\n\n食べ終えて外に出ると、角の先からソースのいい匂い。そこでやっと思い出しました。ピンを立てたのは、たこ焼き屋へ曲がるときの目印にしていた店でした。\n\n角を曲がって、たこ焼きも買いました。ピンを直そうと地図を開いたのに、今は二軒とも「絶対また行く」。あの定食、もう一度食べたい。", "よりみち地図帳", "帰り道につい買うおやつや、旅先でふらっと入った店の話を集めています。いつもの注文や、地元ならではの食べ方も教えてください。店名を忘れた日は「次もこれ頼む！」と思った一品だけでも＊", [["1K", "寄り道先からお祝い", "配信で名前を呼んで「本日の寄り道、いらっしゃい」とお迎えします。"], ["5K", "地図ピンのお礼メモ", "会話で聞いたおいしそうなひと言を選び、名前を添えてファミリーにお礼を書きます。"], ["10K", "おやつと地図ピンのアイコン", "好きなおやつと地図ピンの絵に表示名を添えたアイコンをお渡しします。"], ["20K", "寄り道のおやつ選び", "甘いものとしょっぱいもの、どちらが好きか聞いて、寄り道のおやつを一つおすすめします。"], ["30K", "寄り道地図の画像セット", "好きなおやつを描いた名前入りアイコンと、地図帳風のスマホ壁紙を作ります。"], ["40K", "ご当地おやつのお礼トーク", "好きなご当地おやつを一つ教えてもらい、配信で取り上げて今月のお礼を伝えます。"], ["48K", "商店街の寄り道特番", "好きなおやつを題材に約5分の寄り道トーク。名前入りアイコンと架空の寄り道マップ画像もお渡しします。"]]],
  ["港レター_", "みなとです。港町で朝を迎えたら、まず焼きたての塩パンを探します。速い曲につられて早足になるので、散歩のときはイヤホンを外します。波の音に、店のシャッターを開ける音が混じると、街が起きた合図です。\n\n旅先から自分宛てにはがきを出したことがあります。「明日の朝、港で塩パンを買う」。翌朝はお目当てのパンを買い、まだ温かい紙袋を手に港を歩きました。\n\nその数日後、家のポストにあのはがきが届きました。はがきの中の私は、まだ買いに出る前のまま。「買えたよ。おいしかったよ」と、つい返事を書きたくなりました。\n\n次のはがきには「家族にも塩パンを買う」。帰りの電車で紙袋を開けずにいられますように。みなとより。", "海辺のポスト", "「朝七時、踏切の近くで焼きたてのパンの匂い」。旅先や通勤路でふと気づいた音や匂いを、このポストに届けてください。時刻を覚えていたら、そっと添えて。", [["1K", "港からお祝いの声", "配信で名前を呼び、「今日も港に寄ってくれてありがとう」とお祝いします。"], ["5K", "海辺の一行はがき", "心に残ったお話を一つ添えて、ファミリーに名前入りの短いお礼を投稿します。"], ["10K", "海辺の消印アイコン", "海辺の消印をあしらった、表示名入りアイコンをお渡しします。"], ["20K", "はがきの題材リクエスト", "あなたの好きな音や匂いを一つ取り入れ、短い旅の便りにして配信で読みます。"], ["30K", "朝焼けと夕暮れの絵はがき", "朝焼けと夕暮れからお好きな方を選んでください。その風景で名前入りアイコンと海辺の絵はがき画像を作ります。"], ["40K", "あなた宛ての港レター", "あなたが選んだ風景をもとにお礼の便りを書き、名前を添えて配信で読みます。"], ["48K", "海辺のポスト特番", "選んだ旅のテーマで約5分の雑談と朗読。名前入り消印アイコンと、便りを載せた絵はがき画像をお渡しします。"]]],
  ["けんし♪", "イントロは分かる。サビも歌える。曲名だけ出てこない。けんしです♪ 秋のドライブでは、車を停めてひと休み。塩むすびを食べながら帰りの一曲を選びます。登場人物の多い歴史小説でも、名前が出るたび「あれ、誰だっけ」と前のページへ。\n\nカラオケで珍しく曲名を思い出して、すぐ曲を入れました。流れ始めたイントロに「あれ？」。少し待っても知ってるメロディーが来ません。同じ題名の別の曲でした。「これ歌える」と友人がマイクを取ったので、僕は横でタンバリン係に。「僕の歌詞は全部シャンシャンです！」\n\n次にその友人とカラオケへ行くと、「あれ入れてね」と頼まれました。僕の入れ間違いで、友人の十八番が一曲増えました。それからは、曲名と歌手名を確かめてから入れます。タンバリンは相変わらず、先に取ります。", "サビから歌う会", "サビが来ると、つい歌っちゃう曲はありますか♪ カラオケの十八番も、帰りの車で口ずさむ歌もどうぞ。合いの手を入れる派も、何度も聴き返す派も、まず一曲聞かせてください。", [["1K", "シャンシャンでお祝い", "配信で名前を呼び、口でタンバリンの音をまねて「シャンシャン！」とお祝いします。"], ["5K", "十八番のお礼メモ", "教えてくれた音楽の好みに触れながら、ファミリーに名前入りのお礼を書きます。"], ["10K", "タンバリンと音符のアイコン", "タンバリンと音符を描いた、表示名入りアイコンをお渡しします。"], ["20K", "帰りの一曲リクエスト", "ドライブの気分を聞いて、帰り道に似合う一曲を配信で紹介します。"], ["30K", "ラジオ番組表の画像セット", "好きな色で名前入りアイコンとラジオ風の番組表画像を作ります。番組表には二曲を載せます。"], ["40K", "ラジオ風のお礼DJ", "あなたの好きなジャンルから二曲選び、配信でDJ風に紹介してお礼を伝えます。"], ["48K", "あなたが選ぶ夜ラジオ特番", "テーマを選べる約5分のラジオ風トークです。名前入りアイコンと記念の番組表画像が付きます。"]]],
  ["かんうどん🍜", "「かけ、ちくわ天。ねぎは多めで」。うどん屋ではいつもこう頼みます。かんです🍜 初めて入る店では、麺より先にだしをひと口。郷土料理の本で知らない具を見つけると、その土地まで食べに行きたくなります。\n\nある店で、カレーうどんの汁を白いシャツに飛ばしました。翌週、黒いシャツで同じ店へ。店主に「前と同じので？」と聞かれて、僕はいつものかけのつもりでうなずきました。\n\n丼が置かれ、湯気の向こうに見えたのは、あのカレーうどん。店主は僕の胸元にちらっと目をやって、「今日は黒でよかったね」。そこまで覚えてたんだ。\n\nうどんの写真には、だしと具をメモします。カレーうどんの一枚だけ、最後にもう一行。「次も黒」。", "ねぎ多めの席", "「かけ、ねぎ多め」「うちは卵を落とすよ」。うどん一杯から話が広がります🍜 麺の太さ、だしの色、地元で人気の天ぷら。あなたのいつもの一杯を聞かせてください。明日のお昼が決まるかも。", [["1K", "ねぎ多めでお祝い", "配信で名前を呼び、「ねぎ多めで一杯！」の掛け声で拍手します。"], ["5K", "店主のお礼メモ", "うどん屋の店主になりきって、ファミリーにあなた宛てのお礼をひと言書きます。"], ["10K", "うどん札のアイコン", "丼とちくわ天の絵に表示名を添え、アイコン画像を作ります。"], ["20K", "薬味のおすすめ", "好きなうどんの具を教えてください。その具に合いそうな薬味を配信で一つ提案します。"], ["30K", "のれん色のお品書きセット", "選んだのれんの色で、名前入りアイコンとスマホ用のお品書き画像を作ります。"], ["40K", "あなた好みの一杯", "好きなだしと具を合わせた一杯を配信で紹介します。名前を呼んでお礼も伝えます。"], ["48K", "うどん屋の主役メニュー", "好きな具をお題に、配信で約5分お話ししてお礼を伝えます。名前入りアイコンと、その具で考えた一杯のメニュー画像も作ります。"]]],
  ["土星わっか◎", "土星わっかです◎ 「土星」でも「わっか」でもどうぞ。野口聡一さんが宇宙の話を始めると、いつまでも聞いていられます。数式が何行も続く天文学の本は、そっと閉じます。晴れた休日は、星が見えた時刻と方角をメモします。流星を待つあいだは、時計を見ずに三十秒ずつ数えます。\n\nある晩、流星がすっと見えて「あっ」。隣の友人も同時に「あっ」。私が「見つけた？」と聞くと、「うん！」と返ってきました。二人で同じ流星を見たんだと思っていました。\n\nその晩の帰り道、友人が缶を掲げました。「探してたぶどうジュース、あそこの自販機にあったよ」。次は「何を？」まで聞きます。\n\n月と深海、行けるなら私は月。席は、できれば窓側でお願いします。着いたら、いつもどおり方角までメモするつもりです。月でどっちが北かは、まだ知りません。", "土星の窓側席", "「コンビニの上で星が光ってた」。そんな一行も、立派な観測メモです◎ 今夜見えたものを窓側で聞かせてください。月行きと深海行き、あなたならどっちの窓から外を眺めたいですか？", [["1K", "窓側へお迎え", "配信で名前を呼び、「今夜の窓側、空いてます」のひと言でお祝いします。"], ["5K", "星便りでひと言", "今月の思い出を一つ添え、ファミリーにお礼の星便りを書きます。"], ["10K", "土星の輪のアイコン", "土星の輪に表示名を入れたアイコン画像をお渡しします。"], ["20K", "空のお題リクエスト", "気になる空の色や天体を教えてください。いただいた話題を配信で取り上げます。"], ["30K", "選べる星空セット", "土星か月を選んでください。その絵柄で、名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "月・深海のお礼ガイド", "月か深海、行き先を一つ選べます。配信でその行き先をご案内し、お礼を伝えます。"], ["48K", "月か深海へ出発", "選んだ行き先をお題に、配信で約5分お話しします。名前入りアイコンと、架空の旅のしおり画像をお渡しします。"]]],
  ["しろもち。", "毛布の中から、こんばんは。しろもちです。洗いたての綿の毛布にくるまって、よく配信をのぞいてます。「おやすみ」を打ちかけて寝落ちした日は、目が覚めてから「おはよう」です。\n\nお正月は、お雑煮をひと口。「今年もよく食べて、よく眠れますように」と願います。甘い黒豆は少し苦手ですが、お餅には目がありません。\n\n一つ食べ終えて箸を伸ばすと、お椀の底に餅がもう二つ。子どもの頃に言った「一つじゃ足りない」を、家の人が覚えていてくれました。\n\nうれしくて、三つともぺろり。布団に入る頃までお腹いっぱいでした。翌朝、「今日も三つ？」と聞かれました。そこは寝ぼけず、「一つでいい」と答えました。", "毛布ときなこの部屋", "きなこ餅をお供に、毛布でひと休み。「うちは丸餅」「餅は焼いてから入れるよ」。おうちのお雑煮の話、眠くなるまで聞かせてください。続きはまた明日。", [["1K", "毛布の中から小さな拍手", "配信で名前を呼んで、目が覚めないくらいそっと拍手してお祝いします。"], ["5K", "おやすみの一行", "ファミリーに、名前を添えてお礼を一行残します。寝る前にどうぞ。"], ["10K", "きなこ餅のアイコン", "きなこ餅と毛布をあしらった、表示名入りのアイコン画像を作ります。"], ["20K", "冬のお題リクエスト", "お雑煮や冬の寝支度など、好きなお題を選んでください。配信でその話をします。"], ["30K", "選べる毛布柄セット", "好きな色の毛布柄で、名前入りアイコンとひと言を添えたスマホ壁紙を作ります。"], ["40K", "眠る前のお礼トーク", "配信では、好きな冬の話題でゆっくりおしゃべり。名前を呼んで今月のお礼を伝えます。"], ["48K", "毛布の中のお礼会", "選んだお題で約5分、配信でおしゃべりしてお礼を伝えます。名前入りアイコンと、おやすみの言葉を添えた壁紙も作ります。"]]],
  ["いかいかが？", "いかです🦑 水族館に着いたら、説明板はあと回し。まず一匹だけ選んで泳ぐ姿を目で追います。長編ミステリーでは、途中で誰が誰だか分からなくなります。水槽なら、目の前の一匹が今日の主役です。\n\nエイに手を振りながら、隣の友人に「エイ語、習ってます」。振り返してくれたのは、水槽の向こう側にいた子どもでした。\n\n私がもう一度手を振ると、子どもの隣のお母さんまで応えてくれました。エイはその間にするっと奥へ。字幕を付けるなら「エイ語の先生、先に帰る」。\n\n配信では、天気から始めた話が気づけば深海まで泳いでいきます。そちらの空模様、いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 岩陰から魚がちらっと顔を出しました。こんな場面に字幕を付けるなら、どんなひと言？ 名前が分からなくても、色や動きを教えてくれたら一緒に考えます。", [["1K", "クラゲ前へお迎え", "配信で名前を呼んで「クラゲ前でひと息、いかがですか」とお祝いします。"], ["5K", "水槽からの一行お礼", "クラゲやエイになりきって、名前を添えたお礼をファミリーに一行残します。"], ["10K", "水槽プレート風カード", "好きな水の生き物をモチーフに、表示名入りの解説プレート風カード画像を作ります。"], ["20K", "水槽の字幕リクエスト", "選んでもらった生き物のしぐさに合う字幕を考え、配信で読み上げます。"], ["30K", "選べる水槽画像セット", "クラゲかエイを選べます。名前入りアイコンと水槽プレート風カード画像を作ります。"], ["40K", "二匹の水槽ガイド", "好きな生き物を二つ、配信でガイド風に紹介します。名前を呼んでお礼も伝えます。"], ["48K", "クラゲ前の特別ガイド", "好きな生き物をお題に、配信で約5分の水族館トーク。名前入りアイコンと、字幕を添えた水槽カード画像も作ります。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 温かいマグを両手で包んで、夜のバラードを一曲。歌い出す直前の息づかいまで聴きたくて、いつも曲はそのままの速さで再生します。\n\nある夜、歌枠で感想を書いては消しているうちに、次の曲が始まりました。結局送ったのは一行だけ。「さっきの曲、二番に入る前の息づかいが好きでした」\n\n歌い終えた枠主さんがコメントを読み、「あそこ、落ち着こうと思って息を吸ったんだ」と話してくれました。あの息を聴いていたことが、一行で伝わってうれしかったです。\n\nふとマグを持ち上げたら、もう湯気がありませんでした。今夜は一曲目が始まる前に、ひと口。", "雪あかりの歌席", "温かい飲み物を片手に、夜のバラードを❄ 「二番の前の息が好き」みたいなひと言も、聞かせてもらえたらうれしいです。聴くだけの夜も、ゆっくりしていってください。", [["1K", "雪あかりの乾杯", "配信でお名前を呼んで、温かい飲み物で小さく乾杯します。"], ["5K", "一行のおつかれさま", "今日のあなたに向けて、ファミリーに「おつかれさま」と一行書きます。"], ["10K", "雪とマグのアイコン", "雪あかりとマグを描いたアイコンに、表示名を入れてお渡しします。"], ["20K", "夜のバラードリクエスト", "あなたの気分に合うバラードを一曲選び、声の入り方や息づかいなど、聴きどころを配信で紹介します。"], ["30K", "色が選べる便箋セット", "雪色と灯り色から選べます。名前入りアイコンと、お礼を書いた便箋画像をお渡しします。"], ["40K", "あなたへのお礼の手紙", "配信でお名前を呼び、今月の思い出をつづったお礼の手紙を読みます。"], ["48K", "雪あかりの朗読会", "好きな冬の景色を話題に、約5分の雑談と手紙の朗読。名前入りアイコンと便箋画像もお渡しします。"]]],
  ["じゃっくん☆", "はーい、参戦します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームが好きで、人のボケにはついひと言足します。年末は友だちと遊び納め。来年も笑いたいひと言は、その場でメモします。\n\nある対戦で、画面の真ん中のキャラがぐいぐい攻めていて、思わず「勝った！」。隣の友だちが「そっち俺」。よく見たら、画面の端で僕のキャラはとっくに負けてました。それ以来、喜ぶ前に自分のキャラの色を確かめます。\n\n休憩では、苦手なレーズンクッキーを友だちの皿へ。「おっと、ここでクッキーが移籍です！」 友だちが黙って一枚食べました。移籍成立です。", "とりあえず参戦部", "冷蔵庫を開けたら実況開始。最後のプリンが消えていたら大喜利です🙌 誰かのボケにひと言足せそうなら、すかさず参戦。最初は「座布団一枚！」係からでもどうぞ。", [["1K", "種目はあとで、まず拍手", "配信で名前を呼び、まずは拍手。「種目はあとで決めます！」"], ["5K", "日常の一行表彰", "最近できた小さなことに競技名を付け、名前を添えてファミリーで表彰します。"], ["10K", "メダル風の表彰カード", "表示名と架空の競技名を入れた、メダル風のカード画像をお渡しします。"], ["20K", "実況種目のリクエスト", "選んでくれた日常の出来事を一つ、配信でスポーツ中継のように実況します。"], ["30K", "金か銀の表彰セット", "金か銀を選べます。名前入りアイコンと、競技名入りの表彰状画像をお渡しします。"], ["40K", "あなたの二種目実況", "日常の出来事を二つ、配信で実況。締めくくりに、名前を呼んで表彰します。"], ["48K", "決勝特番の主役選手", "選んだお題で約5分の実況と表彰。名前入りアイコンと大会結果カード画像もお渡しします。"]]],
  ["さなだんご。", "さなです。「だんご」でも振り向きます。休みの朝はパン屋さんへ。平野レミさんの料理番組を観ると、私も台所に立ちたくなります。クッキーはバターがふわっと香るものが好き。シナモンが強いと、食べる前からお腹いっぱいです。\n\nクッキーを焼きすぎた日。「端っこ、ちょっと色が濃いよ」と友だちに渡したら、あとで空っぽのお皿の写真と「次は倍で」が届きました。\n\n張り切って二回に分けて焼きました。二回目の天板だけ、またこんがり。焼き色で袋を分けて渡しました。「まず一枚、味見しよ。こっちは端っこ好き用ね」\n\n今は、天板を入れるたびにタイマーをかけます。人に渡す分とは別に、私の味見の一枚も焼きます。袋に入る前になくなるのは、いつもそっちです。", "焼きたてひと皿", "パン屋さんの新作も、家で焼いたおやつも。ひと口目はどうでしたか？ 「クッキーに塩をひとつまみ」みたいな工夫も聞きたいです。こんがりした端っこが好きな方、いらっしゃい。", [["1K", "焼きたての味見係へ", "配信で名前を呼び、「今日の味見係さん、ありがとう」とお祝いします。"], ["5K", "ひと皿のお礼便り", "心に残ったやり取りを一つ添えて、あなた宛てのお礼をファミリーに書きます。"], ["10K", "パン袋ラベルのアイコン", "パン袋のラベルをイメージした、表示名入りのアイコンです。"], ["20K", "隠し味リクエスト", "選んだおやつに合う隠し味を、配信で一つ提案します。"], ["30K", "柄が選べるラベルセット", "パン柄とクッキー柄から選べます。名前入りアイコンとオリジナルのラベル画像を作ります。"], ["40K", "あなたの味見トーク", "好きなおやつと好みの食感を聞いて配信で話し、今月のお礼も伝えます。"], ["48K", "あなたの名物おやつ会", "好きな味をテーマに、約5分のおやつ談義をします。お礼に、名前入りアイコンと架空のおやつのラベル画像を作ります。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方、洗濯物をたたむ手を止めて、枠で「おつかれ〜」。家事のあとには暮らしのエッセイを一篇。季節限定のおやつを買った日は、ラベルをノートに貼って日付を書きます。\n\n甘いゆず味を探して三軒目。袋に大きく「ゆず」と書いてありました。やっと買えたと喜んで、帰ってひと口。ゆず胡椒味でした。\n\n辛いのが苦手で水を飲んでいたら、家族が隣で甘いゆず味の袋を開けました。「同じ店にあったよ。袋の文字、最後まで読んだ？」\n\nノートに二枚のラベルを並べました。辛いほうは「探した味」、甘いほうは「探してない味」。家族は辛いほうが気に入ったみたいで、「今度はわざと買ってね」って。", "ゆず色おつかれ会", "家事の合間に聴く一曲や、スーパーで見つけたおやつの話をしましょ🍊 まずは「おつかれ〜」の一言から。洗濯物があと一枚でも、好きな曲が流れたら先に聴こ。", [["1K", "夕方のおつかれ拍手", "配信で名前を呼び、「片付けはあとで。まず拍手！」とお祝いします。"], ["5K", "ひと休みのお礼", "夕方のひと休みに読めるお礼の一言を、ファミリーに書きます。"], ["10K", "ゆず色の夕焼けアイコン", "柑橘と夕焼けを描いた、表示名入りのアイコンです。"], ["20K", "ひと息の選曲リクエスト", "散歩中と家事の合間のどちらで聴きたいかを聞き、ぴったりの曲を配信で一つ紹介します。"], ["30K", "柑橘色の待ち受けセット", "ゆず色とみかん色から選べます。名前入りアイコンとスマホ用の壁紙を作ります。"], ["40K", "あなた宛て夕方ニュース", "今月の頑張りを夕方のニュース風に紹介し、配信で名前を呼んでお礼を伝えます。"], ["48K", "おつかれ特番の主役", "好きな話題で約5分のおつかれ特番を開きます。名前入りアイコンと「本日の家事終了」の画像もお渡しします。"]]],
  ["のぶにゃがฅ", "のぶでも、にゃがでも。夜の枠にしれっとおりますฅ 武将の書状は、最後の頼みごとまで読む派です。うちの書き置きも、この調子。「猫殿におやつは進呈済み。重ねて出されぬよう」。\n\n太鼓の音が苦手なので、時代ものは音量を下げて観ます。ある日、大事な台詞の直前に、猫殿がテレビの前を横切りました。武将の表情を見たくて巻き戻すと、同じ台詞でまたお出まし。\n\n三度目には、家族そろって猫殿が出てくるほうを見ていました。それ以来、人が画面の前を通ると、つい「参戦ですか？」。猫殿がお通りなら、黙って席を譲ります。", "ねこ殿の書状部屋", "夜更けの評定に、武将の書状で好きな一言や、家でいちばん偉そうにしている猫の話を持ち寄りませんか。「うちの猫殿は箱から動きません」も立派な議題。猫の話が出た日は、だいたい延長ですฅ", [["1K", "猫殿と座布団を半分こ", "配信で名前を呼び、「座布団は猫殿と半分ずつで」とお祝いします。"], ["5K", "猫殿の一行書状", "猫殿に代わり、名前を添えた一行のお礼をしたため、ファミリーに載せます。"], ["10K", "肉球の花押アイコン", "猫殿の肉球をサインに見立てた、表示名入りのアイコン画像を贈ります。"], ["20K", "猫殿が授ける二つ名", "好きな猫のしぐさを聞いて、配信で武将風の二つ名を一つ考えます。"], ["30K", "色を選べる家紋セット", "選んだ色で、名前・二つ名を入れた家紋アイコンと、猫殿の書状画像を作ります。"], ["40K", "猫殿のお礼評定", "配信で今月のうれしかったことを振り返ります。名前を呼び、猫殿に代わってお礼を伝えます。"], ["48K", "お城の任命式", "配信で約5分のお礼会を開き、選んだ城名を発表します。名前入りの家紋アイコンと任命状画像を贈ります。"]]],
  ["ぜうす_", "ぜうす。呼び捨てでどうぞ。コーヒーは深煎り。映画館の照明が落ちて、ざわめきがすっと引く瞬間が好きです。半券の裏には、もう一度観たい場面を一つ書いておきます。解説に「あの人はこう思っていた」とあっても、あの長い沈黙にはほかの理由もあった気がします。\n\n帰りの電車で友人と「あの人、最後に何を考えてたんだろうね」と話していたら、すっかり盛り上がりました。降り際に名前を出し合い、ようやく別々の人物の話だと気づきました。\n\n次に映画を観た帰りは、先に名前を確かめました。今度は名前がそろったのに、頭に浮かんでいた場面が違いました。\n\n座右の銘は「まず、誰の話か」。最近は「あと、どの場面か」までセットです。", "深煎りの上映後", "深煎りを片手に、観終わっても気になる場面の話をしましょう。「ほっとした顔だった」「何か隠してると思った」。どんな表情やしぐさでそう感じたか、聞かせてください。結末の話は、みんなが観てから。", [["1K", "エンドロールでお祝い", "配信で名前を呼び、「今日もエンドロールまでありがとう」と伝えます。"], ["5K", "深煎りの一行お礼", "心に残った感想を一つ選び、名前入りのお礼に添えてファミリーに載せます。"], ["10K", "映画半券のアイコン", "半券とコーヒーを描いた、表示名入りのアイコン画像を贈ります。"], ["20K", "好みに合う映画一本", "好きなジャンルをもとに映画を一本選び、配信で結末に触れずに紹介します。"], ["30K", "色が選べるエンドカード", "お好きな差し色で、名前入りの半券アイコンとエンドカード風のスマホ壁紙を作ります。"], ["40K", "あなたの編集会議", "配信で、選んだ場面の見方を結末に触れずに二通り紹介します。名前を呼んでお礼も伝えます。"], ["48K", "二重エンドの上映後トーク", "お好きな話題で、約5分の上映後トークを配信でお届けします。名前入りアイコンと、題名を二つ載せたタイトル画像を贈ります。"]]],
  ["りさっち＊", "りさっちです☺️ カフェめぐりの楽しみは、飲み干したあとのカップ。気に入ったら、底にある印まで見ます。お店の記録に、飲む前の一杯を撮ろうと決めました。三日目、撮れたのはレシートだけ。記録はそこでおしまいです。\n\nドラマの最終回を観る前に、推しの幸せを願って、友だちといつものカフェでコーヒーを一杯。「推しが同じだね」と盛り上がったところで、友だちがひと言。「でも、同僚だったら困るよね」。\n\n私は「あのときはさ」と、場面を一つずつ挙げて推しの肩を持ちました。ようやくカップを手に取ったときには、コーヒーはすっかり冷めてました。\n\n最終回を観ても、二人とも推しは変わりませんでした。同じ職場になったら？ 私も隣の席はそっと避けるかも。", "いつものカフェ席", "いつものカフェ席へどうぞ☺️ ドラマの感想や、今日のリップの話を。「推しにはこの色が似合いそう」なんて一言から、つい話が弾みます。ドラマを観ていない日は、手元のカップの柄から話そうね。", [["1K", "いつもの席でお祝い", "配信で名前を呼び、「いつもの席、空けときました」のひと言でお迎えします。"], ["5K", "カップにひと言", "今日の気分に合わせたお礼を、名前を添えてファミリーに書きます。"], ["10K", "注文シール風アイコン", "カップの注文シール風に、表示名入りのアイコン画像を作ります。"], ["20K", "カフェの話題リクエスト", "ドラマかリップ、お好きなほうをどうぞ。配信で好みを聞きながらおしゃべりします。"], ["30K", "リップ色のカップセット", "好きなリップの色を差し色に使い、名前入りアイコンとカップ柄のスマホ壁紙を作ります。"], ["40K", "あなたに似合う一杯", "好みに合わせて架空のドリンクを考えます。配信で名前を呼んでその一杯を紹介し、お礼を伝えます。"], ["48K", "カフェの主役コーナー", "配信で約5分のカフェトーク。話題はお好きなものを。名前入りアイコンと限定メニュー画像を贈ります。"]]],
  ["ちょぱ丸_", "コンビニまで往復十分。寄り道込みなら三十分。ちょぱ丸です。卓球では相手のラケットに気を取られがち。気づけば、球はもう目の前をすっと通り過ぎてます。\n\n商店街で前に寄ったお店へ、友だちを案内した日。「猫がいるお店ね」と言って、猫ばかり探していたら肝心の店を通り過ぎました。地図を見て引き返し、買い物を済ませました。\n\n外へ出ると、店先に猫が。「ピンポーン。目印、ただいま出勤しました」と言ったら、友だちが「赤いのれんは開店から仕事してたけどね」。\n\nアニメでは、誰かが振り向く瞬間に低い音が鳴るのが好きです。グミの白い粉を砂糖だと思ってかじった日は、口いっぱいに酸っぱさが広がって、一瞬で目が覚めました。あの一粒に、効果音は要りません。", "寄り道アニメ部", "「あの音がしてから振り向いたよね」。アニメで気づいた音やしぐさを一つ、持ち寄りませんか。推しが多い人は、今日の一人から。商店街のおやつまで話が飛んだら、一緒に寄り道しましょう。", [["1K", "寄り道先からピンポーン", "配信で名前を呼び、「ピンポーン、寄り道先でお迎えです」とお祝いします。"], ["5K", "猫は不定休のお礼便", "「目印の猫は不定休」のひと言を添えて、あなた宛てのお礼をファミリーに投稿します。"], ["10K", "赤いのれんの待ち受け", "赤いのれんと猫を描いた、表示名入りのスマホ壁紙を作ります。"], ["20K", "推しの見どころリクエスト", "好きな作品を教えてください。印象に残った場面や演出を、配信で一つ取り上げます。"], ["30K", "寄り道番組表セット", "好きな色で、名前入りアイコンと寄り道の番組表風カード画像を作ります。"], ["40K", "あなたの寄り道外伝", "推し作品か町のおやつから、お題を一つどうぞ。配信で外伝トークをし、名前を呼んで今月のお礼を伝えます。"], ["48K", "寄り道特番の主役", "選んでもらったお題で、約5分のアニメ風雑談を配信します。名前入りアイコンと寄り道マップ画像を贈ります。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 ゲームの地図に空白を見つけると、扉一枚を開けに引き返します。回復薬は決戦まで温存いたします。\n\n同行者に「そろそろ決戦へ」と言われて近道を選んだら、同じ崖から二度落ちました。ようやくたどり着いたボス戦は、わずか二分。回復薬は一つも使っておりません。\n\nありふれた注意書きを決戦の口上に仕立てるのが得意です。たとえば、低い声で「足元をご確認くださいませ」。あの崖の手前に、そう書いた札が欲しかったものでございます。", "決戦前の休憩室", "決戦前にひと休み。ボス戦で耳に残った音や、手こずった難所をお聞かせください。開かないジャムのふたも立派な難所でございます。わたくしが攻略法を考える間に、お茶をどうぞ。", [["1K", "ご来城のお祝い", "配信でお名前を呼び、「本日もご来城ありがとうございます」とお迎えします。"], ["5K", "ラスボスから一行のお礼", "ファミリーにお名前を添えて、丁寧すぎるほどのお礼を一行記します。"], ["10K", "勇者の名前入りアイコン", "紋章と橋を描いたアイコンに表示名を入れてお渡しします。"], ["20K", "勇者の称号授与", "最近できたことを伺い、それにちなんだ称号を配信でお授けします。"], ["30K", "選べる紋章セット", "お好きな紋章の色で、名前入りアイコンと称号入りの達成証画像を作ります。"], ["40K", "決戦前の二役寸劇", "お好きな決めゼリフを使い、配信で勇者とラスボスの二役を演じてお礼をお伝えします。"], ["48K", "王国の授与式", "お好きなお題で約5分、ゲーム風のトークと称号発表を行います。名前入りアイコンと感謝状の画像もお贈りします。"]]],
  ["simba_", "休日のドライブは、行き先を一つだけ。シンバです。運転中は静かな曲をかけます。ビッグバンドだと、つい演奏を追いかけちゃうので。休憩のお供は、たまごサンド。\n\n海へ行った日、友だちと空いていたベンチに座りました。目の前は駐車場で、肝心の海は背もたれの向こう。二人でひと笑い。振り返って海を一枚、正面の愛車も一枚撮りました。\n\n帰って愛車の写真を見返したら、あのときの笑い声までよみがえりました。\n\n動物園でも、水槽の前で足が止まります。ペンギンが目の前をすいっと横切るのを待ちます。気づけば、次の目的地に着くはずの時刻をとっくに過ぎています。いい休憩も旅のうち。", "停車中の見晴らし席", "車を降りてようやく見えた景色や、水槽の前で予定より長く過ごした話を聞かせてください。いつもの道でふと足を止めた場所も、ぜひ一つ。たまごサンドを片手に待ってます。", [["1K", "見晴らしの席で拍手", "配信で名前を呼び、「景色がいいので、ここで拍手」とお祝いします。"], ["5K", "車窓からのひと言", "今月の会話を一つ拾って、名前を添えたお礼をファミリーに書きます。"], ["10K", "見晴らしアイコン", "ペンギンや海辺を描いた、表示名入りのアイコンをお渡しします。"], ["20K", "次の寄り道リクエスト", "好きな景色を聞き、そこから思い浮かんだ寄り道先を配信で一つ紹介します。"], ["30K", "選べる風景セット", "海と動物園から、お好きなほうを選べます。名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなたの景色で休憩トーク", "選んでもらった景色をきっかけに、配信でドライブの話をします。名前を呼んでお礼も伝えます。"], ["48K", "見晴らしの寄り道特番", "お気に入りの寄り道を聞いて、約5分ドライブの話をします。名前入りアイコンと風景カードの画像も贈ります。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白い照明がまぶしいので、机では手元だけを照らします。焼きたてのトーストにバターがすっと溶ける瞬間が好きです。配信に聞き入ると、ひと口目にはもう冷めています。\n\nある晩、昔のゲームを久しぶりに起動しました。最後の城の手前まで来たはずが、再開したのは最初の村。懐かしくなって村を一周し、そのままセーブしました。好きな場所なら、戻ったぶんも進んだうち。\n\nゲームの曲は、流れた場所と一緒に書き留めます。あの夜のメモは「最初の村、宿を出てすぐ」。\n\n曲名を調べたのは三晩目でした。それまでは、あの曲が聴きたくなるたび、ゲームを起動して、もう一周。", "夜更けのセーブ地点", "作業のおともに流すゲームの曲や、セーブしておきたい景色を持ち寄る場所です。「雨がやまない村」「宿屋の明かり」。地名がうろ覚えなら、目に浮かぶものを一つ。今夜は聴くだけでも、どうぞ。", [["1K", "夜更けのコアセーブ", "配信で名前を呼び、「今日のコア、保存しました」とお祝いします。"], ["5K", "セーブ地点の一行メモ", "心に残った作業やゲームの話を一つ添えて、ファミリーにお礼を書きます。"], ["10K", "名前入りセーブ画面アイコン", "セーブ画面風のアイコンに表示名を入れてお渡しします。"], ["20K", "作業BGMリクエスト", "好きなゲームの景色を聞いて、作業のおともに合いそうな曲を配信で一曲紹介します。"], ["30K", "選べるセーブ地点セット", "夜の港か雨の村から選べます。選んだ景色で名前入りアイコンとゲーム風の壁紙を作ります。"], ["40K", "あなたのゲーム散歩", "あなたが選んだゲームの景色を二つ、配信で語ります。名前を呼んでお礼も伝えます。"], ["48K", "夜更けの最終セーブ会", "選んだ景色をもとに約5分、ゲームの話をします。名前入りアイコンと、その景色のセーブカード画像も作ります。"]]],
  ["まさむね_", "休日は、城下町の脇道へ。まさむねです。行きの電車では、よく三味線を聴きます。人混みを急いで抜けるのは苦手。説明板の前で足を止め、町の人から昔話を一つ聞けたら、遠回りしたかいがあります。\n\nある日、城跡の急坂で、近所の方に「子どもの頃、ここを滑って下りましたよ」と教わりました。\n「どうやって止まるんですか？」\n「止まれないから下まで行くんです」\n帰りは私も同じ坂へ。一歩ずつ下りました。\n\n野球を観た帰り道も、ふと浮かぶのは点が入る前の静けさと、隣の席のひと言です。あの坂で聞いた「下まで行くんです」は、忘れないうちに寄り道帳へ。読み返すと、坂の傾きまで思い出します。", "城下町の寄り道帳", "城下町の路地、球場への近道。つい足を止めた場所を聞かせてください。地名を忘れたら「コロッケの匂いがした角」だけでも。そのひと言を手がかりに、私も歩いてみたくなります。", [["1K", "城下町へお迎え", "配信で名前を呼び、「ご城下へようこそ」とお祝いします。"], ["5K", "史跡札風のひと言", "心に残ったひと言を史跡札風にまとめ、名前とお礼を添えてファミリーに投稿します。"], ["10K", "城下町の名前入りアイコン", "門と町並みを描いたアイコンに、表示名を入れてお渡しします。"], ["20K", "曲がり角リクエスト", "好きな街の景色を聞いて、歩いて訪ねてみたい場所を配信で一つ紹介します。"], ["30K", "選べる町並みセット", "路地か球場への道から選べます。選んだ景色で名前入りアイコンと寄り道帳風のカード画像を作ります。"], ["40K", "あなた宛て城下町案内", "選んだ寄り道を二つ、街歩きの案内役になって配信で紹介し、お礼を伝えます。"], ["48K", "城下町紀行の主役", "選んだお題で約5分、街歩きの話をします。名前入りアイコンと、架空の名物看板を描いたカード画像を贈ります。"]]],
  ["路面ベル♪", "「まもなく、商店街のパン屋さん前です」。ベルって呼んでください♪ 車窓から気になる店が見えたら、降りた電停の名前と一緒にノートに書きます。低音の強い曲はちょっと苦手です。電停ではイヤホンを外して、発車ベルや店先の声に耳をすまします。\n\nある雨の日、傘を忘れて電停のあじさいを眺めていました。隣の方が私のほうへ、そっと傘を傾けてくれたんです。同じ電車に乗って、先に降りたのは私。ホームで振り返ると、その方が窓越しに小さく会釈。\n\n電停ノートのその日の欄には「傘を半分」。その一行を読むたび、あじさいの色より先に、窓越しの会釈が浮かびます。\n\nお目当てのパンが売り切れていたら、店名の横に「続きは次回」。この書き込みが増えるにつれて、電停ノートはパン屋の再訪リストになってきました。", "ベル待ちの電停", "車窓から見えた看板や、思わず降りた電停の話を聞かせてください♪ 路面電車が身近にない方も、「車窓からこんなお店が見えたら降りたい」からどうぞ。ベルが鳴るまで、寄り道の話をしましょう。", [["1K", "ベルを鳴らしてお祝い", "配信でお名前を呼んでお迎えします。「ご乗車ありがとうございます」。"], ["5K", "寄り道きっぷのお礼", "寄り道先を一つ選び、あなたの名前を添えたお礼をファミリーに載せます。"], ["10K", "名前入り電停アイコン", "路面電車と電停の看板を描いた、表示名入りのアイコン画像をお渡しします。"], ["20K", "電停リクエスト", "好きな景色を聞き、そんな眺めに出会えそうな実在の電停を配信で一つ紹介します。"], ["30K", "車体色を選べる乗車券セット", "好きな車体色で、名前入りアイコンと架空の一日乗車券の画像を作ります。"], ["40K", "お名前入り車内放送", "好きな景色を車窓に見立て、配信でお名前を呼んでお祝いします。お礼も車内放送風にお伝えします。"], ["48K", "架空路線の主役便", "選んだ景色と電停名をもとに、約5分の車内放送風トークをします。名前入りアイコンと、その電停を載せた路線図画像もお渡しします。"]]],
  ["ねずち。", "すみっこ、空いてますか？ねずちです🐭 壁を背にできる席が好き。おやつならチーズです。ある日、袋を見間違えて、苦手なわさび味をひと口。あの日いちばんおいしかった飲み物は、水でした。ボウリングでは、端に一本だけ残ったピンを倒せると、ストライクとはまた違ううれしさがあります。\n\n配信で誰かが「寝る前についゲームしちゃう」と言うので、うなずきながら「今のわかる」と打ちました。送信したときには、話題が「実家でヤギを飼ってた」に移ってました。\n\n私までヤギを飼っていたことになりそうで、「うちは金魚だけです」と訂正。その晩は、そこから金魚の話で持ちきりでした。\n\n廊下の足音なら、家族の誰が来たか当てられます。配信で話題が変わるときも、足音みたいな合図が聞こえたら。送信の一歩手前で気づけるんですけどね。", "すみっこチーズ席", "壁ぎわに一席、空いてます🐭 好きなアニメの一場面や、ゲームで迷った話をどうぞ。コメントを書いてるうちに話が進んだら、「さっきの話だけど」で戻ってきてね。チーズをひとかけ食べるくらいの間なら、さっきの話もまだ覚えてます。", [["1K", "すみっこから小さな拍手", "配信で名前を呼び、チーズひとかけぶんの小さな拍手でお祝いします。"], ["5K", "壁ぎわの一行席札", "ファミリーに、表示名と「チーズ持ち込み可」を添えた席札風のお礼を書きます。"], ["10K", "チーズの名前入りアイコン", "チーズとねずみの柄に、表示名を入れたアイコン画像をお渡しします。"], ["20K", "すみっこのお題リクエスト", "アニメかゲームからお題を一つ選んでください。配信でその話を広げます。"], ["30K", "選べるすみっこ画像セット", "好きなチーズの色で、名前入りアイコンと席札風の壁紙を作ります。"], ["40K", "チーズ通信のお礼ニュース", "最近うれしかったことを聞いて、名前を添えた短いニュースに。配信で紹介します。"], ["48K", "すみっこニュースの主役", "選んだお題で約5分のニュース風トークをして、お礼を伝えます。名前入りアイコンと新聞風のカード画像もお渡しします。"]]],
  ["いなりまる。", "晩ごはんの途中なのに、頭の中はもう明日の献立。「いなり」って呼んでください。料理エッセイを読むと、何を食べたのか、その日は誰と一緒だったのかまで気になります。\n\n脱出ゲームではヒントを読むのに夢中になって、ふと「そもそも何を探してたっけ？」。\n\n食後は冷蔵庫をのぞいて、早めに使いたい食材を一つメモします。合言葉は「迷ったら、まずだし」。献立が浮かばない日は、だしのきいたうどんにおいなりさんを添えます。\n\nある日、お弁当のふたを開けたら、一つだけ裏返ったおいなりさんが。何かの目印だと思って、真っ先にかじると、苦手な梅干しが丸ごと一つ。「当たりを入れたんだよ」と家族は得意顔。目印を見抜いたところまでは正解。それ以来、裏返ったおいなりさんには最後に手を伸ばします。", "いなりと明日の献立", "今日の晩ごはんから明日の献立を考える席です。「ねぎが少し余ったよ」から、あと一品を一緒に。「それ、誰と食べた？」から始まる話も聞かせてください。", [["1K", "おいなり一つ追加でお祝い", "配信で名前を呼び、「おいなり一つ追加です」とお祝いします。"], ["5K", "献立メモのお礼", "今月のごはんの話を一つ添えて、ファミリーに名前入りのお礼を書きます。"], ["10K", "おいなりの名前入りアイコン", "おいなりさんと湯気を描いたアイコン画像に、表示名を入れてお渡しします。"], ["20K", "冷蔵庫の一品リクエスト", "余った食材を聞いて、それで作れそうな副菜を配信で一品提案します。"], ["30K", "選べる献立カードセット", "うどん柄かおいなり柄を選んで、名前入りアイコンと、ひと言を添えた献立カード画像を作ります。"], ["40K", "食材二つの献立相談", "家にある食材を二つ聞き、配信で一食分の献立を考えます。その場でお礼も伝えます。"], ["48K", "台所特番の主役", "好きな料理をお題に、約5分の献立相談とお礼。名前入りアイコンと、その日の献立をまとめた画像もお渡しします。"]]],
  ["はんこびより。", "夜の雑談を聴きながら、ノートの余白に日付印をぽん。はんこです。枠で流れた曲の名前や、誰かが笑いながら言った一言を書き留めます。あとでノートを開くと、言った人の声まで思い出せるのが好きです。\n\n問題集の解答欄が小さいので、書ききれない分はこのノートへ。ある日、ページをめくると、いつもの余白に母の字で「牛乳買う」。\n\nどの問題を解いていたかは忘れました。でも母のメモは頭に残って、帰りに牛乳をちゃんと買いました。あの日いちばん役に立った一行、母の字でした。\n\n「私、押しは強いです。はんこ限定で。ポン！」が決めぜりふです。配信で返事が遅れたら、たぶん余白に何か書き足してます。「またメモ？」と聞かれると、その一言まで書き留めたくなります。", "夜のひとことノート", "今日できたことや、配信で言いそびれた感想を持ち寄る夜のノートです。聴くだけの日は、笑った場面を一つ持ち帰るだけでもどうぞ。「さっきの一言、残したい」と教えてくれたら、今日の日付印を押します。", [["1K", "日付印でコアお祝い", "配信で名前を呼び、「今日の一ページに、ぽん」とお祝いします。"], ["5K", "できたことに一行はんこ", "今日できたことを一つ聞いて、一行のお祝いをファミリーに書きます。"], ["10K", "名前入り日付印アイコン", "日付印をモチーフにした、表示名入りのアイコン画像をお渡しします。"], ["20K", "残したい一言リクエスト", "書き留めたいひと言を選んでもらい、配信で名前を添えて読み上げます。"], ["30K", "インク色を選べるノートセット", "好きなインクの色で、名前入りアイコンと、ひと言を入れたノート風の壁紙を作ります。"], ["40K", "お名前入りのノート朗読", "今月の会話から心に残った場面を選び、名前とお礼を添えて配信で読みます。"], ["48K", "記念ノートの振り返り会", "選んだひと言で約5分の振り返りとお礼。名前入りアイコンと、そのひと言を記して日付印を押したノート画像をお渡しします。牛乳メモ欄つき。"]]],
  ["ろくろの凪","右手で土を支えながら左手でそっと縁を上げます。ここでくしゃみが出そうになるのが、凪の陶芸配信です。湯のみを十個作って、まっすぐなのは二個。\n\n友だちが棚から真っ先に取ったのは、いちばん傾いたやつでした。「親指の置き場がある」。失敗に見えたへこみに、本当に指がすぽっと収まったんです。以来、窯から出したらまず両手で一周。何を飲みたい器か、持って決めるようになりました。","指あと陶房","棚に並んだ器のうち、手が伸びるのはどれでしょう。持ち手の形や、お茶を注いだときの色まで、一緒に眺める陶房です。",[["1K","土の拍手","ろくろを止めて、名前を呼んで拍手します。"],["5K","湯のみの底書き","お礼の一言を底に書いた器のスケッチをファミリーに載せます。"],["10K","指あと印","表示名と指の渦模様を合わせた陶印風アイコンを作ります。"],["20K","釉薬の二択","次の試し焼きに使う釉薬を二色から選べます。"],["30K","おそろいの器絵","好きな釉色で、湯のみのアイコンと小皿の壁紙を描きます。"],["40K","器の注文スケッチ","飲みたいものを聞いて、手になじみそうな器を配信で描きます。"],["48K","窯開きの特等席","試し焼きの器を画面越しに一緒に見比べ、選んだ器で名前入り記念カードを作ります。"]]],
  ["とじ糸ユイ","本を買うと、真ん中のページをそっと開いて糸を探します。糸で紙を綴じるのが好きなユイです。最初に作ったノートは、得意げに開いたら表紙が上下逆さま。\n\nもらってくれた妹は逆さのまま使い切りました。最後のページに「次は横開きで」と発注まで。今夜はその二冊目を綴じます。紙を引き締めるときだけ静かになるけど、コメントには針を置いて返事します。","背表紙の仕立て屋","表紙の手触りも、真っ白な一ページ目も楽しむ場所です。書き出しに迷うノートがあったら、最初の一行を一緒に考えましょう。",[["1K","糸を結んでご挨拶","糸の端をきゅっと結んで、名前を呼んで迎えます。"],["5K","見返しのお礼文","本の見返しに書くつもりで、あなたへ短い献辞を贈ります。"],["10K","背表紙アイコン","表示名を背に入れた小さな布張り本を描きます。"],["20K","綴じ糸選び","次の見本帳を綴じる糸の組み合わせを選んでください。"],["30K","蔵書票セット","イニシャル入り蔵書票と、同じ布柄の壁紙を作ります。"],["40K","一冊の設計相談","残したい思い出を聞き、紙の色や開き方を配信で提案します。"],["48K","手のひら製本会","希望の配色で豆本を一冊仕立て、完成写真にあなたへの献辞を添えます。"]]],
  ["雲待ちソウ","カバに似た雲を見つけて友だちを呼んだら、振り向いてくれた頃にはもう食パンでした。空の似顔絵を描くソウです。\n\nノートの日付の横には、雲の名前より先に「耳が長い」「おなかだけ灰色」と書きます。同じ空を見て「靴下」と言った人がいて、僕のカバにもちゃんとかかとがありました。配信に来たら、窓の外の一かけらを言葉で見せてください。","屋上の空見帳","離れた窓から今日の空を持ち寄る観察席です。晴天の日は、建物の影がどこまで伸びたかも立派な一行になります。",[["1K","空へご挨拶","名前を呼び、今日見えた雲を一言添えて迎えます。"],["5K","きょうの空欄","あなたの空模様を聞いて、日付入りの観察メモに残します。"],["10K","わた雲似顔絵","好きな生き物を雲に見立てた名前入りアイコンを描きます。"],["20K","見立てのお題","雲の写真に見つけたい形を一つリクエストできます。"],["30K","朝焼けと夕焼け","選んだ空色で、雲のアイコンと縦長の空の壁紙を作ります。"],["40K","空見帳の朗読","あなたの一週間の空から三場面を選び、配信で観察日記にして読みます。"],["48K","屋上の空だより","好きな時間帯を聞いて一枚の空を描き、あなた宛ての天気だよりとして紹介します。"]]],
  ["インク番・トワ","ローラーを往復させると、インクがちょうどいいときだけ「ぺたぺた」が「しゅっ」に変わります。音を聞きたくて紙を置き忘れたことがあるトワです。\n\n初めて刷った魚のはがきは、向きが反対でした。二枚並べたら偶然、お互いに挨拶しているみたい。今では右向きと左向きを一匹ずつ刷って、作業机の入り口に飾っています。今夜はどっちが濃く刷れるかな。","ころころ活版室","紙に残るへこみやインクのかすれが好きな人の作業室です。刷り上がった二枚を見て、どちらを飾りたいか聞かせてください。",[["1K","ローラーで点呼","ローラーをひと転がしして名前を読み上げます。"],["5K","余白の礼状","今日の刷り色を添えた短い礼状をファミリーに載せます。"],["10K","魚版の刷り印","魚の版画風に表示名を組み込んだアイコンを作ります。"],["20K","紙色の試し刷り","二種類の紙から一枚を選べます。刷り上がりを配信で比べます。"],["30K","二色刷りの便箋","好きな二色で魚の便箋画像と名前入り刷り印を作ります。"],["40K","版面レイアウト","入れたい短い言葉を聞き、活字をどう並べるか配信で試します。"],["48K","あなたの刷り見本","選んだ紙と色で小さな模様を刷り、名前と日付を入れた見本画像を贈ります。"]]],
  ["麦のまどか","生地が膨らんだかな、とボウルをのぞく間隔がだんだん短くなるまどかです。待つのが上手になりたくてパンを始めたんだけどな。\n\n一度、発酵を待つ間にうとうとして、隣の猫まで同じ丸さで寝ていました。写真を家族に送ったら「左のほうがよく膨らんでるね」。それ、猫です。配信では焼きたてを割る前にマイクを寄せます。皮が鳴る一瞬、一緒に聞いてね。","丸パンの膨らみ待ち","こね始めから焼き上がりまで、待ち時間もおしゃべりする台所です。朝の一枚に塗るもの、端っこを誰が食べるか、パンのある話をどうぞ。",[["1K","焼き上がりの鐘","小さなベルを鳴らし、名前を呼んでお祝いします。"],["5K","パン種日記","その日の膨らみ具合に、お礼を一行添えて投稿します。"],["10K","丸パンの焼き印","表示名を焼き印に見立てたパンのアイコンを作ります。"],["20K","切り込みの模様","葉っぱか十字から、次の丸パンの切り込みを選べます。"],["30K","朝のパンかご","好きな焼き色でアイコンとパンかご柄の壁紙を作ります。"],["40K","あなたの朝食皿","好みの具材を聞いて、一緒に食べたいパンの朝食を配信で考えます。"],["48K","一個ぶんの焼きたて便","希望の形でパンを成形し、焼き上がりの写真をお礼入りのカードに仕立てます。"]]],
  ["めだかの澪","メダカを数えようとすると、最後の一匹だけ水草の後ろでじっとしています。点呼に毎朝負けてる澪です。ごはんの袋を置く音なら、全員すぐに聞きつけるのに。\n\nある朝、水面に浮かぶ葉っぱを小さな魚だと思って「今日は早いね」と声をかけました。本物はその真下でのんびり。配信の休憩には水槽を映します。見失った一匹がどこにいるか、こっそり教えてください。","水草の向こう側","水槽の前でひと息つく場所です。泳ぎ方のくせや、いつも隠れる葉っぱなど、小さな発見を一緒に数えます。",[["1K","水槽前の点呼","あなたの名前を呼んで、水槽の住人を一匹紹介します。"],["5K","葉かげのお便り","今日のメダカの様子に、お礼を添えて書きます。"],["10K","水草アイコン","好きな色のメダカと表示名を水草の間に描きます。"],["20K","観察窓リクエスト","次にゆっくり映す場所を、水面か水草の根元から選べます。"],["30K","泳ぐ二枚組","メダカの名前入りアイコンと、水面を広く描いた壁紙を作ります。"],["40K","一匹の観察日誌","気になる一匹を決め、泳いだ道を配信で追ってスケッチします。"],["48K","水槽からの特集便","あなたが選んだ水景を紹介し、一緒に見つけたものを観察カードにまとめます。"]]],
  ["星図のリツ","方角に自信がなくて、星を見る前にいつもベランダの物干し竿を確かめます。竿の先がだいたい東。これがリツの観測所です。\n\n明るい星を一つノートに写して、部屋に戻ったら紙が逆さま。ひっくり返すと、星座がティーポットに見えました。今夜も正しい名前を調べる前に、僕らだけの呼び名を一つ考えませんか。曇りなら昨日のページを開きます。","ベランダ星結び","見つけた星を線で結んで、好きな形に見立てる集まりです。街の明かりで一つしか見えない夜は、その一つから始めましょう。",[["1K","一番星のご挨拶","名前を呼び、手描きの星を一つ掲げます。"],["5K","観測余白メモ","今日の空の色にお礼を添えて、星図の余白に書きます。"],["10K","点つなぎ星座印","好きなものの形を星で結び、名前入りアイコンにします。"],["20K","今夜の星座命名","スケッチの星の並びに、あなたの考えた呼び名を付けて紹介します。"],["30K","夜ふけの星図","選んだ星座で、アイコンと紺色の星図壁紙を描きます。"],["40K","星の道案内","見つけたい星座を一つ選び、目印になる星を配信で一緒にたどります。"],["48K","小さな観測会","思い出の夜を聞いてオリジナルの星座を描き、名前と物語を添えた星図を贈ります。"]]],
  ["りん風鈴","風鈴の音を録りたくて待っていると、私のおなかのほうが先に鳴ります。りんです。録音に残った二つの音を、今でも消せずにいます。\n\n去年、短冊を少し短くしたら、小さな風ではまったく動かなくなりました。余った紙を継ぎ足したら今度はよく鳴る。継ぎ目の青いテープが、風向きをいちばん見やすくしてくれます。窓辺から聞こえる音、枠で一つ交換しませんか。","軒下のひと鳴り","ガラスの音が消えたあとに、遠くで何が聞こえるでしょう。夕方の軒下で、暮らしの小さな音を拾うファミリーです。",[["1K","ひと鳴り祝福","名前を呼んで、ガラスの風鈴を一度鳴らします。"],["5K","短冊のお礼","涼しい一言を短冊に見立ててファミリーに書きます。"],["10K","ガラス玉の名札","好きな色の風鈴に、表示名の短冊を下げたアイコンを作ります。"],["20K","短冊の色合わせ","次に下げる短冊の色を二枚分選べます。"],["30K","窓辺の涼み絵","選んだ風鈴で、名前入りアイコンと夕方の窓辺の壁紙を描きます。"],["40K","音の聴き比べ","気になる二つの風鈴を選んで、一緒に響きの違いを聞きます。"],["48K","軒下の小さな演奏会","選んだ風鈴を順番に鳴らし、短冊の言葉とあなたの名前を記念画像に残します。"]]],
  ["ちいすけ木工","手のひらに乗る椅子を作っています。ちいすけです。小さく作るほどすぐ出来そうで、四本の脚を同じ長さにするだけでお茶が冷めます。\n\n昨日の椅子は右にかたかた。削り直そうとしたら、机の木くずを一粒払っただけでぴたりと止まりました。のこぎりを置いて飲んだ冷たいお茶のおいしいこと。配信では完成した家具の隣に鉛筆を並べます。大きさ、当ててみてね。","親指サイズの家具屋","豆イス、豆机、ときどき大きな失敗が並ぶ家具屋です。こんな部屋に置きたい、という空想の間取りを持ち寄ってください。",[["1K","豆イスを一脚","画面に小さな椅子を置き、名前を呼んで迎えます。"],["5K","木くず通信","今日削った木の色と、お礼の一言を投稿します。"],["10K","椅子の座面印","表示名を座面に描いた豆イスのアイコンを作ります。"],["20K","置き家具投票","次に作る部屋に置く家具を二案から選べます。"],["30K","豆部屋のしつらえ","好きな木の色で椅子のアイコンと小部屋の壁紙を作ります。"],["40K","家具屋の寸法会議","どんな人形を座らせたいか聞いて、ちょうどいい椅子をスケッチします。"],["48K","一脚の展示会","あなたが決めた配色で豆イスを仕上げ、展示札付きの記念写真にします。"]]],
  ["ハルの巻き戻し","フィルムを巻く音が好きで、撮るものを決める前に一歩踏み出すハルです。三十六枚のつもりで散歩を始めた日、残りはたった一枚でした。\n\n何を撮るか悩んでいるうちに夕方。結局、帰宅した私を玄関で待っていた泥だらけの長靴を写しました。弟いわく「今日いちばん遠くに行った靴」。現像したら、靴の横に私の影まで写っていて、二人分の散歩の写真になりました。","三十六枚の散歩道","残り一枚なら何を撮るか、おしゃべりしながら歩く写真部です。写真の外にあった音や匂いの話も持ち寄ってください。",[["1K","シャッターでお祝い","名前を呼んで、空のカメラでシャッター音を一回鳴らします。"],["5K","余白の撮影メモ","あなたが見つけた景色を一言聞き、日付入りのメモにします。"],["10K","フィルム枠アイコン","表示名と好きな色を入れたフィルム一コマ風アイコンを描きます。"],["20K","散歩の撮影テーマ","「丸いもの」など、次の散歩で探すテーマを決められます。"],["30K","光と影の二枚組","選んだ時間帯の色で、フィルム枠のアイコンと散歩道の壁紙を作ります。"],["40K","一枚の講評ごっこ","心に残った風景を聞いて、撮るならどこに立つか一緒に考えます。"],["48K","あなたに見せたい一枚","希望のお題で散歩中に一枚撮り、選んだ理由とお礼を添えて紹介します。"]]],
  ["縫い鳥チカ","刺しゅう枠の中に鳥を一羽ずつ増やしています。チカです。一羽目はくちばしが長すぎて、家族に「何を釣る鳥？」と聞かれました。\n\nほどこうとしたら、黄色い糸が少し残っていたので魚を足しました。今ではその一羽だけ、ちゃんと晩ごはんを持っています。配信中、針に糸が一発で通ったら小声で自慢します。拍手はちっちゃめでお願いします。","ひと針の止まり木","布の端に鳥が一羽とまれる余白を残す刺しゅう部です。糸の色に迷ったら、画面の向こうから隣に置きたい一色をどうぞ。",[["1K","止まり木の点呼","布の鳥を指先に乗せて、名前を呼びます。"],["5K","ひと針通信","その日のひと針とお礼を写真に添えて投稿します。"],["10K","小鳥の刺し印","好きな羽色の鳥に表示名を添えたアイコンを描きます。"],["20K","くちばし会議","次の鳥に何をくわえさせるか決められます。"],["30K","糸見本の壁紙","選んだ三色を使い、刺しゅう風アイコンと糸見本の壁紙を作ります。"],["40K","羽模様の相談室","好きな模様を聞き、布に写すための小さな図案を配信で描きます。"],["48K","一羽の巣立ち","希望の羽色で鳥を一羽刺し、完成した布を名前入りの写真カードにします。"]]],
  ["めじろ坂","双眼鏡のふたをしたまま「今日は暗いなあ」と言ったのは僕です。めじろ坂と呼んでください。鳥の姿を見失っても、枝が揺れるとつい目で追います。\n\n公園で小鳥を待っていたら、頭の上に木の実の皮が落ちてきました。真上を見たら、一番いい席で食事中。あれ以来、探すときは足元の食べあとも見ます。みんなの近所で聞こえる朝の声も教えてね。","木の実の観察席","電線の一羽も、公園のにぎやかな群れも歓迎する野鳥の話し場です。鳴き声をひらがなで書くと、人によって違うのが楽しみです。",[["1K","小鳥の朝礼","名前を呼び、今朝聞いた鳥の声をまねします。"],["5K","枝先だより","見かけた鳥と、お礼の一言を観察メモにします。"],["10K","木の実の小鳥印","選んだ木の実に小鳥と表示名を添えたアイコンを描きます。"],["20K","声の書き取り","好きな鳴き声を教えてもらい、配信でひらがなに写します。"],["30K","林の色見本","好きな季節の枝を選んで、小鳥のアイコンと林の壁紙を作ります。"],["40K","野鳥の見つけ方会議","見かけた鳥の仕草を聞いて、次に観察したいところを一緒に探します。"],["48K","一羽の観察特集","選んだ鳥の姿と仕草をスケッチし、お礼付きの観察カードにまとめます。"]]],
  ["クミン係サジ","スパイスのふたを開けるたび、目を閉じて当てっこします。サジです。昨日は自信満々に「これはクミン」。目を開けたら空き瓶に移した紅茶でした。\n\nカレーを仕込む日は、香りが変わるたびに台所のドアを開けます。廊下の弟が何回目で「今日カレー？」と気づくかが、うちの味見の前半戦。後半は鍋底をパンでぬぐう係の取り合いです。","三つまみの台所","スパイスをひとつまみ選んで、鍋から立つ香りを言葉にする台所です。辛さが苦手な人の、甘い付け合わせ案も待っています。",[["1K","スプーンを鳴らして乾杯","木のさじを軽く合わせて名前を呼びます。"],["5K","香りの献立メモ","今日の一瓶と、あなたへの短いお礼を投稿します。"],["10K","スパイス瓶のラベル","選んだスパイスの瓶に表示名を入れたアイコンを作ります。"],["20K","付け合わせ投票","次のひと皿に添える野菜を二種類から選べます。"],["30K","三色のスパイス棚","好きな三色でラベルアイコンとスパイス棚の壁紙を描きます。"],["40K","一皿の香り相談","好きな野菜を聞き、合わせたいスパイスを一つ提案します。"],["48K","サジの小さな試食会","希望の香りを軸に一皿作り、味見の感想と配合を記念カードにします。"]]],
  ["ふね折りユウ","折り紙を船にすると、左右のふくらみが毎回少し違います。折った本人より先に船が行き先を決めてる。ユウです。\n\n水を張った洗面器に青と赤を浮かべたら、スタートと同時に二隻とも同じ縁へ。競争のつもりが仲良く入港でした。配信の机には小さな港があります。好きな色の紙を一枚言ってくれたら、今夜の船団に加えます。","雨あがり造船所","紙一枚から船を折り、洗面器の港で見送る造船所です。船長の名前も積み荷も空想でどうぞ。雨の日は船がよく増えます。",[["1K","出航の号令","名前を呼んで、紙の船を一隻浮かべます。"],["5K","船長への電報","あなたに向けて、港から短いお礼の電報を書きます。"],["10K","船印アイコン","好みの船体色と表示名で、紙の船のアイコンを作ります。"],["20K","積み荷の注文","次の紙船に載せる空想の荷物を一つ決められます。"],["30K","港の配色セット","選んだ二色の船で、アイコンと船団の壁紙を描きます。"],["40K","命名進水式","あなたが名付けた船を折り、配信で最初の航海を見届けます。"],["48K","造船所の記念航路","希望の色の船で小さな港を巡り、寄港地とお礼を航路図に残します。"]]],
  ["針音ノノ","レコードをひっくり返す係が好きなノノです。曲と曲の間の小さな音まで覚えていて、同じ曲をよそで聴くと、来るはずの「ぷつっ」を待ってしまいます。\n\nある晩、盤を返して針を下ろすと、さっきと同じ曲。盤を持ったまま私の体だけが半周していました。最近は片面が終わるたび、休憩のお茶もいっしょにおかわりします。針を戻すまで、どんな話をしましょうか。","片面だけの試聴室","ジャケットの色やレコード屋で迷った一枚を話す部屋です。「曲名は忘れたけど表紙が赤い」からでも、一緒に棚をめくれます。",[["1K","針を上げてご挨拶","名前を呼び、今夜の試聴室の席にお迎えします。"],["5K","盤の内袋メモ","心に残ったコメントを内袋のメモ風に書いてお礼を伝えます。"],["10K","センターラベル","盤の中心に表示名を入れたアイコンを作ります。"],["20K","ジャケットの色選び","架空の一枚のジャケットに使う二色を選べます。"],["30K","架空盤の装丁","考えた盤名で、ラベルアイコンとジャケット風の壁紙を作ります。"],["40K","片面ぶんの選曲会議","好きな時間帯に合う曲順を話し合い、配信で選んだ理由を紹介します。"],["48K","今月の一枚を飾る会","あなたとの会話を架空のアルバムに見立て、曲目とお礼入りのジャケット画像にします。"]]],
  ["ぬか床ふみ","ただいまの次にぬか床をのぞくふみです。昨日入れたきゅうりが一本足りなくて、家族に聞いてみたら、隅からナスが二本。昨日の自分の記憶が浅漬けでした。\n\n朝の皿には、その日いちばんよく漬かった一切れを真ん中に置きます。見分けるのが上手な祖父は、必ずその真ん中から。配信でも今日のひと切れを発表します。白いごはんの準備はお好みで。","夜な夜な漬けもの帳","漬けた野菜と食べどきの話をする食卓です。好きな切り方や、お弁当で最後まで取っておく一切れの話もどうぞ。",[["1K","ひと切れのお迎え","今日の小皿を見せて、名前を呼んで迎えます。"],["5K","漬けもの帳の一筆","野菜の漬かり具合と一緒に、お礼を一行書きます。"],["10K","小皿の漬けもの印","好きな野菜をのせた名前入り小皿アイコンを作ります。"],["20K","明日の一本選び","次に漬ける野菜を、手元の二種類から選べます。"],["30K","ごはんのおとも柄","選んだ漬けもので、小皿のアイコンとお膳の壁紙を描きます。"],["40K","切り方くらべ","選んだ野菜を二通りに切り、食感の違いを配信でお伝えします。"],["48K","ふみの定食会","あなたの好きなおかずに合わせて漬けものを選び、お品書きとお礼を画像にします。"]]],
  ["かかと拍子レン","信号待ちにつま先で拍を取って、青になった瞬間だけ一拍遅れるレンです。タップの練習場では床がよく響くので、靴を脱いで歩くと自分が消えたみたい。\n\nある日、間違えた一歩に先生が同じ音を返してくれました。失敗が掛け合いに変わったのが面白くて、今は配信でもコメントの言葉を靴音にしています。「た・だ・い・ま」は四歩でどうぞ。","靴音の練習室","机を指で叩いても参加できるリズムの部屋です。名前の拍数、駅の放送、雨だれの間隔。日常の音をステップにしてみます。",[["1K","靴音のお返事","あなたの名前のリズムをタップで返します。"],["5K","一行のリズム譜","お礼の言葉を短いリズム譜にして投稿します。"],["10K","タップ靴の名札","選んだ靴ひもの色で、名前入りの靴アイコンを描きます。"],["20K","言葉を一歩に","好きな短い言葉をリクエストして、その場で足音にできます。"],["30K","足跡のペア画像","靴のアイコンと、足跡が続く練習室の壁紙を作ります。"],["40K","二小節の掛け合い","手拍子でまねしやすい二小節をあなた向けに作って演じます。"],["48K","足音だけの短編","あなたが選んだ場面を靴音で演じ、使ったステップを記念の譜面に残します。"]]],
  ["けずり葉ミナ","石けんから葉っぱを一枚削り出すミナです。薄くすれば本物らしくなると思って攻めすぎた日、手の中に残ったのは葉っぱ形の穴でした。\n\nちいさな削りくずは泡立てネットへ。作品より先に、手洗いの泡が立派になります。好きなのは葉脈を一本だけ入れる瞬間。そこまでただの緑のかけらだったものが、急に庭から拾ってきた顔をするんです。","香る石けん工房","香りの違う石けんを削って、花や葉の形を見つける机です。うまく欠けた端っこにも、何に似ているか名前を付けてください。",[["1K","葉っぱを一枚","削った葉を一枚見せ、名前を呼んで挨拶します。"],["5K","かけらのお礼便","今日の削りくずの形に見立てを添え、お礼を投稿します。"],["10K","葉脈のサイン","好きな葉と表示名を組み合わせたアイコンを作ります。"],["20K","次の葉選び","丸い葉か細長い葉から、次に彫る形を選べます。"],["30K","香り色の二枚組","好きな石けんの色で、葉のアイコンと泡模様の壁紙を描きます。"],["40K","一枚葉の実演","選んだ葉が石けんから現れるまでを配信でゆっくり削ります。"],["48K","庭の小さな標本","あなたが選んだ葉を二種類彫り、並べた写真に手書きのお礼を入れます。"]]],
  ["よりみちペダル","上り坂だけやたらと景色に詳しいペダルです。休むたびに道端を眺めるので、タンポポの多い場所なら任せてください。\n\n川沿いのベンチでパンを食べていたら、行きに追い越された人が反対から戻ってきました。「もう一周？」「いえ、帽子を取りに」。同じ道を二度走った人しか知らない花の場所を教えてもらいました。今日の配信は、そこの花が咲いた話から。","自転車と坂の下","速さを競う日はお休み。坂の下のパン屋や、橋を渡るときの風など、自転車を止めて見つけたものを話す休憩所です。",[["1K","ベルをひと鳴り","自転車のベルを鳴らして名前を呼びます。"],["5K","休憩所メモ","今日の寄り道とあなたへのお礼を地図の余白風に書きます。"],["10K","ペダルの車体札","好みのフレーム色に表示名を添えたアイコンを描きます。"],["20K","寄り道の目印","次の散歩で探す目印を、花や橋などから一つ選べます。"],["30K","川沿いの車輪柄","選んだ自転車のアイコンと川沿いの道の壁紙を作ります。"],["40K","空想コース相談","走りたい景色を三つ聞いて、休憩多めの空想コースを描きます。"],["48K","一日サイクリング便","選んだ季節の景色をたどるお話を配信で紹介し、名前入りコース図を贈ります。"]]],
  ["糸ひきポル","人形の右手を上げたつもりが、自分の右肩だけ上がっているポルです。糸を引く手に力が入ると、舞台の上より私の顔のほうがよく動きます。\n\nこの前、人形がおじぎの途中で帽子を落としました。客席から「拾ってあげて！」の声。予定にない帽子拾いがその日のいちばん大きな拍手でした。今夜も台本の端を少し空けて待っています。","小さな人形舞台","手のひらサイズの舞台で、人形にしてほしい仕草やひと言を募ります。幕が下りたあとには、糸が絡まった舞台裏の話も少し。",[["1K","小さな役者のおじぎ","人形が名前を呼んで、舞台の真ん中でおじぎします。"],["5K","楽屋からのお礼","人形役の口調で、あなた宛ての一言を投稿します。"],["10K","木の役者の肖像","好きな帽子の色で名前入り人形アイコンを描きます。"],["20K","仕草の演出家","手を振る、椅子に座るなど一つの仕草をリクエストできます。"],["30K","幕の内ポスター","人形のアイコンと、好きな幕色の公演ポスター風壁紙を作ります。"],["40K","即興の台詞合わせ","短い台詞を一つ聞き、その言葉に合わせて人形を動かします。"],["48K","あなたのための一幕","希望の場面で短い人形劇を演じ、名前を載せた記念の演目表を贈ります。"]]],
  ["ひなた時針","晴れた昼だけ働く時計を持って歩いています。ひなたです。日時計を出した途端に曇って、隣の人に腕時計を見せてもらうのがいつもの流れ。\n\n公園の同じベンチで、先月は手のひらまで届いていた木陰が、今日は膝まで来ていました。針より長いものさしがここにある。今はお弁当を開ける前に、影の先をノートに一本引くのが楽しみです。","影を読む昼休み","昼の影を眺めてひと休みする場所です。いつもの道で影が犬に見えた話も、日なたを見つけて座った話も聞かせてください。",[["1K","影の点呼","名前を呼んで、机の上で影絵の時計を動かします。"],["5K","日なたの一行","昼に見つけた影とあなたへのお礼を一緒に書きます。"],["10K","真鍮色の時計印","選んだ時刻を指す日時計に表示名を入れます。"],["20K","影を落とすもの","次の影遊びに使う道具を二つから選べます。"],["30K","午後の影セット","好きな時刻の影を描いたアイコンと壁紙を作ります。"],["40K","影の長さ比べ","以前の観察帳から同じ場所を選び、季節で影が変わる様子を紹介します。"],["48K","昼休みの観測帖","選んだ身近なものの影を時間を変えて記録し、あなた宛ての観測帖画像にします。"]]],
  ["便箋すみれ","便箋を選ぶ時間がいちばん長いすみれです。いい紙を買って大事にしまい、結局お礼をスーパーのレシートの裏に下書きしたことがあります。\n\n友だちに「追伸がいちばん好き」と言われてから、書き終わりに少し余白を残します。今日の追伸は、ポストまでの三分の間に一匹の犬と二回会ったこと。あちらもお手紙を出しに来たのかな。","ポストまで三分","最初の「お元気ですか」から追伸まで、手紙の言葉を持ち寄ります。面と向かうと照れるひと言を下書きする場所にもどうぞ。",[["1K","封を切るご挨拶","名前を呼んで、あなたへの短い挨拶を読みます。"],["5K","追伸のお便り","その日の小さな出来事を追伸にしたお礼を書きます。"],["10K","切手風アイコン","好きな花の図柄に表示名を添えて切手風に描きます。"],["20K","書き出しの注文","「久しぶり」など場面を一つ選び、手紙の書き出しを考えます。"],["30K","封筒と便箋の組","選んだ紙色で切手風アイコンと便箋の壁紙を作ります。"],["40K","三行のお手紙","今の気分を聞いて、あなたに向けた三行の手紙を配信で読みます。"],["48K","追伸つき朗読便","好きな季節を題材に一通書いて読み上げ、日付と追伸を入れた手紙画像を贈ります。"]]],
  ["硝子のルカ","窓辺に吊った小さなステンドグラスが、午後だけ壁に青い四角を作ります。ルカです。それを見た猫は何度やってもつかまえられません。\n\nガラスを選ぶときは一枚ずつ明かりにかざします。箱の中では地味だった灰色が、透かすと海の浅瀬みたいな緑。うれしくて買って帰ったら、作りかけの灯台より海のほうが大きくなりました。次はその海に似合う窓を作ります。","色窓アトリエ","同じ一枚を朝と夕方に透かして、色がどう変わったかを話す窓辺です。光にかざしたくなる色をひとつ持ってきてください。",[["1K","光のご挨拶","名前を呼び、窓辺に今日のガラスを一枚かざします。"],["5K","小窓からの一筆","壁に映った色にお礼を添えて投稿します。"],["10K","色ガラスの名札","好みの二色で表示名入りの窓アイコンを描きます。"],["20K","窓枠の色選び","次の小窓の中心に置くガラスを二枚から選べます。"],["30K","朝夕の色窓","同じ図案を朝と夕方の配色にしたアイコンと壁紙を作ります。"],["40K","窓の図案相談","好きな風景を聞いて、数枚のガラスで表せる窓に描き直します。"],["48K","あなたの光の見本帳","選んだ配色の小窓を光に透かし、映った影と一緒に記念画像にします。"]]],
  ["ペン先イオ","万年筆のインクが乾く前にノートを閉じる名人、イオです。右ページの月が左にも写って、思いがけず双子の月になりました。\n\n青いインクを三瓶並べると、家族は「全部同じ」。白い紙に一滴ずつ置くと、乾いた縁だけ紫になるのが一本あります。そこを見てもらいたくて、今日はノートを開いたまま待ちます。乾くまで、あなたの好きな青の話を聞かせて。","インク乾燥中","書いた直後と乾いたあとの色を見比べる机です。雨の前の青や、洗いたてのシャツの白など、身近な色に名前を付けて遊びます。",[["1K","ペン先のご挨拶","今日のインクで名前を書き、声に出して迎えます。"],["5K","乾き待ちメモ","お礼のひと言を書き、乾いたあとの色を写真で載せます。"],["10K","インク瓶の標本","選んだ色の瓶に表示名を添えたアイコンを作ります。"],["20K","色の命名係","試し書きしたインクにあなたの考えた愛称を付けて紹介します。"],["30K","濃淡の二枚組","好きな一色で、インク瓶アイコンと濃淡を楽しむ壁紙を作ります。"],["40K","二本の書き比べ","選んだ言葉を二種類のインクで書き、紙の上で違いを比べます。"],["48K","一色の見開き","あなたが付けた色名を軸に短文と模様を描き、お礼入りの見開き画像を贈ります。"]]],
  ["豆挽きガク","朝いちばんに豆を挽くと、廊下の向こうでスリッパの音がします。うちの目覚まし係のガクです。飲む人より先に香りが起きるのが、コーヒーのいいところ。\n\n手回しミルの音が急に軽くなって「もう挽けた？」と思ったら、豆を入れたのは隣の保存瓶。静かすぎる朝でした。それ以来、ふたを開けたらまず一粒、手のひらで色を見ます。","一杯目の焙煎室","焙煎した豆を見比べ、冷めるまでの一杯を味わう部屋です。「湯気がパンみたい」など、飲んで浮かんだ言葉でどうぞ。",[["1K","一杯目の乾杯","マグを掲げて、名前を呼んでお祝いします。"],["5K","豆袋のお礼札","今日の焙煎具合と一言を、豆袋の札風に書きます。"],["10K","ミルの店印","好きな取っ手の色で、名前入りのミルアイコンを作ります。"],["20K","朝のおとも選び","次の試飲に添える甘いものを二案から選べます。"],["30K","珈琲棚のセット","好みのマグを描き、豆袋のアイコンと珈琲棚の壁紙にします。"],["40K","香りの実況席","二種類の豆から一つ選び、挽く前と挽いた後の香りを言葉で伝えます。"],["48K","一杯の喫茶便","あなたの理想の朝を聞き、一杯とお茶うけを選んで名前入りメニューにします。"]]],
  ["ベルのナナ","机にベルを並べるとき、いつも一つだけ手前に出します。ナナです。よく使う音だから、と言いたいけど、私の腕がちょっと短いだけです。\n\n練習中に家のチャイムが鳴った日、うっかり次の一音を合わせてしまいました。玄関に出たら配達の方が「曲の途中でした？」。最近は音を止める瞬間も聴きどころ。余韻が消えたら、コメントをゆっくり読みます。","七つの余韻","ハンドベルの音のしっぽまで聴く部屋です。一音だけ鳴らす日も、机を指で軽く叩いていっしょに拍を取ってください。",[["1K","一音のお祝い","名前を呼び、今日のベルを一つ鳴らします。"],["5K","余韻のお礼状","鳴らした音の名前とお礼を一行にして投稿します。"],["10K","ベルのリボン印","選んだリボン色で、名前入りベルアイコンを描きます。"],["20K","はじまりの音選び","次の即興の最初の一音を三つのベルから選べます。"],["30K","余韻の色セット","好きな音を色に見立て、ベルのアイコンと音の輪の壁紙を作ります。"],["40K","三音の呼びかけ","あなたの名前の響きから三つの音を選んで鳴らします。"],["48K","七音の小公演","好きな風景をお題に短い旋律を演奏し、その音を並べた記念カードを贈ります。"]]],
  ["貝がら汐音","貝殻を拾う日より、砂を落とす日のほうが長い汐音です。小箱の引き出しを開けると、ちゃんと掃除したはずの底でもまだ少しじゃりっとします。\n\n桜色の貝を探した日に持ち帰ったのは、穴がひとつ開いた白い貝。穴からのぞいた海があまりに小さくて、かえって広く感じました。配信では小箱をひとつ開けます。どの浜だったか、その日の風からお話しします。","浜辺の小箱","浜辺で見つけた形や色を持ち寄る小箱です。拾わず眺めた貝の話も、砂に残った鳥の足跡の話も聞かせてください。",[["1K","貝皿のご挨拶","小箱から一枚選び、名前を呼んで見せます。"],["5K","波打ち際の一筆","今日の貝の模様を言葉にして、お礼を添えます。"],["10K","巻き貝の名札","好きな縞の色と表示名で貝殻アイコンを作ります。"],["20K","小箱の展示替え","次に紹介する引き出しを、巻き貝か二枚貝から選べます。"],["30K","浜色の標本紙","選んだ貝で、名前入りアイコンと砂色の標本壁紙を作ります。"],["40K","穴からのぞく海","気になる一枚を選び、その貝を拾った日の海の話をします。"],["48K","あなただけの浜小箱","希望の三色に合う貝を並べ、手書きの標本札とお礼を入れた写真にします。"]]],
  ["影うさモク","部屋の明かりを一つだけ残すと、白い壁が舞台になります。モクです。手で作るうさぎは得意。犬は何度やっても、耳の短いうさぎに見えます。\n\n弟に頼んだら、その犬にもう一本、しっぽの影を足してくれました。一人の手だけでは作れなかった犬が、壁の端を走っていった夜です。配信では影を動かしてから答え合わせ。違うものに見えたら、それも役に加えます。","白い壁の劇場","影の形に台詞を付ける小さな劇場です。うさぎがコップに見えたら、その日はコップが主人公になるかもしれません。",[["1K","影うさぎのおじぎ","壁のうさぎがあなたの名前でおじぎします。"],["5K","幕間のひと言","今日の役の口調で、お礼をファミリーに書きます。"],["10K","影の横顔アイコン","選んだ動物の影に表示名を添えて描きます。"],["20K","壁の配役係","次の影絵に出す生き物を二匹から選べます。"],["30K","夕闇の舞台セット","好きな背景色で、影のアイコンと幕が開いた壁紙を作ります。"],["40K","影の動物当て","あなたに向けて三つの影を演じ、答えを配信で一緒に確かめます。"],["48K","ひと晩の影芝居","選んだ主人公で短い影芝居を作り、最後の一場面を名前入りの画像に残します。"]]],
  ["つる豆マメ","鉢の豆がつるを伸ばした朝は、私より先に背筋が伸びています。マメです。支柱を立てた翌日、つるが選んだのは隣のじょうろの取っ手でした。\n\nほどくのが惜しくてそのままにしたら、水やりのたびに別のコップを使う生活に。ようやく最初のさやがふくらんだので、じょうろにはもう少し休んでもらいます。小さな畑の珍事件、枠で聞いていってね。","ベランダ一畳畑","ベランダの鉢に変化があったら報告する、一畳ぶんの畑です。芽が出ない日も土の匂いや朝の光の話をどうぞ。",[["1K","双葉のお迎え","名前を呼び、いちばん新しい葉を画面に映します。"],["5K","畑札のお便り","日付と葉っぱの枚数に、お礼を一行添えます。"],["10K","豆の種袋アイコン","好きな豆色と表示名で種袋風アイコンを作ります。"],["20K","支柱の飾り選び","次の支柱に付ける目印の色を選べます。"],["30K","つるの成長セット","芽のアイコンと、つるが伸びた壁紙をおそろいで描きます。"],["40K","豆の身長測定","気になるつるを一つ選び、前の記録と長さを比べます。"],["48K","一鉢の成長アルバム","あなたが選んだ鉢の記録を見返し、芽から今までを名前入りの一枚にまとめます。"]]],
  ["万華鏡ネネ","万華鏡をそっと戻して、さっきの模様を探してしまうネネです。同じところまで回したはずなのに、赤い欠片ひとつがまるで言うことを聞きません。\n\n祖母はのぞくたびに「梅の花」。私は「雪の結晶」。筒を渡す途中でほんの少し回るから、二人が見たのは案外どっちも正解かも。配信では、目を離したくない瞬間だけ手を止めて、みんなと模様の名前を考えます。","筒のむこうの模様室","一回だけの模様をのぞいて、何に似ているか言い合う部屋です。花にも星にも見える日は、呼び名がいくつ増えても大歓迎。",[["1K","ひと回しのご挨拶","あなたの名前を呼び、万華鏡を一度回して見せます。"],["5K","模様の名札便","今日見えた形にタイトルを付け、お礼と一緒に書きます。"],["10K","欠片の花アイコン","選んだ二色を使い、表示名入りの模様を描きます。"],["20K","のぞき窓の色選び","次に筒へ入れる色の欠片を二案から選べます。"],["30K","回転模様の二枚組","好きな配色で、花模様のアイコンと星模様の壁紙を作ります。"],["40K","一回転の命名会","あなたと三つの模様を見立て、それぞれに呼び名を付けます。"],["48K","小さな万華鏡展","希望の色で見つけた模様を三枚並べ、あなたの選んだ展名入りの記念画像にします。"]]],
  ["よこ糸ヒナ","木のシャトルを右へ左へ。途中で呼ばれるとどちらへ渡したか忘れるヒナです。忘れたときは糸の端を見ます。手より糸のほうが、ちゃんと続きを覚えています。\n\n余り糸で織ったコースターに、一段だけ太い青を入れました。そこにコップを置くと小さな水平線みたい。今日はその続きに何色の空を織ろうか、窓の色を見ながら決めます。","機織りの窓際","縦糸と横糸で見える色が変わるのを楽しむ窓際です。好きな服のしま模様や、余り糸の使い道の話も持ち寄ってください。",[["1K","ひと往復の挨拶","名前を呼び、シャトルを一往復させます。"],["5K","織り端のお礼","今日織ったところを一枚写し、お礼を添えます。"],["10K","しま模様の織り札","好きな二色を交互にした名前入りアイコンを作ります。"],["20K","次の一本","見本織りに加える横糸を手元の糸から選べます。"],["30K","窓際の織物セット","選んだ縞で、アイコンと布目模様の壁紙を作ります。"],["40K","配色の試し織り","好みの二色の順番を変え、見え方を配信で比べます。"],["48K","あなただけの織り見本","選んだ糸で小さな見本を織り、配色とお礼を添えた記念写真にします。"]]],
  ["ホールド志乃","ボルダリングの壁を下から見ているときだけ、するする登れる気がする志乃です。実際に足を掛けると、さっきの名案が一段目で消えます。\n\n届かない青い石を前に、隣の人が「右足を先に」。その通りにしたら、指一本ぶん遠かった場所が急に目の前に来ました。以来、うまくいった日も練習帳には足の絵を描きます。配信はマットに降りてから、両手を空けて。","壁ぎわ反省会","登ったあとに座って、今日できた一手を言葉にする場所です。初めて靴を履いた日の話も、見ていて面白かった動きもどうぞ。",[["1K","マットでハイタッチ","配信で名前を呼び、画面越しにハイタッチします。"],["5K","一手ぶんの記録","あなたが今日できたことを、練習帳に一行残します。"],["10K","ホールドの名札","好きな色のホールドに表示名を添えたアイコンを描きます。"],["20K","ルートの名前係","手描きの空想ルートに、あなたが考えた名前を付けます。"],["30K","壁ぎわの配色セット","選んだ三色で、靴のアイコンとホールド柄の壁紙を作ります。"],["40K","一手の振り返り","練習で迷った一場面を図にして、足をどこに置いたか一緒にたどります。"],["48K","達成記念のルート図","最近できるようになったことを聞き、その道のりを名前入りの壁の絵にします。"]]],
  ["パンケキ日和","一枚目は味見、二枚目が本番と言い続けている日和です。一枚目のほうがきれいに丸く焼けた日も、もちろん味見の約束は守ります。\n\nブルーベリーをひと粒だけ落としたら、生地が流れて端っこに寄りました。ひっくり返したら、小さな島に灯台が一つ。以来、丸く焼けない日は地図にします。今日のフライパンはどんな島になるかな。","二枚目のフライパン","フライパンの上に小さな島を焼く台所です。のせたい果物や、バターが溶ける前にまず何をするか聞かせてください。",[["1K","焼きたての一枚","名前を呼んで、フライ返しを掲げてお祝いします。"],["5K","味見係のひとこと","今日の焼き色とお礼を味見メモにします。"],["10K","丸い島のアイコン","好きな果物を一つのせた名前入りパンケーキを描きます。"],["20K","トッピングの指名","手元の果物から次の一粒を選べます。"],["30K","朝のプレートセット","選んだ果物で、アイコンと朝食のお皿の壁紙を作ります。"],["40K","島の命名会","焼き上がった一枚の形を見て、あなたと島の名前を考えます。"],["48K","特製パンケーキ地図","希望の具材で一枚焼き、地名とお礼を書き入れた島の写真にします。"]]],
  ["駅印カイ","駅スタンプを押す瞬間だけ、乗り換え案内より真剣な顔になるカイです。押した後はインクが乾くまでホームの端で待ちます。\n\n一駅ぶん時間が空いたので降りた町で、スタンプの絵と同じ橋を見つけました。紙では親指ほど、実際に渡ると風が強くて両手で帽子を押さえる長さ。旅のノートには、きれいに押せた印より、その横の「帽子注意」が光っています。","途中下車のインク台","駅で押した印から、その町で見た景色を思い出す待合室です。降りたことのない駅の名前で旅程を想像する日もあります。",[["1K","改札外のご挨拶","名前を呼び、手作りの記念印を紙に押します。"],["5K","途中下車の一行","思い出の駅とお礼を乗車メモ風に書きます。"],["10K","架空駅の駅印","好きな景色と表示名で架空の駅印アイコンを描きます。"],["20K","待合室のお題","海辺か山あいから、次に話す途中下車のテーマを選べます。"],["30K","旅帳の見開き","選んだ架空駅の印と、切符を並べた旅帳の壁紙を作ります。"],["40K","駅から散歩会議","好きな景色を聞いて、駅から歩く空想の半日を一緒に組み立てます。"],["48K","あなたの駅開業式","架空駅に名前を付け、記念印と最初の一本の時刻を入れた開業カードを贈ります。"]]],
  ["にじみ藍","水彩紙を傾けすぎて、描いたはずの湖が画面の外へ流れていきました。藍です。以来、机の端に置くタオルまで青い模様だらけです。\n\n乾く途中の絵を見ていたら、うっかり落とした一滴が、夕焼けの中の小さな月になりました。筆を足したくなるのを我慢して、そのまま窓辺へ。今夜はその一枚を立てて、乾くまでのおしゃべりをします。","水彩の乾くまで","水に任せた色の広がりを眺める絵の具箱です。きれいに混ざったところも、意外な色になったところも、一緒にのぞきましょう。",[["1K","筆ひとさしの挨拶","名前を呼び、白い紙に一色だけ落とします。"],["5K","絵の具皿のお礼","今日混ざった色に、お礼の言葉を添えて投稿します。"],["10K","水の輪アイコン","好きな色のにじみに表示名を入れてアイコンにします。"],["20K","混色の二色選び","次に紙の上で出会わせる色を二つ選べます。"],["30K","水彩の朝と夜","同じ色を薄く、濃く使ったアイコンと壁紙を作ります。"],["40K","偶然の絵の見立て会","にじんだ形に何が見えるか聞いて、その場で数本だけ線を足します。"],["48K","一滴からの風景画","あなたが選んだ一色から小さな景色を描き、お礼と題名を入れた画像にします。"]]],
  ["角ピース岳","ジグソーパズルは角から組む派の岳です。青空ばかりの箱を開けると「なんでこれを選んだ」と思うのに、店に行くとまた青空の箱を抱えています。\n\n最後の一片が見つからず、家中を探した夜。机に戻るとシャツの袖からぽとり。青空が僕にくっついて散歩していたわけです。配信で「今日はここまで」と言ったあとに一個はまると、閉店時間はちょっと延びます。","最後の一片倶楽部","一つはまったら一緒に喜ぶパズルの机です。箱絵から最初に探すものや、ずっと何かに見えてしまう変な形を教えてください。",[["1K","ぴたりの拍手","名前を呼び、二つのピースを合わせてお祝いします。"],["5K","進捗の一片便","今日つながったところを、お礼と一緒に載せます。"],["10K","角ピース名札","好きな色の角ピースに表示名を入れます。"],["20K","最初の一角","次の箱でどの景色から組むか選べます。"],["30K","箱絵のかけらセット","選んだ景色でピースのアイコンと箱絵風の壁紙を描きます。"],["40K","一片探しの実況","気になる模様を一つ決め、一緒に画面から手掛かりを探します。"],["48K","完成日の箱絵","好きな風景をオリジナルのパズル絵にして、名前と完成記念日を添えます。"]]],
  ["窓レモン香歩","鉢植えのレモンに初めて実がついた日、香歩家では家族全員で記念写真を撮りました。主役は真ん中の小さな緑の丸。写真を見た友人は全員「どこ？」。\n\n黄色くなったら紅茶に入れよう、皮はお菓子にしよう、と予定だけが実より先に育ちます。配信の日には鉢を少し回して、いちばん光の当たるほうをお見せします。今年の実が見つかったらこっそり合図してね。","鉢植えレモン便り","小さな鉢の季節を一緒に見守る窓辺です。新しい葉の色や柑橘の香りなど、今日ひとつ気付いたことを持ち寄ります。",[["1K","窓辺の乾杯","レモン色のマグを掲げ、名前を呼びます。"],["5K","鉢からの近況便","いちばん変わった枝を一つ選び、お礼と一緒に書きます。"],["10K","輪切りの名札","好きな地色で、表示名入りのレモンアイコンを作ります。"],["20K","鉢札の色選び","次に挿す鉢札の色を二案から選べます。"],["30K","花と実の二枚組","白い花のアイコンと、黄色い実の壁紙をおそろいで描きます。"],["40K","一枝の観察会","選んでもらった枝の写真を見比べ、花から実までをたどります。"],["48K","窓辺の収穫だより","好きな食べ方を聞き、鉢の成長記録と架空の収穫メニューを一枚にまとめます。"]]],
  ["ハモニカ都","ハーモニカを吹く前に深呼吸して、最初の音が吸う音だったと思い出す都です。息の行き先まで楽譜に小さな矢印を書いています。\n\nいつもの河原で練習していたら、犬が曲の切れ目に一回だけ鳴きました。入り方があまりにいいので、今もその小節だけ相方を待っています。枠では短い合図から吹きます。ひと息つきたいときに来てください。","ポケットの前奏","ポケットに入る楽器と、呼吸ひとつ分の旋律を楽しみます。口ずさめる短いフレーズや、散歩中に聞いた音を持ち寄ってください。",[["1K","一息のファンファーレ","名前を呼び、ハーモニカでお祝いの合図を吹きます。"],["5K","ポケットのお礼譜","今日の一言と短い音の並びをファミリーに書きます。"],["10K","銀の楽器ケース","好きな裏地の色で名前入りケースアイコンを描きます。"],["20K","前奏の気分選び","明るく、のんびりなど次の即興の気分を選べます。"],["30K","音色の散歩道","選んだ気分で、ハーモニカのアイコンと河原の壁紙を作ります。"],["40K","名前の呼吸合わせ","あなたの呼び名を短い旋律にして、息継ぎの場所まで演奏します。"],["48K","ポケットからの小曲","好きな帰り道の景色を即興曲にし、曲名と運指メモを添えたカードを贈ります。"]]],
  ["ランタンの岳人","キャンプで最初に広げるのは椅子、最後までしまえないのはランタン。灯りの下でもう一杯お茶が飲みたくなる岳人です。\n\nテーブルに二つの明かりを置いたら、マグの取っ手から影が二本伸びました。向かいの友だちが「これ、うさぎ」。山から帰った今も、そのマグを使うたびに机の上の小さな野営地を思い出します。今夜は部屋で灯り番です。","灯り番のテーブル","夜のテーブルを囲むつもりで、キャンプの晩ごはんや片づけたくない道具の話をします。家でマグをひとつ持ってくるだけでもどうぞ。",[["1K","点灯のお迎え","ランタンを灯し、名前を呼んで席へお迎えします。"],["5K","灯り番の当直メモ","今夜の飲み物と、お礼のひと言を投稿します。"],["10K","ランタンの灯印","選んだ灯りの色に表示名を添えたアイコンを作ります。"],["20K","夜更けの一杯選び","次のテーブルに置くお茶を二種類から選べます。"],["30K","灯るテーブル柄","マグの色を聞いて、ランタンのアイコンと夜の壁紙を描きます。"],["40K","机上キャンプ会議","持っていきたい道具を三つ聞き、理想の夜のテーブルを組みます。"],["48K","灯り番の貸切席","希望の夜景に合わせて机をしつらえ、灯した瞬間を名前入りの写真にします。"]]],
  ["びいどろコロ","ビー玉を机に並べると、どんなに平らに見えても青い一個だけ右へ旅立ちます。コロです。おかげで机の傾きには誰よりも詳しくなりました。\n\n祖父にもらった透明な玉を窓にかざすと、向かいの家が逆さになります。昔の家にあったのと同じ玉なのに、引っ越すたび中に別の町が映る。えらく小さな引っ越しアルバムです。今日はどの色から転がしましょう。","坂道ビー玉店","ビー玉の縞や、玉越しに逆さに見える景色を楽しむお店です。転がした音に懐かしい遊びを思い出したら聞かせてください。",[["1K","ころんとご挨拶","選んだ一個を木皿に転がし、名前を呼びます。"],["5K","硝子玉のお便り","今日見えた逆さの景色にお礼を添えます。"],["10K","渦巻き玉の名札","好きな二色を巻いた名前入りビー玉アイコンを作ります。"],["20K","本日の一番走者","短い坂を最初に転がす玉を選べます。"],["30K","光の玉セット","選んだ玉で、アイコンと色の影が広がる壁紙を描きます。"],["40K","坂道の音くらべ","木と紙など二つの坂で、同じ玉の音を一緒に聞き比べます。"],["48K","小さな町の硝子写真","希望の色の玉に窓辺の景色を映し、あなたの付けた題名で写真カードを作ります。"]]],
  ["継ぎ目キン","欠けた器を直すとき、つい元の形そっくりに戻したくなります。キンです。けれど初めて継いだ鉢は、金色の細い線がいちばんよく見える向きで棚に置いています。\n\n友だちに「川みたい」と言われてから、枝分かれしたところに橋まで見えてきました。中にみかんを一つ置くと、川沿いの夕日。修繕の日は、そんな話が少しずつ増える作業机から配信します。","金の線のお茶席","直した器の線から、今まで見えなかった景色を探す席です。長く使っているカップの持ち手や、小さな傷の思い出も聞かせてください。",[["1K","金の線のお祝い","直した器を一つ見せ、名前を呼んでお祝いします。"],["5K","器の来歴メモ","長く使っているものを一つ聞き、お礼とともに書き留めます。"],["10K","金継ぎの器印","好みの器色に金の線と表示名を入れて描きます。"],["20K","線の見立て係","金の線を何に見立てるか、次の展示の題を決められます。"],["30K","川筋の二枚組","選んだ器で、名前入りアイコンと金の線を広げた壁紙を作ります。"],["40K","一碗のお話","気になる器を選び、直す前の写真から今の姿まで一緒にたどります。"],["48K","お茶席の景色箱","好きな景色に似た継ぎ目を探し、その器を主役にしたお茶席の写真を贈ります。"]]],
  ["帆先アオ","港で向きがよく変わるのは風と僕の前髪です。アオと呼んでください。帆に風が入る直前、布のばたばたが一瞬だけ静かになります。そこがいちばん好き。\n\nこの間は岸から手を振る妹に何度も応えていたら、妹が指していたのは僕の後ろの虹でした。振り返ったときは最後のひと筋。帰ってノートに小さく描きました。配信では海から上がったあとに、その日のページを開きます。","小さな入江の帆走部","港に帰ってから風と帆の話をする部室です。水面のしわや、遠くの船が小さく見えた日の話をゆっくり持ち寄ります。",[["1K","入港の合図","小さな旗を振り、あなたの名前を呼びます。"],["5K","風向きのお礼便","その日に見た風のしるしを添えてお礼を書きます。"],["10K","三角帆の船印","好きな帆色と表示名でヨットのアイコンを作ります。"],["20K","旗の組み合わせ","次の小旗に使う二色を選べます。"],["30K","入江の帆影セット","選んだ小舟で、アイコンと入江の夕方の壁紙を描きます。"],["40K","航跡をたどる会","ノートの一日を選び、風向きと船の進み方を紙の上で再現します。"],["48K","あなたの寄港地","理想の入江を聞き、小舟をそこに浮かべた名前入りの航海絵日記を描きます。"]]],
  ["押し花こより","本を開いたら、いつ挟んだかわからない小さな花が落ちてきました。こよりです。しおりをなくした日の代役が、思いがけずきれいな押し花になっていました。\n\n今は花を挟む前に、採れた日と空の色を紙の端に書きます。乾いて青から紫に変わった一輪も、その文字を見れば元の空が戻ってくる。枠でページをめくる音がしたら、どの季節が出てくるかお楽しみに。","花びらの見開き","紙の間で姿を変えた花を眺める見開きです。道端で一度だけ見た色も、庭で毎年会える花の話も歓迎します。",[["1K","一輪のお迎え","季節のページを開いて、名前を呼びます。"],["5K","花びらの余白便","今日の花の色を一行書き、あなたへのお礼を添えます。"],["10K","押し花のしおり印","好きな花色と表示名でしおり風アイコンを描きます。"],["20K","見開きの台紙選び","次に花を並べる台紙を二色から選べます。"],["30K","季節の見開きセット","選んだ花のアイコンと、花を散らした縦長の壁紙を作ります。"],["40K","一枚の配置会議","花と葉の向きを画面で一緒に試し、好きな並べ方を決めます。"],["48K","季節の標本ページ","希望の季節に合う押し花を並べ、日付と献辞を添えた一ページを画像にします。"]]],
  ["ヨーヨー晴丸","ヨーヨーが手に戻る瞬間の、こつんという軽い音が好きな晴丸です。練習の最初にひもの長さを合わせます。気持ちが先走る日は靴ひもまで引っ張ってしまいます。\n\n技が初めて成功した日、喜んで見上げたら家族はちょうどテレビに夢中。もう一度やろうとしたら今度は普通の往復に。それからは見てくれる人が一人いたら、練習の一投目も本番です。","ひも一本の練習場","戻ってきても、途中で止まっても一投は一投。技の名前やひもの描く形を眺めながら、今日の練習を笑って振り返る場所です。",[["1K","一往復の拍手","名前を呼んで、ヨーヨーを一往復させます。"],["5K","練習場のお礼札","今日できた技とあなたへの一言を投稿します。"],["10K","丸いボディ印","選んだ二色のヨーヨーに表示名を入れて描きます。"],["20K","一本目の指名","次に見せる技を、今できる二つの中から選べます。"],["30K","ひもの軌道セット","好きな本体色で、アイコンとひもの軌道を描いた壁紙を作ります。"],["40K","技のスロー解説","選んだ技の手の動きを、止めながら配信で見せます。"],["48K","三投のミニ演技","希望の技を入れた三投を披露し、演目とお礼を入れた記念札を贈ります。"]]],
  ["蛇腹のマキ","アコーディオンを背負うと、ドアを通るときだけカニ歩きになるマキです。演奏の前にもうひと仕事。ケースをどこに置けば椅子が引けるかを考えます。\n\n祖父が「その箱、息してるね」と言ってから、蛇腹を閉じ切る直前の音まで好きになりました。いつも弾くワルツも、お茶が熱いうちはのんびり調子。冷めてくると少しだけ踊りたくなります。","路地裏アコーディオン","蛇腹が開いたり閉じたりするのを眺めながら、街角で聞きたい音を話します。足先だけで拍を取る席も空いています。",[["1K","蛇腹のご挨拶","名前を呼び、ひと呼吸ぶんの和音で迎えます。"],["5K","街角の曲間便","今日の音色を何かにたとえ、お礼の一言を添えます。"],["10K","鍵盤の名札","好きな蛇腹色と表示名でアコーディオンのアイコンを描きます。"],["20K","一小節の気分選び","行進かワルツから、即興の拍子を選べます。"],["30K","路地裏の楽団柄","選んだ色の楽器アイコンと、街角の舞台の壁紙を作ります。"],["40K","音の歩幅くらべ","短い自作の旋律を二つの速さで弾き、好きなほうを聞かせてもらいます。"],["48K","小さな街角公演","希望の場面に合わせて一曲即興し、あなたの名を入れた公演札を画像にします。"]]],
  ["朝市カゴメ","朝市で最初に買ったものほど、家に着くといちばん下。カゴメです。柔らかいトマトだけは上へ、と言いながら、あとから見つけた桃を両手で持って帰りました。\n\n値札が風で裏返った小さなピーマンを手に取ったら、お店の人が「焼くと笛みたいに鳴るよ」。その晩ほんとに台所で細い音がして、朝市の声が戻ってきました。買い物かごを開ける配信、今日は何が鳴るかな。","かごの底の朝ごはん","朝市で出会った野菜や、売り手に教わった食べ方を持ち寄る食卓です。かごに入りきらなかったものの話も歓迎します。",[["1K","朝市の呼び声","あなたの名前を呼んで、今日のいち押し野菜を見せます。"],["5K","かご底の一筆","最後に取り出した品とお礼を一行にします。"],["10K","八百屋の値札印","好きな野菜と表示名で、朝市の札風アイコンを作ります。"],["20K","次の一品選び","かごの中から次に配信で味わう野菜を選べます。"],["30K","朝市の色かご","選んだ野菜のアイコンと、色とりどりのかごの壁紙を描きます。"],["40K","ひとかご献立","好きな食材を聞いて、朝市でそろえる朝ごはんを一緒に考えます。"],["48K","あなただけの朝市便","希望の色をテーマに買い物かごの中身を並べ、食べ方とお礼を記念写真に添えます。"]]],
  ["むすび靴ヒロ","新しい靴を買うより、古い靴のひもを替えるほうがわくわくするヒロです。右足だけ色を変えて家族に見せたら「急いで出てきたの？」。ちゃんと片方ずつ試着中です。\n\n平行に通した日と斜めに通した日では、上から見た自分の一歩が少し違います。雨で外に出ない夜も玄関に座るのはそのせい。好きな二色を聞いたら、まず片足で試してみます。","玄関のひも研究所","靴ひもの通し方や、玄関で気分が変わる色の話をする小さな研究所です。履き慣れた一足の思い出も聞かせてください。",[["1K","蝶結びのお迎え","名前を呼び、ひもを一つ結んでお祝いします。"],["5K","玄関からの一言","今日のひもの組み合わせに、お礼を添えます。"],["10K","スニーカーの名札","選んだひも色で、名前入りの靴アイコンを描きます。"],["20K","左右の色選び","見本の靴に通す左右の色を選べます。"],["30K","足元の配色見本","好きな二色で靴のアイコンとひも模様の壁紙を作ります。"],["40K","通し方の見比べ","同じ靴に二つの柄を通し、上から見た形を配信で比べます。"],["48K","玄関の展示台","希望の配色で見本の一足を仕上げ、あなたが付けた題を写真カードにします。"]]],
  ["紙窓キリ","本を開くと家が立つ。閉じると屋根がほんの少しはみ出す。あと二ミリと格闘中のキリです。工作机には消しゴムより紙の小さな三角がたくさん。\n\n初めて妹に渡したカードは半分しか開きませんでした。のぞき込んで「秘密基地だ」と喜んでくれたので、その角度のまま窓を足しました。仕掛けの失敗が次のページの入口になる。今夜は何が起き上がるでしょう。","飛び出す本の仕掛け部","紙の折り目一本で立ち上がるものを考える部室です。閉じたときの形や、開いた瞬間の音も一緒に楽しみましょう。",[["1K","開いてお迎え","名前を呼び、小さな仕掛けカードを一枚開きます。"],["5K","折り目のお礼便","今日試した折りを一つ、お礼とともに紹介します。"],["10K","紙窓のアイコン","好みの屋根色と表示名で飛び出す家の絵を描きます。"],["20K","窓の形選び","丸窓か四角い窓か、次の試作品の形を選べます。"],["30K","立体カードの二景","閉じた表紙のアイコンと、開いた家の壁紙を作ります。"],["40K","半開きの観察会","選んだ仕掛けを角度を変えて開き、動き始める折り目を一緒に探します。"],["48K","あなたの飛び出す一頁","希望の色の家を紙で起こし、開く前と後の写真を一枚の記念カードにします。"]]],
  ["二跳ねシズ","水切りで何回跳ねたか数えるより、ちょうどいい石を探している時間のほうが長いシズです。平たい石を見つけると、それだけで今日は少し勝った気分。\n\nきれいな石を握って川に着いたら、投げるのが惜しくなりました。代わりに選んだ地味な一枚が、自己最高の五回。ポケットのきれいなほうは、今も机で練習帳を押さえています。あなたの「取っておいたもの」も教えて。","水切りの岸辺","川辺で眺めた波紋や、掌にしっくりきた石の話をする場所です。投げずにポケットへ戻した一枚にも、ちゃんと出番があります。",[["1K","波紋のご挨拶","名前を呼び、紙にまるい波紋を一つ描きます。"],["5K","岸辺の拾い書き","今日見つけた石の形と、お礼を短く書きます。"],["10K","平石の名札","好きな石の色に表示名を添えたアイコンを描きます。"],["20K","水面の色選び","次の波紋スケッチの水色を、朝か夕方から選べます。"],["30K","波の輪の二枚組","選んだ石のアイコンと、水面に輪が広がる壁紙を作ります。"],["40K","石の見立て選手権","気になる石を一つ選び、横と裏から何に見えるか一緒に考えます。"],["48K","岸辺の小さな地図","好きな水辺の景色を聞き、石と波紋を目印にした名前入りの地図を描きます。"]]],
  ["運針さよ","刺し子の針を進めると、考えごとをしていたところだけ縫い目が少し大きくなります。さよです。自分のふきんを見ると、どの辺で夕飯のことを考えたか分かります。\n\n祖母のふきんにも、大きなひと目がありました。「そこは電話が鳴ったところ」と笑うので、私の大きな目もそのまま。配信では藍色の布を膝に置いて、コメントが来たら針を休めます。","藍布のひと目","白糸が布の上につくる間隔を眺める縁側です。繕って使っているものや、手元にある布の手触りを聞かせてください。",[["1K","ひと目のご挨拶","名前を呼び、目印のひと針を布に入れます。"],["5K","縁側の縫い便り","その日の模様の進み具合とお礼を載せます。"],["10K","白糸の布印","選んだ一文字を刺し子風に描き、名前入りアイコンにします。"],["20K","縫い糸の差し色","次の模様に少しだけ加える色を選べます。"],["30K","藍と白の布セット","選んだ模様で、布印のアイコンとふきん柄の壁紙を作ります。"],["40K","模様の道順","好きな図柄を一つ選び、どの順に針が進むか配信でたどります。"],["48K","ひと目ずつの記念布","選んだ差し色を入れた小さな模様を刺し、名前と日付を添えた写真にします。"]]],
  ["はさみ焼き杏","ホットサンドを切るとき、具の断面にいちばん緊張する杏です。きれいに層が見える予定だった朝、真ん中でとろけたチーズに全部持っていかれました。\n\nうちでは端からかじる父と真ん中から割る私が半分ずつ。父は毎回「今日は耳が勝ち」。それを聞いて次の一枚は端っこに具を少し寄せます。今朝の作戦会議、あなたなら何をはさむ？","耳までホットサンド","耳の焼き色から断面の具まで、二枚のパンの間で起きた話を楽しむ台所です。冷蔵庫に少しだけ残ったものの相談もどうぞ。",[["1K","プレスを開けてお迎え","名前を呼び、焼き上がった一枚を見せます。"],["5K","断面のお礼メモ","今日の具の並びに一言添えてファミリーに書きます。"],["10K","三角サンドの名札","好きな具の色で、名前入りサンドアイコンを描きます。"],["20K","次の具の指名","手元にある二種類から次のサンドの具を選べます。"],["30K","こんがり朝食セット","好きな焼き色のアイコンと、サンドの並ぶ朝食壁紙を作ります。"],["40K","はさみ方の実験","具の置き方を二通り試し、切った断面を一緒に比べます。"],["48K","あなたの看板サンド","希望の食材を主役に一枚焼き、名前とお礼を添えた喫茶メニュー画像にします。"]]],
  ["砂時計スナオ","お茶の三分を測る砂時計を眺めて、お茶を入れ忘れたことがあります。スナオです。同じ三分でも、砂が残り少なくなると急に早く感じるのが不思議。\n\n机に古い砂時計と新しい砂時計を並べて返したら、ほんの少しだけ終わる順番が違いました。どっちが正しいか確かめるはずが、今では二つ目が終わるまでをおやつの時間にしています。配信でも三分だけ、好きな話をどうぞ。","三分ぶんの机","砂が落ちる間だけおしゃべりしたり、ぼんやり眺めたりする机です。三分でできたこと、三分では全然足りなかったことを聞かせてください。",[["1K","砂のスタート合図","名前を呼んで、小さな砂時計を返します。"],["5K","三分のお礼便","砂が落ちる間に、あなたへの短い一言を書きます。"],["10K","砂山の名札","好きな砂色と表示名で砂時計のアイコンを作ります。"],["20K","おやつの三分選び","次の三分トークのお題を二案から決められます。"],["30K","上下の砂景色","砂時計のアイコンと、砂の山を大きく描いた壁紙を作ります。"],["40K","三分ぴったりの小話","あなたが選んだ話題を、砂が落ちきるまでお話しします。"],["48K","時間の小さな贈り物","好きな三つの瞬間を聞き、三つの砂時計になぞらえた名前入りの記念絵にします。"]]],
  ["四弦なぎさ","ウクレレを抱えると、ソファの端がうちでいちばんいい席になります。なぎさです。四本の弦を合わせたところで満足して、お茶に手が伸びる日もあります。\n\n窓を開けて一音鳴らしたら、外の自転車のベルが同じ高さで返ってきました。それからあの音を出すたび、ちょっとだけ道を見ます。配信のはじまりはその一音。あとはコメントの歩幅に合わせて、のんびり弾いていきます。","ウクレレの縁台","縁台でウクレレを回す気分で、短い音とおしゃべりを分け合います。弾いたことがない方は、好きな音をひとつ見つけていってください。",[["1K","四弦の挨拶","名前を呼び、一度だけ弦を鳴らして迎えます。"],["5K","縁台のお礼メモ","その日の和音に、お礼の言葉を一行添えます。"],["10K","小さな四弦印","好きな木の色と表示名でウクレレのアイコンを描きます。"],["20K","弾きはじめの選択","次の即興を、弦を一本ずつ弾くか一度に鳴らすか選べます。"],["30K","木目の音色セット","選んだ楽器アイコンと、縁台からの景色の壁紙を作ります。"],["40K","名前の四音","あなたの呼び名に合わせた短いフレーズを弾きます。"],["48K","縁台の特等席","好きな時間帯を題に小曲を作って配信で弾き、曲名とお礼入りのカードを贈ります。"]]],
  ["コマ撮りパチ","粘土の人形を少し動かして一枚、また少し動かして一枚。撮影が終わると、人形より自分の肩がよく動くパチです。\n\n昨日は歩く場面に半日かけました。再生すると人形の後ろでマグが瞬間移動。私がお茶を飲むたびに場所を変えてたんです。消すのが惜しくて、次の回はマグを主役にしました。動かしたい小道具、コメントでひとつ教えてください。","机の上の撮影所","机の上で数秒ぶんの映画を作る撮影所です。粘土の足跡や背景の小さな変化に気付いたら、ぜひ教えてください。",[["1K","カチンコのご挨拶","名前を呼び、ミニカチンコを鳴らします。"],["5K","撮影日誌の一コマ","今日の舞台裏を一枚選んで、お礼と一緒に投稿します。"],["10K","粘土役者の名札","好きな色の人形と表示名でアイコンを描きます。"],["20K","小道具の配役","次の場面で動かす小物を二つから選べます。"],["30K","撮影所の場面写真","選んだ色の人形アイコンと、ミニセットの壁紙を作ります。"],["40K","一歩の試写会","人形が一歩進む場面を、静止画と再生で見比べます。"],["48K","お題つき短編上映","希望の仕草で数秒のコマ撮りを作り、配信で上映して名前入りの場面写真を贈ります。"]]],
  ["きのこ見ルイ","森を歩くとき、景色のいい展望台より先に古い切り株へ向かうルイです。そこだけ雨の傘屋さんみたいに、小さなきのこが並ぶ日があります。\n\n同じ場所を一週間後に訪ねたら、傘が全部消えていました。代わりにリスのかじった松ぼっくりが一つ。森の店先は入れ替わりが早い。写真を撮ってそっと通り過ぎ、枠ではそのページをゆっくり開きます。","切り株の観察帖","森で見たきのこの形や木肌の模様を、写真とスケッチで楽しむ観察席です。名前が分からないものにも、その日だけのあだ名を付けます。",[["1K","切り株前の点呼","名前を呼び、観察帖から今日の一枚を見せます。"],["5K","森の余白便","面白かった傘の形を一言描写して、お礼を添えます。"],["10K","傘模様アイコン","選んだ色の架空のきのこに表示名を入れて描きます。"],["20K","森の見立て係","次に紹介する写真のきのこに、見た目からあだ名を付けられます。"],["30K","切り株の標本絵","好きな形のアイコンと、森の床を描いた観察壁紙を作ります。"],["40K","一枚の森探し","写真を一枚選び、落ち葉や木の実まで一緒にのぞきます。"],["48K","小さな森の展示札","希望の季節の観察写真を選び、あなたの言葉とお礼を入れた展示札を作ります。"]]],
  ["あめ細工アカリ","飴細工で金魚を作ると、なぜか毎回しっぽだけ立派になります。アカリです。光にかざすと尾びれの薄いところが透けて、ついそこばかり眺めてしまいます。\n\n練習中、少し丸すぎた一匹を弟が「いちばんごはんをもらえた子」と呼びました。その日から、丸い子は群れの先頭にいます。配信は作業がひと区切りついてから。どの子がいちばん得意げか一緒に選んでね。","金魚あめの縁日","金魚や小鳥の飴を、明かりの向こうにかざす小さな縁日です。好きな屋台の色や、お祭りの帰りに大事に持っていたものを教えてください。",[["1K","縁日の呼び込み","名前を呼んで、今日の飴を明かりにかざします。"],["5K","あめ色のお礼札","出来上がった一匹に一言添えて投稿します。"],["10K","金魚あめの名札","好きな尾びれの色で名前入りアイコンを描きます。"],["20K","泳ぐ向き選び","次の金魚の尾を、右と左のどちらへ流すか選べます。"],["30K","夕涼みの飴セット","選んだ金魚アイコンと、縁日の灯りの壁紙を作ります。"],["40K","光の通り道","気になる飴を一つ選び、光の向きを変えながら表情を見比べます。"],["48K","一匹だけの飴展示","希望の色の金魚を作り、あなたが付けた題とお礼を作品写真に入れます。"]]],
  ["風見トリオ","屋根の風見鶏を見上げすぎて、商店街の人に顔を覚えられたトリオです。いつも西を向く一羽が気になっていたら、実はパン屋さんの動かない看板でした。\n\nそれでも店先の旗はちゃんと風に揺れていて、僕の観察帳には今もその鶏がいます。風を読むのは旗の担当、目印になるのは鶏の担当。配信では今日見つけた風の手掛かりを一つずつ持ち寄ります。","屋根の上の方角係","風見鶏やのれん、道端の草から風の通り道を探す方角係です。いつも通る角で何かがくるりと動いたら報告してください。",[["1K","くるりとご挨拶","手元の風見鶏を回して、あなたの名前を呼びます。"],["5K","風向きの伝言","その日の風の手掛かりに、お礼の一言を添えます。"],["10K","屋根飾りアイコン","好きな屋根色と表示名で風見鶏を描きます。"],["20K","東西の景色選び","東の朝空か西の夕空から、次のスケッチの背景を選べます。"],["30K","風の通り道柄","選んだ屋根飾りのアイコンと、並ぶ屋根の壁紙を作ります。"],["40K","一枚の風探し","街角の写真から風で動くものを一緒に数えます。"],["48K","風見鶏のある町","あなたの好きな店を一軒聞き、その屋根に架空の風見鶏を立てた街角の絵を贈ります。"]]],
  ["編みかごサク","かごを編むとき、底を作っている間がいちばん想像がふくらみます。パンを入れるか、毛糸を入れるか。予定より小さくなると、サクの机のペン立てになります。\n\n最初のかごは少し片側が高く、丸いりんごを入れるといつも同じ場所に落ち着きます。家族はそこを「りんごの指定席」と呼びます。配信では持ち手が付くまで、どんな席ができるか一緒に見届けてください。","柳の持ち手工房","柳の枝が少しずつ器になる工房です。何を入れるか考えたり、編み目の影が机に落ちるところを眺めたりして過ごします。",[["1K","枝を一本そえて","名前を呼び、編みかけのかごを見せます。"],["5K","持ち手のお礼札","今日の編み進み具合を短いお礼と一緒に載せます。"],["10K","柳かごの荷札","好きな中身と表示名でかごアイコンを描きます。"],["20K","縁取りの形選び","次のかごの縁を丸くするか、波形にするか選べます。"],["30K","編み目の二枚組","柳かごのアイコンと、編み目の影を広げた壁紙を作ります。"],["40K","指定席の設計会議","入れたいものを聞き、使いやすい底や持ち手を配信でスケッチします。"],["48K","一かごの記念仕立て","選んだ中身をかごに並べ、そのための荷札とお礼を付けた写真を贈ります。"]]],

  ["灯台守のミオ","夕方の灯台を見に歩くミオです。目を離した一瞬に光った気がして、もう一回だけ、もう一回だけと、岬のベンチで帰りのバスを一本見送りました。\n\n次に行った日は最初に時刻表を写して、安心して水平線へ。帰り道、坂の下の豆腐屋さんにも小さな明かりがともっていました。遠くの船にも、晩ごはんを買う私にも、帰り道にはちゃんと目印がある。そんな灯りを集めています。","岬の帰り灯","岬の灯台や帰り道の窓明かりを話す待合室です。家が近いと感じる目印をひとつ教えてください。海の見えない町のお話も大歓迎です。",[["1K","灯りをともす挨拶","机の灯りをつけて、名前を呼んでお迎えします。"],["5K","岬の帰り便","今日見つけた明かりと、お礼の一言をファミリーに書きます。"],["10K","灯台の目印","好きな帯の色と表示名で灯台のアイコンを描きます。"],["20K","夜景の一灯選び","次に描く灯りを、岬の先か坂の下から選べます。"],["30K","夕暮れの岬セット","選んだ灯台のアイコンと、光が海を渡る壁紙を作ります。"],["40K","帰り道の地図会","あなたがほっとする明かりを聞き、そこへ続く道を一緒に描きます。"],["48K","岬の最終便","希望の風景を短い帰り道のお話にして朗読し、灯台と名前を入れた記念はがき画像を贈ります。"]]]
