<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "るいです。帰りの電車で片耳だけイヤホンをつけて、歌枠や雑談を聴いてます。平成のJ-POPは、曲名より先に「これ、昔めっちゃ聴いた」が出るタイプ。\n\n外だとほぼ聴くだけ。家に着いたら一言書きます。枠で教えてもらった曲を翌朝に聴くのが楽しみで、再生リストは通勤用なのに夜の曲ばかりです。\n\n曲を教わるとき、「歌詞がいい」も嬉しいけど「サビ前のベースを聴いて」みたいに、場所を教えてもらうのがもっと好きです。そこだけ待ち構えて聴くと、その音が聞こえてから急に曲の景色が変わる。翌朝の自分に小さな予告編を残すつもりで、曲名の横にメモしています。\n\n前に終電で、隣の人が窓に映る自分を見ながら、すごく静かにエアギターしてました。降りる駅が同じで、ホームでもまだ指が動いてた。なんとなく曲を当てたくなって、その人の指が止まるまで発車メロディーを聞き逃しました。\n\nこの前は「二番のあと」とだけ書いて曲名を忘れました。何を聴きたいのか分からない人のための再生リストが、また一曲分だけ増えました。よかったら、あなたの「ここから聴いて」を秒数つきで教えてください。", "片耳プレイリスト", "帰り道に聴きたくなる一曲を、サビ前のベースや歌い出しの一言ごと持ち寄る場所。平成J-POPも今の曲も、曲名を思い出せない日は「たぶん二番のあと」からどうぞ🎧\n\n【コア特典】選んだ一曲に「窓に映る自分がやけに主人公」みたいな一行を添えて、枠内であなた専用の車内アナウンス風に紹介します。終点までに曲名を思い出せるかは別問題。"],
  ["初見じょうれん。", "「初見です！」って書いたら、まず過去の入室回数を確認されます。じょーれんです。どうも、また来ました。\n\n夕飯で抜けて、食べ終わったら戻ります。話題がひとつも進んでないと嬉しいし、なぜか全員が同じお菓子を探し始めてる日も好き。初めましての人には、今なんでみんな笑ってるのか説明したくなります。\n\n常連だけで通じる呼び方って、説明された瞬間がいちばん面白い気がします。「会長？」「昨日じゃんけんで勝った人です」「任期は？」「負けるまでです」。肩書きだけ聞くと大ごとなのに、だいたい理由は五秒で話せます。\n\n一度「初見さん、こんばんは！」って挨拶したら、返事が「昨日あんたと一時間しゃべったよ」でした。そうでした。しかも前の日も同じ挨拶をしてたらしい。次に会った日は向こうが先に「はじめまして」と言ってくれました。もうどっちも訂正しません(´▽｀)\n\n話題についていけないときは、遠慮なく「今どこ？」って聞いてください。じょーれんが前回までのあらすじをお伝えします。なお、夕飯から戻った直後は、先に僕が聞きます。僕の席、たまに初見の人に案内されてます。", "また来た初見席", "初見です！ 昨日ぶりです！ どちらの挨拶も大歓迎。途中で来た人には、会長がなぜ会長なのかから説明します。ちなみに先代はじゃんけんで負けました(´▽｀)\n\n【コア特典】一度だけ「初見に戻れる券」。希望した回にみんなで初対面のふりをして、僕がいつもの呼び名を言ったら終了です。たぶん一言目で終わります。"],
  ["あずき＊", "あずきです🍡\n粒あん、薄い毛布、夜のゆっくりめな歌が好き。休日は和菓子屋さんの小さな箱を持って帰るだけで、帰り道が少し楽しいです。\n\n配信では聴いてる時間が多め。おやつの話だけは気づくと会話にいます。教えてくれるなら「おいしいよ」に加えて、どこのお店かも書いてもらえると喜びます。\n\n和菓子屋さんでは、品名の札まで眺めます。「初雪」と書いてあるだけで、白いお菓子のふちがちょっと冷たそうに見える。食べた感想に迷ったら、甘さより「何時のおやつにしたいか」を考えます。夕方なら濃いお茶、寝る前ならひと口だけ。\n\n小さな箱を前に「二日に分けるから」と言う日は、たいてい初日にふたを二回開けます。二回目は味見の続き。もう三分の二減ってても、そこは明日のお茶を少し多めにいれることで折り合いをつけます。\n\n昔、祖母にもらった紙袋に、おまんじゅうが二つ入っていました。片方は自分用かと思って渡そうとしたら、「明日のあんたの分よ」と。帰って開けたら、片方だけ包み紙に小さく「明日」って書いてあった。翌日、急いで食べるのがもったいなくて、ちゃんとお茶をいれました。", "粒あんと夜のお茶", "お茶をいれて、今日のおやつとゆっくりした歌を楽しむ場所🍡 和菓子のお店を教えてくれるときは、朝のお茶に合うか、明日までとっておけそうかも聞きたいです。\n\n【コア特典】あなたをイメージした架空の和菓子に名前をつけて、枠内で発表します。「二度目の味見」など、なぜか食べる人の事情が商品名になることがあります。"],
  ["おちゃまる🍵", "お湯が沸いたら、だいたいこんばんはの時間です🍵\nおちゃでも、まるでも、呼びやすい方でどうぞ。\n\nほうじ茶と和菓子がある夜は機嫌がいいです。洗い物の途中で枠を開くので、急に黙ったら手が泡だらけだと思ってください。ご当地のお菓子は、名前を聞くだけでも楽しい。食べたことのない味を想像してます。\n\nお茶の感想は「最初のひと口」と「少し冷めた頃」の二回あると面白いです。熱いときは湯気ばっかり見てたのに、冷めたら甘いお菓子のあとに香ばしさが残ったり。家で飲むなら比べるカップの形も揃えたいところ。いつもはまず、欠けてないのを二つ探すところからです。\n\n前に奮発して買った茶葉を友人と飲み比べたとき、二人で「こっちは香りが上品だね」と真剣に語りました。飲み終わって見たら、相手のカップにも自分と同じほうじ茶を注いでました。友人は黙ってもう片方の急須を指さして、一言。「こちらが本日の新商品です」( ˘ω˘ )\n\n当てっこよりも、どこからその香りを思い出したかが好き。僕がほうじ茶で思い浮かべるのは、祖母の家の台所です。みんなの答えが「いま開けたポテチ」でも、それはそれでお茶がすすみます。", "ほうじ茶の間", "お湯が沸いたらこんばんは。ご当地のお菓子や、冷めてから気づくお茶の香りを話しましょ🍵 聴くだけの方にも湯のみ一つぶん、席を空けてあります。\n\n【コア特典】「それっぽいお茶鑑定」。選んでもらったおやつとお茶の組み合わせを、私が食レポ風に読み上げます。味の想像がつかないときは「台所を思い出します」でしのぎます。"],
  ["ぼると⚡", "９回裏、２アウト。まだランナーおる。こういう場面でようやく立ち上がる、ぼるとです。普段の雑談では省エネですが、勝負どころだけ急にコメントが増えます。\n\nスポーツはハイライトも見ます。けど、あの場面になるまで何があったかを聞く方が好きです。派手な得点の前に、ちゃんと仕事した選手の話ならいくらでも聞きたい。\n\n一緒に見てる人には「あの打席から見返してみて」とよく言います。逆転した場面だけやと一振りの話で終わるけど、その前に粘って出塁した選手まで見ると、応援したくなるところが増えるんよ。打ったあとにベンチの端っこで誰が立ったかまで見るから、リプレー担当には感謝してます。\n\nある試合で、自分だけ配信が少し遅れてました。家族が隣の部屋で先に叫んだので「結果言うな！」と叫び返したら、「足つっただけ！」と。その数秒後に本当に逆転が起きて、今度は二人同時に叫びました。その日いちばん気になったのは、結局どっちの足だったかです。\n\n願掛けで座る場所を変えることがあります。この前は立ったら点が入って、次の回から家族に座るなと言われました。九回裏に立つ人の話をしていたはずが、六回から立たされたのは初めてです。", "九回裏の応援席", "九回裏だけ見たら一瞬やけど、その前の粘りもええんよ。打った選手も、声出してたベンチの端っこも、みんなで見返したくなる応援席です⚡\n\n【コア特典】リスナー名と今日がんばったことを、代打アナウンスで実況します。「代打、洗い物を終えた○○さん！」みたいな感じ。枠主はなぜか六回から立ってます。"],
  ["たっぷりん🍮", "🍮 プリンは固め、カラメルは苦め\n🍮 新作は棚の前で一度迷ってから買う\n🍮 おやつの相談、夕食直後でも歓迎\n\n「ぷりん」で呼んでください。洗濯物をたたみながら歌枠を聴いて、懐メロが流れたら手が止まります。タオルを早くたためる日は、たぶん枠が静かだった日。\n\nおすすめを聞くときは「スプーンを入れた跡が残る？」と聞きます。固めの中でも、角がしばらく残るのと、ひと口目だけしっかりしてるのでは気分が違うので。カラメルを先に混ぜるか最後に残すかも、その人の食べ方が出るところ。私は最後の一口に合わせて計算して、だいたい途中で計画が崩れます。\n\n前にごほうび用のプリンを冷蔵庫に隠したら、自分で隠し場所を忘れました。翌朝、野菜室から出てきたプリンを見て、家族が「昨日からここが高級デザート売り場になってる」と。よく見たら、その横に家族の分のシュークリームも隠してありました。お互い生活の知恵が同じでした。\n\nおやつ報告は写真なしでも歓迎。プリンの写真を頼まれて「まだきれいな状態」を撮ろうとしたら、スプーンを持って二秒で忘れました。断面なら撮れます。早めに言ってね。", "固めプリン同好会", "固め派もとろとろ派も席あります🍮 スプーンの跡が残るか、カラメルをいつ混ぜるかまで知りたい部です。懐メロで洗濯の手が止まった人もどうぞ。\n\n【コア特典】好きな食感を聞いて、あなた専用の架空プリンを命名。枠内で新作として食レポします。「野菜室の奥で熟成」だけは、うちの冷蔵庫で本当に起こります。"],
  ["mira☾", "mira（ミラ）といいます。\n\n眠る前に、弾き語りや穏やかな雑談を聴きにきます。映画は席が明るくなるまで座っている方です。余韻が残って、そのあと誰かに一曲だけ渡したくなるような映画が好き。\n\nコメントを考えているうちに話題が変わることがあります。だいぶ前の話に返事をしていたら、そのまま軽く流してください。\n\n好きな映画を語るとき、筋を説明するより「あの部屋の冷蔵庫の音が気になった」のような話を聞きたくなります。同じ場面を観た相手が、私の見ていなかった手元の動きを覚えていたりする。もう一度観る理由が一つ増えるのが、感想を交換する楽しみです。\n\n曲を勧めるときは「眠くない夜に」「窓を開けたくなる日に」と一言添えます。ある人に「雨の日用」を渡したら、一週間ずっと晴れていたそうです。待ってくれたのが嬉しくて、結局「晴れた日に聴く雨の曲」ということにしました。\n\n昔、映画で流れた曲が見つからず、友人に鼻歌を送りました。返事は「途中から別の曲になってる」。翌日、正解のリンクと一緒に、なぜか途中から混ざった曲の名前まで届きました。あの人、律儀なんです。今でも二曲続けて聴くと、笑ってしまいます。", "余韻のひと席", "映画が終わってもすぐには立たない人へ。夜の弾き語りや、物語に残った物音の話を。話しそびれた感想は、少し時間が経ってからでも聞かせてください。\n\n【コア特典】今日の気分を一言もらえたら、あなたの一日に短いエンドロールをつけます。枠内で読み上げる配役は、たまに「主演、うまく開かなかった傘」です。"],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。謎解きやゲーム実況では、答え合わせの直前がいちばん好き。推理を聞かれたら長めに答えますが、見当違いだったときは「なるほど」とだけ言ってひっそり引き下がります(￣▽￣)\n\n謎解きメモは、見たものと考えたことを別の列に書きます。「引き出しに赤い丸」は見たもの。「りんごの暗号」は考えたこと。分けておくと、思い込みだけ消してやり直せます。問題は、私のノートだと右の列ばかり埋まることです。左に「まだ何も見てない」と書いたこともあります。\n\nこの前、脱出ゲームで仲間に「この椅子、絶対に何かある」と言い張りました。座面を裏返す勢いで調べていたら、係の方に「お疲れでしたら座って大丈夫ですよ」と。親切にされるほど引っ込みがつかなくて、とりあえず全員で一回ずつ座りました。もちろん何も起きませんでした。\n\n答え合わせで好きなのは、外れた人が「え、じゃあさっきの伏線は？」と名残惜しそうにしている時間。だいたいその人が私です。枠で当てても、先に「ヒント要る？」と聞くようにしています。", "仮説だらけの作戦室", "見たことと推理したことを分けて考える、謎解き好きの作戦室。外れた仮説ほど大事にとっておきます。あの椅子だけは、普通に座って大丈夫です(￣▽￣)\n\n【コア特典】「ヒント係」に任命。あなたが選んだ言葉を一つだけ手がかりに混ぜて、枠のみんなに謎を出します。怪しい椅子が出てきたらヒント係と私で審議します。"],
  ["からあげレモン🍋", "晩ごはんのことを考えながら、晩ごはんの話を聞きに来ます。からレモです🍋\n\nラーメンの話を聞けばラーメンに変更。弁当に入れておいしかったおかずの話は、翌朝までちゃんと覚えてます。🍋だけ置いていくときは、たいてい笑ってるとき。お店の唐揚げなら、次の日に冷めても好きです。\n\nお弁当の相談では、揚げたての感想より「お昼まで置いてどうだった？」が知りたいです。おいしいと思った瞬間の温度まで聞くと、いつ食べる用に買うか決めやすいんよね。温かい分とお弁当用を二つ買って確かめるはずが、帰り道に両方食べた日があります。比較は次回に持ち越し🍋\n\n昔、みんなに「レモンかけていい？」って確認してから、思い切り絞った汁が自分の目に直撃しました。「うわ、痛っ」と叫んだ横で、友人が何事もなかったように唐揚げを一口。「うん、この一個だけめっちゃ酸っぱい」。被害が広がってなくて良かったけど、せめて水をください😂\n\nおかずの話で「あと一品どうする？」と聞かれたら、家に残ってる食材を聞きます。全部聞いたあとでコンビニのコロッケを推すこともあります。献立に迷う時間が長い日は、もうそれがいちばん食べたかったのかも。", "ひと絞り食堂", "晩ごはん、何にする？ 揚げたての日もお弁当の日も、食べたときのおいしさを話す食堂です🍋 唐揚げのレモンは、ひと声かけてからどうぞ。\n\n【コア特典】好きなおかずを聞いて、あなた専用の「本日の架空定食」を枠で発表します。説明してる途中で私もお腹が減るので、お子さまランチ並みに品数を絞ります。"],
  ["kohaku.", "こはくと申します。休日は、開店してまもない喫茶店で厚切りのトーストを食べます。まだ食器の音くらいしか聞こえない時間が好きです。\n\n家では本を開いて、歌や雑談を聴いています。耳に残った曲名は付箋へ。読み終わった本を久しぶりに開くと、内容と一緒にその頃の音楽まで思い出すことがあります。\n\n読み終わったら、筋より気になった一文のページを控えます。あとで見ると、同じ本を二度読んだのに前と違うところに印があったり。自分がどんな時期に読んだかも、少しだけ分かります。まっさらな本を読みたい気分の日は、昔の付箋をいったん外して、戻す場所が分からなくなるまでが一セットです。\n\n朝の喫茶店で、メニューを毎回きちんと開きます。注文は相変わらず厚切りトースト。「次は違うものを」と思いながら閉じるところまで、すっかり休日の習慣になりました。\n\n以前、通っていた店に久しぶりに寄ったら、帰り際に店主が「今日は本、お持ちじゃないんですね」と。店で本の話をした覚えはありませんでした。次の週は本を一冊持って行きました。たまたま目が合って、お互い少しだけ笑ったのをよく覚えています。", "付箋のある喫茶室", "読みかけの本や、耳に残った歌の話をどうぞ。筋の説明は不要です。気に入った一文に付箋を挟むように、覚えておきたいことだけ置いていける喫茶室です。\n\n【コア特典】好きな言葉を一つ使って、ファミリーにあなた宛ての「一行しおり」を書きます。短い言葉だと、厚切りトーストが焼ける前に仕上がります。"],
  ["ぴかまる⚡", "こんぴかー！⚡ 「ぴか」で呼んでね。\n早押しは得意！ ……と言いたいけど、送るのが早いだけです。誤字を見つけるのと引き返すのは遅いです。\n\n明るい歌枠、しりとり、急に始まる大喜利に出没します。朝に聴いたら一発で目が覚める曲、募集中。電車の中で笑わせてくる枠、悔しいけど何度でも行きます(≧▽≦)\n\n大喜利で困ったら、先に「誰が言ったらおもしろいか」を考えてます。普通の「お待たせしました」も、迷子になってた店内放送の人が言うとちょっと笑う。そうやって一人で考えてる間に、みんなはもう次のお題。早押し部の部長、たまに遅刻します⚡\n\n前にしりとりで、どや顔で「みかん」と送ったら一巡目で終了。みんなが「ん」から始まる言葉を必死で探してくれました。助かったと思ったら次は「だいこん」。枠主が笑いながら「ぴかは拍手係できる？」と。そこからは誰よりも仕事しました👏\n\n挨拶を全自動みたいな速さで打って「こんぴざー！」になったことも。翌日もそれで呼ばれたので、一瞬だけピザ屋に転職した気分でした。夜の枠で飯テロまでできて、一石二鳥です。", "ぴかっと早押し部", "こんぴかー！ 早押し、しりとり、急な大喜利が始まる部です⚡ 送信は早め、誤字の修正は遅め。「ん」の次でも拍手係は営業してます👏\n\n【コア特典】指定のお題で10秒大喜利。私の答えがすべったら、あなたがリベンジのお題を一つ出せます。すべり続けると特典が伸びそうなので、やり直しは一回だけ！"],
  ["しりゅう_08", "しりゅう。夜にふらっといます。\n\nアニメは少し前の作品を見返しがちです。昔は退屈だと思って飛ばした回が、今になって一番好きだったりする。結末の話は観たか聞いてから。知らない作品のときは主題歌から入ることもあります。\n\n見返すときは脇役を一人決めて、その人ばかり追うことがあります。主人公が前を向いている間に、仲間が目をそらしたり手を止めたりしてる。一周目には気づかなかった理由が見えてくる感じが好きです。難点は、「この回のこいつ良かった」と言っても真ん中の人だと思われがちなこと。\n\n釣れなかった日の帰りも、竿を出した場所と時間くらいはメモします。海に行った日の空の色は少し覚えていたくて。魚屋の営業時間もその隣に書いてあります。そっちの欄だけ日に日に正確です。\n\n釣りもします。前にまったく釣れなかった帰り、魚屋でアジを買いました。袋を見た家族が「今日すごいじゃん」と。黙ってレシートを渡したら「よくこの大きさで揃ったよね。魚屋さんだから」と、その日の夕飯はやたら店への感謝が厚かったです。翌週からは出発前に「どっちに行くの？」と聞かれます。いや、まず海には行くよ。", "夜釣りとアニメ棚", "釣れた日も魚屋に寄った日も、ここで話します。昔のアニメは脇役の表情まで見返したい。ネタバレになりそうな話は、観たか聞いてから。\n\n【コア特典】最近の小さな成果を、枠で「本日の釣果」にして読み上げます。「出勤前にゴミ出し達成、一尾」くらいで大丈夫。魚屋のレシートも名誉ある釣果です。"],
  ["たいやき＠しっぽ派", "しっぽからいきます。先端のカリッとしたところが本番です。名前は「たいやき」「しっぽ」、その日の気分でどうぞ🐟\n\n商店街の寄り道と、元の話題を誰も覚えてないくらい脱線した雑談が好きです。枠では「それ何味？」から話に入りがち。カスタードは差し入れで喜ばれるけど、自分で買うならやっぱりあんこ。\n\nたいやきは横からも見てみます。端のはみ出た生地が厚そうだと、今日はそこからいきたい気分。連れに「あんこ入ってないところを真剣に選ぶ人、初めて見た」と言われました。たい焼きを選んでいるのか、よく焼けた生地を選んでいるのか、そろそろ自分でも怪しいです。\n\n頭派の友だちと一匹を分けたとき「うまいこと分けよう」と任せたら、渡されたのが本当に先端だけ。向こうは胴体ごといただいてました。抗議したら「しっぽが好きって言ったでしょ」と正論をかまされた。以来、最初から二匹買ってます。今日は自分がしっぽを二つもらう番です。\n\n袋に二匹入れてもらったら、家でどっちが何味か分からなくなりました。しっぽからだと答えが出るまでちょっとかかる。あれは問題を出す側が時間配分までよく考えています🐟", "しっぽから商店街", "頭派もしっぽ派も、商店街の端からおいで🐟 あんこがないカリッとしたところまで熱く語ります。雑談が脱線したら、二匹目を買う合図です。\n\n【コア特典】好きな具を一つ言ってくれたら、あなたの架空たい焼きを考えて枠で実演販売します。しっぽに入ってるか聞かれたら、頭派のお客さんにも同じ説明をします。"],
  ["つきよみ☾", "ひと駅ぶん遠回りして帰る夜、雑談や歌を聴きます。歩く音と人の声が一緒に聞こえるくらいの音量が好きです。名前は「つき」だけで呼んでもらえれば。\n\n雨の日は傘をさしているので、返事は家に着いてから。話すことを考えていても、最後に聴いた曲のことを先に書く日があります。\n\n帰り道の曲は、速さより「途中で立ち止まっても続きが聴きたくなるか」で選びます。曲の最後まで歩くつもりが、ポストの横で一曲分ぼんやりしたことも。翌日も同じところで止まったら、自分が一時停止のボタンになった気がして、少しおかしかったです。\n\n一日の話を全部しようとすると、なかなか言葉が出ない。そういう夜は「今日は月が見えた」だけ書きます。少しして「こっちは曇り」と返ってくると、知らない街の空まで浮かぶのが好きです。\n\n以前、大事な用事がうまくいかなかった晩に、よく通る道で歌を聴いていました。歌い終わった枠主が、ふつうの声で「今日はここまで。みんな、帰ったら寝ようね」と言っただけで、急に肩の力が抜けました。信号が変わるまで立っていて、帰ったら本当に、電気を消してすぐ寝ました。", "月夜の遠回り", "遠回りの帰り道に、夜の歌と他愛ない話を。返事は部屋に着いてからで大丈夫。今日は何も書けないな、という日には、窓の外の天気だけ聞かせてください。\n\n【コア特典】あなたの一日から一言を預かって、枠で「今夜の寄り道予報」を読みます。「明日の朝までは家事が弱まる見込み」など、予報士の希望が少し混ざります。"],
  ["きのぴ。", "【出没】作業の合間、夕飯決めたくない時間帯\n【好き】舞茸の天ぷら、ゲーム、コメント欄の小ボケ\n【弱点】送信直後に見つかる誤字\n\nきのぴです🍄 ときどき話に混ざります。急に黙っても機嫌は通常です。手が空いたら、何事もなかったように戻ってきます。\n\n【近況】ゲームで迷ったら、来た道を戻って景色を確認します。「曲がり角の手前に赤い看板」まで覚えると見つけやすい。現実でもそのつもりで店を探したら、赤い看板が三軒並んでました。最後に役に立った目印は、隣の犬が寝てた方向。犬、勝手に看板にしてごめん。\n\nある日「おかえり」を「おかわり」と打ち、そのまま数日間「大盛りにする？」と聞かれ続けました。乗っかって「じゃあ漬物も」と返したら、別の人が「今日ないです」。枠主が一言、「うち、何屋だと思われてる？」。そのあと来た初見さんが「何がおすすめですか？」って聞いて、全員ちょっと困りました。\n\n作業しながらの返事は「りょ」だけのときがあります。短くしすぎて「り」と送ってしまい、しりとりが始まったことも。誤字を直すより先に「りんご」を誰かに取られました🍄", "おかわり休憩所", "作業の合間に休憩できる場所🍄 ゲームの話も、誰のせいでもない誤字の話も大歓迎。ただし「おかわり」はすでに店の正式な挨拶になりつつあります。\n\n【コア特典】今日の小さな達成を、枠でゲームのクエストクリア風に発表します。「タオル討伐完了」くらいで十分です。誤字が出た場合は、追加ストーリーが開きます。"],
  ["こうめい＊", "問題が出ると、答えを考える前に出題者の狙いを考えます。こうめいです。そのまま答えていれば正解だったことがよくあります。\n\nボードゲームと歴史ものが好きです。慣れてる人同士の駆け引きも面白いけど、初めて参加した人が思いがけない手を選んで、卓がしんとなるところも好き。自分も一応、意見を聞かれたときだけしゃべるつもりです。\n\nゲームを教えるときは、最初の一手をこちらで決めてしまわず「どっちが気になる？」と聞くようにしています。迷った理由に、その人が何を見ているかがよく出るんです。あとで同じ手を説明するときも、その人が使った言葉のほうが伝わることがあります。\n\n歴史でも「結果を知った今なら、好きな作戦を言えるよね」と自分に言い聞かせます。ところが盤面を見渡せるこちらが今負けています。感想戦では素直に一言。「次、先手もらっていいですか」。\n\n昔、初参加の小学生に作戦を丁寧に伝えたら、黙って聞いたあと「でも、そこに置けば今勝てるよ」と。よく見たら本当にそうだった。「確認してたんだよ」と言い訳したら、「じゃあぼくの番も確認して」と返された。もう大人の顔で座るしかありませんでした。", "一手先の円卓", "ボードゲームと歴史を囲む円卓。慣れた人の定石も、初めての人の「ここに置いたら？」も、打った理由まで聞くとだいたい面白い。私が長話を始めたら手番を進めてください。\n\n【コア特典】身近な二択を一つ預かって、枠のみんなで作戦会議と挙手投票。「先に風呂か、ごはんか」でも決行します。空腹時の軍師に一票を預けるのはご注意を。"],
  ["れん_07", "れん。邦ロックと弾き語りが好きです。特に、音源だと気づかなかったギターがライブではやけに良かった、みたいな話に弱いです。\n\n外では聴くだけで、家に着いたら「こんばんは」。帰り道に教えてもらった曲は、翌日の行きに聴きます。何度か聴いてから、やっぱりあの曲いいねと伝えられたら嬉しいです。\n\n勧めてもらった曲は、最初は普通に聴いて、二回目は歌の隙間の楽器を追います。一度耳に入ると、三回目からは歌と一緒に勝手に聞こえてくる。昔の好きな曲で試すと、当時は友だちとサビばかり歌っていて、いいところを半分聞き逃してた気がします。\n\nライブで隣の人の拍手につられて、一人だけまだ曲が続いているのに拍手したことがあります。隣を見ると、その人は曲に合わせて手を叩いていただけでした。自分だけ一度きっちり締めてしまって、後半はやけに姿勢よく聴きました🎧\n\n昔、小さいライブハウスで機材が止まったとき、歌い手さんが客席に「ここだけ歌える？」って聞きました。最初は前の列の数人だけ。次の行から後ろの方も歌い出して、最後は歌い手さん本人が笑って歌えなくなった。今でもその曲を聴くと、機材が止まったところで少し待ってしまいます🎧", "ギターが鳴る後列", "歌の隙間で鳴ってるギターや、客席がつい歌い始めたサビの話をどうぞ🎧 曲を勧めるなら、好きな一音が出てくるところまで教えてもらえると嬉しい。\n\n【コア特典】「今夜のアンコール係」を一度お任せ。用意した二曲から、枠で最後に話すほうを選んでください。ギターの話が止まらなければ、アンコールが本編です。"],
  ["じに＊", "「それ、どこの？」「どんな味？」\n配信でちょこちょこ質問してたら、たぶんじにです＊\n\n旅行の話から駄菓子の話にすべっていく雑談が好き。おすすめのお店は地図に保存するけど、行ったときのために短いメモも書くようにしてます。短すぎて役に立たないことがあります。\n\n最近、お店のメモには「次に頼むもの」と「誰と行くと楽しそうか」を書きます。同じ「おいしい」でも、急いで一人で食べたい立ち食いと、友だちと半分こしたい大盛りでは別の候補なので。ある店に「一人で」と書いて翌週入ったら、店員さんに「先週のお連れさまは？」と聞かれました。最後の一口を一人で食べたいという意味でした。\n\nある店のメモに「絶対また行く」とだけ残っていて、理由を思い出せず、もう一度行きました。味はおいしい。でも何か違う。駅まで歩いてようやく気づきました。店の先にあったたこ焼き屋が目当てだったんです。今はピンを直したかって？ たぶんあのへんに二つあります(・_・;)\n\n駄菓子のおすすめは「買ってすぐ派」「ちょっと置く派」まで教えてもらえると嬉しい。そこまで聞いたら、メモの見出しがとうとうお菓子の名前より長くなります＊", "よりみち地図帳", "旅先のおやつや地元のうまい店の話を集めてます＊ 好きなところは「また行く」より「次に何を頼むか」まで聞きたい。ピンの位置がズレてても大目に見てね。\n\n【コア特典】好きなおやつを聞いて、ファミリーの「架空の寄り道マップ」にあなたの店を一軒追加します。店名と地図上の場所はお任せ。近所にまたたこ焼き屋ができます。"],
  ["港レター_", "旅の話が好きな方へ。\n\n海沿いを歩くことと、出先でポストを探すことが好きです。みなとといいます。観光地の名前を聞くと、景色と一緒に「朝どこでパンを買うんだろう」と考えます。\n\n枠では知らない街の話が楽しみです。地図で見るだけの場所も多いですが、そこに住んでる人がどこで寄り道するか聞くと、急に行ってみたくなります。\n\n旅先で案内板を見ると、名所へ行く矢印より、反対向きに歩く人が気になります。観光マップには載っていない通りで、朝ごはんの匂いや店のシャッターが開く音に出会うと、空いている時間まで街の一部に思えてきます。同じ場所でも何時に歩いたか、あとで見返せるように書き添えています。\n\n絵はがきの短い文に毎回悩んで、余白に「続きは帰ってから」と書いたことがあります。送った先が自分の家だと、続きが分かる人も自分だけ。あの街で何の続きを書くはずだったか、今でも気になっています。\n\n昔、自分宛てに旅先から絵はがきを送りました。疲れて帰宅した夜に届いて、裏には「明日の朝は港でパンを買う」とだけ。パンがおいしかったことより、明日のことを考えて書いた自分の字が、妙に遠くの人みたいに見えたのを覚えています。みなとより。", "海辺のポスト", "港でパンを買う朝や、観光地と反対向きに歩く人の話を、はがき一枚ぶんだけ。出かけていない日は、近所の好きな道でも。場所の名前と一緒に、歩いた時刻も聞かせてください。\n\n【コア特典】選んでもらった風景をもとに、あなた宛ての架空の旅はがきを枠で一枚読みます。差出人はみなと。書くことに困ったら追伸のパン情報がやたら詳しくなります。"],
  ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ 懐メロとカラオケの十八番に反応します。\n\nドライブ用の曲も集めてます。行きは思わず音量を上げる曲。帰りは、窓を少し開けてゆっくり聴ける曲。昔の曲も最近の曲も、みんなの選び方を聞くのが好きです。\n\n誰かの十八番は、歌い出しより「どこでマイクを離すか」を見るのが好きです。長い音で少し離したり、静かな場所で近づけたり。同じ曲でもその人の間があって、録音をいくら聴いても分からなかった魅力が見えます。僕は笑ってマイクを離す癖があるので、思い出の半分くらいは録音に入ってなさそう。\n\n友人とカラオケに行って、自信満々で入れた曲から知らない歌詞が出てきました。同じタイトルの別の曲です。友人がさらっと歌い切って拍手を浴びる横で、僕は手持ち無沙汰でタンバリンを鳴らしてました。後日「またあの曲入れてね」と頼まれたけど、あの曲はもう彼の持ち歌だと思ってます(￣ー￣)\n\nドライブ用の曲を選んでたら、同乗者に「最初のコンビニで歌の山場を迎えるのやめて」と言われました。次は目的地まで残り一曲のところでかけます。コンビニで降りるなら、サビが終わってからでお願いします♪", "サビから歌う会", "カラオケの十八番とドライブの一曲を持ち寄る会♪ イントロで分かる、サビなら歌える、でも曲名は出ない。そんな状態のまま席にどうぞ。\n\n【コア特典】今の気分を聞いて、曲紹介のひとことを昔のラジオDJ風に読み上げます。最後は僕の口タンバリン。曲名が出てこない日は、そこだけ元気よくお届けします。"],
  ["かんうどん🍜", "かけ、ちくわ天、ねぎ多め。寒い日だけカレーに浮気します🍜 「かん」で大丈夫です。\n\n夕飯を作りながら配信を聴いているので、返事は一拍遅れます。だしの話だけ、包丁を置くので早め。地元のうどんに何が乗ってるか聞くのが好きで、帰省でも旅行でもとりあえず一杯食べてみます。\n\n初めての店では、天ぷらを入れる前にだしをひと口。次は衣が少しほぐれてから。同じ一杯の中で好みの瞬間を探すのが楽しいです。揚げたてを待てずに最初から浸すこともあるので、感想の最後にはたいてい「次こそ順番守る」と書いてあります。\n\nいつもの店で初めて「いつもので？」と聞かれ、覚えてもらえた嬉しさで即うなずきました。来たのはカレーうどん。記憶をたどると、前に白シャツで来てカレーを派手に飛ばした日がありました。帰り際「今日は黒い服で良かったね」と。覚えられてたの、そっちかい。\n\n旅の写真を整理したら、城も橋も場所があやふやで、うどんの写真だけ「移動二日目、店の右手の席」とすぐ出てきました。ねぎの下に何が乗ってたかまで覚えてます。旅のメモ、もうお品書きでいいかもしれません。", "ねぎ多めの席", "かけ、ちくわ天、ねぎ多め🍜 地元の麺やだしの話を歓迎します。天ぷらを浸す前にだしをひと口、と思ってる間に僕はもう浸してます。\n\n【コア特典】「今夜のうどん店長」を一回どうぞ。好きな具を一つ選んで、枠のみんなでメニュー名を決めます。ねぎ多めは私が追加します。店長の決裁を待たずに。"],
  ["土星わっか◎", "土星でも、わっかでも。星座は勉強中です。夜空に明るいものがあるとまず調べます。星だったら嬉しいし、飛行機だったらどこに行くのか気になります。\n\n「月と深海、どっちなら行ってみたい？」みたいな、正解のない雑談には長居します。今なら月です。窓側が取れなかったら最後まで迷うかも。\n\n空を見上げるときは「いま何時で、どっちの方角？」をまず覚えます。翌日同じところに立つと、窓や屋根がものさしになって、見比べやすいんです。道を聞かれると右左で迷うのに、星のことになると方角を聞きたがるのが自分でも不思議。方角を忘れて「コンビニの上」で説明する日もあります。\n\n昔、友人と流星を見に行って、一時間ほど粘りました。ようやく見えたと思って「あっ」と叫んだら、友人も一緒に「あっ」。やっと見られたねと喜んでいたら、友人のほうは近くの自販機に飲みたい缶があるのを見つけただけでした。会話が通じすぎて、帰りまで気づきませんでした。\n\n月に持っていくものを一つだけ選ぶ話では、窓側の人に渡すメモ帳を持っていきます。通路側の私にも、外がいまどう見えるか書いてもらうため。窓側が空いたら、その人に貸してもらう交渉から始めます◎", "土星の窓側席", "今日見えた星や、月と深海ならどちらに行きたいかを語る席◎ 星空の初心者さん歓迎。方角が分からなければ「近所のコンビニの上」で通じる範囲から。\n\n【コア特典】あなたの今日の出来事を星座に見立て、形と名前を一つ発表します。「洗濯ばさみ座」は、晴れの朝によく見つかります。次の番組は窓側席からお届け。"],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。\n「もち」だけで呼んでもらって大丈夫です。\n\nたくさん話す日と、静かにぬくぬく聴く日があります。翌朝「おはよう」から出直していたら、前の日はそのまま寝たんだと思ってください(-_-)zzz\n\n家のお雑煮を教えてもらうときは「作り方」より「お椀を見た瞬間、いつもと違ったら何に気づく？」と聞きたくなります。だしの匂い、餅の形、最後に乗る葉っぱ。自分の家の普通が、別の家では正月のびっくりになるのが面白いです。うちは餅の数で、去年の食欲まで思い出されます。\n\n寝る前に「いま聴いてるよ」と書こうとして、枠の終わりに目を覚ますことも。枠主の「おやすみ」だけちょうど聞こえた日は、今日は目覚ましの反対のものが鳴った、と思ってそのまま布団に戻ります。\n\nお餅はきなこ派。お雑煮は家ごとに違うところが好きです。前のお正月、家族が重そうなお椀を出してきて、底からお餅が三つ出ました。小さい頃は足りなくてよく文句を言ってたのを覚えていたらしい。今は三つだときついから半分残そうと思ったのに、結局きれいに食べました。翌日に「今日も三つ？」と聞かれて、その日は素直に一つにしました。", "毛布ときなこの部屋", "毛布の中からこんばんは。きなこ派も、お雑煮の家ルールを話したい人も、ぬくぬく聴いてってね。挨拶の返事が翌朝でも気にしません(-_-)zzz\n\n【コア特典】「寝落ち実況」を一言。希望の人に「ただいま○○選手、毛布に包まれたまま静かに優勝です」と小声で読みます。拍手もコメント欄でそっとどうぞ。"],
  ["いかいかが？", "いかです🦑 いかがですか、まで読んでくれるとちょっと嬉しい。\n\n水族館ではクラゲから離れられなくて、同行者に先の水槽で待ってもらうことがあります。雑談も行き先が分からない方が好き。天気の話から深海まで来たら、たぶん終わりまでいます。\n\n水族館は、説明板を読む前に水槽だけ見て「今なにしてる？」を勝手に想像します。隅にじっとしている魚を「恋の悩みかな」と眺めていたら、連れは「あのへん水の流れが少なそう」と。丸っきり同じ景色でも、恋の悩みから設備の話まで広がるのが楽しいです。\n\n昔、水槽越しにエイへ手を振ったら、向こう側の通路にいた子が笑顔で振り返してくれました。こっちもそのまま何回か振ってたら、最後の最後で隣のお母さんまで振ってくれた。連れに「あの子、知り合い？」って聞かれて、「今なった」と答えました。肝心のエイがそのあとどこに泳いでいったかは見てません。\n\n雑談でもよく「そもそも、どこからこの話？」と聞きます。最初に天気を聞いたのが私だったりするので、だいたい私が潮の流れを変えています。水槽に戻るか、今日はもう少し泳いでみるか。いかがですか🦑", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 水槽をのぞいて「何してる？」と考えるのも、雑談が天気から深海まで流れるのも好きです。\n\n【コア特典】好きな生き物を教えてもらえたら、その日の気分に合わせて、あなた専用の水族館案内を一文読みます。「考え事中につき低速運転」など、解説員が勝手に代弁します。"],
  ["ゆづる❄", "こんばんは。ゆづるです。\n\n温かいものをひと口飲んで、夜の歌枠を聴きに来ます。バラードは、最初の声が小さくて、自然に音量を上げたくなる曲が好き。曲のあとに短い感想だけ書くことがあります。\n\n感想を書くとき、上手く言えそうにない日は「二番の前で息を吸う音が好きでした」のように、聴いた箇所を一つだけ。伝えたい気持ちを短くすると、どこを聴いていたかがかえってよく伝わる気がします。送る前に書き直していたら、いつのまにか感想より「打って消した時間」のほうが長くなる夜もあります。\n\n温かい飲み物は、歌の区切りで手を伸ばすとなぜかもう冷めています。最後まで座っていた日の印だと思って、そのまま飲むことも。今夜は飲みごろにひと口だけ、先にいただきます。\n\n昔、雪が少しだけ積もった朝に、出勤しようとしたら家の前だけ足元がきれいでした。隣のおじさんがついでに雪をよけてくれたと、帰ってから聞きました。何かお礼をしたくて次に雪が降った日に早起きしたら、おじさんがもう半分やっていて「せっかくだから一緒にやるか」と。寒かったはずなのに、何をしゃべりながら作業したかの方を覚えています。", "雪あかりの歌席", "あたたかい飲み物と、夜に聴きたい歌を。うまく感想にできない日は、心に残ったところを一つだけ。感想を書くのが遅れたら、書き直してる間に飲み物が冷めた頃です。\n\n【コア特典】その日の締めのひとことを選べます。「おやすみ」でも、明日の自分への伝言でも。最後にゆっくり読み上げます。「明日の私、洗濯を忘れずに」も歓迎。"],
  ["じゃっくん☆", "はーい参加します！ 何に参加するかは今から聞きます。じゃっくんです🙌\n\n実況、早押し、大喜利。誰かの一言に、みんなが一個ずつボケを足していく流れが好きです。コメントの「w」が多いほど、自分も隣の部屋に聞こえないよう必死です(≧▽≦)\n\n大喜利は自分の答えをすぐ出すより、誰かが置いたボケの続きを一行書くのが得意です。「冷蔵庫に社長が住んでます」だったら、そいつはプリンに何て書くかな、って考える。正解はないけど、前の一言をちゃんと拾うと次の人が入りやすい。なお僕の冷蔵庫なら、社長のプリンもたぶん食べます。\n\n昔、友だちと対戦ゲームしてて「やった、勝った！」と叫びました。自分が見てたのはずっと友だちのキャラで、こっちは画面の端で壁に向かって走ってました。「声だけは完全に勝者だった」と言われて、それが一番おかしくて二人で床に座り込みました。次の対戦では、やっと自分のキャラを見つけた頃に試合が終わってました。\n\n実況で「右！右！」と応援したら、選手が画面の向こうで左を向きました。自分が逆向きに座っていたわけでもないのに「そっちの右ね」とか言って、二人分の方向音痴を一人でやりました🙌", "とりあえず参戦部", "はーい参加します！ 実況も大喜利も、先に挙手したら何をするか聞く部です🙌 一人が置いたボケにひとつずつ足して、最初のお題に戻れなくなるまで歓迎。\n\n【コア特典】日常の小事件を、僕がラスト10秒の決勝戦みたいに実況。「○○さん、電子レンジの残り一秒を見送ったー！」など。冷蔵庫を開けただけでも盛り上げます。"],
  ["さなだんご。", "さなです。だんごでも反応します。\n\n休日の午前中、パン屋さんへ。家まで我慢できる日は少ないです。料理の話では、何を作ったかより「何を入れたらおいしかった？」が気になります。歌枠なら、曲の前に昔の思い出を聞ける時間も好きです。\n\n料理を教えてもらうときは「どのくらい入れた？」より「いつ入れた？」を聞くことが増えました。同じ材料でも仕上げにちょっと足すのと最初から混ぜるのでは、食べたときの印象が違って面白いです。「最後に少し」を守れず二回足して、私の代だけレシピが派手になりがち。\n\n昔、焼きすぎたクッキーを「焦げたとこはよけてね」と言って友だちに渡しました。あとで送られてきた写真は、クッキーが一枚も写ってない空っぽのお皿。その横に紙で「次は倍で」とありました。ちょっと嬉しくなって同じ型を出したんですが、次は気を抜いて焼く時間を間違えました。それ以来、渡すときは「今日の焼き具合チェックお願いします」と言ってます。\n\nパンを二つ買った帰り、「袋の中のいい匂い」を家に持って帰ろうと思いました。玄関で袋を開けたら、パンが一つ。歩き食べは我慢したつもりだったのに、店の前で一個食べたのを忘れてました。半分は持ち帰れたので、今日は合格。", "焼きたてひと皿", "パンの焼ける匂いと隠し味の話が好きです。何を入れたかも、いつ入れたかまで聞くと試してみたくなる。味見で半分なくなっても、それは大事な確認です。\n\n【コア特典】「きょうの味見係」。好きな材料を一つ出してもらって、相性のよさそうな隠し味をコメントで募集します。名前が先に決まったら、うちの店ではもう新作です。"],
  ["ゆずっこ。", "ゆずです〜🍊\n夕方によくいます。家事しながら「おつかれ〜」とだけ書いて、また耳だけに戻ることも。拍手が並んでたら、しれっと一つ足す派です。\n\n散歩には、気づくと足が速くなる曲。お菓子は柑橘の季節限定に弱くて、味が気になると家まで待てません。\n\n私の家事プレイリストは、サビまでに何を終えたいかで並べてます。一曲目はタオルをたたむ、二曲目は食器をしまう。手が空く頃に好きな曲が来ると小さく得した感じ。この前は一曲目で聴き入っちゃって、二曲目の予定がそのまま明日の予定になりました。\n\n前に限定のゆず味を求めて三軒回ったら、最寄りの店でレジ横に山積みでした。「今なら２個でお得」とあったので、二袋買って帰宅。開けたらゆずじゃなくて、ゆず胡椒でした。ちょい辛。悔しいから家族に「見つけたよ」とだけ渡したら、「探してたのこれでしょ」と本物を出してきた。同じ店で買ったそうです。\n\n柑橘のおやつは「香りが先か、すっぱさが先か」を聞くのが好きです。中身の分からないお土産をみんなで食べると、同時に「すっぱ！」になるかどうかで結構盛り上がる。こっちはそのあと、水探し係です🍊", "ゆず色おつかれ会", "夕方の「おつかれ〜」だけでも大歓迎🍊 家事の合間に一曲、季節の柑橘おやつにひとこと。食器をしまうつもりで二曲聴いちゃった人も、今日は仲間です。\n\n【コア特典】今日終わった家事を教えてくれたら、枠で柑橘の名前をつけて表彰します。「ゆずの香る洗濯完走賞」など。乾いてないタオルの分も、いったん拍手しよ。"],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。\n\n戦国の話は、合戦よりも、誰が誰にどんな手紙を残したかが気になります。猫の話は守備範囲広め。コメントが「かわいい」だけでも、だいたいちゃんと聞いてます(=^･ω･^=)\n\n手紙の話で好きなのは、立派な言い回しより最後にちょこっと書かれた頼みごとです。「伝えておきたい」ことより「忘れないでほしい」ことの方に、書いた人の気持ちが見える気がします。うちの置き手紙は末尾に「猫のおやつ一回分を忘れずに」。書き手を問わず一番効き目のある一文にござる。\n\n以前、好きな武将を紹介する番組を家族と見てたら、一番いいところで猫がテレビの前に座りました。巻き戻したら、また同じ場所で座る。三回目はもう全員、武将より猫が来るかどうかに注目してました。結局その日は番組の話が全然できなかったけど、今でも家族の誰かが画面の前に立つと「参戦ですか？」と聞かれます。\n\n枠で戦国の話をしていても猫が来たら席を譲ります。そっと座布団を差し出したら、当然の顔で私が座っていた方に着席しました。領地を取られるときって、意外と静かですฅ", "ねこ殿の書状部屋", "武将の書状と猫の話を、夜にしれっと。歴史の大事な場面でも、猫殿が画面の前に座ったら一旦そちらです。座布団まで占領されたら、そういう時代でござる。\n\n【コア特典】あなた宛てに「猫殿からの書状」を読み上げます。だいたい書き出しは丁寧なのに、末尾は「おやつを一回分追加されたし」。花押の代わりに肉球ですฅ"],
  ["ぜうす_", "ぜうす。コーヒーは深煎り。呼び捨てで平気です。\n\n映画を見終わったあとの感想や、答えが一つに決まらない話が好きです。普段は聴いてるほう。考えてるうちに話題が変わって、そのまま返事を飲み込むこともよくあります。ゲームは見た目優先で装備を決めて、あとから性能をどう補うか考えます。\n\n映画で意見が割れたら、まず相手がどの場面を覚えているか聞きます。自分は黙って立っていた人を見ていて、相手はその人の横でずっと動いていた手を見ていたりする。同じ作品を観た話なのに、聞いてると新しいカットが増える感じがします。見直したらその手がただ袖を直してただけの日もありますが、それでもちょっと面白い。\n\n前に友人と同じ映画を観て、帰りの電車でずっと「あの主人公、あそこで何を考えてたんだろう」と話してました。降りる直前、ようやく双方が別の人物を指してると判明。言われて画面を思い出してみると、どっちの解釈でもあの映画が一本成り立つのが、今でもちょっとモヤモヤします。\n\nゲームの装備は外見を変えたら写真を一枚撮ります。先日、衣装だけで見分けていた連れと同じ服にしたら、撮った写真を二人とも自分だと思って保存しました。今もどっちだったかは協議中です。", "深煎りの上映後", "深煎りを飲みながら映画の話。答えが割れたら、先に相手がどの場面を覚えてたか聞きます。ネタバレになりそうなら一声。静かに聴いてるだけの席もあります。\n\n【コア特典】その日の映画トークに「もう一つのラスト」を一行だけ出せます。枠のみんなで続きが見たいか挙手。「二人とも同じコーヒーを頼む」で通る夜もあります。"],
  ["りさっち＊", "りさっちです☺️ カフェではいつものメニュー。リップは新しい色も試してみたい。ドラマは観終わった日のうちに誰かと感想をしゃべりたい派です。\n\n配信を開くのは洗い物の途中が多め。「みんなだったらどうする？」って聞こえたら、一回手を拭いて書きに来ます。雨でも入りやすいカフェの話も歓迎です。\n\nドラマの感想は「好きな人」と「自分なら味方につく人」で答えを分けるのが好きです。画面で見てるぶんには気になるのに、職場にいたらたぶん毎日早く帰りたくなる人、いません？　その違いを話すと、同じ登場人物のことを好きな友だちとも全然違うところで笑えます。\n\nカフェでは一応、季節のドリンクの写真まで確認します。そのあと「いつもので」と注文。店員さんに新作の感想を聞かれて「写真はすごくおいしそうでした」と答えた日は、次こそ頼もうと思いました。さて、今週も雨です☺️\n\n以前、気に入ってるけど派手かなと迷っていたリップをつけた日、友だちに「今日、なんか顔が明るいね」って言われました。私からは何も話してなかったので、その一言が嬉しかった。あとで購入履歴を見たら、同じ色をすでに二本買ってました。どうやら迷っていたのは、つける勇気だけだったみたいです。", "いつものカフェ席", "いつものカフェ席でドラマの感想や、気になるリップのことを☺️ 「推し」と「同じ職場だったら困る人」が同じでも、それは聞きたい話です。\n\n【コア特典】今日の気分を聞いて、あなた専用の「架空カフェの本日の一杯」を発表します。名前に深い意味はなくても、店員さんの顔で「いつもので？」まで言います。"],
  ["ちょぱ丸_", "予定　コンビニまで往復10分\n結果　寄り道込みで30分\n買いに行ったもの　忘れた\n\nちょぱ丸です。アニメの話は長め。推しを一人に絞れと言われたら「今日の一人」で答えます。枠では最初に挨拶して、しばらく流れを聴いてます。\n\n寄り道の場所を覚えるときは「角を曲がってから何が見えたか」を一つ書きます。住所はあとから調べ直せるけど、「赤いのれんの隣に猫」は次に来たとき思い出しやすい。猫が不在なら難易度が上がります。「前はここにいたんすけど」って言い訳する案内係を見つけたら、そっと地図を出してあげてください。\n\n前に道を聞かれて、自信満々に「この先です」と教えた数分後、自分が逆の道で迷いました。さっきの人と再会した瞬間「あ、違いました？」って相手の口から。二人で地図を開いたら同じ店が目的地で、そのまま一緒に着きました。店員さんに「お連れさまですね」と言われて、お互い否定するタイミングを失いました。\n\n好きなキャラの話は、名場面より一瞬だけやった動きを語られたときに乗っかりがち。「そこ見てた？」から始まって、結局その回をもう一度観ます。寝る予定が、また30分ぶんほど寄り道しました。", "寄り道アニメ部", "推しを一人に絞るなら、今日の一人でOK。アニメの話から店の話へ脱線したら、また寄り道ってことで。案内役を頼まれると、たぶん猫を目印にします。\n\n【コア特典】あなたの最近の寄り道を、次回予告にして枠で読みます。「次回、○○さん、用もないのに二階へ」。本編より予告が面白かったら、たぶん成功です。"],
  ["敬語でラスボス🎮", "ようこそお越しくださいました。ラスボスとお呼びいただければ幸いです🎮\n\nゲームは終盤ほど寄り道が増えます。装備を揃え、回復も用意し、最後の扉の前でいったん休憩。配信では勝負の行方を皆さまと見守る時間が好きです。お気に入りのボス戦の曲がございましたら、ぜひお聞かせください。\n\n攻略では、負けた原因を一つだけ書き留め、次の挑戦でそこだけ変えるようにしております。回復の品も立つ位置もまとめて変えると、勝っても何が効いたか分かりませんので。改善箇所に毎回「落下」と書いていたら、同行者より「まず上を見ずに歩いてください」と助言を賜りました。\n\nかつて決戦のために一時間ほど装備を整え、いざ突入した直後、足を滑らせて崖から落ちました。復帰してもう一度挑んだらまた落ちました。三度目は慎重に歩きましたが、そこで初めて橋が別にあると気づきました。なお、ボス戦は二分で終了しました。準備にかけた時間の使い道を今も考えております。\n\n配信でお気に入りのボス曲を伺う際は、戦い始めと追い詰めたあと、どちらが好きかまでお聞きします。音が変わったことに気づかない方もご安心ください。私もその頃は回復の残り数を数えております。", "決戦前の休憩室", "ようこそ決戦前の休憩室へ。攻略の失敗談や、終盤で鳴り始める好きな曲をお聞かせください。最後の扉へ向かう前に、足元と回復のご確認を。\n\n【コア特典】今日の小さな達成を、ラスボスが最大限の敬語で祝福いたします。「恐れ入りますが、洗濯完了の功績により、今夜の挑戦は免除とさせていただきます」。"],
  ["simba_", "シンバです。景色が良ければ車を止めるし、曲が良ければ頭から聴き直します。先へ進むまでが長いです。\n\n雑談はだいたい飲み物片手に聴いてます。動物園の話になるとコメントが増えます。いちばん長くいるのはペンギンの前。腰を落として、水に入るか入らないか見てる時間が好きです。\n\n動物園では、同じ水槽の前でも大人と子どもで見えるものが違います。子どもが「下から来た」と言うのでしゃがんだら、水面の下を飛ぶみたいに通り過ぎる姿が見えました。次に動物の話が出たら、誰の目の高さで見た話かも聞いてみたいです。\n\nドライブの「景色が良かった」の中身は、ベンチの向き一つだったりします。この前は海が見えると思って座ったら、正面に駐車場。隣で友だちが「車が見守ってくれてる」。言われてから、あのベンチもちょっと好きになりました。\n\n前に動物園で、知らない子がペンギンに「行ける、行ける」と小声で声援を送ってました。飛び込んだ瞬間、いちばん大きく拍手したのが隣のお父さん。振り向いたら通りすがりの大人まで数人のぞき込んでいて、みんななんとなく照れ笑いしてました。次の一羽が来たとき、誰も帰りませんでした。", "停車中の見晴らし席", "景色がよければひと休み。車で流したい曲や、動物園で思わずしゃがんで見たものを話す場所です。ペンギンが飛び込むまでは、もう少しだけ待ちます。\n\n【コア特典】「今日の停車係」として、話したい景色を一つ選べます。枠のみんなで、そこで何をするか一言ずつ。駐車場しか見えなくても、お茶休憩は開催できます。"],
  ["kuroha_", "夜。作業。イヤホン。\nくろはです。邪魔にならない音量で聴き始めて、気づけば一番おもしろいところで手が止まってます。\n\nゲームは背景と音楽が気になる方です。好きな曲が流れる場所では無意味にうろうろします。作業用BGMもゲームのサントラが多め。おすすめは曲名が分からなくても、どんな場面で流れるか聞けたら探します。\n\n同じ作業用BGMでも、手を動かす仕事と文章を考えるときでは選ぶ曲が違います。言葉が浮かばないときは、好きすぎるゲーム曲を一旦外します。あの場面どうだったっけ、と調べ始めると手が止まるので。書き仕事のために昔の曲を我慢して、休憩時間に攻略動画を四本観た日はだいぶ本末転倒でした。\n\n枠で曲名が分からないときは、先に風景を聞きます。雪の町、夕方の港、何度も迷った洞窟。言われた場所を思い浮かべるだけで、曲がまだ見つかっていなくても少し楽しいです。\n\n昔のセーブを開いたら、最終決戦の手前だったはずなのに、わざわざ最初の村に戻ってました。そこで曲が流れた瞬間、学校から帰って急いでランドセルを下ろした頃の部屋を思い出しました。何で戻ったか忘れてたけど、たぶん昔もあそこで音楽を聴いてたんだと思います。", "夜更けのセーブ地点", "夜。作業。イヤホン。ゲーム音楽と、曲の鳴っていた場所の話を。洞窟と夕方の港だけで一曲当てようとして、作業の予定を忘れることがあります。\n\n【コア特典】今日終えた作業を、セーブ画面に出そうな一行にして読みます。「○○さんは食器をしまった。ここから再開できます」。寝る前の最後の記録にどうぞ。"],
  ["まさむね_", "まさむねです。休日は城下町を歩いたり、道の駅で買い物をしたり。旅先の説明板を全部読みたいので、一緒に行った人をお待たせすることがあります。\n\n雑談枠では地元の定食屋の話や、もう一度行きたい町の話が好きです。観光のついでに食べるつもりが、次はその店だけ目当てに出かけることもあります。\n\n町を歩く前に昔の地図を見ると、今の道で急に曲がっている場所が気になります。一度「昔の堀の名残かな」と同伴者に得意げに言ったら「地図、上下逆だよ」。そのまましばらく歩き、現代の地図でも迷いました。以後、歴史の話をする前に、現在地を二人で確認しています。\n\n定食屋さんで「いつからこのメニューですか」と聞いたら「昨日から」と返ってきたことがあります。老舗の話を想像していたので二人で笑いました。古いものが好きですが、行った日から始まる思い出も結構好きです。\n\n昔、城跡で説明板を読んでいたら、通った方に「何か見つけましたか」と声をかけられました。立ち話していたら、昔は同じ場所が子どもの遊び場だったそうで、「坂はここから滑ると速いんですよ」と。史跡を見に行って、帰りにはその人が滑り降りた坂ばかり目で追ってました。", "城下町の寄り道帳", "城下町の道、説明板の続き、定食屋で頼んだもの。旅先でつい足を止めた話を持ち寄りましょう。一緒に歩く方は、説明板の前で少しお待ちください。\n\n【コア特典】あなたの何気ない寄り道を、枠で史跡の説明板風に紹介します。「○○氏、ここで揚げたてのコロッケを食す」。年代は聞かれたら「今週」です。"],
  ["路面ベル♪", "まもなく、商店街のパン屋さんの前です。お降りの方はどうぞ♪\nベルと呼んでください。\n\n路面電車の窓から、お店の看板や買い物帰りの人が見えるのが好きです。旅先では目的地に着く前に写真がいっぱいになります。散歩中の返事は、渡り終わってから書くので少しのんびり。\n\n初めての街では、一度すぐ降りずにひとつ先の電停まで乗ります。戻る道で、車内からは屋根しか見えなかったお店の入口が分かるし、夕方にだけ列ができる場所にも気づける。パン屋を通り過ぎた言い訳にもなります。戻った頃には目当てのパンが売り切れていて、寄り道に次回予告がついたことも。\n\n写真を見返したら、きれいな景色より「同じ店で何かを買って帰る人」が何枚にも写ってました。そういう暮らしの景色を見に来たのかも。次は買い物袋をぶら下げて、向こう側から窓を見上げてみます♪\n\n以前、雨の電停にいたら、知らない人が傘をそっとこっちに寄せてくれました。話したのは「もうすぐ来ますね」の一言だけ。降りるときに振り返ったら、その人が窓越しにちょこんと頭を下げてくれました。休日に撮った写真は何十枚もあるのに、いちばん思い出すのは、写真にないあの傘です☂️", "ベル待ちの電停", "まもなく、寄り道したくなる街に着きます♪ 車窓で気になった看板や、通り過ぎてから戻ったパン屋さんの話を、ベルが鳴るまでどうぞ。\n\n【コア特典】一日の出来事を一つ聞いて、あなた専用の架空の停留所にします。「次は、パン二個買ったのに家では一個前」。ご降車の際は、おやつのお忘れ物にご注意ください。"],
  ["ねずち。", "すみっこ、空いてますか。ねずちです🐭\n初めはあいさつだけ。知ってるアニメやゲームが話題になったら、ひょこっとしゃべります。\n\nチーズのおやつをつまみながら枠を聴くことが多いです。誰かの笑い声につられて笑って、肝心の話の中身を聞き逃すこともあります。返事が遅いのは、だいたい食べてる間です。\n\n会話についていけないときは、今聞こえた単語を一つだけ聞き返します。「チーズってお菓子の方？」まで聞けば、誰かが一言で事情を教えてくれるので。「チーズではなく地図です」と直された日もありました。こっちが食べてるものに耳まで引っ張られることがあるみたいです🐭\n\n前に作業しつつ「今のわかる」とコメントしたら「え、実家でヤギ飼ってた話だけど」と返されました。一個前の話のつもりだったのに、初見さんに「ヤギって何食べるんですか？」と真剣に聞かれました。「ちょっと家族に確認します」と書いてから、我が家にいるのは金魚だけだと白状しました。\n\n枠で返事が遅くても、笑ったところは意外と覚えてます。翌日に「あのときなんで笑ってたの？」と聞かれたら、笑った理由より何をつまんでたかが先に出てきます。今日はチーズ。昨日もだいたいチーズ。", "すみっこチーズ席", "すみっこ、空いてます🐭 アニメもゲームも、話せそうなときにひょっこりどうぞ。返事が来なかったら、チーズをつまんで手がふさがってると思ってね。\n\n【コア特典】ひとこと日記を「すみっこ通信」の見出しにしてファミリーに載せます。「○○さん、静かに帰宅。チーズの残量は未確認」くらいの、誰も急がないニュースです。"],
  ["いなりまる。", "晩ごはんを食べながら、明日の献立を決めてます。配信で飲食店の話になったら、何が乗ってたかまで聞くタイプ。「いなり」でどうぞ。\n\n好きな組み合わせは、だしのきいたうどんとおいなりさん。枠では夕飯後から少しずつしゃべります。初めて来た人も一緒に笑ってる雑談には、つい長居します。\n\n献立に迷った日は、最初に味を決めます。昨日が甘辛かったら今日はだしの気分かも、くらいで考えると冷蔵庫で探すものが絞られます。前に「今日はさっぱり」と宣言したのに、残り物の説明をしているうちにカツ丼になりました。味の方針は、残り一枚のトンカツほど強くありません。\n\n昔、お弁当のおいなりさんが一つだけ裏返しで入ってました。開けたら、小さい梅干し。帰宅して聞いたら「当たりを一個だけ入れたよ」と言われました。梅干しが苦手なのは、きれいに忘れられてました。でも次に同じお弁当が来た日、ひとつ裏返しになってないか探したのは覚えてます。\n\n料理の話で好きなのは「うちではそれに何を添える？」です。同じうどんから、いなり派、おにぎり派、天ぷらをおかずにごはん派まで話が広がります。途中でお腹が減ってきたら、今日の話題がうまくできていた証拠。", "いなりと明日の献立", "だしのきいたうどんとおいなりさん。昨日と違う味にしようと思っても、最後のトンカツがあれば予定変更です。添える一品の話まで聞かせてください。\n\n【コア特典】冷蔵庫にある食材を一つ聞いて、あなた用の「明日の架空定食」を枠で提案します。気がつくと、うどんといなりが両方ついてくるのは店の仕様です。"],
  ["はんこびより。", "今日のメモ\n□ 枠で聞いた曲をあとで探す\n□ 試し書きしてからペンを買う\n□ シールは家にある分を思い出す\n\nはんこです。ノートを開いたまま、夜の雑談をよく聴きます。書いてるうちに話題が変わるので、返事は少し遅いです。使い込んだペンや、ずっと手放せないノートの話が好きです ( ..)φ\n\nノートに曲名を書くときは、横にその場のひと言も書きます。後日「はじめて来た人が、この曲だけハモってた」と読んだら、曲より先に枠の空気がよみがえりました。曲名が分からず「たぶんものすごく有名」とだけ書いた日は、未来の私が困ることまで先に分かります。\n\nシールの余白を残していたら、下の段に母が「ここに牛乳って書いといて」と書いてました。私のノートはその日だけ、買い物メモ兼みんなの伝言板。きれいに使おうとしたページより、あとから開く回数が多いです ( ..)φ\n\n片付け中に出てきた昔のノート。気合いを入れて書いたらしい予定はどこも真っ白で、最後のページだけに「今日はよく寝た。明日もそうしたい」と一行ありました。もっといろいろ書けたはずなのに、その一行だけ残した自分がおかしくて、笑ってから久しぶりにその晩は早く寝ました。", "夜のひとことノート", "今日のメモ □ 好きな曲を一つ □ 消せない落書きの話 □ 眠くなったらノートを閉じる。書くことが出てこない夜は、聞こえたひとことだけでも。\n\n【コア特典】今日できたことに、ファミリーで「一行はんこ」を一つ押します。「ノート開いただけでえらい」など、文字だけのはんこです。白紙の日にも押せます ( ..)φ"]
];

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label + 'をコピー';
  button.setAttribute('aria-label', name + 'の' + button.textContent);
  button.addEventListener('click', async () => {
    const value = target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = label + 'を選択しました。長押しやメニューからコピーしてください。';
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

function buildFamilyDetails(name, familyName, familyDescription) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリーを見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  for (const [label, value] of [
    ['ファミリー名', familyName],
    ['紹介文', familyDescription]
  ]) {
    const term = document.createElement('dt');
    term.textContent = label;
    const description = document.createElement('dd');
    description.className = 'family-value';
    description.tabIndex = -1;
    description.textContent = value;
    fields.append(term, description);
    actions.append(copyButton(label, name, description));
  }

  details.append(summary, fields, actions);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
