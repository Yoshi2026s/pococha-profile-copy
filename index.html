<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "るいです。帰りの電車はイヤホン片耳だけ。もう片方で車内放送を聞きつつ、歌枠や雑談を聴いてます。平成のJ-POPが流れると、口癖は「これ昔めっちゃ聴いた」。曲名まで思い出せる頃には、だいたい二曲先です。\n\n休みの日は一つ先の駅までのんびり歩きます。その道すがら枠で教わった曲を聴いて、好きな音が入る秒数をメモするのが最近の楽しみ。「二番のサビ前」と聴きどころまで教えてもらうと、その人の耳をちょっと借りた気がします。歌詞が息つく間もなく続く曲は、追いかけるだけで疲れるので少し苦手です。\n\n前に終電で、向かいの人が窓に映る自分を見ながら小さくエアギターをしてました。何の曲を弾いてるのか、指先を見て想像していたら、降りる駅に着きました。その晩いちばん耳に残ったのは、ホームで聞いた発車メロディー。それこそ「昔めっちゃ聴いた」やつでした。", "片耳プレイリスト", "帰りの電車に似合う曲を一曲ずつ。思い出せたのが「二番のあとでギターが入る」だけでも話は始められます。平成J-POPも新しい曲も、聴きどころを一つ添えてどうぞ。", [["1K", "おかえり放送", "名前を呼んで、車掌風に「今日もおつかれさま」。"], ["5K", "片耳メッセージ", "今日の気分に合う、名前入りのひと言を贈ります。"], ["10K", "帰り道の一曲", "あなたに似合う一曲と、聴いてほしい場所をお伝えします。"], ["20K", "臨時の車内放送", "「次は、よく頑張った○○さん前」と、今日の話を車内放送に。"], ["30K", "片耳きっぷ", "あなたの名前とおすすめ曲を、記念きっぷ画像に。"], ["40K", "帰り道ラジオ", "今の気分に似合う二曲とお礼を、1分のDJ風に。"], ["48K", "○○さん行きの終電", "あなた宛ての2分の車内放送と、名前入り終電きっぷ画像。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」までが挨拶。じょーれんです、どうもまた来ました。枠で流れるとみんなで口ずさめる、昔のJ-POPが好き。夕飯にパクチーがのってたら、そっと皿の端に置きます。あの香りには今も慣れません。\n\n週末は友だちとバドミントンをします。ダブルスで二人とも「任せた！」と声をかけて、間に落ちるシャトルを見送ったことがあります。今月の小さな目標は、迷ったら「取るよ」と声を出して、自分で一球返すことです。\n\nある晩、枠で「初見さん、こんばんは！」と迎えたら「昨日あんたと一時間しゃべったよ」と言われました。前の日も僕は同じ挨拶をしたそうです。コートでも枠でも、確かめる前に口が動きます。翌日はその人から先に「はじめまして」。あっちのほうが声をかけるのが早いなあ。途中で来た人は「今なんの話？」からどうぞ。", "また来た初見席", "初見です、昨日ぶりです、どっちも同じ温度でどうぞ。途中で来た人には「会長がどうして会長なのか」からお伝えします。ちなみに選考方法はじゃんけんです。", [["1K", "昨日ぶりの初見", "名前を呼んで「初見さん、昨日もありがとう！」。"], ["5K", "また来てくれて賞", "あなたが来てくれた日の思い出を一行で贈ります。"], ["10K", "自称初見の名札", "「初見・認定○回目」を添えて名前を紹介します。"], ["20K", "初見なのに表彰", "覚えているあなたの一言を「初対面の名言」として発表。"], ["30K", "初来店（自称）証明書", "名前と「昨日も来店」の認定カード画像。"], ["40K", "あなたを覚えてる理由", "好きなところや思い出を、1分の常連紹介に。"], ["48K", "○○さん歓迎総会", "あなたとの思い出を振り返る2分の総会と、会長名札画像。"]]],
  ["あずき＊", "あずきです🍡 粒あんのおまんじゅうが好き。タイムを測る長距離走は苦手です。冬のフィギュアスケート観戦では、ジャンプの手前で手に力が入って、着氷を見届けてようやく息をつきます。演技のあとの拍手まで聞くのも好き。\n\n和菓子屋さんでは薄い包み紙が気になります。気に入った絵柄は平らにして、小さな缶にとってあります。いちばん古いのは、祖母がくれたおまんじゅうの紙。二つもらって「おばあちゃんも食べる？」と一つ差し出したら、「それは明日のあんたの分よ」と。家に帰って包みを見たら、差し出したほうに小さく「明日」と書いてありました。\n\n今も箱で買うと、二日に分けるつもりです。初日に二度開けるのは「味見の続き」。包み紙だけは、うっかり捨てないように先に缶へ入れます。和菓子のおすすめは味だけでも歓迎ですが、包みがきれいならそちらの話もぜひ。", "粒あんと夜のお茶", "お茶をいれる間に、今日のおやつと夜に聴きたい歌の話を。和菓子のおすすめは、夕方の濃いお茶に合うか、明日のために取っておきたい味かまで聞かせてね🍡", [["1K", "湯のみ一つ", "名前を呼んで「今日のお茶、あなたの分もあります」。"], ["5K", "明日の包み紙", "「明日のあなたへ」の名前入りひと言便り。"], ["10K", "あずきのおやつ便", "お好みに合う和菓子と、お茶の組み合わせを一つ贈ります。"], ["20K", "架空の和菓子命名", "あなたのための一粒を命名。「二度目の味見」も候補。"], ["30K", "粒あんのお品書き", "名前と架空の銘菓を入れた和菓子カード画像。"], ["40K", "お茶の間お礼便", "あなたと話したことを思い出しながら、1分の茶席お礼。"], ["48K", "明日の分もある限定箱", "あなたを思わせる二品を2分で紹介。名前入りの箱絵画像付き。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 洗い物をしながら聴くので、返事が止まったらだいたい泡を流しています。ほうじ茶の飲み比べが趣味。涼しくなった日に、熱いお茶と焼き芋を一緒に味わうのが秋の楽しみです。何杯も並べて撮るのは苦手で、カメラを出す前に気になる一杯を飲みます。\n\n前に友人と、いつものほうじ茶と奮発したほうじ茶を別々の急須でいれました。友人が二杯目を飲んで「こっちのほうが香りが上品だね」。そこで手つかずの急須に気づいて「あれ、これはいつ飲むの？」。僕は二杯とも、いつもの急須から注いでました。\n\n慌ててもう一方のお茶を注ぐと、友人が「こっちはちょっと焼き芋っぽい」と一言。テーブルの真ん中には、さっき割ったばかりの焼き芋がありました。次の目標は、両方の急須から一杯ずつ。おやつは感想を言ってからです( ˘ω˘ )", "ほうじ茶の間", "お湯が沸いたらこんばんは🍵 ご当地のお菓子や、少し冷めてから分かるお茶の香りをゆっくり話す場所です。聴いてるだけの方にも湯のみは出してあります。", [["1K", "沸いたよコール", "名前を呼んで「湯のみ置いときました」と歓迎。"], ["5K", "湯気のひと言", "今のあなたに合う、お茶うけみたいなひと言。"], ["10K", "あなたのお茶合わせ", "好きなおやつに合うお茶を一つ、おすすめ理由つきで贈ります。"], ["20K", "急須の食レポ", "あなた向けの組み合わせを紹介。難しいときは「実家の台所の味です」。"], ["30K", "茶席の名札", "あなたの名前とおすすめのお茶を入れた茶席札画像。"], ["40K", "湯のみ一杯のお礼", "聞いてくれた時間への感謝を、1分のお茶トークで。"], ["48K", "○○さんの貸し切り茶席", "好みをもとに2分のお茶会トーク。名前入り茶席札画像付き。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこで立ち上がる、ぼるとです⚡ 野球選手の自伝が好きで、派手な逆転打の手前で打者が何を考えたかまで読みます。ジョギングは一定のペースが苦手で三分で歩きだすのに、粘る打席なら何球でも待てます。\n\n中継の前はお茶を入れて、スマホの速報通知を切るのが決まりです。通知を切り忘れた日は、湯のみ片手に球場の売り子になりきって「ネタバレ入りましたー。お茶で口直しいかがですかー」。これが僕の一発ギャグ。家族は無言でお茶だけ持っていきます。\n\nある試合で、僕が観ていたネット中継は隣のテレビより少し遅れてました。家族が叫んだので「結果言うな！」と返したら「足つっただけ！」。数秒後にこっちで逆転して僕が叫ぶと「それ、もう見た」。通知はちゃんと切ったんやけど、隣の部屋までは消音できません。試合後のヒーローインタビューは隣の部屋で。僕「で、どこつったん？」家族「足の指」。", "九回裏の応援席", "逆転打の話は大歓迎。その前に粘って塁に出た選手や、ベンチの端で先に立った人の話も聞きたい応援席です。途中から来ても、今のカウントからどうぞ⚡", [["1K", "応援席へ入場", "名前を呼んで「○○選手、入場です！」と拍手。"], ["5K", "本日の好プレー", "あなたの頑張りに一行の応援コメントを贈ります。"], ["10K", "応援ボードのひと言", "名前を入れたあなただけの応援フレーズを枠で紹介。"], ["20K", "代打アナウンス", "「代打、洗い物を終えた○○さん！」と頑張りを実況。"], ["30K", "名前入り選手カード", "あなたの得意技を載せた、架空の選手カード画像。"], ["40K", "九回裏のお祝い実況", "今日できたことを1分の逆転実況に。地味な好プレーも拾います。"], ["48K", "○○選手のヒーロー特番", "あなたを主役に2分の試合実況と名前入りスコアカード画像。"]]],
  ["たっぷりん🍮", "ぷりんと呼んでください🍮 プリンは固め、カラメルは苦め。歌枠で昭和の歌謡曲が流れると、タオルをたたむ手が止まります。お菓子のレシピ本は、工程が何ページも続くと苦手。新作の棚の前では十分迷えるので、作るより買うほうが向いてます。\n\n大事な日の前の晩は、固めのプリンを一つ冷蔵庫に。前にそれを食べていたら、ずっと探してた曲が歌枠で流れて、やっと題名が分かったんです。縁起を担いでるつもりでも、買う理由が増えただけかも。スプーンを入れるときの口癖は「カラメルは最後まで」。三口目にはもう全部混ざってます。\n\nある晩、そのプリンを冷蔵庫に隠して、場所まで忘れました。翌朝、家族が野菜室から出して「ここ、高級デザート売り場になってるよ」と。奥には別の家族が隠したシュークリームまでありました。あれ以来、野菜室を開けるときだけは、野菜より先におやつを探しています。", "固めプリン同好会", "固め派にもとろとろ派にも席があります🍮 プリンの食感や、カラメルをどこで混ぜるかを話す部です。懐メロが流れたら、おやつの話も洗濯もいったん休憩。", [["1K", "スプーン一杯の拍手", "名前を呼んで「拍手をひとすくい！」。"], ["5K", "おやつの応援札", "忙しい日にひと息つける、名前入りの短いメッセージ。"], ["10K", "今日のごほうび候補", "好みの食感を聞いて、ごほうびプリンのタイプを一つおすすめ。"], ["20K", "新作プリン発表", "あなた専用のプリンを命名。「野菜室でひと晩熟成」は架空の売り文句。"], ["30K", "名前入りプリンラベル", "好みの食感とあなたの名前を入れたラベル画像。"], ["40K", "高級おやつ売り場の放送", "あなたをイメージしたプリンを、1分の売り場放送で紹介。"], ["48K", "○○さんの限定プリン", "オリジナルプリンの2分発表会と、名前入り限定ラベル画像。"]]],
  ["mira☾", "mira（ミラ）です。眠る前はアコースティックギターの音がよく聞こえる弾き語りを聴きます。タイマー付きの早押しゲームは苦手。答えが浮かぶ頃には次の問題です。映画館では照明がつくまで、好きな場面を席でゆっくり思い返します。\n\n映画を観る日は、いい作品に当たりますようにと、古い月柄のハンカチを持っていきます。小さな目標は、観終わったら耳に残った音を一つメモすること。冷蔵庫の低い音とか、廊下を歩く靴の音でも、その場面を思い出せるのが不思議です。\n\n映画で聴いた曲の題名を知りたくて、友人に鼻歌を送ったら、「途中から別の曲になってる」と。翌日には元の曲と、間違って混ぜた曲の名前まで届きました。その日の音のメモは、正解とおまけで二曲です。枠で話題が変わったあとに私が前の話への返事を書いていたら、まだ自分の席でエンドロールを観ている途中だと思ってください。", "余韻のひと席", "映画を観終わっても、すぐには席を立たない人へ。夜の弾き語りと、その場で言いそびれた感想を聞く席です。あらすじより、耳に残った物音を一つ持ってきてくれると嬉しいです。", [["1K", "今夜のひと席", "名前を呼んで「照明がつくまでごゆっくり」。"], ["5K", "余韻のお礼", "あなたの言葉や今日の気分に合わせて、一行の感謝を贈ります。"], ["10K", "あなたへ一曲", "今夜の気分に合う曲を一つ、聴いてほしい理由と一緒に。"], ["20K", "今日のエンドロール", "一日の話を映画の配役に。「主演、開かなかった傘」もあり。"], ["30K", "一夜のポスター", "あなたの一日を題名と名前入りの映画ポスター画像に。"], ["40K", "眠る前の一分朗読", "あなた宛ての小さな物語とエンドロールを1分で朗読。"], ["48K", "あなたの一夜を上映", "あなたを主役に2分の朗読。名前入り上映ポスター画像付き。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。伊沢拓司さんのクイズ番組では、正解よりどう考えたかが気になります。自分で解くなら答えを先に言われるのは苦手。良いひらめきが来ますようにと、謎解きの最初はいつも同じ青いペンを使います。\n\n意外と得意なのは、一度歩いた道を簡単な地図に描くこと。脱出ゲームでも、ノートの左に部屋の配置を描いて、椅子があった場所に印をつけました。右には推理を書きます。「椅子は絶対怪しい」と青い字で書き足していたら、係の人に「お疲れでしたら座って大丈夫ですよ」と言われました。左の印の横に、一言メモしました。「座ってよし」。\n\n枠で答えが浮かんでも、最初に「ヒント要る？」と聞きます。もし私が「なるほど」としか言わなくなったら、地図は合っていて推理だけ外れたときです(￣▽￣)", "仮説だらけの作戦室", "見たものと推理したことを分けて書く、謎解き好きの作戦室。外れた案も、どうしてそう思ったか聞きたいです。休憩用の椅子は、そのまま座ってよし。", [["1K", "作戦室の一席", "名前を呼んで「椅子は普通です。安心してどうぞ」。"], ["5K", "認定・観察上手", "あなたの気づきに、短くてちょっと大げさな称号を贈ります。"], ["10K", "あなた宛ての一問", "好みに合わせた一問ミニ謎を、答えとセットで贈ります。"], ["20K", "名探偵の表彰", "あなたが気づいたことを探偵口調で称えます。椅子は証拠から除外。"], ["30K", "名前入り探偵証", "あなた向けの二つ名を入れた、架空の探偵証画像。"], ["40K", "あなたの一分捜査劇", "あなたを名探偵役に、1分で謎を解く短い寸劇。"], ["48K", "名探偵○○の解決編", "あなたが主役の2分の謎解き寸劇と、解決済みの捜査カード画像。"]]],
  ["からあげレモン🍋", "からレモです🍋 夕方は冷蔵庫を開けて、残ってるおかずを三つまで数えます。献立に迷ったら、枠で「今日、何食べた？」。晩ごはんの話をしてなくても、つい聞くのが口癖です。手書きのお品書きが好きで、「本日のおすすめ」に唐揚げを見つけたら、数えたおかずのことはもう忘れます。\n\nこの前「レモンかけていい？」までは落ち着いて聞けたのに、絞った勢いで汁が自分の目に飛びました。僕が目を押さえてる横で、友人は一つつまんで「これだけ、めっちゃ酸っぱい」と冷静に食レポ。目を洗って戻ってきたら、酸っぱいと言った本人が同じ皿からもう一つ取ってました。\n\n以来レモンは自分の小皿でそっと絞ります。食卓で掛け声の多い曲が流れると、つられて返事まで張り切って話を聞き逃すので少し苦手。でも冷めてもおいしい唐揚げの話なら、次の日の朝まで覚えてます。", "ひと絞り食堂", "晩ごはん、何にする？🍋 揚げたての唐揚げも、冷めてからおいしいお弁当のおかずも、ここでは話の主役。大皿のレモンは、絞る前に一声どうぞ。", [["1K", "ひと絞りのお礼", "名前を呼んで「拍手、レモンひと絞り分！」。"], ["5K", "おかず札", "あなたの一日に「今日のよくやった」を一行添えます。"], ["10K", "あなたの副菜案", "好きなおかずに合う副菜を一つ、理由つきでおすすめ。"], ["20K", "架空定食の店内放送", "あなた専用の定食をおすすめします。レモンは一声かけてから。"], ["30K", "名前入りお品書き", "あなたの好きなおかずを主役にしたメニュー画像。"], ["40K", "あなたへ一分食レポ", "専用定食を1分で紹介。店員のお腹が鳴る前に締めます。"], ["48K", "ひと絞りの特別コース", "あなた宛ての2分の架空コース紹介と、名前入り献立画像。"]]],
  ["kohaku.", "こはくと申します。休日の朝は、開店直後の喫茶店で厚切りトーストを。静かなピアノ曲に、カップを置く音が重なる時間が好きです。後ろに人が並ぶと焦るので、席で注文できる店が落ち着きます。毎回メニューを一通り眺めますが、結局いつも厚切りトーストです。\n\n意外と得意なのは、包装紙一枚で本のカバーを折ること。家で配信を聴きながら本を読むと、耳に残った曲名を付箋に書きます。本を持ち歩くときは、なくさないようカバーの折り返しにメモを貼ります。久しぶりに本を開くと、そこからその夜の歌声がよみがえることがあります。\n\n久しぶりにいつもの店へ行った日、店主に「今日は本、お持ちじゃないんですね」と言われました。本の話をした覚えはなかったので、いつも読んでいるところを覚えてくれていたのが嬉しかったです。翌週は本を一冊。トーストを運んでくれた店主と目が合って、少しだけ笑いました。", "付箋のある喫茶室", "読みかけの本と、耳に残った曲を置いていける喫茶室です。どんな話か全部説明しなくても大丈夫。付箋を挟みたくなったところから話しましょう。", [["1K", "窓側へどうぞ", "名前を呼んで「今日もお越しいただきありがとうございます」。"], ["5K", "一行しおり", "あなたの好きな言葉から、名前入りのお礼の一行を贈ります。"], ["10K", "今日の喫茶おすすめ", "今の気分に合わせて、読む本のテーマか聴く一曲をおすすめ。"], ["20K", "一文の注文", "あなたの言葉をもとに短い物語を書き、焼き上がり待ちの間に朗読。"], ["30K", "名前入りしおり", "あなたの言葉を入れた、喫茶室のしおり画像。"], ["40K", "あなたの一分掌編", "あなたがふらっと来店する、小さな喫茶店の話を1分で朗読。"], ["48K", "○○さんの開店祝い", "あなたが主役の2分の喫茶短編と、作品の一文入りしおり画像。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかで呼んでね。よく行く枠に入ったら「こんばんは」、そのあと⚡を一つ。これが毎回の流れです。サンドウィッチマンのコントで、話がかみ合わないまま二人とも真顔で進むところが好き。仲間内で流行った早口言葉チャレンジは、口がついていかなくて早々に見学に回りました。\n\n枠でしりとりが始まったとき、先頭を取りたくて「みかん」と送ったら、開始早々ひとりで終了。枠主が「仕切り直し。もう一回、好きな言葉から！」と言うので、今度は「だいこん」。そこで「ぴか、拍手係できる？」と聞かれ、誰より先に👏を送りました。拍手なら「ん」で終わる心配はありません。\n\n大喜利では、誰かの答えに乗っかるとき、先に「○○さんの答え、好き！」と伝えてから自分のボケを足します。頭の中で真面目な店員さんを呼んで考えてる間に、次のお題に行くこともあります。そんなときは先に👏。早押し部、今日はここだけ得意です。", "ぴかっと早押し部", "こんぴかー！ 早押し、しりとり、急な大喜利が始まります⚡ 「ん」で終わっても拍手係は続行。誤字は拾って笑えるくらいのやつだけ、今日のお題にしよう。", [["1K", "こんぴか落雷", "名前を呼んで「小さめ落雷！」と一拍手。"], ["5K", "誤字つきお祝い札", "名前は正しく、祝辞だけ一文字まちがえた一行を贈ります。"], ["10K", "元気が出る一曲", "あなたへ一曲を選び、早押しクイズ風に紹介します。"], ["20K", "ぴかのお題返し", "あなた向けのお題で10秒大喜利。すべったらぴかが一人で拍手。"], ["30K", "名回答の賞状", "あなたの面白かった一言を載せた、名前入りの賞状画像。"], ["40K", "あなたの一分大喜利", "あなたの話題でぴかが一人二役。初戦とリベンジを1分で。"], ["48K", "○○さん杯の優勝放送", "あなたを主役に2分の大喜利特番と、名前入りの優勝賞状画像。"]]],
  ["しりゅう_08", "しりゅう。夜にふらっといます。アニメは二周目で脇役を一人決めて追うのが好きです。一度目にはただ黙っていた人が、二度目には何かを言いかけてやめたように見える。反射神経で勝負する対戦ゲームは苦手です。相手の動きに見入って反応が遅れます。\n\n釣りの日は、初めてアジが三尾釣れた日に使った帽子をかぶって出ます。縁起を担いで、帽子だけは毎回同じです。帰りには竿を出した場所と時間をメモするのがいつもの流れ。ある日、帽子をかぶっても一尾も釣れず、好きなアジの塩焼きが食べたくなって魚屋で二尾買いました。\n\n袋の魚を見た家族が「今日すごいじゃん」と言うので、レシートを渡すと「そりゃ大きさも揃うわけだ」と笑いました。翌週から帽子を取るたび「海と魚屋、今日はどっち？」と聞かれます。まず海には行くよ。あの日のメモの釣果欄は、ちゃんとゼロです。", "夜釣りとアニメ棚", "釣れた日も、魚屋に寄った日も。昔のアニメを観返して気づいた表情や主題歌の話も歓迎です。結末に触れるときは、先に相手がもう観たか聞いてから。", [["1K", "釣り帰りのお礼", "名前を呼んで「今日も来てくれて助かった」と短くお礼。"], ["5K", "本人の釣果札", "あなたができたことを「本日の一尾」として一行で贈ります。"], ["10K", "今夜の一話便", "好みに合うアニメの見どころを、結末を伏せて一つ紹介。"], ["20K", "本日の釣果実況", "「出勤前にゴミ出し達成、一尾」みたいにあなたの成果を実況。"], ["30K", "あなたの釣果図鑑", "小さな成果を一尾に見立てた、名前入りの図鑑カード画像。"], ["40K", "あなたが主役の次回予告", "今日の出来事を、1分の釣りアニメの予告風に。"], ["48K", "○○さんの二本立て", "あなたの一日を釣果ニュースと架空アニメの予告にして2分。図鑑画像付き。"]]],
  ["たいやき＠しっぽ派", "しっぽから食べます。たいやきでも、しっぽでも呼びやすい方で🐟 商店街を歩くのが趣味で、看板を眺めていると一駅ぶんも苦になりません。週末に見るバスケでは、ボールを持つ選手から目を離して、コートの隅でパスを待つ選手をつい追います。端が気になるのは、たい焼きでも同じです。\n\n一時期、友だちと激辛グルメを巡ったけど、辛さで味が分からなくなるので私には合いませんでした。今は甘いものの店で合流します。たい焼きの頭から食べる友だちが「半分こしよう」と言うので手を出したら、渡されたのはしっぽの先だけ。友だちは「しっぽが好きって言ったでしょ」。向こうの皿には頭も胴体も載ってました。\n\nそれからは、あんことカスタードを自分用に一匹ずつ買います。同じ袋に入れてもらうので、しっぽをかじっただけではどっちの味か分かりません。座右の銘は「楽しみは端から」。中身にたどり着くまでの寄り道も好きです。", "しっぽから商店街", "頭派もしっぽ派も寄ってって🐟 あんこがないほどカリッとした端っこも、熱く語る立派な話題です。脱線して誰も話を戻さなくなったら、二匹目を買う合図。", [["1K", "端っこでお祝い", "名前を呼んで「今日のカリッとしたとこ、どうぞ」。"], ["5K", "しっぽ札", "あなたに合う「カリッとひと言」を、焼き上がり札風に。"], ["10K", "頭としっぽのおすすめ", "好みの味を聞き、いちばん好きそうなひと口を紹介します。"], ["20K", "架空たい焼きの売り口上", "あなた向けの具で一匹を宣伝。しっぽまで入ったかも報告。"], ["30K", "名前入りたい焼き袋", "架空たい焼きの絵と名前を入れた包装紙風画像。"], ["40K", "あなたの一分販売会", "あなたをイメージした二匹を1分で紹介。しっぽの厚みも解説。"], ["48K", "○○さんの看板たい焼き", "あなた専用のたい焼きを2分でお披露目。名前入り包装紙画像付き。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでも大丈夫。趣味は夜の散歩。帰り道をひと駅ぶん遠回りして、足音が聞こえるくらいの音量で歌や雑談を聴きます。意外と得意なのは、一度通った道を、街灯や看板を目印に引き返すこと。仲間内で流行った歩数競争は、好きな場所で立ち止まりにくくて苦手です。\n\n大事な用事がうまくいかなかった晩、枠主さんが歌い終わって「みんな、帰ったら寝ようね」と言いました。家でも考え続けるつもりだったのに、その一言で、続きは明日考えればいいと思えて、家に着くなり寝ました。\n\n枠で何から話そうか迷うと、「そっち、月見える？」と聞きます。夜の口癖みたいなものです。「こっちは曇り」と返ってきたら、その人が見た空を想像します。話の続きがなくても、夜道を途中まで一緒に歩いた気分になります。", "月夜の遠回り", "いつもより少し遠い帰り道に、夜の歌と他愛ない話を。何を書こうか迷う日は、今見える空のことだけでも聞かせてください。返事は家に着いてからで大丈夫。", [["1K", "ひと駅のおかえり", "名前を呼んで「今日もおかえり」と静かに迎えます。"], ["5K", "月夜の便り", "あなたの空模様に合わせた、一行のお礼。"], ["10K", "遠回りのおとも", "今の気分に合う一曲を、聴きたくなる道と一緒におすすめ。"], ["20K", "寄り道予報", "「○○さん地方、明朝まで家事が弱まる見込み」と今日を予報に。"], ["30K", "帰り道カード", "あなたと好きな風景を添えた、名前入りの夜道カード画像。"], ["40K", "あなたへ一駅朗読", "その日の話をもとに、1分の散歩話を読みます。"], ["48K", "○○さんへの月夜便", "あなたに贈る2分の散歩朗読と、名前入りの夜道カード画像。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間にいます。急に黙ったら手がふさがってるだけ。手書きの看板が好きで、値段を一度消して書き直した跡まで見ちゃいます。バレー観戦では、忘れないようにセットごとの点数を手書きで残すのがこだわり。時間制限のあるパズルは苦手。「残り十秒」と出ると時計が気になって、浮かんでいた答えまで逃げます。\n\nある日「おかえり」を「おかわり」と打ったら、次の日から「大盛りにする？」と聞かれました。私も「漬物も」と返したら枠主が「うち何屋だと思われてる？」。ちょうど来た初見さんが「おすすめは？」と聞いた途端、それまで店員みたいだった全員が黙りました。\n\n次に聞かれたら、舞茸の天ぷらって答えます。看板はもちろん手書き。値段は空欄にします。あのお店、店員は大勢いたのに、誰も注文を取れなかったので。誤字ひとつで一軒開く枠、けっこう落ち着きます。", "おかわり休憩所", "作業の合間にひと休み🍄 ゲームも小ボケも、つい送っちゃった誤字の話も歓迎。「おかわり」と書いてあっても、大盛りの相談より先に、まずおかえり。", [["1K", "ログインおめ", "名前を呼んで「ログイン確認。おかわり！」。"], ["5K", "セーブのひと言", "今日の頑張りを、ゲームの記録みたいに一行で贈ります。"], ["10K", "今日の任務札", "あなたがもう終えたことに、かっこいいクエスト名をつけます。"], ["20K", "クエストクリア実況", "あなたの家事を「タオル討伐完了！」などのクリア実況に。"], ["30K", "セーブ済み伝票", "名前とクリア名を入れた、ゲーム風の伝票カード画像。"], ["40K", "あなただけの追加ステージ", "あなたの頑張りをネタに、1分のゲーム風お祝い寸劇。"], ["48K", "○○さんのクリア記念", "あなたが主人公の2分の冒険寸劇と、名前入りクリア伝票画像。"]]],
  ["こうめい＊", "こうめいです。歴史小説は負けた側が何を考えていたか知りたくて読みます。ボードゲームの説明書も集めています。遊んだ日を書いた付箋を貼り、棚のファイルにしまうと、あとで誰と遊んだかまで思い出せます。早押しクイズは苦手で、出題者の狙いを考えてる間に答えを取られます。私の座右の銘は「作戦より先に盤面を」。自分に言い聞かせるための言葉です。\n\n小学生と対戦したとき、相手の番に入ったのに、自分の次の手を長々と説明しました。それを聞いた子が「でも、僕のコマをそこに置けば勝ちだよ」と。盤面を見ると、その一手で私の負け。「確認してたんだよ」と返したら「じゃあ僕の番も確認して」。あの子は私の説明が終わるのを待っていたんです。\n\n説明書をしまうとき、「相手の手番に作戦発表をしない」と書いた付箋を貼りました。読むたび、あの子の顔が浮かびます。お風呂かごはんかくらいの話でも作戦会議を楽しめますが、私の説明が長引いたら「次の人」と遠慮なく言ってください。", "一手先の円卓", "ボードゲームと歴史の話を囲む円卓。慣れてる人の定石も、初参加の「ここに置いたら？」も、理由まで聞くと面白い。私が作戦だけ延々と語り出したら、手番を進めてください。", [["1K", "円卓の一席", "名前を呼んで「○○殿、本日の先手をどうぞ」。"], ["5K", "軍師のひと言", "あなたの一手をたたえる、短い軍師風メッセージ。"], ["10K", "あなたの小さな作戦名", "普段うまくやっていることに、戦略っぽい名前をつけます。"], ["20K", "功績の評定", "日常の頑張りを軍師口調で解説。「先に風呂作戦、無事成功」など。"], ["30K", "名前入り作戦図", "あなたの好プレーを描いた、架空の盤面カード画像。"], ["40K", "あなたの一分作戦会議", "あなたの工夫や一手を、軍師が1分かけてたたえます。"], ["48K", "○○殿の勝利評定", "あなたを主役に2分の作戦トーク。名前入りの勝利作戦カード画像付き。"]]],
  ["れん_07", "れん。休みの日は中古CD屋の棚をのぞき、気になる曲を見つけたら帰り道に配信で聴きます。奥田民生さんの曲は、歌の合間のギターまで耳で追うのが好き。人混みで肩がぶつかるのは苦手なので、ライブハウスでは後ろの端が定位置です。冬のライブには少し早めに行って、開場を待ちながらホットコーヒーで手を温めるのも楽しみです。\n\nあるライブで伴奏が止まり、歌い手さんが「ここだけ一緒に歌える？」と客席に呼びかけました。最初は前の数人だけ。少しずつ後ろからも声が上がり、気づけば僕も歌っていました。歌い手さんは客席を見渡して笑い、続きを歌おうとしてもう一度笑っていました。\n\nその曲の音源を聴くと、今でもあの一節で、後ろから重なっていった声を思い出します。普段は聴き役。家に着いて枠に入ったら「こんばんは」。ライブで初めて気づいた音があったら、どの辺で聴いていたかも教えてください。", "ギターが鳴る後列", "邦ロックや弾き語りの話を、ギターがよく聞こえる後列で。好きな音が出てくるところや、客席が思わず歌い出したサビの話を一つ聞かせてください。", [["1K", "後列の歓迎", "名前を呼んで「ギターがよく聞こえる席へどうぞ」。"], ["5K", "夜の半券メッセージ", "あなたへ、今夜のライブに来てくれた気分のお礼を一行。"], ["10K", "あなたへの推し曲", "気分に合う曲と、最初に聴いてほしい楽器の音を紹介。"], ["20K", "一音のスポットライト", "あなたの好きな一音を、ライブでの曲振り風に紹介します。"], ["30K", "名前入りセットリスト", "あなた向けの二曲と聴きどころをカード画像に。"], ["40K", "一分アンコールMC", "あなた宛てに、紹介したい二曲を1分でMC風に伝えます。"], ["48K", "○○さんの記念ライブ口上", "あなたのための2分のライブ風トークと、名前入りセットリスト画像。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」と続けて聞くのは、たぶんじにです＊ 日村勇紀さんがおいしそうに食べる姿を見ると、つい買いに出たくなります。友だちの間で流行った「一日で話題の店を何軒も回る食べ歩き」は試したけれど苦手。一軒に寄って、その近所をぶらぶらするのが好きです。\n\n帰宅したら、寄った店を地図アプリに残します。前に「絶対また行く」と書いたピンを頼りに行ってみたら、頼んだものはおいしいのに、思い出の味と違う。店を出て、たこ焼きの匂いで思い出しました。目印にピンを立てたまま、本命のたこ焼き屋のメモを書いていたんです。\n\n冬は焼きたての箱を両手で持って歩くのも楽しみです。いまはピンを二つ立てて「曲がる角」と「たこ焼き」に分けてあります。おすすめを教えてくれるなら、店名と、そこで食べたものも聞かせてください。今度は両方書きます。", "よりみち地図帳", "旅先のおやつや、地元の人が帰りに寄る店を記録する地図帳です。「次は何を頼むか」までぜひ。目印のお店と本命のお店のピンが逆でも、気づいたら教えてね＊", [["1K", "寄り道歓迎", "名前を呼んで「○○さんの席にピン立てました」。"], ["5K", "あなたの目印メモ", "好きなおやつに、名前入りの一行メモを添えます。"], ["10K", "おやつの寄り道案", "好みに合いそうなおやつを一つ、どこが好きそうか添えて紹介。"], ["20K", "新店の看板紹介", "あなた好みの架空のおやつ屋さんを店名から紹介します。"], ["30K", "あなたの寄り道マップ", "名前入りの店と、隣のたこ焼き屋を入れた地図画像。"], ["40K", "あなた宛て一分食べ歩き", "好きな味をもとに、二軒の架空のお店を1分で案内します。"], ["48K", "○○さんの商店街", "好みに合わせた2分の架空街歩き。あなただけの寄り道マップ画像付き。"]]],
  ["港レター_", "旅の話が好きな方へ。みなとです。港の朝は焼きたての塩パンが楽しみです。散歩中にテンポの速い曲を聴くのは苦手です。足がつられて、寄りたかった路地まで通り過ぎてしまいます。シャッターが開く音や波の音を聞いていると、自然と歩幅も小さくなります。\n\n旅先から出すはがきには、その日に覚えておきたいことを一つだけ書きます。ある港町から自宅に出した一枚には「明日の朝、港で塩パンを買う」。翌朝、パンの紙袋は宿に戻るまで温かいままでした。帰宅して数日後にはがきが届くと、まだ朝を待っているあの日の自分に「おいしかったよ」と返事をしたくなりました。\n\n次の旅では、出発前にやりたいことを一つ書き、帰ったらその結果も書き添えるつもりです。近所でもかまいません。好きな寄り道と、そこを歩くなら何時がいいか聞かせてください。みなとより。", "海辺のポスト", "旅先で見つけた寄り道を、はがき一枚ぶんだけ。朝のパン屋でも、地元の人がよく通る裏道でも。場所と一緒に、そのときの匂いや音を聞かせてください。", [["1K", "港からひと言", "名前を呼んで「○○さん宛て、無事届きました」。"], ["5K", "海辺の一行便り", "好きな風景を想像して、あなた宛ての一行を書きます。"], ["10K", "あなたの朝の寄り道", "気分に似合う架空の街と、おすすめの朝の寄り道を一つ。"], ["20K", "旅はがきの朗読", "あなた宛ての短いはがきを朗読。追伸にはパン屋の話。"], ["30K", "名前入り絵はがき", "あなた宛ての言葉と架空の消印を入れた画像。"], ["40K", "港町の一分便り", "あなたの好きな風景から朝と夜を想像し、1分の手紙に。"], ["48K", "○○さん宛ての港町", "あなたへ架空の街から2分の旅便り。名前入り絵はがき画像付き。"]]],
  ["けんし♪", "イントロで気づく、サビは歌える、曲名は出てこない。けんしです♪ 秋のドライブでは、夕方に車を停めて塩むすびを食べ、帰りに聴く一曲を選ぶのが楽しみです。分厚い歴史小説は登場人物の名前を途中で見失うので苦手。カラオケでも、覚えていた曲名だけを頼りに失敗したことがあります。\n\nよく聴いていた曲を入れたつもりが、画面には知らない歌詞。同じ題名の別の曲でした。取り消そうとしたら、友人が「これ歌える」とマイクを取り、最後までさらっと歌いました。僕はタンバリンを振ってひと言。「僕の歌詞は全部、シャンシャンです！」。鳴らし過ぎて、間奏まで合いの手が入りました。\n\n次に会ったら「またあれ入れてね」と頼まれました。選曲ミスは僕、十八番にしたのは友人。帰りの車で聴きたい曲があれば教えてください。曲名が出ないときは、どんな日に聴いていたかだけでも。", "サビから歌う会", "十八番とドライブの一曲を持ち寄る会♪ 曲名が出なければ、どんな日に聴いてたかからどうぞ。サビが来たところでコンビニに着いたら、降りるのは歌い終えてから。", [["1K", "口タンバリン一発", "名前を呼んで「シャカッ」と拍手代わりにお祝い。"], ["5K", "十八番のお礼札", "あなたの曲の好みを思い出し、名前入りのひと言を贈ります。"], ["10K", "運転席へ一曲", "気分に合いそうなドライブ曲を、聴きどころと一緒におすすめ。"], ["20K", "昔のラジオの曲振り", "あなたへの一曲をDJ風に紹介。最後は口タンバリン。"], ["30K", "名前入り番組表", "あなたへ贈る二曲を、ラジオの番組表画像に。"], ["40K", "あなたへ一分の選曲便", "あなた向けの二曲と曲を選んだ理由を1分のDJ風で。"], ["48K", "○○さん宛て夜ラジオ", "あなたがリクエストした雰囲気で2分の番組。名前入りの番組表画像付き。"]]],
  ["かんうどん🍜", "「かん」で大丈夫です🍜 かけ、ちくわ天、ねぎ多め。郷土料理の本が好きで、読みながら次に食べてみたい一杯を探します。食べに行ったうどんは、写真にだしと具のメモを添えて集めています。白い服で汁ものを食べるのは苦手で、気をつけていたつもりでも、帰ってからしみを見つけることがあります。\n\n近所の店で白いシャツにカレーうどんの汁を飛ばした翌週、黒い服で行くと「いつもので？」と聞かれました。かけうどんのつもりでうなずいた僕の前に、カレーうどんが。「今日は黒い服でよかったね」と店主。前回の食べこぼしまで覚えられていました。\n\n枠でその日の写真を見せながら、おなかの辺りを指さしてひと言。「白い服で食べると、お土産がつきます」。写真のメモには、具とだしの下に「次も黒」と書きました。地元でよくのせる具があったら、どんなだしと合わせるかも聞かせてください。", "ねぎ多めの席", "かけ、ちくわ天、ねぎ多め🍜 うどんの話なら、何が乗っていたかも聞きたい席です。季節の変わり目はカレーの話が増えます。白い服の方は少し後ろへ。", [["1K", "ねぎ多めの拍手", "名前を呼んで「○○さんの分、拍手もねぎも多め！」。"], ["5K", "今日の一杯メモ", "あなたの一日に合う、短い店主風のお礼メッセージ。"], ["10K", "あなたのうどん合わせ", "好みの具に合う薬味を、ひとつ理由つきでおすすめ。"], ["20K", "だしの実況中継", "あなた専用のうどんを想像して食レポ。「天ぷら、入れちゃいました」。"], ["30K", "ねぎ多めのお品書き", "あなたの名前と好みの具を入れたメニュー画像。"], ["40K", "あなたの一分試食会", "好みの一杯をだしと天ぷらに分けて1分で紹介。"], ["48K", "○○製麺の特別営業", "あなたの看板うどんを2分でお披露目。名前入りメニュー画像付き。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話を聞くのが好きです。数式が何ページも続く天文学の本は苦手なので、休みの夜は外へ出て、星を見つけた時刻と方角をメモします。意外と得意なのは、時計を見ずに三十秒を数えること。流星を待つ間もつい数えます。三十秒は分かっても、流星がいつ来るかはさっぱりです。\n\n友人と流星を待った晩、私が空を見て「あっ」と言うと、向こうも「あっ」。「見つけた？」「見つけた！」。私は同じ流星が見えたと思っていました。ところが帰り道、友人がうれしそうに缶を見せて「探してたぶどうジュース、ここの自販機にあったよ」。同じだったのは「あっ」のタイミングだけでした。\n\n次は、同時に声が出ても「何が見えた？」まで聞こうと思います。枠で話すなら「月と深海、行けるならどっち？」も好きです。私は月。窓側の席でお願いします。", "土星の窓側席", "今日見えた星、月と深海ならどちらに行くか、正解がいらない夜の話をする窓側席◎ 星座が分からなければ「コンビニの上」からどうぞ。", [["1K", "窓側へのご案内", "名前を呼んで「窓側空いてます。コンビニの上を経由します」。"], ["5K", "一行の星便り", "あなたの今日を、窓側からの短いお礼便りに。"], ["10K", "あなたの星空のおとも", "気分を聞いて、夜空を楽しむ見どころを一つ紹介。"], ["20K", "あなたの新星座", "今日あったことに星座名をつけます。「洗濯ばさみ座」も立派な候補。"], ["30K", "名前入り星座カード", "あなただけの架空の星座を、名前と星の絵で画像に。"], ["40K", "あなたの一分宇宙案内", "あなたの星座を1分で解説。途中で自販機も目印にします。"], ["48K", "○○天文台の夜", "あなただけの星を紹介する2分の架空案内。名前入り星図画像付き。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。「もち」だけでも振り向きます。洗い立ての綿の毛布がほんのり香ると、よく眠れそうでうれしくなります。目下の小さな目標は、寝落ち前に枠へ「おやすみ」と書くこと。翌朝「おはよう」とだけ返した日は、たぶん間に合ってません(-_-)zzz\n\nお正月は毎年、お雑煮の最初の一口を食べながら「今年もよく食べて、よく眠れますように」と願って縁起を担ぎます。甘く煮た黒豆はちょっと苦手。でもお餅は大好きで、前のお正月は、食べ進めるうちにお餅が一つ、二つ、最後にもう一つ。小さい頃「一つじゃ足りない」と何度も言ったのを、家の人が覚えていたんです。\n\n今なら二つで十分なのに、うれしくてその日は全部食べました。翌朝「今日も三つ？」と聞かれて、さすがに「一つでいい」と返しました。みなさんの家では、どんなだしにどんなお餅を入れますか。そこまでは起きてるつもりです。", "毛布ときなこの部屋", "きなこ餅派も、お雑煮にその家の決まりがある人も、毛布の中からこんばんは。挨拶の返事が翌朝でも気にしない、ぬくぬく聴ける部屋です。", [["1K", "毛布から拍手", "名前を呼んで「毛布から出なくて大丈夫」と小声でお祝い。"], ["5K", "ぬくぬくの一行", "疲れた日のあなたに、肩の力が抜ける一行を贈ります。"], ["10K", "あなたのおやすみ札", "今夜の気分を思い出して、名前入りのおやすみの言葉を贈ります。"], ["20K", "寝落ち実況", "「○○選手、毛布に入ったまま静かに優勝です」と小声で実況。"], ["30K", "布団で優勝認定", "あなたの名前と勝因を添えた、おやすみ賞状画像。"], ["40K", "ぬくぬく一分便り", "あなた宛てに1分のひと息トーク。最後は静かに「おやすみ」。"], ["48K", "○○さんの毛布大会", "あなたが静かに優勝する2分の実況劇。名前入りのおやすみ賞状画像付き。"]]],
  ["いかいかが？", "いかです🦑 最近は水族館で、魚のしぐさに勝手に字幕をつけるのに夢中です。説明板を読む前に、まず一匹の動きをじっと見るのがこだわり。登場人物が何十人も出る長編ミステリーは関係を覚えるのが苦手ですが、一匹の出番なら最後まで追えます。たぶん。\n\nある日、水槽のエイに手を振ってから、隣の友人に耳打ちしました。「勉強中です、エイ語」。手を振り返したのは、水槽の向こうの通路にいた小さい子でした。私がもう一度振ると、今度はお母さんまで。やりとりに夢中で、エイはいつの間にか泳ぎ去っていました。あとで場面に付けた字幕は「エイ語の先生、先に帰る」です。\n\n枠でも、天気の話から深海まで流れていくような雑談が好きです。最初に天気を聞いたのは、だいたい私。よかったら、そちらの空模様からいかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 雨の話から深海まで、流れ着いた話題を眺める部屋です。水槽の向こうに手を振り返す人がいたら、その話からどうぞ。", [["1K", "クラゲ前の歓迎", "名前を呼んで「クラゲ前、あなたの席空いてます」。"], ["5K", "水槽のひと言便り", "好きな生き物から、あなたへの短いお礼を一行。"], ["10K", "あなたの一槽", "好みを聞き、眺めていたくなる生き物と、注目する動きをおすすめ。"], ["20K", "水槽の代弁放送", "あなたの気分を水槽案内に。「考え事中につき低速運転」など。"], ["30K", "名前入り水槽プレート", "あなたと好きな生き物の組み合わせを、説明板風の画像に。"], ["40K", "あなた宛て一分ガイド", "好きな生き物二つを、1分の館内ガイド風に紹介。"], ["48K", "○○さんの閉館後ツアー", "好みに合わせた2分の架空ツアー。名前入り入館票画像付き。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 冷えた手で温かいマグカップを包む瞬間が好きです。休みの日は昼に少し散歩して、帰ったらお茶と一緒にバラードを聴きます。歌の動画は倍速だと、歌い出す前の息づかいまで急ぎ足に聞こえるのが苦手です。\n\n夜の歌枠で感想を何度も打ち直していたら、次の曲が始まりました。「一つ前の曲、二番に入る前の息づかいが好きでした」と送ると、次の曲が終わったところで枠主さんが「あそこ、落ち着こうと思って息を吸ったんだ」と教えてくれました。一行でも、どこを聴いていたか伝わって嬉しかったです。\n\nやっと手を伸ばしたお茶はすっかり冷めていて、ひとりで「冷茶、お待たせしました。いちばん待ったのはお茶です」と一発。今日こそ、感想を打つ前にひと口。", "雪あかりの歌席", "温かいものを一口、夜に聴きたい歌を一曲。感想は、心に残ったところを一つだけでも。返事を考えて飲み物が冷めた人には、ここにも仲間がいます。", [["1K", "ひと息のお祝い", "名前を呼んで「今日も一息ついていってください」。"], ["5K", "一行のおやすみ便り", "その日のあなたへ、短い労いの言葉を贈ります。"], ["10K", "あなたへ夜の一曲", "気分に合うバラードを一曲、聴きどころも添えておすすめ。"], ["20K", "ひと口ぶんの手紙", "好きな夜の景色を添え、あなた宛てに短く朗読します。"], ["30K", "雪あかりの便箋", "名前と手紙の一行を入れた、便箋カード画像。"], ["40K", "あなたへ一分朗読", "今日の気分に合わせた1分の手紙。飲み物が冷める前に。"], ["48K", "○○さんの雪あかり", "あなただけに選んだ風景で2分の朗読。名前入り便箋画像付き。"]]],
  ["じゃっくん☆", "はーい、参加します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームと、人のボケに一行足すのが好きです。年末の楽しみは、友だちと対戦ゲームで遊び納めすること。笑った一言は忘れないように、スマホのメモに集めています。\n\nその集まりで、前に出てどんどん攻めるキャラを見て「勝った！」と叫びました。ところが、そのキャラを動かしていたのは友だち。僕のキャラは画面の端で、壁に向かって全力で走っていました。「声だけなら優勝」と言われ、その日のメモにさっそく追加。次は実況より先に、自分のキャラの色を確かめます。\n\nレーズン入りのクッキーは、噛んだ瞬間の濃い甘さが苦手なので友だちに譲ります。取り皿へ移す五秒間も実況できますよ。「おっと、ここでクッキーが移籍です！」", "とりあえず参戦部", "実況も大喜利も、まず挙手🙌 誰かの一言に一個ずつ足して、電子レンジの残り一秒まで勝負にします。はじめましての人も、何に参加するかはあとで聞いて大丈夫。", [["1K", "いきなり表彰", "あなたの名前を呼んで「種目は未定ですが拍手！」。"], ["5K", "仮エントリー表彰", "日常の小さな頑張りに、面白い競技名を一行で贈ります。"], ["10K", "あなたの実況見出し", "一日の出来事から、スポーツ新聞風の一行を贈ります。"], ["20K", "日常の決勝戦", "あなたの一場面を実況。「電子レンジ、残り一秒を見送ったー！」。"], ["30K", "あなたの仮競技メダル", "名前と競技名入りの、お祝いメダル風画像。"], ["40K", "あなたへ一分二種目杯", "あなたの普段の活躍を二つ拾い、1分で入場から表彰まで。"], ["48K", "○○さん杯の決勝特番", "あなたが優勝する2分の架空大会。名前入り結果カード画像付き。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。平野レミさんの料理番組を見たあとは、私も何か作りたくなります。休みの朝はパン屋さんへ。甘いものならバターが香るクッキーが好きで、シナモンの香りが強いお菓子は苦手です。\n\n口癖は「まず一枚、味見しよ」。クッキーを焼きすぎた日、「焦げたところはよけてね」と友だちに渡したら、空のお皿の写真と「次は倍で」の一言が届きました。喜んで倍の量を仕込んだものの、二枚目の天板を出すのが遅れて、また濃い焼き色に。色が薄いものと濃いものを別の袋に入れて「先に薄いほうを味見して」と渡しました。倍にするのは生地の量だけのつもりだったんだけどな。\n\n以来、座右の銘は「迷ったら、まずタイマー」。天板を入れるたびにセットします。自分で味見する分は、最初から枚数に入れてあります。", "焼きたてひと皿", "パンの匂いと隠し味の話をする、焼きたての一皿。何を入れたかと、いつ入れたかを両方聞きたいです。ちょっと焼きすぎた分も、ここでは味見のうち。", [["1K", "焼きたてのひと言", "名前を呼んで「味見の一枚ぶん、ありがとう」。"], ["5K", "おやつの一行札", "今日のあなたを思い浮かべた、小さなお礼を一行。"], ["10K", "あなたの隠し味案", "好みの材料に合うものを一つ、おすすめ理由つきで贈ります。"], ["20K", "焼きすぎ新作発表", "あなた好みの架空の焼き菓子を命名。焦げ目も個性として紹介。"], ["30K", "あなたの焼き菓子ラベル", "名前と好きな材料を入れた包装カード画像。"], ["40K", "あなた宛て一分試食会", "好みをもとに新作を想像し、1分で食感と香りを紹介。"], ["48K", "○○さんの限定焼き菓子", "あなた宛ての新作発表を2分で。名前入り限定ラベル画像付き。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方は洗濯物をたたむ合間に、よく聴く枠へ「おつかれ〜」と一言。家事が済んだら、好きな暮らしのエッセイを一話読みます。スーパーのおやつや小さな失敗の話を読むと、うちでもありそうって思うんです。\n\n季節限定のお菓子のラベルを、日付と一緒にノートに貼って集めています。甘いゆず味のお菓子を探して三軒回った日、近所のお店で袋に大きく書かれた「ゆず」の字を見つけ、「二袋でお得」につられて購入。帰って開けたらゆず胡椒味でした。辛いお菓子が苦手で一枚食べて水を飲んでいると、家族が本命の甘いゆず味を出してきました。同じ店で商品名を最後まで読んだそうです。\n\nその日のノートには両方のラベルを並べて「探した味」「探してない味」。辛いほうの残りは家族がおいしく食べてくれました。", "ゆず色おつかれ会", "夕方の「おつかれ〜」だけでも歓迎🍊 家事の区切りに一曲。買った柑橘おやつがゆず胡椒味だった報告も歓迎です。片付けより歌に聴き入った日は、ひとまず拍手しとこ。", [["1K", "夕方おつかれ拍手", "名前を呼んで「家事の途中でも一回拍手！」。"], ["5K", "柑橘ひと口メッセージ", "あなたへ夕方に読み返せる、一行のおつかれさま。"], ["10K", "今日の一曲便", "散歩か休憩か、気分に合う一曲と聴きどころを贈ります。"], ["20K", "柑橘表彰タイム", "「洗濯完走賞。乾くのは明日でも拍手！」と頑張りを表彰。"], ["30K", "名前入り家事クリア札", "あなたの頑張りを柑橘イラスト入りのカード画像に。"], ["40K", "あなたの一分夕方ニュース", "今日できたことと、おつかれさまを1分の夕方ニュース風に。"], ["48K", "○○さんのおつかれ特番", "あなた宛ての2分の夕方ニュース。名前入り「本日の家事終了」画像付き。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおります。武将の手紙を集めた本が好きです。立派な挨拶より、最後にそっと書かれた頼みごとが気になります。意外な特技は、家族への置き手紙を武将風に書くこと。「猫殿に本日の間食はお出ししました。重ねて出されぬよう」と書けば、だいたい読んでもらえます。\n\n武将の番組は、勇ましい太鼓が鳴り続けるのが苦手で、見始めに音量を下げます。ある日、ちょうど見せ場で猫殿がテレビの前に座りました。猫殿が移動したすきに巻き戻すと、また同じ場面で戻ってきます。三度目には画面の武将より、猫殿の登場を家族全員で待っていました。\n\n以来、「参戦ですか？」が口癖です。誰かがテレビの前を横切るだけで、つい聞いてしまいます。猫殿が本当に参戦したら、席を譲るのはいつもこちらでござるฅ", "ねこ殿の書状部屋", "武将の書状と猫の話を、夜にしれっと。武将が決めゼリフを言うところでも、猫殿が画面前に来たら、皆でいったんそちらに注目ですฅ", [["1K", "猫殿への拝謁", "名前を呼んで「座布団は猫殿と半分ずつで」と歓迎。"], ["5K", "肉球の一行書状", "あなたの名前を入れ、猫殿から短いお礼を贈ります。"], ["10K", "猫殿の称号", "あなたの良いところに、猫殿が大げさな二つ名を贈ります。"], ["20K", "猫殿からの書状朗読", "あなた宛ての書状を朗読。追伸は「おやつを追加されたし」。"], ["30K", "名前入り肉球花押", "猫殿からあなたへのお礼を、肉球印つきの書状画像に。"], ["40K", "あなたの一分御前評定", "あなたの功績を1分まじめにたたえます。猫殿は途中で帰る予定。"], ["48K", "○○殿の一城進呈", "あなたの城名をお披露目する2分の授与式。名前入りの書状画像付き。"]]],
  ["ぜうす_", "ぜうす。呼び捨てで平気です。コーヒーは深煎り。映画館が暗くなって、ざわめきが消える瞬間が好きです。観た映画の半券を集めて、裏に気になった場面を一つだけ書きます。登場人物の気持ちを一つに決めつける解説本は苦手で、観返すときはまず自分で気づいたことを確かめます。\n\n帰りの電車で友人と「あの主人公、最後に何を考えてたんだろう」と話しました。降りる直前に分かったのは、僕が映画のラストで部屋を出た人物を指し、友人はその人を見送った人物を指していたこと。違う人を思い浮かべていたのに、そこまで妙に話が合っていました。\n\nその日から座右の銘は「まず、誰の話か」。次にその友人と映画を観た日は、先に人物の名前を確認しました。そこまでやって、今度は二人とも同じ人物の別々の場面を話していました。", "深煎りの上映後", "深煎りを一杯、映画の終わったあとの話を。答えが割れたら、先に覚えている場面を聞かせてください。結末に触れそうなら、まだ観ていない人に一声。", [["1K", "深煎りの一声", "名前を呼んで「上映後の一杯、どうぞ」と迎えます。"], ["5K", "余韻の一行", "あなたの話から心に残ったところを、一行にしてお返し。"], ["10K", "あなた宛ての一本", "好みに合いそうな映画を、結末に触れず一つ紹介。"], ["20K", "今日の別解", "あなたの一日を、二つの結末がある短い映画風に語ります。"], ["30K", "名前入りエンドカード", "あなたの言葉を残した、架空映画のエンドカード画像。"], ["40K", "あなたの一分編集会議", "一日の出来事から、二つの見え方を1分で楽しむ映画風トーク。"], ["48K", "○○さんの二重エンド", "あなたを主役に、二つの結末を計2分で朗読。名前入りタイトル画像付き。"]]],
  ["りさっち＊", "りさっちです☺️ 趣味はカフェめぐり。いつものホットコーヒーでも、どんなカップで出てくるか楽しみです。器が気になると、飲み終わったあとに底の印まで見るのが私のこだわり。毎回飲む前に写真を撮るのは苦手で、友だちと始めたカフェ記録も三日で断念しました。三日目に撮れたのはレシートだけです。\n\n好きなドラマの最終回を観る前は、推しがいい結末を迎えられるように、いつもの店でいつもの一杯を飲んで縁起を担ぎます。ある日、友だちと推しが同じだと分かってほっとした直後、「でもあの人が同僚なら困るよね」と言われました。「私なら味方するな」と答えたものの、友だちに気になった場面を聞いているうちに、コーヒーはすっかり冷めていました。\n\n推しは今も二人とも同じです。もしあの人が本当に同僚なら、私は隣の席だけは避けるかも。", "いつものカフェ席", "いつものカフェ席で、ドラマの感想と気になるリップの話を☺️ 「推しだけど同僚にはしたくない」みたいな話も大歓迎。洗い物が途中なら、話はカップが冷めるまで待ちます。", [["1K", "いつもの席へ", "名前を呼んで「○○さん、今日もお席あります」。"], ["5K", "カップにひと言", "あなたの気分に合う、お礼の言葉を注文シール風に。"], ["10K", "あなたのカフェおすすめ", "気分や好みに合わせた一杯を、理由つきでおすすめ。"], ["20K", "気分のおまかせドリンク", "あなた専用の一杯を命名。初めての注文でも「いつもので？」。"], ["30K", "名前入り限定カップ", "あなたが好きな色と名前を入れたカップカード画像。"], ["40K", "あなた宛て一分カフェ", "一杯の名前と、あなたの好きな話題を1分の店内トークに。"], ["48K", "○○さんの貸し切り席", "あなたを迎える2分のカフェ小話。名前入り限定メニュー画像付き。"]]],
  ["ちょぱ丸_", "コンビニは往復10分、寄り道込みなら30分。ちょぱ丸です。たまに友だちと卓球をします。相手のラケットの振りに気を取られて、肝心の球には反応が遅れがちです。\n\n友だちと商店街に出かけた日、前に見つけた店を探しました。目当ては赤いのれんの店。前にその脇に猫がいたので、つい猫ばかり探して通り過ぎました。地図で確かめて引き返し、買い物を済ませて外に出ると、猫が店先に。「ピンポーン。目印が、ただいま出勤しました」と一発やると、友だちは「のれんは開店から仕事してたけどね」。\n\nアニメの劇伴が好きで、誰かが振り向く瞬間に低い音が入ると、その場面をよく覚えています。酸っぱい粉がたっぷりついたグミは苦手。砂糖だと思って食べたら、一粒で目が覚めました。アニメの感想なら「そこ見てた？」ってところも、ぜひ聞かせてください。", "寄り道アニメ部", "推しを一人に絞るなら「今日の一人」でOK。アニメの一瞬の仕草から、迷った先のお店までよく話がそれます。案内役が猫を探し始めたら、地図を開いてください。", [["1K", "寄り道で歓迎", "名前を呼んで「○○さんの席、今日は迷わず着きました」。"], ["5K", "あなたの道しるべ", "一行のお礼に「猫は不定休」の注釈を添えます。"], ["10K", "今日の推し便り", "あなたが好きな作品の、細かい好きポイントを一つ語ります。"], ["20K", "寄り道の次回予告", "あなたが主役の短い予告。「次回、○○さん、気づけば二階へ」。"], ["30K", "寄り道の名前入り番組表", "あなたの寄り道を本編にした、架空の番組表画像。"], ["40K", "あなたの一分外伝", "今日の話を聞き、あなたが主役の番外編を1分で語ります。"], ["48K", "○○さんの寄り道特番", "あなたを主役に2分のアニメ風物語。名前入り寄り道マップ画像付き。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 ゲームでは地図を隅まで埋めるのが好きで、未確認の扉があれば通った道でも戻ります。回復薬は、いざというときのために決戦まで取っておきます。\n\n急かされるのは少々苦手です。同行者に「そろそろ決戦へ」と言われ、慌てて近道を選びました。同じ崖から二度落ち、三度目は崖の手前で足を止めました。すぐ脇に橋がございました。寄り道に手間取ったわりに、ボス戦は二分。回復薬は一つも使いませんでした。\n\n意外な特技は、注意書きをラスボスの口上のように読むことです。「足元をご確認くださいませ」と低い声で言うと、橋を渡るだけで最終決戦の気分になります。勝った話も、うっかり通り過ぎた橋の話も、よろしければ休憩室でお聞かせください。", "決戦前の休憩室", "決戦前の休憩室へようこそ。攻略の失敗談も、ボス戦の好きな一音も歓迎いたします。最後の扉へ向かう前に、どうぞ回復アイテムと足元、特に横に橋がないかをご確認ください。", [["1K", "ご来城のお礼", "名前を呼んで「○○様、本日もご来城ありがとうございます」。"], ["5K", "通行許可証のひと言", "あなたの名前を入れ「本日の橋の利用を推奨いたします」と贈ります。"], ["10K", "あなたの二つ名", "今日できたことに合わせて、ラスボスが称号を一つ授けます。"], ["20K", "功績のお祝い", "「洗濯を終えた功績により、今夜の決戦は免除いたします」と丁重に祝います。"], ["30K", "名前入りクエスト達成証", "あなたの功績を記した、紋章つき賞状画像。"], ["40K", "あなたの一分決戦劇", "あなたが勝つ最終戦を、ラスボスが一人二役で1分上演。"], ["48K", "○○様の王国授与式", "あなたを主役に2分の式典。選んだ称号と名前入りの感謝状画像付き。"]]],
  ["simba_", "シンバです。休みの日は、行き先を一つだけ決めて車を出します。気になる景色があれば、寄り道のほうが長くなることも。運転中はにぎやかなビッグバンドの曲が少し苦手で、静かな曲が落ち着きます。休憩のおともは、大好きなたまごサンド。\n\n海辺で友だちとベンチに座ったら、正面には駐車場。海は背もたれの向こうでした。海が見える場所に移ろうとしたら、友だちが「車が見守ってくれてる」と。結局そこでサンドを食べきって、正面に見えた愛車まで写真に撮りました。帰宅して見返すと、海の写真よりその一枚のほうが、友だちのひと言までよく思い出せました。\n\n座右の銘は「いい休憩も旅のうち」。動物園でも、ペンギンの水槽の前では少ししゃがんで眺めます。水面の下をペンギンがすっと横切ると、つい長居します。予定になかった休憩や寄り道の話、よかったら聞かせてください。", "停車中の見晴らし席", "景色が気になったら、いったん停車。車で聴く曲も、動物園でしゃがんで初めて見えたものも話せる休憩席です。ペンギンが飛び込むところだけ、もう少し一緒に待ちましょう。", [["1K", "見晴らし席へ", "名前を呼んで「景色がいいので、○○さんの席で一旦停車」。"], ["5K", "車窓の一行便り", "好きな景色を思い浮かべ、あなた宛てに一行のお礼。"], ["10K", "あなたの寄り道案内", "気分に合う風景や動物の見どころを一つおすすめ。"], ["20K", "ペンギンの一声実況", "あなたの小さな挑戦を「行けるか、今度こそ水に入るか」と応援。"], ["30K", "名前入り風景カード", "好きな景色と表示名を添えた、休憩の記念画像。"], ["40K", "あなた宛て一分ドライブ", "好きな景色を二つつなぎ、1分の車窓トークを贈ります。"], ["48K", "○○さんの見晴らし便", "あなたの好みに合わせた2分の架空ドライブ。名前入り行程カード画像付き。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白くてまぶしい照明が苦手で、夜は机の手元だけを照らしています。バタートーストが好き。焼きたてを食べるつもりが、配信の話に聞き入っているうちによく冷めます。\n\n昔遊んだゲームを久しぶりに起動しました。最後の城の手前でセーブしたと思っていたのに、読み込んだデータでは、最初の村にいました。村の曲を聴くうちに、ランドセルを机の横に置いて夕飯まで遊んでいた頃の部屋を思い出しました。その晩は村を一周して、そこでセーブ。好きな場所なら、戻った分も進んだうち。それが座右の銘です。\n\nゲームの曲を集めるときは、曲名と流れる場所をセットでメモします。「雪の町の出口」「三回迷った洞窟」、そんな手がかりだけでも歓迎。あなたが曲を聴くためについ戻ってしまう場所も教えてください。", "夜更けのセーブ地点", "夜の作業をしながら、ゲームの音と風景を話す場所。曲の名前がうろ覚えなら、雪の町や夕方の港からどうぞ。一曲を探して手が止まったら、そこが今日のセーブ地点です。", [["1K", "今日のセーブ音", "名前を呼んで「○○さん、今日のログを保存しました」。"], ["5K", "一行のセーブ便り", "あなたが終えた作業を、一行のゲーム風お祝いに。"], ["10K", "作業のおとも一曲", "好みに合うゲームの曲を、聞きどころの場面と一緒におすすめ。"], ["20K", "今日のセーブ画面", "あなた宛てに「食器をしまった。宿屋に戻ります」などと読みます。"], ["30K", "名前入りセーブカード", "あなたの作業と好きな風景を、セーブ画面風の画像に。"], ["40K", "あなたの一分ゲーム散歩", "好きな風景をつなぎ、あなたが主役の小話を1分。"], ["48K", "○○さんの最終セーブ", "あなたを主人公に2分の夜の物語。名前入りセーブカード画像付き。"]]],
  ["まさむね_", "まさむねです。休日は城下町の脇道へ。行きの電車では三味線の器楽曲をよく聴きます。人混みを急いで抜けるのは苦手で、説明板の前で気兼ねなく足を止められる道が好きです。近ごろは、旅先で地元の方にその町の思い出を一つ聞くのが小さな目標です。\n\n城跡の坂道で説明板を読んでいたら、近所の方が「子どもの頃、よく滑って下りましたよ」と教えてくれました。想像よりずっと急な坂で、「どこで止まったんですか」と尋ねると、「止まれないから下まで行ったんです」と笑っていました。帰りは私もその坂を、もちろん歩いて下りました。\n\n野球観戦も好きで、球場に行くと得点場面だけでなく、客席から飛んだひと言まで覚えて帰ります。城下町でも、説明板に出てこないひと言があとでよく浮かびます。旅先で耳にした話があったら、ぜひ聞かせてください。", "城下町の寄り道帳", "城下町の曲がり角、説明板に載らない近所の話、定食屋で頼んだもの。旅先でつい足を止めた場所を聞かせてください。ここでは寄り道のほうが長くなっても大丈夫。", [["1K", "ご城下へようこそ", "名前を呼んで「○○殿、説明板の前へどうぞ」。"], ["5K", "今日の一行史跡札", "あなたの出来事を、短い史跡の記録風に書きます。"], ["10K", "あなたの旅の見どころ", "好みに合う寄り道の見つけ方を、一つお伝えします。"], ["20K", "現代史跡の案内", "あなたの日常を紹介。「○○氏、ここでコロッケを食す。つい先日です」。"], ["30K", "名前入り小さな説明板", "あなたの寄り道を、日付入りの案内板画像に。"], ["40K", "あなた宛て一分城下町案内", "好きな風景を二つつないで、1分の架空ツアーを贈ります。"], ["48K", "○○殿の城下町紀行", "あなたの好みに合わせた2分の架空町案内。名前入り地図画像付き。"]]],

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

  : null;

function copyButton(label, name, target, {buttonText = label + 'をコピー', copyText} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しやメニューからコピーしてください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => field.remove(), {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

function buildCorePerkTable(name, perks) {

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    perk.tabIndex = -1;
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, {buttonText:'コピー'}));
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリーを見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = '紹介文';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(name, perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  actions.append(
    copyButton('ファミリー名', name, nameValue),
    copyButton('紹介文', name, description, {copyText})
  );

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
</html>
