<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111421">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pococha1012｜プロフィールコピー</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>Pococha1012｜プロフィールコピー</h1>
<p class="note">40件 · 文字数は空白と改行も含みます。小話は創作例です。アイコンをタップすると拡大できます。</p>
<p class="note">編集した名前と本文は、このブラウザーに保存され、次回も優先して表示されます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が出たら選べます。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "帰りの電車では、片耳で歌枠、もう片耳で車内放送。るいです。平成のJ-POPが流れると「これ昔めっちゃ聴いた」が先に出ます。曲名を思い出した頃には、だいたい二曲先。言葉がすき間なく続く曲は、歌詞を追いきれなくて少し苦手です。\n\n休みの日は一つ先の駅まで歩きながら、枠で教えてもらった曲を聴きます。「二番のサビ前でベースを聴いて」と言われると、聴き慣れた曲でもベースがぐっと前に出て聞こえます。最近は、気に入ったところを秒数までメモしてます。\n\nある晩、終電で向かいの人が、窓に映る自分を見ながら小さくエアギターをしてました。動く指先から何の曲か当てようとしているうちに、降りる駅に着きました。曲は分からずじまい。ホームで発車メロディーが鳴ると、思わず「これ昔めっちゃ聴いた」。あんなに聴いたのに、こっちも曲名は知りません。", "片耳プレイリスト", "帰りの電車に似合う曲を一人一曲。懐かしい曲も、今日見つけた曲も、どんな日に聴きたくなるかまで聞けると嬉しいです。私のメモには、曲名の横に「発車直後」や「降りるひと駅前」が増えていきます。", [["1K", "片耳コアおめ", "名前を呼んで、車掌ふうに「今日もおつかれさま」とお祝いします。"], ["5K", "帰り道の一言メッセージ", "今夜の帰り道に似合う一言を、表示名を添えてファミリーに投稿します。"], ["10K", "名前入りきっぷアイコン", "表示名を入れた、乗車券風のアイコン画像を作ります。"], ["20K", "帰り道の選曲リクエスト", "「元気を出したい」など気分を聞いて、配信で一曲と聴きどころを紹介します。"], ["30K", "配色が選べる終電セット", "好きな色の名前入りきっぷアイコンと、スマホ待ち受け画像を作ります。"], ["40K", "お名前入りの車内放送", "配信で名前を呼び、今月の思い出と選んだ二曲を車掌風トークで紹介します。"], ["48K", "帰り道ラジオの主役", "曲の雰囲気を選べる約5分のDJ風お礼企画。名前入りのきっぷアイコンと番組表画像も作ります。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」。ここまでが挨拶です。じょーれんって呼んでね。昔のJ-POPが流れると、うろ覚えのサビでもつい口ずさみます。パクチーは香りが苦手。載っていたらそっと皿の端へ。\n\n週末は友だちとバドミントン。ダブルスで二人同時に「任せた！」と言って、真ん中に落ちるシャトルを見送ったことがあります。今月の小さな目標は、迷ったときに「取るよ」と声に出して一球返すことです。\n\n枠でも、つい口が先に動きます。ある晩「初見さん、こんばんは！」と迎えた人が「昨日あんたと一時間しゃべったよ」。しかも前の日も、僕はその人を「初見さん」と呼んでいたらしい。次の日は向こうから「はじめまして」。そこで僕も「昨日ぶりですね」と返せました。コートでも、これくらい返せるといいんだけどなあ。", "また来た初見席", "「初見です」も「昨日ぶりです」も大歓迎。雑談に途中から入るときは「今、なんの話？」と声をかけてください。会長がじゃんけんで決まった話も、初めて聞く顔をしてもらえたら喜んで話します。", [["1K", "昨日ぶりのコアおめ", "名前を呼んで「初見さん、今日もありがとう！」とお祝いします。"], ["5K", "おかえりメッセージ", "印象に残っているやり取りを一つ選び、名前入りのお礼をファミリーに書きます。"], ["10K", "自称初見の名札アイコン", "「初見・認定○回目」の肩書きと表示名を入れたアイコン画像を作ります。"], ["20K", "お祝いの肩書きリクエスト", "「初見のベテラン」などの候補から肩書きを選んでもらい、配信でお披露目します。"], ["30K", "直筆風の来店認定セット", "表示名と好きな肩書きを入れた認定カードと、色違いのアイコンをファミリーに載せます。"], ["40K", "いつもの席のお礼トーク", "今月印象に残ったあなたのコメントや助かった場面を、配信で名前を呼びながら振り返ります。"], ["48K", "歓迎総会の主役", "あなたが選んだ話題で約5分の雑談とお礼。名前入りの会長名札アイコンと認定カード画像も作ります。"]]],
  ["あずき＊", "あずきです🍡 粒あんのおまんじゅうが好き。冬はフィギュアスケート観戦が楽しみで、ジャンプのたびに息をのみ、着氷を見てほっとします。演技のあとの拍手も好き。自分で走るとなると、タイムを測られる長距離走は苦手です。\n\n和菓子屋さんでは包み紙の絵柄も見ます。気に入った紙を伸ばして缶にしまうのが趣味です。いちばん古い一枚は祖母から。おまんじゅうを二つもらって「おばあちゃんも食べる？」と一つ差し出したら、「それは明日のあんたの分よ」。包みの端をよく見ると、小さな字で「明日」と書いてありました。\n\n今も箱で買うと、二日に分けるつもりで帰ります。初日に箱を二度開けても、私の中では「味見の続き」。気に入った包み紙は捨てないように、すぐ缶にしまいます。さすがに自分で「明日」と書いても、祖母ほどの説得力がないんです。", "粒あんと夜のお茶", "夜のお茶とおやつのおともに、歌や雑談を🍡 和菓子のおすすめは味から聞きたいけれど、「包み紙がかわいくて買った」から始まる話も好きです。お茶をいれに立った人は、戻ったところからどうぞ。", [["1K", "湯のみでコアおめ", "名前を呼んで「お茶、あなたの分もいれました」とお祝いします。"], ["5K", "明日の包み紙メッセージ", "翌日にも読み返したくなる一言を、名前入りでファミリーに投稿します。"], ["10K", "和菓子の包み紙アイコン", "小豆色の柄に表示名を入れたアイコン画像を作ります。"], ["20K", "おやつ選びリクエスト", "あんこ派かきなこ派かを聞いて、配信で和菓子と合うお茶を一組紹介します。"], ["30K", "甘味のおそろい画像", "好きな和菓子をモチーフに、名前入りのアイコンとスマホ壁紙を作ります。"], ["40K", "あなたを祝うお茶会トーク", "名前を呼んで、今月のお礼と「あなたに似合う和菓子」を配信で紹介します。"], ["48K", "あずきの甘味お礼会", "好きなおやつをお題に約5分の雑談とお礼。名前入りアイコンと、ひと言つきの甘味カード画像を作ります。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 ほうじ茶の飲み比べが好きで、涼しくなると焼き芋を合わせたくなります。何杯も並べて撮るのは苦手。カメラを出す前に、香りが気になる一杯を飲んじゃいます。\n\n友人と飲み比べをした日、いつもの茶葉と奮発した茶葉を別々の急須でいれました。友人が二杯目を飲んで「こっちのほうが香りが上品」。ふと見ると、奮発したほうの急須は手つかず。僕が二杯とも、いつものほうから注いでました。\n\n今度こそ別のお茶を出すと「これは焼き芋の香りがする」と友人。ちょうど僕は、二人の間で焼き芋を割ったところでした。次の目標は、二つの急須から一杯ずつ注ぐこと。焼き芋の袋は、感想を聞いてから開けます。配信を聴きながら洗い物をすることも。僕の返事が途切れたら、だいたい手についた泡を流してます。", "ほうじ茶の間", "今いれたお茶、どんな香りがしますか🍵 一口目と少し冷めてからで味が違う、そんな話を聞くと僕も次に試したくなります。合わせたお菓子の話もぜひ。聞いているだけの人にも、湯のみを一つ。", [["1K", "急須でコアおめ", "名前を呼んで「湯のみ、置いときました」とお祝いします。"], ["5K", "お茶うけの一言", "今のあなたに添えたい一言を、名前入りのお礼としてファミリーに書きます。"], ["10K", "ほうじ茶ラベルアイコン", "茶葉のラベル風デザインに表示名を入れたアイコンを作ります。"], ["20K", "お茶うけリクエスト", "好きなお菓子を聞いて、配信で合いそうなお茶と選んだ理由を紹介します。"], ["30K", "選べる茶席画像セット", "茶色か生成りを選べる、名前入りアイコンと湯のみ柄のスマホ壁紙を作ります。"], ["40K", "お名前入りのほうじ茶トーク", "配信で名前を呼び、今月のお礼と、あなたにおすすめしたい淹れ方を話します。"], ["48K", "あなたのお茶会コーナー", "好きなお茶を聞いて、配信で約5分の飲み比べトークとお礼。名前入りアイコンと茶席カード画像も作ります。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこで立ち上がる、ぼるとです⚡ 野球選手の自伝が好きで、逆転打を放った人が打席で何を考えたかまで読みます。一定のペースで走るのは苦手で、ジョギングは三分で歩きます。\n\n中継前はお茶をいれて、スマホの速報通知を切るのが決まり。切り忘れたときだけ、湯のみ片手に売り子の一発ギャグ。「ネタバレ入りましたー。お茶で口直しいかがですかー」。家族はお茶だけ持っていきます。\n\nある日、隣の部屋でテレビ中継を見ていた家族が、大声を出しました。「結果言うな！」「足つっただけ！」。数秒遅れのネット中継で逆転の瞬間を見て、僕が叫ぶと「ああ、それはもう見た」。速報通知は切ったのに、隣の部屋からは別件の速報が来ました。試合後は、僕が隣の部屋へヒーローインタビューに。「先ほどの叫びは？」「足の指がつりました」。", "九回裏の応援席", "逆転打の話になっても「その前に粘って塁に出た選手は？」まで振り返る応援席です⚡ 野球に詳しくなくても、今日の自分の好プレーを一つどうぞ。「今何回？」と聞いてくれたら、話の途中からでも案内します。", [["1K", "応援席のコアおめ", "名前を呼んで「ナイスコア！」と、球場気分で拍手します。"], ["5K", "今月の好プレー便り", "配信で助かったことや盛り上がった一言を、あなたの好プレーとしてファミリーに書きます。"], ["10K", "背番号入り選手アイコン", "名前と好きな背番号を入れた、選手カード風アイコンを作ります。"], ["20K", "あなたの一打を実況", "最近うれしかったことを一つ聞いて、配信で逆転打のように実況します。"], ["30K", "チームカラーの応援セット", "好きな色を選んで、名前と背番号入りのアイコンと待ち受けを作ります。"], ["40K", "九回裏のお礼インタビュー", "名前を呼んで今月の好プレーを振り返り、あなたからの質問を一つ配信で答えます。"], ["48K", "ヒーロー特番の主役", "あなたが選んだ話題で約5分の野球風お祝いトーク。名前入り選手アイコンとヒーローカード画像も作ります。"]]],
  ["たっぷりん🍮", "ぷりんと呼んでください🍮 プリンは固め、カラメルは苦め。歌枠で昭和歌謡が流れると、洗濯物をたたむ手が止まります。お菓子のレシピ本は何ページも手順が続くと苦手なので、新作はもっぱら買って楽しみます。\n\nプリンを食べながら歌枠を聴いていたら、ずっと探していた曲が流れて、やっと題名が分かりました。それから縁起を担いで、大事な日の前の晩には固めのプリンを一つ冷蔵庫に入れます。ひと口目の決まり文句は「カラメルは最後まで」。三口目には、もう全部混ぜてます。\n\nある晩、家族に食べられないようプリンを隠して、自分でも場所を忘れました。翌朝、家族が野菜室で見つけて「ここ、高級デザート売り場になってるよ」。その奥には、別の家族が隠したシュークリームもありました。今は野菜室を開けるたび、野菜より先に奥のほうをのぞいてます。", "固めプリン同好会", "固め派もとろとろ派も、同じテーブルへ🍮 カラメルを混ぜる派は、何口目かまで聞きたいです。今日は別のおやつを食べてる、という報告も歓迎。昭和の歌謡曲が流れたら、プリンの話はいったん休憩。", [["1K", "スプーン一杯のコアおめ", "名前を呼び、スプーンを掲げてお祝いします。"], ["5K", "固めのお礼メッセージ", "「カラメルは最後まで」など、ぷりんらしい一言を名前入りでファミリーに書きます。"], ["10K", "名前入りプリンアイコン", "プリンラベル風のアイコン画像に表示名を入れます。"], ["20K", "おやつトークのリクエスト", "好きなプリンか懐メロの思い出を一つ聞いて、配信でその話題から雑談します。"], ["30K", "カラメル色の画像セット", "固め派かとろとろ派を選べる、名前入りアイコンとおやつ柄の待ち受けを作ります。"], ["40K", "プリン部のお礼放送", "配信で今月のお礼を名前入りで伝え、あなたが選んだおやつのお題で話します。"], ["48K", "新作プリンお祝い回", "あなたの選んだ味をお題に約5分の雑談とお礼。名前入りラベルアイコンと、直筆風コメント画像も作ります。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、弦の音まで聞こえるアコースティックギターの弾き語りを好んで聴きます。反対に、タイマー付きの早押しは苦手。答えが浮かんだときには、もう次の問題です。\n\n映画に行く日は、いい作品に当たるように月柄の古いハンカチを持っていきます。エンドロールのあとで、覚えている音を一つメモするのが小さな目標。廊下の靴音や冷蔵庫のうなる音から、その場面の役者の顔まで思い出すことがあります。\n\n前に、題名が分からない挿入曲を鼻歌にして友人へ送りました。「途中から別の曲になってる」と返事が来て、翌日には二曲とも教えてくれました。映画の日のページには、正解とおまけの二曲を書き足しました。今も続けて聴くと、鼻歌でどうやってつないだのか、ちょっと笑います。", "余韻のひと席", "夜の弾き語りと、映画のあとも頭に残っている音や台詞の話を。まだ観ていない人も混ざれるよう、作品の話は心に残った一音から。話す気分じゃない夜も、よかったら一曲分だけ座っていってください。", [["1K", "月の席でコアおめ", "名前を呼んで「今夜もこの席で、ありがとう」とお祝いします。"], ["5K", "余韻を残す一行", "心に残ったやり取りを一つ添え、お礼をファミリーに書きます。"], ["10K", "月明かりの待ち受け", "月と映画館の灯りを描いた、表示名入りのスマホ壁紙を作ります。"], ["20K", "余韻のお題リクエスト", "好きな映画の音や音楽の雰囲気を聞き、配信で一本または一曲をおすすめします。"], ["30K", "夜色のポスターセット", "好きな夜の色を選べる、名前入りアイコンと映画ポスター風の壁紙を作ります。"], ["40K", "眠る前のお礼朗読", "今月の思い出を添えたあなた宛ての短いお礼を、配信でゆっくり読みます。"], ["48K", "今夜の上映会の主役", "あなたが選ぶ余韻のお題で約5分の雑談とお礼朗読。名前入りアイコンとポスター画像も作ります。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは得意です。\n\nあてなです。伊沢拓司さんが出るクイズ番組では、どう考えて答えにたどり着いたのかが気になります。自分で解くときは、先に答えを言われるのが苦手。ひらめきますようにと、謎解きには決まって青いペンを持っていきます。\n\n一度通った道を簡単な地図に描くのは得意です。ある脱出ゲームで、ノートの左ページには部屋の見取り図を描き、右ページには推理を書きました。見取り図で椅子の位置に印をつけて、立ったまま右ページに「椅子は絶対怪しい」と書いていたら、係の人が「疲れたら座って大丈夫ですよ」。左の印の横には「座ってよし」を追記しました。\n\n枠で答えが浮かんだときには、私も先に「ヒント要る？」と聞きます。私が「なるほど」としか言わなくなったら、だいたい地図が合ってて、推理だけ外れたときです(￣▽￣)", "仮説だらけの作戦室", "謎解きの作戦会議では、最初に「実際に見たこと」から。推理が外れても、理由を聞いたら別の手がかりが見えてくるかもしれません。聞いてるだけでも作戦室の一員。ヒントがほしくなったら気軽に声をかけてね。", [["1K", "作戦室のコアおめ", "「新メンバー発見！」と名前を呼び、コア達成をお祝いします。"], ["5K", "観察上手のお礼札", "印象に残ったコメントを一つ選び、ひと言お礼を添えてファミリーに書きます。"], ["10K", "名前入り探偵アイコン", "虫眼鏡と青ペンをあしらい、表示名を入れたアイコンを作ります。"], ["20K", "謎解きのお題リクエスト", "好きな題材を聞いて、配信で短いオリジナルのなぞなぞを一問出します。"], ["30K", "選べる探偵セット", "メインカラーを選べる、名前入り探偵アイコンと探偵証画像を作ります。"], ["40K", "あなた発のプチ謎解き", "あなたの選んだ題材で、配信で2問の謎解きコーナー。終わりに名前を呼んでお礼を伝えます。"], ["48K", "名探偵の主役回", "好きなテーマの約5分の謎解き企画とお礼。あなたの名前入りアイコンと、解決記念のカード画像を作ります。"]]],
  ["からあげレモン🍋", "夕方、冷蔵庫のおかずを三つまで数える、からレモです🍋 それでも献立が決まらないと、枠でつい「今日、何食べた？」。外で食べるなら手書きのお品書きがある店が好きで、「本日のおすすめ」に唐揚げを見つけたら、冷蔵庫のことは忘れて注文します。\n\n友人と大皿を囲んだ日、「レモンかけていい？」と聞くところまでは上出来でした。いざ絞ると、汁が自分の目に直撃。目を洗って戻ったら、友人が「さっきの一個、めっちゃ酸っぱかった」と言いながら、同じ皿から二個目を取ってました。\n\n以来、レモンは自分の小皿でそっと絞ります。食卓で掛け声の多い曲が流れると、つられて声を出して話を聞き逃すので少し苦手。冷めてもおいしい唐揚げの店の名前だけは、曲が終わってからもう一回聞きます。", "ひと絞り食堂", "いらっしゃい、ひと絞り食堂です🍋 商店街の定食屋や、冷めてもうまいお弁当のおかずの話をします。衣はカリカリ派？ しっとり派？ 初めての方は、好きなほうを教えてください。", [["1K", "からレモのコアおめ", "名前を呼んで「拍手、レモンひと絞り分！」とお祝いします。"], ["5K", "今日のおかずメッセージ", "今月の応援へのお礼を、表示名つきでファミリーに書きます。"], ["10K", "レモン食堂の名札アイコン", "唐揚げとレモンのお品書き風に、表示名入りアイコンを作ります。"], ["20K", "今夜の副菜リクエスト", "好きなおかずを一つ聞き、配信で一緒に食べたい副菜を提案します。"], ["30K", "ひと絞りの画像セット", "レモン色か唐揚げ色で、名前入りアイコンと手書き風お品書き画像を作ります。"], ["40K", "あなたの好きなおかず会議", "好きなおかず二品を聞き、配信で献立を考えながら名前を呼んでお礼を伝えます。"], ["48K", "ひと絞り食堂の主役席", "あなたが選んだ料理で約5分の献立会議とお礼。お品書きカード画像と名前入りアイコンも作ります。"]]],
  ["kohaku.", "こはくと申します。休日の朝は、開店直後のいつもの喫茶店へ。静かなピアノ曲の合間に聞こえる、カップを置く音が好きです。後ろに人が並ぶと焦るので、席でゆっくり注文できる店だと落ち着きます。毎回メニューを開きますが、今日も厚切りトースト。\n\n包装紙一枚で本のカバーを折るのが得意です。家で配信を聴きながら本を読み、耳に残った曲名を付箋に書いてカバーの折り返しに貼ります。久しぶりに本を開くと、物語より先に、その夜の歌声がよみがえることがあります。\n\nある朝、本を忘れて店へ行くと、店主が「今日は本、お持ちじゃないんですね」。本の話をしたことはないのに、窓辺で読んでいたのを覚えてくれていました。翌週は本を一冊。トーストが届いたとき、表紙を見た店主と目が合って、少し笑いました。", "付箋のある喫茶室", "読み終えても心に残る場面と、そこに流したくなる曲について話す喫茶室です。「このページにだけ付箋を挟んだ」から話してもらえると、続きが聞きたくなります。聴くだけの日は、窓側へ。", [["1K", "窓側からコアおめ", "名前を呼び「いつもの窓側、お席あります」とお祝いします。"], ["5K", "こはくの一行しおり", "配信で印象に残ったあなたの一言とお礼を、ファミリーに残します。"], ["10K", "付箋柄の名前入りアイコン", "付箋と厚切りトーストをあしらい、表示名を入れたアイコンを作ります。"], ["20K", "読書のおともリクエスト", "好みを聞き、配信で次に読む本か読書のときに聴く曲を一つ紹介します。"], ["30K", "選べる喫茶のしおりセット", "好きな色で、名前入りアイコンと、ひと言入りのしおり画像を作ります。"], ["40K", "あなた宛ての喫茶朗読", "今月のお礼を短い喫茶店の小話にして、配信で名前を添えて朗読します。"], ["48K", "こはくの開店祝い企画", "お題を選べる約5分の小話朗読とお礼。名前入りアイコンと、小話の一節入りのしおり画像も作ります。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかって呼んでね。いつもの枠に入ったら「こんばんは」のあとに⚡を一つ。サンドウィッチマンのコントで、会話がかみ合ってないのに二人とも真顔で進むところが好きです。仲間内で早口言葉が流行ったときは、舌が追いつかず、すぐ見学に回りました。\n\nしりとりで一番に答えたくて「みかん」と送ったら、一発で終了。枠主が「仕切り直し！ 好きな言葉から！」と言うので、今度は「だいこん」。少し間を置いて「ぴか、拍手係できる？」。誰より早く👏を送りました。拍手なら「ん」で終わりません。\n\n大喜利では、誰かの答えに乗っかる前に「その答え好き！」と伝えるのがこだわり。自分のボケは、文字だけでも真顔が浮かぶ言い方を考えます。その間に次のお題へ進んだら、今度も先に👏。拍手の早押しだけは負けません。", "ぴかっと早押し部", "こんぴかー！⚡ 早押し、しりとり、急な大喜利。初めての人も、好きな答えに👏を送るところから。問題が出る前に押しちゃったときは、ぴかと一緒に「もう一回お願いします！」。", [["1K", "こんぴかコアおめ", "名前を呼んで「小さめ落雷！」と拍手します。"], ["5K", "祝辞に一文字おまけ", "名前は正しく、祝辞だけ一文字わざと間違えたお礼をファミリーに書きます。"], ["10K", "名前入り早押しボタン", "稲妻と早押しボタンを描き、表示名入りアイコンを作ります。"], ["20K", "出題リクエスト権", "お題を一つ選んでもらい、配信で早押し風クイズか大喜利を一問出します。"], ["30K", "拍手係の記念セット", "好きな稲妻の色で、名前入りアイコンと拍手係の賞状画像を作ります。"], ["40K", "ぴかの一人二役大喜利", "あなたのお題で配信中に一人二役の大喜利を披露し、名前を呼んでお礼を伝えます。"], ["48K", "あなた杯・大喜利特番", "好きなお題で約5分の大喜利コーナー。名前入りの優勝賞状画像と早押しアイコンも作ります。"]]],
  ["しりゅう_08", "しりゅうです。アニメは二周目に脇役を一人決めて追うのが好きです。一周目にはただ黙っていた人が、二周目には何かを言いかけてやめたように見える。反射神経がものをいう対戦ゲームは苦手です。相手の動きに見入って、反応が一拍遅れます。\n\n釣りに行く日は、初めてアジが三尾釣れたときの帽子で験担ぎ。帰ったら竿を出した場所と時間をメモするのが決まりです。ある日は一尾も釣れず、好きなアジの塩焼きが食べたくて、魚屋で二尾買いました。\n\n袋をのぞいた家族が「今日すごいじゃん」。黙ってレシートを渡したら「そりゃ大きさも揃うわけだ」と笑われました。今では帽子を手に取ると「海と魚屋、今日はどっち？」。まず海だよ。あの日の釣果欄には、胸を張ってゼロと書いてあります。", "夜釣りとアニメ棚", "釣れなかった日の海の話も、アニメを見返してやっと気づいた脇役の表情も。初めてなら、次に観たい作品の話からでも。結末に触れるときは、先にネタバレしてもいいか聞きましょう。", [["1K", "夜釣りのコアおめ", "名前を呼んで「今日の大物、来ました」とお祝いします。"], ["5K", "釣果メモのお礼", "印象に残ったやり取りを一つ、釣果メモ風に名前を添えてファミリーに書きます。"], ["10K", "釣り帽子の記念アイコン", "愛用の帽子をモチーフに、表示名入りアイコンを作ります。"], ["20K", "今夜の一話リクエスト", "好きな雰囲気を聞いて、配信でおすすめアニメを一作、結末に触れず紹介します。"], ["30K", "夜の波色アイコンセット", "好きな波の色を選んで、名前入りアイコンと釣果カード画像を作ります。"], ["40K", "脇役の見どころトーク", "あなたが好きなアニメを一作聞いて、配信で脇役の注目シーンをネタバレなしで語ります。"], ["48K", "夜釣りとアニメの主役回", "釣りかアニメのお題を選べる約5分のお礼企画。名前入りアイコンと釣果図鑑風カード画像も作ります。"]]],
  ["たいやき＠しっぽ派", "たいやきでも、しっぽでも🐟 商店街の看板を眺めていると、ひと駅ぶんもあっという間です。週末のバスケ観戦では、ボールを追うより、コートの隅でパスを待つ選手が気になります。たい焼きもまずは端から。\n\n前は友だちと激辛の店も巡りました。私には辛すぎて味が分からないので、今は甘いものの店で合流します。頭から食べる派のその友だちが、たい焼きを「半分こしよう」と言うので手を出したら、しっぽの先だけ。「しっぽが好きって言ったでしょ」。確かに言ったけど、向こうの皿には頭も胴体もありました。\n\n今は、あんことカスタードを自分用に一匹ずつ。同じ袋から選ぶので、先にどちらの味を引くかは、具にたどり着くまでのお楽しみです。座右の銘は「楽しみは端から」。次に半分こするときは、私が割ります。", "しっぽから商店街", "商店街で見かけた気になる一品や、散歩の途中につい寄った店の話でひと休み🐟 頭派もしっぽ派も、自分なら何を詰めるか、ひとつ聞かせてね。しょっぱい案も歓迎です。", [["1K", "しっぽのコアおめ", "名前を呼び「今日の一匹、しっぽからどうぞ」とお祝いします。"], ["5K", "しっぽからお礼便", "その人らしかった一言を選び、ファミリーに名前入りのお礼を残します。"], ["10K", "たい焼き袋の名入れアイコン", "たい焼きの紙袋風デザインに、表示名を入れたアイコンを作ります。"], ["20K", "たい焼きの具リクエスト", "食べたい具を教えてもらい、配信で架空の新作に名前をつけます。"], ["30K", "あんこ色かカスタード色", "好きな方の色で、名前入りアイコンとたい焼き柄の待ち受けを作ります。"], ["40K", "あなたのお題で商店街トーク", "好きなおやつについて配信で話し、あなたの名前を呼んで月のお礼を伝えます。"], ["48K", "しっぽ派の主役販売会", "選んだ具をお題に約5分の新作トークとお礼。名前入りアイコンと手書き風メニュー画像も作ります。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでも大丈夫。夜はひと駅ぶん遠回りして、足音が聞こえるくらいの音量で歌や雑談を聴きます。一度通った道を街灯や看板を頼りに引き返すのが、意外と得意です。歩数競争は、好きな場所でゆっくり立ち止まれなくて苦手。\n\n用事が思うように進まなかった夜、枠主さんが歌い終わって「みんな、帰ったら寝ようね」と言いました。家でも考え込むつもりだったけれど、「続きは明日でいいか」。着くなり布団に入りました。同じことでも、翌朝のほうが考えやすくなっていました。\n\n枠で何を話そうか迷うと「そっち、月見える？」と聞くのが口癖です。「こっちは曇り」と返ってきたら、その人が見上げた空を想像します。月が見えなくても、少しだけ一緒に夜道を歩いた気分になります。", "月夜の遠回り", "帰り道や寝る前に、夜の歌を聴いたり、今日ふと目に留まったものを話したり。今日見かけた色で、いちばん覚えているのは何色ですか。夜道の途中は聴くだけで、返事は家に着いてからで大丈夫です。", [["1K", "ひと駅ぶんのコアおめ", "名前を呼び「おかえり、今夜も遠回り？」とお祝いします。"], ["5K", "名前入り月夜メッセージ", "今日の空を思わせる一文とお礼を、ファミリーに書きます。"], ["10K", "街灯と三日月のアイコン", "街灯と細い月の絵に表示名を入れたアイコンを作ります。"], ["20K", "夜の遠回りリクエスト", "今の気分や好きな夜景を聞いて、配信で散歩に似合う曲を一曲紹介します。"], ["30K", "夜空の色を選べるセット", "好きな夜空の色で、名前入りアイコンと月明かりのスマホ壁紙を作ります。"], ["40K", "歩幅を合わせるお礼朗読", "あなたの好きな夜景を題材に短いお礼を書き、配信で名前を添えて読みます。"], ["48K", "遠回りの月夜便", "選んだ夜景で約5分の雑談とお礼朗読。名前入りアイコンと、朗読の一文を入れた壁紙も作ります。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間に枠をのぞきます。急に黙ったら手がふさがってるだけ。手書きの看板が好きで、値段を書き直した跡まで見ちゃいます。バレー観戦でも、セットごとの点数を手書きで残す派。制限時間のあるパズルは、残り秒数を見た途端に答えが飛ぶので苦手です。\n\nある日、枠で「おかえり」を「おかわり」と打ちました。次に来たとき「大盛りにする？」と聞かれ、「漬物も」と返したら、枠主が「うち、何屋だと思われてる？」。そこで初見さんに「おすすめは？」と聞かれて、店員みたいに振る舞ってた全員が黙りました。\n\n次は舞茸の天ぷらと答えます。手書きの看板には品名を書いて、値段の欄はまだ空白。今度は「いくら？」と聞かれたら、また黙ると思います。", "おかわり休憩所", "作業の途中でひと休み🍄 ゲームの進み具合や、うっかり送った誤字でゆるく盛り上がります。「休憩中」の札を出すつもりでひと言。戻ってきたときの「おかわり」にも、おかえりって返すよ。", [["1K", "コア達成セーブ音", "名前を呼んで「コア達成、セーブしました！」とお祝いします。"], ["5K", "おかわりの一行お礼", "印象に残ったコメントをひとつ添えて、ファミリーに名前入りのお礼を書きます。"], ["10K", "ゲーム風セーブアイコン", "セーブ画面風に表示名を入れたアイコンを作ります。"], ["20K", "今日のおかわり任務", "あなたが選んだ雑談のお題で、配信中に短い「休憩クエスト」を一つやります。"], ["30K", "任務名入りの画像セット", "好きなゲーム風配色で、名前と任務名入りアイコン、セーブ伝票画像を作ります。"], ["40K", "あなた発の休憩ステージ", "選んだお題で配信中にミニ企画を一つやり、名前を呼んでお礼を伝えます。"], ["48K", "クリア記念おかわり回", "約5分のゆるいゲーム風企画とお礼。名前入りアイコンと、あなたの任務名が入ったクリアカード画像も作ります。"]]],
  ["こうめい＊", "こうめいです。歴史小説では、負けた側が何を考えていたかが気になります。ボードゲームの説明書を集めていて、遊んだ日を付箋に書いて挟むと、対戦相手まで思い出せます。早押しクイズは、出題者の狙いを考えるうちに先を越されるので苦手です。\n\n小学生との対戦で、相手の番なのに自分の次の手を長々と説明したことがあります。じっと聞いていた子が「僕、このコマをここに置けば勝ちだよ」。見れば確かに、その一手で私の負け。強がって「それを確認してたんだよ」と返したら、「じゃあ僕の番も確認して」と言われました。\n\n座右の銘は「作戦より先に盤面を」。説明書を片づけるとき、「相手の番に作戦発表をしない」と書いた付箋を貼りました。家でも夕飯が先かお風呂が先かで作戦を練ります。説明が長引いて、ごはんが冷めるのが難点です。", "一手先の円卓", "ここの円卓では、ボードゲームも歴史も「自分ならどうする？」が話の入口です。「このコマ、どこに動かせる？」という質問も歓迎です。私の作戦解説が長ければ、遠慮なく「そろそろ次の手」と言ってください。", [["1K", "円卓のコアおめ", "名前を呼び「本日の作戦会議へようこそ」とお祝いします。"], ["5K", "軍師の一行お礼", "今月の気配りや面白かった発言を一つ挙げ、名前入りのお礼をファミリーに書きます。"], ["10K", "作戦図の名前入りアイコン", "盤面と駒の柄に表示名を入れたアイコンを作ります。"], ["20K", "軍師のお題リクエスト", "あなたが選んだ日常の迷いをお題に、配信で軍師風の作戦を一つ考えます。"], ["30K", "選べる陣営カラーセット", "好みの色で、名前入りアイコンと作戦図風の記念カードを作ります。"], ["40K", "円卓の好プレー表彰", "今月の言葉や助かった場面を配信で振り返り、名前を呼んでその一手をたたえます。"], ["48K", "勝利評定の主役", "好きな相談や歴史のお題で約5分の作戦会議とお礼。名前入りアイコンと軍師の感謝状画像も作ります。"]]],
  ["れん_07", "れんです。ライブハウスでは後ろの端が定位置。人混みで肩がぶつかるのが苦手で、少し離れたほうが音に集中できます。奥田民生さんの曲では、歌の合間のギターをつい耳で追います。休みの日は中古CD屋で気になる曲名を控え、帰り道に配信で聴くのが楽しみ。冬のライブには早めに着いて、開場までホットコーヒーで手を温めます。\n\nある晩、伴奏が止まり、歌い手さんが「ここだけ一緒に歌える？」とマイクを客席へ。前の列から少しずつ声が上がり、後ろにいた僕もつられて歌っていました。歌い手さんがうれしそうに客席を見渡していたら、今度は自分が歌に戻るタイミングを逃して、照れ笑い。\n\n今もその曲を聴くと、音源には入っていないあの晩の歌声まで聞こえる気がします。家では弾き語りや邦ロックの枠をよく聴きます。挨拶のあとはだいたい静かですが、間奏の話になると急にコメントします。", "ギターが鳴る後列", "冬のライブ帰り、冷えた手で感想を一つ書くなら、どの場面？ 後ろの列まで響いた一音も、思いがけず静かになった瞬間も聞きたいです。ライブに行っていなくても、家でつい聴き返す間奏の話ならすぐ混ざれます。", [["1K", "後列のコアおめ", "名前を呼んで、ライブのMC風に「後ろまで届いてます」とお祝いします。"], ["5K", "ライブ半券の一行", "ギター談義など今月の思い出を一つ挙げ、名前入りのお礼をファミリーに書きます。"], ["10K", "名前入りライブ半券アイコン", "ギターとライブの半券をモチーフに、表示名入りアイコンを作ります。"], ["20K", "聴きたい音リクエスト", "好きな楽器の音を聞いて、配信で曲を一つと聴きどころを紹介します。"], ["30K", "ライブカラーの記念セット", "好きな差し色で、名前入りアイコンと、あなたに聴いてほしい二曲入りのライブ半券画像を作ります。"], ["40K", "お名前入りアンコールMC", "あなたが選んだ音楽のお題と今月のお礼を、配信でライブ終演後のMC風に話します。"], ["48K", "あなた宛てのミニライブトーク", "選曲テーマを指定できる約5分のトークとお礼。名前入りアイコンとセットリスト画像も作ります。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」と続けて聞く、じにです＊ 日村勇紀さんがおいしそうに食べていると、つい何か買いに出たくなります。話題の店を一日に何軒も回るのは苦手。一軒でおなかを満たして、その辺をぶらぶらする方が好きです。帰宅したら、寄ったお店を地図アプリに記録します。\n\nある日、「絶対また行く」というメモを頼りに昼ごはんへ。席に着いてメニューを開くと、目当てのたこ焼きがありません。せっかくなので定食を注文。食べ終えて店を出たら、角の先からソースの匂いがしました。そういえばこの店は、たこ焼き屋へ行くときの目印でした。地図には、目印のほうに間違えて本命のメモを付けていました。\n\n結局たこ焼きも買いました。冬は焼きたてのたこ焼きが入った箱を両手で持つと、帰るまで手が温かい。今はピンを「曲がる角」と「たこ焼き」に分けています。「また行く」のメモは、定食もおいしかったので両方に。", "よりみち地図帳", "帰り道につい買うおやつや、旅の途中で入ったお店の話を集めています。常連さんがいつも頼む一品とか、地元の人しか知らない食べ方とか。店名が出てこない日は、次に行ったらまず何を頼むか、そこから聞かせてね＊", [["1K", "寄り道のコアおめ", "名前を呼んで「本日の寄り道、いらっしゃい」とお祝いします。"], ["5K", "地図ピンのお礼メモ", "今月の会話から、おいしそうだった一言を拾ってお礼をファミリーに書きます。"], ["10K", "目印つきの名前入りアイコン", "地図ピンと好きなおやつを描いた、表示名入りアイコンを作ります。"], ["20K", "おやつ会議リクエスト", "甘いものかしょっぱいものかを聞き、配信で寄り道用のおやつを一つおすすめします。"], ["30K", "寄り道地図の画像セット", "好きなおやつをモチーフに、名前入りアイコンと地図帳風の壁紙を作ります。"], ["40K", "あなたの一品を語る回", "好きなご当地のおやつを一つ聞いて、配信で今月のお礼とおやつトークをします。"], ["48K", "商店街の寄り道特番", "好きなおやつをお題に約5分の雑談とお礼。名前入りアイコンと架空の寄り道マップ画像も作ります。"]]],
  ["港レター_", "みなとです。港町に泊まったら、朝は焼きたての塩パンを探します。散歩中にテンポの速い曲を聴くのは少し苦手。足までつられて、曲がりたかった路地を通り過ぎます。イヤホンを外して歩くと、店のシャッターが開く音や波の音で、街の朝が始まるのが分かります。\n\n旅先で書くはがきには、その日に覚えておきたいことを一つだけ。ある夕方、自宅宛てのはがきに「明日の朝、港で塩パンを買う」と書いて投函しました。翌朝は焼きたてを買い、温かい紙袋を抱えて宿へ。帰宅して数日後にはがきが届くと、紙の上の私はまだその朝を待っていて、思わず「おいしかったよ」と返事をしたくなりました。\n\n次の小さな目標は、出発前にやりたいことを一つ書いて、帰宅したら結果を書き添えること。最初の一行は「家族にも塩パンを買う」。家族の分まで食べずに帰れたら成功です。みなとより。", "海辺のポスト", "「朝七時、踏切の近くでパンの匂い」。そんな一行が届く海辺のポストです。旅先の裏道でも、通い慣れた近所でも。歩いて気づいた音や匂いに、「出勤前」や「夕暮れ」など、いつ頃だったかも書き添えてください。", [["1K", "港からコアおめ", "名前を呼び「今日も港に寄ってくれてありがとう」とお祝いします。"], ["5K", "海辺の一行はがき", "思い出に残った話題を添え、名前入りのお礼をファミリーに書きます。"], ["10K", "消印の名前入りアイコン", "海辺の消印を描いた、表示名入りアイコンを作ります。"], ["20K", "はがきの題材リクエスト", "好きな音や匂いを聞き、配信で短い旅の便りをひとつ読みます。"], ["30K", "港色の絵はがきセット", "朝焼けか夕暮れを選べる、名前入りアイコンと海辺の絵はがき画像を作ります。"], ["40K", "あなた宛ての港レター朗読", "あなたが選んだ風景を題材に、配信で名前を添えてお礼の便りを読みます。"], ["48K", "海辺のポスト特番", "選んだ旅のテーマで約5分の雑談と朗読。名前入りの消印アイコンと、便り入り絵はがき画像も作ります。"]]],
  ["けんし♪", "イントロで分かる、サビは歌える、曲名は出てこない。けんしです♪ 秋のドライブでは、夕方に車を停めて、大好きな塩むすびを食べながら帰りの一曲を選びます。分厚い歴史小説は登場人物の名前を途中で見失うので苦手。カラオケでは、珍しく思い出せた題名が落とし穴でした。\n\nよく聴いていた曲を入れたはずが、画面には知らない歌詞。同じ題名の別の曲です。取り消そうとしたら、友人が「これ歌える」とマイクを取りました。僕は横からタンバリンを構えてひと言。「安心してください。僕の歌詞は全部、シャンシャンです！」。間奏まで張り切ったら、歌い終えた友人に笑われました。\n\n次に会うなり「またあれ入れてね」と頼まれました。僕が一曲まちがえて、友人の十八番が一つ増えました。以来、選曲のときは小さく表示される歌手名まで読みます。タンバリンは今でも最初に確保します。", "サビから歌う会", "サビの手前から一緒に入りたくなる曲、ありますか♪ ここでは十八番も、帰りの車でつい口ずさむ一曲も大事なレパートリー。カラオケでつい入れる合いの手も、聴く派が何度も聴き返す一曲も、お待ちしてます。", [["1K", "口タンバリンでコアおめ", "名前を呼んで「シャンシャン！」とお祝いします。"], ["5K", "十八番のお礼メモ", "話してくれた音楽の好みに触れながら、名前入りのお礼をファミリーに書きます。"], ["10K", "タンバリンの名入れアイコン", "タンバリンと音符の柄に表示名を入れたアイコンを作ります。"], ["20K", "運転席の選曲リクエスト", "ドライブの気分を聞いて、配信で似合いそうな曲を一つ紹介します。"], ["30K", "番組表つき音楽セット", "好きな色で、名前入りアイコンと、二曲を載せたラジオ風番組表画像を作ります。"], ["40K", "ラジオ風のお礼DJ", "あなたの好きなジャンルから二曲を選び、配信でDJ風の曲紹介とお礼を伝えます。"], ["48K", "夜ラジオの主役ゲスト", "番組テーマを選べる約5分のラジオ風トーク。名前入りアイコンと記念番組表画像も作ります。"]]],
  ["かんうどん🍜", "「かん」で大丈夫です🍜 定番は、かけ、ちくわ天、ねぎ多め。郷土料理の本で見たことのない具を見つけると、食べに行きたくなります。食べたうどんの写真は、だしと具のメモを添えて集めています。白い服で汁ものを食べるのだけは苦手です。帰ってからしみを見つけると、いつ飛んだか気になって仕方ありません。\n\n近所の店で白いシャツにカレーうどんの汁が飛んだ翌週、黒い服で行きました。「前と同じので？」に深く考えずうなずいて、かけうどんを待っていると、出てきたのはカレーうどん。「今日は黒い服でよかったね」と店主。前の注文をうっかり忘れていたのは僕だけ。店主は、あのときのシャツの色まで覚えていました。\n\nその話を枠でしたとき、湯気の立つカレーうどんの写真を見せて、おなかを指さしひと言。「白い服なら、お土産もつきます」。写真に添えるメモは具とだしで十分だったのに、カレーうどんだけ「次も黒」と服装欄ができました。", "ねぎ多めの席", "かけ、ねぎ多め。うどん一杯で話が尽きない席です🍜 麺の太さやだしの色、地元じゃおなじみの天ぷら。「うちでは卵を落とすよ」からで十分です。聞いているうちに、明日のお昼も決まるかも。", [["1K", "ねぎ多めでコアおめ", "名前を呼び「ねぎ多めで一杯！」と拍手します。"], ["5K", "本日の一杯メッセージ", "あなたの一日に合う短いお礼を、店主風にファミリーへ書きます。"], ["10K", "うどん札の名入れアイコン", "丼とちくわ天を描いた、表示名入りアイコンを作ります。"], ["20K", "好きなうどんの薬味会議", "好きなうどんの具を聞き、配信で合いそうな薬味を一つ提案します。"], ["30K", "選べるのれんの画像セット", "のれんの色を選んで、名前入りアイコンとスマホ向けお品書き画像を作ります。"], ["40K", "あなたの一杯お礼トーク", "配信でお礼と一緒に、あなた好みのだしと具を組み合わせた一杯を紹介します。"], ["48K", "うどん屋の主役メニュー", "好きな具を使う約5分の献立トークとお礼。名前入りアイコンと看板うどんのメニュー画像も作ります。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話が大好きです。数式が何ページも続く天文学の本は苦手。休日の夜は外に出て、星が見えた時刻と方角をメモします。意外と得意なのは、時計を見ずに三十秒を数えること。流星を待つ間もつい数えます。何回数えても出ない日は、出ません。\n\nある晩、私が空を見て「あっ」と言うのとほぼ同時に、近くの友人も「あっ」。「見つけた？」「見つけた！」。同じ流星が見えたと思っていました。帰り道、友人が缶を見せて「探してたぶどうジュース、さっきの自販機にあったよ」。その晩、願いがかなった顔をしていたのは友人でした。\n\n次からは「何を見つけた？」まで聞きます。枠でよく話すのは、行けるなら月か深海か。私は月派。できれば窓側がいいです。着いたらいつものメモを取るつもりですが、方角をどう書くかは、そのとき考えます。", "土星の窓側席", "夜空に何か見えたら、窓側の席へ◎ 「コンビニの上に明るい星があった」だけで立派な観測報告。見た方角や星座が分かる人は、ぜひひと言。話の続きは月と深海へ。窓の外に何が見えるか、好きな方を想像してみませんか。", [["1K", "窓側のコアおめ", "名前を呼んで「今夜の窓側、空いてます」とお祝いします。"], ["5K", "星の一行メッセージ", "今月の思い出を一つ添えて、星便り風のお礼をファミリーに書きます。"], ["10K", "土星の名前入りアイコン", "土星の輪に表示名を入れたアイコンを作ります。"], ["20K", "今夜の空のお題リクエスト", "空の色や見たい天体を教えてもらい、配信でその話題を取り上げます。"], ["30K", "選べる星空セット", "土星か月を選べる、名前入りのアイコンとスマホ壁紙を作ります。"], ["40K", "お名前入りの星案内", "名前を呼び、あなたが好きな月か深海を入口に配信でお礼トークをします。"], ["48K", "あなたの窓から出発", "行き先を月か深海から選べる約5分の雑談とお礼。名前入りアイコンとオリジナルの旅程カード画像を作ります。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。「もち」だけでも振り向きます。洗い立ての綿の毛布がほんのり香るのが好きです。今の小さな目標は、配信を聴きながら寝落ちする前に「おやすみ」と書くこと。翌朝いきなり「おはよう」と書いていたら、前の晩はたぶん間に合ってません(-_-)zzz\n\nお正月はお雑煮の最初の一口で「今年もよく食べて、よく眠れますように」と願掛けします。甘く煮た黒豆は少し苦手ですが、お餅は大好き。この前は、一つ食べたあとにも、だしの中から二つ出てきました。小さい頃の「お餅ひとつじゃ足りない」を、家の人が覚えていたんです。\n\n今なら二つで十分。でも昔のひと言を覚えてくれていたのがうれしくて、その日は三つとも食べました。翌朝「今日も三つ？」と聞かれて、すぐ「一つでいい」。よく食べて、よく眠る。年の初めから、願掛けの前半だけずいぶん進みました。", "毛布ときなこの部屋", "毛布の中からでも、きなこ餅を食べながらでも、こんばんは。お雑煮のだしは、同じ地域でも家ごとに違うから、聞くのが楽しみです。ひと言だけなら「うちは丸餅」のように。眠くなったときは返事より先に目を閉じてね。", [["1K", "毛布からコアおめ", "名前を呼び、眠気を起こさないくらいの拍手でお祝いします。"], ["5K", "おやすみの一行お礼", "寝る前に読める短いお礼を、名前を添えてファミリーに書きます。"], ["10K", "きなこ餅の名前入りアイコン", "きなこ餅と毛布の柄に、表示名を入れたアイコンを作ります。"], ["20K", "ぬくぬく話題リクエスト", "「お雑煮」「冬の寝る前」など、あなたが選んだお題を配信で話します。"], ["30K", "毛布柄の記念画像セット", "毛布の色を選んで、名前入りアイコンと、ひと言入りの待ち受けを作ります。"], ["40K", "眠る前のお名前コール", "あなたの好きな冬の話題と今月のお礼を、配信でゆっくり話します。"], ["48K", "毛布の中のお礼会", "お題を選べる約5分の雑談とお礼。名前入りアイコンと、おやすみの言葉を入れた壁紙も作ります。"]]],
  ["いかいかが？", "いかです🦑 水族館では、生き物のしぐさに勝手に字幕をつけています。説明板はあとで。先に一匹だけ選んで、その動きをじっと見るのがこだわりです。登場人物がすごく多い長編ミステリーは、途中で関係が分からなくなって苦手ですが、水槽なら主役を一匹に絞れます。\n\nエイに手を振って、隣の友人に「今、習ってます。エイ語」とひと言。手を振り返してくれたのは、水槽越しに見えた通路の子どもでした。私がもう一度振ると、今度はお母さんまで。こちらも夢中で手を振っているうちに、エイはどこかへ泳いでいきました。あとでこの場面につけた字幕は「エイ語の先生、先に帰る」。\n\n配信でも、雨の話からいつの間にか深海の話になっているような雑談が好きです。最初に天気を聞いたのは、たいてい私。そちらの空模様、いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 岩陰から顔を出す魚に、ひとこと字幕をつけるなら？ 生き物の名前が分からなくても、色や動きだけ伝えてくれたら一緒に考えます。ぼんやり眺めているだけの時間も好きです。", [["1K", "クラゲ前のコアおめ", "名前を呼んで「クラゲ前でひと息、いかがですか」とお祝いします。"], ["5K", "水槽からの一行お礼", "クラゲやエイになりきった短いお礼を、名前入りでファミリーに書きます。"], ["10K", "水槽プレート画像", "好きな水の生き物を聞いて、表示名入りの解説プレート風カードを作ります。"], ["20K", "水槽の字幕リクエスト", "生き物を一つ選んでもらい、配信でそのしぐさに付けたい字幕を読み上げます。"], ["30K", "選べる水槽画像セット", "クラゲかエイの柄で、名前入りアイコンと水槽プレート風カードを作ります。"], ["40K", "あなたの水槽ガイド", "好きな生き物二つを聞いて、配信でガイド風の紹介とお礼を伝えます。"], ["48K", "クラゲ前の主役ガイド", "好きな生き物で約5分の水族館風トーク。名前入りアイコンと字幕つき水槽カード画像も作ります。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 冷えた両手で温かいマグカップを包むと、やっと一息つけます。休みの日は昼に少し歩いて、帰ったらお茶をいれてバラードを。歌の動画を倍速で観るのは苦手です。歌い出す前の息づかいまでせわしなく聞こえるので。\n\n夜の歌枠で感想を何度も打ち直していたら、次の曲が始まりました。長い感想を消して「さっきの曲、二番の前の息づかいが好きでした」と送ると、歌い終えた枠主さんが「あそこ、落ち着こうと思って息を吸ったんだ」と。その一行で、私がどこを聴いていたか伝わりました。\n\n手元のお茶は、歌を二曲聴く間にすっかり冷めていました。マグを持ち上げて「冷茶、お待たせしましたー。いちばん待ったのはお茶です」と、ひとりで店員さんのまね。今日は一口飲んでから聴きます。", "雪あかりの歌席", "夜の歌を聴きながら、歌い出す前の息づかいまでゆっくり味わう席です。「あの声の入り方が好き」くらいの短い感想も、ここでは話の種になります。言葉が浮かばない夜は、温かい飲み物を片手にどうぞ❄", [["1K", "雪あかりのコアおめ", "名前を呼び、あたたかい飲み物で小さく乾杯してお祝いします。"], ["5K", "一行のおつかれさま", "その日のあなたに合う短いねぎらいを、ファミリーに書きます。"], ["10K", "雪の名前入りアイコン", "雪あかりとマグカップの絵に、表示名を入れたアイコンを作ります。"], ["20K", "夜のバラードリクエスト", "今の気分を聞き、配信で合いそうなバラードと耳に残るところを一つ紹介します。"], ["30K", "便箋と雪色アイコンセット", "雪色か灯り色を選んで、名前入りアイコンと短いお礼入りの便箋画像を作ります。"], ["40K", "あなた宛てのお礼の手紙", "配信で名前を呼び、今月の思い出を添えた短い手紙を読みます。"], ["48K", "雪あかりの手紙の時間", "好きな冬の景色をお題に約5分の雑談と手紙朗読。名前入りアイコンと、便箋画像も作ります。"]]],
  ["じゃっくん☆", "はーい、参加します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームと、人のボケに一行足すのが好きです。年末の楽しみは、友だちとゲームで遊び納めすること。翌年も笑いたい一言は、忘れないうちにスマホのメモへ。\n\nその集まりで、前に出てどんどん攻めるキャラを目で追って「勝った！」と叫びました。隣から「それ俺」と言われて画面の端を見たら、僕のキャラは壁に向かって全力疾走中。「声だけなら優勝」とも言われたので、その一言をメモに追加しました。それからは、勝ったと叫ぶ前に自分のキャラの色を確認します。\n\n休憩のおやつは、レーズン入りのクッキーだけ友だちへ。噛んだときの濃い甘さが苦手なんです。「おっと、ここでクッキーが移籍です！」。実況が余計なのは分かってます。", "とりあえず参戦部", "冷蔵庫に着いたら実況開始。最後のプリンを誰かに食べられていたら、そこから大喜利🙌 一人が言ったボケに一個ずつ足す部です。答えが浮かばないときの役は「座布団一枚！」係。そこからでも参戦できます。", [["1K", "種目未定のコアおめ", "名前を呼んで「種目はあとで決めます！」と先に拍手します。"], ["5K", "日常の一行表彰", "最近できた小さなことを一つ聞き、競技名をつけてファミリーでお祝いします。"], ["10K", "日常競技の表彰カード", "日常の出来事を一つ聞いて、表示名と架空の競技名を入れたメダル風カードを作ります。"], ["20K", "実況種目リクエスト", "あなたが決めた日常の出来事を、配信でスポーツ実況風に読み上げます。"], ["30K", "金銀が選べる表彰セット", "金か銀を選べる、名前入りアイコンと、競技名つきの表彰状画像を作ります。"], ["40K", "あなたの二種目実況", "あなたが選んだ二つの日常の出来事を配信で実況し、名前を呼んで表彰します。"], ["48K", "決勝特番の主役選手", "日常のお題で約5分の実況と表彰。名前入りアイコンと架空の大会結果カード画像も作ります。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。休みの朝はパン屋さんへ。平野レミさんの料理番組を見た日は、自分でも何か作りたくなります。おやつならバターが香るクッキー。シナモンが強いお菓子は、香りだけでお腹いっぱいです。\n\n口癖は「まず一枚、味見しよ」。クッキーをうっかり焼きすぎた日、「端がちょっと濃いよ」と友だちに渡しました。友だちから届いたのは、空のお皿の写真と「次は倍で」の一言。喜んで倍の生地を仕込み、二回に分けて焼いたら、二回目だけ出しそびれてまた濃い色に。友だちには焼き色で袋を分けて「薄いほうから味見して」。倍にするのは枚数だけのはずでした。\n\nそれ以来、座右の銘は「迷ったら、まずタイマー」。天板を入れるたびにセットします。友だちに渡す分とは別に、味見の一枚を焼くのも忘れません。", "焼きたてひと皿", "パン屋さんで見つけた新作も、家で焼いたおやつも話に出ます。ここで気になるのは、いつもの味に何を足したか。買う派の「これ、塩が効いてたよ」も立派な味見報告です。焼き色の濃い端っこが好きな人、いらっしゃい。", [["1K", "焼きたてのコアおめ", "名前を呼んで「今日の味見係さん、ありがとう」とお祝いします。"], ["5K", "ひと皿のお礼便り", "思い出に残ったやり取りを添え、名前入りのお礼をファミリーに書きます。"], ["10K", "パン袋の名前入りアイコン", "パン袋のラベル風に表示名入りのアイコンを作ります。"], ["20K", "隠し味リクエスト", "選んだおやつを聞いて、配信で試してみたい隠し味を一つ提案します。"], ["30K", "焼き菓子のラベルセット", "パンかクッキーの柄で、名前入りアイコンとオリジナルラベル画像を作ります。"], ["40K", "焼きたて感想トーク", "好みのおやつと食感を聞き、配信でその話題を広げながらお礼を伝えます。"], ["48K", "あなたの名物おやつ会", "好きな味で約5分のおやつ談義とお礼。名前入りアイコンと、架空のおやつのラベル画像も作ります。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方は洗濯物をたたむ手を止めて、いつもの枠に「おつかれ〜」。家事が済んだら、暮らしのエッセイを一篇。スーパーのおやつや、つい人に話したくなる失敗談を読むと、「うちでもありそう」って思うんです。\n\n季節限定のお菓子のラベルは、日付を書いてノートへ。甘いゆず味を探して三軒回った日、近所のお店で大きな「ゆず」の字を見つけました。「二袋でお得」につられて、味を確かめずレジへ。家で一枚かじって、ゆず胡椒味だと気づきました。辛いお菓子が苦手で水を飲んでいたら、家族が向かいで甘いゆず味のお菓子を出してきました。同じ店で、商品名を最後まで読んで選んだそうです。\n\nその日のノートには、両方のラベルを並べて「探した味」「探してない味」。辛いほうを食べてくれた家族には好評で、「今度はわざと買ってね」と頼まれました。", "ゆず色おつかれ会", "家事の合間に流したい歌と、スーパーで見つけた今日のおやつが話題です🍊 入ってすぐなら「おつかれ〜」だけで十分。洗濯物があと一枚残っていても、好きな曲が来たらそっちを先に聴こ。", [["1K", "夕方おつかれコアおめ", "名前を呼び「片付けはあとで。まず拍手！」とお祝いします。"], ["5K", "夕方の一行メッセージ", "ひと息つくときに読みたくなる短いお礼を、ファミリーに書きます。"], ["10K", "ゆず色の名前入りアイコン", "柑橘と夕焼けの柄に、表示名を入れたアイコンを作ります。"], ["20K", "ひと息の選曲リクエスト", "散歩か家事の休憩かを聞いて、配信でその時間に似合う一曲を紹介します。"], ["30K", "柑橘色の待ち受けセット", "ゆず色かみかん色で、名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなた宛て夕方ニュース", "配信で今月の頑張りを夕方ニュース風に伝えて、名前を呼んでお礼を言います。"], ["48K", "おつかれ特番の主役", "好きな話題で約5分の夕方ニュース風トーク。名前入りアイコンと「本日の家事終了」画像も作ります。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおりますฅ 武将の手紙を集めた本を読むと、立派な挨拶よりも最後にそっと添えられた頼みごとが気になります。特技は、家族への置き手紙を武将風に書くこと。「猫殿におやつは進呈済み。重ねて出されぬよう」。この文なら家族も最後まで読んでくれます。\n\n武将の番組は、勇ましい太鼓が続くのが苦手なので、見始めに音量を下げます。ある夜、武将が大事なことを言いかけた瞬間、猫殿がテレビの前にどっかり。猫殿がどいたので巻き戻したら、同じ場面でまた現れました。三度目の再生では、家族そろって武将のセリフより猫殿の出番を待っていました。\n\nそれ以来、人がテレビの前を横切ると「参戦ですか？」が口をつきます。猫殿には聞くだけ野暮。お出ましのときは、こちらが席を譲るのでござる。", "ねこ殿の書状部屋", "夜更けの評定で持ち寄るのは、武将の書状にあった一言と、家でいちばん偉そうに座る猫の話。歴史に詳しくなくても「うちの猫殿はいちばん大きい箱から動きません」で参戦できます。猫の話に入ると、評定はたいてい延びますฅ", [["1K", "猫殿とコアおめ", "名前を呼び「座布団は猫殿と半分ずつで」とお祝いします。"], ["5K", "猫殿の一行書状", "猫殿の代理として、ひと言のお礼を名前入りでファミリーに書きます。"], ["10K", "肉球花押の名入れアイコン", "肉球で押した花押を描き、表示名を入れたアイコンを作ります。"], ["20K", "猫殿の呼び名リクエスト", "好きな猫のしぐさを聞いて、配信であなたの武将風の二つ名を考えます。"], ["30K", "選べる家紋の記念セット", "好きな色で、名前と二つ名入りアイコン、猫殿の書状画像を作ります。"], ["40K", "猫殿のごほうび評定", "今月のうれしかった話を配信で名前入りで取り上げ、猫殿の代理でお礼を伝えます。"], ["48K", "一城任命のお礼会", "選んだ城名を配信の約5分のお礼企画で発表。名前入りの家紋アイコンと任命状画像も作ります。"]]],
  ["ぜうす_", "ぜうす。呼び捨てで平気です。コーヒーは深煎り。映画館が暗くなり、客席のざわめきがすっと消える瞬間が好きです。半券は捨てず、裏にあとでもう一度観たい場面を一つ書きます。登場人物の気持ちを一つに決めつける解説本は苦手です。「あそこで窓の外を見たのはなぜか」をしばらく考えていたい。\n\n帰りの電車で友人と「あの人、最後に何を考えてたんだろう」と話した日がありました。僕が指していたのは、最後に部屋を出た人物。友人の頭にいたのは、その人を入口で見送った人物でした。降りる駅の手前で名前が出るまで、二人とも同じ人物について話していると思っていました。\n\nそれから、座右の銘は「まず、誰の話か」。次に二人で映画を観た日は、先に登場人物の名前を確認。そこまでして、今度は同じ人物の別々の場面について話していました。やっぱり気づいたのは降りる直前です。", "深煎りの上映後", "深煎りを一杯いれて、映画で引っかかった場面の話を。同じ表情を見ても、「ほっとした顔」に見える人と「何か隠してる顔」に見える人がいます。どこでそう感じたかまで聞きたいです。結末を話す前には、まだ観ていない人がいないか確かめます。", [["1K", "上映後のコアおめ", "名前を呼び「今日もエンドロールまでありがとう」とお祝いします。"], ["5K", "深煎りの一行お礼", "印象に残った感想を一つ添えて、名前入りのお礼をファミリーに書きます。"], ["10K", "映画半券の名前入りアイコン", "映画館の半券とコーヒーの柄に表示名を入れます。"], ["20K", "好みで選ぶ映画一本", "好みのジャンルを聞いて、配信で結末に触れず映画を一作紹介します。"], ["30K", "選べるエンドカードセット", "好きな差し色で、名前入り半券アイコンとエンドカード風スマホ壁紙を作ります。"], ["40K", "お名前入りの編集会議", "あなたが選んだ場面をネタバレを避けて話し、二通りの見方を紹介してお礼を伝えます。"], ["48K", "二重エンドの上映後トーク", "好きなお題で約5分の映画風トークとお礼。名前入りアイコンと二つの題名つきタイトル画像も作ります。"]]],
  ["りさっち＊", "りさっちです☺️ カフェめぐりが趣味。いつものホットコーヒーでも、カップでお店の雰囲気が伝わってきます。器が気になったら、飲み干してから底の印まで見るのがこだわり。飲む前に毎回写真を撮るのは苦手で、友だちと始めたカフェ記録は三日で終了。三日目に撮れたのはレシートだけでした。\n\n好きなドラマの最終回を観る前は、推しがいい結末を迎えられるように、いつもの店でいつもの一杯を飲んで縁起を担ぎます。ある日、最終回を観る前に、いつもの店で友だちとドラマの話をしました。推しが同じだと喜んだ直後、「でも同僚だったら困るよね」と言われました。「私なら味方するな」と答えましたが、友だちと問題のシーンを一つずつ振り返っていたら、コーヒーはすっかり冷めていました。\n\n最終回が終わっても、推しは二人とも変わりません。もしあの人が本当に同じ職場に来たら、私は隣の席だけは避けるかも。", "いつものカフェ席", "ドラマの感想と、最近気になるリップの色を話すカフェ席です☺️ 「推しにはこの色が似合いそう」なんて、二つの話が混ざることも。ドラマの話に乗れない日は、今使っているカップの柄の話からでも。", [["1K", "カフェ席のコアおめ", "名前を呼んで「いつもの席、空けときました」とお祝いします。"], ["5K", "カップに一言メッセージ", "その日の気分に合うお礼を、名前つきでファミリーに書きます。"], ["10K", "名前入りカフェカップアイコン", "カップに注文シール風の表示名を入れたアイコンを作ります。"], ["20K", "カフェの話題リクエスト", "ドラマかリップのお題を選んでもらい、配信であなたの好みを聞きながら話します。"], ["30K", "好きな色の限定カップセット", "好きなリップの色を差し色に、名前入りアイコンとカップ柄の待ち受けを作ります。"], ["40K", "あなたの一杯とお礼トーク", "好みから架空のドリンクを考え、配信で名前を呼んで紹介し、お礼を伝えます。"], ["48K", "カフェの主役コーナー", "好きな話題で約5分のカフェ風トークとお礼。名前入りアイコンと限定メニュー画像も作ります。"]]],
  ["ちょぱ丸_", "コンビニは往復10分、寄り道込みなら30分。ちょぱ丸です。たまに友だちと卓球をします。相手がラケットを振るところに気を取られて、肝心の球を見送ることがあります。\n\n友だちと、前に見つけた商店街の店へ。前に来た日は赤いのれんの脇に猫がいました。今度もその猫を探していたら、店の前を通り過ぎました。地図を見て引き返し、買い物を済ませて外に出たら、探していた猫が店先に。「ピンポーン。目印が、ただいま出勤しました」と案内係の声で言ったら、友だちは「赤いのれんは開店から仕事してたけどね」。次の卓球では、ラケットより球を見ます。\n\nアニメの劇伴が好きで、誰かが振り向くところで低い音が鳴ると、あとでその場面をすっと思い出せます。酸っぱい粉をまぶしたグミは苦手です。粉を砂糖だと思ってかじった一粒は、テレビの効果音なしでも忘れられません。", "寄り道アニメ部", "「あの音がしてから振り向いたよね」みたいな、アニメの細かい発見を拾う部です。推しが多い人は「今日の一人」から。いつの間にか商店街のおやつの話に飛んでいたら、その寄り道も本編です。", [["1K", "寄り道コアおめ", "名前を呼んで「ピンポーン、寄り道先でお迎えです」とお祝いします。"], ["5K", "猫は不定休メッセージ", "あなた宛てのお礼を、「目印の猫は不定休」の注釈つきでファミリーに書きます。"], ["10K", "のれんの名前入り待ち受け", "赤いのれんと猫を描いた、表示名入りのスマホ壁紙を作ります。"], ["20K", "推しの見どころリクエスト", "作品名を聞いて、配信でお気に入りの場面や小さな工夫を一つ話します。"], ["30K", "寄り道番組表の画像セット", "好きな色で、名前入りアイコンと、寄り道番組表風カードを作ります。"], ["40K", "あなたのアニメ外伝トーク", "推し作品か町のおやつのお題で配信中に話し、名前を呼んで今月のお礼を伝えます。"], ["48K", "寄り道特番の主役", "好きなお題で約5分のアニメ風雑談とお礼。名前入りアイコンと寄り道マップ画像も作ります。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 ゲームでは地図の空白が気になります。未確認の扉が一つあれば、来た道を引き返すのも楽しみのうち。回復薬は決戦まで温存いたします。\n\n急かされるのは少々苦手です。同行者の「そろそろ決戦へ」で近道を選んだ日には、同じ崖から二度落ちました。さすがに三度目は手前で停止。すぐ脇に橋がございました。急いで選んだ近道のほうが、二分で終わったボス戦よりよほど長く感じました。結局、回復薬は一つも減りませんでした。\n\n得意なのは、ふつうの注意書きをラスボスの口上に変えること。低い声で「足元をご確認くださいませ」と言うだけで、細い橋もたちまち決戦の舞台になります。この注意書きには、同じ崖から二度落ちた者の実感がこもっております。", "決戦前の休憩室", "攻略の手を休めて、ボス戦の効果音や、どうしても進めなかった場面を話す部屋でございます。難所はゲームでも、開かないジャムのふたでも構いません。私が考え込んだら、先にお茶をどうぞ。", [["1K", "ご来城のコアおめ", "名前を呼び「本日もご来城ありがとうございます」とお祝いします。"], ["5K", "ラスボスから一行のお礼", "丁寧すぎるお礼を表示名つきで、ファミリーに残します。"], ["10K", "名前入り勇者アイコン", "紋章と橋を描いた、表示名入りアイコンを作ります。"], ["20K", "勇者の称号リクエスト", "最近できたことを聞いて、配信でラスボスから称号を一つお渡しします。"], ["30K", "選べる王国の画像セット", "好きな紋章色で、名前入りアイコンと称号入り達成証画像を作ります。"], ["40K", "決戦前のお礼寸劇", "あなたが選ぶ勇者の決めゼリフを使い、配信で短い一人二役とお礼を届けます。"], ["48K", "あなたの王国の授与式", "好きなお題で約5分のゲーム風トークと称号発表。名前入りアイコンと感謝状画像も作ります。"]]],
  ["simba_", "シンバです。休日は目的地を一つだけ決めて車を出します。静かな曲をかけて、景色がいいところで休憩。運転中はにぎやかなビッグバンドの曲が少し苦手です。休憩のおともは、大好きなたまごサンド。\n\n海へ行った日、友だちと空いているベンチに座ると、目の前は駐車場。海は背もたれの向こうでした。席を移ろうとしたら、友だちが「ほら、車が見守ってくれてる」。結局そのまま食べきって、海の写真とは別に、ベンチから見える愛車も一枚。帰って見返すと、友だちの声までよみがえるのは愛車の写真のほうでした。\n\n座右の銘は「いい休憩も旅のうち」。動物園では水槽の前で少しかがんで、ペンギンが水の中をすっと横切る姿を待ちます。次の場所に着く予定時刻は、だいたいここでずれます。", "停車中の見晴らし席", "車を降りて初めて見えた景色や、動物園の水槽の前で予定より長居した話を持ち寄る席です。遠出をしない日なら、いつもの道でふと目が留まる景色を一つ。休憩のおともは、たいていたまごサンドです。", [["1K", "休憩席のコアおめ", "名前を呼び「景色がいいので、ここで拍手」とお祝いします。"], ["5K", "車窓の一行お礼", "今月のやり取りを一つ添え、ファミリーに名前入りの便りを書きます。"], ["10K", "見晴らしの名前入りアイコン", "ペンギンや海辺をモチーフに、表示名入りアイコンを作ります。"], ["20K", "寄り道選びリクエスト", "好きな景色を聞いて、配信で立ち寄ってみたい場所を一つ紹介します。"], ["30K", "選べる風景画像セット", "海か動物園をモチーフに、名前入りアイコンとスマホ壁紙を作ります。"], ["40K", "あなたとの休憩トーク", "あなたが選んだ景色で配信中にドライブの話をして、名前を呼んでお礼を伝えます。"], ["48K", "見晴らし特番の主役", "好きな寄り道をお題に約5分のトークとお礼。名前入りアイコンと風景カード画像も作ります。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白くてまぶしい照明が苦手で、夜は机の手元だけを照らしています。バタートーストが好きなのに、配信に聞き入ると、焼きたての一枚もだいたい冷めます。\n\n昔遊んだゲームを開きました。最後の城の手前で終えたつもりが、読み込んだデータでは最初の村でした。村の曲を聴いたとたん、ランドセルを机の脇に置いて、夕飯まで遊んでいた頃の部屋を思い出しました。その晩は村を一周して、そこでセーブ。「好きな場所なら、戻ったぶんも進んだうち」。それが座右の銘です。\n\nゲームの曲を集めるときは、曲名と流れる場所をセットでメモします。あの夜のメモは「最初の村。主人公の家を出てすぐ」。肝心の曲名を調べたのは三晩目。それまでは村を一周して、曲がひと巡りしたらゲームを閉じていました。", "夜更けのセーブ地点", "夜更けに手を動かしながら、ゲームの曲や、セーブしておきたくなる風景を話します。「雨がやまない村」「宿屋の明かり」みたいな景色だけでも。作業中なら、一区切りつくまで耳だけ参加で。", [["1K", "夜更けのコアセーブ", "名前を呼び「今日のコア、保存しました」とお祝いします。"], ["5K", "セーブ地点の一行お礼", "印象に残った作業やゲームの話を一つ添えて、ファミリーにお礼を書きます。"], ["10K", "表示名入りセーブアイコン", "セーブスロット風のデザインに表示名を入れたアイコンを作ります。"], ["20K", "作業BGMリクエスト", "好きなゲームの風景を聞いて、配信で作業の合間に聴きたいゲーム曲を一つ紹介します。"], ["30K", "選べるセーブ地点セット", "夜の港か雨の村を選んで、名前入りアイコンとゲーム風壁紙を作ります。"], ["40K", "あなたのゲーム散歩", "好きなゲームの風景を二つ聞いて、配信でその話と今月のお礼を名前入りで届けます。"], ["48K", "夜更けの最終セーブ会", "好きな風景で約5分のゲーム雑談とお礼。名前入りアイコンと、風景を選べるセーブカード画像も作ります。"]]],
  ["まさむね_", "休日は城下町の脇道へ。まさむねです。行きの電車では三味線の器楽曲をよく聴きます。人混みを急いで抜けるのが苦手なので、説明板の前でのんびり足を止められる道が好きです。今の目標は、旅先で地元の方にその町の思い出を一つ聞くこと。\n\n城跡の急坂で説明板を読んでいたら、近所の方が「子どもの頃、ここをよく滑って下りましたよ」と教えてくれました。思わず「どこで止まったんですか」と聞くと、「止まれないから下まで行くんです」と笑っていました。帰りは私もその坂へ。もちろん一歩ずつ下りました。\n\n野球観戦も好きです。球場からの帰り道で思い出すのは、得点の直前に静まる客席や、隣の人が思わず上げた声。あの坂の写真にも、説明板の解説よりあの方の「下まで行くんです」を添えたくなります。土地の話は、歩く速さで拾うのが性に合っています。", "城下町の寄り道帳", "城下町の脇道でも、球場へ向かう近道でも、歩いていて足を止めた場所の話を集める帳面です。地名はうろ覚えでも「コロッケの匂いがした角」で十分です。", [["1K", "城下町のコアおめ", "名前を呼び「ご城下へようこそ」とお祝いします。"], ["5K", "城下町の一行史跡札", "今月印象に残った一言を紹介し、名前入りのお礼をファミリーに書きます。"], ["10K", "城下町の名前入りアイコン", "門と町並みを描き、表示名を入れたアイコンを作ります。"], ["20K", "曲がり角リクエスト", "あなたが好きな街の風景を聞いて、配信で歩いてみたい寄り道の話を一つします。"], ["30K", "選べる町並みセット", "路地か球場への道を柄に、名前入りアイコンと寄り道帳風のカード画像を作ります。"], ["40K", "あなた宛て城下町案内", "好きな寄り道を二つ聞いて、配信で街歩きの案内風に話し、お礼を伝えます。"], ["48K", "城下町紀行の主役", "お題を選べる約5分の街歩きトーク。名前入りアイコンと架空の名物看板を描いたカード画像も作ります。"]]],
  ["路面ベル♪", "まもなく、商店街のパン屋さんの前です。ベルと呼んでください♪ 旅で降りた電停と、車窓から見つけたお店をノートに残しています。低音の強いダンス曲は少し苦手。電停ではイヤホンを外して、ベルや街の音を聞くのが好きです。\n\n梅雨の楽しみは、電停のそばの軒先であじさいを見ること。ある雨の日、傘を忘れて、電停で花を眺めていたら、隣の方が傘をこちらへ少し傾けてくれました。「もうすぐ来ますね」と話し、同じ電車に。私が先に降りると、その方は窓越しに小さく会釈。ノートの電停名の隣に「傘を半分」と書きました。その一行を見ると、花の色より先に、窓越しの会釈が浮かびます。\n\n口癖は「続きは次回」。寄り道先のパン屋でお目当てが売り切れたら、声に出してからノートにも同じ言葉を書きます。未完の旅は、今のところパン屋に偏っています。", "ベル待ちの電停", "路面電車の窓から見えた看板や、つい降りたくなる電停の話をする待合席です♪ まだ乗ったことがなくても、どんなお店が見えたら途中で降りたくなるか、ベルが鳴るまで想像しましょう。", [["1K", "ベルひと鳴らしコアおめ", "名前を呼んで「ご乗車ありがとうございます」とお祝いします。"], ["5K", "寄り道きっぷのお礼", "あなたの名前を添え、寄り道先を一つ書いたお礼をファミリーに載せます。"], ["10K", "名前入り電停アイコン", "路面電車と電停の看板を描いた、表示名入りアイコンを作ります。"], ["20K", "気になる電停リクエスト", "好きな風景を聞いて、配信で寄ってみたい実在の電停を一つ紹介します。"], ["30K", "選べる一日乗車券セット", "電車の色を選べる、名前入りアイコンと、架空の一日乗車券画像を作ります。"], ["40K", "お名前入り車内放送", "あなたの好きな景色を使って、配信で車内放送風のお祝いとお礼を伝えます。"], ["48K", "架空路線の主役便", "選んだ車窓の景色と電停名で、約5分の車内放送風トーク。名前入りアイコンと、あなたが考えた電停を載せた路線図画像を作ります。"]]],
  ["ねずち。", "すみっこ、空いてますか。ねずちです🐭 背中を壁につけられる席だと落ち着きます。おやつはチーズ。似た袋を手に取って苦手なわさび味を引いた日には、水のありがたみを知りました。ボウリングでは、ストライクより端に残った一本を倒せたときが嬉しいです。\n\n配信で「寝る前についゲームする」に「今のわかる」と返しました。ところが、とっくに「実家でヤギを飼ってた」という話に。「ヤギって何を食べるんですか？」とこちらに話が振られ、反射的に「家族に確認します」。送ってから「すみません、うちにいるのは金魚だけです」と慌てて訂正しました。ゲームの話にうなずいたはずが、その晩はうちの金魚が話の主役でした。\n\n廊下なら、足音だけで家族の誰が歩いているか分かります。話題が変わるときも同じように知らせてくれたら便利なのに。打っている途中でまた話が先へ行ったら、たぶん端の席でチーズをかじっています。", "すみっこチーズ席", "壁ぎわに一席、空いてます🐭 アニメの好きな場面や、ゲームで道に迷った話がよく出ます。少し前の話にも「さっきの話だけど」で戻れます。チーズをひとかけ食べるくらいの間なら、もとの話を覚えています。", [["1K", "すみっこのコアおめ", "名前を呼び、チーズ一かけぶんの小さな拍手でお祝いします。"], ["5K", "壁ぎわの一行席札", "表示名と「チーズ持ち込み可」を添えて、ファミリーにお礼を書きます。"], ["10K", "チーズの名前入りアイコン", "チーズと小さなねずみの柄に表示名を入れたアイコンを作ります。"], ["20K", "すみっこの話題リクエスト", "アニメかゲームのお題を一つ選んでもらい、配信でゆっくり話します。"], ["30K", "選べるすみっこ画像セット", "チーズの色を選んで、名前入りアイコンと席札風の壁紙を作ります。"], ["40K", "チーズ通信のお礼ニュース", "最近うれしかったことを聞き、配信で名前つきの短いニュースとしてお祝いします。"], ["48K", "すみっこニュースの主役", "好きなお題で約5分のゆるい報道風トークとお礼。名前入りアイコンと新聞風カード画像も作ります。"]]],
  ["いなりまる。", "晩ごはんを食べながら、明日の献立を考えてます。「いなり」でどうぞ。好きな本は料理エッセイ。何を食べたかより、誰と、どんな日に食べたかが心に残ります。脱出ゲームは、ヒントを読み込むうちに何を探していたか忘れるので苦手です。\n\n食後の決まりは、冷蔵庫を開けて先に使いたい食材を一つメモすること。座右の銘は「迷ったら、まずだし」。それでも献立が決まらなければ、だしのきいたうどんに、おいなりさんを添えます。\n\nある日、お弁当でおいなりさんが一つだけ裏返っていたので、何かの目印かと思って先にひと口。中には苦手な梅干しが丸ごと入っていました。帰って家族に聞くと「当たりを入れたんだよ」と得意顔。私が梅干しを苦手なのは、忘れていたそうです。それから、裏返ったおいなりさんは最後まで保留。お弁当の謎解きだけは、すっかり得意になりました。", "いなりと明日の献立", "今日の晩ごはんを入口に、明日の献立を考える席です。「ねぎが少し余ったよ」から、一緒にあと一品を。レシピの話がいつの間にか「それ、誰と食べた？」に変わることも。その寄り道も好きです。", [["1K", "おいなりコアおめ", "名前を呼んで「おいなり一つ追加です」とお祝いします。"], ["5K", "献立メモのお礼", "今月話したごはんの話を思い出しながら、名前入りのお礼をファミリーに書きます。"], ["10K", "おいなり柄の名入れアイコン", "おいなりさんと湯気の絵に表示名を入れたアイコンを作ります。"], ["20K", "冷蔵庫の一品リクエスト", "余っている食材を一つ聞いて、配信で合いそうな副菜を提案します。"], ["30K", "選べる献立カードセット", "うどんかおいなり柄の名前入りアイコンと、ひと言入りの献立カード画像を作ります。"], ["40K", "あなたの冷蔵庫お礼相談", "家にある食材を二つ聞き、配信で一食分の組み合わせを考えながらお礼を伝えます。"], ["48K", "台所特番の主役", "好きな料理のお題で約5分の献立相談とお礼。名前入りアイコンと、提案をまとめた献立画像も作ります。"]]],
  ["はんこびより。", "はんこです。夜の雑談を聴きながら、ノートの余白に日付のはんこを一つ押します。曲名と、誰かが笑いながら口にした一言。そのまま書くと、ページを開いたときに声まで思い出せるのが好きです。\n\n解答欄が小さいワークブックは苦手で、自分のノートに続きを書きます。ある日、書き足そうとページを開いたら、余白に母の字で「牛乳買う」。買い物メモが見当たらず、机の端に開いていた私のノートを借りたそうです。その日の買い物では、私が忘れずに牛乳を買って帰りました。何の問題を解いたかはもう覚えていないのに、このページだけはすぐ開けます。\n\n一発ギャグは「私、押しは強いです。はんこ限定で。ポン！」。返事が遅れたら、たいてい余白に何か書き足している途中です。「またメモ？」と聞かれると、そのツッコミも残したくなります。", "夜のひとことノート", "話しそびれた感想や、今日できた小さなことを夜のノートに書いていくファミリーです。聴くだけの日は、笑ったところを一つ覚えて帰るだけでも。「さっきの一言、残したい」と言ってくれたら、ノートに書いて今日の日付印を押します。", [["1K", "はんこでコアおめ", "名前を呼んで「今日の一ページに、ぽん」とお祝いします。"], ["5K", "できたことに一行はんこ", "あなたが今日できたことを一つ聞き、お祝いの一行をファミリーに書きます。"], ["10K", "名前入り日付印アイコン", "日付印のスタンプ風デザインに、表示名を入れたアイコンを作ります。"], ["20K", "残したい一言リクエスト", "書き留めたい言葉を教えてもらい、配信で名前を添えて読み上げます。"], ["30K", "選べるノートの画像セット", "好きなインク色で、名前入りアイコンと、一言入りのノート風壁紙を作ります。"], ["40K", "お名前入りのノート朗読", "今月のあなたとの会話から、心に残った場面とお礼を配信で読みます。"], ["48K", "記念ノートの振り返り会", "残したい一言を選んでもらい、配信で約5分の振り返りとお礼。名前入りアイコンと、その一言を日付印と一緒に載せたノート画像も作ります。牛乳メモ用の余白つきです。"]]]

const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブで変更されています。入力内容を控えてから、ページを開き直してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '保存できませんでした。ブラウザーの保存設定を確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {buttonText = label + 'をコピー', copyText} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しやメニューからコピーしてください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => field.remove(), {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

function buildCorePerkTable(name, perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    perk.tabIndex = -1;
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, {buttonText:'コピー'}));
  }
  return table;
}

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = '紹介文';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(name, perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  actions.append(
    copyButton('ファミリー名', name, nameValue),
    copyButton('紹介文', name, description, {copyText})
  );

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
</html>
