<title>ポコチャ プロフィール・ファミリー文例集</title>
<style>
* {box-sizing:border-box}
body {margin:auto;max-width:620px;padding:16px 12px;background:#111421;color:#f8f7ff;font:16px system-ui}
h1 {font-size:23px;margin:0 0 8px}
.note {font-size:14px;color:#ddd8ee;margin:0 0 12px}
ol {padding:0;list-style:none}
li {padding:12px;margin-bottom:12px;background:#22263a;border-radius:12px}
h2 {font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button {min-height:48px;border:0;border-radius:9px;background:#e2daff;color:#241439;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible {outline:2px solid #fff;outline-offset:2px}
summary {min-height:48px;display:flex;align-items:center;cursor:pointer;color:#ddd8ee}
summary::before {content:"▸";margin-right:8px}
details[open] summary::before {content:"▾"}
.profile,.family-value {white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:4px;margin:0}
.family {border-top:1px solid #555970;margin-bottom:8px}
.family-fields {margin:0 0 8px}
.family-fields dt {font-size:14px;color:#ddd8ee;margin:4px 0 0}
.family-fields dd {padding-inline:0}
.family-intro {margin:0}
.family .actions {margin-bottom:8px}
.family .actions button {padding:8px;overflow-wrap:anywhere}
.family-copy-field {display:block;width:100%;min-height:120px;margin:8px 0;padding:8px;font:16px system-ui}
.core-perks {width:100%;table-layout:fixed;border-collapse:collapse;margin:12px 0 0}
.core-perks caption {text-align:left;font-weight:bold;margin-bottom:4px}
.core-perks tr {border-top:1px solid #555970}
.core-perks th,.core-perks td {padding:8px 4px;vertical-align:top}
.core-perks th {width:40px;text-align:left;font-size:14px;color:#e2daff}
.perk-controls {width:56px}
.perk-controls button {width:48px;padding:0;font-size:13px}
.perk-text {white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;margin:0}
.edit-button {width:100%;background:#373c53;color:#fff}
#edit-dialog label {display:block;margin:12px 0 4px;font-weight:bold}
#edit-dialog input,#edit-dialog textarea {width:100%;min-height:48px;padding:10px;border:1px solid #a9a1bc;border-radius:8px;font:16px system-ui;color:#171326;background:#fff}
#edit-dialog textarea {height:clamp(96px,30dvh,260px);resize:vertical}
#edit-error {color:#ffd0d0;margin:8px 0}
.copy-status {margin:8px 0 0;color:#c4f5ce;font-size:14px;overflow-wrap:anywhere}
.copy-status:empty,#edit-error:empty {margin:0}
@media (max-width:360px) {body {padding:12px 10px} h1 {font-size:21px} .card-header {gap:10px}}
.card-header {display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-header h2 {margin:0;min-width:0}
.icon-button {width:64px;height:64px;flex:none;display:block;padding:0;background:#373c53;overflow:hidden}
.icon-button img {display:block;width:100%;height:100%}
dialog {width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px;border:1px solid #88819b;border-radius:12px;background:#22263a;color:#f8f7ff}
dialog::backdrop {background:#000b}
dialog img {display:block;width:100%;max-height:56vh;object-fit:contain}
.dialog-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dialog-actions a {display:grid;place-items:center;min-height:48px;border-radius:9px;background:#e2daff;color:#241439;font-weight:bold}
</style>
<h1>ポコチャ プロフィール・ファミリー文例集</h1>
<p class="note">架空の40人のプロフィール・ファミリー紹介・コア特典の文例です。気に入った項目をコピーできます。アイコンを押すと拡大します。</p>
<p class="note">プロフィールの名前と本文は編集できます。編集内容はこのブラウザーに保存され、次回も表示されます。表示する文字数には空白と改行も含みます。</p>
<ol id="names"></ol>
<dialog id="icon-dialog" aria-labelledby="icon-title">
  <h2 id="icon-title"></h2>
  <img id="icon-preview" alt="">
  <p class="note">iPhoneでは画像を長押しし、写真に保存する項目が表示されたら選んでください。</p>
  <div class="dialog-actions">
    <a id="icon-download" href="./icons/01.png">PNGを保存</a>
    <button id="icon-close" type="button">閉じる</button>
  </div>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <h2 id="edit-title">プロフィールを編集</h2>
  <form id="edit-form">
    <label for="edit-name">名前</label>
    <input id="edit-name" required autocomplete="off">
    <label for="edit-profile">プロフィール本文</label>
    <textarea id="edit-profile"></textarea>
    <p id="edit-error" role="alert"></p>
    <div class="dialog-actions">
      <button id="edit-cancel" type="button">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>
<script>
const entries = [
  ["rui_03", "帰りの電車では、片耳で歌枠、もう片耳で車内放送。るいです。平成のJ-POPならサビはすぐ口ずさめるのに、曲名を思い出す頃にはもう二曲先。歌詞が早口の曲は、帰ってからゆっくり聴き直します。\n\n休みの日は、枠で教えてもらった曲を聴きながらひと駅ぶん歩きます。「二番のサビ前でベース聴いて」と言われると、知ってる曲でも聴こえ方が変わるから面白い。\n\nこの前は終電でエアギターを弾く人を見かけて、何の曲か考えているうちに降りる駅へ。ホームに流れた発車メロディーに「これ昔めっちゃ聴いた」。そっちの曲名も知らないんですけどね。", "片耳プレイリスト", "帰り道に聴きたい曲を、一人一曲ずつ持ち寄るファミリーです。「発車してすぐ」「降りるひと駅前」みたいに、ぴったりのタイミングまで教えてもらえたら、次の帰り道で試します。", [["1K", "車掌風のお祝い", "配信で名前を呼び、「今日もおつかれさま」と車掌風にお祝いします。"], ["5K", "帰り道のひと言", "今夜の帰り道に添えたいひと言を、名前入りでファミリーに投稿します。"], ["10K", "名前入りきっぷアイコン", "表示名を入れた乗車券風のアイコン画像をお渡しします。"], ["20K", "帰り道の選曲リクエスト", "今の気分に合わせて一曲選び、配信で聴きどころも紹介します。"], ["30K", "配色が選べる終電セット", "好きな色で、名前入りのきっぷアイコンとスマホ用の壁紙を作ります。"], ["40K", "お名前入りの車内放送", "今月の思い出とあなたに聴いてほしい二曲を、名前を添えて車内放送風に紹介します。"], ["48K", "帰り道ラジオの主役", "お好きな曲調で、約5分のDJ風お礼コーナーを。名前入りのきっぷアイコンと番組表画像もお渡しします。"]]],
  ["初見じょうれん。", "「初見です！」「昨日いたよね？」までが挨拶。じょーれんって呼んでね。昔のJ-POPはうろ覚えのサビでも歌います。パクチーは香りで分かるので、そっとお皿の端へ。\n\n週末は友だちとバドミントン。ダブルスで二人同時に「任せた！」と言って、真ん中に落ちるシャトルを見送ったことも。次は迷ったら「取るよ」です。\n\n枠で「初見さん、こんばんは！」と迎えたら「昨日あんたと一時間しゃべったよ」。次の日は向こうから「はじめまして」。僕もやっと「昨日ぶりですね」と返せました。コートでもこれくらい返したい。", "また来た初見席", "「初見です」も「昨日ぶりです」も、ここではいい挨拶。雑談の途中に来たら「今、なんの話？」と声をかけてね。会長がじゃんけんで決まった話なら、何度でも初めてみたいに話せます。", [["1K", "昨日ぶりのお祝い", "配信で名前を呼び、「初見さん、今日もありがとう！」とお迎えします。"], ["5K", "おかえりメッセージ", "印象に残ったやり取りを一つ添え、名前入りのお礼をファミリーに書きます。"], ["10K", "自称初見の名札アイコン", "「初見・認定○回目」の肩書きと表示名が入った、名札風のアイコン画像です。"], ["20K", "肩書きのお披露目", "「初見のベテラン」などの候補から肩書きを選んでもらい、配信で発表します。"], ["30K", "来店認定カードとアイコン", "選んだ肩書きと表示名を入れた直筆風カードと、色違いのアイコンをファミリーに載せます。"], ["40K", "いつもの席のお礼トーク", "今月のコメントや助けてもらった場面を、配信で名前を呼んで振り返ります。"], ["48K", "歓迎総会の主役", "選んだ話題で約5分の雑談とお礼を。名前入りの会長名札アイコンと認定カード画像も作ります。"]]],
  ["あずき＊", "あずきです🍡 和菓子屋さんでは、粒あんのおまんじゅうと包み紙の柄をチェック。気に入った紙は伸ばして缶にしまいます。冬はフィギュアスケートを観て、ジャンプの着氷まで息を止めがち。自分が走る長距離は、タイムを測られると落ち着きません。\n\n祖母におまんじゅうを二つもらって、一つ差し出したら「それは明日のあんたの分よ」。包みの端には小さく「明日」。今も二日に分けるつもりで買いますが、初日に箱を二度開けたら「味見の続き」です。自分で「明日」と書いても、祖母ほど効きません。", "粒あんと夜のお茶", "夜のお茶とおやつを用意して、歌と雑談を楽しみましょう🍡 粒あんのおすすめも、「包み紙がかわいくて買った」という話も聞きたいです。お茶をいれ直しに立ったら、戻ったところからどうぞ。", [["1K", "湯のみでお祝い", "配信で名前を呼び、「お茶、あなたの分もいれました」とお祝いします。"], ["5K", "明日の包み紙メッセージ", "明日読み返すとちょっとうれしくなるお礼を、名前を添えてファミリーに投稿します。"], ["10K", "和菓子の包み紙アイコン", "小豆色の包み紙をイメージした、表示名入りのアイコン画像です。"], ["20K", "おやつ選びリクエスト", "あんこ派かきなこ派かを聞いて、配信で和菓子とお茶の組み合わせを一つ紹介します。"], ["30K", "甘味のおそろい画像", "選んだ和菓子の柄で、名前入りアイコンとスマホ用の壁紙を作ります。"], ["40K", "あなたのお茶会トーク", "あなたに似合いそうな和菓子を一つ選び、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "あずきの甘味お礼会", "好きなおやつをお題に約5分のお茶会トークを。名前入りアイコンと、ひと言を添えた甘味カード画像も作ります。"]]],
  ["おちゃまる🍵", "お湯が沸いたらこんばんは。おちゃでも、まるでもどうぞ🍵 ほうじ茶に焼き芋を合わせるのが好きです。きれいに並べて撮るのは苦手で、カメラを出す頃には一杯減ってます。\n\n茶葉を二種類用意して飲み比べをした日、友人は二杯目に「香りが上品」。僕は同じ急須から二回注いでました。今度こそ別の茶葉を出したら「焼き芋の香りがする」。それは今、僕が割った焼き芋です。\n\n次は急須に印をつけます。枠で返事が途切れたときは、だいたい洗い物の泡を流してるところです。", "ほうじ茶の間", "ほうじ茶の香りや、一緒に食べたお菓子の話をする席です🍵 ひと口目と冷めてから、どちらが好きでした？ お茶は何でも。今日は聞くだけの人にも、湯のみを一つ。", [["1K", "ほうじ茶の間のお祝い", "「湯のみ、置いときました」と名前を呼び、配信でコア達成をお祝いします。"], ["5K", "お茶うけの一言", "今のあなたに添えたいひと言を、名前入りのお礼にしてファミリーに書きます。"], ["10K", "ほうじ茶ラベルアイコン", "茶葉のラベルをイメージした、表示名入りのアイコンをお渡しします。"], ["20K", "お茶うけリクエスト", "好きなお菓子に合いそうなお茶を選び、その理由も配信でお話しします。"], ["30K", "選べる茶席画像セット", "茶色と生成りから選んだ色で、名前入りアイコンと湯のみ柄の壁紙を作ります。"], ["40K", "ほうじ茶のいれ方とお礼", "おすすめのいれ方を一つ紹介し、配信で名前を呼んで今月のお礼を伝えます。"], ["48K", "あなたのお茶会コーナー", "好きなお茶を聞いて約5分の飲み比べトークを。お礼に、名前入りアイコンと茶席カード画像をお渡しします。"]]],
  ["ぼると⚡", "九回裏、二アウト。まだランナーおる。そこで立ち上がる、ぼるとです⚡ 野球選手の自伝は、逆転打のあとより打席に入る前のページが気になります。ジョギングは三分で歩き始めます。ペース配分は研究中。\n\n中継の前にはお茶をいれて、スマホの速報をオフ。ある日、隣の部屋から大声がして「結果言うな！」「足つっただけ！」。数秒遅れの中継で僕が叫んだら「ああ、それはもう見た」。\n\n試合後は隣の部屋へヒーローインタビュー。「あの場面でひと言どうぞ」「足の指がつりました」。あれ以来、うちの速報には試合以外も入ります。", "九回裏の応援席", "逆転打の前に粘って出塁した選手まで振り返る応援席です⚡ 野球を観ていない日は、今日の自分の好プレーを一つ。途中から来た人の「今何回？」にもお答えします。", [["1K", "応援席からナイスコア", "配信で名前を呼んで「ナイスコア！」。球場の応援席気分で拍手します。"], ["5K", "今月の好プレー便り", "助けてもらったことや場を盛り上げた一言を「今月の好プレー」として、名前を添えてファミリーに投稿します。"], ["10K", "背番号入り選手アイコン", "名前と選んだ背番号が入る、選手カード風のアイコン画像です。"], ["20K", "あなたの一打を実況", "最近のうれしかった出来事を一つ、配信で逆転打のように実況します。"], ["30K", "チームカラーの応援セット", "好きな色で、名前と背番号入りのアイコンとスマホ用の壁紙を作ります。"], ["40K", "九回裏のお礼インタビュー", "今月の好プレーを振り返ってお礼を伝え、配信であなたからの質問に一つ答えます。"], ["48K", "ヒーロー特番の主役", "お好きな話題で約5分の野球風お祝いトークを。名前入り選手アイコンとヒーローカード画像もお渡しします。"]]],
  ["たっぷりん🍮", "ぷりんです🍮 固めのプリンと苦めのカラメルが好き。昭和歌謡が流れると、洗濯物をたたむ手が止まります。手順の長いレシピは途中でくじけるので、新作のおやつは買って楽しむ派です。\n\nプリンを食べていた晩に探してた曲が流れて以来、大事な日の前は冷蔵庫に一個。「カラメルは最後まで」と言いつつ、三口目には全部混ぜてます。\n\n一度、隠した場所を忘れたら、家族が野菜室からプリンを発掘。その奥には別の家族のシュークリームまで。「ここ、高級デザート売り場？」。今も野菜室は、まず奥からのぞきます。", "固めプリン同好会", "固め派もとろとろ派も、同じテーブルへ🍮 カラメルは何口目で混ぜますか？ プリン以外のおやつ報告も大歓迎。昭和歌謡が流れたら、おやつ談義は一曲ぶん休憩です。", [["1K", "スプーンを掲げてお祝い", "配信で名前を呼び、プリンのスプーンを掲げてコア達成をお祝いします。"], ["5K", "カラメルを添えたお礼", "「カラメルは最後まで」など、ぷりんらしいひと言を添えてファミリーにお礼を書きます。"], ["10K", "名前入りプリンアイコン", "プリンのラベルに表示名を入れたデザインのアイコンを作ります。"], ["20K", "おやつトークのリクエスト", "好きなプリンか、懐メロの思い出を一つ聞いて、配信の話題にします。"], ["30K", "カラメル色の画像セット", "固め派かとろとろ派かを選べる、名前入りアイコンとおやつ柄の壁紙です。"], ["40K", "プリン部のお礼放送", "選んでもらったおやつについて配信で話し、名前を呼んで今月のお礼を伝えます。"], ["48K", "新作プリンお祝い回", "選んだ味から新作プリンを考える約5分の雑談とお礼。名前入りラベルアイコンと直筆風のコメント画像も作ります。"]]],
  ["mira☾", "mira（ミラ）です。眠る前は、指が弦をすべる音まで聞こえる弾き語りを。早押しクイズは、答えが浮かぶ頃にはたいてい次の問題です。\n\n映画の日には月柄のハンカチを持っていきます。帰ったら、覚えている音を一つメモ。廊下の靴音だけで、役者の背中まで浮かぶことがあります。\n\n題名の分からない挿入曲を鼻歌で友人に送ったら「途中から別の曲になってる」。翌日、二曲とも教えてくれました。今も続けて聴くと、どうやってつないだのか自分でも不思議です。", "余韻のひと席", "夜の弾き語りと、映画を観たあとも残っている音の話。結末は伏せて、靴音や台詞の間など、気になったところから聞かせてください。話す気分じゃない夜も、一曲ぶんだけ座っていきませんか。", [["1K", "月の席からお祝い", "配信で名前を呼び、「今夜もこの席で、ありがとう」とお祝いします。"], ["5K", "余韻を残す一行", "心に残ったやり取りを一つ添えて、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "月明かりの壁紙", "月と映画館の灯りを描いた、表示名入りのスマホ用壁紙です。"], ["20K", "余韻のお題リクエスト", "好きな映画の音や曲の雰囲気を聞いて、映画を一本か、曲を一曲紹介します。"], ["30K", "夜色のポスターセット", "選んだ夜の色で、名前入りアイコンと映画ポスター風のスマホ用壁紙を作ります。"], ["40K", "眠る前のお礼朗読", "今月の思い出を短い手紙にして、名前を添えて配信でゆっくり読みます。"], ["48K", "今夜の上映後トーク", "あなたのお題で約5分の雑談とお礼の朗読を。名前入りアイコンとポスター画像もお渡しします。"]]],
  ["あてな°", "Ｑ　作戦を立てるのは得意？\nＡ　立てるところまでは。あてなです。\n\n伊沢拓司さんが出る番組は、正解より答えにたどり着くまでが見どころ。先に答えを聞くのは苦手です。謎解きには青いペンを一本。通った道を地図に描くのは得意です。\n\n脱出ゲームで椅子の位置に印をつけ、立ったまま「絶対怪しい」とメモしていたら、係の人に「疲れたら座れますよ」と声をかけられました。地図に追記したのは「座ってよし」。私が「なるほど」を繰り返したら、だいたい地図だけ合ってます。", "仮説だらけの作戦室", "作戦会議は「実際に何を見た？」から。外れた推理も、そう思った理由まで聞くと次の手がかりになるかも。聞く係も歓迎です。答えが浮かんだら、まず「ヒント要る？」と聞いてね。", [["1K", "作戦室からのお祝い", "配信で「新メンバー発見！」と名前を呼び、コア達成をお祝いします。"], ["5K", "作戦メモのお礼", "目に留まったコメントを一つ選んで、ファミリーの作戦メモにお礼と一緒に残します。"], ["10K", "名前入り探偵アイコン", "虫眼鏡と青ペンの絵に表示名を入れた、探偵風のアイコン画像です。"], ["20K", "謎解きのお題リクエスト", "選んでくれた題材で、オリジナルの短いなぞなぞを配信で一問出します。"], ["30K", "選べる探偵セット", "メインカラーを選べる、名前入りのアイコンと探偵証風の画像です。"], ["40K", "あなたのお題で謎解き二問", "選んだ題材で配信中に二問出題します。最後は名前を呼んでお礼を。"], ["48K", "名探偵の出番", "好きなテーマで約5分の謎解きとお礼の時間を。名前入りアイコンと解決記念カード画像も作ります。"]]],
  ["からあげレモン🍋", "からレモです🍋 冷蔵庫を開けても献立が浮かばないと、枠で「今日、何食べた？」。手書きのお品書きに唐揚げがあれば、迷わず注文します。\n\n大皿を囲んだ日、「レモンかけていい？」と聞いたところまでは満点。絞った汁が自分の目に飛びました。洗って戻ると、友人が「めっちゃ酸っぱい」と二個目に手を伸ばしてました。\n\n以来、絞るのは自分の小皿だけ。食卓で掛け声の多い曲が流れると、つられて人の話を聞き逃します。唐揚げがおいしい店の名前だけは、曲のあとでもう一度聞きます。", "ひと絞り食堂", "いらっしゃい、ひと絞り食堂です🍋 商店街の定食や、お弁当で冷めてもおいしいおかずの話をします。はじめましての方は、唐揚げの衣はカリカリ派か、しっとり派か、ひと言どうぞ。", [["1K", "レモンひと絞りのお祝い", "配信で名前を呼び、「拍手、レモンひと絞り分！」とお祝いします。"], ["5K", "今日のおかずメッセージ", "今月のお礼を、食堂のひと言メモ風に表示名を添えてファミリーに書きます。"], ["10K", "レモン食堂の名札アイコン", "唐揚げとレモンを描いたお品書き風のアイコン。表示名を入れてお渡しします。"], ["20K", "今夜の副菜リクエスト", "好きなおかずを一つ教えてください。配信で、一緒に食べたい副菜を提案します。"], ["30K", "ひと絞りの画像セット", "レモン色か唐揚げ色を選んで、名前入りアイコンと手書き風のお品書き画像を作ります。"], ["40K", "あなたの好きなおかず会議", "好きなおかず二品をもとに献立を考え、配信で名前を呼んでお礼を伝えます。"], ["48K", "ひと絞り食堂の主役席", "選んだ料理で約5分の献立会議を。お礼に名前入りアイコンとお品書きカード画像もお渡しします。"]]],
  ["kohaku.", "こはくです。休日は開店したばかりの喫茶店へ。ピアノの曲に混じる、カップを置く音が好きです。後ろに列ができると焦るので、席でゆっくり注文できる店に通っています。頼むのは今日も厚切りトースト。\n\n包装紙で本のカバーを折るのが得意です。配信で耳に残った曲名は付箋に書いて、折り返しへ。久しぶりに本を開くと、物語より先にあの晩の歌が浮かびます。\n\nある朝、本を忘れたら店主が「今日はお持ちじゃないんですね」。窓辺で読んでいたのを覚えてくれていたみたいです。翌週、本を持って行ったら、トーストを置くときに目が合って、お互い少し笑いました。", "付箋のある喫茶室", "本の好きな場面と、そこに流してみたい曲の話をする喫茶室です。「ここにだけ付箋を貼った」ところから聞けたらうれしいです。今日は聴くだけ、という方は窓側へ。", [["1K", "喫茶室の窓側でお祝い", "配信で名前を呼び、「いつもの窓側、空いています」とお祝いします。"], ["5K", "こはくの一行しおり", "あなたの言葉で覚えているものを一つ選び、お礼と一緒にファミリーに残します。"], ["10K", "付箋柄の名前入りアイコン", "付箋と厚切りトーストをあしらった、表示名入りのアイコンです。"], ["20K", "読書のおともリクエスト", "好みに合わせて、次に読みたい本か読書のおともに聴きたい曲を一つ紹介します。"], ["30K", "選べる喫茶のしおりセット", "好きな色で、名前入りアイコンとひと言を添えたしおり画像を作ります。"], ["40K", "あなた宛ての喫茶朗読", "今月のお礼を喫茶店の短い小話に仕立て、あなたの名前を添えて配信で読みます。"], ["48K", "あなたのお題で喫茶朗読会", "選んだお題で約5分の小話朗読とお礼を。名前入りアイコンと、小話の一節を載せたしおり画像も作ります。"]]],
  ["ぴかまる⚡", "こんぴかー！⚡ ぴかって呼んでね。サンドウィッチマンの、話がかみ合わないまま二人とも真顔で進むコントが好き。早口言葉は一度やって、すぐ見学に回りました。\n\nしりとりで一番に「みかん」と答えて終了。「仕切り直し！」の声に今度は「だいこん」。枠主から「ぴか、拍手係できる？」と聞かれ、誰より早く👏。拍手は「ん」で終わらない！\n\n大喜利では好きな答えを見つけたら、まず「それ好き！」。自分の答えは真顔が浮かぶ文にしたくて悩みます。先に次のお題が来たら、やっぱり👏。", "ぴかっと早押し部", "こんぴかー！⚡ 早押し、しりとり、ときどき大喜利。いきなり答えるのは緊張するなら、好きなボケに👏から。問題より先に押しちゃったら、ぴかと一緒に「もう一回お願いします！」。", [["1K", "こんぴかのお祝い", "名前を呼んで「小さめ落雷！」。配信で勢いよく拍手します。"], ["5K", "一文字だけ変な祝辞", "名前はばっちり、祝辞は一文字だけわざと間違えて、ファミリーにお礼を書きます。"], ["10K", "稲妻の早押しアイコン", "稲妻と早押しボタンを描いた、表示名入りのアイコン画像です。"], ["20K", "クイズ・大喜利のお題リクエスト", "選んでもらったお題で、早押しクイズか大喜利を一問出します。"], ["30K", "拍手係の記念セット", "好きな色の稲妻で、名前入りアイコンと「拍手係」の賞状画像を作ります。"], ["40K", "ぴかの一人二役大喜利", "あなたのお題でぴかが出題も回答も担当します。最後は配信で名前を呼んでお礼を。"], ["48K", "あなた杯・大喜利特番", "選んだお題で約5分の大喜利を。名前入りの優勝賞状画像と早押しアイコンもあります。"]]],
  ["しりゅう_08", "しりゅうです。アニメを二周するときは、脇役を一人決めて観ます。ただ黙っていたように見えた人が、実は何か言いかけたように見えることも。対戦ゲームでは相手の動きに見入って、反応が一拍遅れます。\n\n釣りの日は、初めてアジが三尾釣れた帽子で験担ぎ。坊主の日に魚屋でアジを二尾買ったら、家族に「今日すごいじゃん」。レシートを渡したら「そりゃ大きさも揃うわけだ」。\n\n今は帽子を取るたび「海と魚屋、今日はどっち？」と聞かれます。まず海。釣果ノートには、あの日も正直にゼロと書いてあります。", "夜釣りとアニメ棚", "釣れなかった夜の海も、アニメを見返して気づいた脇役の表情も、話しに来てください。次に観たい作品の話からでも歓迎。結末に触れる前には、ひと声かけましょう。", [["1K", "夜釣りの大物コール", "配信で名前を呼び、「今日の大物、来ました」とお祝いします。"], ["5K", "釣果メモのお礼", "思い出に残ったやり取りを一つ選び、釣果メモ風のお礼にしてファミリーに書きます。"], ["10K", "釣り帽子の記念アイコン", "いつもの釣り帽子を描いた、表示名入りのアイコンを作ります。"], ["20K", "今夜の一話リクエスト", "好きな雰囲気に合うアニメを一作、結末を伏せて紹介します。"], ["30K", "夜の波色アイコンセット", "夜の波の色を選んで、名前入りアイコンと釣果カード画像をお渡しします。"], ["40K", "脇役の見どころトーク", "好きなアニメを一作教えてください。配信で、結末を伏せながら気になる脇役の見どころを話します。"], ["48K", "夜釣りとアニメの主役回", "釣りかアニメを選んで約5分のお礼トーク。名前入りアイコンと釣果図鑑風のカード画像も作ります。"]]],
  ["たいやき＠しっぽ派", "たいやきでも、しっぽでも🐟 商店街の看板を眺めて歩くのが好きです。バスケ観戦ではコートの隅でパスを待つ選手が気になります。たい焼きも、つい端から。\n\n激辛は途中で味が分からなくなるので、辛いもの好きの友だちとは甘味屋で合流。たい焼きを「半分こ」と言われて手を出したら、しっぽの先だけでした。「好きって言ってたでしょ」。うん、胴体も好きです。\n\n今はあんことカスタードを一匹ずつ。同じ袋に入っているので、先にどっちを引くかはひと口目のお楽しみ。次に半分こするときは、私が割ります。", "しっぽから商店街", "散歩で見つけた店や、商店街のおやつの話でひと休み🐟 頭派もしっぽ派も、たい焼きに詰めてみたい具を一つ聞かせてね。おかずみたいなしょっぱい案も待ってます。", [["1K", "しっぽからお祝い", "配信で名前を呼び、「今日の一匹、しっぽからどうぞ」とお祝いします。"], ["5K", "しっぽからお礼便", "あなたらしい一言を一つ選び、名前入りのお礼に添えてファミリーに残します。"], ["10K", "たい焼き袋の名前入りアイコン", "たい焼きの紙袋をイメージした、表示名入りのアイコン画像です。"], ["20K", "たい焼きの具リクエスト", "食べてみたい具を聞いて、配信で架空の新作たい焼きに名前をつけます。"], ["30K", "あんこ色かカスタード色", "あんこ色かカスタード色を選べる、名前入りアイコンとたい焼き柄の壁紙です。"], ["40K", "あなたのお題で商店街トーク", "好きなおやつを聞いて商店街トークを。配信で名前を呼び、今月のお礼を伝えます。"], ["48K", "新作たい焼きのお披露目", "選んだ具で約5分の新作トークとお礼を。名前入りアイコンと手書き風のメニュー画像も作ります。"]]],
  ["つきよみ☾", "つきよみです。「つき」だけでも。夜はひと駅遠回りして、足音が分かるくらいの音量で歌や雑談を聴きます。街灯や看板を頼りに同じ道を戻るのは得意。歩数を競うと好きな場所で止まりにくいので、自分のペースで。\n\n用事が片づかない夜、歌のあとに枠主さんが「みんな、帰ったら寝ようね」。その声に背中を押されて布団に入ったら、翌朝は同じことが少し考えやすくなっていました。\n\n話題に迷うと「そっち、月見える？」。「こっちは曇り」と返ってくる日も、その人が見上げた空を想像します。", "月夜の遠回り", "帰り道や寝る前に、夜の歌と、今日ふと目に留まったものの話を。いちばん覚えている色は何ですか？ 道を歩いている間は聴くだけで。返事は家に着いてからで大丈夫です。", [["1K", "遠回りのおかえりコール", "配信で名前を呼んで「おかえり、今夜も遠回り？」とお祝いします。"], ["5K", "名前入り月夜メッセージ", "今日の空をひと言で描いて、名前入りのお礼と一緒にファミリーに書きます。"], ["10K", "街灯と三日月のアイコン", "街灯と細い月の絵に、表示名を入れたアイコンをお渡しします。"], ["20K", "夜の遠回りリクエスト", "気分や好きな夜景を聞いて、夜道に似合う一曲を配信で紹介します。"], ["30K", "夜空の色を選べるセット", "好きな夜空の色で、名前入りアイコンと月明かりを描いたスマホ用壁紙を作ります。"], ["40K", "歩幅を合わせるお礼朗読", "あなたの好きな夜景を題材にお礼を書き、配信で名前を添えて読みます。"], ["48K", "遠回りの月夜便", "選んだ夜景で約5分の夜道トークとお礼の朗読を。名前入りアイコンと、朗読の一文を載せた壁紙もあります。"]]],
  ["きのぴ。", "きのぴです🍄 作業の合間に枠をのぞきます。急に黙ったら手がふさがってるだけ。手書きの看板は値段を直した跡まで見ます。バレーの点数も手書き派。制限時間つきのパズルだけは、秒数を見ると答えが飛びます。\n\n「おかえり」を「おかわり」と打ってから、枠に行くたび「大盛り？」。私も「漬物つけて」と乗っていたら、初見さんに「おすすめは？」と聞かれて全員黙りました。\n\n次は舞茸の天ぷらって答えます。看板に品名までは書いたけど、値段はまだ空欄。「いくら？」にはもう少し待って。", "おかわり休憩所", "作業の合間に一息🍄 ゲームの進み具合も、送ってから気づいた誤字も、休憩中の話の種です。戻ってきて「おかわり」と打っても、ここなら「おかえり」って返ってきます。", [["1K", "コア達成セーブ音", "配信で名前を呼び、「コア達成、セーブしました！」とお祝いします。"], ["5K", "おかわりの一行お礼", "覚えているコメントを一つ添えて、名前入りのお礼をファミリーに書きます。"], ["10K", "ゲーム風セーブアイコン", "ゲームのセーブ画面風に表示名を入れたアイコン画像です。"], ["20K", "今日のおかわり任務", "選んだ雑談のお題で、配信中に短い「休憩クエスト」を一つやります。"], ["30K", "任務名入りの画像セット", "好きなゲーム風の配色で、名前と任務名入りのアイコン、セーブ伝票の画像を作ります。"], ["40K", "あなた発の休憩ステージ", "選んだお題で配信中にミニ企画を一つ。クリアしたら名前を呼んでお礼を伝えます。"], ["48K", "クリア記念おかわり回", "約5分のゲーム風企画とお礼。名前入りアイコンと、あなたの任務名を入れたクリアカード画像も作ります。"]]],
  ["こうめい＊", "こうめいです。歴史小説は負けた側の考えが気になります。ボードゲームの説明書には、遊んだ日を書いた付箋を一枚。早押しだと、出題者の狙いを考えているうちに先を越されます。\n\n小学生に次の作戦を長々と語っていたら「僕の番だよね。このコマを置けば勝ちだよ」。強がって「それを確認してたんだよ」と言うと「じゃあ僕の番も確認して」。きれいに負けました。\n\nそれ以来、座右の銘は「作戦より先に盤面を」。夕飯とお風呂のどちらが先かの作戦会議も、最近はごはんが冷める前に切り上げます。", "一手先の円卓", "ボードゲームも歴史も、円卓では「自分ならどうする？」から。駒の動かし方を聞くところからでも歓迎します。作戦解説が長引いたら、遠慮なく「そろそろ次の手」と声をかけてください。", [["1K", "円卓にお迎え", "配信で名前を呼び、「本日の作戦会議へようこそ」とお祝いします。"], ["5K", "軍師の一行お礼", "今月の気配りや面白かった一言を一つ挙げ、名前入りのお礼をファミリーに書きます。"], ["10K", "作戦図の名前入りアイコン", "盤面と駒の柄に表示名を入れたアイコンをお渡しします。"], ["20K", "軍師のお題リクエスト", "日常の迷いごとを一つ聞いて、配信で軍師風に作戦を立てます。"], ["30K", "選べる陣営カラーセット", "陣営の色を選べる、名前入りアイコンと作戦図風の記念カード画像です。"], ["40K", "円卓の好プレー表彰", "助けられた場面や心に残った言葉を振り返り、配信であなたの一手をたたえます。"], ["48K", "円卓の作戦会議", "日常の相談か歴史のお題で約5分の作戦会議とお礼を。名前入りアイコンと軍師の感謝状画像も作ります。"]]],
  ["れん_07", "れんです。ライブハウスでは後ろの端が定位置。肩がぶつからないところで、間奏のギターを聴くのが好きです。奥田民生さんの曲でも、歌の合間についギターを追います。中古CD屋で気になった曲名は控えて、帰り道に。冬の開演待ちはホットコーヒーで手を温めます。\n\nある晩、歌い手がマイクを客席へ向けました。前の列から声が広がり、後ろにいた僕までつられて大合唱。客席を見渡していた本人は、歌へ戻るタイミングを逃して照れ笑い。今もその曲を聴くと、あの晩の客席の声が聞こえる気がします。\n\n枠では、挨拶のあとだいたい静か。間奏の話が出ると急にしゃべります。", "ギターが鳴る後列", "ライブ帰りに感想を一つだけ書くなら、どの場面？ 後ろの列にも届いたギターや、客席が急に静かになった瞬間を聞かせてください。家でつい巻き戻す間奏の話も、もちろん大歓迎。", [["1K", "後列まで届くお祝い", "配信で名前を呼び、ライブのMC風に「後ろまで届いてます！」とお祝いします。"], ["5K", "ライブ半券の一行", "ギター談義など今月の思い出を一つ、名前入りのお礼にしてファミリーに残します。"], ["10K", "名前入りライブ半券アイコン", "ギターとライブ半券を描いた、表示名入りのアイコン画像です。"], ["20K", "聴きたい音リクエスト", "好きな楽器を聞いて、一曲選びます。配信では、その楽器を聴いてほしいところも紹介します。"], ["30K", "ライブカラーの記念セット", "好きな差し色で、名前入りアイコンと、おすすめの二曲を載せた半券画像を作ります。"], ["40K", "お名前入りアンコールMC", "選んでくれた音楽のお題を、終演後のMC風に配信でトーク。名前を呼んで今月のお礼も伝えます。"], ["48K", "アンコールのミニトーク", "お好きな選曲テーマで約5分のトークとお礼を。名前入りアイコンとセットリスト画像もお渡しします。"]]],
  ["じに＊", "「それ、どこの？」「どんな味？」。食べ物の話を聞くと質問が二つ出る、じにです＊ 日村勇紀さんがおいしそうに食べていると、つい何か買いに出たくなります。 話題のお店を一日に何軒も回るより、一軒で食べて近所をぶらぶらするほうが好き。寄った場所は地図にピンを立てます。\n\n「絶対また行く」のメモを頼りにたこ焼きを食べに行ったら、メニューは定食だけ。おいしく食べて外へ出たら、角の先からソースの匂い。ピンを立てたのは、たこ焼き屋へ曲がる目印の店でした。\n\n結局たこ焼きも買って、今はピンが二つ。「また行く」は、定食もおいしかったので両方に。", "よりみち地図帳", "帰り道に買ってしまうおやつや、旅の途中で入った店の話を集めています。いつもの注文や、地元でおなじみの食べ方も聞きたいです。店名が出てこなければ、次に何を頼みたいかだけでも＊", [["1K", "寄り道先からお祝い", "配信で名前を呼び、「本日の寄り道、いらっしゃい」とお迎えします。"], ["5K", "地図ピンのお礼メモ", "会話からおいしそうだった一言を拾って、名前とお礼をファミリーに書きます。"], ["10K", "目印つきの名前入りアイコン", "お気に入りのおやつと地図ピンを描いた、表示名入りのアイコンです。"], ["20K", "おやつ会議リクエスト", "甘いものかしょっぱいものかを聞き、寄り道のおともを一つおすすめします。"], ["30K", "寄り道地図の画像セット", "好きなおやつを描いた、名前入りアイコンと地図帳風のスマホ用壁紙を作ります。"], ["40K", "あなたの一品を語る回", "好きなご当地おやつを一つ紹介してもらい、配信でその話をしながら今月のお礼を伝えます。"], ["48K", "商店街の寄り道特番", "好きなおやつで約5分の寄り道トークを。名前入りアイコンと架空の寄り道マップ画像もお渡しします。"]]],
  ["港レター_", "みなとです。港町に泊まったら、朝は焼きたての塩パンを探します。速い曲を聴くとつい歩幅まで大きくなるので、散歩はイヤホンを外して。店のシャッターや波の音で、街の目が覚めるのが分かります。\n\n旅先から自分にはがきを出しました。「明日の朝、港で塩パンを買う」。家に届いたのは、温かい紙袋を抱えたあの朝から数日後。紙の上の自分に「おいしかったよ」と返事をしたくなりました。\n\n次のはがきには「家族にも塩パンを買う」。家まで食べずに持って帰れたら成功です。みなとより。", "海辺のポスト", "「朝七時、踏切の近くでパンの匂い」。そんな一行を集めるポストです。知らない港町でも、いつもの通勤路でも。歩いていて気づいた音や匂いを、覚えていたら時間も添えて聞かせてください。", [["1K", "港からお祝いの声", "配信で名前を呼び、「今日も港に寄ってくれてありがとう」とお祝いします。"], ["5K", "海辺の一行はがき", "思い出に残った話を一つ拾って、名前入りのお礼にしてファミリーに書きます。"], ["10K", "消印の名前入りアイコン", "海辺の消印をあしらった、表示名入りのアイコン画像です。"], ["20K", "はがきの題材リクエスト", "好きな音や匂いを聞き、その情景を添えた短い旅の便りを配信で読みます。"], ["30K", "港色の絵はがきセット", "朝焼けか夕暮れかを選んで、名前入りアイコンと海辺の絵はがき画像を作ります。"], ["40K", "あなた宛ての港レター朗読", "選んだ風景をもとにお礼の便りを書き、名前を添えて配信で読みます。"], ["48K", "海辺のポスト特番", "旅のテーマを選べる約5分の雑談と朗読です。名前入りの消印アイコンと、便りを載せた絵はがき画像も作ります。"]]],
  ["けんし♪", "イントロは分かる、サビも歌える、曲名が出てこない。けんしです♪ 秋のドライブでは車を停めて塩むすび。食べながら帰りの一曲を選びます。登場人物の多い歴史小説は、誰の出番か分からなくなりがちです。\n\nカラオケで珍しく曲名が出てきて入れたら、同じ題名の別の曲。友人が「これ歌える」とマイクを取ったので、横で「僕の歌詞は全部シャンシャンです！」とタンバリンを鳴らしました。\n\n次は友人から「あれ入れてね」。僕が間違えて、友人の十八番が増えました。曲名と一緒に歌手名まで確認して、タンバリンは先に取ります。", "サビから歌う会", "サビから一緒に歌いたくなる曲、ありますか♪ カラオケの十八番も、帰りの車で口ずさむ一曲も大歓迎。合いの手を入れる派も、黙って何度も聴き返す派も、まずは一曲聞かせてください。", [["1K", "シャンシャンでお祝い", "配信で名前を呼び、口タンバリンの「シャンシャン！」でお祝いします。"], ["5K", "十八番のお礼メモ", "教えてくれた音楽の好みを一つ取り上げて、名前入りのお礼をファミリーに書きます。"], ["10K", "タンバリンの名前入りアイコン", "タンバリンと音符の柄に表示名を入れたアイコンです。"], ["20K", "帰りの一曲リクエスト", "ドライブの気分を聞いて、帰り道に似合いそうな一曲を配信で紹介します。"], ["30K", "番組表つき音楽セット", "好きな色で、名前入りアイコンと、二曲を載せたラジオ風の番組表画像を作ります。"], ["40K", "ラジオ風のお礼DJ", "好きなジャンルから二曲を選び、配信でDJ風の曲紹介とお礼を届けます。"], ["48K", "夜ラジオの主役ゲスト", "番組テーマを選べる約5分のラジオ風トークです。名前入りアイコンと記念の番組表画像もお渡しします。"]]],
  ["かんうどん🍜", "「かん」で大丈夫です🍜 いつもの一杯は、かけ、ちくわ天、ねぎ多め。郷土料理の本で知らない具を見つけると、食べに行きたくなります。うどんの写真には、だしと具をひと言ずつ。白い服で食べると、帰るまでしみが気になります。\n\n白シャツにカレーうどんを飛ばした翌週、黒い服で同じ店へ。「前と同じので？」とうなずき、かけを待っていたらカレーうどんが。「今日は黒でよかったね」。店主は前の注文も、僕の服も覚えてました。\n\n写真のメモに服装欄があるのは、カレーうどんだけ。「次も黒」と書いてます。", "ねぎ多めの席", "かけ、ねぎ多め。うどん一杯で話が尽きない席です🍜 麺の太さ、だしの色、地元の天ぷら。「うちでは卵を落とすよ」のひと言で、明日のお昼が決まるかも。", [["1K", "ねぎ多めでお祝い", "名前を呼んで「ねぎ多めで一杯！」。配信で拍手を送ります。"], ["5K", "店主から本日のひと言", "今日のあなたに合う短いお礼を、店主のひと言としてファミリーに書きます。"], ["10K", "うどん札の名前入りアイコン", "丼とちくわ天を描いた、表示名入りのアイコンを作ります。"], ["20K", "好きな具に合う薬味", "好きなうどんの具を聞いて、合いそうな薬味を配信で一つ提案します。"], ["30K", "のれん色のお品書きセット", "選んだのれんの色で、名前入りアイコンとスマホで見られるお品書き画像を作ります。"], ["40K", "あなた好みの一杯を紹介", "あなた好みのだしと具で一杯考えます。配信では名前を呼んでお礼も伝えます。"], ["48K", "うどん屋の主役メニュー", "好きな具を使った約5分の献立トークとお礼。名前入りアイコンと、考えた一杯を載せたメニュー画像も作ります。"]]],
  ["土星わっか◎", "土星でも、わっかでも◎ 野口聡一さんの宇宙の話を聴くのが好き。数式の多い天文学の本はそっと閉じます。晴れた休日は星の時刻と方角をメモ。流星が来るまで、時計を見ずに三十秒数えます。\n\nある晩、友人と同時に「あっ」「見つけた？」。同じ流星を見たと思っていたら、帰り道に友人が缶を見せて「探してたぶどうジュース、あそこの自販機にあったよ」。次からは「何を？」まで聞きます。\n\nよく話すのは、行けるなら月か深海か。私は月で、窓側希望。着いたら方角をどう書くかは、着いてから考えます。", "土星の窓側席", "今夜、空に何か見えたら窓側へ◎ 「コンビニの上に明るい星があった」も立派な観測報告です。話の続きは月か深海へ。窓の外に何が見えるか、一緒に想像してみませんか。", [["1K", "窓側へお迎え", "名前を呼んで「今夜の窓側、空いてます」と配信でお祝いします。"], ["5K", "星便りでひと言", "今月の思い出を一つ拾って、星便りに見立てたお礼をファミリーに書きます。"], ["10K", "土星の名前入りアイコン", "土星の輪に表示名を入れたアイコン画像をお渡しします。"], ["20K", "空のお題リクエスト", "気になる空の色や見たい天体を教えてください。配信でその話をします。"], ["30K", "選べる星空セット", "土星か月を選べる、名前入りアイコンとスマホ用壁紙のセットです。"], ["40K", "月と深海のお礼ガイド", "月か深海の好きなほうを聞き、配信でその場所を案内するように話してお礼を伝えます。"], ["48K", "月か深海へ出発", "行き先を月か深海から選んで約5分の旅トーク。名前入りアイコンと、架空の旅のしおり画像もお渡しします。"]]],
  ["しろもち。", "毛布に入ってからこんばんは。しろもちです。洗い立ての綿の毛布が好きで、配信もだいたい布団から。「おやすみ」を送る前に寝落ちすると、翌朝いきなり「おはよう」になります。\n\nお正月のお雑煮は「今年もよく食べてよく眠れますように」のひと口から。甘い黒豆は少し苦手で、お餅は大好き。この前は一つ食べたあと、だしからもう二つ。家の人が、子どもの頃の「一つじゃ足りない」を覚えてくれてました。\n\nうれしくて三つ完食。翌朝「今日も三つ？」には即答で「一つでいい」。寝る前までお腹いっぱいでした。", "毛布ときなこの部屋", "毛布の中からでも、きなこ餅を食べながらでも、こんばんは。お雑煮は家ごとに違うから、「うちは丸餅」の一言から話が広がります。眠くなったら、会話の続きはまた明日。", [["1K", "毛布の中から小さな拍手", "配信で名前を呼び、眠気を起こさないくらいの小さな拍手でお祝いします。"], ["5K", "おやすみの一行お礼", "毛布に入ってから読める短いお礼を、名前を添えてファミリーに残します。"], ["10K", "きなこ餅の名前入りアイコン", "きなこ餅と毛布の柄を使った、表示名入りのアイコンです。"], ["20K", "冬のお題リクエスト", "お雑煮や冬の寝支度など、選んでくれたお題を配信で話します。"], ["30K", "毛布柄の記念画像セット", "好きな毛布の色で、名前入りアイコンと、ひと言を添えたスマホ用壁紙を作ります。"], ["40K", "眠る前のお礼トーク", "好きな冬の話題でゆっくり雑談。配信で名前を呼んで、今月のお礼を伝えます。"], ["48K", "毛布の中のお礼会", "選んだお題で約5分の雑談とお礼を。名前入りアイコンと、おやすみの言葉を載せた壁紙も作ります。"]]],
  ["いかいかが？", "いかです🦑 水族館では説明板を読む前に、一匹だけ選んでじっと見ます。長編ミステリーは登場人物が増えると迷子になりますが、水槽なら今日の主役を自分で決められます。\n\nエイに手を振りながら友人に「習ってます、エイ語」。振り返してくれたのは、水槽の向こうの子どもでした。もう一度振ったらお母さんまで参加。その間にエイは奥へ。あの場面の字幕は「エイ語の先生、先に帰る」。\n\n配信では、天気からいつの間にか深海へ話が飛ぶのが好き。そちらの空模様、いかがですか。", "クラゲ前集合", "クラゲ前でひと息、いかがですか🦑 岩陰から顔を出す魚に字幕をつけるなら、何て書きますか？ 生き物の名前はうろ覚えで大丈夫。色や動きだけでも、一緒に考えられます。", [["1K", "クラゲ前へお迎え", "配信で名前を呼び、「クラゲ前でひと息、いかがですか」とお祝いします。"], ["5K", "水槽からの一行お礼", "クラゲやエイのつもりで書いたひと言に名前を添え、ファミリーにお礼を残します。"], ["10K", "水槽プレート画像", "好きな水の生き物を教えてください。表示名入りの水槽解説プレート風カード画像を作ります。"], ["20K", "水槽の字幕リクエスト", "生き物を一つ選んでもらい、そのしぐさに付けたい字幕を配信で読み上げます。"], ["30K", "選べる水槽画像セット", "クラゲとエイから好きなほうを選べます。名前入りアイコンと、水槽のプレート風カード画像を作ります。"], ["40K", "お気に入り二つの水槽ガイド", "好きな生き物を二つ聞いて、水族館のガイド風に紹介。配信で名前を呼んでお礼も伝えます。"], ["48K", "クラゲ前の特別ガイド", "好きな生き物をお題に約5分の水族館風トークを。名前入りアイコンと、字幕を入れたカード画像も作ります。"]]],
  ["ゆづる❄", "こんばんは、ゆづるです❄ 冷えた手で温かいマグを包むと、ようやくひと息。夜はバラードをゆっくり聴きます。倍速だと、歌い出す前の息までせわしなく聞こえて苦手です。\n\n歌枠で感想を何度も打ち直していたら、次の曲が始まりました。やっと送ったのは「さっきの曲、二番の前の息づかいが好きでした」。歌い終えた枠主さんが「あそこ、落ち着こうと思って息を吸ったんだ」。短い一言で、聴いていたところが伝わりました。\n\nその頃、お茶はすっかり冷めていました。今日は一口飲んでから聴きます。", "雪あかりの歌席", "夜の歌を、歌い出す前の小さな息までゆっくり聴く席です❄ 「あの声の入り方が好き」くらいの感想も聞かせてください。言葉が浮かばない夜は、温かい飲み物を片手にどうぞ。", [["1K", "雪あかりの小さな乾杯", "配信で名前を呼んで、温かい飲み物で小さく乾杯します。"], ["5K", "一行のおつかれさま", "今日のあなたに合う「おつかれさま」を一行、ファミリーに書きます。"], ["10K", "雪の名前入りアイコン", "雪あかりとマグカップを描いた、表示名入りのアイコンです。"], ["20K", "夜のバラードリクエスト", "今の気分に合うバラードを一曲選び、好きな息づかいや声の入り方も配信で紹介します。"], ["30K", "便箋と雪色アイコンセット", "雪色か灯り色を選んで、名前入りアイコンと短いお礼を書いた便箋画像を作ります。"], ["40K", "あなた宛てのお礼の手紙", "今月の思い出を短い手紙にして、名前を添えて配信で読みます。"], ["48K", "雪あかりの手紙の時間", "好きな冬の景色をお題に、約5分の雑談と手紙の朗読を。名前入りアイコンと便箋画像もお渡しします。"]]],
  ["じゃっくん☆", "はーい、参戦します！ ルールは今から聞きます。じゃっくんです🙌 対戦ゲームと、人のボケに一行足すのが好き。年末は友だちと遊び納め。翌年も笑いたい一言はメモに残します。\n\n勢いよく攻めるキャラを追って「勝った！」と叫んだら「そっち俺」。画面の端にいた自分は見事に負けてました。以来、「勝った」は自分の色を確かめてから。\n\n休憩では苦手なレーズンクッキーを友だちへ。「おっと、ここでクッキーが移籍です！」。おやつには実況いらないって、知ってます。", "とりあえず参戦部", "冷蔵庫に着いたら実況開始。最後のプリンが消えていたら大喜利です🙌 一人のボケに一個ずつ足す部なので、思いついたところから参戦を。「座布団一枚！」係も空いてます。", [["1K", "種目はあとで、まず拍手", "配信で名前を呼び、「種目はあとで決めます！」とひと足先に拍手します。"], ["5K", "日常の一行表彰", "最近できた小さなことを競技名にして、ファミリーで名前を添えて表彰します。"], ["10K", "日常競技の表彰カード", "表示名と架空の競技名が入った、メダル風の表彰カード画像を作ります。"], ["20K", "実況種目をリクエスト", "選んでくれた日常の出来事を、配信でスポーツ実況風に読み上げます。"], ["30K", "金銀が選べる表彰セット", "金か銀か選べる、名前入りアイコンと競技名入りの表彰状画像です。"], ["40K", "あなたの二種目実況", "日常の出来事を二つ、配信で実況します。最後は名前を呼んで表彰を。"], ["48K", "決勝特番の主役選手", "選んだお題で約5分の実況と表彰を。名前入りアイコンと「大会結果」のカード画像も作ります。"]]],
  ["さなだんご。", "さなです。だんごでも反応します。休みの朝はパン屋さんへ。平野レミさんの料理番組を観ると台所に立ちたくなります。おやつならバターの香るクッキー。シナモンが強いお菓子は、香りだけでお腹いっぱい。\n\nクッキーを焼きすぎて「端がちょっと濃いよ」と友だちに渡すと、空のお皿の写真と「次は倍で」が届きました。張り切って二回に分けて焼いたら、二回目だけまた濃い色に。次は袋を分けて「まず一枚、味見しよ」。\n\n今は天板を入れるたびにタイマーをセット。渡す分とは別に、私の味見の一枚もしっかり焼きます。", "焼きたてひと皿", "パン屋の新作も、家で焼いたおやつも、味見の感想を持ち寄る席です。いつもの味に塩をひとつまみ、なんて話も聞きたいです。焼き色の濃い端っこが好きな人、いらっしゃい。", [["1K", "焼きたての味見係へ", "配信で名前を呼び、「今日の味見係さん、ありがとう」とお祝いします。"], ["5K", "ひと皿のお礼便り", "覚えているやり取りを一つ添えて、ファミリーにあなた宛てのお礼を書きます。"], ["10K", "パン袋の名前入りアイコン", "パン袋のラベルをイメージした、表示名入りのアイコン画像です。"], ["20K", "隠し味リクエスト", "選んだおやつに、試してみたい隠し味を配信で一つ提案します。"], ["30K", "焼き菓子のラベルセット", "パンかクッキーの柄を選んで、名前入りアイコンとオリジナルのラベル画像を作ります。"], ["40K", "焼きたて感想トーク", "好きなおやつの名前と食感を聞いて、配信で味見トークをしながら今月のお礼を伝えます。"], ["48K", "あなたの名物おやつ会", "好きな味をお題に約5分のおやつ談義を。お礼に、名前入りアイコンと架空のおやつのラベル画像も作ります。"]]],
  ["ゆずっこ。", "ゆずです〜🍊 夕方は洗濯物をたたむ手を止めて、枠で「おつかれ〜」。家事が済んだら暮らしのエッセイを一篇。季節限定のおやつのラベルは、日付を書いてノートに貼ります。\n\n甘いゆず味を探して三軒目、「ゆず」の大きな文字を見て買ったら、ゆず胡椒味。辛いのが苦手で水を飲んでいる横で、家族が甘いほうを開けました。同じ店で、表示を最後まで読んで選んだそうです。\n\nその日のノートには二枚並べて「探した味」「探してない味」。家族には辛いほうも好評で「今度はわざと買ってね」と頼まれました。", "ゆず色おつかれ会", "家事の合間に聴く歌と、スーパーで見つけたおやつの話🍊 入ってすぐは「おつかれ〜」だけで大丈夫。洗濯物があと一枚でも、好きな曲が来たらそっちを先に聴こ。", [["1K", "夕方のおつかれ拍手", "配信で名前を呼んで「片付けはあとで。まず拍手！」とお祝いします。"], ["5K", "夕方の一行メッセージ", "夕方のひと休みに読めるお礼のひと言を、ファミリーに投稿します。"], ["10K", "ゆず色の名前入りアイコン", "柑橘と夕焼けを描いた、表示名入りのアイコン画像です。"], ["20K", "ひと息の選曲リクエスト", "散歩に出るときか、家事をひと休みするときかを聞き、配信で似合う曲を一つ紹介します。"], ["30K", "柑橘色の待ち受けセット", "ゆず色かみかん色で、名前入りアイコンとスマホ用壁紙を作ります。"], ["40K", "あなた宛て夕方ニュース", "今月の頑張りを夕方のニュース風に紹介し、配信で名前を呼んでお礼を伝えます。"], ["48K", "おつかれ特番の主役", "お好きな話題で約5分のおつかれ特番を。名前入りアイコンと「本日の家事終了」の画像もお渡しします。"]]],
  ["のぶにゃがฅ", "のぶ、または、にゃが。夜の枠にしれっとおりますฅ 武将の手紙は最後の頼みごとまで読む派です。家の置き手紙にも「猫殿におやつは進呈済み。重ねて出されぬよう」。\n\n武将の番組を観るときは太鼓の音が苦手で、音量を下げます。大事な台詞で猫殿がテレビを横切ったので巻き戻したら、同じところでまたお出まし。三度目には、家族そろって台詞より猫殿を待っていました。\n\n人がテレビの前を通ると「参戦ですか？」。猫殿には黙って席を譲ります。", "ねこ殿の書状部屋", "武将の書状の一言と、家でいちばん偉そうに座る猫の話を持ち寄る、夜更けの評定です。「うちの猫殿は箱から動きません」からご参加を。猫の話に入ると、たいてい評定は延びますฅ", [["1K", "猫殿と座布団でお祝い", "配信で名前を呼び、「座布団は猫殿と半分ずつで」とお祝いします。"], ["5K", "猫殿の一行書状", "猫殿に代わって、ひと言のお礼を名前入りでファミリーにしたためます。"], ["10K", "肉球の花押アイコン", "肉球を花押に見立てた、表示名入りのアイコン画像を作ります。"], ["20K", "猫殿が授ける二つ名", "好きな猫のしぐさを聞いて、配信で武将風の二つ名を一つ考えます。"], ["30K", "選べる家紋の記念セット", "好きな色で、名前と二つ名入りの家紋アイコンと、猫殿の書状画像を作ります。"], ["40K", "猫殿のごほうび評定", "今月のうれしかったことを配信の評定で取り上げ、名前を呼んで猫殿に代わりお礼を伝えます。"], ["48K", "一城任命のお礼会", "選んだ城名を約5分のお礼企画で発表。名前入りの家紋アイコンと任命状画像もお渡しします。"]]],
  ["ぜうす_", "ぜうす。呼び捨てでどうぞ。コーヒーは深煎り。映画館が暗くなって、客席のざわめきが消える瞬間が好きです。半券の裏には、もう一度観たい場面を一つ。登場人物の気持ちを一つに決める解説は、読みながらつい別の可能性を考えます。\n\n帰りの電車で友人と「あの人、最後に何を考えてたんだろう」。降りる間際に名前が出て、別々の人物の話だと判明。次は名前から確認したのに、今度は同じ人物の別々の場面を語ってました。\n\n座右の銘は「まず、誰の話か」。最近は「どの場面か」も足しました。", "深煎りの上映後", "深煎りを一杯いれて、映画の気になる場面の話を。「ほっとした顔」と「何か隠してる顔」、同じ表情が違って見えたら、その理由も聞きたいです。結末の話は、まだ観ていない人がいないか聞いてから。", [["1K", "エンドロールでお祝い", "配信で名前を呼び、「今日もエンドロールまでありがとう」とお祝いします。"], ["5K", "深煎りの一行お礼", "覚えている感想を一つ取り上げ、ファミリーに名前入りのお礼を書きます。"], ["10K", "映画半券の名前入りアイコン", "半券とコーヒーの絵に表示名を入れた、映画館風のアイコンです。"], ["20K", "好みで選ぶ映画一本", "好みのジャンルを聞いて、結末に触れず、おすすめの映画を配信で一作紹介します。"], ["30K", "選べるエンドカードセット", "好きな差し色で、名前入り半券アイコンとエンドカード風のスマホ用壁紙を作ります。"], ["40K", "お名前入りの編集会議", "選んだ場面についてネタバレを避けて二通りの見方を話し、配信で名前を呼んでお礼を伝えます。"], ["48K", "二重エンドの上映後トーク", "お好きな話題で約5分の上映後トークを。名前入りアイコンと、二つの題名を載せたタイトル画像も作ります。"]]],
  ["りさっち＊", "りさっちです☺️ カフェめぐりが好き。気に入ったカップは飲み干してから底の印まで見ます。飲む前に写真を撮る習慣は三日で終了。三日目に撮れたのはレシートでした。\n\nドラマの最終回前は、推しの幸せを願っていつもの店で一杯。同じ推しだと喜んでいたら、友だちが「でも同僚だったら困るよね」。私は味方するつもりで場面を一つずつ振り返っていたら、コーヒーがすっかり冷めました。\n\n最終回を観ても、二人とも推しは変わらず。でもあの人が本当に同じ職場に来たら、私は隣の席だけは避けるかも。", "いつものカフェ席", "ドラマの感想と、最近気になるリップの色を話すカフェ席です☺️ 「推しにはこの色が似合いそう」から両方の話へ。ドラマを観ていない日は、手元のカップの柄からどうぞ。", [["1K", "いつもの席でお祝い", "配信で名前を呼んで「いつもの席、空けときました」とお祝いします。"], ["5K", "カップに一言メッセージ", "今日の気分に似合うひと言を、名前入りのお礼としてファミリーに書きます。"], ["10K", "カップの注文シール風アイコン", "カップの注文シールに表示名を入れた、カフェ風のアイコン画像です。"], ["20K", "カフェの話題リクエスト", "ドラマかリップかを選んで、配信であなたの好みを聞かせてください。そこからおしゃべりします。"], ["30K", "好きな色の限定カップセット", "好きなリップの色を差し色に、名前入りアイコンとカップ柄の壁紙を作ります。"], ["40K", "あなたの一杯とお礼トーク", "好みを聞いて架空のドリンクを考えます。配信で紹介するときに名前を呼んでお礼も。"], ["48K", "カフェの主役コーナー", "好きな話題で約5分のカフェ風トーク。お礼に名前入りアイコンと限定メニュー画像も作ります。"]]],
  ["ちょぱ丸_", "コンビニまで往復十分、寄り道込みで三十分。ちょぱ丸です。卓球では相手のラケットを見すぎて、球を見送ることがあります。\n\n前に寄った商店街の店を「猫がいるところ」と案内したら、店の前を通り過ぎました。地図を頼りに引き返して買い物を済ませると、店先に猫が。「ピンポーン。目印が、ただいま出勤しました」。友だちは「赤いのれんは開店から仕事してたけどね」。次はのれんを目印にします。\n\nアニメでは振り向く瞬間に鳴る低い音が好き。酸っぱい粉のグミは苦手です。砂糖だと思ってかじった一粒は、効果音なしでも忘れられません。", "寄り道アニメ部", "「あの音がしてから振り向いたよね」みたいな、アニメの小さな発見を持ち寄る部です。推しが多い人は「今日の一人」から。商店街のおやつに話が飛んだら、その寄り道もお付き合いください。", [["1K", "寄り道先からピンポーン", "配信で名前を呼び、「ピンポーン、寄り道先でお迎えです」とお祝いします。"], ["5K", "猫は不定休メッセージ", "「目印の猫は不定休」と書き添えた、あなた宛てのお礼をファミリーに投稿します。"], ["10K", "のれんの名前入り待ち受け", "赤いのれんと猫を描いた、表示名入りのスマホ用壁紙を作ります。"], ["20K", "推しの見どころリクエスト", "好きな作品を教えてください。配信で、好きな場面か小さな演出を一つ取り上げます。"], ["30K", "寄り道番組表の画像セット", "好きな色に合わせて、名前入りアイコンと寄り道番組表風のカード画像を作ります。"], ["40K", "あなたのアニメ外伝トーク", "推し作品か町のおやつを選んで、配信で外伝トーク。名前を呼び、今月のお礼も伝えます。"], ["48K", "寄り道特番の主役", "選んでくれたお題で約5分のアニメ風雑談とお礼を。名前入りアイコンと寄り道マップ画像もお渡しします。"]]],
  ["敬語でラスボス🎮", "ようこそ。ラスボスとお呼びくださいませ🎮 地図の空白が気になるので、未確認の扉が一つあれば引き返します。回復薬は決戦まで温存です。\n\n急かされるのは少々苦手。同行者に「そろそろ決戦へ」と言われて近道を選んだら、同じ崖から二度落ちました。ボス戦は二分で終了。回復薬は一つも減りませんでした。\n\n得意なのは普通の注意書きを決戦の口上に変えること。「足元をご確認くださいませ」。低い声でお伝えします。同じ崖から二度落ちた者からのお願いです。", "決戦前の休憩室", "攻略の手を休めて、ボス戦の効果音や、なかなか進めなかった場面を話す部屋でございます。ゲームの難所も、開かないジャムのふたも持ち込み可。わたくしが考え込んだら、先にお茶をどうぞ。", [["1K", "ご来城のお祝い", "配信でお名前を呼び、「本日もご来城ありがとうございます」とお迎えいたします。"], ["5K", "ラスボスから一行のお礼", "少々丁寧すぎるお礼を、お名前とともにファミリーに残します。"], ["10K", "名前入り勇者アイコン", "紋章と橋をあしらった、表示名入りの勇者風アイコンです。"], ["20K", "勇者の称号リクエスト", "最近できたことを教えてください。配信で勇者の称号を一つお授けします。"], ["30K", "選べる王国の画像セット", "紋章の色を選んで、名前入りアイコンと称号入りの達成証画像を作ります。"], ["40K", "決戦前のお礼寸劇", "選んだ勇者の決めゼリフで、配信中に短い一人二役を披露します。終わりに感謝をお伝えします。"], ["48K", "あなたの王国の授与式", "選んだお題で約5分のゲーム風トークと称号発表。名前入りアイコンと感謝状画像もお渡しします。"]]],
  ["simba_", "シンバです。休日は行き先を一つ決めて車を出します。運転中は静かな曲を。にぎやかなビッグバンドだと落ち着きません。休憩は景色とたまごサンドがあれば十分。\n\n海へ行った日、空いていたベンチに座ったら、見えるのは駐車場。海は背もたれの向こうでした。友だちと笑って、海と愛車を一枚ずつ。帰って友だちの声がよみがえったのは、愛車の写真のほうでした。\n\nいい休憩も旅のうち。動物園でもペンギンが水を横切るのを待っているうち、次の到着予定がずれます。", "停車中の見晴らし席", "車を降りてようやく見えた景色や、水槽の前で予定より長居した話を持ち寄る席です。遠出をしていない日は、いつもの道で目に留まったものを一つ。たまごサンド片手に聞いています。", [["1K", "見晴らしのいい席で拍手", "配信で名前を呼び、「景色がいいので、ここで拍手」とお祝いします。"], ["5K", "車窓の一行お礼", "今月の会話を一つ思い出しながら、ファミリーに名前入りの短い便りを書きます。"], ["10K", "見晴らしの名前入りアイコン", "ペンギンや海辺の絵を使った、表示名入りアイコンを作ります。"], ["20K", "寄り道選びリクエスト", "好きな景色を教えてください。配信で立ち寄ってみたい場所を一つ紹介します。"], ["30K", "選べる風景画像セット", "海か動物園を選べる、名前入りアイコンとスマホ用壁紙のセットです。"], ["40K", "あなたとの休憩トーク", "選んだ景色をきっかけにドライブの話をし、配信で名前を呼んでお礼を伝えます。"], ["48K", "見晴らしの寄り道特番", "好きな寄り道を聞いて、約5分のドライブトークを。お礼に名前入りアイコンと風景カード画像をお渡しします。"]]],
  ["kuroha_", "夜。作業。イヤホン。くろはです。白くてまぶしい照明が苦手で、机の手元だけ照らしています。好きなバタートーストも、配信に聞き入るとすぐ冷めます。\n\n昔のゲームを開いたら、最後の城の手前だと思っていたデータが最初の村。懐かしくなって、村を一周してそこでセーブ。「好きな場所なら、戻ったぶんも進んだうち」です。\n\nゲームの曲は、流れる場所と一緒にメモ。あの夜は「最初の村。宿を出てすぐ」。曲名を調べたのは三晩目。それまでは毎晩、村を一周していました。", "夜更けのセーブ地点", "手を動かしながら聴くゲームの曲や、セーブしておきたい景色の話を。「雨がやまない村」「宿屋の明かり」みたいに、場所だけでも聞かせてください。作業の区切りまでは耳だけ参加で。", [["1K", "夜更けのコアセーブ", "名前を呼んで「今日のコア、保存しました」。配信でコア達成をお祝いします。"], ["5K", "セーブ地点の一行お礼", "思い出に残った作業やゲームの話を一つ添えて、ファミリーにお礼を書きます。"], ["10K", "セーブスロットの名前入りアイコン", "セーブスロットに表示名を入れたデザインのアイコンです。"], ["20K", "作業BGMリクエスト", "好きなゲームの風景を聞き、作業の合間に聴きたい曲を一つ配信で紹介します。"], ["30K", "選べるセーブ地点セット", "夜の港か雨の村を選べる、名前入りアイコンとゲーム風の壁紙です。"], ["40K", "あなたのゲーム散歩", "好きなゲームの風景を二つ聞き、配信でその場所の話と名前入りのお礼を届けます。"], ["48K", "夜更けの最終セーブ会", "選んだ風景で約5分のゲーム雑談とお礼を。名前入りアイコンと、好きな風景を描いたセーブカード画像も作ります。"]]],
  ["まさむね_", "休日は城下町の脇道へ。まさむねです。電車では三味線の曲をよく聴きます。人混みを急いで抜けるのは苦手。説明板の前で足を止めて、その町の人から思い出を一つ聞けたらうれしいです。\n\n城跡の急坂で、近所の方が「子どもの頃、ここを滑って下りましたよ」。「途中で止まれました？」と聞くと「止まれないから下まで行くんです」。帰りは私もその道を、一歩ずつ。\n\n野球観戦の帰りも、点が入る直前の静けさや隣の人の声をよく覚えています。寄り道帳には、あの坂の「下まで行くんです」も書いてあります。", "城下町の寄り道帳", "城下町の路地から球場への近道まで、足を止めた場所の話を集めています。地名はうろ覚えで大丈夫。「コロッケの匂いがした角」と聞くだけで、どんな道か想像できます。", [["1K", "城下町にお迎え", "配信で名前を呼び、「ご城下へようこそ」とお祝いします。"], ["5K", "史跡札風のひと言", "今月の印象に残った一言を、史跡札に見立てて紹介。名前とお礼をファミリーに書きます。"], ["10K", "城下町の名前入りアイコン", "門と町並みを描いた、表示名入りのアイコンをお渡しします。"], ["20K", "曲がり角リクエスト", "好きな街の景色を聞き、歩いて寄ってみたい場所を一つ配信で話します。"], ["30K", "選べる町並みセット", "路地か球場への道を選んで、名前入りアイコンと寄り道帳風のカード画像を作ります。"], ["40K", "あなた宛て城下町案内", "好きな寄り道を二つ聞いて、配信で街歩きの案内風に話しながらお礼を伝えます。"], ["48K", "城下町紀行の主役", "お題を選べる約5分の街歩きトーク。名前入りアイコンと、架空の名物看板を描いたカード画像もお渡しします。"]]],
  ["路面ベル♪", "まもなく、商店街のパン屋さんの前です。ベルと呼んでください♪ 降りた電停と、車窓から見つけた店をノートに記録。低音の強い曲は少し苦手で、電停ではイヤホンを外して、ベルや街の音を聞きます。\n\n雨の日、傘を忘れてあじさいを眺めていたら、近くの方が傘を少し傾けてくれました。同じ電車に乗って、私が先に降りると窓越しに会釈。ノートに書いた「傘を半分」を読むと、花の色より先にその会釈を思い出します。\n\nお目当てのパンが売り切れたら「続きは次回」。次回に持ち越した旅は、だいたいパン屋です。", "ベル待ちの電停", "車窓で見かけた看板や、つい降りたくなる電停について話す待合席です♪ 路面電車に乗ったことがなければ、「窓からこの店が見えたら降りたい」から。ベルが鳴るまで想像の旅を。", [["1K", "ベルを鳴らしてお祝い", "配信で名前を呼び、「ご乗車ありがとうございます」とお迎えします。"], ["5K", "寄り道きっぷのお礼", "寄り道先を一つ選び、あなたの名前を添えたお礼をファミリーに載せます。"], ["10K", "名前入り電停アイコン", "路面電車と電停の看板をあしらった、表示名入りのアイコン画像です。"], ["20K", "気になる電停リクエスト", "好きな風景を聞いて、そこで降りてみたくなる実在の電停を配信で一つ紹介します。"], ["30K", "選べる一日乗車券セット", "電車の色を選んで、名前入りアイコンと架空の一日乗車券画像を作ります。"], ["40K", "お名前入り車内放送", "好きな景色を車窓に見立て、配信で車内放送風のお祝いとお礼を伝えます。"], ["48K", "架空路線の主役便", "選んだ景色と電停名で約5分の車内放送風トーク。名前入りアイコンと、あなたの電停を載せた路線図画像も作ります。"]]],
  ["ねずち。", "すみっこ、空いてますか。ねずちです🐭 背中が壁につく席とチーズが好き。似た袋のわさび味を買った日は、水のありがたみを知りました。ボウリングでは端に残った一本を倒せるとうれしいです。\n\n配信で「寝る前についゲームする」に「今のわかる」と打ったら、話題はとっくに「実家でヤギを飼ってた」へ。「うちは金魚だけです」と訂正して、その晩は金魚が主役になりました。\n\n廊下の足音なら家族を聞き分けられます。話題が変わるときも、足音で分かれば助かるんですけどね。", "すみっこチーズ席", "壁ぎわに一席、空いてます🐭 アニメの好きな場面や、ゲームで迷子になった話をどうぞ。コメントが遅れたら「さっきの話だけど」から。チーズをひとかけ食べる間くらいなら、覚えています。", [["1K", "すみっこから小さな拍手", "配信で名前を呼び、チーズひとかけぶんの小さな拍手でお祝いします。"], ["5K", "壁ぎわの一行席札", "表示名と「チーズ持ち込み可」を添えた、席札風のお礼をファミリーに書きます。"], ["10K", "チーズの名前入りアイコン", "チーズとねずみの柄に、表示名を入れたアイコン画像です。"], ["20K", "すみっこの話題リクエスト", "アニメかゲームのお題を一つ選んで、その話を配信でゆっくり広げます。"], ["30K", "選べるすみっこ画像セット", "チーズの色を選べる、名前入りアイコンと席札風の壁紙です。"], ["40K", "チーズ通信のお礼ニュース", "最近のうれしい出来事を聞き、名前を添えて配信の短いニュースにします。"], ["48K", "すみっこニュースの主役", "選んだお題で約5分のニュース風トークとお礼。名前入りアイコンと新聞風のカード画像もお渡しします。"]]],
  ["いなりまる。", "晩ごはんを食べながら明日の献立を考えてます。「いなり」でどうぞ。料理エッセイでは、誰とどんな日に食べたかが心に残ります。脱出ゲームはヒントを読み込むうちに探し物を忘れがち。\n\n食後は冷蔵庫を開けて、先に使いたい食材を一つメモ。「迷ったら、まずだし」。浮かばなければ、うどんにおいなりさんを添えます。\n\nお弁当に一つだけ裏返ったおいなりさん。目印かと思ってかじると、中には苦手な梅干しが丸ごと一つ。家族の「当たりを入れたんだよ」に、私の苦手なものも覚えておいて、と頼みました。以来、裏返った一つは最後まで保留です。", "いなりと明日の献立", "今日の晩ごはんから、明日の献立を考える席です。「ねぎが少し余ったよ」から、一緒にあと一品。レシピの話が「それ、誰と食べた？」に移ったら、その話も聞かせてください。", [["1K", "おいなり一つ追加でお祝い", "配信で名前を呼び、「おいなり一つ追加です」とお祝いします。"], ["5K", "献立メモのお礼", "今月のごはんの話を一つ思い出し、名前入りのお礼をファミリーに書きます。"], ["10K", "おいなり柄の名前入りアイコン", "おいなりさんと湯気を描いた、表示名入りのアイコンをお渡しします。"], ["20K", "冷蔵庫の一品リクエスト", "冷蔵庫で余っている食材を教えてください。配信で、作れそうな副菜を一つ提案します。"], ["30K", "選べる献立カードセット", "うどんかおいなり柄の名前入りアイコンと、ひと言を添えた献立カード画像を作ります。"], ["40K", "食材二つの献立相談", "家にある食材を二つ聞き、一食分の組み合わせを配信で考え、お礼も伝えます。"], ["48K", "台所特番の主役", "好きな料理のお題で約5分の献立相談とお礼を。名前入りアイコンと、提案をまとめた献立画像も作ります。"]]],

const icons = ["01-rui_03.png", "02-初見じょうれん。.png", "03-あずき＊.png", "04-おちゃまる🍵.png", "05-ぼると⚡.png", "06-たっぷりん🍮.png", "07-mira☾.png", "08-あてな°.png", "09-からあげレモン🍋.png", "10-kohaku..png", "11-ぴかまる⚡.png", "12-しりゅう_08.png", "13-たいやき＠しっぽ派.png", "14-つきよみ☾.png", "15-きのぴ。.png", "16-こうめい＊.png", "17-れん_07.png", "18-じに＊.png", "19-港レター_.png", "20-けんし♪.png", "21-かんうどん🍜.png", "22-土星わっか◎.png", "23-しろもち。.png", "24-いかいかが.png", "25-ゆづる❄.png", "26-じゃっくん☆.png", "27-さなだんご。.png", "28-ゆずっこ。.png", "29-のぶにゃがฅ.png", "30-ぜうす_.png", "31-りさっち＊.png", "32-ちょぱ丸_.png", "33-敬語でラスボス🎮.png", "34-simba_.png", "35-kuroha_.png", "36-まさむね_.png", "37-路面ベル♪.png", "38-ねずち。.png", "39-いなりまる。.png", "40-はんこびより。.png"];
const iconDialog = document.getElementById('icon-dialog');
const iconTitle = document.getElementById('icon-title');
const iconPreview = document.getElementById('icon-preview');
const iconDownload = document.getElementById('icon-download');

document.getElementById('icon-close').addEventListener('click', () => iconDialog.close());

function iconButton(name, index) {
  const filename = icons[index];
  const number = String(index + 1).padStart(2, '0');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'icon-button';
  button.setAttribute('aria-label', name + 'のアイコンを開く');
  const image = document.createElement('img');
  image.alt = '';
  image.loading = 'lazy';
  image.src = './thumbnails/' + number + '.webp';
  button.append(image);
  button.addEventListener('click', () => {
    const url = './icons/' + number + '.png';
    iconTitle.textContent = name + 'のアイコン';
    iconPreview.alt = iconTitle.textContent;
    iconPreview.src = url;
    iconDownload.href = url;
    iconDownload.download = filename;
    iconDialog.showModal();
  });
  return button;
}

const list = document.getElementById('names');
const editDialog = document.getElementById('edit-dialog');
const editName = document.getElementById('edit-name');
const editProfile = document.getElementById('edit-profile');
const editError = document.getElementById('edit-error');
let editing;
const editKey = index => 'pococha-profile-copy:profile:v1:' + icons[index].slice(0, 2);

function loadEntry(index) {
  try {
    const saved = JSON.parse(localStorage.getItem(editKey(index)));
    if (typeof saved?.name === 'string' && saved.name.trim() && typeof saved.profile === 'string') {
      return [saved.name, saved.profile];
    }
  } catch {}
  return entries[index];
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = editName.value.trim();
  const profile = editProfile.value;
  if (!name) {
    editError.textContent = '名前を入力してください。';
    editName.focus();
    return;
  }
  const {index, row, original} = editing;
  try {
    const latest = loadEntry(index);
    if (latest[0] !== original[0] || latest[1] !== original[1]) {
      editError.textContent = '別のタブでこのプロフィールが更新されました。入力内容をコピーしてからページを再読み込みし、もう一度編集してください。';
      return;
    }
    localStorage.setItem(editKey(index), JSON.stringify({name, profile}));
  } catch {
    editError.textContent = '変更を保存できませんでした。このブラウザーでサイトデータの保存が許可されているか確認してください。';
    return;
  }
  editDialog.close();
  const updated = buildRow(index);
  const previousPanels = row.querySelectorAll('details');
  updated.querySelectorAll('details').forEach((panel, panelIndex) => {
    panel.open = previousPanels[panelIndex].open;
  });
  row.replaceWith(updated);
  updated.querySelector('.edit-button').focus({preventScroll:true});
  updated.querySelector('.copy-status').textContent = '変更を保存しました';
});

const segmenter = typeof Intl.Segmenter === 'function'
  ? new Intl.Segmenter('ja', {granularity: 'grapheme'})
  : null;

function copyButton(label, name, target, {buttonText = label + 'をコピー', copyText} = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = buttonText;
  button.setAttribute('aria-label', name + 'の' + label + 'をコピー');
  button.addEventListener('click', async () => {
    const value = copyText ?? target.textContent;
    const feedback = button.closest('li').querySelector('.copy-status');
    feedback.textContent = '';
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const field = document.createElement('textarea');
      field.value = value;
      field.readOnly = true;
      field.setAttribute('aria-label', label);
      field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      const manualHint = label + 'を選択しました。長押しするか、メニューから「コピー」を選んでください。';
      if (!copied && copyText !== undefined) {
        field.removeAttribute('style');
        field.className = 'family-copy-field';
        button.closest('.actions').after(field);
        field.focus();
        field.setSelectionRange(0, value.length);
        field.addEventListener('blur', () => field.remove(), {once:true});
        feedback.textContent = manualHint;
        return;
      }
      field.remove();
      button.focus({preventScroll:true});
      if (!copied) {
        const details = target.closest('details');
        if (details) details.open = true;
        const range = document.createRange();
        range.selectNodeContents(target);
        target.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = manualHint;
        return;
      }
    }
    feedback.textContent = label + 'をコピーしました';
  });
  return button;
}

function buildCorePerkTable(name, perks) {
  const table = document.createElement('table');
  table.className = 'core-perks';
  table.createCaption().textContent = 'コア特典';
  const rows = table.createTBody();

  for (const [tier, title, description] of perks) {
    const row = rows.insertRow();
    const level = document.createElement('th');
    level.scope = 'row';
    level.textContent = tier;
    row.append(level);

    const perk = document.createElement('p');
    perk.className = 'perk-text';
    perk.tabIndex = -1;
    const heading = document.createElement('strong');
    heading.textContent = title;
    perk.append(heading, '\n' + description);
    row.insertCell().append(perk);

    const controls = row.insertCell();
    controls.className = 'perk-controls';
    controls.append(copyButton(tier + 'の特典', name, perk, {buttonText:'コピー'}));
  }
  return table;
}

function buildFamilyDetails(name, familyName, familyDescription, perks) {
  const details = document.createElement('details');
  details.className = 'family';
  const summary = document.createElement('summary');
  summary.textContent = 'ファミリー紹介を見る';
  const fields = document.createElement('dl');
  fields.className = 'family-fields';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const nameLabel = document.createElement('dt');
  nameLabel.textContent = 'ファミリー名';
  const nameValue = document.createElement('dd');
  nameValue.className = 'family-value';
  nameValue.tabIndex = -1;
  nameValue.textContent = familyName;

  const descriptionLabel = document.createElement('dt');
  descriptionLabel.textContent = '紹介文';
  const description = document.createElement('dd');
  description.className = 'family-value';
  const intro = document.createElement('p');
  intro.className = 'family-intro';
  intro.textContent = familyDescription;
  description.append(intro, buildCorePerkTable(name, perks));

  const copyText = [
    familyDescription, '', '【コア特典】',
    ...perks.map(([tier, title, detail]) => tier + ' ' + title + '｜' + detail)
  ].join('\n');
  actions.append(
    copyButton('ファミリー名', name, nameValue),
    copyButton('紹介文と特典', name, description, {copyText})
  );

  fields.append(nameLabel, nameValue, descriptionLabel, description);
  details.append(summary, actions, fields);
  return details;
}

function buildRow(index) {
  const [name, profile] = loadEntry(index);
  const [, , familyName, familyDescription, perks] = entries[index];
  const row = document.createElement('li');
  const title = document.createElement('h2');
  const nickname = document.createElement('span');
  nickname.className = 'nickname';
  nickname.tabIndex = -1;
  nickname.textContent = name;
  title.append(String(index + 1).padStart(2, '0') + '　', nickname);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const count = segmenter ? [...segmenter.segment(profile)].length : [...profile].length;
  summary.textContent = 'プロフィールを見る（' + count + '文字）';
  const body = document.createElement('p');
  body.className = 'profile';
  body.tabIndex = -1;
  body.textContent = profile;
  details.append(summary, body);
  actions.append(copyButton('名前', name, nickname), copyButton('本文', name, body));
  const header = document.createElement('div');
  header.className = 'card-header';
  header.append(iconButton(name, index), title);
  const feedback = document.createElement('p');
  feedback.className = 'copy-status';
  feedback.setAttribute('role', 'status');
  const edit = document.createElement('button');
  edit.type = 'button';
  edit.className = 'edit-button';
  edit.textContent = '編集';
  edit.setAttribute('aria-label', name + 'のプロフィールを編集');
  edit.addEventListener('click', () => {
    const original = loadEntry(index);
    editing = {index, row, original};
    [editName.value, editProfile.value] = original;
    editError.textContent = '';
    editDialog.showModal();
  });
  row.append(header, actions, feedback, details, buildFamilyDetails(name, familyName, familyDescription, perks), edit);
  return row;
}

entries.forEach((_, index) => list.append(buildRow(index)));
</script>
